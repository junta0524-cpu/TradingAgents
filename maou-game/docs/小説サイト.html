<script type="application/json" id="data">{"groups": [{"name": "本編　第一部", "note": "黄泉の大地で、魔王は迎え撃つ", "items": [{"id": "ch01", "label": "第一章", "title": "黄泉の大地、焼ける", "chars": 5036, "sections": [{"h": "一", "p": ["黄泉の空は、昼でも薄く赤い。それでも土蜘蛛族の畑には、澄んだ光が降りていた。ハニヤスが長い年月をかけて地脈を整え、瘴気を土の底へ押し戻してきたからだ。丘の斜面には段々の田が刻まれ、実り始めた稲穂が風のたびに低い波をつくっていた。", "「王よ、そこは踏むな」", "低い声が飛んだ。ベルイザナは片足を上げたまま固まった。畦の際に、小さな芽が一本だけ顔を出している。", "「すまぬ。気づかなかった」", "「気づく前に足元を見ろ。土は黙っているが、忘れはせん」", "ハニヤスは振り返りもせず、鍬を振るい続けた。顔は蜘蛛をかたどった硬い面に覆われ、肩から背にかけて張りついた甲殻からは、節のある細い脚が幾本も伸びている。からくりのようなその脚は、鍬を振るうたびに軋んで、鈍い光を返す。魔界の食卓を預かる男は、口数が少ない。それでも、客として畑を歩くことをベルイザナに許している。", "ベルイザナは袖をまくり、土蜘蛛の若衆と並んで長い卓を運んだ。収穫祭は三日後だ。鬼族の祭り酒の樽が荷車で次々に着き、嵐狼の子どもたちが、樽の周りをはしゃいで走り回っている。", "「王様、どろんこだ」", "小さな嵐狼が、ベルイザナの頬を指さして笑った。", "「畑の手伝いをしたからな。これは誇ってよい泥だ」", "「じゃあ、ぼくもつける」", "子どもは両手を地面に突っ込み、自分の顔に塗りたくった。周りの大人たちが笑い、ベルイザナも笑った。魔王と呼ばれる男が畦に腰を下ろして握り飯をかじっていても、誰も居住まいを正さない。先代の頃には考えられなかった光景だ。", "「今日だったな。人の王との会談は」", "ハニヤスが、手を止めずに言った。", "「ああ。オモイカが行っている」", "「話の通じる相手であってほしいものだ」", "「通じてほしい。私は、そう願っている」", "ベルイザナは握り飯の最後の一口を飲み込み、遠い大穴の方角を見た。空の赤が、そこだけ少し濃く見えた。"]}, {"h": "二", "p": ["大穴へ続く街道は、荒れた岩場のまま長く伸びている。オモイカは輿を断り、随員たちと同じ歩調で歩いていた。", "先頭では若い鴉族が荷を担ぎ、中ほどでは書記を務める老いた鬼が、巻物を胸に抱えて黙々と進んでいる。最後尾では、嵐狼の青年が下手な笛を吹いていた。誰かが「調子が外れているぞ」と言い、誰かが笑った。", "オモイカは、一人ひとりの顔を覚えている。家族の数も、好きな食べ物も、故郷の畑の広さも知っている。それが参謀の仕事だと、先代の頃から思ってきた。力で押さえつけるだけの統治は、いつか必ず折れる。ベルイザナはその限界を越えた。だから腹心を誓った。", "その王が望んだ和平である。成さなければならない。", "ただ、胸の奥に小さな棘が刺さっていた。人の王から届いた書簡は、文面が整いすぎていた。誠実な言葉が、誠実すぎる順序で並んでいる。嘘を知っている者が、嘘に見えないように磨いた文面だと、オモイカの目は告げていた。", "見抜く力は、時に重荷になる。棘を抜く確証はない。確証がないまま断れば、和平の機会そのものを失う。", "「参謀殿、顔が怖いですぞ」", "後ろから、書記の老いた鬼が声をかけた。", "「生まれつきだ」", "「いやいや。王も、いつもそう仰っておりました。オモイカは考えすぎる、と」", "オモイカは小さく息を吐いた。口の端がわずかに緩んだ。", "「王の言うとおりだ。考えすぎで済めば、それが一番よい」", "大穴の縁が、岩の向こうに見え始めていた。"]}, {"h": "三", "p": ["魔界の市場は、昼になると種族の匂いが混ざる。鬼族の祭り酒、土蜘蛛族の新米の蒸し団子、嵐狼の干し肉、鴉族の屋台から立ち上る甘い煙。", "ベルイザナは外套の頭巾を目深に被り、団子の屋台の前に立った。", "「ひとつ、くれ」", "「あいよ。今日は噂つきだよ」", "鴉族の店主が、団子を包みながら片目をつぶった。鴉族の屋台は、料理に噂話を一つ添えるのが決まりだ。", "「噂とは」", "「人の王との会談さ。今日、大穴で開かれてるんだって。人間と仲直りできるのかねえ」", "隣で野菜を選んでいた老婆が、顔を上げた。", "「王様が望むなら、できるんじゃないかね。あの子は嘘をつかないから」", "「あの子とは、ずいぶん親しげだな」", "店主が笑った。老婆は肩をすくめる。", "「この間、うちの畑の畦を直しに来てくれてね。泥だらけで、お茶を出したら『これが一番うまい』と」", "頭巾の下で、ベルイザナは視線を落とした。団子の湯気が、頬を温めている。", "そのとき、誰かが外套の裾を引いた。見下ろすと、嵐狼の幼い子どもが立っていた。耳が聞こえない子だ。スサノの築いた集落から、買い物に来たのだろう。子どもは両手を動かし、ゆっくりと形を作った。", "(王様。顔に泥がついてる)", "ベルイザナは同じ形で手を返した。", "(気づかなかった。教えてくれて、感謝する)", "子どもが目を丸くして、にっと笑った。店主が団子を差し出す。", "「王様に似てるねえ、お客さん」", "「よく言われる」", "「だろうねえ。きっと、あの方もこんな顔で団子を食べるんだろうよ」", "店主の言葉に、ベルイザナは返事をしなかった。ただ、団子を一口かじって、うまいと言った。"]}, {"h": "四", "p": ["大穴の縁に建てられた会談の間は、白い石でできていた。両岸の陣営が、半年かけて共同で築いた建物だ。中立の番人である岐人の老いた一人が、立会人として壁際に控えている。", "向かいの席に、アマツ王が座っていた。", "白い礼装に身を包み、剣は帯びていない。穏やかな顔で、柔らかな声で話す。", "「よくお越しくださいました。長い道のりでしたでしょう」", "「お招きに感謝いたします」", "オモイカは、深く頭を下げた。礼を尽くすのは、王の望みだ。", "王の言葉は、すべて正しかった。争いは終わらせたい。民を失いたくない。魔界の王の統治は、評判を聞いている。", "正しすぎる、とオモイカの目は思った。", "王の隣には、若い男が立っていた。勇者タケルだと紹介された。背筋が伸び、目に濁りがない。握った剣の柄に手を置いてはいるが、それは身構えているというより、癖に近かった。", "「魔界の方々を、遠路お迎えできて光栄です」", "タケルは生真面目に頭を下げた。その礼に、嘘はなかった。本心から、この会談の成功を願っている。オモイカにはそれが見えた。", "だからこそ、棘は抜けなかった。善良な男の隣で、善良な言葉を語る王の目の奥だけが、温度を持たない。", "「では、大穴の共同管理について、具体的な条項を詰めましょう」", "王の声は、どこまでも柔らかかった。", "オモイカは、巻物を開いた。随員たちが、背後で静かに息を整えている。もし何かが起きるなら、今この瞬間に、起きるはずがない。そう思おうとした。", "そう思いたかった。"]}, {"h": "五", "p": ["王の広間には、四天王が揃っていた。昼下がりの光が高窓から差し、石の床に長い影を落としている。", "「和平が成れば、収穫祭に人間を招けるだろうか」", "ベルイザナが、杯を傾けながら何気なく言った。", "「酒が足りなくなる」", "ミカヅチが、即座に答えた。", "「鬼の樽は、人間の舌を考えて仕込んでおらん。三倍は要るぞ」", "「三倍で済むなら安いものだ」", "ナキメが口の端を上げた。", "「席の並びも考えねばなりませんね。鬼と人間は、どちらも声が大きい。隣に座らせると、酒の席が決闘になりかねません。私が間に入りましょう」", "「群れの者は嫌がるだろう」", "スサノが唸るように言った。牙の間から、息が漏れる。", "「だが、お前が招くと言うなら、俺たちは席を空ける。裏切りは、せん」", "「土地を荒らさぬ客なら、迎える」", "ハニヤスが、短く言った。", "ベルイザナは、四人の顔を順に見た。力で従わせた者は一人もいない。だからこそ、胸が温かかった。", "「感謝する。まだ、成ると決まったわけではないが」", "「成りますとも」", "ナキメが涼しい顔で言った。", "「オモイカが行っているのです。嘘と本当を聞き分ける目で、あの方より確かな者はいません」", "その名が出た時、ベルイザナの胸の奥で、小さな音がした。何の音かは、分からなかった。"]}, {"h": "六", "p": ["「では、この条項で、双方の署名を」", "アマツ王が、穏やかに微笑んで言った。", "その笑みが、深くなった。", "オモイカの目が、それを捉えた。口の端がほんのわずか上がる。目の奥の温度のなさが、笑みの裏から浮き上がる。", "見抜いた。遅かった。", "「――終わりにしましょう」", "王の声が、柔らかく響いた。", "足元の石が、鳴った。大穴の底から、地鳴りがせり上がってくる。会談の間の床が震え、壁際の岐人の番人が、はっと顔を上げた。", "「何を――」", "扉が、外から蹴破られた。鎧の軍勢が、雪崩のように流れ込んでくる。大穴の人間側の拠点から、宣戦の布告もなく。", "「王を守れ！」", "タケルの声が響いた。迷いのない、澄んだ声だった。彼は、魔族が先に襲ったと信じている。そうでなければ、この声は出ない。洗脳された善意の剣が、抜かれた。", "「参謀殿！」", "書記の老いた鬼が、オモイカの前に立った。巻物が宙に舞う。笛を吹いていた青年の笛が、床に落ちて転がった。荷を担いでいた鴉族が、剣を弾こうと翼を広げ、そのまま倒れた。", "一人。また一人。", "オモイカは、言霊を唱えた。返し鏡が空気を張り、迫る刃と術の光を弾く。猛りと堅めを重ね、随員たちの前に壁を作ろうとする。足りない。数が違う。人間の軍勢は、魔界側の十倍はいる。", "倒れていく随員の顔を、一つずつ見た。一人も、目を逸らさなかった。逸らせなかった。名前は、口にしなかった。口にすれば、声が震える。震えれば、言霊が乱れる。", "背に、手が触れた。", "誰の手だったか、分からない。強い力が、オモイカを押した。床が割れた縁の向こう、魔界側へ続く回廊の暗がりへ。", "「行ってください、どうか――」", "声は、途中で途切れた。", "オモイカは、転がり落ちた。振り返ったとき、扉の向こうでは、アマツ王が白い礼装のまま立っていた。血の海の中で、変わらず穏やかに微笑んでいた。"]}, {"h": "七", "p": ["回廊の暗がりは冷たかった。", "オモイカは壁に背を預け、息を整えた。腹が熱い。押さえた手が濡れている。傷は浅くない。それでも動ける。動かなければならない。", "手を空にかざし、言伝の言霊を唱えた。鴉族の術を、ナキメに教わって覚えたものだ。声を風に乗せ、王のもとへ届ける。", "「……ベルイザナ様」", "返事を待つ余裕は、なかった。", "「会談は、騙し討ちでした。人間の軍勢が、大穴から魔界側へ突入しています。随員は――」", "そこで、声が詰まった。", "随員の顔が、一つずつ浮かぶ。笛を吹いていた青年。巻物を胸に抱えていた老いた鬼。荷を担いでいた若い鴉。", "オモイカは、唇を噛んだ。血の味がした。", "「……私の読みが、外れました。違和感はありました。それでも、席に着きました。申し訳――」", "言いかけて、飲み込んだ。謝罪は後でいい。今は、一刻も早く、全てを伝えなければならない。", "「軍勢は、すでに最前線の大陸に入りつつあります。民の避難を。急いでください」", "言霊が、風に溶けた。", "オモイカは、壁に額を押し当てた。誰も呼ばなかった名前が、胸の中で静かに反響していた。"]}, {"h": "八", "p": ["収穫祭の卓は、ほぼ並び終わっていた。", "ベルイザナは、ハニヤスの隣で、最後の杭を打っていた。陽は傾き、段々の田が金色に染まっている。嵐狼の子どもたちが、泥だらけの顔のまま、卓の周りを走っていた。", "声が、風に乗って届いた。", "オモイカの声だった。", "ベルイザナの手が、止まった。槌が、地面に落ちた。", "声は、短かった。会談は騙し討ちだったこと。軍勢が突入したこと。随員が――。", "そこで、言葉が途切れた。", "ベルイザナは、動かなかった。耳を傾けたまま、遠い大穴の方角を見ていた。表情は、静かに消えていく。市場で団子をかじった時の穏やかさも、泥だらけで笑った時の温かさも、すべて。", "ハニヤスが、鍬を止めた。何も言わなかった。ただ、ベルイザナの顔を見て、背を向けていた子どもたちを手招きし、畑の中央へ集めた。", "「……ハニヤス」", "ベルイザナの声は、低く、平らだった。", "「おう」", "「土蜘蛛の民を、避難させてくれ。この畑ごと、守れるなら守ってほしい。無理なら、命を第一にせよ」", "「畑は、後で直せる」", "ハニヤスが答えた。", "「民は、直せん」", "「感謝する」", "ベルイザナは、足元に落ちた槌を拾い上げた。畦の際に、小さな芽が一本だけ、まだ残っていた。さっき踏みかけた、あの芽だ。", "彼は、その芽を踏まないよう、静かに一歩横へ足を出した。", "「四天王を呼べ。各種族の安全を確かめてから来いと伝えよ。私は、先に行く」", "「王」", "ハニヤスが、珍しく言葉を重ねた。", "「土は、黙っているが、忘れはせん。あなたが何を選んでも、俺は、あなたの畑に立っている」", "ベルイザナは、振り返らなかった。ただ、片手を軽く上げた。", "収穫祭の卓が、夕陽の中に並んでいる。誰の座る席も、まだ空いたまま。", "赤い空の下で、魔王は、大穴へ向かって歩き出した。"]}]}, {"id": "ch02", "label": "第二章", "title": "静かなる迎撃", "chars": 2966, "sections": [{"h": "一", "p": ["道は、焼けていた。", "根の洲の丘陵は、三日前までは緑だったらしい。今は黒い土と、骨のように立つ木の幹ばかりが続いている。先頭の隊列は、その上を整然と進んでいた。足並みは乱れない。誰も口を利かない。口を利く必要がなかった。", "兵は歩きながら、懐の紙の感触を確かめた。娘への手紙だ。書きかけのまま、三日、書き足せずにいる。", "『戦が終われば、英雄の凱旋で街が祝うそうだ。おまえにも土産を』", "そこまで書いて、止まっていた。次の言葉が出てこない。自分の言葉が、どこかで途切れているような気がした。", "「正義は我らにあり」", "誰かが小さく呟き、周りが頷いた。兵も頷いた。その言葉は、胸のどこかにすっと収まる。昔から自分の考えだったように。", "魔族は、話の通じない者たちだ。だから、これは仕方がない。王様がそう仰った。", "焼けた地には、小さな畑の跡があった。畦が崩れ、苗が炭になっている。兵は、それを見ないようにして歩いた。見なければ、考えずに済んだ。"]}, {"h": "二", "p": ["最初に気づいたのは、風だった。", "先頭の隊列の前方で、風が止んだ。焦げた匂いを運んでいた風が、ぴたりと。", "「止まれ」", "誰かが言った。隊列が止まる。丘の稜線の向こうから、一人の男が歩いてきていた。", "兵は目を細めた。遠くて、顔は見えない。外套の頭巾を被っておらず、黒い髪が風もないのに揺れていた。額の脇に、黒い角。背には、畳まれた黒い翼が見えた。剣は帯びていない。杖も、盾もない。ただ、歩いている。", "足音が、聞こえなかった。", "「……一人か」", "隣の兵が呟いた。声が、わずかに掠れていた。", "「魔族の斥候だろう。囲め」", "隊長の声が飛ぶ。弓兵が前に出て、矢をつがえた。兵は槍を握り直した。掌が汗で滑った。", "男は、歩調を変えなかった。一歩、また一歩。丘の黒い土を、まるで庭の小道のように。", "兵は、不意に思った。あの男は、畑の畦を踏まないように歩いているのではないか。馬鹿げた考えだった。焼けた丘に、畦などない。"]}, {"h": "三", "p": ["矢が放たれた。", "それが、最後の音だった。", "矢は男に届かなかった。届く前に、空中で止まった。止まって、落ちた。乾いた葉が落ちるように。", "隊列の最前列で、兵が一人、膝をついた。叫びはなかった。膝をついて、そのまま前に倒れた。倒れた体は、地面に着く前に薄れ、黒い土と区別がつかなくなった。", "もう一人。その隣が、さらにもう一人。", "手前から順に、静かに、隊列が消えていった。", "男は、歩いていた。手を上げもしない。何かを唱える唇の動きもない。ただ歩き、その歩みの前にいる者が、そこにいなくなる。", "「撃て、撃て！」", "隊長の声は途中で消えた。声の主ごと。", "兵は槍を構えたまま、足が動かなかった。逃げようと思った。思っただけで、体が言うことを聞かない。恐怖が、体の真ん中を凍らせていた。", "隣の兵が、こちらを見た。目が合った。唇が「あ」の形に動いた。次の瞬間、その兵はいなかった。鎧だけが、中身を失って、崩れ落ちるはずだった。それすらなかった。鎧も、剣も、懐の何もかも、跡形もなく。", "風の音だけが残った。", "兵は、気づいた。血の匂いがしない。悲鳴がない。何も壊れていない。ただ、人が、いなくなっていく。", "男の顔が、見えた。", "静かな顔だった。怒りも、憎しみも、そこにはなかった。ただ、深く、底のない、凪いだ水面のような。", "その顔を、兵は知らない。それなのに、どこかで見たことがあるような気がした。祭りの夜に、卓の端で酒を飲んでいる誰かの顔に似ていた。そんなはずはない。"]}, {"h": "四", "p": ["「下がれ、下がれ！」", "鋭い声が、混乱を裂いた。", "勇者タケルが、隊列の前に飛び出していた。白銀の鎧が、焼けた空の赤を映している。人間界最強と呼ばれる剣士が、剣を抜き放つ。", "「魔王ベルイザナ！ これ以上の蛮行は許さん！」", "澄んだ声だった。迷いのない声だった。兵は、その声に縋った。あの人がいる。英雄がいる。あの人が、なんとかしてくれる。", "男は、足を止めなかった。", "タケルが踏み込んだ。剣が、閃いた。人間界最強の一撃が、まっすぐに男の首筋へ向かう。", "届かなかった。", "剣が男の外套に触れる寸前で、タケルの膝が折れた。力が抜けたように、がくりと地面に沈む。剣が手から離れ、からんと音を立てて転がった。", "「な……」", "タケルが顔を上げた。目に、初めて困惑が浮かんだ。何をされたのか、分かっていない。", "男は、タケルを見下ろした。何も言わなかった。", "その後ろで、参謀格らしい男たちが、次々と膝をついていく。誰も悲鳴を上げなかった。立っている者の数が、減っていく。", "兵は、槍を取り落とした。", "視界が、白くなっていく。恐ろしいとは、もう思わなかった。ただ、手紙のことを思った。書き足せなかった、続きのことを。", "土産は、何がいいだろう。娘の好きな菓子を、買って帰ろう。この戦が終わったら、街で、一番いい店で。", "あいつは、甘いものが好きだったから。", "娘に――"]}, {"h": "五", "p": ["ミカヅチが丘の稜線に立った時、戦場は静まり返っていた。", "息が止まった。", "視界の端から端まで、何もなかった。焼けた黒い土の上に、足跡さえ残っていない。鎧の破片も、折れた槍も、血の染みも。万を超えていたはずの軍勢が、最初からそこにいなかったかのように、消えていた。", "風が吹いている。何も運ばない風が。", "ミカヅチは、鬼族の頭領として、数え切れない戦場を見てきた。屍の山も、血の川も知っている。だが、これは違った。何もない。何もないことが、これほど恐ろしいとは知らなかった。", "一騎討ちの記憶が、蘇る。全てをぶつけ、一撃を受けきった。あの時、王は手加減をしていた。受けきれる一撃を選んでいた。今なら分かる。あれが、王の本気であるはずがなかった。", "「……王」", "呼びかけは、掠れた。", "戦場の中央に、ベルイザナが立っていた。背を向けている。その足元に、六つの影が膝をついていた。白銀の鎧の勇者と、参謀格の者たち。生きている。息をしている。立ち上がる力だけが、奪われていた。", "ミカヅチは、ゆっくりと歩み寄った。足音が、やけに大きく響く。", "「避難は終えました。各族とも、無事です」", "「そうか」", "ベルイザナの声は、平らだった。振り返らない。", "「ご苦労だった」", "その一言に、ミカヅチは、言葉を失った。礼を言われたことに、ではない。声に、何の色もないことに。魔界の民を、一人の例外もなく気にかける王の声から、温度だけが抜けていた。", "足元のタケルが、顔を上げた。唇を噛み、血を滲ませ、それでも目に力を残している。", "「殺せ。魔王」", "タケルは、まっすぐに言った。", "「俺は、お前を許さない。殺せ」", "ベルイザナは、タケルを見下ろした。長い間、何も言わなかった。", "「殺さぬ」", "やがて、言った。", "「おまえたちには、聞きたいことがある。命を取るのは、それが済んでからだ」", "「俺は何も話さん」", "「それでよい」", "ベルイザナは、初めて振り返った。ミカヅチを見て、静かに告げた。", "「この者たちを、捕らえてくれ。傷つけるな。飢えさせるな。必要なものは与えろ」", "「……は」", "ミカヅチは頭を下げた。顔を上げる時、見てしまった。", "ベルイザナの右手が、外套の陰で、小さく震えていた。", "怒りか、悲しみか、あるいは別のものか。ミカヅチには分からなかった。ただ、その震えが、先ほどまでの静かな恐ろしさとは別の何かを語っているように思えた。", "震えは、すぐに止まった。ベルイザナは手を握り込み、何事もなかったように、焼けた根の洲の丘を見渡した。", "遠くで、鴉が一羽、鳴いた。"]}]}, {"id": "ch03", "label": "第三章", "title": "問うても答えぬ者", "chars": 4095, "sections": [{"h": "一", "p": ["目を覚ますと、天井が低かった。", "タケルは石の床に横たわったまま、しばらく動かなかった。体のどこにも縄がない。鎖もない。腕を動かすと、肩に布が巻かれているのが分かった。誰かが、傷を手当てしている。", "(死んでいない)", "次に思ったのは、それだった。魔王の前で膝をついたところまでは覚えている。その先は白い。", "牢は狭いが、清潔だった。窓は高く、赤い光が細く差している。床には藁の寝床があり、隅には水の入った甕が置かれていた。毒かもしれない、と疑って、タケルは水に手を触れなかった。", "扉の小窓が開いた。鬼の顔が覗いた。額に二本の角があり、牙が口の端から覗いている。", "「起きたか。飯だ」", "差し入れ口から、盆が滑り込んできた。湯気の立つ粥と、焼いた根菜と、干し肉が一切れ。", "「毒など入れておらん。入れるつもりなら、寝ている間にやっている」", "鬼は無愛想に言った。", "「飢えさせるなとの王命だ。食え」", "タケルは盆を見つめた。魔族は話の通じない者たちだ。人を食らい、嘲り、約束を踏みにじる。そう聞いてきた。王が、そう仰った。", "目の前の粥は、ただ温かかった。", "腹が鳴った。タケルは唇を噛み、それでも盆を引き寄せた。一口食べると、米の甘みがあった。それが、ひどく悔しかった。", "「……礼は言わん」", "「いらん。王命だ」", "鬼は小窓を閉めかけて、少し止まった。", "「だが、残さず食うのは感心だ。鬼族では、食い物を残す奴は弱いと言う」", "小窓が閉まった。タケルは粥の椀を、最後の一粒まで空にした。"]}, {"h": "二", "p": ["二日目の夜に、男が来た。", "足音は、ほとんどしなかった。牢の前に立ったのは、黒髪の静かな男だった。額の脇に、黒い角が二本。背には、畳まれた黒い翼。それでも、顔だけを見れば、人間と変わらない。ただ、その男の周りだけ、空気の密度が違った。", "魔王ベルイザナ。戦場で、タケルを膝から折った男だ。", "「傷は痛むか」", "最初の言葉が、それだった。タケルは顔を上げ、睨みつけた。", "「何の用だ。殺すなら、早くしろ」", "「聞きたいことがある」", "ベルイザナは、牢の格子の前に腰を下ろした。見下ろさない位置だった。", "「なぜ和平の席で、刃を抜いた」", "「あれは、魔族が先に仕掛けた。王様はそう仰った」", "「会談の間で、先に動いたのは人の軍勢だった」", "「嘘だ。魔族は話の通じない者たちだ。約束を守らず、人を欺く。だから――」", "タケルの言葉は、そこで途切れた。", "自分の声が、遠くから聞こえた。喉を通っているのは自分の言葉のはずなのに、どこかで誰かが同じ言葉を繰り返しているような。", "ベルイザナは、黙っていた。責めもせず、遮りもせず、ただ聞いていた。", "「……魔族は、話の通じない者たちだ」", "もう一度、言った。今度は、さっきより声が小さかった。", "目の前の男は、話が通じていた。傷を気遣い、座って、目を合わせて問う。食事は、残さず食べろと言われた。看守は無愛想だが、殴ってこない。", "(おかしい)", "その言葉が浮かんだ瞬間、胸の奥で何かが締まった。頭の奥に、細い痛みが走る。考えるな、と別の声が言った。それは自分の声のようで、そうでなかった。", "ベルイザナは、タケルの顔をじっと見た。", "「今日はここまでだ。また来る」", "立ち上がる気配に、タケルは思わず言った。", "「おまえ……どこかで」", "「何だ」", "「いや」", "タケルは首を振った。黒髪の男の顔に、なぜか引っかかるものがあった。見たことがある気がする。いつ、どこで。戦場ではない。もっと違う、何かの。", "答えは出なかった。男は静かに去り、足音は闇に溶けた。"]}, {"h": "三", "p": ["ナキメは、牢の格子の外に椅子を置いて座っていた。", "鴉族の長として、数え切れない言霊を扱ってきた。特に、心に触れる術には自信がある。呪文系言霊で魔界随一と言われるのは、伊達ではない。", "「痛みはありませんか。少し、中を見せていただきます」", "「やめろ」", "「やめません。これは、あなたのためでもあります」", "ナキメは指先を軽く動かし、朧を細く紡いだ。相手の意識の輪郭をぼかす言霊だ。強いものではない。扉を叩く程度の、挨拶のような。", "タケルの目が、わずかに揺らいだ。", "(入った)", "ナキメは息を詰めた。心の表層は、柔らかかった。善良で、真っ直ぐで、不器用な。人を疑うことを知らず、疑われることを恐れる。そういう手触りがある。", "その奥に、硬い層があった。", "(これか)", "王の言霊は、薄い膜のように心を覆っていた。ただ覆っているのではない。膜は根を伸ばし、タケルの善良さそのものに絡みついていた。「正義を信じたい」という願いを足場にして、そこから「魔族は悪だ」という考えを育てている。", "名暴きを、細く差し入れた。偽りの名を剥がす言霊だ。洗脳の核を見つけて、緩めることができるかもしれない。", "その瞬間、強い反発が返ってきた。", "タケルの体が跳ねた。喉から、本人のものではない声が漏れる。", "「――魔族は、話の通じない者たちだ」", "ナキメは、すぐに言霊を引いた。額に汗が滲んでいた。", "「……失礼しました。今日はここまでにします」", "タケルは息を荒げ、牢の隅へ後ずさった。目に、恐怖が浮かんでいる。ただし、ナキメに向けてではなかった。自分の口が勝手に動いたことへの、恐怖だった。", "(自覚はある。解ける余地は、ある)", "ナキメは立ち上がり、静かに頭を下げた。", "「少しずつやります。あなたを、傷つけたくはない」", "タケルは、何も言わなかった。ただ、目だけが、揺れていた。"]}, {"h": "四", "p": ["居城の広間は、夜になると冷える。", "ナキメは、ベルイザナの前に膝をついていた。膝が、わずかに震えているのが自分で分かる。この王の前に立つと、いつもそうだ。底が見えない。見えないのに、嘘がない。その矛盾が、体を震わせる。", "「報告します」", "声は、震えなかった。震わせなかった。", "「王の言霊は、心の奥深くに根を張っています。無理に剥がせば、本人の心が壊れかねません。この者の善良さを足場にして、成長している。善人ほど、深く染まります」", "「解けるのか」", "「解けます。ただし、時間がかかります。数か月は見ていただきたい」", "ベルイザナは、頷いた。", "「急がずともよい。壊すな」", "「承知しました」", "ナキメは、少し迷ってから、言葉を足した。", "「一つだけ。綻びを作ること自体が、王への合図になる危険があります。言霊の根は、遠くの術者に繋がっているように感じました。解こうとするほど、向こうに気づかれるかもしれません」", "「気づかれたら、どうなる」", "「分かりません。ただ、備えはしておきます」", "ベルイザナは、ナキメの顔を見た。長い間、何も言わなかった。", "「おまえは、嘘を使わずに報告したな」", "「……はい」", "「感謝する。助かった」", "ナキメは、深く頭を下げた。顔を上げられなかった。震えは、まだ止まっていない。ただ、それは恐れだけの震えではなかった。"]}, {"h": "五", "p": ["黄泉津の宮の露台は、夜風が強い。", "ベルイザナは手すりに肘をつき、赤い夜空を眺めていた。耳元に、声が届く。言伝の言霊だ。", "「ベルイザナ様。人間界へ自ら赴くなど、お考え直しください」", "オモイカの声だった。傷が癒えきらず、少し掠れている。", "「危険すぎます。人の王は、狡猾です。魔王が一人で乗り込めば、どんな罠が待つか。四天王を連れていく手も――」", "「連れていけば、潜入にならない」", "「それは、そうですが」", "「オモイカ」", "ベルイザナは、静かに呼んだ。", "「おまえが失った者たちの顔を、私は知らない」", "通信の向こうで、息を呑む気配がした。", "「おまえは、一人ひとりを覚えていた。家族も、好物も。私は、彼らの顔を知らなかった。名前も、一人も呼べない。王でありながら」", "「それは……あなたのせいでは」", "「人間の顔も、知らなかった」", "ベルイザナは、手すりを握った。指の関節が白くなる。", "「戦場で、私は何千人も消した。顔を見なかった。見ようとしなかった。あれが、人だったのかどうか。私は、知らないまま、殺した」", "返事はなかった。夜風が、露台の灯を揺らした。", "「牢のタケルは、粥を残さず食べる。看守に、礼を言いかけて飲み込む。あれは、魔族が思い描く『人間』と、まるで違う」", "「それは、洗脳の――」", "「分かっている。だが、洗脳されているのはあの男だけではあるまい。街にも軍にも、いるはずだ。ならば、私が滅ぼそうとしているものは何だ」", "沈黙が、長く続いた。", "オモイカが、小さく息を吐いた。", "「……ベルイザナ様の、お考えは分かりました」", "「反対か」", "「反対です。今でも」", "オモイカの声は、少しだけ笑っていた。", "「ですが、あなたは、一度決めたら変わらない方です。ならば私は、最悪の場合を考えます。人間界での名、力の抑え方、通信の取り方。全て詰めましょう」", "「感謝する。おまえには助けられてばかりだ」", "「申し訳ありません、私は――」", "「それより」", "ベルイザナは、言葉を遮った。穏やかな声だった。", "「次の手を、聞かせてくれ」", "通信の向こうで、オモイカが、小さく、確かに息を詰めた。それから、静かに答えた。", "「……はい。まず、名からです」"]}, {"h": "六", "p": ["夜が明ける前に、方針は固まった。", "偽りの名を、使う。まことの名を伏せ、「ベル」と名乗る。短く、ありふれた響きだ。まことの名が名付けと支配の力を持つ世界では、偽名にも弱い言霊が宿る。印象を薄め、記憶に残りにくくする。", "力は、抑える。人間界で最強と言われるタケルと、同じ程度まで。それでも、並の冒険者よりは遥かに強い。ただ、使うほど気配が漏れる。", "四天王には、「下見」と告げる。本当のことは、言わなかった。言えば、止められる。止められないとしても、危険だと言われる。", "(本心は、人間を知りたい)", "露台の上で、ベルイザナは、その言葉を自分にだけ認めた。", "滅ぼすために行くのではない。見に行くのだ。あの牢の男が、どんな世界で育ったのか。畑を踏んで進んだ兵が、どんな家に帰るはずだったのか。", "夜明けの光が、赤い空の端を薄く染めていく。黄泉の空は、朝でも赤い。それでも今朝は、少しだけ、澄んで見えた。", "遠く、比良坂の方角に、細い光の筋が立っている。大穴の底から、世界の中心から、昇る光だ。", "ベルイザナは、その光を、長く見つめた。", "(私の名は、ベル。ただの冒険者だ)", "声に出さずに言ってみた。まだ、自分のものではない響きだった。", "それでも、いつか馴染むだろう。そう思えたことが、昨日までの自分との、小さな違いだった。"]}]}]}, {"name": "本編　第二部", "note": "名を隠して、人の世へ", "items": [{"id": "ch04", "label": "第四章", "title": "同じ受付の前で", "chars": 7226, "sections": [{"h": "一", "p": ["港町ミナモは、朝から騒がしかった。", "ベルは石畳の上に立ち、しばらく動けなかった。比良坂を渡ってから三日、街道を歩き通してようやく着いた交易の町だ。潮の匂いと、焼き魚の煙と、人の声が、いっぺんに押し寄せてくる。", "黄泉の市場とは、匂いが違う。魔界の市場は、種族の匂いが混ざる。ここでは、人間の匂いが混ざっていた。汗と、香辛料と、洗濯した布と、焦がした砂糖。", "力は、抑えている。黄泉の力を体の奥へ畳み込み、人の青年の姿を保っている。鏡を見たときは、少し驚いた。角も翼もなく、ただの黒髪の若者が映っていた。魔王の面影は、目の奥にわずかに残る程度だ。", "「おい、兄さん。そこ、邪魔だよ」", "荷車を引いた男が、舌打ちして通り過ぎた。ベルは慌てて脇へ寄った。誰かに邪魔だと言われたのは、いつ以来だろう。", "悪い気は、しなかった。", "通りには屋台が並んでいた。ベルは、焼き菓子の屋台の前で足を止めた。列ができている。人間の客が三人、その後ろに、獣の耳を持つ女が一人。", "店主は、人間の客の注文を先に捌いた。三人目が済んでも、手を止めて、後から来た別の人間の客に声をかけた。", "「いらっしゃい、何にします」", "「待て、私が先だ」", "獣耳の女が、控えめに声を上げた。店主は、ちらりと女を見て、わざとらしく眉を上げた。", "「ああ、あんたかい。ちょっと待ちな。順番ってものがある」", "順番なら、女が先のはずだった。女は何も言わなかった。目を伏せ、また列の端へ下がった。後から来た人間の客は、それに気づかないふりをして、菓子を受け取った。", "ベルは、拳を握りかけて、ゆっくり開いた。", "(ここで何かをすれば、目立つ)", "分かっている。分かっているが、胸の底に、冷たいものが落ちていた。", "魔界で、こんな順番を許した覚えはない。王として、許さなかった。だが、ここは魔界ではない。", "通りの奥の掲示板には、紙が何枚も貼られていた。迷い猫の捜索。荷運びの募集。その隅に、ひときわ大きな文字の紙が一枚あった。", "『魔族は話の通じぬ者たちである。正義は我らにあり』", "見覚えのある言葉だった。タケルが、牢の中で繰り返していた言葉と、同じだ。", "ベルは、紙を長く見つめた。誰も、足を止めない。誰も、疑わない。まるで空気のように、街にこの言葉が染みている。", "(街に、根を張っている)", "ナキメの分析が、頭をよぎった。善人ほど深く染まる。この街の人々は、悪人ではないのだろう。焼き菓子の店主も、荷車の男も、きっと家に帰れば、家族に優しい。", "それが、いっそう恐ろしかった。", "ベルは、掲示板に背を向けた。冒険者ギルドの看板が、通りの向こうに見えていた。"]}, {"h": "二", "p": ["オオナムチは、朝から三度、胸の内で唱えていた。", "(初めての依頼。初めての依頼。失敗しない)", "ギルドの受付は、木の長い台の向こうにある。朝は混み合う。腕に自信のありそうな冒険者たちが、依頼書を片手に列を作り、ざわめきが天井に反響していた。", "オオナムチは、列の後ろに並んだ。継ぎの当たった外套に、使い古した短剣。靴の踵は擦り減っている。登録は昨日済ませたばかりで、冒険者の札は、まだ銅色のいちばん下の等級だった。", "「次の方」", "受付の女が、顔も上げずに言った。オオナムチの前の男が、台に身を乗り出す。その隣に、もう一人、別の男が並んだ。", "オオナムチは、何気なく、その男を見た。", "黒い髪を肩の下まで伸ばした、若い男だった。年は自分より少し上だろうか。背は高く、黒い外套には上等な縫い取りがあるのに、旅慣れていない様子で、まだ新しい。右の眉の端に、小さな古い傷がある。瞳は、深い灰色だった。光の加減で、その奥が、かすかに赤く見えた。", "ふと、気づいた。", "(見えすぎる)", "おかしな感想だった。ただ、その男の顔が、細部までくっきり見えるのだ。眉の傷も、睫毛の長さも、唇の端の癖も。まるで、そこだけ光が当たっているように。", "ほかの者たちは、その男に、目も留めなかった。隣の冒険者が肘をぶつけても、男の顔を見ずに謝りもしない。受付の女も、男が台の前に立つと、一瞬だけ視線を向け、すぐ手元に戻した。", "「新規の登録ですね。お名前を」", "「ベル」", "「ベルさん。お住まいは」", "「決まっていない」", "「根無し草の方ですか。では、後見人は」", "「いない」", "女は鼻を鳴らし、札を書き始めた。ペンの先が、紙の上を滑る。書き終えて顔を上げたとき、女は、一瞬、ぼんやりした顔をした。", "「……ええと、お名前、何でしたっけ」", "「ベル」", "「ああ、そうでしたね。失礼しました」", "女は札を差し出した。男は、礼を言って受け取った。礼を言う冒険者は、珍しい。オオナムチは、思わず、その横顔を見ていた。", "(目がいいんだろうな、俺は)", "そう思って、すぐに忘れた。今日は、自分の依頼がある。"]}, {"h": "三", "p": ["依頼の掲示板は、ギルドの奥の壁にある。", "人気の討伐依頼や護衛の仕事は、朝のうちに剥がされる。残るのは、報酬の安い、手間のかかる依頼だけだ。", "オオナムチは、掲示板の隅を見ていた。", "一枚だけ、何日も残っている紙があった。端が黄ばんで、角が丸まっている。", "『ひなた野への届け物。薬と日用品。報酬、銅貨十枚』", "誰も受けない理由は、分かっている。行き先が、亜人の多い集落だからだ。往復で一日かかるのに、銅貨は十枚。パン一個と変わらない。", "オオナムチは、迷わず紙を剥がした。", "受付の女が、紙を見て眉をひそめた。", "「それ、受けるんですか。ひなた野でしょう」", "「はい」", "「報酬、安いですよ。もっと割のいい依頼が、ほら、下水路の掃除なら」", "「これでいいです」", "「……変わった子ね」", "女は、納得のいかない顔で、受注の判を押した。紙を渡す指が、どこか汚いものを扱うように、少し離れていた。", "オオナムチは、何も言わなかった。慣れている。生まれ育った土地の名を言うと、人の目つきが変わる。それを、何年も、見てきた。", "荷物は、裏口の倉庫に積まれていた。薬草の包みが二つ、塩の袋、布が三反。それから、小さな布の包みが一つ。封をした紙の手紙が、布に挟まれていた。", "オオナムチは、その包みを手に取った。宛名の字を見て、息が止まった。", "『ハルへ』", "見慣れた、少し右に傾く文字だった。", "(ユウ)", "手紙は、街で働いている幼なじみからだ。何度も、集落に残した弟の話を聞いた。会うたびに、「あいつ、元気かな」と呟いていた。", "オオナムチは、手紙を懐の奥にしまった。誰にも言うつもりは、なかった。"]}, {"h": "四", "p": ["「その依頼、私も同行して構わぬか」", "倉庫の入口に、人影が立っていた。", "オオナムチは、はっとして振り返った。受付の隣に並んでいた、あの男だった。ベル、と名乗った黒髪の男。", "「え。いや、これは」", "「今日登録したばかりだ。依頼の相場が分からぬ」", "男は、淡々と言った。声は低く、静かで、敵意がない。", "「銅貨十枚の依頼を、わざわざ選ぶ者を、初めて見た。理由を聞きたい」", "「理由なんて、ないですよ。誰も受けないから」", "「誰も受けないから、受ける」", "ベルは、その言葉を、噛みしめるように繰り返した。", "「よい理由だ」", "「そう、ですか」", "オオナムチは、戸惑った。ひなた野に行く冒険者を、初めて見た。同行を申し出る人間など、なおさらだ。", "「危ないですよ。途中に、野犬が出ます。俺は、戦いはまだ、全然で」", "「私も似たようなものだ。駆け出しゆえ」", "嘘ではないのか、と、オオナムチは訝った。男の体つきは、引き締まっている。立ち姿に隙がない。ただ、ベルの目には、驚くほど敵意がなかった。誰かを試すでも、侮るでもない。ただ、見ている。", "(変な人だ)", "そう思った。同時に、悪い人ではない、とも思った。理由は、分からなかった。", "「……オオナムチです」", "「ベルだ。よろしく頼む」", "差し出された手は、少し冷たかった。オオナムチは、その手を握った。力は、驚くほど加減されていた。"]}, {"h": "五", "p": ["街を出て二刻ほど歩くと、道は荒れ地に入った。", "荷は、オオナムチが背負った。ベルが半分持つと申し出たが、断った。初めての依頼だ。自分の足で運びたかった。", "荒れ地の岩陰から、唸り声が聞こえたのは、日が高くなったころだった。", "オオナムチの体が、固まった。短剣の柄に手をかける。指が、細かく震えていた。", "「出ましたね」", "低い声で、ベルが言った。", "岩の陰から、野犬が三匹、姿を現した。痩せて毛が荒れているが、牙は鋭く、目が飢えている。一匹が、じりじりと間合いを詰めてくる。", "(やるしかない)", "オオナムチは、短剣を抜いた。足が、地面に張りついたように重い。呼吸が浅い。頭の中が、白くなる。", "その時、不意に、口が動いた。", "「――堅め」", "自分でも驚いた。教わったことなどない。ただ、集落の年寄りが、子どもの頃に、木の実を取りに行く時に唱えさせてくれた短い言葉だった。身を守る、おまじない。まことの名を呼べば、誰でも基礎の力は引き出せる。", "体の周りに、薄い膜のような感触が走った。守りの言霊が、立ち上がった。", "野犬が、飛びかかってきた。", "オオナムチは、短剣で払った。刃が毛を掠めただけで、犬は怯まない。二匹目が、脇から回り込んでくる。", "(だめだ、囲まれる)", "視界の端で、ベルが動いた。", "ベルは、剣を抜かなかった。ただ、一歩だけ、足を出した。それだけで、三匹目の犬の軌道が、わずかに逸れた。犬は、勢いのまま岩に当たり、悲鳴を上げて転がった。", "オオナムチは気づかなかった。目の前の犬に、必死だった。", "左腕に、衝撃が走った。牙が食い込み、堅めの膜が軋む。痛みで視界が滲んだ。", "「うわっ……!」", "「落ち着け。膜は破れていない」", "ベルの声が、すぐ後ろから聞こえた。落ち着いた声だった。", "「痛みの形を、思い浮かべろ。それを、癒やしてくれと願うんだ」", "「癒やし、って、そんな、いきなり」", "「できる。そなたは、もう守りの言霊を出している。同じ力の、反対の側だ」", "オオナムチは、歯を食いしばった。腕の痛みを見る。牙の跡。滲む血。それを、元の形に戻してくれと、願った。", "「――癒やし」", "ふわりと、温かいものが腕を包んだ。傷口は完全には塞がらなかったが、血が止まり、痛みが引いた。", "犬が、一匹、怯んだように後ずさった。二匹目も、足を止める。", "ベルが、一歩、前に出た。", "何をしたのか、オオナムチには分からなかった。ベルは、剣を抜かず、ただ、野犬たちを静かに見ただけだ。三匹の犬が、尾を巻いて、岩場の向こうへ逃げ去った。", "荒れ地に、風の音が戻った。", "オオナムチは、その場に座り込んだ。足から力が抜けていた。短剣を握る手は、まだ震えている。", "「やった……のか、俺が」", "「そなたが守り、癒やした」", "ベルは、静かに言った。", "「よい動きだった」", "オオナムチは、顔を上げた。嬉しい、と思った。同時に、不思議に思った。最後の一撃を、自分は放っていない。それでも、ベルは、自分の手柄のように言ってくれた。", "ベルは、背を向けたまま、息を整えていた。", "(危なかった)", "力を抑えるのが、これほど難しいとは思わなかった。ほんの一歩、足を出しただけで、野犬は、必要以上に吹き飛びかけた。軌道を逸らすだけにとどめるのに、神経を使い果たした。", "それでも、収穫はあった。", "オオナムチは、教わらずに堅めを唱えた。誰に導かれたのでもなく、ただ、守りたいという願いが、そのまま言霊になった。癒やしも、一度の助言で形にした。", "(才がある)", "血統ではない。努力の積み重ねでもない。もっと、素朴な、人を守りたいという性質そのものが、言霊を呼んでいる。", "オオナムチの腕の傷を、ベルは見た。左腕に、牙の跡が残っている。", "(私がいなければ、致命傷になっていたかもしれない)", "守る側に立つというのは、こういうことか、とベルは思った。力を抑えながら、相手が傷つきすぎないように、気づかれない場所で動く。魔界で、民を守る時には、考えもしなかった。力を見せることでしか、守ったことがなかった。", "「行くぞ。日が暮れる」", "振り返ったベルは、できるだけ穏やかな声で言った。"]}, {"h": "六", "p": ["ひなた野は、丘の陰にある小さな集落だった。", "藁葺きの家が十軒ほど、低い石垣に囲まれて並んでいる。畑には、細い野菜が植わっていた。煙突から細く煙が昇っている。畑の脇で遊んでいた子どもたちが、二人の姿を見て、一斉に顔を上げた。", "子どもたちの何人かは、耳が尖っていた。尻尾のある子もいる。小さな角を額に持つ子もいた。", "「冒険者だ」", "「本当に来た」", "大人たちが、家から出てきた。老いた女、腰の曲がった男、赤子を抱いた若い母親。誰もが、驚いたように、二人を見つめている。", "「ギルドからの、届け物です」", "オオナムチが言うと、老婆が、目を丸くした。", "「本当に、来てくださったのかい。もう、誰も来ないと思っておったよ」", "「遅くなって、すみません」", "「遅いものか。ありがたい。薬が、もう切れておって」", "老婆は、薬草の包みを抱きしめるように受け取った。皺だらけの手が、小さく震えていた。塩の袋、布の反物と、荷が下ろされるたびに、集落の人々の顔が、ほどけていく。", "「ありがとう」", "「本当に、ありがとう」", "何人もの口から、同じ言葉が出た。ベルは、荷を運びながら、その声を聞いていた。", "(感謝されている)", "人間界に来て、初めてだった。いや、魔王として、民から感謝された経験は、多かった。それでも、今の言葉は、違った。ベルという名の、ただの冒険者に向けられている。力の裏付けも、地位の重みもない。ただ、荷を運んだことへの、礼だった。", "胸の奥が、温かくなった。同時に、少し痛んだ。この温かさを、人間界で味わうことを、自分は許されているのだろうか。", "「手紙も、あります」", "オオナムチが、懐から、小さな包みを取り出した。", "「ハル、という子は」", "「あ、おれ」", "人垣の後ろから、小さな男の子が、駆け出してきた。八つか九つほどの、痩せた少年だった。目が大きく、髪は寝癖のように跳ねている。耳の先が、わずかに尖っていた。", "「兄ちゃんから、ですか」", "「そうだよ。街で働いている、ユウさんから」", "少年は、両手で手紙を受け取った。包みを、そっと撫でる。封を切る指が、慎重だった。", "少年は、地面にしゃがみ込み、紙を広げた。唇を動かしながら、一字ずつ、指で辿っていく。", "「は、る、へ。げ、ん、き、に、して、い、る、か」", "読み進めるうちに、少年の顔が、ゆっくりとほころんだ。やがて、口元が、大きく緩んだ。", "「兄ちゃんの字だ」", "少年は、顔を上げて、笑った。", "「兄ちゃん、ちゃんと書いてくれた。おれのこと、忘れてなかった」", "その笑顔を見た瞬間、ベルは、息をするのを忘れた。", "寄り添いの里の、子どもたちの顔が、重なった。耳の聞こえない小さな嵐狼が、泥だらけの手で笑っていた。あの笑顔と、同じ形をしていた。", "(人間にも、この顔がある)", "分かっていたことだった。頭では、分かっていた。それでも、自分の目で見るまでは、本当には理解していなかった。種族が違っても、笑顔の形は、変わらない。兄からの手紙を、宝物のように読む子どもの顔は、魔界にも人間界にも、同じようにあった。", "「ねえ、おじさんたち」", "ハルが、紙を握りしめて言った。", "「兄ちゃん、元気かな」", "オオナムチは、少年の目の高さまで、膝を折った。", "「元気だよ」", "その声は、柔らかかった。", "「手紙の字が、元気だっただろう」", "「うん」", "ハルは、大きく頷いた。", "オオナムチの顔を見ながら、ベルは、ふと、気づいた。彼は、笑っていた。けれどその目の奥に、何か、細い影が差していた。この青年は、手紙の差出人を、知っている。ここに来た理由は、報酬の安い依頼を選んだ優しさだけではない。", "ベルは、何も尋ねなかった。ただ、少年の笑顔を、長く見つめた。"]}, {"h": "七", "p": ["帰り道は、夕焼けだった。", "ひなた野の丘を下りると、西の空が、橙色に染まっていた。ミナモの灯が、遠くで、少しずつ点き始めている。", "二人は、並んで歩いた。荷を下ろしたぶん、足取りは軽い。オオナムチの腕の傷は、集落の老婆が、薬草を貼ってくれた。", "「報酬、銅貨十枚でしたね」", "オオナムチが、懐から小さな布袋を出して、掌で転がした。", "「半分、渡します。ほとんど何もしていない、なんて言わせませんよ」", "「いらない」", "ベルは、首を振った。", "「そなたが選んだ依頼だ。私は付き添っただけだ。それよりも」", "少し間を置いて、ベルは、言った。", "「聞いてよいか」", "「何ですか」", "「なぜ、この依頼を選んだ」", "オオナムチは、歩みを止めずに、しばらく黙っていた。道の脇で、夕風が草を撫でていく。", "「育った場所に、似ていたからです」", "やがて、短く答えた。", "「ひなた野は、俺の故郷じゃない。でも、似ているんです。薬が足りなくて、誰も来てくれなくて、それでも皆で、少しずつ分け合って暮らしている」", "「そうか」", "「だから、誰かが行かなきゃって」", "それだけだった。オオナムチは、それ以上、語らなかった。", "ベルも、それ以上、聞かなかった。聞かなくても、分かった気がした。この青年は、報われない場所に、自分から足を向ける。理由は、損得ではなく、見過ごせないからだ。", "(魔界の、寄り添いの里のようだ)", "スサノが、群れの掟を破ってまで作った場所を、ベルは思い出した。ついて来られない者を切り捨てない、という、小さな意志。オオナムチの選択は、その意志と、どこか同じ色をしていた。", "「ベルさんは、どうして一緒に来てくれたんですか」", "今度は、オオナムチが尋ねた。", "「誰も受けない依頼を選ぶ人間を、見てみたかった」", "ベルは、正直に言った。嘘は、つきたくなかった。", "「それだけだ」", "「変わった人ですね」", "「よく言われる」", "実際は、言われたことなどなかった。ただ、そう答えるのが、なぜか自然だった。", "オオナムチが、小さく笑った。つられて、ベルも、口の端を上げた。", "ミナモの灯が、近づいてくる。橙色の光の中で、青年の横顔が、はっきりと見えた。ベルは、ふと、思った。", "(この青年は、いつか私に並ぶ)", "根拠は、なかった。ただ、予感があった。", "「また依頼があれば、声をかけてくれ」", "「え」", "「一人より、二人のほうが、報酬は半分だが、危険も半分になる」", "オオナムチは、目を瞬いた。それから、顔をくしゃりとさせて、笑った。", "「半分ずつ、ですね」", "「そうだ。半分ずつだ」", "二人の影が、夕焼けの道に、長く並んで伸びていた。"]}]}, {"id": "ch05", "label": "第五章", "title": "中立という名の森", "chars": 8763, "sections": [{"h": "一", "p": ["聖の森は、入口から音が違った。", "オオナムチは、一歩踏み入れて足を止めた。風が木々を渡る音はある。鳥の声も遠くに聞こえる。それなのに、人の気配だけが、すっと薄い。", "「静かだな」", "隣のベルが、低く言った。", "「見られている」", "「え」", "「枝の上に、三人。弓を構えてはいない。ただ、見ている」", "オオナムチは慌てて見上げたが、緑の葉が重なるばかりで、何も見えなかった。ベルには見えるらしい。この人は、時々こうして、自分の知らないものを見ている。", "ミナモのギルドで受けた依頼は、森への薬草の護衛だった。依頼主は森の外れに住む老薬師で、体が弱ってきたので荷を運ぶ者を探していたという。報酬は、前回よりは増えている。", "道の先の木陰に、小さな影が座っていた。", "「遅かったのう」", "しわがれた声だった。淡い緑の髪を後ろで束ね、尖った耳を持つ老人が、薬草籠を脇に置いて、切り株に腰かけている。顔の皺は深く、目だけが若者のように澄んでいた。", "「スクナ、と呼ばれておる。まあ、ただの薬師じゃ」", "「オオナムチです。こちらは、ベル」", "「ほう」", "スクナは、ベルの顔を見て、わずかに目を細めた。ほんの一瞬だった。それから、何も言わずに、籠を指さした。", "「それを背負ってくれ。わしの腰はもう、あまり言うことを聞かん」", "ベルは何も言わず、籠を背に負った。スクナは杖をつき、ゆっくりと歩き出す。", "「よろしく頼む。若いのと、もう一人の、何とも言えぬ若いの」", "オオナムチは首を傾げた。何とも言えぬ、とは、どういう意味だろう。"]}, {"h": "二", "p": ["森の集落は、木々の間に家が溶け込むように作られていた。", "幹をくり抜いた家、枝の上に渡された橋、地面に敷かれた苔の道。エルフたちは、行き交う二人の人間を見ても、足を止めなかった。ただ、視線だけを寄越す。冷たくもなく、温かくもない。そこに、何も乗っていない目だった。", "「ここの者は、見ても何も言わぬ」", "スクナが、杖をつきながら言った。", "「長く生きすぎたのでな。何を見ても、驚かぬ。何を聞いても、口を出さぬ。それが、この森の流儀じゃ」", "「中立、ということですか」", "「そう呼ぶ者もおる」", "スクナは、含みのある言い方をした。", "「ただ、何も言わぬことと、何も思わぬことは、違う」", "集落の広場に、小さな市が立っていた。薬草、木の実、織物。オオナムチは、並んだ品々を見ながら歩いた。", "一軒の店先で、若いエルフの女が、客の人間に、品物を投げるように渡していた。客は黙って受け取り、黙って去った。取引は、ただ、そこにあるだけだ。", "(噂では、エルフは人を見下していると聞いたけど)", "違う、と思った。見下しているのではない。関わらないのだ。誰とも、深くは。", "「ここの王は、どんな方なんですか」", "「クシナダ様か。美しい方じゃ。そして、傷ついておられる」", "スクナは、それ以上、語らなかった。", "ベルが、少し離れた場所で、立ち止まっていた。木の間の空を見上げている。その横顔を見て、オオナムチは、また、思った。", "(顔が、やっぱり、はっきり見える)", "広場にいたエルフたちは、ベルに視線を向けても、すぐに外した。まるで、そこに何もいないかのように。それなのに、自分には、ベルの睫毛の一本一本まで、見える。", "(目が、いいんだな、俺は)", "何度目か分からない、同じ結論を出して、オオナムチは歩き出した。"]}, {"h": "三", "p": ["コノハは、森の端の小さな家で、薬草を刻んでいた。", "幹と幹の間に、板を渡しただけのような家だ。集落の中心から、わざと離れて建っている。ここなら、誰にも干渉されない。誰も、自分に干渉しない。", "(それが、楽なのよ)", "そう自分に言い聞かせて、もう何年になるだろう。", "母はエルフで、父は人間だった。二人とも、もういない。母は長命の血を持ちながら、父を看取って間もなく、後を追うように亡くなった。残された自分は、尖った耳を持ちながら、寿命も背丈も中途半端な、どちらにもなれない存在になった。", "エルフからは「寿命の違う半端者」と呼ばれた。人間からは「耳の尖った異物」と呼ばれた。どちらの社会でも、少しだけ、よそ者だった。", "だから、期待しない。期待しなければ、傷つかない。", "包丁の音が、一定の間隔で、床に響く。", "扉を叩く音がした。", "「……入って」", "扉が開いて、顔を出したのは、スクナだった。", "「よう、コノハ。客を連れてきた」", "「客?」", "「冒険者じゃ。薬草の荷を運んでくれた。その礼に、茶を出してやってくれんか」", "「また勝手に」", "「頼む」", "スクナは、にやりと笑った。皺だらけの顔に、悪意はない。コノハは、小さくため息をついて、立ち上がった。", "「いいわよ。ただし、長居はさせないで」", "「分かっておる」", "家の入口に、若い人間の男が二人、立っていた。一人は、継ぎの当たった外套の青年で、緊張した顔をしている。もう一人は、背の高い黒髪の男。", "目が合った瞬間、コノハは、わずかに息を詰めた。", "(この人、何か違う)", "黒髪の男は、人間の姿をしているのに、森の木のような静けさを持っていた。長く生きた者の、動じない気配。それなのに、目の奥には、どこか、迷子のような色があった。", "「お邪魔します」", "青年が、頭を下げた。礼儀正しい。コノハは、少しだけ、毒気を抜かれた。", "「茶を出すわ。座って」", "その時、遠くで、角笛が鳴った。"]}, {"h": "四", "p": ["アマツ王の使者は、昼過ぎに到着した。", "クシナダの館は、森の中心にある大樹の洞を、そのまま広間にしたものだった。天井は遥か高く、枝の隙間から、柔らかい光が降りている。", "コノハは、人々の後ろの端に立っていた。呼ばれたわけではない。ただ、スクナに引っ張られて、来てしまった。ベルとオオナムチも、少し離れた場所に並んでいる。", "広間の奥に、クシナダが座っていた。白い衣をまとい、長い緑の髪を垂らした、美しい女王だった。顔は穏やかだが、膝の上で重ねた手の指が、わずかに強張っている。", "使者が、広間の中央に進み出た。", "穏やかな顔の、四十ほどの男だった。礼装は質素で、剣は帯びていない。柔和な目をしている。人好きのする、安心させる顔だった。", "「聖の森の女王陛下に、お目通りを賜り、光栄に存じます。ミナトと申します」", "声が、柔らかかった。", "「私は、争いを、心から憂えております」", "その言葉から、使者は話し始めた。", "「戦は、誰のためにもなりません。民が傷つき、家が焼け、子どもたちが泣く。陛下の森も、過去の戦で、多くを失われたと伺っております。そのお痛み、よく分かります」", "クシナダの指が、ぴくりと動いた。", "「だからこそ、お願いに上がりました。この戦を、一刻も早く終わらせるために。魔族という脅威を、取り除くために。どうか、森の力をお貸しいただきたいのです」", "コノハは、息を潜めて聞いていた。", "(うまいわね)", "反射的に、そう思った。穏やかで、共感から入る。相手の痛みを先に認めてから、要望を出す。気づかないうちに、聞く側が、頷く準備をしてしまう。", "「魔族は、話の通じない者たちです」", "ミナトは、静かに続けた。", "「彼らは、約束を守らず、人を欺きます。和平を装って、我が国の使節を襲ったこともございます。そのような者たちと、共に生きることは、できません」", "(和平会談では、逆だったと聞いたけど)", "コノハは、そこで、引っかかった。ただ、その違和感は、すぐに薄れた。使者の声が、心地よかった。", "「陛下の民を守るためにも、これしかないのです。魔族は、危険です。あなた方の森を、いつか焼くかもしれません」", "「……そうかもしれぬ」", "クシナダが、小さく呟いた。", "その声に、コノハは、はっとした。", "(王が、揺れている)", "穏やかな使者の言葉は、止まらなかった。", "「魔族は、決して、分かり合えぬ者たちです。争いを終わらせたいのは、同じはず。そのためには、森の力が必要なのです」", "言い方が、少しずつ違った。それなのに、言っていることは、同じだ。魔族は危険。分かり合えない。力が必要。何度も、形を変えて、繰り返される。", "コノハの頭の中に、その言葉が、染み込んでいった。", "(そうかもしれない)", "(だって、私は、何度も傷ついた)", "(魔族が悪いんだ)", "違う。何かが、違う。それなのに、考えがまとまらない。", "「そして」", "ミナトの目が、ふと、広間の端のコノハに向いた。", "「あなたも、この森の民の一人ですね」", "コノハは、息を呑んだ。", "「あなたの苦しみも、私には、分かります。居場所を求めて、傷つき、それでもここにいる。あなたも、この森の、大切な民の一人です。守られるべき、一人です」", "(民の、一人)", "胸の奥で、何かが、震えた。", "その言葉は、ずっと欲しかった。エルフからも、人間からも、一度も言われたことのなかった言葉だった。使者は、初めて会ったばかりの自分に、あっさりとそれを差し出した。", "(この人は、分かってくれる)", "足が、半歩、前に出た。", "そこで、気づいた。", "(待って)", "今、自分の考えが、誰かの言葉に寄っていっている。さっきまで、自分は、使者の話に違和感を覚えていた。和平会談の件が、逆だと。それなのに、いつの間にか、魔族が悪いと思い始めていた。", "(これは、私の考えじゃない)", "爪が、掌に食い込んだ。痛みが、頭を少しだけ、はっきりさせた。", "「……民の一人、ね」", "コノハは、小さく呟いた。声は、震えていなかった。", "「そう言われたかった。ずっと。だからこそ、分かる」", "ミナトが、穏やかな顔で、コノハを見た。", "「あなた、言葉が上手すぎるわ」", "広間が、静まった。", "コノハは、顔を上げた。胸の鼓動が、速い。それでも、言葉は、止まらなかった。", "「欲しい言葉を、ちょうどいい順番で、くれる。それは、親切じゃない。罠よ」", "使者は、微笑んだままだった。ただ、その微笑みが、わずかに固まった。"]}, {"h": "五", "p": ["森の奥へ続く道は、昼でも暗かった。", "ベルは、スクナの後を、静かに歩いていた。使者の来訪を見届けたあと、老薬師が、「見せたいものがある」と言って、二人を連れ出したのだ。コノハも、無言でついてきた。", "苔むした岩の陰に、洞窟があった。入口には、結界の気配がある。エルフの術だ。スクナが杖で、軽く地面を叩くと、結界が、ほどけた。", "中は、意外なほど、広かった。", "壁際に、藁が敷かれ、人影が、いくつも横たわっていた。傷に包帯を巻かれ、疲れ切った顔で、息を潜めている。額に角を持つ者、背に黒い翼を持つ者、獣の耳を持つ者。", "魔族だった。", "オオナムチの足が、止まった。息が、止まった。", "「……魔族」", "「静かに」", "コノハが、低く言った。", "「怯えさせないで。みんな、怪我人よ」", "ベルは、何も言えなかった。", "洞窟の中の魔族たちが、こちらを見ていた。警戒の目。怯えの目。そして、その中に、一人、若い鴉族の女がいた。腕に深い傷があり、顔は青ざめている。ベルの方を見て、少しだけ、目を細めた。", "(私を、知らない)", "分かっていた。この者は、ベルイザナの顔を見たことがない。一般の民として、魔王の姿は、遠い噂でしか知らない。", "「人間の方、ですか」", "若い鴉族の女が、掠れた声で言った。", "「怖がらないで。この方々は、味方よ」", "コノハが、傍らに膝をついた。", "「……味方」", "鴉族の女は、その言葉を、噛みしめるように繰り返した。", "「ありがたい。私たち、逃げてきたんです。会談のあと、国境の村が焼かれて」", "ベルの胸が、締めつけられた。", "「根の洲、の」", "「はい。家族と、離れ離れになって。どうなったか、分からない」", "女は、そこで、言葉を切った。唇が、震えている。", "ベルは、その場に、膝をついた。", "「何か必要なものはあるか」", "「いえ」", "女は、首を振った。", "「ここの方々が、よくしてくださっています。ただ」", "女は、ベルを見上げた。", "「あなたの目は、どこか、あの方に似ている」", "「あの方?」", "「私たちの、王様に。魔界の」", "ベルは、息を止めた。", "「優しくて、泣きそうな目をしていた。市場で、お会いしたことがあるんです。団子を、食べておられました」", "あの市場の、鴉族の店主の顔が、浮かんだ。団子の湯気。老婆の言葉。ベルは、膝の上で、拳を握った。", "「そうか」", "声が、かすれた。", "「その方は、きっとそなたらを案じている」", "「そうだと、いいですね」", "女は、少しだけ、笑った。", "その笑みが、痛かった。正体を明かすことは、できない。明かせば、この人々は、さらに怯える。力を見せれば、探知網に触れる。ここで魔王の名を名乗れば、全員の身が危うい。", "それでも、同胞の手の温かさは、確かに、あった。傷だらけの手が、そっと、ベルの手を握り返した。", "ベルは、その手を、そっと握り返した。力を込めすぎないように。壊さないように。", "(必ず、帰す)", "そう、胸の奥で、誓った。"]}, {"h": "六", "p": ["洞窟を出たあと、広間に戻ると、状況が一変していた。", "使者のミナトが、まだ、広間に残っていた。クシナダの前で、穏やかな声が、続いていた。", "「陛下、お考えを、お決めください。この森が、中立を保ち続けるのは、もう、限界です」", "クシナダの顔は、青白かった。指先が、小刻みに震えている。", "オオナムチは、広間の入口に立って、その光景を見ていた。", "(さっきから、ずっと、同じことを言っている)", "使者の言葉を、頭の中で、辿った。", "『魔族は危険です』", "『分かり合えない者たちです』", "『民を守るには、これしかありません』", "『争いを終わらせるには、力が必要です』", "言葉は、少しずつ違う。けれど、全部、同じことの繰り返しだった。", "(あれ)", "胸の奥で、小さな違和感が、膨らんだ。", "さっきから、自分も、頷きかけていた。使者の言葉が、耳に入るたびに、なぜか、納得してしまいそうになる。魔族は、危険なのだ、と。さっき、洞窟で、傷ついた魔族の人たちを見たばかりなのに。", "(おかしい。今、自分の考えが、誰かの言葉に、寄っていっている)", "ベルの教えが、蘇った。", "『痛みの形を、思い浮かべろ』", "違う。それとは、別だ。けれど、同じ根っこの、何か。守るための、言霊。", "オオナムチは、唇を動かした。", "「――心鎮め」", "誰に教わったわけでもない。ただ、胸の奥から、その名が浮かんだ。", "胸の中の霧が、すっと晴れた。", "視界が、鮮明になる。使者の声が、さっきまでとは違って聞こえた。柔らかな言葉の裏に、同じ型の言葉が、何度も何度も、積み重ねられている。", "オオナムチは、一歩、前に出た。", "「すみません」", "広間の視線が、集まる。クシナダも、ミナトも、こちらを見た。", "「さっきから、同じことを言い換えているだけじゃないですか」", "広間が、静まり返った。", "「魔族は危険、分かり合えない、これしかない。言い方を変えているだけで、中身は、一つだ」", "ミナトは、微笑んだまま、動かなかった。ただ、その目の奥が、わずかに揺れた。", "「何を、仰っているのか」", "「あなたは、どうしてそう思ったんですか」", "オオナムチは、まっすぐに、尋ねた。", "「魔族が危険だって。誰かに、そう聞いたんですか。それとも、自分で、会って、確かめたんですか」", "ミナトは、口を開いた。", "「それは」", "言葉が、出てこなかった。", "「それは、私が、王の」", "そこで、途切れた。", "使者の顔から、柔和な笑みが、消えていった。代わりに、戸惑いが、浮かんだ。自分の考えを辿ろうとして、辿り着けない人の顔だった。", "「私は、なぜ」", "ミナトは、自分の額に手を当てた。", "「なぜ、そう、思ったのだったか」", "クシナダが、立ち上がった。", "大樹の洞の光が、彼女の緑の髪を照らしていた。その顔に、もう、揺らぎはなかった。", "「使者殿」", "穏やかな、けれど芯のある声だった。", "「あなたもまた、傷ついた者なのですね」", "ミナトは、顔を上げた。茫然とした目で、女王を見た。", "「私は、戦の痛みを知っています。二度と、争いに加わらぬと、誓いました。その誓いは、今も変わりません」", "クシナダは、ゆっくりと、言葉を続けた。", "「ですが、中立とは、何もしないことではない。助けを求める者を、拒まないことです。この森は、今後も、そうあります」", "広間に、静かな風が、吹き抜けた。", "「参戦は、お断りします」", "ミナトは、深く、頭を下げた。顔を上げた時、その目には、困惑だけが、残っていた。", "「……報告に、戻ります」", "それだけを言って、使者は、広間を去った。", "スクナが、杖を持ち替えて、小さく頷いた。", "オオナムチは、足から力が抜けて、そのまま、その場に座り込みそうになった。誰かが、肩を支えた。コノハだった。", "「……やるじゃない」", "小声で、そう言われた。", "「私も、危なかった。あなたの言葉で、完全に、目が覚めた」", "「俺は、ただ」", "「分かってる。ただ、気づいただけでしょ」", "コノハは、皮肉っぽく、口の端を上げた。けれど、その目は、少しだけ、潤んでいた。"]}, {"h": "七", "p": ["夜の森は、深く、静かだった。", "ベルは、洞窟の外の岩に腰かけていた。胸の中で、何度も、使者の顔を思い出していた。", "(ミナトは、被害者だ)", "あの困惑は、演技ではなかった。穏やかな顔の下に、何も知らない善意があった。自分が染められているとは、露ほども思わず、それが正しいと信じて語っていた。", "タケルと、同じだ。", "(敵は、人間ではない)", "その確信が、胸の奥で、静かに、形を取った。", "言霊で、人の心を、道具にする仕組み。善人ほど、深く染まる仕掛け。使者も、兵も、街の人々も、その中にいる。滅ぼすべきは、人ではなく、その仕組みだ。", "ベルは、手を空にかざし、言伝を唱えた。", "「オモイカ」", "返事は、すぐに来た。", "「ベルイザナ様。ご無事で」", "「ああ。頼みがある。魔族の一団を保護した。傷を負っている。受け入れを頼めるか」", "「ただちに手配します」", "オモイカの声は、冷静だった。", "「受け入れ先は、埴の里がよいでしょう。食も足り、守りも固い。ハニヤスに話を通します」", "「頼む」", "「ただ、一つ、ご注意を」", "声が、低くなった。", "「大穴の周辺は、人の王が警戒しているはずです。比良坂へ向かうなら、岐人を介するほかありません」", "「分かっている」", "「申し訳ありません、私は――」", "「それより」", "ベルは、穏やかに言った。", "「次の手を、聞かせてくれ」", "通信の向こうで、小さく息を吐く気配がした。", "「……はい。では、まず」", "夜が、深まっていった。", "森の影から、一人の男が現れた。", "寡黙な、背の高い男だった。人間と変わらぬ姿をしているが、足音がなく、気配が、ふっと薄い。目は、深い夜の色をしていた。", "「岐人のクナドと申します」", "男は、静かに、礼をした。", "「大穴の番人です。保護された方々を、お送りするよう、仰せつかりました」", "「誰から」", "「どなたからも」", "クナドは、わずかに、口の端を上げた。", "「ただ、通りがかりに、そういう気配を感じただけです」", "ベルは、男の目を見た。", "その目は、何もかも、知っているようだった。けれど、何も言わなかった。", "「お通りください」", "クナドは、そう言って、洞窟の方へ、歩いていった。", "(この男は、気づいている)", "直感で、分かった。ベルが何者か。ここで何を、しているか。それでも、彼は、何も問わない。", "それが、中立の意味なのだろう。", "魔族たちが、一人ずつ、洞窟から出てきた。傷ついた体を支え合い、クナドの後に続く。あの鴉族の女が、ベルの方を、振り返った。", "「ありがとうございました」", "ベルは、何も言えなかった。ただ、小さく、頷いた。", "一行は、闇の中へ、消えていった。"]}, {"h": "八", "p": ["オオナムチは、眠れなかった。", "森の家の、板張りの部屋で、横になっていたが、目が冴えていた。魔族の人々の顔が、頭から離れなかった。傷ついた腕。怯えた目。それでも、礼を言った声。", "(あれが、魔族)", "教えられてきたものとは、まるで違った。", "人間界で聞いてきた、「話の通じない者たち」は、どこにもいなかった。ただ、傷つき、逃げてきた人々が、いただけだ。", "外で、物音がした。", "オオナムチは、静かに起き上がり、窓の隙間から、外を覗いた。", "月明かりの森の道を、いくつもの影が、歩いていった。先頭には、見知らぬ男。その後ろに、傷ついた者たちが、並んで続く。", "最後尾に、ベルがいた。", "ベルは、立ち止まって、去っていく背中を、長く見送っていた。顔は、月に照らされて、はっきりと見えた。その表情は、寂しそうで、そして、安堵していた。", "オオナムチは、気づいた。", "(ベルさんは、あの人たちを、知っている)", "どうやって知り合ったのか、分からない。ただ、あの目は、他人を見る目ではなかった。同胞を見送る目だ。", "胸の奥で、小さな疑問が、浮かんだ。", "(この人は、何者なんだろう)", "聞きたかった。直接、問いただしたかった。", "けれど、オオナムチは、窓から離れた。", "(いつか、話してくれる時が、来る)", "そう、思った。それまで、待とう、と。", "ベルは、自分に何も強いなかった。助けてくれた。教えてくれた。笑ってくれた。それだけで、十分だった。", "差別を知っているオオナムチは、理由を問われることの痛みを、知っていた。理由を言えなくて、黙るしかない苦しさも、知っていた。", "(信じよう)", "そう、決めた。", "翌朝、森の出口で、スクナが待っていた。", "「行くのか」", "「はい。ミナモに戻ります」", "「そうか」", "老薬師は、懐から、薬草の小さな包みを取り出した。", "「持っていけ。傷薬と、痛み止めじゃ」", "「ありがとうございます」", "オオナムチは、両手で受け取った。ふと、スクナが、じっと、自分を見ていることに気づいた。", "「若いの」", "「はい」", "「守る力は、よい。だが、守るだけでは、人は救えぬ時が来る」", "スクナの声は、静かだった。", "「その時までに、癒やす手を、磨いておけ。傷を塞ぐのではない。命を、繋ぐ手じゃ」", "「命を、繋ぐ」", "「そうじゃ」", "スクナは、杖に体重を預け、にやりと笑った。", "「わしの手には、もう、余るがの。おぬしなら、いつか、届くかもしれん」", "オオナムチは、包みを、強く握りしめた。", "森の入口に、ベルが立っていた。朝日が、木漏れ日になって、その肩に降りていた。コノハが、少し離れた場所で、腕を組んで、こちらを見ている。", "「行くんでしょ」", "「ああ」", "「……また来なさいよ」", "コノハは、そっぽを向いて、言った。", "「別に、待ってるわけじゃないけど」", "オオナムチは、笑った。ベルも、口元を、わずかに緩めた。", "聖の森の木々が、背後で、静かに、風にそよいだ。中立と呼ばれた森は、二人の旅人を、見送っていた。"]}]}, {"id": "ch06", "label": "第六章", "title": "炉の火は消えず", "chars": 6481, "sections": [{"h": "一", "p": ["炉ヶ岳の山道は、足の裏から熱が伝わってくる。", "オオナムチは、背の荷を揺すり上げた。ミナモのギルドで受けた依頼は、鉱山の里への資材運搬だった。鉄の延べ棒と炭の袋が、肩に食い込む。隣を歩くベルは、同じ量を背負いながら、息ひとつ乱していない。", "「重くないんですか」", "「重い。顔に出ないだけだ」", "嘘だろう、と思ったが、オオナムチは黙って足を進めた。", "山の中腹を越えると、谷間に里が見えた。岩肌に張りつくように、石造りの工房が並んでいる。どの煙突からも、白い煙が上がっていた。金槌の音が、谷じゅうに響いている。一定の拍で、休みなく。", "(音は元気なのに)", "里に入ると、すぐに分かった。槌を振る職人たちの腕は力強いのに、目の下に、深い隈がある。誰も笑っていない。背の低いがっしりした体格のドワーフたちが、口を結んで、黙々と鉄を打っている。", "「荷はそっちだ。そこに降ろせ」", "素っ気ない声が、頭の上から降ってきた。", "見上げると、工房の入口に、若い女が立っていた。煤で黒くなった前掛けに、太い腕。短く刈った赤茶の髪が、汗で額に張りついている。人間の娘にしては背が低く、肩幅が広い。ドワーフだ。", "「聞こえなかったか。そこだ」", "「あ、はい」", "オオナムチは、荷を降ろした。女は、腕を組んだまま、冷たい目で二人を見下ろした。", "「人間の冒険者か。悪いが、今日は愛想よくしてやる余裕がない。降ろしたら、さっさと帰りな」", "「カナメ、客人に失礼だぞ」", "奥から、低い声がした。", "工房の暗がりから、赤い髭を胸まで垂らした老人が、ゆっくりと出てきた。背は低いが、山のような存在感がある。腕は丸太のように太く、皺だらけの掌は、鉄の色に染まっていた。", "「イシコリドメだ。この里を預かっている」", "「オオナムチです。こちらはベル」", "「そうか。遠いところを、ご苦労だった。今夜は泊まっていけ。山の夜は冷える」", "老人の声は、静かで、深かった。ただ、その目は、オオナムチたちを通り越して、遠くの何かを見ていた。", "(この人も、疲れている)", "炉の火が、里のあちこちで、赤く燃えていた。その熱気の中で、誰もが、火の番をするように、黙って働いていた。"]}, {"h": "二", "p": ["納品の日は、朝から空気が違った。", "カナメは、工房の前に並べた刃を、布で磨いていた。百本の剣。三十領の鎧。期限は今日の昼で、一本も欠けてはならない。", "(百本。こんな数、人の手で打てるものか)", "それでも、打った。里中の職人が、三晩、寝ずに打った。祖父も、炉の前に座り続けた。腕が、痺れて上がらなくなるまで。", "蹄の音が、谷に響いた。", "馬に乗った官吏の一行が、里の門をくぐった。白い官服の男が先頭に立ち、後ろに兵が二十人。その中に、書類を抱えた中年の男がいた。落ち着いた目の、地味な顔立ちの男だ。検品官だと、聞いている。", "「イシコリドメ殿。戦時特別発注の納品を、受け取りに参りました」", "官吏は、馬上から、笑顔で言った。", "「期日は今日。数量は、百と三十。間違いありませんな」", "「揃えてある」", "イシコリドメは、短く答えた。", "「結構。ただし、追加のご連絡が」", "官吏は、懐から巻物を取り出した。", "「次の発注は、倍になります。期限は、十日後」", "カナメの手が、止まった。", "「倍だと」", "誰かが、呟いた。工房の影から、職人たちが、ざわめいた。", "「無茶だ。今でさえ、限界だ」", "「限界かどうかは、こちらで判断します」", "官吏の笑みは、少しも崩れなかった。", "「お断りになる場合は、残念ですが、炉ヶ岳との交易を停止せざるを得ません。鉄も、炭も、食糧も、止まります。里の皆様が、困りますな」", "カナメは、拳を握った。", "(ふざけるな。頼んでいるふりをして、首を絞めているだけじゃないか)", "怒鳴りたかった。刃を叩きつけたかった。けれど、祖父は、動かなかった。", "イシコリドメは、赤い髭の下で、口を結んだまま、しばらく官吏を見つめていた。長い沈黙のあと、静かに、頭を下げた。", "「承知した」", "その背中が、カナメには、ひどく小さく見えた。"]}, {"h": "三", "p": ["夕暮れの工房で、カナメは、祖父の前に立ちはだかった。", "「なぜ受けたの」", "声が、震えた。", "「倍だよ。十日で、倍。里の誰かが倒れる。倒れなくても、腕が壊れる。それでも、頭を下げるの」", "祖父は、炉の前に座っていた。火に照らされた横顔は、岩のように動かない。", "「答えて」", "「……」", "「戦いたくないの。私たちは、ただの道具なの。人間に命令されて、人間の戦のために刃を打つ。それが、誇りなの」", "「カナメ」", "祖父が、やっと口を開いた。", "「炉に、薪を足してくれ」", "「話を逸らさないで」", "「頼んでいる」", "その声には、怒りも、言い訳もなかった。ただ、疲れ果てた老人の、静かな響きがあった。カナメは、唇を噛んで、薪を取った。", "炉の火が、ぱちりと爆ぜた。", "祖父は、火を見つめたまま、何も言わなかった。カナメは、その背中を睨みつけた。", "(私は、こんな腰抜けにはならない)", "そう思った。思って、すぐに、胸の奥が、きゅっと痛んだ。祖父の手が、わずかに震えていたことに、気づいてしまったからだ。"]}, {"h": "四", "p": ["納品された武具が、広場に並べられた。", "官吏たちが検品を始めるまで、少し間がある。ベルは、その隙に、並べられた剣の一本を手に取った。", "重さは、申し分ない。刃の曲線も、美しい。里の職人の腕は、確かだ。ただ、柄を握った瞬間、指先に、妙な感触が走った。", "(これは)", "冷たい、薄い膜のようなものが、刃の表面に、貼りついている。鍛冶の工程で生まれたものではない。後から、誰かが、上から塗り重ねたものだ。", "ベルは、静かに息を整えた。言霊の質を、探る。細く、粘りのある、穏やかな響き。甘言と刷り込みの手触り。", "(アマツ王)", "間違いない。王の言霊が、この剣に、刻まれている。握る者の心に、少しずつ染み込み、反魔族の思想を深めていく仕掛けだ。", "(ここで口にすれば、里が危ない)", "力を使えば、阻害ゲージが削れる。見抜いたことが官吏に知られれば、ドワーフ全体が疑われる。ベルは、剣を元に戻し、別の方法を探した。", "隣で荷を整理していたイシコリドメに、ベルは、声をかけた。", "「少し見ていただけぬか」", "「何だ」", "「この刃だ。素人の目だが」", "ベルは、剣の刃を、光に傾けた。", "「職人の仕事は見事だ。ただ、表面だけ艶が違う。鍛えの艶ではない。何かが上から足されているように見える」", "イシコリドメの目が、細くなった。", "「どういう意味だ」", "「私には分からぬ。ただ、そう見える」", "老人は、剣を受け取った。親指で、刃の表面を、ゆっくりとなぞる。何度も、何度も。やがて、その指が、止まった。", "ベルは、何も言わず、一歩、下がった。ここから先は、職人の仕事だ。"]}, {"h": "五", "p": ["イシコリドメの手の中で、剣が、小さく鳴った。", "(違う)", "指の腹が、告げていた。自分が打った刃ではない。いや、刃そのものは、自分たちの仕事だ。だが、その上に、薄く、別の何かが、貼りついている。", "火で焼き入れる前の、素地の感触を知っている。研ぎ上げた後の、鏡のような手触りも知っている。この膜は、そのどちらにも、属さなかった。", "(術師の細工か)", "視線を上げた。広場の隅で、官吏の連れた術師らしい男たちが、納品された剣に、手をかざしていた。唇が、小さく動いている。", "胸の奥で、何かが、煮え立った。", "怒りだった。五十年、鉄を打ってきた。里の者も、皆、そうだ。一本の刃に、命を懸ける。使う者の命を預かる品だと、知っているからだ。それを、人を染める道具に、作り替えている。", "(儂らの仕事を、何だと思っている)", "拳が、剣の柄を、きしむほど、握りしめた。", "その夜、イシコリドメは、炉の前から動かなかった。", "火を見つめた。赤い炎が、ゆらめく。五十年、この火と、生きてきた。里の者の暮らしも、この火の上に、立っている。", "断れば、交易が止まる。炭も、食糧も、途絶える。里の子どもたちが、飢える。受ければ、人を染める刃を、世に送り出すことになる。", "(どちらを選んでも、地獄だ)", "朝まで、炉の火は、静かに、揺れていた。", "夜明け前、イシコリドメは、立ち上がった。", "「皆を集めろ」", "工房の前に、職人たちが集まった。カナメも、眠そうな目で、立っていた。", "「刃に、細工があった」", "イシコリドメは、低く、言った。", "「官吏と術師が、儂らの打った剣に、言霊を足している。使う者を染める、悪い術だ」", "職人たちが、ざわついた。", "「ならば、納めるな」", "「そうだ、もう一本も打つな」", "「待て」", "イシコリドメが、片手を上げた。ざわめきが、止まる。", "「断れば、里が潰れる。それは、お前たちも分かっているはずだ」", "誰も、答えなかった。", "「だから、作る」", "老人は、ゆっくりと、言った。", "「頼まれた品質では、作る。だが、人を染める道具には、せん」", "「どういう、意味だ」", "カナメが、尋ねた。", "「刃の芯に、層を仕込む。術を受け付けぬ、鉄の層だ。表面に、どんな言霊を刻まれても、芯で、跳ね返す。刻印は、空回りする」", "職人たちの顔が、ゆっくりと、変わっていった。", "「ただし、一人の職人が、全体を作ってはならぬ。官吏に勘づかれる。工程を分け、それぞれが、自分の持ち場しか知らぬようにする。全体の姿を知るのは、儂だけだ」", "「爺さま」", "カナメの声が、掠れていた。", "「それって」", "「黙って、一泡吹かせる」", "イシコリドメは、赤い髭の下で、にやりと笑った。", "「職人の戦い方は、腕で勝負することだ。声を上げて殴りつけるのは、儂の流儀ではない」", "カナメの目が、見開かれた。それから、ゆっくりと、唇を噛んだ。涙が、一筋、頬を伝った。", "「……最初から、そのつもりだったの」", "「ああ」", "「教えてくれたら、よかったのに」", "「お前は、顔に出るからの」", "老人は、孫の頭を、無骨な手で、くしゃりと撫でた。"]}, {"h": "六", "p": ["検品官コトシロは、宿舎の机に、報告書を広げていた。", "最終検品の夜。納品された百本の剣を、すべて確認し終えた。外見も、重さも、注文通りだ。研ぎも、刃筋も、申し分ない。", "ただ、一本だけ、気になる剣があった。", "(芯が)", "検品の際、剣の重心を確かめるために、指で叩いた。その響きが、わずかに、違った。通常の鉄より、芯が、締まっている。表面と、内側で、音が、違うのだ。", "(層が、入っている)", "目利きとして、二十年、この仕事をしてきた。間違いない。ドワーフたちは、剣の芯に、何かを仕込んでいる。刻印の術を、弾く層だ。", "(報告すれば、里は粛清される)", "官吏に告げれば、すぐにでも、兵が動く。炉ヶ岳は、反逆の里として、焼かれる。職人たちは、捕らえられるか、殺される。", "(黙れば、私が、罪に問われる)", "筆を、取った。報告書の最後の項に、「異常あり」と書き始めた。", "『異――』", "手が、止まった。", "墨が、紙に、滲んだ。", "(私は、何をしようとしている)", "窓の外から、鉄を打つ音が、聞こえた。夜更けなのに、まだ、誰かが、槌を振るっている。コトシロは、筆を置いて、窓辺に立った。", "工房の炉の前に、老人が、座っていた。", "イシコリドメだった。一本の刃を、膝に載せ、黙々と、磨いていた。", "その刃は、納品用ではなかった。表面に、傷がある。焼き入れの失敗で、廃棄になった一本だ。誰の手にも渡らず、誰にも見られない、ただの屑鉄だった。", "それでも、老人は、手を抜かなかった。布を替え、砥石を替え、何度も、何度も、磨き上げていた。", "(なぜ)", "コトシロには、分からなかった。", "「誰にも見られない品でも、仕事は仕事だ」", "昼間、老人が、若い職人に、そう言っていたのを、思い出した。", "炉の火が、老人の顔を、赤く照らしていた。皺だらけの顔に、一点の曇りもなかった。ただ、鉄と向き合う人間の、静かな顔だった。", "コトシロは、気づいた。", "(私は、この人の仕事を、潰すために、ここにいるのか)", "違う、と、胸が、告げていた。", "自分の目は、二十年、良い品と、悪い品を、見分けるために、磨いてきた。人の仕事を、正しく見るためのものだった。誰かを、断罪するための目ではない。", "窓から、離れた。机の前に戻り、書きかけの報告書を、手に取った。"]}, {"h": "七", "p": ["朝、コトシロは、報告書を官吏に提出した。", "『全数、検品完了。品質、注文通り。問題なし』", "官吏は、一瞥しただけで、受け取った。", "「ご苦労。ならば、納品は受領した」", "術師たちが、刻印の儀式を終えて、満足そうに頷いていた。剣は、馬車に積まれ、里を出ていった。", "コトシロは、その後ろ姿を、黙って見送った。胸の中で、何かが、静かに、燃えていた。恐れも、後悔も、あった。けれど、それ以上に、不思議なほど、澄んだ感情が、そこにあった。", "(私の目は、人を守るために、使う)", "そう決めた。たった一枚の報告書で、それは、取り返しのつかない決断になった。", "荷造りを終えて、里の門に向かう途中、ベルと、すれ違った。", "コトシロは、足を止めた。", "「ベル殿」", "「はい」", "「あなたは、あの剣の細工に、最初から気づいていましたね」", "ベルは、答えなかった。ただ、静かに、コトシロを見つめた。", "「何も、言わなくて結構です」", "コトシロは、小さく、頭を下げた。", "「ただ、一言だけ、申し上げます」", "顔を上げた。", "「いつか、私の目が、役に立つ日が来るかもしれません。その時は、遠慮なく、お呼びください」", "ベルの目が、わずかに、見開かれた。それから、ゆっくりと、頷いた。", "「感謝する。覚えておく」", "コトシロは、役人の外套を翻し、馬車の列に、戻っていった。その背は、来た時より、少しだけ、まっすぐになっていた。"]}, {"h": "八", "p": ["最後の日の朝、オオナムチは、工房の隅で、炉の番をしていた。", "「火を、見ておけ」", "年老いた炉番の職人が、そう言って、彼の隣に腰を下ろした。無口な男で、里に着いてから、ほとんど口を利いていなかった。", "「火は、怖いか」", "「少し」", "オオナムチは、正直に答えた。", "「俺の故郷では、火は、家を焼くものでした。差別をする人たちが、集落に、火を放ったことがあって」", "「そうか」", "炉番は、静かに、頷いた。", "「火は、確かに、壊す」", "赤い炎が、ゆらめく。", "「だが、それだけではない。鉄を、見ろ」", "炉の中で、鉄の塊が、橙色に光っていた。炎に包まれて、形を失いかけている。", "「この鉄は、火に焼かれて、一度、壊れる。形を失う。だが、そこから、打ち直される。刃になる。鍬になる。鍋になる」", "炉番は、火箸で、鉄を、そっと、持ち上げた。", "「火は、壊すだけではない。作り直す力でもあるんだ」", "オオナムチは、その鉄を、じっと見つめた。", "胸の奥に、燻っていたものが、あった。差別への怒り。理不尽への悔しさ。ずっと、行き場のなかった熱。それは、誰かを焼くためのものだと、思っていた。", "(違う)", "作り直すための、火だ。壊された場所を、もう一度、組み直すための。", "「――火種」", "唇が、動いた。", "指先に、小さな炎が、灯った。ゆらめく赤い光が、掌の上で、静かに、揺れた。熱くはなかった。ただ、温かかった。", "炉番が、目を細めた。", "「それが、お前の火か」", "「はい」", "オオナムチは、掌の炎を、見つめた。", "(これを、誰かを、守るために使う)", "そう、心に決めた。", "里を出る朝、霧が、谷に立ち込めていた。", "門の前に、カナメが、腕を組んで立っていた。", "「行くのか」", "「はい」", "「そう」", "カナメは、そっぽを向いて、言った。", "「別に、見送りに来たんじゃない。たまたま、ここにいただけ」", "「はい」", "オオナムチは、笑った。", "「……爺さまに、教えてもらった」", "カナメが、ぽつりと、言った。", "「黙って、一泡吹かせるって。逃げでも、弱腰でも、ないんだって。戦い方の、一つなんだって」", "「そうですね」", "「私、ずっと、勘違いしてた」", "カナメは、唇を噛んだ。", "「あんたたち、また、困ったことがあったら、来な。腕なら、貸す」", "不器用な言葉だった。けれど、オオナムチには、それが、何より、嬉しかった。", "「ありがとうございます」", "その時、隣で、ベルが、足を止めた。", "ベルは、空を見上げていた。風が、何かを運んできたような顔をしていた。耳の奥で、言伝が、響いたのだろう。表情が、わずかに、変わった。", "ほんの、一瞬だった。いつも穏やかなベルの顔に、鋭い影が差し、すぐに、消えた。", "(何か、あったんだ)", "オオナムチは、気づいた。けれど、問わなかった。", "ベルは、何事もなかったように、微笑んだ。", "「行くぞ」", "三人は、霧の山道を、下り始めた。", "背後で、炉の煙が、白く、空へ昇っていった。里の火は、まだ、消えていない。誰かの手の中で、静かに、燃え続けていた。"]}]}, {"id": "ch07", "label": "第七章", "title": "井戸の水を、皆で", "chars": 12299, "sections": [{"h": "一", "p": ["獣ノ原の境には、杭が打たれていた。", "ウズメは、岩の上に胡坐をかいて、それを眺めていた。細い木の杭に、赤い布が巻かれている。人族の入植者が「ここから先は我々の土地だ」と主張して、昨日のうちに打ち込んでいったものだ。引き抜いても、翌朝には、別の杭が立つ。", "(まったく、毎朝毎朝、杭の数ばっかり増えて)", "尻尾の先で、岩の表面を、ぱしんと叩いた。猫に似た耳が、風の向きを探って動く。栗色の毛並みは、日に焼けて少し褪せていた。", "ギルドの依頼書を受けた冒険者が、今日、境に着く。井戸の修繕資材を運んでくる、人間の二人組だという。サルタヒコ様の命で、案内を務めることになった。", "(人間の冒険者なんて、来てくれるだけで奇跡だけどさ)", "街道の向こうに、人影が見えた。ウズメは、岩から飛び降りた。", "「やあやあ、遠路はるばる！ 獣ノ原の斥候、ウズメだよ。足が速くて、口が早くて、あとは……まあ、いい女！」", "名乗って、にっと笑う。笑って見せるのは、癖だった。初対面の人間は、たいてい、身構えている。笑ってしまえば、身構えは半分、緩む。", "荷を背負った青年が、きょとんとして、それから、ぺこりと頭を下げた。", "「オオナムチです。ギルドの依頼で来ました」", "継ぎの当たった外套に、すり減った靴。腕には、犬に噛まれたらしい古い痕がある。", "(へえ。ちゃんと頭を下げる人間だ)", "少し、驚いた。", "「で、こっちの人が」", "オオナムチが、隣を示した。", "背の高い黒髪の男が、立っていた。ウズメは、その男を見て、目を瞬いた。見たはずだった。確かに、いま、目の前にいる。それなのに、視線をそらした途端、顔の輪郭が、ふっとほどけていく。", "「ベルだ。よろしく頼む」", "声は、覚えた。低くて、静かで、耳に残る。だが、顔が、どうしても、頭に留まらなかった。", "(なんだ、この人)", "首を傾げかけて、やめた。冒険者には、変わり者が多い。深追いは、しない。", "「じゃ、行こうか。道々、見ておいたほうがいいものがある」", "境を越えると、獣ノ原の景色が、変わった。", "広い荒野に、背の低い灌木が点々と茂っている。その合間に、小さな集落の跡が、いくつも見えた。屋根が落ち、壁が煤けて、畑の畝が踏み荒らされている。", "「入植者が来る前は、あの辺に、水場があったんだ」", "ウズメは、指さした。", "「焼かれた。井戸の中に、石と泥を投げ込まれて。水が飲めなくなった家族は、移るしかなかった」", "軽い調子で言った。言ったつもりだった。声の端が、少しだけ、かすれた。", "「あたしの生まれた村も、あの辺りさ」", "オオナムチは、黙って焼け跡を見ていた。ベルも、何も言わなかった。同情の言葉が出てこないのが、かえって、ありがたかった。", "「いやあ、ごめんごめん。暗い話をするつもりはなかったんだ。笑える話もあるんだよ。この前なんか、入植者の見張りが、あたしの尻尾を踏んで、悲鳴を上げて」", "「ウズメさん」", "オオナムチが、静かに、遮った。", "「笑わなくても、いいですよ」", "足が、一瞬、止まった。", "「……あんた、変な人間だね」", "「よく言われます」", "ウズメは、前を向いて、歩き出した。目の奥が、熱かった。気づかれたくなくて、速足になった。", "(笑っていないと、もたないんだ。ずっと、そうしてきた)", "尻尾が、小さく、揺れた。", "道の先に、小さな集落が見えてきた。谷あいの、低い石垣に囲まれた里。煙突から、細い煙が上がっている。", "「葛の里。ここが、あんたの故郷だろ」", "オオナムチは、足を止めた。しばらく、その景色を見つめていた。", "「……はい」", "その声が、何かを抱えていた。", "(帰る場所があるっていうのは、いいね)", "ウズメは、心の中だけで、そう呟いた。羨ましい、と思ってしまう自分が、少し、悔しかった。"]}, {"h": "二", "p": ["葛の里の石垣の向こうから、小さな影が、飛び出してきた。", "「おじさん！」", "ハルだった。痩せた体で、一目散に駆けてくる。転びそうになりながら、オオナムチの腰に飛びついた。", "「ハル。どうして、ここに」", "「ひなた野、いられなくなったんだ。杭がいっぱい立って、水も、汲めなくなって」", "少年は、顔を上げた。目が、大きく見開かれている。", "「おばあちゃんも、みんなも、こっちに来たんだよ。ここなら、井戸があるって」", "オオナムチは、少年の頭に手を置いた。細い髪が、指の間で、ぱさぱさと鳴った。", "(ひなた野の人たちまで)", "胸の奥が、きゅっと軋んだ。あの薬を喜んでくれた老婆の、皺だらけの手を、思い出した。", "「そうか。よく、来たな」", "「うん。それでね、兄ちゃんからね、また手紙が来たんだ。ほら」", "ハルが、握りしめていた紙を、見せた。右に傾く、見慣れた字。", "『ハルへ。元気にしているか。街の暮らしにも慣れた。人族の方々に、とてもよくしてもらっている』", "オオナムチは、最後まで、読めなかった。", "その時だった。", "「いけませんぞ、走ると転びますぞ」", "里の門の方から、しわがれた声が飛んできた。", "白い髭を短く整え、杖をついた老人が、ゆっくりと近づいてくる。背は曲がっているが、目だけは、鷹のように鋭い。濃い藍色の古い外套をまとい、腰には、擦り切れた書物の包みを下げていた。", "「ヒエダと申す。この里の語り部をしておる」", "老人は、オオナムチをじろりと見て、鼻を鳴らした。", "「おぬしが、オオナムチか。ハルから、よく聞いておる。無茶ばかりする若者だ、とな」", "「え、そんなこと、言ってないよ」", "「言うておらんでも、顔に書いてある」", "ヒエダは、続いて、ベルに視線を移した。ほんの少し、目が細くなる。", "「そちらの御仁は」", "「ベルです」", "「ほう。ベル殿」", "老人は、礼儀正しく、頭を下げた。", "「あなた様は、ただの冒険者では、ありませんな」", "ベルは、わずかに首を傾けた。", "「そう見えますか」", "「見えますとも。この老骨の目は、まだ節穴ではござらん」", "「買いかぶりだ」", "「さようで。まあ、よろしい。詮索は、礼を欠く」", "ヒエダは、くるりと背を向けて、杖を鳴らした。", "「さあ、入られよ。茶くらいは出す。口の悪い婆さんの茶じゃが」", "葛の里は、小さな里だった。石造りの家が二十軒ほど、肩を寄せ合うように建っている。里の中央に、古い井戸があった。丸い石の縁は、長い年月で、すり減っている。", "その井戸の周りに、人が集まっていた。", "「あれは」", "ウズメが、眉をひそめた。", "馬に乗った一団が、里の門をくぐってきたところだった。腕に、白い腕章を巻いた兵が、十人ほど。先頭の馬に、若い男が乗っていた。", "オオナムチの息が、止まった。", "「ユウ」", "細い体。柔らかそうな栗色の髪の間から、猫に似た小さな耳が覗いている。目尻が、少し下がっている。腕に、人族の白い腕章を、誇らしげに巻いていた。", "ユウが、馬から下りた。里の人々を見渡し、それから、オオナムチの顔を見つけて、ぱっと、表情を明るくした。", "「オオナムチ！」", "駆け寄ってくる。", "「久しぶりだな！ 元気だったか。会いたかったよ」", "その声は、昔と同じだった。少しだけ高くて、人懐こい。オオナムチの胸が、熱くなりかけた。", "「ユウ、街で働いていたはずじゃ」", "「ああ。今は、王都の軍務局で働いてる。人族の方々に、取り立ててもらったんだ。すごいだろう」", "ユウは、目を輝かせた。", "「ようやく、俺にも居場所ができたんだ。亜人でも人間でも、関係ない。正しい側に、入れてもらえた」", "その言葉に、オオナムチは、背筋が冷たくなるのを感じた。", "(正しい、側)", "「今日は、里のみんなを守るために来たんだ」", "ユウは、里の人々に向き直った。", "「入植者との衝突が増えているだろう。だから、争いを避けるために、武器は、預からせてほしい。狩り用の刃物も、農具の鎌も、一時的に。亜人の安全のためだ」", "里がざわめいた。", "「鎌まで、取り上げるのか」", "「畑が、できなくなる」", "「安全のためだ」", "ユウは、穏やかに繰り返した。", "「何も、取り上げるわけじゃない。預かるだけだ。魔族と通じていると疑われないための、証明にもなる」", "「魔族となんぞ、通じておらん」", "「分かってる。だからこそ、疑われないように、しなくちゃいけない」", "その口調は、優しかった。人を傷つけるつもりは、少しもない。本気で、里を守るつもりで、言っていた。", "「兄ちゃん」", "ハルが、一歩、前に出た。", "「ハル！」", "ユウの顔が、ぱっと明るくなった。弟を抱き上げようと、両手を広げる。", "「大きくなったな。手紙、届いたか」", "「うん。届いた」", "「元気にしてたか。寂しくなかったか」", "「兄ちゃん、鎌を取り上げるって、本当なの」", "ハルは、まっすぐに、尋ねた。", "「みんな、困るよ」", "「大丈夫だ。ハルも、気をつけるんだぞ。魔族の味方をする人間は、危険だからな。そういう人がいたら、すぐに、兄ちゃんに教えるんだ」", "ハルの目が、揺れた。", "オオナムチは、足が動かなかった。目の前にいるのは、確かに、ユウだった。幼い頃、同じ井戸の水を飲んだ友人だった。それなのに、口から出る言葉が、どこか、他人のものに聞こえた。", "隣で、ヒエダが、杖の先で、地面を静かに叩いた。", "「……操られておるな」", "低い声が、風に溶けた。オオナムチは、はっとして、老人を見た。", "ヒエダの目が、ユウの背後を見つめていた。何かを、見ているようだった。", "「見破りじゃ。若いのの背に、細い糸のようなものが、張っておる。遠くへ、伸びておる」", "「糸、ですか」", "「言霊の根じゃ。王都まで、繋がっておる」", "老人は、小さく唇を噛んだ。", "「あの子は、本心から、善意でやっておる。それが、いちばん、始末に悪い」"]}, {"h": "三", "p": ["サルタヒコの広間は、里の外れの、大きな岩屋だった。", "ベルは、案内されるまま、中へ入った。壁には、獣の毛皮と、使い込まれた槍が、いくつも掛けられている。中央に、切り株をそのまま玉座にした席があり、一人の男が、どっかりと腰を下ろしていた。", "獅子のような男だった。濃い金色のたてがみが、肩まで流れている。腕は太く、胸板は厚い。ただ座っているだけで、広間の空気が、重くなる。", "「おう、来たか！ 人間の冒険者とは、珍しい」", "声が、岩屋に反響した。サルタヒコは、豪快に笑った。", "「井戸の資材、助かる。座れ座れ。ウズメ、酒だ酒！」", "「王様、昼ですよ」", "「昼も酒も、関係あるか」", "ウズメが、呆れた顔で、杯を運んでくる。ベルは、勧められるまま、腰を下ろした。オオナムチは、少し緊張した面持ちで、隣に座った。", "「さて」", "サルタヒコは、杯を一気にあおって、ベルを見据えた。", "「人間のお前らに、先に言っておく。獣ノ原は、今、ややこしい」", "「聞いている」", "「人族の軍が来た」", "大きな掌が、膝を叩いた。", "「俺たちは魔族と通じている、とよ。証拠は、何もねえ。ただ、角があるから、牙があるから、尻尾があるから、魔族の仲間だと決めつける」", "「それは」", "「見た目が似てりゃ、同類か。人間は、そう考えるらしい」", "サルタヒコの声は、笑っていた。目だけが、笑っていなかった。", "「俺は、魔族に加担する気は、さらさらねえ。向こうの王様にも、会ったことはねえ。ただ、人族の言いなりになる気も、ねえ」", "杯を、床に、どんと置いた。", "「俺たちは、誰の手下でもない。それが、獣ノ原の流儀だ」", "広間に、静寂が落ちた。", "ベルは、胸の奥が、締めつけられるのを感じた。この王は、魔界のために戦う気はない。それは、当然だった。ベルは、魔界の王として、この人々に何をした。何もしていない。それどころか、人族が亜人に向ける疑いの根は、魔族と人族の対立が、深めたものだ。", "(私の国の争いが、この人々を、巻き込んでいる)", "その事実が、重かった。", "「だが、突っぱねるほど、疑いは強まる」", "サルタヒコは、苦く笑った。", "「軍と、まともにやり合えば、一族が滅ぶ。耐えるしかねえ。耐えるのは、性に合わねえんだがな」", "「耐えるのも戦いと心得る」", "ベルは、静かに、言った。", "サルタヒコの目が、鋭く細まった。", "「ほう。言うじゃねえか」", "しばらく、じっと、ベルを見つめていた。", "「あんた、妙な目をしてやがる」", "「そうか」", "「人を殺したことのある目だ。それも、一人や二人じゃねえ」", "ベルは、表情を動かさなかった。", "「だが、今は、誰も殺したくねえって目だ。……変な男だな、あんた」", "サルタヒコは、そう言って、大きく笑った。それ以上は、尋ねなかった。ベルは、小さく息を吐いた。", "(獣の勘は、鋭い)", "力は、完全に抑えている。それでも、この王は、本質に触れかけた。しかも、それを、責めるでも、暴くでもなかった。", "「ああ、そうだ」", "サルタヒコが、思い出したように、言った。", "「明日、英雄が来るぞ。タケルとかいう勇者だ。人族の連中が、触れ回っている」", "ベルの指先が、杯の縁で、ぴくりと止まった。", "「視察、だとよ。亜人の暮らしを守るために来た、と」", "「それは」", "「建前だろうよ。軍の威光を、見せつけに来るんだ」", "サルタヒコは、鼻を鳴らした。", "ベルは、杯を、ゆっくりと置いた。", "(タケル)", "牢の中で、粥を残さず食べていた男。あの男が、明日、ここに来る。顔を、見られている。", "阻害は、完全だ。偽名の言霊が、顔の印象を、ぼかしてくれる。それでも、あの男の本能は、鋭い。", "隣で、オオナムチが、ベルを、ちらりと見た。何かを、感じ取ったように。けれど、何も言わなかった。"]}, {"h": "四", "p": ["ユウは、井戸の縁に立っていた。", "夜だった。月が、細く、雲の間から覗いている。里の人々は、寝静まっている。いや、息を潜めている。周囲には、白い腕章の兵たちが、松明を掲げて、並んでいた。", "(間違ってない)", "ユウは、心の中で、何度も、繰り返した。", "(俺は、間違ってない)", "街での日々が、思い出された。", "人族の職場で、誰よりも早く出勤した。誰よりも遅くまで、働いた。何を言われても、笑った。亜人の血が混じっている、という目で見られても、それでも、笑った。", "認められたかった。ただ、それだけだった。", "ひなた野で育った頃、自分は、どこにも属していなかった。亜人の子供たちからは、「人間寄りだ」と言われた。街に出れば、「亜人くさい」と言われた。居場所が、なかった。", "そんな自分に、ある日、声がかかった。", "『君の働きぶりは、素晴らしい。我々の仲間に、ならないか』", "白い礼装の、穏やかな声だった。顔は、よく思い出せない。ただ、あの声が、胸に、じんわりと染み込んだ。", "『君は、民の一人だ。守られるべき、大切な一人だ』", "それは、ずっと欲しかった言葉だった。", "その日から、頭の中に、温かい声が、住みついている。", "(正しい側に、いなさい)", "声は、いつも、優しい。迷った時には、背中を押してくれる。疲れた時には、肩を撫でてくれる。魔族は、危険だ。人族と共にいれば、守られる。亜人の同胞を守るためにも、人族に従うことが、最善なのだと。", "(そうだ。俺は、守るために、ここにいる)", "武器を預かれば、衝突は、避けられる。疑いが晴れれば、里は、安全になる。そう、信じていた。", "「ユウ殿」", "兵の一人が、近づいてきた。", "「供出は、まだ終わらぬか。時間がない」", "「あと少しです。老人たちが、渋っていて」", "「ならば、力で」", "「待ってください。乱暴は、不要です。話せば、分かってくれます」", "兵は、鼻で笑った。", "「お前は、甘い。亜人は、力で従わせねば」", "ユウの胸が、ちくりと痛んだ。それを、すぐに、押し込めた。", "(この人たちも、守るために、やっているんだ)", "その時、里の方から、声が上がった。", "「そこまでだ！」", "オオナムチが、井戸の前に、立ちはだかっていた。", "「ユウ。やめてくれ」", "その顔を見た瞬間、ユウの頭の中の声が、ざわついた。", "(あの者は、危険だ。魔族の味方だ。排除しなさい)", "「オオナムチ、どいてくれ」", "「どかない」", "「頼む。お前は、分かってくれると思っていた」", "「分かってる。お前が、悪い人間じゃないことは、誰より、分かってる」", "オオナムチの目が、まっすぐに、ユウを射た。", "「だから、やめてくれ。そんなの、お前の言葉じゃない」", "(違う)", "ユウは、首を振った。", "(これは、俺の、言葉だ)", "頭の中の声が、一層、強く響いた。", "(排除しなさい。それが、正しい)", "手が、勝手に、槍を握った。"]}, {"h": "五", "p": ["オオナムチは、目の前の幼なじみの顔が、ゆっくりと、遠のいていくのを感じた。", "(違う。これは、ユウじゃない)", "ユウの目は、焦点が合っていなかった。口元だけが、穏やかに笑っている。その笑顔が、かえって、不気味だった。", "背後で、兵たちが、剣を抜く音がした。里の人々が、悲鳴を上げた。", "「亜人の者ども、武器を渡せ！ 逆らえば、魔族の仲間として処断する！」", "怒号が、夜空を割った。ウズメが、短剣を抜いて、前に出る。ヒエダが、杖を構えた。", "オオナムチは、息を吸った。", "(心鎮め)", "胸の奥で、その名を呼んだ。使者の言葉から、自分の心を守った言霊だ。守りの膜が、体の周りに、立ち上がる。", "(守るだけじゃ、足りない)", "膜を、自分の外へ、押し広げた。ユウの方へ。声が、頭の中に流れ込んでいくのを、遮るように。細い糸が、あるはずだ。ヒエダの言った、王都へ繋がる根が。", "「ユウ！」", "叫んだ。", "「ひなた野の井戸、覚えてるか！」", "ユウの瞼が、わずかに、震えた。", "「夏の暑い日に、二人で、水を汲みに行った。桶が重くて、お前、転んで、全部こぼした。俺が笑ったら、お前、泣いて」", "「……」", "「それでも、もう一回、汲みに行った。二人で、桶を持って。最後まで、運んだ」", "ユウの槍が、かすかに、下がった。", "「あの時、お前は、言ったんだ。『居場所が、ほしい』って。『どこにも、ないから』って」", "「……オオ、ナムチ」", "ユウの唇が、動いた。目の奥に、一瞬だけ、昔の光が、戻った。", "「お前の居場所は、あるんだ！ ここに、あるんだ！」", "心鎮めの膜が、ユウの周りに、触れた。糸が、軋んだ。", "「あ」", "ユウが、顔を歪めた。", "「あ、頭が」", "槍が、手から、すべり落ちた。石畳に、乾いた音を立てて転がる。", "「俺、は……何を」", "その瞬間、兵の隊長が、叫んだ。", "「裏切りだ！ その男、魔族の肩を持つ気だ！ 斬れ！」", "「待て！」", "オオナムチの制止は、間に合わなかった。", "二人の兵が、剣を抜いて、ユウに飛びかかった。体勢を崩していたユウは、動けない。刃が、月の光を、鈍く跳ね返した。", "「ユウ！」", "その時、小さな影が、割って入った。", "ヒエダだった。", "杖を捨て、両手を広げ、ユウの前に立ちはだかった。老いた体が、刃を、受けた。", "「ぐっ」", "鈍い音がした。ヒエダの藍色の外套が、見る間に、黒く染まっていく。", "「ヒエダさん！」", "オオナムチの喉から、悲鳴が漏れた。", "老人は、膝をついた。それでも、ユウの前から、動かなかった。", "「この子は」", "荒い息の合間に、言葉が、絞り出された。", "「この子は、井戸の水を、一緒に飲んだ子供じゃ。操られておるだけじゃ」", "兵たちが、ひるんだ。老人の迫力に、剣を持つ手が、止まった。", "「責めるべきは、この子では、ない」", "その背後から、風が、吹いた。", "オオナムチは、見た。ベルが、静かに、足を踏み出したのを。何をしたのか、分からなかった。ただ、ヒエダの体の周りに、見えない膜が張られたように、流れ出していた血が、ふっと、止まった。致命の傷が、致命でなくなった。", "それは、ベルの力が、ほんの一瞬だけ、滲み出た瞬間だった。", "兵たちは、何も気づいていない。オオナムチだけが、それを、見ていた。", "「おじいさん……！」", "ユウが、崩れ落ちるように、老人の傍らに膝をついた。", "「俺、俺は」", "その顔は、涙で濡れていた。", "「なんで、こんな」", "「いけませんぞ」", "ヒエダは、血の気の失せた唇で、にやりと笑った。", "「若い者が、泣いては。それより、顔を上げよ」", "「でも」", "「若い者が、死ぬよりは、ましじゃ」", "減らず口だった。それが、かえって、痛々しかった。", "「兄ちゃん！」", "ハルの声が、夜に響いた。", "小さな体が、人垣を抜けて、駆けてきた。ユウの首に、抱きついた。", "「兄ちゃん、戻ってきて！ お願い、戻ってきて！」", "「ハル」", "ユウの腕が、震えながら、弟を抱きしめた。", "「ごめん。ごめんな。俺、俺は」", "その時だった。", "夜空の彼方から、声が、降ってきた。", "聞こえるはずのない、柔らかな、穏やかな声。", "『ユウ。戻りなさい』", "ユウの体が、びくりと、跳ねた。", "抱きしめていた腕から、力が、抜けた。目の光が、すうっと、消えていく。涙の跡だけが、頬に残っていた。", "「……戻らなければ」", "ユウは、ゆらりと立ち上がった。ハルの腕を、そっと外した。", "「兄ちゃん？」", "「ごめん、ハル。行かなくちゃ」", "「待って！」", "「これは、正しいことなんだ」", "ユウは、背を向けた。兵たちが、慌てて、後を追う。一団は、闇の中へ、消えていった。", "ハルの泣き声が、井戸のほとりに、いつまでも、響いていた。", "オオナムチは、その場に、立ち尽くしていた。拳を握りしめた。爪が、掌に、食い込んだ。", "(必ず、取り戻す)", "胸の中で、誓った。"]}, {"h": "六", "p": ["翌朝の葛の里は、静かだった。", "ヒエダは、石の家の寝台で、手当てを受けていた。ウズメが、傍らで、不器用に包帯を巻いている。ベルは、家の外の壁にもたれて、朝の空を見上げていた。", "(致命傷は、止めた)", "けれど、あれ以上は、できなかった。力を使いすぎれば、阻害が破れる。ほんのわずかな力で、見えない形で、命を繋ぎ止めるのが精一杯だった。", "胸の中に、苦いものが、広がっていた。", "(私は、何を、守っているのだろう)", "そこへ、馬の蹄の音が、近づいてきた。", "里の入口に、一団が現れた。先頭の馬に、白銀の鎧をまとった青年が、乗っていた。", "タケルだった。", "澄んだ目。背筋の伸びた姿。兵たちの後ろには、白い腕章をつけたユウが、まっすぐに前を向いて、従っていた。昨夜の涙の跡は、少しも、残っていなかった。", "(来たか)", "ベルは、壁から離れ、ゆっくりと、里の広場へ歩いた。", "タケルは、馬を下りた。里の人々が、遠巻きに見つめる中、傷を負った者たちの間を、歩いて回った。", "「水を」", "供の兵に、命じた。木の桶が運ばれてくる。タケルは、自ら柄杓を取り、負傷者の口元へ、そっと運んだ。", "「大丈夫か。痛むか」", "「は、はい」", "「すまない。守りきれなかった。昨夜の騒ぎのことは、聞いた」", "その声は、まっすぐだった。洗脳されている。それでも、根の部分は、少しも、歪んでいない。傷ついた亜人の老女の手を、両手で包み込んで、頭を下げた。", "(あの男は、変わらない)", "牢の中で、粥を残さず食べていた時と、同じだった。善良で、不器用で、真っ直ぐで。", "ベルの胸が、締めつけられた。", "「昨夜、被害を抑えたのは、君たちか」", "声が、近づいてきた。", "気づくと、タケルが、ベルとオオナムチの前に、立っていた。", "「冒険者の方々だと聞いた。感謝する」", "タケルは、深く、頭を下げた。", "「いえ。俺たちは、何も」", "オオナムチが、慌てて答えた。声が、わずかに硬い。英雄が、差別する側の旗印であることを、頭では、分かっている。けれど、目の前の男が、悪い人間ではないことも、感じ取っている。その戸惑いが、横顔に出ていた。", "「謙遜しなくていい。君たちのおかげで、死者が出なかった。人族の兵の無礼は、私から詫びよう」", "タケルの目が、ベルへ、移った。", "その目が、一瞬、止まった。", "(まずい)", "ベルは、息を殺した。阻害の言霊が、体の内側で、軋んだ。昨夜、ヒエダを救うために、わずかな力を使った。その影響が、残っている。", "タケルの視線が、ベルの顔を、なぞった。", "「君とは」", "その唇が、動いた。", "「どこかで……」", "空気が、凍った。", "ベルは、動かなかった。表情を、変えなかった。ただ、静かに、相手の目を、見返した。", "タケルの眉が、わずかに寄る。何かを、思い出そうとする顔だった。記憶の奥の、扉を叩いている。", "(あの牢だ)", "黄泉津の宮の、薄暗い牢。格子の前に、腰を下ろした自分を、見上げていた目。", "その瞬間、ベルの輪郭が、ほんの一拍、ぼやけた。", "気づいたのは、おそらく、一人だけだった。", "オオナムチが、息を呑んだのが、分かった。", "「いや」", "タケルは、小さく、首を振った。", "「気のせいか。すまない、失礼した」", "そう言って、苦笑した。人好きのする、素朴な笑みだった。", "タケルは、踵を返した。供の兵たちが、後に続く。その途中、列の後ろにいたユウに、足を止めた。", "「ユウ」", "「は、はい！」", "ユウが、背筋を伸ばした。", "「昨夜は、よく働いてくれた。ご苦労だった」", "タケルが、ユウの肩を、軽く叩いた。", "ユウの顔が、ぱあっと、輝いた。", "「ありがとうございます！ 英雄殿に、お言葉をいただけるとは」", "その笑顔は、昨夜の涙の面影を、少しも残していなかった。心から、嬉しそうだった。認められた喜びが、全身から、溢れていた。", "広場の隅で、ハルが、その光景を、見つめていた。", "小さな手が、ぎゅっと、握りしめられている。唇を噛んで、涙を堪えていた。兄の笑顔が、別人のものに見えたのだろう。", "ベルは、見ていられなかった。", "(あの笑顔は、人を、一番傷つける)", "洗脳された者が、洗脳した側に、認められて、喜んでいる。その痛みを、誰より、近くで見ているのは、残された者たちだった。", "一団は、里を去っていった。蹄の音が、遠ざかる。", "オオナムチが、ベルを、振り返った。", "何かを、言いかけた。喉まで、出かかっていた。ベルは、それを、静かに、見つめ返した。", "(聞かれる)", "そう、覚悟した。", "けれど、オオナムチは、口を閉じた。小さく、首を振った。それから、ただ、いつもの、穏やかな顔で、言った。", "「ヒエダさんの様子、見てきます」", "「ああ」", "去っていく背中を、ベルは、見送った。", "(待っていてくれる)", "その事実が、胸に、重く、温かかった。"]}, {"h": "七", "p": ["ヒエダは、里に残ることになった。", "傷は、深かったが、命に別状はない。ベルが止めた分だけ、助かったのだ。ただ、旅を続けられる体では、なかった。", "「いけませんぞ、若いの。無理は」", "寝台の上から、老人は、相変わらず、小言を飛ばしていた。", "「おぬしは、いつも、真っ先に飛び込む。それでは、命がいくつあっても足りぬ」", "「すみません」", "「謝るなら、改めよ」", "「改めます」", "「うそをつけ」", "ヒエダは、口の端を、ひくつかせた。笑っていた。", "「だが、まあ」", "声が、少し、柔らかくなった。", "「あの子を、責めなかったのは、よかった。ユウは、悪い子ではない。ただ、居場所が、欲しかっただけじゃ。それを、利用された」", "「はい」", "「取り戻してやれ。必ずな」", "「必ず」", "オオナムチの声は、静かだった。決意が、その奥に、沈んでいた。", "「そのためには、力が要るぞ」", "老人は、天井を、見上げた。", "「守るだけでは、足りぬ。癒やすだけでも、足りぬ。心を、取り戻す力がな」", "「心を」", "「それは、わしにも、分からぬ。ただ、おぬしなら、いつか、辿り着くかもしれん」", "老人は、目を閉じた。", "「ここで、子供らに、語り継いでおる。前の王の頃の話を。差別などなかった時代があったことを。それを知る者が、一人でも、増えれば」", "「はい」", "「それが、わしの戦いじゃ」", "ヒエダは、小さく、笑った。", "里の入口で、サルタヒコが、待っていた。", "「行くのか」", "「はい」", "オオナムチは、頭を下げた。", "「世話になりました」", "「世話なんざ、していねえ」", "サルタヒコは、鼻を鳴らして、片手を差し出した。", "「必ず、取り戻せ」", "その声は、低く、重かった。", "「あの小僧を。俺たちの同胞を、人族の道具にさせるな」", "オオナムチは、その手を、強く、握り返した。", "「約束します」", "「そうか」", "サルタヒコは、にやりと、笑った。", "「ならば、いい。ウズメ、お前も、少し付き合ってやれ」", "「えー、あたし？」", "ウズメが、尻尾を揺らした。", "「冗談ですよ。ここに、残ります。ヒエダ爺の世話もあるし、杭の見回りもあるし」", "そう言って、にっと笑う。けれど、その目は、真剣だった。", "「でも、困ったら、呼んで。足には、自信があるから。どこへでも、飛んでいくよ」", "「ありがとう」", "オオナムチは、笑った。ウズメは、そっぽを向いて、耳を、ぱたぱたと動かした。", "夜になった。", "ベルは、里の外れの岩に、腰を下ろしていた。夜風が、肌を撫でる。空には、細い月が、浮かんでいた。", "手を、空にかざした。", "言伝を、唱える。", "「オモイカ」", "返事は、すぐに来た。", "「ベルイザナ様。ご無事でしたか」", "「ああ。そちらは」", "「申し上げにくいのですが」", "声が、わずかに、低くなった。", "「タケルたちの脱走について、詳細が、判明しました」", "ベルは、目を閉じた。", "「聞かせてくれ」", "「ナキメが、洗脳の解除を進めておりました。綻びが見え始めた夜、王都からの言霊が、合図となって発動したようです。囚われていた者たちは、一斉に、牢を破りました」", "「ナキメは」", "「無事です。ただ」", "オモイカの声が、少し、躊躇った。", "「ご自身を、強く責めておいでです。『私の術が、王への合図になった』と。ベル様に、直接、お詫びを申し上げたい、と」", "ベルは、しばらく、黙っていた。", "夜の風が、岩の間を、吹き抜けた。", "「仕方がない」", "静かに、言った。", "「あの言霊は、ナキメの失敗ではない。解こうとすれば、気づかれる。分かっていて、やったことだ。そうだろう」", "「はい」", "「責めるな。伝えてくれ。私は、怒っていない、と。むしろ、感謝している、と」", "「承知しました」", "通信の向こうで、小さく、息を吐く気配がした。", "「ベルイザナ様」", "「何だ」", "「もう一つ、ご報告が」", "声が、緊張を帯びた。", "「人の王の探知網が、獣ノ原にも、届き始めています。『ベルイザナ』の名を軸にした、言霊の網です。まだ、粗い目ですが、日に日に、細かくなっています」", "「そうか」", "「タケルが各地を視察しているのは、おそらく、網の目を、細かくするためです。英雄の巡行に、探知の言霊を、重ねているのかと」", "(あの視察は、そういうことか)", "ベルは、拳を、握った。", "昨日、タケルが「どこかで」と呟いた瞬間。あれは、阻害が揺らいだだけではない。王の網が、タケルを通じて、自分に触れかけたのかもしれない。", "「分かった。気をつける」", "「どうか、お力を使いすぎませんよう。阻害が、破れます」", "「ああ」", "「それと」", "オモイカの声が、ふと、柔らかくなった。", "「ご自身の、お顔の色が、少し、悪いのではありませんか。声に、疲れが」", "ベルは、口元を、わずかに、緩めた。", "「見抜かれたか」", "「見抜く目だけが、取り柄ですので」", "「助かった。……次の手を聞かせてくれ」", "「はい。まず、ミナモへ戻られることです。獣ノ原は、これ以上、長居できません。人の王の目が、集まりすぎています」", "「分かった」", "通信が、切れた。", "ベルは、手を下ろした。夜空を、見上げる。細い月が、薄く、光っていた。", "遠くで、ハルの泣き声が、まだ、微かに、聞こえた。兄を呼ぶ、細い声だった。", "(取り戻す)", "胸の奥で、オオナムチの誓いが、反響していた。あの青年の背中は、昨日より、少しだけ、大きく見えた。", "(私も、その誓いに、報いなければならない)", "ベルは、立ち上がった。", "探知の網は、迫っている。タケルの違和感は、芽を出し始めている。時間は、多くない。それでも、あの青年を、育てなければならない。", "夜風が、ベルの外套を、揺らした。", "遠くの井戸のほとりで、誰かが、水を汲んでいた。桶が、井戸の底へ落ちる音が、静かな夜に、小さく、響いた。"]}]}]}, {"name": "本編　第三部", "note": "白い都から、最後の橋まで", "items": [{"id": "ch08", "label": "第八章", "title": "白い都の、静かな夜", "chars": 7944, "sections": [{"h": "一", "p": ["天津京は、白かった。", "ベルは城門をくぐったところで、立ち止まった。石畳も、家々の壁も、街路樹を囲む柵も、すべて磨き上げたように白い。ミナモの雑多な賑わいとも、黄泉の市場の混ざり合った匂いとも違う。ここには、匂いがほとんどなかった。", "人は多い。ただ、誰も大声を出さない。荷車の車輪の音さえ、布でも巻いたように静かだった。", "「きれいな街ですね」", "隣でオオナムチが、小さく言った。声に、戸惑いが混じっている。", "「ああ。きれいすぎる」", "通りの正面に、円い大屋根が見えた。円議堂だ。街のどこからでも目に入る位置に建ち、その前の大広場には、白い石の像が立っている。剣を掲げた青年の像だった。", "勇者タケルの像だ。", "台座には、彫り込まれた文字がある。", "『正義は我らにあり』", "ミナモの掲示板の隅に貼られていた、あの言葉だった。ここでは、紙ではなく石に刻まれ、誰も気に留めない風景として、そこに在る。通りかかった親子が、像の前で足を止めた。母親が子の肩を抱いて、小声で何かを教えている。子は頷き、胸に手を当てて、短く礼をした。", "(祈りの形をしている)", "ベルは視線を外した。", "壁の布告も目に入った。新しい紙だった。『英雄タケル、魔界より生還。魔王の脅威、いまだ去らず』。紙の端には、凱旋を祝う催しの日取りが記されている。", "(牢を破った、その日から、もう祭りに仕立てているのか)", "アマツ王の手際の良さに、背筋が冷えた。", "胸の奥で、阻害の言霊が、じりじりと擦れている。ここは網が濃い。ミナモや獣ノ原とは比べものにならない。偽名の「ベル」が薄い膜となって顔の印象をぼかしているが、その膜が、街の空気そのものに押されて軋んでいた。", "呼吸を、ひとつ整えた。力は使わない。言霊も唱えない。ただ歩くだけで、少しずつ削れていく。", "「ベルさん、顔色が」", "「平気だ」", "「でも」", "「人が多いところは、少し疲れる」", "嘘ではなかった。オオナムチは、それ以上は踏み込まず、さりげなく、人の流れの外側にベルを寄せて歩いた。", "(この青年は、いつも、そうする)", "ベルは、胸の内で、小さく礼を言った。"]}, {"h": "二", "p": ["昼の広場では、討論会が開かれていた。", "円議堂の前の石段に、簡素な壇が組まれている。壇上には、白い礼装の議員が数人、並んで座っていた。広場には、百人ほどの民が集まり、車座になって耳を傾けている。野次も、怒号もない。", "オオナムチは、人垣の端に立って、ベルと並んで聞いた。", "「本日の議題は、魔族への備えについて」", "進行役の議員が、穏やかに告げた。", "「皆さんのご意見を、お聞かせください」", "最初に手を挙げたのは、粗末な服の中年の男だった。", "「俺は、魔族が怖い。家族を守りたいから、軍を増やすべきだと思う」", "壇上の議員が、深く頷く。", "「ありがとうございます。そのお気持ち、よく分かります」", "次に、若い母親が立った。", "「子どもが夜、眠れなくなりました。魔王が来るんじゃないかって。早く、安心できる世の中にしてほしいです」", "「ご不安ですね。大切な声です」", "その次は、年配の職人だった。", "「魔族と共に生きることはできんでしょう。話の通じない者たちだ。税が増えても、備えにはお金を使うべきです」", "次々に、人が立つ。誰もが、言葉を選んで話した。誰も、他人を貶めない。怒りに任せて叫ぶ者もいない。穏やかで、礼儀正しく、そして、同じ結論へと向かっていた。", "(同じだ)", "オオナムチは、胸の奥で、冷たいものが広がるのを感じた。", "言い方は、人によって違う。怖いから、守りたいから、備えたいから。けれど、辿り着く場所は、一つだ。魔族は話の通じない者たちで、だから、備えるしかない。", "聖の森で聞いた使者の言葉と、同じだった。使者がたった一人で、時間をかけて繰り返したものを、この街の人々は、自分の口で、自分の言葉として、語っている。", "「亜人の方々についても、一言」", "壇上の議員が、穏やかに水を向けた。", "「魔族と見た目の似た者たちを、どう扱うべきか。皆さんのお考えを」", "広場の空気が、わずかに変わった。", "「あの人たちが悪いわけじゃない」", "先ほどの若い母親が、おずおずと口を開いた。", "「ただ、見た目が似ているから、念のため、距離を置いたほうがいいと思う。お互いのためにも」", "「そうだ。念のためだ」", "「悪気はないんだ。ただ、念のため」", "「念のため」", "言葉が、波のように、広場に広がった。", "オオナムチの喉が、からからに乾いた。", "(念のため)", "ひなた野の老婆が、薬を待ちわびていた顔が、浮かんだ。焼き菓子の屋台の前で、順番を飛ばされた女の、伏せた目。宿の入口で、断られる子どもたち。あの小さな線引きは、悪意からではなく、「念のため」から、生まれていたのだ。", "誰も、悪人ではない。それが、何より、恐ろしかった。", "(自分の考えが、寄っていく)", "気づいた。討論の流れの中に、自分の頭が、ゆるやかに引き込まれていく。「念のため」という言葉が、不思議なほど、心に馴染んだ。そうかもしれない、と思いかけた。", "「――心鎮め」", "唇だけで、唱えた。", "胸の中の霧が、すっと晴れる。広場のざわめきが、遠のいて、一つひとつの言葉が、輪郭を取り戻した。", "(これは、俺の考えじゃない)", "隣で、ベルが、小声で言った。", "「聞こえるか」", "「はい」", "「言葉の下に、同じ響きが流れている。誰かが唱えているのではない。広場全体が、一つの言霊の中にある」", "オオナムチは、頷いた。", "「出ましょう。ここに長くいると、染まる」", "二人は、人垣を抜けた。広場の端まで来て、ようやく、息を吐いた。", "「俺の故郷の人たちは」", "声が、掠れた。", "「ずっと、あの『念のため』の中に、いたんですね」", "ベルは、何も言わなかった。ただ、その横に立って、広場の方を、長く見ていた。"]}, {"h": "三", "p": ["コトシロは、軍務局の机で、帳簿をめくっていた。", "窓の外で、鐘が鳴った。昼の討論会が終わったのだろう。足音が、廊下を行き来する。誰もが、きびきびと、静かに歩く。", "(今日も、無事に終わった)", "そう思うのが、毎日の習いになっていた。", "炉ヶ岳から戻って、二十日になる。報告書を破り、「問題なし」と書き直した日から、一日として、気が休まったことはない。刻印の効果がなかったことは、いつ露見してもおかしくない。そのたびに、背中に冷たいものが走った。", "昨日、廊下で、若い兵の会話を耳にした。", "「あの新しい剣、不思議なんだ」", "「何がだ」", "「握ると、考えが澄むというか。演説を聞いても、頭に入ってこなくなる」", "「疲れてるんだろう」", "「そうかもしれない。けど、悪くない気分なんだ」", "コトシロは、ペンを持つ手が止まりそうになるのを、必死で堪えた。", "(効いている。刻印は、空回りしている)", "それは、誇らしくもあり、同時に、恐ろしかった。兵が違和感を覚えれば、いつか、誰かが、気づく。", "帳簿を閉じて、立ち上がった。昼の休みに、街の見回りを命じられている。外へ出る口実としては、ちょうどよかった。", "円議堂の裏手の通りで、足が止まった。", "人混みの中に、見覚えのある横顔があった。継ぎの当たった外套の青年と、その隣に立つ、黒髪の男。", "(ベル殿)", "息が、詰まった。", "偽名の言霊のせいか、周りの者は誰も、男に視線を向けていない。けれど、コトシロには、はっきりと見えた。炉ヶ岳で、刃の細工を見抜いた、あの男。「職人の目」と言って、微笑んだあの目が、今は、青白く、疲れていた。", "(来て、くださった)", "膝が、わずかに震えた。それを、無理やり、抑えた。", "周囲を、見回した。兵の姿はない。密告者らしい視線もない。コトシロは、帳簿を抱え直し、自然な足取りで、二人に近づいた。", "すれ違いざま、低く、言った。", "「ベル殿。一つ、先にお伝えします」", "ベルの目が、動いた。", "「今夜、日が落ちたら、鐘楼の裏の路地へ。誰にも、ついて来られぬように」", "足を止めず、そのまま、通り過ぎた。心臓が、早鐘のように打っていた。振り返る勇気はなかった。", "(いつか、私の目が、役に立つ日が来るかもしれません)", "あの日、そう言った。言葉にしたからには、やらねばならない。それが、自分に課した、ただ一つの約束だった。", "コトシロは、見回りを続けた。額に、冷たい汗が、浮かんでいた。"]}, {"h": "四", "p": ["夜の天津京は、昼とは別の顔をしていた。", "鐘楼の裏の路地は、驚くほど暗かった。表通りの白い街灯が、ここまでは届かない。壁の隙間から、湿った匂いが漂ってくる。", "ベルは、オオナムチと共に、闇の中を歩いた。先頭に、コトシロが立っている。角灯を、布で覆い、足元だけを照らしていた。", "「ここから先が、貧民区です」", "コトシロの声は、低く、硬かった。", "「表の者は、誰も来ません。来ないように、できているのです」", "路地の先には、低い家々が、折り重なるように建っていた。壁は剥がれ、屋根は継ぎ接ぎだらけだ。窓から、細い灯が漏れている。扉の前に、獣の耳を持つ子どもが、座っていた。目が、虚ろだった。", "「亜人の多くは、この区に押し込められています。昼の討論会では『念のため』の距離と言いますが、実態は、これです」", "オオナムチが、拳を握った。", "コトシロは、一軒の古い家の前で止まり、決まった拍子で、戸を叩いた。内側から、鍵の外れる音がした。", "「入ってください」", "狭い土間の奥に、小さな卓がある。コトシロは、その上に、懐から取り出した束を広げた。紙の束だった。", "「軍務局の移送記録です。写しを、少しずつ、持ち出しました」", "ベルは、紙を手に取った。細かい文字が並んでいる。日付、氏名、職業、そして、移送理由。", "『過労による心身の疲弊のため、療養』", "『精神の安定を欠くため、療養』", "『言語の障害を発症したため、療養』", "「全員、療養か」", "「そうです。議会で異論を唱えた議員、新聞に魔族との和平を書いた記者、教師、僧侶。皆、病気になったことになっています」", "コトシロは、指で紙の端を叩いた。", "「ご覧ください。移送先の欄を」", "ベルは、目を落とした。同じ名が、何十行にも、並んでいる。", "『やすらぎの院』", "「王都の外れにある、白壁の療養院です。表向きは、心の疲れを癒やす場所。民の評判は、とてもいい」", "「そこに入った者は」", "「戻ってきた者を、私は、知りません」", "コトシロの声が、わずかに震えた。", "「面会は許されません。家族には『落ち着くまで安静に』とだけ告げられる。数か月経って、『療養中に容態が悪化し、記憶を失った』と通知が来る。そして、遺された家族は、『お気の毒に』と同情される。誰も、疑わない」", "(静かな消え方)", "ベルは、紙の束を、握りしめた。", "派手な処刑は、いらない。血も流れない。人が、静かに、いなくなる。いなくなった理由は、病気だ。誰もが納得する、穏やかな理由だ。", "王の統治は、暴力によらなかった。人が最も疑わない「善意」の形で、反対者を消している。", "「院の内部は」", "「分かりません。ただ、職員の多くは、自分が何をしているか、知らないはずです。ただ、あの建物の地下には、昔、神殿があったと聞いたことがあります」", "ベルの視線が、ぴくりと動いた。", "「神殿」", "「五柱の神を祀っていた、古い社だそうです。今は、塗り込められて、誰も入れないと」", "ベルは、無言のまま、記録を、じっと見つめた。胸の奥で、冷たい怒りが、静かに形を取っていく。", "(魔族も人も、同じ神々を仰いでいる)", "その神殿を、洗脳の拠点に使っているのなら、それは、人間にも魔族にも、等しく向けられた冒涜だ。", "「コトシロ殿」", "ベルは、顔を上げた。", "「感謝する。そなたの目は、確かに役に立った」", "コトシロは、一瞬、目を丸くして、それから、深く、頭を下げた。", "「恐れ入ります。ただ」", "顔を上げた時、その目には、不安が、濃く滲んでいた。", "「院に向かわれるなら、お気をつけください。私の知る限り、あそこは、人の出入りが厳重です。それに、近く、凱旋の祝賀が開かれます。タケル殿が、王都に戻られた夜に、王が民の前に立つ。警備が、普段の倍に増えます」", "「その夜が好機やもしれぬ」", "「え」", "「兵の目が、祝賀に向く」", "ベルは、記録の束を、そっと、卓に戻した。", "「危険は承知で頼む。当日の警備の配置と、院の出入りの記録を、調べてもらえるか」", "コトシロは、唇を噛んだ。", "膝の上で、握った拳が、白くなっている。やがて、深く息を吐いて、頷いた。", "「やります。それが、私の仕事です」", "「無理は、するな」", "「無理をしなければ、役に立てません」", "コトシロは、小さく、苦笑した。", "「ただ、お約束ください。もし、私が捕らえられても、助けに来ないと」", "「それは約束できぬ」", "ベルは、即答した。", "「私は仲間を見捨てぬ」", "コトシロの目が、見開かれた。喉が、小さく動いた。何かを言おうとして、言葉にならなかった。", "オオナムチが、そっと、言った。", "「ベルさんは、そういう人ですから」", "コトシロは、うつむいて、肩を震わせた。"]}, {"h": "五", "p": ["その家には、先客がいた。", "土間の奥の、薄い布で仕切られた一角に、二人の人影があった。痩せた女と、五つか六つほどの、小さな女の子だった。", "コトシロが、声を落として言った。", "「紹介します。この家の主、ミオさんと、娘のヒナさんです。ご主人が、療養院に」", "女は、深く、頭を下げた。顔色が悪く、目の下に、濃い隈がある。それでも、礼を欠かさない、きちんとした人だった。", "「夫は、教師でした」", "女は、静かに言った。", "「子どもたちに、魔族の暮らしを、教えていたんです。授業で、魔界の収穫の話をしたら、親御さんたちが騒ぎ出して。それから、半年も経たないうちに、心の病気だと言われて」", "「療養に、送られたのですか」", "オオナムチが、尋ねた。", "「ええ。迎えに来た役人さんは、とても丁寧でした。『奥様、ご心配なさらず。すぐ、元気になりますから』と」", "女の唇が、小さく、歪んだ。", "「でも、あの人は、病気じゃありませんでした。毎晩、夜遅くまで、本を読んで、翌日の授業を考えていて。子どもたちのことを、いつも、楽しそうに話していました」", "「お父さんは、ね」", "不意に、小さな声が、割り込んだ。", "ヒナだった。大きな目を、まっすぐに、オオナムチに向けている。", "「ぜったい、帰ってくるの」", "「ヒナ」", "「だって、約束したもん。お誕生日に、お花を持って帰るって」", "少女は、握りしめた小さな布の袋を、オオナムチに見せた。中には、乾いた花の種が、いくつか入っていた。", "「お父さんが、くれたの。お花が咲いたら、帰ってくるよって」", "「……そうか」", "オオナムチは、しゃがみ込んで、少女の目の高さに、顔を寄せた。", "「その種、毎日、水をあげているのか」", "「うん。でも、まだ、芽が出ないの」", "ヒナの目に、涙が浮かんだ。", "「お母さんは、泣かないで待つんだよって言うの。だから、泣かないの」", "オオナムチの胸が、ぎゅっと、締めつけられた。", "(ハルと、同じだ)", "兄の手紙を、宝物のように抱きしめていた少年の顔が、重なった。ひなた野の子どもも、この街の子どもも、待っている。大切な人が、帰ってくる日を。", "ヒナの待つ人は、療養院にいる。ハルの待つ人は、王の言霊の中にいる。どちらも、静かな善意の裏側で、奪われた人々だった。", "(一人じゃ、ない)", "胸の中で、何かが、大きく、動いた。", "ユウを取り戻す、と誓った。それは、ハルとの約束だった。けれど、この街には、同じ痛みを抱えた人が、何人も、何十人も、いる。", "(ユウだけを取り戻しても、足りない)", "声に出さずに、思った。", "(この仕組みを、壊さなきゃ)", "オオナムチは、少女の頭に、そっと、手を置いた。", "「大丈夫だ」", "声が、静かに、出た。", "「その種は、きっと、芽を出す。お父さんも、帰ってくる」", "「ほんとう？」", "「ああ。約束する」", "言った瞬間、自分でも、驚いた。簡単に口にしていい約束ではない。けれど、後悔は、なかった。", "隣で、ベルが、静かに、こちらを見ていた。咎める目では、なかった。長く、深く、見守る目だった。", "(この青年は、約束を、重く受け止める)", "ベルは、そう思っていた。けれど、その思いは、オオナムチには、届かなかった。", "ミオが、深く、頭を下げた。", "「お願いします。夫を」", "「必ず」", "オオナムチは、頷いた。それ以上の言葉は、いらなかった。"]}, {"h": "六", "p": ["宿の屋根裏は、狭く、埃くさかった。", "ベルは、壁に背を預けて、座っていた。隣の寝床で、オオナムチが、毛布にくるまって眠っている。今夜は、一晩中、歩き回った。疲れが、一気に出たのだろう。寝息が、規則正しく、聞こえていた。", "ベルは、そっと、手を空にかざした。", "言伝を、唱える。", "声が、闇を渡った。", "「オモイカ」", "返事が来るまで、少し間があった。", "「ベルイザナ様。お声が、いつもより、遠いようです」", "「王都は網が濃い。通信を保つだけで力を使う」", "「承知しました。手短に、お願いします」", "「分かっている」", "ベルは、目を閉じた。", "「やすらぎの院を、突き止めた。反対者を送り込む、療養院を装った施設だ。地下に、神殿が残っているらしい」", "通信の向こうで、息を呑む気配がした。", "「神殿、ですか」", "「ああ。五柱の神を祀っていた。今は、洗脳の拠点に、作り替えられている疑いがある」", "「それは」", "オモイカの声が、低く、沈んだ。", "「許しがたい冒涜です。魔界の民が、それを知れば」", "「だから、まだ、伝えるな。今は、確かめるのが先だ」", "「はい」", "しばらく、沈黙が続いた。", "「ベルイザナ様」", "オモイカが、静かに言った。", "「ご報告します。タケルの王都帰還を、確認しました。凱旋の祝賀は、三日後の夜と見られます。王が、民の前に立つ予定です」", "「聞いている。コトシロから」", "「そうですか。それは、心強い」", "オモイカの声が、わずかに、柔らいだ。", "「ただ、探知網についても、お伝えしなければなりません。『ベルイザナ』の名を軸にした網が、王都の周囲で、一段と、細かくなっています。祝賀の夜には、さらに、強まるでしょう」", "「想定内だ」", "「阻害の状態は、いかがですか」", "ベルは、すぐには、答えなかった。", "胸の奥で、膜が、軋んでいる。昼の広場でも、夜の路地でも、削られ続けてきた。残りは、半分を割っているだろう。祝賀の夜に、潜入すれば、確実に、さらに削れる。", "「持つ」", "短く、答えた。", "「嘘は、おやめください」", "オモイカの声が、静かに、刺さった。", "「あなたの声には、疲れが滲んでいます。私は、見抜くことだけが、取り柄ですので」", "ベルは、口元を、わずかに、緩めた。", "「前にも、言われたな」", "「何度でも、申し上げます」", "「……半分を、切っている」", "「やはり」", "オモイカは、小さく、息を吐いた。", "「ならば、お力は、決して、使わないでください。療養院での戦いは、オオナムチ殿に、任せる形に」", "「そのつもりだ」", "「それと」", "オモイカの声が、柔らかくなった。", "「ご自身を、責めすぎませんように。あなたは、魔界の王である前に、一人の、疲れる人です」", "ベルは、返事に詰まった。", "オモイカは、いつも、見抜く。見抜いたうえで、責めない。その距離の取り方を、先代の頃から、貫いてきた。", "(私は、この人に、何度、救われたのだろう)", "「感謝する」", "ようやく、それだけ、言えた。", "「それより」", "声に、いつもの響きが、戻った。", "「次の手を、聞かせてくれ」", "通信の向こうで、オモイカが、小さく笑う気配がした。", "「はい。まず、祝賀の夜の動線から」", "夜が、更けていった。", "隣で、オオナムチが、寝言のように、小さく、呟いた。", "「……ヒナ……種……」", "ベルは、静かに、その寝顔を見た。", "(この青年は、今夜、また一つ、重いものを、背負った)", "約束を口にした。街の子どもに。誰かの父を、取り戻すと。", "その重さは、たやすくは、ほどけない。それでも、あの青年は、背負い続けるだろう。ハルとの約束と、ヒナとの約束を、並べて、同じ重さで。", "窓の隙間から、白い街の灯が、一筋、屋根裏に差していた。天津京は、夜でも、静かに、白かった。その白さの底で、人が、ひっそりと、消えていく。", "(必ず、止める)", "ベルは、拳を、そっと、握った。", "指先が、わずかに、震えていた。阻害の膜が、軋んでいる。残された時間は、多くない。", "窓の外で、夜警の鐘が、遠く、一度だけ、鳴った。"]}]}, {"id": "ch09", "label": "第九章", "title": "削られた名", "chars": 7389, "sections": [{"h": "一", "p": ["祝賀の夜の天津京は、昼よりも白かった。", "円議堂の前の大広場には、無数の灯籠が吊るされている。紙の灯りが風に揺れ、白い石畳に、柔らかな影を落としていた。楽の音が流れ、民は肩を寄せ合って歌っている。誰もが、笑っていた。", "コトシロは、軍務局の制服の襟を正し、人波の縁を歩いていた。", "(落ち着け。いつもの見回りだ)", "懐には、薄い紙が一枚、折り畳んで入っている。警備の配置と、やすらぎの院の出入り記録。昼のうちに、局の書庫で、三度に分けて写し取ったものだ。一枚書くたびに、指先が冷たくなった。", "「そこの」", "背後から、声がかかった。", "足が止まりかけた。それを、一歩ぶんだけ、遅らせた。歩調を乱さず、ゆっくりと振り返る。", "警邏の兵が、二人立っていた。若い方が、角灯を掲げている。", "「軍務局の方ですか。持ち場は」", "「検品局のコトシロだ。祝賀の見回りを命じられている」", "「ああ、検品官殿でしたか」", "兵の顔が、少しだけ緩んだ。", "「失礼しました。ただ、今夜は、懐の改めをしておりまして。形だけですが」", "(来た)", "心臓が、胸の内側を叩いた。懐の紙の存在が、急に、重くなる。", "コトシロは、できるだけ、穏やかに微笑んだ。", "「構わない。だが、この中は、軍の帳簿だ。破れると面倒でな。丁寧に頼む」", "「はい、もちろん」", "兵の手が、外套の内側に入ってくる。コトシロは、息を殺した。指先が、帳簿の角に触れる。その下に、写しは、ある。", "「……問題ありません」", "兵が、手を引いた。", "「ご苦労さまです。良い祝賀を」", "「ああ。君たちも」", "コトシロは、一礼して、歩き出した。三十歩、数えた。曲がり角を曲がって、ようやく、壁に手をついた。膝が、がくがくと震えていた。", "(私は、何をしているのだろう)", "可笑しくなった。二十年、帳簿と刃の目利きしかしてこなかった男が、今、国を相手に、紙を運んでいる。", "それでも、手を止める気は、なかった。", "鐘楼の裏の路地まで、遠回りで辿り着いた。角に、白い小さな布を一枚、落とす。合図だった。", "見上げると、屋根の上の闇の中で、何かが、静かに動いた気がした。", "(頼みます、ベル殿)", "コトシロは、祝賀の灯の中へ、戻っていった。"]}, {"h": "二", "p": ["やすらぎの院は、花に囲まれていた。", "ベルは、白壁の塀の影に身を寄せて、その建物を見上げた。二階建ての、穏やかな造りだ。窓には薄い布がかかり、中庭には、季節の花が植えられている。夜でも、小さな灯が点って、どこか、安心を誘う佇まいだった。", "(悪意の、顔をしていない)", "それが、いちばん、薄気味悪い。", "胸の奥で、阻害の膜が、細く鳴いた。祝賀の夜の網は、昼間とは桁が違う。王都全体に、薄い糸のように張り巡らされた探知が、じりじりと、肌を撫でてくる。偽名の言霊は、もう、半分以上、削れていた。", "力は、使えない。言霊も、唱えない。ただ、気配を殺して、動くだけだ。", "「ベルさん」", "隣で、オオナムチが、小声で言った。", "「見張りが、交代します」", "裏口の前の兵が、二人、入れ替わるところだった。祝賀の喧騒で、気もそぞろなのだろう。引き継ぎの声が、のんびりしている。", "「今です」", "二人は、影から影へ、走った。石畳の継ぎ目を、足音を立てずに踏む。ベルは、人の動きの外側を縫うように、体を運んだ。力を使わなくても、長年の勘が、体に染みついている。魔王として、数え切れない戦場を渡った経験が、今は、静かな足取りになっていた。", "裏口の扉は、内側から、閂が掛かっていた。", "オオナムチが、短剣の先で、隙間を探る。細い金具が、小さく鳴った。やがて、閂が、外れた。", "扉が、音もなく、開いた。", "中は、薄暗い廊下だった。壁には、薬草を描いた絵が掛かっている。床は、磨かれて、冷たい。どこかで、小さな鈴の音が、鳴っていた。", "(穏やかだ)", "職員の足音が、遠くで、ゆっくりと行き交っている。誰かが、子守唄のような歌を、口ずさんでいた。", "「あの人たちは、何も、知らないんでしょうね」", "オオナムチが、小さく呟いた。", "「ああ。自分が、良いことをしていると、信じている」", "ベルは、歌声のする方を、見た。", "(この静けさが、人を、消している)", "怒りが、胸に、静かに、積もった。"]}, {"h": "三", "p": ["療養棟の大部屋は、息が詰まるほど、静かだった。", "オオナムチは、扉の隙間から、中を覗いた。", "寝台が、二十ほど、整然と並んでいる。その上に、人が、座っていた。起きているのか、眠っているのか、分からない。皆、窓の方を向いて、ぼんやりと、座っている。", "目が、虚ろだった。", "そっと、中に入った。足音を殺して、寝台の間を、歩く。一人の老人の前で、足を止めた。", "「あの」", "声をかけた。老人は、ゆっくりと、こちらを向いた。目が、焦点を結ばない。", "「お名前を、教えていただけますか」", "「……名前」", "老人の唇が、ゆっくり動いた。", "「名前、は」", "そこで、止まった。眉が、苦しげに、寄る。", "「わから、ない」", "「思い出せないんですか」", "「ずっと、呼ばれていないから」", "老人は、そう言って、小さく、笑った。その笑顔が、あまりにも穏やかで、オオナムチは、胸を掴まれた。", "(名を、削られている)", "聖の森で、ベルが言っていた。まことの名が、存在の輪郭を作ると。名を奪われた者は、輪郭が薄れ、最後には、誰の記憶にも残らなくなる。", "この部屋の人々は、その途中にいた。", "寝台の間を、ゆっくり、歩いた。一人ひとりの顔を、見た。若い者も、年配の者もいる。議員のような身なりの男。筆記具を握る形に指が曲がったままの男。僧衣の端切れを纏った女。", "部屋の奥に、一つ、窓際の寝台があった。", "そこに、痩せた男が、座っていた。三十代の半ばだろうか。無精髭が伸び、頬がこけている。胸元に、擦り切れた小さな札を、握りしめていた。", "札には、字が書かれていた。", "『ヒナへ。お誕生日おめでとう』", "オオナムチは、息を呑んだ。", "(この人だ)", "しゃがみ込んで、男の顔を見上げた。", "「先生」", "返事は、なかった。", "「ヒナさんのお父さんですね」", "男の目が、わずかに、動いた。", "「ヒナ」", "唇が、その名を、なぞった。", "「ヒナ……」", "それだけだった。それ以上の言葉は、出てこない。涙が、一筋、頬を伝って、札の上に落ちた。本人は、泣いていることにも、気づいていないようだった。", "オオナムチは、男の手を、そっと、握った。冷たかった。", "「待っててください。必ず、娘さんのところへ、連れて帰ります」", "返事は、なかった。ただ、握った手が、ほんのわずかに、握り返された気がした。", "(大丈夫だ。名の欠片は、まだ、残っている)", "オオナムチは、立ち上がった。", "「ベルさん、ここの人たちを」", "「分かっている」", "扉の傍で見張っていたベルが、頷いた。", "「だが、全員を連れ出すには人手がいる。まず元を断たねばならぬ」", "「地下ですね」", "「ああ。神殿だ」", "二人は、療養棟を後にした。部屋の中の人々は、誰一人、顔を上げなかった。ただ、窓の外の灯籠の光を、ぼんやりと見ていた。"]}, {"h": "四", "p": ["地下への階段は、倉庫の奥に、隠されていた。", "石の扉の前に、古い鍵が掛かっていた。オオナムチが、短剣の先を差し込んで、しばらく、苦戦した。ようやく、錠が外れた時には、額に汗が滲んでいた。", "扉の向こうは、冷たい空気が満ちていた。", "階段を、一歩ずつ、降りた。足音が、石壁に、吸い込まれていく。壁には、かつて、彩色が施されていたらしい。剥がれ落ちた絵の断片が、闇の中に、ちらりと見えた。", "階段の終わりに、広い空間が、あった。", "円い広間だった。天井は高く、柱が何本も立っている。奥に、石の祭壇がある。そして、その周りの壁に、五つの浅い窪みが、並んでいた。", "(紋の跡だ)", "窪みの一つひとつに、かつて、神の印が刻まれていたはずだった。今は、削り取られ、粗い漆喰で、塗り潰されている。刻まれていた形は、爪痕のように、薄く、残るばかりだ。", "祭壇の上には、見慣れぬ装置が、据えられていた。", "黒い石の台座に、細い銀の線が、幾重にも絡みついている。線の先は、床を這い、壁を伝い、天井へと伸びていた。装置の中央で、淡い光が、脈打っている。", "「あれが、中継の」", "「そうだ」", "ベルの声が、低かった。", "「ここから、王都全体へ、言霊が流れている。広場の討論会も、ミナモの掲示板も、ユウの頭の中の声も、根は、ここに繋がっているのかもしれない」", "「全部が、ここに」", "「少なくとも、その一つだ」", "オオナムチは、祭壇に近づいた。", "削られた紋の前で、足が止まった。漆喰の下から、うっすらと、形が見える。山の稜線のような曲線。", "(オオヤマツミ)", "隣の窪みには、渦を巻く線。その隣には、炎のような尖り。その隣には、三日月。", "(イザナギ。ホノカグツチ。ツクヨミ)", "そして、中央の、一番大きな窪みは、丸く、何も描かれていなかったかのように、平らだった。", "(アメノミナカヌシ)", "胸の奥が、かっと熱くなった。", "(人間も、魔族も、同じ神々を、仰いでいる)", "聖の森の老薬師が、言っていた。この世界の民は、種族を超えて、同じ祈りを持っていると。その祈りの場所が、人を縛るための道具に、作り替えられている。", "怒りが、腹の底から、込み上げてきた。", "(許さない)", "指先に、熱が集まった。炉ヶ岳で灯した火種が、掌の上で、赤く、膨らんだ。", "(焼いてやる)", "こんなもの、壊してしまえば、いい。装置も、祭壇も、すべて。そうすれば、人々は、解放される。", "掌の火が、勢いよく、燃え上がった。", "「オオナムチ」", "後ろから、ベルの声が、した。", "「待て」", "「でも」", "「壊しても止まらぬ。中継点は一つではない。ここを壊せば、王に、気づかれるだけだ」", "「じゃあ、どうすれば」", "オオナムチの声は、震えていた。拳が、固く、握られていた。", "(火は、壊すだけじゃない)", "炉ヶ岳の炉番の言葉が、頭の中で、響いた。", "(作り直す力でもあるんだ)", "オオナムチは、目を閉じた。", "胸の中で、燃え盛る怒りを、見つめた。これは、誰かを焼くための火ではない。奪われたものを、組み直すための火だ。", "ゆっくり、息を吐いた。掌の炎が、少しずつ、静まっていく。赤い光が、橙色に、そして、柔らかな金色に、変わった。", "目を開けた時、もう、壊したいとは、思っていなかった。", "(返してもらう)", "祭壇の前に、膝をついた。"]}, {"h": "五", "p": ["オオナムチは、削られた紋の前で、両手を合わせた。", "声に出さずに、唱え始めた。", "(オオヤマツミ)", "最初に、山の名を呼んだ。聖の森で、使者の言葉から心を守った、あの言霊。野犬の牙から身を守った、堅めの膜。仲間の前に立つことを、教えてくれた、守りの神。", "「――堅め。心鎮め」", "声が、石の広間に、静かに、響いた。", "右端の窪みが、ぼう、と淡く光った。漆喰の下から、山の稜線が、浮かび上がる。削られた線が、一本、また一本と、戻っていく。", "(次は、イザナギ)", "野犬の牙の痕を癒やした、あの温かさ。スクナ老人が、薬草の包みを渡しながら、言った。守るだけでは、人は救えぬ時が来る、と。", "「――癒やし」", "二つ目の窪みが、光った。渦を巻く線が、ゆっくりと、回り始める。", "(ホノカグツチ)", "炉ヶ岳で、教わった火。壊すためではなく、作り直すための火。差別への怒りを、組み直す力に変えてくれた。", "「――火種」", "指先の小さな炎が、三つ目の窪みに、映った。炎のような尖りが、金色に、輝き出す。", "(ツクヨミ)", "ここまで、学んだ言霊は、少ない。けれど、確かに、触れたことがある。ベルから聞いた、夜の通信の「言伝」。ヒエダの口にした「見破り」。名を暴き、偽りを見抜く力。", "「――見破り」", "声が、少し、かすれた。それでも、四つ目の窪みに、細い三日月が、静かに、灯った。", "四つの紋が、淡く、光っていた。石の広間が、柔らかな光で、満たされる。", "祭壇の装置が、低く、唸った。黒い台座の上で、淡い光が、乱れ始める。銀の線が、ぱちぱちと、軋んだ音を立てた。言霊の流れが、濁っている。", "(効いている)", "胸が、熱くなった。", "最後に、中央の、一番大きな窪みに、手をかざした。", "(アメノミナカヌシ)", "名を、呼んだ。", "何も、起きなかった。", "窪みは、冷たいままだった。手のひらを押し当てても、石の感触が、返ってくるだけだ。", "(届かない)", "胸の奥に、細い痛みが、走った。", "(まだ、足りないのか)", "呼んでも、呼んでも、応えがなかった。まるで、遠い星に向かって、声を投げているようだった。", "それでも、構わなかった。今は、四柱で、十分だ。", "背後で、かすかな物音が、した。", "振り向くと、階段の上から、入所者たちが、降りてきていた。", "一人、また一人。寝間着のまま、裸足で、ふらふらと、階段を降りてくる。目が、虚ろだ。それなのに、足は、まっすぐ、広間を目指していた。", "「どうして」", "四つの紋が、灯ったからだ。", "装置の言霊が、濁ったことで、彼らを縛っていた糸が、緩んだのだ。名の欠片が、紋の光に、呼ばれている。", "先頭に、ヒナの父が、いた。", "札を握りしめたまま、祭壇の前に、立ち尽くしていた。唇が、わずかに、動く。", "「……ヒナ」", "その声に、わずかな力が、戻っていた。", "「ヒナ、は」", "「元気です」", "オオナムチは、涙が滲むのを、感じた。", "「待ってます。花の種を、握りしめて」", "男の目に、かすかな光が、宿った。それは、まだ、輪郭の定まらない、小さな光だった。それでも、確かに、生きた人間の目だった。"]}, {"h": "六", "p": ["ベルは、広間の隅で、動かずに、見ていた。", "拳を、固く、握りしめていた。爪が、掌に、食い込んでいる。", "(手を出しては、いけない)", "阻害の膜は、もう、ほとんど、残っていなかった。胸の奥で、細い糸のように、切れかけている。この場で、わずかでも力を使えば、膜は完全に破れる。探知網が、一斉に、自分を捉える。", "だから、動けなかった。", "オオナムチが、祭壇の前に、膝をついている。四柱の名を、一つずつ、呼んでいる。声は、震えていた。けれど、一度も、途切れなかった。", "(あの青年は、一人で、やっている)", "教えたのは、確かに、自分だ。守りの立ち回りも、癒やしの勘も、旅の中で、少しずつ、伝えてきた。けれど、紋を呼び戻すことは、教えていない。誰も、教えていない。", "ただ、あの青年は、旅で触れたものを、全て、胸に抱えて、ここに立っている。", "(祈りの声が)", "ベルは、目を閉じた。", "オオナムチの声が、広間に、響いていた。オオヤマツミを呼び、イザナギを呼び、ホノカグツチを呼び、ツクヨミを呼ぶ。その祈りの調べに、聞き覚えがあった。", "黄泉津の宮の奥で、年に一度、行われる儀式。収穫祭の前夜に、民が、揃って、神々に捧げる祈りだ。魔界の民が、人間と同じ神々に、同じ響きで、祈っていた。", "(同じだ)", "胸が、詰まった。", "人間も、魔族も、同じ神々を、仰いでいる。そのことを、頭では、知っていた。けれど、今、一人の人間の青年の声の中に、魔界の祈りが、そのまま、息づいているのを、聞いた。", "(この青年は)", "確信が、胸の底から、静かに、立ち上がった。", "(いつか、私に、並ぶ)", "驚きは、なかった。ただ、深い、納得があった。そして、誇らしさと、わずかな寂しさが、混じり合った。育てた者が、手を引く瞬間とは、こういうものなのか。", "その時、足元が、ぐらりと、揺れた。", "視界が、一瞬、歪んだ。自分の手が、薄く、透けて見えた。", "(来たか)", "阻害が、尽きかけている。人間の青年の姿が、輪郭から、ほどけ始めた。黒髪の端が、闇に溶けるような、魔王の色に変わっていく。", "ベルは、歯を食いしばって、堪えた。", "遠く、地上から、足音が、響いてきた。", "装置の異変が、王に、伝わったのだ。祭壇の中央で、淡い光が、不規則に点滅している。濁った言霊の流れが、どこかへ、悲鳴のように、伝わっていく。", "(気づかれた)", "予想していた。けれど、それでも、胸が、冷えた。", "「オオナムチ」", "呼びかけた。", "「もう十分だ。退くぞ」", "青年が、顔を上げた。額に、汗が光っている。", "「でも、まだ、入所者の人たちが」", "「連れ出せる者だけ連れ出す。今夜はそれまでだ」", "「分かりました」", "オオナムチは、立ち上がった。ヒナの父の肩を、そっと、支えた。", "「歩けますか、先生」", "男は、ゆっくりと、頷いた。", "入所者たちが、一人、また一人、階段へ向かっていく。足取りは、重い。けれど、迷いは、なかった。紋の光が、道しるべのように、足元を照らしていた。", "ベルは、最後尾に立って、祭壇を、振り返った。", "四つの紋が、淡く、光っている。その中央で、五つ目の窪みだけが、暗く、沈黙していた。", "(アメノミナカヌシ)", "いつか、あの窪みが、光る日が、来るのだろうか。", "階段を、上り始めた。胸の奥で、膜の最後の一片が、ぱきりと、鳴った。"]}, {"h": "七", "p": ["祝賀の壇上は、光に満ちていた。", "タケルは、白銀の鎧を纏い、民の前に、立っていた。万を超える歓声が、波のように押し寄せる。誰もが、彼を、見上げていた。英雄の帰還。魔王の脅威から、民を守る者。", "胸に、小さな棘が、刺さっていた。", "(どうして、こんなに、落ち着かない)", "民の笑顔は、本物だった。感謝は、心からのものだった。それなのに、胸の奥が、ざわついている。牢の中で、粥を食べた記憶が、よぎる。静かな黒髪の男の顔が、頭の隅に、ちらつく。", "(気のせいだ)", "そう思おうとした時、壇の袖から、一人の男が、近づいてきた。", "白い礼装。柔和な顔。穏やかな目。", "アマツ王だった。", "「見事な凱旋だったな、タケル」", "王は、耳元で、優しく、囁いた。", "「民が、どれほど、そなたを、誇りに思っていることか」", "「恐れ入ります、陛下」", "タケルは、頭を下げた。胸の棘が、すっと、薄れた。王の声には、不思議な安らぎがある。この声を聞くと、迷いが、消えるのだ。", "「ところで」", "王の声が、わずかに、低くなった。", "「たった今、報せが入った。やすらぎの院に、侵入者がいる」", "「侵入者」", "「そうだ。魔族に与する者たちだ。院の患者たちを、攫おうとしている」", "タケルの目に、怒りが宿った。", "「許せません」", "「行ってくれるか」", "「もちろんです」", "タケルは、剣の柄に、手を置いた。", "「罪なき民を、守ります」", "「頼もしい」", "王は、満足げに、微笑んだ。その笑みを、タケルは、疑いなく、受け止めた。", "壇を降りながら、ふと、足が止まった。", "胸に、あの言葉が、浮かんだのだ。", "(どこかで……)", "獣ノ原で、冒険者の青年に感じた、あの違和感。黒髪の男の顔。牢の中の記憶と、重なり合って、何かが、見えかけた。", "(いや、考えすぎだ)", "頭を振った。", "「行くぞ」", "供の兵に、短く命じた。馬が、嘶いた。", "祝賀の灯籠が、風に揺れる。万の歓声を背に、勇者は、闇の中の療養院へ、向かっていった。", "その背中を、壇の上から、王が、静かに、見送っていた。", "穏やかな笑みは、少しも、崩れていなかった。ただ、その目の奥だけが、温度を、持っていなかった。"]}]}, {"id": "ch10", "label": "第十章", "title": "それでも、俺の知っているベルだ", "chars": 7594, "sections": [{"h": "一", "p": ["やすらぎの院の門前は、松明で昼のように明るかった。", "タケルは馬を下り、剣の柄に手を置いたまま、門を見据えていた。背後には兵が五十。祝賀の歓声は遠くなり、聞こえるのは、風に揺れる炎の音だけだ。", "(罪なき民を守る)", "王の言葉を、胸の内で繰り返した。それが自分の役目だ。迷いはない。迷う理由がない。", "門が、内側から開いた。", "最初に出てきたのは、継ぎの当たった外套の青年だった。獣ノ原で言葉を交わした冒険者だ。その後ろに、寝間着姿の人々が、互いに肩を支え合って続く。虚ろな目をした入所者たちだった。", "そして、最後に。", "黒髪の男が、現れた。", "タケルの呼吸が、止まった。", "松明の光が、男の顔を照らしていた。眉の端の小さな古傷。深い灰色の目。静かな、凪いだ水面のような表情。", "(この顔)", "獣ノ原で、胸に引っかかった。どこかで、と思った。思い出せなかった。それが今、頭の奥の扉が、音を立てて開いた。", "石の床。格子。赤い光の細い筋。", "その向こうに、腰を下ろして、こちらを見ていた男。傷を気遣い、食事を残さず食べたかと尋ね、責めもせず、遮りもせず、ただ聞いていた男。", "「魔界の牢で」", "声が、掠れた。", "「俺を、見下ろしていた」", "男は、何も言わなかった。否定もしなかった。", "「貴様は」", "剣を抜けなかった。抜こうとした。手が、動かなかった。目の前の男が、戦場で自分の膝を折った魔王だと、頭では分かる。それなのに、あの牢で聞いた「傷は痛むか」という声が、耳の奥に、まだ残っていた。", "(なぜ、あの時、殺さなかった)", "(なぜ、粥を出した)", "(なぜ、今、俺を睨まない)", "「なぜ」", "タケルは、絞り出した。", "「なぜ、貴様が、人間の中にいる」", "答えは、返らなかった。代わりに、夜空が、鳴った。"]}, {"h": "二", "p": ["その声は、王都のすべての屋根の上から、降ってきた。", "『ベルイザナ』", "オオナムチは、思わず、耳を押さえた。耳を塞いでも、止まらない。言葉が、骨を伝って、胸の奥まで響いてくる。", "穏やかな、柔らかな声だった。アマツ王の声だ。祝賀の壇上から、言霊に乗せて、王都全体に、その名を響かせている。", "『まことの名、ベルイザナ。黄泉の王。人に化けて潜む者よ』", "ベルの体が、びくりと揺れた。", "偽りの名「ベル」の言霊が、軋んで、剥がれていく。オオナムチは、見た。黒髪の端が、闇に溶けるような深い色に変わっていく。人の青年の輪郭が、内側から押し広げられるように、大きくなる。背が伸び、肩が広がる。額の脇から黒い角が伸び、背に、黒い翼が開いた。足元の影が、地面いっぱいに伸びた。", "目の色が、変わった。灰色の奥に、冷たい紅が、灯った。", "民が、悲鳴を上げた。", "広場の方から、波のように、ざわめきが、押し寄せてきた。祝賀の灯籠の下で、人々が、足を止め、振り返り、そして、凍りついた。", "「魔王だ」", "「魔王が、街に」", "「化けていたんだ」", "「人間のふりをして」", "恐怖の声が、数拍の後に、別の色を帯びた。憎悪だった。善良な人々の顔が、怯えから、怒りへ、静かに、傾いていく。昼の討論会で聞いた、あの「念のため」の延長が、ここで、牙を剥いた。", "(悪い人たちじゃない)", "オオナムチは、胸の底で、呟いた。", "(だから、怖いんだ)", "石が、一つ、飛んできた。ベルの足元で、砕けた。もう一つ。もう一つ。誰が投げているのかも、分からない。", "ベルは、動かなかった。避けもしなかった。ただ、立っていた。", "そして、オオナムチは、気づいた。", "自分の心が、不思議なほど、凪いでいることに。", "驚いていない。恐れてもいない。むしろ、胸の奥で、長い間、解けなかった結び目が、するりとほどけたような感覚があった。", "(ああ)", "(だからか)", "ミナモのギルドの受付で、隣に並んだ男の顔が、細部まで、くっきり見えた理由。睫毛の長さも、眉の傷も、唇の癖も。周りの誰もが一瞥して忘れる顔が、自分にだけ、いつも鮮明だった理由。", "(ずっと、見えていたんだ)", "偽りの名に隠された、本当のベルが。", "「俺の目が、よかったんじゃなかった」", "小さく、呟いた。口元に、笑みが浮かびかけた。"]}, {"h": "三", "p": ["石が、ベルの肩に当たった。痛みは、ほとんどなかった。", "(これが、人間の目か)", "ベルは、広場を見渡した。恐怖と憎悪に染まった無数の顔。さっきまで、祝賀の歌を歌っていた人々だ。焼き菓子の屋台の店主も、荷車を引いていた男も、あの中にいるのだろう。", "怒りは、湧かなかった。", "むしろ、静かな悲しみだけが、胸に降りた。彼らは、悪人ではない。ただ、そう思わされている。", "兵たちが、剣を抜いた。人垣が割れ、槍の穂先が、こちらへ向く。矛先は、ベルではなかった。", "「魔王の仲間を捕らえろ！」", "「入所者を奪うつもりだ！」", "槍の列が、オオナムチと、入所者たちへ、迫った。寝間着の人々が、悲鳴を上げて、身を寄せ合う。ヒナの父が、震える手で、札を握りしめた。", "(手を出せば)", "膜は、もう、ない。力を解けば、探知網が、すべてを捉える。いや、もう、捉えられている。名は、暴かれた。隠す意味は、残っていない。", "(ならば)", "ベルは、一歩、前に出た。", "力が、体の底から、湧き上がる。黄泉の王の力が、堰を切って、満ちてくる。足元の石畳が、低く、鳴った。松明の炎が、一斉に、地面に伏した。", "兵たちが、怯んだ。", "けれど、ベルは、誰も、傷つけなかった。", "槍の穂先が、ひとつ残らず、静かに、止まった。兵の手の中で、力が抜けたように。刃は、振り下ろされなかった。誰の膝も、折れなかった。ただ、動きが、ほんのひととき、止まっただけだ。", "(2章とは、違う)", "焼けた根の洲で、何千もの命を、跡形もなく消した、あの日の自分。顔を見なかった。見ようとしなかった。あれが人だったのかどうか、知らないまま。", "(今は、見える)", "兵の一人ひとりの顔が、見えた。若い男の、怯えた目。老いた兵の、震える唇。誰もが、誰かの息子で、誰かの父だった。", "力を、守るためだけに、使った。", "その時、青年が、前に出た。", "継ぎの当たった外套の背中が、ベルの視界を、塞いだ。細い体で、両腕を広げて、槍の列と、ベルの間に、立ちはだかった。", "「待て」", "オオナムチの声が、広場に、響いた。", "「その人を、傷つけるな」", "「どけ、冒険者！ 魔王だぞ！」", "「知ってる」", "背中が、震えていた。それでも、一歩も、退かなかった。", "「知ってる。それでも」", "オオナムチは、振り返った。ベルの紅い目を、まっすぐ、見上げた。", "「それでも、お前は、俺の知っているベルだ」", "ベルの呼吸が、止まった。", "「なぜ」", "声が、掠れた。", "「私は魔王だ。おまえの国を戦に巻き込んだ側の王だ。おまえは、それを」", "「関係ない」", "青年は、首を振った。", "「手紙の届け物を、一緒に運んだ奴だからだ」", "その言葉が、胸の奥まで、届いた。", "ひなた野への道。野犬の唸り声。夕焼けの帰り道。銅貨十枚の依頼。半分ずつだと、笑った顔。", "「誰も受けない依頼を、わざわざ選ぶ人間を、初めて見た、って言ったろ」", "オオナムチは、続けた。", "「お前だって、そうだ。誰も、頼んでない。魔王のくせに、人間の街の掲示板の前で、立ち止まって、拳を握ってた。誰かが順番を飛ばされた時、本気で、悔しそうな顔をしてた」", "「見て、いたのか」", "「ずっと、見えてたんだ。お前の顔は」", "青年は、泣きそうな顔で、笑った。", "「ずっと、はっきり、見えてた。俺には」", "ベルは、何も、言えなかった。", "胸の奥で、何かが、ほどけた。長い、長い時間、固く結ばれていたものが。", "(私は、一人ではなかった)", "偽名の下に、隠していた顔を、最初から、見てくれていた者がいた。", "「……ありがとう」", "それだけが、やっと、口から、出た。"]}, {"h": "四", "p": ["兵の列の向こうで、誰かが、叫んだ。", "「道を開けるぞ！ 南の城門へ！」", "コトシロだった。軍務局の制服の襟を乱し、大きな巻物を、頭上に掲げている。額から、汗が流れていた。", "「軍務局の緊急通達だ！ 魔王の護送を行う！ 南門の守備兵は、通行を許可せよ！」", "兵たちが、ざわついた。偽の通達だと、気づく者は、いなかった。軍務局の印が、確かに、押されていた。コトシロが、この日のために、何夜もかけて、細工した書状だった。", "(命を、懸けているんだ)", "オオナムチは、胸が詰まるのを感じた。", "「こちらです！」", "別の声が、闇の中から、響いた。", "路地の入口に、栗色の尻尾が、揺れていた。", "「ウズメさん」", "「待たせたね！ 貧民区の近道、全部、把握してるよ！」", "猫に似た耳を、ぴんと立てた斥候が、片目を瞑った。その後ろに、獣ノ原から呼び寄せた者たちの影が、いくつも、見えた。", "「追手は、あたしたちが足止めする。ヒエダ爺の弟子たちも、来てる」", "「ヒエダさんは」", "「怪我人は、里で寝てる。でも、口だけは達者でね。『いけませんぞ、一人で突っ込んでは』って、あたしに、小言を」", "ウズメは、笑った。それから、一瞬だけ、真剣な目になった。", "「行きな。ここは、あたしたちの番だ」", "人垣の向こうから、白い霧が、流れ込んできた。", "どこからともなく、街路に、薄い靄が満ちていく。松明の光が、にじんで、輪郭を失う。兵たちの目が、眩んだ。", "「聖の森の、霧です」", "澄んだ声が、霧の中から、聞こえた。", "石畳の上に、小柄な影が、立っていた。尖った耳を持つ、皮肉屋の娘。コノハが、弓を背に負い、腰の短い剣に手を添えていた。その隣に、淡い緑の髪の老人が、杖をついて、にやりと笑っている。", "「間に合ったかの」", "「スクナさん」", "「森の道は、王都の外縁まで、繋げてある。通れ、若いの」", "「でも、どうして、ここに」", "「別に、待ってたわけじゃないけど」", "コノハは、そっぽを向いた。", "「ただ、クシナダ様が、行けと言っただけ。『中立とは、助けを求める者を拒まないこと』なんだって」", "その声は、少し、震えていた。", "兵の一隊が、霧の中から、突っ込んできた。槍を構え、まっすぐ、一行へ向かってくる。", "その先頭の兵の腰に、一本の剣が、下がっていた。", "炉ヶ岳の紋が、鞘に刻まれている。偽りの納品の剣だった。", "兵が、剣を抜いた。振り上げた。", "そこで、止まった。", "腕が、上がらなかった。刃が、頭上で、小刻みに、震えている。兵の顔に、戸惑いが、浮かんだ。", "「なんだ、これは」", "声が、掠れていた。", "「この剣を、握ると」", "「考えが、澄む」", "隣の兵が、呟いた。", "「あの人は、魔王かもしれない。でも、何か、おかしくないか。昨日まで、怖いと思っていたのに」", "兵たちの足が、一人、また一人、止まっていく。", "遠く、炉ヶ岳の方角で、誰かが、炉に薪を足した気がした。カナメが、不器用に、そっぽを向いた顔が、浮かんだ。", "(腕なら、貸す、って)", "あの言葉の意味が、ここで、報われた。", "霧の中、道が、ひらけた。", "「行きましょう」", "オオナムチは、ベルの腕を、取った。", "「今は、走るんです」", "「ああ」", "ベルは、頷いた。", "そして、ふと、気づいた。", "(人間にも、味方が、いた)", "偽りの納品が、兵の剣を鈍らせている。霧が、追手の目を眩ませている。貧民区の路地が、道を開いている。軍務局の偽書状が、城門を開けようとしている。", "いずれも、旅の途中で、ほんの一時、言葉を交わした人々の仕事だった。", "(私は、滅ぼしに来たのではない)", "(この人々に、会いに来たのだ)", "霧の向こうで、ユウの声が、聞こえた。", "「待て！ 魔王を逃がすな！」", "白い腕章の青年が、追手の列の先頭で、槍を構えていた。目は、虚ろだった。", "オオナムチは、足を止めた。", "「ユウ！」", "叫んだ。", "「ハルが、待ってる！」", "ユウの足が、ぴたりと、止まった。", "「ハルが、毎晩、お前の手紙を読んでる。字を拾い読みして、笑ってるんだ。『兄ちゃんの字だ』って」", "ユウの槍が、かすかに、下がった。", "「元気だって、約束した。『元気だよ』って、俺は、ハルに、言ったんだ」", "唇が、震えた。", "「だから、帰ってこい。必ず、取り戻す」", "ユウの目に、一瞬、涙が、滲んだ。", "けれど、それは、すぐに、消えた。頭の中の声が、また、彼を捕らえたのだろう。ユウは、ゆらりと、背を向けた。", "その背中は、どこか、迷子のように、小さかった。"]}, {"h": "五", "p": ["貧民区の路地の奥に、小さな家があった。", "オオナムチたちが、転がり込むように、戸を叩いた。", "「ミオさん！」", "中から、慌ただしい足音がして、戸が、開いた。痩せた女が、息を呑んで、立ち尽くした。", "背後の人影に、気づいたのだろう。", "寝間着の男が、ヒナの父が、オオナムチに支えられて、敷居の上に、立っていた。", "「……あなた」", "ミオの声が、震えた。", "男は、ゆっくりと、顔を上げた。", "「ミオ」", "その名が、唇から、零れた。", "「ミオ、か」", "「そう、よ。私よ」", "ミオの手が、口元を覆った。涙が、止まらなかった。", "「あなた、覚えて、いるの」", "「名前、だけ」", "男は、小さく、頷いた。", "「それだけ、残っていた。ヒナの、名と、おまえの、名と」", "奥の布が、揺れた。", "小さな足音が、駆けてきた。", "「お父さん！」", "ヒナだった。握りしめた布の袋を、胸に抱いて、飛び出してきた。", "男の足が、かくりと、折れかけた。ヒナが、その腰に、しがみついた。", "「お父さん、お父さん、お父さん」", "「ヒナ」", "男の手が、娘の頭に、そっと、置かれた。", "「大きく、なったな」", "「お花、まだ、咲いてないの。でも、毎日、お水をあげてるよ」", "「そうか」", "男は、娘の頬を、指でなぞった。", "「約束、守れなくて、すまなかった」", "「ううん」", "ヒナは、首を振った。小さな手で、父の手を、ぎゅっと、握りしめた。", "「帰ってきたから、いいの」", "オオナムチは、その光景を、戸口から、見ていた。", "胸が、いっぱいだった。", "(取り戻せた)", "全員ではない。まだ、院には、多くの人が、残っている。ユウも、まだ、王の声の中だ。それでも、一人の父親が、娘の腕の中に、帰ってきた。", "「行きましょう」", "隣で、ベルが、静かに言った。紅い目は、元の灰色に、戻りかけていた。", "「ここは危うい。必ず、また来る」", "「は

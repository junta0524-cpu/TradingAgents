", "「……はい」", "霧が、少しずつ、晴れていった。段々田の稲が、朝の光に、濡れて光った。", "「土は、黙っているが、忘れはせん」", "ハニヤスは、誰に言うでもなく、言った。", "畦の脇で、小さな芽が、霧の雫を、受けていた。"]}, {"h": "七", "p": ["地下道を出たのは、昼を過ぎてからだった。", "入口の岩の上に、シイが、まだ座っていた。", "コノハは、岩の前で、足を止めた。", "オオナムチとベルが、少し後ろで、立ち止まる気配がした。何も言わない。待っている。", "コノハは、息を吸った。", "喉が、うまく開かなかった。何年も、口にしていない名だった。森で、誰も呼ばない名だった。呼べば、自分も、森の端から、さらに外へ押し出される気がした。", "けれど、地下道の石の前で、スクナは言った。名は、石に刻めば、残ると。", "ベルは言った。呼ばれぬ者は、消えていくと。", "「シイ」", "声は、小さかった。", "岩の上の弓手が、ゆっくりと、振り向いた。", "「……今、何て」", "「シイ、って言ったの。あなたの名前でしょ」", "コノハは、腕を組んで、そっぽを向いた。頬が、熱かった。", "「大蜘蛛は、片づいたわ。巣を、脇の通路へ移しただけだけど。もう、出口はふさがってない。見張りの仕事、続けるなら、教えておこうと思って」", "シイは、しばらく、何も言わなかった。", "その輪郭が、木漏れ日の中で、少しずつ、戻ってくるのが見えた。弓を握る指の節。日に焼けた、頬の線。", "「……ありがとう、コノハ」", "今度は、コノハが、振り向く番だった。", "名を、呼ばれた。森で、自分の名を呼ぶ者は、スクナのほかに、いなかった。", "「別に。礼を言われるようなこと、してないわよ」", "コノハは、早口に言って、歩き出した。", "オオナムチが、後ろで、小さく笑う声がした。コノハは、聞こえないふりをした。", "その夜、二人は、森の外れの村、ククノチに泊まった。", "村の真ん中に、大きな木があった。幹は、大人が十人で囲んでも届かない。村の年寄りが言うには、耳を当てると、声が聞こえるという。", "オオナムチは、夜更けに、一人で、その木の前に立った。", "幹に、耳を当てた。", "最初は、何も聞こえなかった。風の音と、自分の鼓動だけだった。", "しばらくして、かすかな、ざわめきが聞こえた。", "人の声のようだった。何人もの声が、重なり合っている。何を言っているのかは、分からない。ただ、一つだけ、繰り返されている響きがあった。", "誰かが、誰かの名を、呼んでいるような響きだった。", "オオナムチは、幹から耳を離した。", "村の道の端に、籠を背負った娘が、立っていた。薬草摘みの帰りらしい。籠から、蓬の匂いがした。", "その顔が、霧の向こうにあるように、ひどく薄く見えた。", "「あの」", "オオナムチは、思わず、声をかけた。", "「お名前、聞いてもいいですか」", "娘は、驚いたように、目を丸くした。それから、少しだけ、考えるような顔をした。", "「……ツユクサ。たぶん、ツユクサ。最近、誰にも、呼ばれないから」", "「ツユクサさん」", "オオナムチは、その名を、ゆっくりと呼んだ。", "娘の輪郭が、ほんの少しだけ、濃くなった気がした。"]}, {"h": "八", "p": ["宿場町ヤチマタは、昼も夜も、人の声が絶えなかった。", "ベルは、宿の二階の窓から、通りを見下ろしていた。", "街道が、四方から集まる町だった。北へ行けば炉ヶ岳、東へ行けばミナモ、西へ行けば聖の森。通りには、荷車と旅人と、物売りの声があふれていた。", "下の通りで、荷車の男たちが、話していた。", "「炉ヶ岳の衆、近ごろ、忙しいらしいぞ」", "「また、剣か。この前も、荷が増えたばかりだろう」", "「王都の触れだとよ。山の連中、火を落とす暇もないって話だ」", "男たちは、肩をすくめて、笑った。誰も、怒ってはいなかった。ただ、そういうものだ、という顔をしていた。", "ベルは、窓枠を、指でなぞった。", "(剣が、増えている)", "人間の王は、戦の準備を、急いでいる。根の洲の焼け跡は、まだ、くすぶっているのに。", "「ベルさん」", "部屋の戸口に、オオナムチが立っていた。手に、湯気の立つ椀を二つ持っている。", "「宿の人が、汁物をくれました。旅の人には、ただで出してるんだって」", "「感謝する」", "ベルは、椀を受け取った。温かかった。", "二人で、窓辺に並んで、汁をすすった。通りの喧騒が、下から上ってくる。", "「ベルさん」", "「何だ」", "「昨日、森の底で、言ってましたよね。名を呼ばれない人は、消えていくって」", "ベルは、椀を持つ手を、止めた。", "「俺、ずっと、目がいいだけだと思ってたんです。人の顔が、はっきり見えるのは」", "オオナムチは、椀の中を、見つめていた。", "「でも、イサナさんも、シイさんも、ツユクサさんも。薄く見える人は、みんな、誰にも名前を呼ばれてない人でした」", "「……そうか」", "「俺に、何ができるのか、分からないです。でも、見えるなら、呼べます」", "オオナムチは、顔を上げた。", "「見えた人の名前は、全部、呼ぼうと思います」", "ベルは、青年の顔を、見た。", "灯りの中で、その顔は、くっきりと見えた。迷いのない目だった。森の底の石に刻まれた、古い文字と、同じくらい、まっすぐな。", "(この青年は、いつか)", "ミナモの夕焼けの道で、思ったことを、もう一度、思った。", "「よい考えだ」", "ベルは、それだけ言った。", "オオナムチは、少し照れたように、椀を両手で包んだ。", "「ユズリハさんの話、覚えてますか。皆で、互いの名を呼び合う祭り」", "「ああ」", "「そういう祭り、本当にあったんでしょうか。今は、どこにもないですよね。人も、エルフも、大穴の向こうの人たちも、一緒に、なんて」", "ベルは、窓の外の、赤くない夜空を見た。", "魔界の空は、昼でも赤い。その赤い空の下で、今年も、収穫祭の準備が進んでいるはずだった。畦に並ぶ民の顔を、ベルは、一人ずつ、思い浮かべることができた。", "その祭りの席に、人間の客は、一人もいない。", "「どこかには、まだ、残っているかもしれぬ」", "ベルは、言葉を選んで言った。", "「名を呼び合う祭りが」", "「だったら、いつか、行ってみたいです」", "オオナムチは、何の疑いもなく、そう言った。", "ベルは、答えなかった。答えられなかった。ただ、胸の奥で、小さな火が、灯った気がした。いつか、この青年を、あの畦へ連れていけるだろうか。赤い空の下の、あの祭りへ。", "(いつか)", "その言葉を、そっと、胸にしまった。", "「ミナモに戻ったら、また、依頼を探しましょう。炉ヶ岳の荷運びとか、あるかもしれないですね」", "「ああ」", "ベルは、窓の外を見た。", "北の空に、炉ヶ岳の稜線が、黒く浮かんでいた。その上に、細い煙が、一筋、立ちのぼっていた。夜も、火を落とさない炉の煙だった。", "通りの向こうで、誰かが、誰かの名を、大声で呼んでいた。笑い声が、それに応えた。", "ベルは、汁の最後のひと口を、ゆっくりと飲み干した。"]}]}, {"id": "ch06_5", "label": "第六・五章", "title": "納めの鉄", "chars": 9533, "sections": [{"h": "一", "p": ["霧は、山道を下るほどに、濃くなった。", "途中までは、カナメが、黙って先を歩いていた。山の裾へ出る分かれ道で、カナメは足を止め、「ここまでだ」とだけ言って、里へ引き返していった。", "オオナムチは、足もとの石を確かめながら、前を行く背中を見ていた。", "ベルは、黙っていた。", "もともと、口数の多い人ではない。けれど、今朝の沈黙は、いつもと違った。里の門を出てから、一度も、こちらを振り返らない。霧の向こうを、じっと見据えたまま、歩いている。", "外套の脇で、右の手が、握られていた。", "港の掲示板の前で、見たのと、同じ形だった。", "(何か、あったんだ)", "門の前で、空を見上げたベルの顔を、思い出した。ほんの一瞬、鋭い影が差して、すぐに消えた。あれから、ずっと、この沈黙が続いている。", "聞こうか、と思った。", "聞けば、この人は、答えてくれるかもしれない。答えられないことなら、答えられないと言うだろう。どちらにしても、嘘はつかない人だ。", "だからこそ、聞かなかった。", "答えられないことを、言わせたくなかった。", "「ベルさん」", "代わりに、別のことを言った。", "「道、こっちで合ってます。麓の村で、一泊できるはずです」", "「ああ」", "ベルは、短く答えた。それから、少しだけ、歩みを緩めた。オオナムチが、隣に並べるくらいに。", "霧が晴れたのは、昼を過ぎてからだった。", "山の裾に、黒っぽい屋根の集落が見えた。鉱夫村マガネ。炉ヶ岳の里に、鉄の鉱石を送り出している村だと、カナメが言っていた。", "村に入ると、昼間なのに、人の姿が少なかった。", "坑道の口から、男たちが、ふらふらと出てくる。顔も腕も、岩の粉で灰色だった。日の光に、目を細めて、そのまま、地面に座り込む者もいた。入れ替わりに、別の男たちが、つるはしを担いで、坑道の暗がりへ入っていく。", "「交代、ですか」", "オオナムチが、座り込んだ坑夫に、声をかけた。", "坑夫は、ぼんやりと顔を上げた。", "「昼も夜もさ。炉ヶ岳の里が、倍の注文を受けたんだと。そのぶん、鉄の石も倍、納めろってな。期限は、十日」", "坑夫は、乾いた声で笑った。", "「炉ヶ岳の衆も、気の毒にな。だが、俺らも、気の毒だ」", "オオナムチは、ベルを見た。", "ベルは、坑道の口を、じっと見つめていた。灰色の目が、わずかに、暗く沈んでいた。", "炉ヶ岳で、官吏が言った「倍」の一言。それが、山を下りて、ここにも届いている。里の職人の腕を締め上げ、その鉄を掘る坑夫の背を、さらに締め上げている。", "一本の命令が、どこまで、人を削っていくのか。", "オオナムチには、まだ、その果てが、見えなかった。"]}, {"h": "二", "p": ["フジは、井戸端で、芋を洗う手を止めた。", "見慣れない若い男が二人、村の通りを歩いていた。継ぎの当たった外套の細い子と、黒い外套の、背の高い男。冒険者だ、と、すぐに分かった。坑夫は、あんなに、背筋を伸ばして歩かない。", "(冒険者なら、宿場を通るかもしれない)", "フジは、前掛けで手を拭いた。懐の奥に、手を当てる。紙の、かさりとした感触があった。", "息子のカイが、村を出て、二年になる。", "坑夫の子は、坑夫になるものだ。カイの父親も、祖父も、そうだった。けれど、カイの父親は、五年前、落盤で死んだ。古い竪坑だった。それ以来、カイは、坑道の暗がりに、入れなくなった。", "「ごめん、母ちゃん。俺、穴に入ると、息ができなくなる」", "震える声で、そう言った。", "だから、送り出した。宿場町ヤチマタの、大きな宿で、下働きの口があった。カイは、毎月、少しずつ、銅貨を送ってくれた。けれど、手紙は、一度も来なかった。", "カイは、字が書けない。フジも、書けない。", "それでも、伝えたいことが、あった。", "だから、頼んだ。村で、たった一人、字の書ける人に。", "「もし」", "フジは、通りの二人に、声をかけた。", "「冒険者さん。ヤチマタのほうへは、行きなさるかね」", "細い子のほうが、足を止めた。", "「ヤチマタ、ですか。帰り道なので、通ると思います」", "「そうかい」", "フジは、懐から、紙の包みを取り出した。端が、何度も折られて、柔らかくなっていた。", "「これを、息子に、届けてもらえんかね。ヤチマタの、大宿で働いとる。カイという名の、ひょろっとした子だよ」", "細い子は、包みを、両手で受け取った。そっと、壊れ物を扱うように。", "「お預かりします」", "「お代は、これしかないけど」", "フジは、銅貨を三枚、差し出した。細い子は、首を振った。", "「道の、ついでです」", "「でも」", "「本当に、ついでですから」", "細い子は、少し笑った。それから、包みの表を見た。宛名の字は、細くて、きちんとしていた。", "「きれいな字ですね」", "「スミさんが、書いてくれたんだよ」", "フジは、言ってから、口をつぐんだ。", "周りを、見回した。井戸端には、誰もいなかった。それでも、声を、ひそめた。", "「炭焼きの、スミさん。……もう、村の名簿には、いない人だけどね」", "細い子が、首をかしげた。黒い外套の男のほうは、黙って、フジの顔を見ていた。", "フジは、言わなければよかった、と思った。けれど、一度こぼれた言葉は、戻らない。", "「ひと月前にね、役人が来て、古い竪坑を掘り直せって言ったんだよ。鉄が足りないからって。あの穴で、うちの人は死んだのに」", "声が、少し、震えた。", "「誰も、逆らえなかった。逆らったのは、三人だけ。鍛冶のハガネさんと、スミさんと、炉番の見習いのタタラ。あの穴は、人が入っちゃいけない穴だって」", "「それで」", "「役人が、頭に言ったのさ。名簿から、消せって。名簿にない者は、村の者じゃない。配給の麦も、渡さなくていいって」", "細い子の顔が、こわばった。", "「それから、村の者は、あの三人の名を、口にしなくなった。口にすると、自分も、同じ側だと思われるからね。……わたしも、そうだよ」", "フジは、懐の空になったところを、そっと押さえた。", "「それでも、スミさんは、夜中に、わたしの家へ来て、この手紙を書いてくれた。灯りもつけずに、月明かりで。名を呼ばない女のためにさ」", "井戸の水面が、風に揺れた。", "フジは、それ以上、何も言えなかった。"]}, {"h": "三", "p": ["その夜、ベルは、村はずれの宿の窓から、外を見ていた。", "宿といっても、坑夫の寄り合い所の二階を、旅人に貸しているだけの部屋だった。隣の寝台で、オオナムチは、預かった手紙を枕元に置いて、もう眠っていた。", "ベルは、眠れなかった。", "今朝の、言伝が、まだ耳の奥に残っていた。", "『タケルたちが、牢を破りました』", "オモイカの、張りつめた声だった。それ以上のことは、まだ、分からないという。どうやって。誰の手引きで。ナキメは、無事なのか。", "(落ち着け)", "拳を、握りかけて、開いた。", "ここで、自分が取り乱しても、何も変わらない。魔界には、オモイカがいる。四天王がいる。今の自分にできることは、偽名の膜を守り、この青年の隣を、歩き続けることだ。", "窓の下で、何かが、動いた。", "小さな人影だった。月明かりの中を、村はずれへ、走っていく。背丈は、子どもくらい。肩に、何かを担いでいる。つるはしだ。", "人影は、柵を越えて、山の斜面を登っていった。その先に、黒い口が、ぽっかりと開いていた。", "板で、ふさがれた坑道の口だった。", "ベルは、窓から身を引いた。", "「オオナムチ」", "「……ん、はい」", "青年は、すぐに目を開けた。眠りの浅い子だ。", "「子どもが一人、古い竪坑へ入っていった」", "オオナムチは、跳ね起きた。", "外へ出ると、坑道の口の前に、二人の大人が立っていた。", "一人は、背の低い、がっしりした男だった。腕が太く、指先が、黒く焼けていた。もう一人は、痩せた女で、髪に、炭の粉がついていた。", "二人とも、輪郭が、薄かった。", "月明かりのせいではない。港の、イサナという老人と、同じだった。霧の向こうに立っているように、顔が、うまく、目に留まらない。", "「タタラが、入っちまった」", "男が、板の隙間を覗きながら、かすれた声で言った。", "「止めたんだ。あいつ、鉄を掘ってくれば、名簿に戻してもらえるって。俺たちの名も、戻るって」", "「この竪坑は、二十年前に閉じたんです」", "女が、震える声で続けた。", "「奥に、岩喰らいが棲みついて。落盤で、何人も死んで」", "ベルは、二人の顔を、見ようとした。見えにくかった。名を、呼ばれていない者の顔だ。", "ミナモの港で、同じものを見た。聖の森でも、見た。森を出たときは、まだ、どこか遠い土地の話だと思っていた。", "(違う)", "港でも、森でも、山でも、同じことが起きている。今は、足もとの話だ。誰かが命じたわけではない。誰も、術をかけていない。ただ、名を呼ぶことが、少しずつ、危ういことになっていく。呼ばなければ、面倒がない。呼ばなければ、自分は、向こう側に立たずに済む。", "その小さな沈黙が、積み重なって、人の輪郭を、削っていく。", "王の言霊が、街の掲示板や、刃の表に刻まれているのを、ベルは見てきた。けれど、これは、もっと静かだった。刻まれた言葉ではなく、言われなくなった言葉が、人を消していた。", "「そなたらの、名は」", "「……え」", "「名だ」", "男が、ぽかんと口を開けた。それから、絞り出すように、言った。", "「ハガネだ。鍛冶をやってる」", "「スミです。炭を、焼いています」", "名を口にした瞬間、二人の輪郭が、わずかに、戻った。", "ベルは、うなずいた。", "「ハガネ。スミ。中の道を、知っているか」", "「ああ。昔、俺が掘った坑道だ」", "「案内しろ。行くぞ」"]}, {"h": "四", "p": ["竪坑の中は、冷たかった。", "オオナムチは、掌に、火を灯した。", "「――火種」", "小さな炎が、ゆらりと立ち上がった。岩壁が、橙色に照らし出される。湿った岩肌に、古いつるはしの跡が、無数に刻まれていた。", "ハガネが先に立ち、スミが続いた。その後ろに、オオナムチと、ベル。", "坑道は、奥へ行くほど、狭くなった。天井から、ときどき、砂がさらさらと落ちてくる。", "「タタラ」", "スミが、小さく呼んだ。返事は、なかった。", "やがて、坑道が、少し広くなった。崩れた岩の山の向こうから、かつん、かつん、と、つるはしの音が聞こえた。", "「タタラ！」", "岩の山を回り込むと、少年が、壁に向かって、つるはしを振るっていた。十四か、十五か。痩せた背中だった。この少年も、輪郭が、薄かった。", "「ハガネさん、スミさん」", "少年が、振り返った。顔が、煤と汗で、まだらになっていた。", "「見てよ、ここ。鉄の石が、まだ、こんなに。これだけ掘って帰れば、頭も、名簿に戻してくれる。俺たちの名も」", "その時、足もとが、揺れた。", "岩の山が、動いた。", "いや、岩ではなかった。灰色の、ごつごつした背中が、ゆっくりと、持ち上がっていく。岩と同じ色の皮膚。岩を噛み砕く、平たい歯。眠っていた目が、火種の光を受けて、鈍く光った。", "岩喰らいだった。", "「下がれ」", "ベルの声が、低く響いた。", "ベルは、少年の前に、出ていた。剣に、手をかけている。けれど、抜かなかった。", "(使えない)", "ベルは、奥歯を噛んだ。", "この程度の獣なら、指一本で、眠らせられる。けれど、それをすれば、偽名の膜が、大きく削れる。今朝の言伝が、頭をよぎった。王の目が、どこまで届いているのか、分からない。タケルが牢を破った今、ここで力の匂いを残せば、網に、自分の居場所を教えることになる。", "(それでも、子どもが死ぬなら)", "膜など、どうでもいい。ベルは、剣の柄を握る指に、力を込めかけた。", "オオナムチには、そんなことは、分からなかった。ただ、ベルの肩が、ひどく硬くなっているのが見えた。何かを、こらえるように。", "岩喰らいが、口を開いた。", "天井が、震えた。ぱらぱらと、小石が降ってくる。", "「――堅め！」", "オオナムチは、叫んでいた。", "膜が、広がった。ベルに教わったとおり、薄く、広く。自分の周りだけではなく、少年と、ハガネと、スミを、ぐるりと包むように。", "落ちてきた岩が、膜の上で、跳ねた。膜が、軋んだ。破れなかった。", "(半分ずつ、包め)", "港の宿の裏庭で、何度も、繰り返した言葉だった。", "岩喰らいが、一歩、前に出た。重い足音が、坑道に響く。", "オオナムチは、掌の火を、見た。", "小さな火だった。この怪物を、焼き尽くせる火ではない。", "(焼くんじゃない)", "炉ヶ岳の、炉番の声が、よみがえった。", "火は、壊すだけではない。作り直す力でもある。", "オオナムチは、火種を、岩壁に向けた。", "坑道の脇に、古い燭台が、いくつも埋め込まれていた。二十年前、坑夫たちが、灯りをともしていたものだ。その芯に、火を移していく。一つ、二つ、三つ。", "坑道が、明るくなった。", "岩喰らいが、ひるんだ。目を細め、首を振る。長い眠りの中で、光を忘れていた目だった。", "「この奥へ、戻ってくれ」", "オオナムチは、怪物に向かって、言った。", "「ここは、お前の寝床だったんだろう。起こして、悪かった。でも、この子は、連れて帰る」", "岩喰らいは、しばらく、灯りの列を見つめていた。", "それから、低く、唸った。重い体を、引きずるように、向きを変えた。崩れた岩の向こうの、暗い穴へ、ゆっくりと、沈んでいった。", "坑道に、静けさが戻った。", "オオナムチは、その場に、膝をついた。膜が、ほどけていく。腕が、震えていた。", "ベルが、隣に、しゃがんだ。", "「よくやった」", "その声も、少し、震えていた気がした。"]}, {"h": "五", "p": ["夜明けの村に、四人が戻ると、坑道の口の前に、人だかりができていた。", "坑夫たちだった。交代の男たちも、休んでいた男たちも。その真ん中に、村の頭が、帳面を抱えて立っていた。", "「タタラ。おまえ、また、勝手な」", "頭が、言いかけて、口をつぐんだ。", "少年の肩に、ハガネの太い手が、置かれていた。反対側で、スミが、少年の手を握っていた。三人とも、煤だらけだった。", "「古い竪坑は、岩喰らいの寝床です」", "オオナムチが、前に出た。", "「二度と、入らないでください。ここの鉄は、掘っちゃいけない鉄です」", "頭は、何も言わなかった。帳面を、握りしめていた。", "「頭」", "坑夫の一人が、声を上げた。", "「ハガネたちを、名簿から消したのは、あんたじゃねえ。役人だ。古い竪坑を掘り直せって命令を、こいつらだけが断った。だから、消された」", "「分かっとる」", "頭が、うめくように言った。", "「分かっとるさ。だがな、名簿に戻せば、役人に、目をつけられる。鉄の納めが、また、増える。わしは、村を、守らにゃならん」", "誰も、言い返せなかった。", "オオナムチは、頭の顔を見た。悪い人の顔ではなかった。ただ、ひどく、疲れていた。ミナモの宿の主人と、同じ、困ったような眉をしていた。", "その時、坑夫の一人が、ぽつりと、言った。", "「ハガネ」", "太い腕の男が、顔を上げた。", "「俺のつるはし、先が欠けちまった。また、打ち直してくれよ」", "「……ああ」", "別の坑夫が、言った。", "「スミさん。炭、分けてもらえるか。うちの竈が、もう空っぽでな」", "「ええ。もちろん」", "また、別の誰かが。", "「タタラ。おまえ、無茶すんなよ」", "少年が、くしゃりと顔を歪めて、うなずいた。", "「俺……俺、名簿に戻れば、また、みんなに呼んでもらえると思ったんだ」", "少年は、煤だらけの手で、目をこすった。", "「ひと月、誰も、俺の名を呼ばなかった。炉の前に立っても、誰も、こっちを見ないんだ。ハガネさんとスミさんだけが、呼んでくれた。でも、そのうち、自分でも、自分が誰だか、よく分からなくなってきて」", "坑夫たちが、目を伏せた。", "「名簿に戻らなくてもよかったんだな。ただ、呼んでもらえれば」", "少年の声は、朝の空気の中に、細く、消えていった。", "名が、呼ばれるたびに、三人の輪郭が、濃くなっていった。朝の光の中で、オオナムチには、それが、はっきりと見えた。", "頭は、帳面を開いた。長いこと、それを見つめていた。", "それから、懐から、炭の欠片を出した。消された三つの名の横に、小さく、何かを書き足した。", "字ではなかった。小さな丸が、三つだった。", "「名簿には、戻せん」", "頭は、言った。", "「だが、この村の者だ。……それで、勘弁してくれ」", "ハガネが、黙って、頭を下げた。", "ベルは、少し離れたところで、その様子を見ていた。オオナムチが振り返ると、ベルは、坑道の口を、見上げていた。", "燭台の火が、一つ、まだ、奥で燃えていた。", "ベルの横に並ぶと、ベルは、坑道から目を離さずに、言った。", "「そなたは、あの獣を、焼かなかったな」", "「焼けるほどの火じゃ、なかったですから」", "「焼ける火であっても、焼かなかっただろう」", "オオナムチは、少し考えた。それから、うなずいた。", "「あいつの寝床に、勝手に入ったのは、俺たちのほうです」", "ベルは、何も言わなかった。けれど、その横顔が、ほんの少しだけ、ほどけたように見えた。"]}, {"h": "六", "p": ["宿場町ヤチマタは、街道が八方へ分かれる辻に、広がっていた。", "大宿は、町の真ん中にあった。二階建ての、大きな建物だ。裏口から、湯気と、煮物の匂いが、流れてくる。", "カイは、裏庭で、薪を割っていた。", "ひょろりと背の高い若者だった。フジの言ったとおりだ。斧を振る腕は細いが、薪は、きれいに二つに割れていた。", "「カイさん、ですか」", "オオナムチが、声をかけた。", "若者は、斧を止めて、振り向いた。", "「マガネの、フジさんから。手紙を、預かってきました」", "カイの顔が、固まった。", "「……母ちゃんから」", "「はい」", "オオナムチは、包みを差し出した。カイは、斧を地面に置き、前掛けで、手を何度も拭いた。それから、両手で、包みを受け取った。", "封を開ける指が、震えていた。", "カイは、薪の山に腰を下ろし、紙を膝の上に広げた。", "けれど、すぐには、読まなかった。紙の上の字を、じっと見つめていた。", "「俺、字、あんまり読めないんだ」", "小さな声だった。", "「宿の帳場の人に、少しずつ、教わってるんだけど」", "「ゆっくりで、いいですよ」", "カイは、うなずいた。指を、紙の上に置いた。一字ずつ、なぞっていく。", "「か、い、へ」", "唇が、動いた。", "「げ、ん、き、で、す、か」", "オオナムチは、息を止めた。", "ひなた野で、ハルが、兄の手紙を読んでいた姿が、重なった。地面にしゃがみ込み、指で、一字ずつ、辿っていた。少年の顔が、ゆっくりとほころんでいった、あの夕方。", "カイの指が、進んでいく。", "「か、あ、ちゃ、ん、は、げ、ん、き、で、す。お、ま、え、が、お、く、っ、て、く、れ、る、ぜ、に、で、い、も、を、か、い、ま、し、た」", "カイの声が、途切れた。", "「……穴に、はいれなくても、おまえは、わたしの、じまんの、むすこです」", "指が、止まった。", "カイは、紙を、胸に押し当てた。肩が、震えていた。声は、出さなかった。", "オオナムチは、何も言わなかった。ただ、隣に、しゃがんでいた。", "(ユウ)", "幼なじみの、少し右に傾く字を、思い出した。ハルへの手紙は、届いた。けれど、ユウ自身は、どこで、何をしているのだろう。街で働いている、と聞いた。それきりだった。", "(元気だよ)", "ハルに、そう言った。言ってしまった。", "本当は、知らない。ユウが、今、どんな顔をしているのか。", "しばらくして、カイが、顔を上げた。目が、赤かった。", "「この字、スミさんの字だ。あの人、昔、俺に、字を教えてくれようとしたんだ。俺が、逃げちまって」", "「スミさん、元気でしたよ」", "オオナムチは、言った。", "「ハガネさんも、タタラも。村の人に、名前で呼ばれてました」", "カイは、少しだけ、笑った。", "「返事、書くよ。帳場の人に、教わって。下手くそでも、自分の字で」", "カイは、手紙を丁寧に畳み直し、懐の奥にしまった。それから、立ち上がって、オオナムチに頭を下げた。", "「ありがとう。届けてくれて」", "「道の、ついでです」", "オオナムチは、フジに言ったのと同じことを言った。カイは、笑った。笑うと、目元が、母親に似ていた。", "「炉ヶ岳へ行く荷車が、毎朝、この宿の前を通るんだ。マガネにも寄る。返事は、それに頼むよ。書けたらだけど」", "「書けますよ」", "オオナムチは言った。", "「字は、ゆっくりで、いいんです。読む人も、ゆっくり読みますから」", "裏庭の木戸の外で、ベルが、待っていた。オオナムチが戻ると、ベルは、何も聞かずに、歩き出した。少し遅れて、オオナムチが隣に並んだ。木戸の向こうの裏庭から、薪を割る音が、また、聞こえはじめていた。"]}, {"h": "七", "p": ["その夜、ヤチマタの安宿の裏庭で、ベルは、空に手をかざした。", "辻の町は、夜も、人の声が絶えない。けれど、裏庭の井戸のまわりだけは、静かだった。", "「オモイカ」", "返事は、少し遅れて、来た。", "「ベルイザナ様」", "「何か、分かったか」", "「申し訳ありません。経緯は、まだ、調べております。牢の守りに、欠けはなかったはずなのですが」", "オモイカの声は、掠れていた。腹の傷が、まだ、癒えきっていないのだろう。", "「ナキメは」", "「無事です。ただ、ひどく、塞いでおいでです」", "ベルは、目を閉じた。", "聞きたいことは、いくらでもあった。タケルは、どこへ向かったのか。王は、何を企んでいるのか。牢を破った夜に、何が起きたのか。", "けれど、今、オモイカを急かしても、何も、生まれない。", "「急がずともよい」", "ベルは、言った。", "「急げば、見落とす。そなたの目を、信じている」", "通信の向こうで、小さく、息を吐く気配がした。", "「……承知しました。分かり次第、すぐに」", "「それと」", "「はい」", "「ナキメに、伝えてくれ。眠れ、と」", "「……はい」", "通信が、切れた。", "ベルは、手を下ろした。", "背後で、足音がした。振り返ると、オオナムチが、湯呑みを二つ、持って立っていた。", "「眠れないみたいだったので」", "湯気が、夜気の中に、白く立ち昇っていた。ベルは、湯呑みを受け取った。", "「感謝する」", "二人は、井戸の縁に、並んで座った。", "オオナムチは、何も聞かなかった。山道でも、坑道でも、ずっと、そうだった。ベルの拳に気づいても、空を見上げた顔に気づいても、何も聞かずに、ただ、隣を歩いていた。", "(この青年は、待っている)", "聖の森の宿で、窓から避難民を見送った夜。あのときも、きっと、見ていたのだろう。それでも、何も、聞かなかった。", "その沈黙が、今は、ありがたかった。", "同時に、胸が、痛んだ。", "「オオナムチ」", "「はい」", "「坑道で、私は、何もできなかった」", "オオナムチは、湯呑みを両手で包んだまま、首を振った。", "「ベルさんは、いちばん前に、立ってくれてました。タタラの前に」", "「立っていただけだ」", "「立っていてくれたから、俺は、堅めを広げられたんです」", "青年は、少し、照れたように、笑った。", "「半分ずつ、ですよ」", "ベルは、湯呑みに、目を落とした。湯の表面に、細い月が、揺れていた。", "「……そうだな」", "半分ずつ。", "この青年は、ときどき、自分が教えたはずの言葉で、自分を支えてくる。", "ベルは、湯をひと口、飲んだ。熱かった。喉の奥まで、ゆっくりと、温かさが下りていった。"]}, {"h": "八", "p": ["ミナモに戻ったのは、それから三日後の朝だった。", "ギルドの掲示板の前は、相変わらず、混み合っていた。人気の依頼は、もう、剥がされている。オオナムチは、掲示板の隅を、目で探した。", "一枚、端の黄ばんだ紙があった。", "『獣ノ原への届け物。井戸の修繕資材。報酬、銅貨二十枚』", "「獣ノ原」", "オオナムチは、紙を見上げた。", "亜人の土地だ。入植者との揉め事が絶えないと、噂で聞いている。誰も、受けたがらない依頼だった。", "それに、獣ノ原の先には、葛の里がある。オオナムチの、生まれ育った土地だった。", "紙に、手を伸ばしかけて、止めた。", "隣を見た。", "ベルは、もう、紙を見ていた。", "「井戸か」", "「はい。たぶん、水場が、荒らされてるんだと思います」", "「なら、急いだほうがよい」", "ベルは、それだけ言った。", "オオナムチは、紙を、剥がした。", "受付の女が、顔も上げずに、「次の方」と言った。紙を見て、眉をひそめた。", "「獣ノ原ですか。物好きね」", "「はい」", "オオナムチは、いつもと同じに、答えた。", "判を押してもらって、倉庫へ向かう途中、ベルが、ふと、足を止めた。", "掲示板の隅の、あの紙の前だった。", "『魔族は話の通じぬ者たちである。正義は我らにあり』", "ベルは、紙を、見上げた。今日は、拳を握らなかった。ただ、長く、見つめていた。", "それから、オオナムチのほうへ、向き直った。", "「行くぞ」", "いつもの、静かな声だった。", "港のほうから、朝の鐘が聞こえてきた。倉庫の裏口では、井戸の修繕に使う石材と、新しい桶が、二人を待っていた。"]}]}, {"id": "ch07_5", "label": "第七・五章", "title": "風の岩溝", "chars": 9551, "sections": [{"h": "一", "p": ["夜明け前の葛の里は、霧の底に沈んでいた。", "ウズメは、石垣の上にしゃがんで、門の外の道を眺めていた。耳を、右へ、左へ、動かす。蹄の音は、しない。腕章の兵たちは、昨日のうちに、英雄の一行と一緒に引き上げていった。", "(でも、見られてる)", "目には見えない。匂いもしない。ただ、肌の表面が、ちりちりと粟立つ。昨夜、ベルが「網」と呼んでいたものだろう。人の王の言霊が、獣ノ原の空に、薄く張られている。", "「おはよう、ウズメさん」", "背後で、声がした。オオナムチが、荷を背負って立っていた。その隣に、ベルがいる。相変わらず、顔が、頭に留まらない。黒い外套の輪郭だけが、霧の中で、くっきりしていた。", "「早いね、二人とも」", "「街道は、使わないほうがいいって、サルタヒコさんが」", "「そう。だから、あたしが来た」", "オオナムチが、目を丸くした。昨日、ここに残る、と言って別れたばかりだった。", "「残るって言ったのは、里にさ。溝の入口までは、案内の仕事のうち。サルタヒコの爺さんにも、送ってやれって言われたし」", "ウズメは、石垣から、ひらりと飛び降りた。", "「抜け道を教えるよ。風の岩溝を抜けて、イワクラの城下へ出る道。獣しか通らない道だから、網も、目が粗いはず」", "「岩溝」", "「谷が裂けたみたいな、細い溝さ。風がいつも吹いてる。……ちょっと、怖いとこだけどね」", "にっと笑ってみせた。今朝は、笑うのが、少しだけ楽だった。", "門の前に、人が集まっていた。", "ひなた野から移ってきた人たちだった。機織りのノギクが、布の包みを抱えている。その裾にしがみついているのは、幼いフキだ。腰の曲がったタネ爺は、小さな袋を握っていた。", "「これ、持っていって」", "ノギクが、包みを差し出した。中は、目の詰んだ灰色の布だった。", "「葛の糸で織ったの。風を通さないから、岩溝で役に立つよ」", "「ありがとうございます、ノギクさん」", "オオナムチが、受け取った。ノギクは、少し驚いた顔をした。名を呼ばれるとは、思っていなかったのかもしれない。", "「こっちは、豆じゃ」", "タネ爺が、袋を押しつけた。", "「ひなた野の畑から、持ってきた種の、残りじゃ。食ってもいいし、どこかに蒔いてもいい」", "「蒔きます。どこかに、必ず」", "「おじさん、また来る？」", "フキが、ノギクの裾の陰から、顔を出した。", "「来るよ、フキ」", "ウズメは、三人を見ていた。それから、井戸のほうを、振り返った。", "井戸の縁に、老婆が一人、座っていた。桶の縄を、膝の上で撚っている。顔の輪郭が、霧に溶けかかっているように見えた。", "(ナズナ婆)", "焼かれた水場の、井戸番だった人だ。石と泥を投げ込まれた日、最後まで井戸の縁にしがみついていた。それからずっと、ここの井戸のそばにいる。", "誰も、名を呼ばない。井戸の婆さん、と呼ぶ。ウズメ自身も、そうだった。", "見張り台の上には、若い男が立っていた。ススキだ。里のみんなは、「おい、見張り」と呼ぶ。織り場の窓からは、クズハが、黙って布を織る音がする。人間の里から嫁いできた女で、里では「人間の嫁さん」と呼ばれていた。", "そう呼ぶのが、いちばん、角が立たない。ずっと、そう思っていた。", "「ナズナさん」", "オオナムチが、井戸に向かって、頭を下げた。", "老婆の手が、止まった。", "「ススキさん。クズハさん。行ってきます」", "見張り台の上で、若い男が、驚いたように身を乗り出した。織り場の音が、ふっと止んだ。", "ウズメは、口を開けたまま、オオナムチの背中を見ていた。", "(なんで、名前、知ってんの)", "聞こうとして、やめた。昨夜、ヒエダの寝台のそばで、ハルに、一人ずつ名前を聞いていた。その姿を、ウズメは、見ていた。", "井戸の縁で、老婆が、ゆっくりと顔を上げた。霧の中で、その皺が、少しだけ、はっきり見えた。", "「……いってらっしゃい」", "かすれた声だった。", "ウズメは、前を向いた。尻尾が、勝手に、ぱたぱたと動いた。", "「行くよ。日が昇る前に、溝の入口まで」"]}, {"h": "二", "p": ["ナズナは、井戸の縁に、座ったままでいた。", "霧が、晴れていく。石垣の向こうの道に、三つの背中が、小さくなっていった。", "膝の上の縄を、撚る手が、止まっていた。", "(ナズナさん)", "あの若いのが、そう呼んだ。", "何年ぶりだろう、と、ナズナは思った。いや、何年、という数え方も、もう、あやふやだった。", "焼かれた水場の井戸は、ナズナの父の、そのまた父の代から、ナズナの家が守ってきた。朝いちばんに桶を下ろして、水の色を見る。濁っていれば、底を浚う。冬は、縁に張った氷を割る。それが、井戸番の仕事だった。", "水場の者たちは、みな、ナズナを名で呼んだ。ナズナさん、今朝の水はどうだい。ナズナ婆、桶の縄が切れちまった。", "あの日までは。", "入植者たちが、井戸に、石を投げ込んだ。泥を、投げ込んだ。ナズナは、縁にしがみついて、やめておくれと叫んだ。誰も、聞かなかった。井戸は、一晩で、死んだ。", "葛の里に、逃げてきた。ここの井戸のそばに、座るようになった。", "里の人たちは、親切だった。食べ物を分けてくれた。寝床もくれた。ただ、誰も、ナズナの名を、知らなかった。井戸の婆さん、と呼んだ。それで、何の不自由もなかった。", "不自由がないまま、少しずつ、自分が薄くなっていった。", "朝、桶の水に映る顔が、ぼやけて見えた。目が悪くなったのだと思った。けれど、隣で水を汲む娘の顔は、くっきり見えた。", "自分だけが、霧の中にいた。", "(あの子は、どうして、わたしの名を知っていたんだろう)", "昨夜、ヒエダの寝台のそばで、ハルが、指を折りながら、何かを数えていた。ノギクさん、タネ爺、フキ、ススキ兄ちゃん、クズハさん、それから……。", "最後に、ハルは、少し考えて、こう言った。", "井戸のばあちゃんは、ナズナ。ひなた野のおばあちゃんが、そう呼んでた。", "ナズナは、桶を、井戸に下ろした。縄が、するすると、手の中を滑っていく。水の音がした。", "引き上げた桶の水を、覗き込んだ。", "朝の光の中に、皺だらけの顔が、映っていた。", "少しだけ、はっきり、見えた気がした。", "「……ナズナ」", "自分で、自分の名を、呼んでみた。声は、かすれていた。", "見張り台の上で、ススキが、こちらを見下ろしていた。織り場の窓から、クズハが、顔を出していた。", "三人とも、何も言わなかった。", "ただ、しばらく、互いの顔を、見ていた。"]}, {"h": "三", "p": ["風の岩溝は、大地に入った、長い傷のようだった。", "オオナムチは、溝の縁に立って、下を覗き込んだ。両側から、赤茶けた岩壁が迫っている。底までは、家を三つ重ねたほどの深さがあった。細い獣道が、壁に沿って、斜めに下っている。", "風が、吹き上げてきた。", "冷たい。骨まで、すり抜けていくような風だった。外套の裾が、ばたばたと鳴る。ノギクの布を、首に巻いた。確かに、風を通さなかった。", "「足元、気をつけて。滑ったら、底まで止まらないよ」", "ウズメが、先を行った。身軽に、岩から岩へ、跳んでいく。オオナムチは、壁に手をつきながら、一歩ずつ、下った。後ろから、ベルの足音が、静かについてくる。", "溝の半ばまで来たときだった。", "頭上で、甲高い声がした。", "見上げると、岩壁の突き出た棚の上に、巨大な鳥がいた。翼を広げれば、小舟ほどもあるだろう。羽は、風の色をしていた。灰とも、青ともつかない。鋭い嘴が、こちらを向いていた。", "「大鷲だ」", "ウズメが、声を潜めた。", "「この溝の主だよ。……まずいな。今は、子育ての時期だ」", "棚の奥に、枯れ枝を組んだ巣が見えた。小さな頭が、二つ、三つ、覗いている。", "大鷲が、翼を打った。", "風が、塊になって、落ちてきた。", "オオナムチは、壁にしがみついた。体が、浮きかける。足が、岩から離れかけた。", "(倒すか)", "短剣の柄に、手が伸びた。けれど、その手を、止めた。", "巣の中の、小さな頭が、目に入った。", "(違う。あれは、守ってるだけだ)", "自分たちが、巣のそばを通るから、追い払おうとしている。それだけだ。", "「――堅め」", "膜を、張った。", "ミナモの宿の裏庭で、教わったとおりに。厚く、前に張るのではない。薄く、広く、自分の周りを、ぐるりと包むように。", "(半分ずつ、包む)", "風が、膜にぶつかった。", "膜は、軋まなかった。風は、膜の丸みに沿って、するりと、両脇へ流れていった。岩を叩く風の音だけが、耳の横を、通り過ぎていく。", "「……できた」", "思わず、声が出た。", "大鷲が、もう一度、翼を打った。さっきより、強い風だった。膜が、受け流す。体は、揺れない。", "けれど、その時、足元の岩が、崩れた。", "風に削られていたのだろう。踏みしめていた岩の角が、ぼろりと欠けた。体が、傾いた。溝の底が、目の端に、ぐっと近づいた。", "腕を、掴まれた。", "ベルだった。", "外套の袖から伸びた手が、オオナムチの腕を、しっかりと掴んでいた。片手だった。それなのに、体が、宙で止まった。岩壁に、引き戻された。", "その瞬間、オオナムチは、見た。", "ベルの輪郭が、ほんの一拍、ぼやけた。", "獣ノ原で、英雄が「どこかで」と言ったときと、同じだった。黒い外套の線が、霧のように、にじんだ。すぐに、戻った。", "「……すみません」", "「足元を見ろ」", "ベルの声は、いつもどおりだった。少しだけ、息が浅かった。", "オオナムチは、うなずいた。それ以上は、何も言わなかった。", "聞きたいことは、喉まで来ていた。夜の井戸で、ヒエダさんの血を止めたもの。今、自分を片手で引き上げたもの。輪郭が、にじむこと。", "聞かなかった。", "(待つ、と決めた)", "聖の森の窓辺で、そう決めた。この人が、話してくれる日まで。", "大鷲は、もう、翼を打たなかった。棚の上から、じっと、二人を見下ろしていた。巣を荒らす者ではないと、分かったのかもしれない。", "二人は、巣の下を、静かに通り過ぎた。小さな頭が、三つ、そろって、こちらを見ていた。"]}, {"h": "四", "p": ["岩溝の出口で、ウズメは、足を止めた。", "溝は、そこで、急に開けていた。緩やかな草の斜面が、遠くの丘まで続いている。丘の上に、石の城壁が小さく見えた。", "「あれが、イワクラの城。ここから先は、人族の土地」", "ウズメは、岩に腰を下ろした。", "「あたしは、ここまで。帰らなきゃ。ヒエダ爺の包帯、あたしが巻かないと、婆さんが巻くから。あの婆さん、口だけじゃなくて、手も荒いんだ」", "「ありがとう、ウズメさん」", "「礼なんか、いいよ」", "ウズメは、耳を、ぱたんと伏せた。それから、ベルを見上げた。", "「ねえ、あんた」", "「何だ」", "「あんたの顔、まだ、覚えられない。見てるのに、目をそらすと、どっかへ行っちゃう」", "ベルは、何も言わなかった。", "「でも、声は、覚えた」", "ウズメは、立ち上がった。", "「さっき、溝の途中で、こいつの腕を掴んだでしょ。あのとき、あんたの声が、ちょっとだけ、震えてた」", "ベルの肩が、わずかに、動いた。", "「怖かったんだね。こいつが、落ちるのが」", "ウズメは、にっと笑った。いつもの、癖の笑いではなかった。", "「それだけ分かれば、十分さ。顔なんか、覚えられなくても」", "尻尾を、ひと振りした。", "「じゃあね。ちゃんと、無事でいなよ」", "小さな背中が、岩溝の中へ、駆け下りていった。一度も、振り返らなかった。", "ベルは、溝の縁に立ったまま、しばらく、その方角を見ていた。", "(震えていたか)", "自分では、気づかなかった。", "オオナムチの腕を掴んだとき、ほんのわずかに、力が滲んだ。人の青年が片手で人を支えるのは、無理がある。分かっていた。分かっていて、手が、先に動いた。", "阻害が、軋んだ。胸の奥で、細い糸が一本、切れかけた音がした。", "それでも、手を離すという考えは、一瞬も、浮かばなかった。", "「ベルさん。行きましょう」", "オオナムチが、斜面の下から、呼んだ。", "「ああ」", "ベルは、外套の裾を払った。指先が、まだ、少しだけ冷たかった。"]}, {"h": "五", "p": ["イワクラの城は、古かった。", "城壁の石は、角が丸くすり減り、隙間から草が生えている。門をくぐると、城下の通りは、静かだった。人は、いる。ただ、年寄りと、子どもと、女ばかりだった。", "門の脇に、槍を持った衛士が立っていた。白い髭の、腰の曲がりかけた男だった。", "「旅の方か。城下は、狭いが、宿は一軒ある」", "「感謝する」", "ベルが答えると、老いた衛士は、ほう、と眉を上げた。", "「礼を言う旅人は、久しぶりじゃ。近ごろの若い者は、みな、王都の言葉づかいでな。礼儀正しいが、どこか、冷たい」", "衛士は、槍にもたれかかった。膝が、痛むらしかった。", "「衛士は、年寄りばかりのようだな」", "「若い者は、王都の兵に取られた」", "衛士は、城の上を見上げた。", "「城主さまも、もう何年も、王都に住んでおられる。ここを守っておるのは、わしら年寄りだけじゃ。槍の稽古をするたびに、誰かが膝を痛める」", "城下の広場に、古い井戸があった。衛士は、そこまで、二人を案内してくれた。", "「この井戸は、城ができる前から、あったそうな」", "井戸の石の縁に、何かの印が刻まれていた。けれど、ほとんど、鑿で削り取られていた。かろうじて、山の稜線のような形が、一つだけ、読み取れた。", "「役人が、削っていった。神々の名を出すのは、よくないとな」", "「城の書庫にも、昔は、神々の巻物があった」", "広場の端で、帳面を抱えた男が言った。城主の名代を務めているという、痩せた中年の男だった。", "「王都の役人が、みな、持っていきました。残ったのは、米と税の帳面ばかりです。神々の名は、民を惑わすから、と」", "「惑わす」", "ベルは、その言葉を、繰り返した。", "「ええ。……私には、よく分かりません。祖母は、毎朝、この井戸に手を合わせていましたが、惑わされているようには、見えませんでした」", "名代は、そう言って、気まずそうに、帳面で口元を隠した。王都の役人に聞かれたら、困る言葉だったのだろう。", "衛士は、印の跡を、指でなぞった。", "「前の王さまの頃は、違った。この井戸の前で、祭りをした。人間も、山の向こうの亜人も、同じ杯で、酒を飲んだ。わしは、子どもだったが、覚えておる」", "ベルは、黙って、聞いていた。", "葛の里の、ヒエダの言葉を思い出した。前の王の頃の話を、子どもたちに語り継いでいる、と。差別などなかった時代があったことを。", "(ここにも、覚えている者がいる)", "「孫がおってな」", "衛士は、井戸の底を、覗き込んだ。", "「三年前に、王都の兵に取られた。去年、一度だけ、帰ってきた。白い腕章をつけてな」", "「……」", "「礼儀正しくなっておった。わしに、きちんと頭を下げた。前は、そんなこと、したことがなかったのにな」", "衛士は、少し、笑った。笑っているのに、目尻が、濡れていた。", "「子どものころ、あいつは、わしの鈴を、この井戸に落としたことがある。わしの爺さんの形見の鈴じゃ。わんわん泣いて、謝った。帰ってきたとき、その話をしたら、あいつは、こう言った」", "衛士の声が、かすれた。", "「『そのような記憶は、ございません』と」", "井戸の底は、暗かった。何も、見えなかった。", "ベルは、拳を握りかけた。ゆっくりと、開いた。", "(正しすぎる)", "ユウの笑顔が、重なった。英雄に肩を叩かれて、顔を輝かせた、あの笑顔。ハルの、唇を噛む顔。", "王の言霊は、人を殺さない。人を、傷つけもしない。ただ、その人を、その人でなくしていく。", "隣で、オオナムチが、井戸の縁に手をついていた。指先が、白くなるほど、石を掴んでいた。"]}, {"h": "六", "p": ["城下の宿は、小さかった。", "部屋は、二階の一間だけだった。窓から、城の塔が見えた。夜になると、塔の上に、灯が一つ、ともった。", "オオナムチは、眠れなかった。", "寝台に横になって、天井の梁を見ていた。隣の寝台で、ベルが、窓の外を見ている気配がした。ベルは、いつも、あまり眠らない。", "ユウの顔が、浮かんだ。", "正しい側に、入れてもらえた。そう言って、目を輝かせた顔。頭の中の声に、背中を押されている顔。", "ヒエダの言葉が、浮かんだ。", "言霊の根じゃ。王都まで、繋がっておる。", "井戸の衛士の声が、浮かんだ。", "そのような記憶は、ございません。", "「ベルさん」", "オオナムチは、天井を見たまま、言った。", "「起きていますか」", "「ああ」", "「俺、王都へ行きたいです」", "窓辺の気配が、動かなかった。", "「ユウは、王都の軍務局にいるって言ってました。腕章の根も、王都にあるって、ヒエダさんが。衛士さんの孫も、王都に連れていかれた」", "言葉が、止まらなかった。", "「葛の里で、俺、ユウの槍を下ろさせることは、できたんです。ほんの少しだけ。でも、空から声がしたら、全部、戻っちゃった。元を、どうにかしないと、何度、心鎮めを唱えても、同じことになる」", "「……」", "「だから、行きたいんです。王都へ」", "長い沈黙が、落ちた。塔の灯が、風に、ちらりと揺れた。", "「王都は、網が濃い」", "ベルの声は、低かった。", "「獣ノ原の比ではない。英雄が巡行して、網の目を細かくしているのも、王都から出た言霊だ。あそこは、その根元だ」", "「分かってます」", "「何が起きるか、分からぬ。そなたが、腕章の兵に目をつけられれば」", "「それでも」", "オオナムチは、体を起こした。", "「行かなきゃいけない気がするんです。ベルさんが反対なら、俺、一人でも」", "「ならぬ」", "鋭い声だった。", "オオナムチは、思わず、口をつぐんだ。", "窓辺で、ベルが、こちらを振り向いていた。月明かりで、灰色の目が、かすかに光った。その奥が、ほんの少し、赤く見えた。", "「おまえを、一人で行かせる気はない」", "言ってから、ベルは、わずかに目を見開いた。", "自分の言葉に、驚いたような顔だった。", "オオナムチも、気づいた。", "そなた、ではなかった。", "ミナモで初めて会った日から、ベルは、ずっと「そなた」と呼んでいた。少し古風で、丁寧で、どこか、遠い呼び方だった。", "今、この人は、「おまえ」と言った。", "ベルは、言い直さなかった。窓の外へ、視線を戻した。", "「……おまえが行くなら、私も行く」", "もう一度、言った。今度は、自分で、確かめるように。", "オオナムチは、少し、笑った。胸の奥が、温かかった。", "「はい」", "「ただし、無茶はするな。私の目の届く所にいろ」", "「はい」", "「それから」", "ベルは、少し、間を置いた。", "「元を断つ、と言ったな。それは、私も、同じことを考えていた」", "オオナムチは、ベルの横顔を見た。月の光の中で、その輪郭は、はっきりと見えた。にじんでも、ぼやけても、いなかった。", "「半分ずつ、ですね」", "「そうだ。半分ずつだ」", "塔の灯が、静かに、燃えていた。"]}, {"h": "七", "p": ["翌朝、老いた衛士は、城門の前で、二人を見送った。", "黒い外套の男と、継ぎの当たった外套の青年。街道を、ミナモの方角へ、並んで歩いていく。", "衛士は、槍にもたれて、その背中を見ていた。", "(妙な二人じゃった)", "昨夜、宿の主人から聞いた。あの青年は、夜明け前に、一人で井戸へ行ったという。桶を下ろして、何度も、底を浚っていたらしい。", "衛士は、懐に手を入れた。", "指先に、冷たいものが触れた。", "小さな鈴だった。苔と泥にまみれて、緑青が浮いている。今朝、宿の主人が、届けにきた。あの青年が、井戸の底から、引き上げたものだという。", "『衛士さんに、渡してください。お孫さんが、落としたものだと思うので』", "それだけ、言い残していったそうだ。", "衛士は、鈴を、掌に乗せた。軽く、振ってみた。", "音は、しなかった。中に、泥が詰まっているのだろう。", "それでも、衛士は、何度も、振った。", "(あいつが、また帰ってきたら)", "この鈴を、見せてやろう。覚えていないと言うだろう。そのような記憶は、ございません、と。それでも、いい。", "何度でも、見せてやる。何度でも、話してやる。おまえが、泣いて、謝った日のことを。", "衛士は、鈴を握りしめた。", "城の塔の上を、鳥が一羽、旋回していた。風の色をした、大きな翼だった。岩溝の大鷲が、ここまで飛んでくることは、めったにない。", "鳥は、二度、輪を描いて、街道の先へ、飛んでいった。"]}, {"h": "八", "p": ["ミナモに着いたのは、それから三日後の夕方だった。", "港の匂いが、懐かしかった。ギルドの扉を押すと、受付の女が、顔も上げずに、「次の方」と言った。", "獣ノ原の依頼の報告を済ませると、オオナムチは、掲示板へ向かった。ベルは、ギルドの裏手の路地に出た。", "人気のない、倉庫の陰だった。", "手を、空にかざした。指先が、まだ、わずかに震えていた。岩溝で切れかけた糸が、まだ、繋がりきっていない。", "言伝を、唱えた。", "「オモイカ」", "「ベルイザナ様」", "返事は、すぐに来た。", "「ミナモへ、お戻りになりましたか」", "「ああ。……王都へ行く」", "通信の向こうで、息を呑む気配がした。", "「王都、ですか」", "「オオナムチが、行くと言った。私も、同じことを考えていた。腕章の根は、王都にある。元を、見ねばならぬ」", "「……お勧めは、いたしかねます」", "オモイカの声は、硬かった。", "「天津京は、網の要です。お力を、ほんのわずか使っただけでも、阻害は、目に見えて削れましょう。ただ歩くだけでも、少しずつ、すり減っていくはずです」", "「分かっている」", "「それに、王都では、英雄タケルの凱旋の祝賀の支度が、始まっております。牢を破ったことを、もう、祭りに仕立てているようです」", "ベルは、目を閉じた。", "(あの男を、祭りの旗にするか)", "粥を、残さず食べていた男。傷ついた亜人の老女の手を、両手で包んでいた男。", "「それでも、行く」", "オモイカは、しばらく、黙っていた。", "「……承知しました」", "やがて、静かな声が、返ってきた。", "「ベルイザナ様が、そうおっしゃるときは、もう、お決めになっているときです」", "「見抜かれたか」", "「見抜く目だけが、取り柄ですので」", "ベルは、口の端を、わずかに上げた。", "「では、次の手を聞かせてくれ」", "「はい。王都では、決して、言霊をお使いになりませんよう。通信も、できる限り、控えます。私からの報せは、短くいたします」", "「ああ」", "「それから」", "オモイカの声が、少し、柔らかくなった。", "「お連れの方を、どうか、大切に。あの方は、ベルイザナ様のお顔を、見ることのできる方ですから」", "ベルは、何も言わなかった。", "通信が、切れた。", "路地を出ると、港のほうから、しわがれた声が聞こえた。", "「オオナムチ。戻ったのか」", "桟橋の端に、小舟が舫われていた。舟の上で、年寄りの漁師が、網を繕っていた。イサナだった。その隣で、トマリが、縄を巻いている。", "「イサナさん。トマリさん」", "ギルドの前から、オオナムチが駆けてきて、頭を下げた。", "イサナの顔は、もう、霧の向こうにはなかった。眉の白さも、頬の古い傷も、夕日の中で、くっきりと見えた。", "「アサギが、毎日、うるさいほど呼ぶでな」", "イサナは、照れたように、網に目を落とした。", "「おかげで、自分の名を、忘れる暇がない」", "「親方、それ、嬉しいって言えばいいのに」", "トマリが、縄の陰で笑った。イサナが、縄の端で、トマリの頭を、ぽかりと叩いた。", "ベルは、少し離れて、それを見ていた。", "(名を呼ぶ者が、そばにいる)", "葛の里の、井戸の老婆の顔が、浮かんだ。あの里には、まだ、名を呼ばれない者たちがいる。王都には、もっと、いるのだろう。", "オオナムチは、二人に手を振ってから、ギルドの中へ引き返した。しばらくして戻ってきたとき、手に、紙を一枚、持っていた。掲示板から、剥がしてきたばかりらしい。端が、まだ、少しも黄ばんでいなかった。", "「王都行きの、荷車の護衛。ありました」", "「そうか」", "「報酬、銅貨四十枚です。ここに来てから、いちばん高い」", "オオナムチは、少しだけ、得意そうに言った。それから、ベルの顔を見て、首をかしげた。", "「ベルさん、顔色、悪くないですか」", "「平気だ」", "ベルは、短く答えた。", "港のほうから、夕べの鐘が聞こえた。網干し場の杭の間を、潮風が抜けていく。どこかで、誰かが、誰かの名を、呼んでいた。", "翌朝、二人は、王都へ向かう街道に立った。", "道は、まっすぐ、北へ延びていた。その先に、白い都がある。まだ、見えない。けれど、ベルの胸の奥で、阻害の言霊が、かすかに、擦れはじめていた。", "懐の小袋の中で、タネ爺の豆が、かさりと鳴った。オオナムチは、それを、そっと握った。", "(どこかに、必ず、蒔きます)", "ひなた野の畑で育った豆だ。杭を打たれ、水を奪われた土地から、ここまで運ばれてきた。いつか、誰にも追われない土に、根を下ろせるように。", "二人は、並んで、歩き出した。"]}]}, {"id": "ch08_5", "label": "第八・五章", "title": "削られた丘", "chars": 9499, "sections": [{"h": "一", "p": ["屋根裏の窓から差す光は、朝でも、白かった。", "ベルは、壁に背を預けたまま、自分の右手を見下ろした。", "指先が、震えていた。", "止めようとして、拳を握った。握っているあいだは、止まる。けれど、開くと、また、細かく揺れ始める。寒さのせいではない。胸の奥で、阻害の膜が、軋むたびに、指の先まで、その軋みが伝わってくるのだ。", "半分を、切っている。", "昨夜、オモイカに、そう告げた。言葉にしたとたん、それが本当のことになった気がした。", "(歩くだけで、削れる)", "この街は、網が濃すぎる。宿の屋根裏に潜んでいても、壁の向こうから、白い糸のようなものが、じりじりと膜を撫でてくる。外に出れば、なおさらだ。祝賀は、明後日の夜。それまで、膜を残しておかなければならない。", "梯子の軋む音がした。", "「ベルさん、起きてますか」", "オオナムチが、顔を出した。手に、木の椀を二つ、持っている。", "「下の、ミオさんが。麦の粥です」", "「ああ」", "椀を受け取ろうとして、指が、滑りかけた。オオナムチの手が、さっと、椀の底を支えた。", "「……すまぬ」", "「いえ」", "オオナムチは、何も聞かなかった。ただ、ベルの手に、椀がしっかり収まるまで、自分の手を離さなかった。", "粥は、薄かった。それでも、温かかった。", "「ベルさん、顔色が、昨日より」", "「平気だ」", "「でも」", "「平気だと言っている」", "声が、思ったより、硬く出た。オオナムチが、口をつぐんだ。", "ベルは、椀を膝に置いた。", "(八つ当たりだ)", "分かっていた。この青年は、何も悪くない。悪いのは、膜を保てない自分のほうだ。", "「……すまぬ。言い過ぎた」", "「いいんです」", "オオナムチは、小さく笑った。笑い方が、少し、ぎこちなかった。", "しばらく、二人で、黙って粥をすすった。窓の外で、鳩が、白い屋根の上を歩いていた。", "「おまえは、外へ出ろ」", "ベルが、言った。", "「え」", "「三日、ここに籠もっている理由は、おまえにはない。網が見ているのは、私の名だ。おまえではない」", "「でも、ベルさんを、一人には」", "「一人でよい。ここで、膜を休ませる。そのほうが、早く戻る」", "嘘ではなかった。動かなければ、削れ方は、ゆるやかになる。", "「それに、祝賀の夜には、おまえの足が要る。この街の外が、どうなっているか。見ておいてほしい」", "オオナムチは、しばらく、考えていた。", "梯子の下から、小さな足音が、上ってきた。", "「おにいちゃん」", "ヒナだった。梯子の途中から、顔だけを出して、こちらを覗いている。後ろで、ミオが、困ったように、娘の背を押さえていた。", "「すみません。上がってはいけないと言ったのに」", "「構わぬ」", "ベルが言うと、ヒナは、梯子を一段、上がった。", "「あのね、おにいちゃん。お父さんね、よく、丘に行ってたの」", "「丘？」", "「タカマの丘。王都から、半日くらいの」", "ミオが、娘の言葉を、引き取った。", "「夫が、受け持ちの子どもたちを、よく連れて行っていたんです。古い社と、花の咲く斜面があって。授業の、外歩きだと言って」", "ミオの声が、少しだけ、明るくなった。", "「この子も、一度だけ、連れて行ってもらって。青い花が、斜面いっぱいに咲いていたって。今でも、その話ばかり」", "「お父さんが帰ってきたら、また、行くの」", "ヒナが、胸の前で、小さな布の袋を握りしめた。", "オオナムチが、ベルを見た。", "ベルは、黙って、頷いた。"]}, {"h": "二", "p": ["王都の南門を出て、街道を半刻ほど歩くと、川に出た。", "川には、石の橋が架かっていた。橋のたもとに、小さな町がある。関所の町、ウキハシだと、門の札に書いてあった。", "橋の手前に、木の柵と、詰め所があった。", "旅人たちが、二つの列を作っていた。王都から出ていく列と、橋を渡って、王都へ入る列だ。荷車を引いた商人、籠を背負った女、杖をついた老人。番兵が、一人ずつ、顔を見て、手を振って通していく。", "オオナムチの番が来た。", "番兵は、オオナムチの顔を、ちらりと見た。", "「どこへ」", "「タカマの丘まで」", "「通ってよし」", "それだけだった。", "オオナムチは、柵をくぐってから、振り返った。", "橋を渡ってきた、王都へ入る側の列で、番兵の声が、変わっていた。", "「書付を、見せてもらおうか」", "母親と、小さな男の子だった。男の子の頭には、柔らかそうな、獣の耳が二つ、生えていた。", "「書付、ですか」", "「住まいと、行き先と、身元を請け合う者の名だ。持っていないのか」", "「今まで、そんなもの、要りませんでした。王都の外れの、姉の家へ行くだけで」", "「今は、要る」", "番兵は、困ったように眉を寄せた。怒鳴りはしなかった。", "「悪く思わないでくれ。念のためなんだ。魔族と見分けのつかない者が、王都に入り込まないように。あんたたちのためでもある」", "「でも、私たちは」", "「念のため、だ」", "母親は、それ以上、言わなかった。男の子の手を引いて、列を離れた。男の子は、柵の向こうの、王都へ続く道を、何度も、振り返っていた。", "オオナムチの喉が、乾いた。", "(念のため)", "広場で聞いた言葉が、ここにも、あった。王都の外の、小さな関所の、木の柵にまで。", "橋の上を、風が、渡っていった。", "その風に、細い歌声が、混じっていた。", "橋のたもとの、石の欄干に、女が一人、腰かけていた。旅装束の、若い女だった。膝の上に、小さな弦の楽器を抱えている。", "歌っていた。", "聞いたことのない、古い節回しだった。山を呼び、水を呼び、火を呼び、月を呼ぶ。そして、最後に、名を呼ばずに、ただ、空を仰ぐ。", "誰も、足を止めなかった。", "商人も、番兵も、籠の女も。まるで、そこに誰もいないかのように、歌声の前を、通り過ぎていく。", "オオナムチは、目を細めた。", "女の輪郭が、薄かった。", "港のイサナを、思い出した。霧の向こうに立っていた、あの老人と、同じ薄さだった。", "オオナムチは、欄干の前で、足を止めた。", "歌が、終わった。女は、顔を上げて、驚いたように、オオナムチを見た。", "「……聞いて、くれてたの」", "「はい。いい歌ですね」", "「古い歌よ。社の祈りの歌。もう、歌うなって、言われてるんだけどね」", "女は、少し笑った。", "「歌うなって、誰に」", "「さあ。誰ということもなく。社で歌うのは、触れで止められたの。それで、橋の上で歌ってる。橋の上なら、社じゃないでしょう」", "女の声は、明るかった。けれど、その明るさが、どこか、遠かった。", "「お名前、聞いてもいいですか」", "女の顔から、笑みが、すっと引いた。", "「名前」", "「はい」", "「……ウタ、だったと思う」", "女は、楽器の弦を、指でなぞった。", "「歌う人だから、ウタ。みんな、そう呼んでた。でも、もう、ずいぶん、誰にも呼ばれてなくて。自分でも、それが本当の名前だったのか、ただの、あだ名だったのか」", "オオナムチは、息を吸った。", "「ウタさん」", "女の指が、止まった。", "「また、聞きに来ます。帰りに、ここを通るので」", "ウタは、しばらく、オオナムチの顔を見ていた。それから、ふっと、笑った。さっきより、少しだけ、近い笑い方だった。", "「変な人ね」", "「よく言われます」", "一度も言われたことはなかった。橋を渡りながら、オオナムチは、誰かの口癖が、また、移っていることに気づいた。", "背中で、歌が、また、始まった。", "さっきと同じ、古い節回しだった。けれど、オオナムチの耳には、その声が、さっきより少しだけ、はっきりと届いた気がした。橋を渡りきって振り返ると、欄干の上のウタの姿は、川霧の中でも、ちゃんと見えていた。"]}, {"h": "三", "p": ["タカマの丘に着いたのは、日が傾きかけたころだった。", "なだらかな斜面を、羊が、ゆっくりと上っていた。風が強い。草が、一斉に、同じ方向へ伏せる。斜面の上のほうが、一面、青かった。", "花だった。", "小さな、青い花が、斜面を覆っていた。風が吹くたびに、青い波が、丘を駆け上がっていく。", "(ヒナが言ってた花だ)", "オオナムチは、しばらく、そこに立ち尽くしていた。", "丘の頂に、古い社があった。", "石を積んだ、小さな社だった。屋根の苔が厚い。扉は開いていて、中に、老人が一人、座っていた。白い髪を後ろで束ねた、痩せた社守だった。", "「旅の人か。珍しいのう」", "社守は、目を細めた。", "「ここまで上ってくる者は、もう、羊飼いくらいしかおらん」", "「王都から来ました。この丘に、子どもたちを連れて来ていた先生がいたと、聞いて」", "社守の顔が、ふっと、ほどけた。", "「ああ。先生か。よう覚えとる」", "社守は、扉の内側を、手で示した。", "「毎年、春になると、十人も二十人も連れて来てな。花の名前を教えて、この社の話をして。子どもらが、紋の前で、手を合わせておった」", "社守は、懐かしそうに、斜面のほうを見た。", "「先生にはな、妙な決まりがあった。手を合わせる前に、子どもら同士で、隣の者の名を呼ばせるんじゃ。一人ずつ、順番に、輪になって」", "「名前を、ですか」", "「そうじゃ。耳の尖った子も、角のある子も、人の子も、みんな混ぜこぜの輪でな。隣の子の名を呼んで、呼ばれた子が、はい、と返す。全員が呼ばれたら、それから、神さまに手を合わせる」", "社守は、目を細めた。", "「なぜそんなことをするのかと、聞いたことがある。先生は、笑うて言うた。神さまに名を呼んでもらう前に、まず、隣の人の名を呼べるようにならなきゃいけませんから、とな」", "オオナムチは、黙って、聞いていた。", "港の網干し場で、アサギが、何度もイサナの名を呼んでいた声を、思い出した。橋の上で、名を呼ばれたウタの、指が止まった瞬間を、思い出した。", "(あの先生は、知ってたんだ)", "名を呼ぶことが、どれほどのことか。呼ばれなくなった人が、どうなっていくのか。", "だから、子どもたちに、呼ばせた。輪になって、一人も、こぼさずに。", "「あの輪の声が、好きでな」", "社守は、ぽつりと言った。", "「二十人の子どもが、二十の名を呼ぶ。この丘に、風と一緒に、名が、ぐるぐる回る。わしは、毎年、それを聞くのが、楽しみじゃった」", "「今は」", "「もう、三年、誰も来ん」", "風が、社の扉を、かたりと揺らした。", "オオナムチは、社の中を、覗いた。", "奥の壁に、五つの浅い窪みが、並んでいた。", "どの窪みも、削られていた。鑿の跡が、生々しく残っている。粗く、乱暴に。まるで、そこに何かが刻まれていたこと自体を、消したがっているように。", "「王都の役人が来てな。三年ほど前じゃ。古い神を拝むのは、民を惑わす。社の紋は、削るように、と。触れが出た」", "社守は、静かに、言った。", "「わしは、止められなんだ」", "オオナムチは、窪みの前に、膝をついた。", "削られた跡の下に、かすかに、線が残っていた。指で、なぞった。", "右端の窪みには、山の稜線のような、なだらかな曲線。", "隣には、渦を巻く線。", "その隣には、炎のような、尖った形。", "その隣には、細い、三日月。", "「オオヤマツミ。イザナギ。ホノカグツチ。ツクヨミ」", "社守が、一つずつ、指さしながら、名を呼んだ。", "「守りの山。生と死の渦。作り直す火。見抜く月。先生は、子どもらに、そう教えておった」", "オオナムチの胸が、小さく、鳴った。", "(作り直す、火)", "炉ヶ岳の、炉番の言葉と、同じだった。", "「真ん中は」", "五つ目の、いちばん大きな窪みだけが、削り跡がなかった。最初から、平らだった。", "「アメノミナカヌシ」", "社守は、その名を、ゆっくりと呼んだ。", "「天の真ん中に、おわす神じゃ。じゃが、その紋の形は、誰も知らん。わしの爺さまの、そのまた爺さまのころから、ここは、平らなままじゃった」", "「どうして」", "「さあのう。誰も、その神から、応えをもらったことがない。だから、形が分からん。そう、言い伝えられとる」", "社守は、平らな窪みを、見上げた。", "「先生は、言うておったよ。ここが平らなのは、まだ、誰も呼べておらんからだ。いつか、誰かが呼べたら、ここに、形が灯るんだ、とな」", "オオナムチは、平らな石に、そっと、手を当てた。", "冷たかった。ただの、石の感触だった。", "日が沈むまで、オオナムチは、社守と並んで、丘に座っていた。", "社守は、オオナムチに、一晩、社の土間を貸してくれた。", "その夜、オオナムチは、斜面に出て、青い花の、枯れかけた株から、種を集めた。指先ほどの、黒い粒だった。布の切れ端に、丁寧に包んだ。", "星が、近かった。"]}, {"h": "四", "p": ["翌朝、社の前で、物音がした。", "オオナムチは、土間から顔を出した。", "社の前に、兵が一人、立っていた。白い腕章をつけている。槍を持っていた。巡回の兵だ。", "「誰か、ここで、祈っていたか」", "兵が、社守に、聞いた。声は、穏やかだった。", "「いいや。わしは、掃除をしておっただけじゃ」", "「そうか」", "兵は、社の中を、覗き込んだ。削られた窪みを、ひとつずつ、確かめるように見た。それから、オオナムチに気づいた。", "「旅の者か」", "「はい」", "「ここで、何をしている」", "「花を、見に来ました」", "兵の目が、オオナムチの手元に落ちた。布の包みを、握っている。", "「それは」", "「花の、種です」", "兵は、しばらく、黙っていた。それから、槍の穂先を、ゆっくりと、こちらへ向けた。", "「見せてもらおう。念のためだ」", "穂先が、近づいてくる。殺気は、なかった。兵の顔は、穏やかなままだった。ただ、目が、虚ろだった。ユウの目と、同じだった。", "オオナムチは、短剣に、手をかけなかった。", "ここで、争えば、王都に、話が伝わる。祝賀の夜まで、目立ってはいけない。ベルの言葉が、頭をよぎった。", "(争わない)", "代わりに、唇を、動かした。", "「――心鎮め」", "広場で、自分の頭を守った言霊を、外へ、広げた。葛の里の、夜の井戸で、ユウに届けようとした、あの膜を。", "薄く、広く。半分の厚さで。", "膜が、兵を、包んだ。", "槍の穂先が、止まった。", "兵の目が、ゆっくりと、瞬いた。一度。二度。焦点が、わずかに、合った。", "「……俺は」", "兵の唇が、動いた。", "「ミカゲ」", "小さな声だった。誰に言うでもなく、自分の口から出た言葉を、自分で確かめているような声だった。", "「俺は、ミカゲだ。……城の、衛士の」", "槍が、下がった。穂先が、草に触れた。", "兵は、社を見た。削られた窪みを、見た。眉が、苦しげに寄った。", "「ここに、子どもの頃、来たことが」", "その時、兵の肩が、ぴくりと、震えた。", "まるで、誰かに、名を呼ばれたように。", "兵の目が、また、虚ろに戻っていった。焦点が、ほどけていく。眉の皺が、消える。穏やかな顔に、戻る。", "「……祈っていないなら、よい」", "兵は、槍を担ぎ直した。", "「念のため、だ。気をつけて帰れ」", "そう言って、背を向けた。丘を、下っていく。一度も、振り返らなかった。", "オオナムチは、その背中を、見えなくなるまで、見ていた。", "膝が、震えていた。", "(届いた)", "一瞬だけ。ほんの、ひと呼吸のあいだだけ。あの兵は、自分の名を、思い出した。", "(でも、戻された)", "何かが、兵を、呼び戻した。ユウの頭の中の、温かい声と、同じものが。", "「……あの若いのは、ミカゲというのか」", "社守が、ぽつりと、言った。", "「子どもの頃、先生が、連れて来た中に、おったかもしれん。わしは、もう、名前を、覚えておらんがの」", "オオナムチは、手の中の、種の包みを、握りしめた。"]}, {"h": "五", "p": ["屋根裏で、ベルは、一人だった。", "昼の白い光が、夕方の橙に変わり、やがて、窓の外が、暗くなった。", "膜は、少しだけ、戻っていた。動かずにいれば、削れ方は、確かに、ゆるやかになる。指の震えも、朝よりは、ましだった。", "梯子が、小さく、軋んだ。", "ヒナだった。今度は、一人だった。手に、小さな素焼きの鉢を、抱えていた。", "「お母さん、寝ちゃった」", "「そうか」", "「おにいちゃん、まだ？」", "「明日には、戻る」", "ヒナは、梯子を上りきって、ベルの隣に、ちょこんと座った。鉢を、膝の上に置く。土が、湿っていた。", "「毎日、お水、あげてるの。お父さんの種」", "「芽は」", "「まだ」", "ヒナは、鉢の土を、指でつついた。", "「でも、泣かないの」", "「そうか」", "ベルは、それ以上、言葉が出てこなかった。", "魔界の子どもたちとなら、話せた。寄り添いの里の、耳の聞こえない嵐狼の子とは、手で話した。けれど、人間の、五つか六つの女の子に、何を言えばいいのか、分からなかった。", "ヒナが、ベルの顔を、見上げた。", "じっと、見ていた。", "「おじちゃんの目、ときどき、赤いね」", "ベルの息が、止まった。", "膜が、また、薄くなっている。子どもの目は、ごまかせない。", "「……そうか」", "「きれい」", "ヒナは、そう言って、また、鉢の土を、つついた。", "怖がらなかった。それどころか、少しも、気にしていなかった。", "ベルは、ゆっくりと、息を吐いた。", "「ヒナ」", "「なあに」", "「お父さんは、どんな人だ」", "ヒナの顔が、ぱっと、明るくなった。", "「あのね、お父さんはね、なんでも知ってるの。お花の名前も、お星さまの名前も。それからね、魔界の、収穫のお祭りのことも」", "「魔界の」", "「うん。魔界にもね、お祭りがあって、みんなで、神さまにお祈りするんだって。人間と、同じ神さまに」", "ベルは、何も言えなかった。", "「お父さんがね、言ってたの。名前が違うだけで、同じお祈りなんだよって。だから、ほんとは、仲良くできるんだよって」", "ヒナは、少し、声を落とした。", "「でも、それを言ったら、お父さん、連れていかれちゃった」", "屋根裏が、静かになった。", "ベルは、自分の拳が、また、握られているのに気づいた。今度は、開かなかった。", "「ヒナ」", "「なあに」", "「お父さんの言ったことは、正しい」", "ヒナが、顔を上げた。", "「私は、それを、知っている」", "それ以上は、言えなかった。言えば、膜の下にあるものまで、こぼれてしまいそうだった。", "ヒナは、しばらく、ベルの顔を見ていた。それから、こくりと、頷いた。", "「うん」", "それだけ言って、ヒナは、鉢を抱えて、梯子を下りていった。"]}, {"h": "六", "p": ["オオナムチが戻ったのは、二日目の夜だった。", "帰りに、橋のたもとを通った。ウタは、まだ、歌っていた。オオナムチが名を呼ぶと、ウタは、歌の途中で、手を振った。", "屋根裏の窓から、白い街の灯が、細く差していた。", "ベルは、オオナムチの話を、黙って聞いていた。関所の、獣耳の男の子のこと。橋の上の、ウタのこと。丘の社の、五つの窪みのこと。", "そして、巡回の兵のこと。", "「ミカゲ、って言ったんです。自分で。槍を下ろして」", "オオナムチの声は、まだ、少し、震えていた。", "「でも、すぐに、戻っちゃいました。誰かに、呼ばれたみたいに。ユウのときと、同じでした」", "「そうか」", "ベルは、窓の外を見た。", "「それでも、一度は、名が出た」", "「はい」", "「港の、イサナを覚えているか」", "オオナムチは、頷いた。", "「名を呼ばれれば、輪郭は戻る。自分の口から名が出たのなら、その者の中に、まだ、名が残っているということだ」", "「残って、いる」", "「ああ。削られても、まだ、底にある」", "オオナムチは、しばらく、黙っていた。", "「ベルさん」", "「何だ」", "「丘の社の、真ん中の窪み。誰も、応えをもらったことがない神様が、いるそうです」", "「アメノミナカヌシか」", "「知ってるんですか」", "「名だけは」", "ベルは、それ以上、言わなかった。", "「先生は、言ってたそうです。ここが平らなのは、まだ誰も呼べていないからだって。いつか誰かが呼べたら、形が灯るって」", "オオナムチは、自分の掌を、見つめた。", "「俺、触ってみたんです。冷たかった。ただの、石でした」", "「今は、それでよい」", "ベルは、言った。", "「呼べる日が来るかどうかは、誰にも分からぬ。だが、触れたことは、覚えておけ」", "「……はい」", "梯子の下で、小さな足音がした。", "ミオが、ヒナを抱いて、上がってきた。ヒナは、半分、眠っていた。", "「おかえりなさい、オオナムチさん。この子が、どうしても、待っているって」", "オオナムチは、懐から、布の包みを取り出した。", "「ヒナ。丘の、青い花の種だ」", "ヒナの目が、ぱちりと、開いた。", "包みを開くと、黒い粒が、いくつも、こぼれた。ヒナは、それを、両手で、すくうように受け取った。", "「お父さんと、行った丘の？」", "「ああ。斜面いっぱいに、咲いてた。社守のおじいさんが、先生のこと、覚えてたよ」", "ヒナは、種を、じっと見ていた。", "それから、ミオの腕から下りて、梯子を下りていった。戻ってきたとき、手に、もう一つ、小さな鉢を抱えていた。お父さんの種の鉢とは、別の、欠けた鉢だった。", "「お父さんの鉢には、お父さんの種だけ」", "ヒナは、真剣な顔で、言った。", "「こっちは、丘の種。お父さんが帰ってきたら、どっちも、見せるの」", "ヒナは、欠けた鉢に、指で穴をあけ、種を、一粒ずつ、埋めていった。オオナムチが、水差しを傾けた。土が、黒く、湿った。", "ベルは、それを、見ていた。", "人間の子どもが、魔王の目の前で、種をまいている。父の帰りを信じて。", "(明日の夜だ)", "祝賀は、明日の夜。その夜、自分たちは、あの父がいる場所へ、行く。", "ベルは、そっと、拳を握った。", "指は、もう、震えていなかった。"]}, {"h": "七", "p": ["三日目の昼、コトシロは、軍務局の書庫にいた。", "棚と棚のあいだは、狭く、暗い。紙と、墨と、埃の匂いがした。", "(二度目だ)", "一度目は、朝のうちに済ませた。警備の配置の、南半分。写した紙は、帳簿の綴じ目の奥に、挟んである。", "今は、院の出入りの記録だ。", "棚の三段目から、綴りを引き抜いた。周りを、見回した。書庫番は、入口の机で、居眠りをしている。祝賀の日だ。局の者の半分は、もう、広場の支度に出ている。", "綴りを開いた。", "日付。氏名。移送の理由。受け入れの印。", "指で、行を追った。写すのは、日付と、人数と、出入りの刻だけでいい。全部を写せば、時間がかかる。時間がかかれば、見つかる。", "ペンを走らせた。", "一行。二行。", "指先が、冷たくなっていく。", "ページを、めくった。", "そこで、手が、止まった。", "綴りの、いちばん下の欄外に、小さな名簿が、貼りつけられていた。軍務局の、書記の名簿だった。五人の名が並び、その一つに、黒い線が、まっすぐ、引かれていた。", "『シロエ』", "線の横に、細い字で、書き添えてあった。", "『療養のため、院へ』", "コトシロは、その名を、知っていた。", "いや、知っていたはずだった。", "今の机を、前に使っていた男だ。帳簿の、引き継ぎ相手だった。引き継ぎの帳簿の、几帳面な字。ところどころに、小さな書き込みがあった。", "『この数字、合わない。確かめること』", "『院の受け入れ数、月ごとに増えている。なぜ』", "コトシロは、その書き込みを、覚えていた。読んだとき、背中が、冷えたのを覚えていた。それなのに、書き込んだ者の名を、今の今まで、思い出せなかった。", "(シロエ)", "この人も、写しを取ろうとしたのだ。", "そして、療養に、送られた。", "コトシロは、名簿の、黒い線を、指でなぞった。", "局の誰も、この名を、口にしない。引き継ぎのとき、この机の前の主は、と聞いたら、上役は、少し困ったように眉を寄せて、「病気でね」とだけ言った。それきりだった。", "誰も、悪気はない。", "それが、何より、恐ろしかった。", "コトシロは、ペンを、持ち直した。", "写しの紙の、いちばん端に、小さく、一行、書き足した。", "『シロエ。書記。前任』", "意味のない一行だった。警備の役にも、院への潜入の役にも、立たない。見つかれば、余計な疑いを招くだけだ。", "それでも、書いた。", "(誰かが、覚えていなければ)", "検品官の仕事は、目利きだ。品の良し悪しを、見抜く。見抜いたものを、帳簿に書き留める。書き留めなければ、それは、なかったことになる。", "二十年、そうしてきた。", "刃の芯に仕込まれた層を、見て見ぬふりをした日から、自分は、何かを、書かずに済ませることを覚えてしまった。けれど、これは、違う。これだけは、書き留めておかなければならない。", "綴りを閉じて、棚に戻した。", "入口の机で、書庫番が、まだ、居眠りをしていた。", "コトシロは、帳簿を抱え直し、書庫を出た。廊下の窓から、広場の灯籠が見えた。もう、吊るされ始めている。夕方には、灯が入るだろう。", "三度目は、日が傾く前に、済ませる。", "それが済んだら、警邏の懐改めを、くぐらなければならない。そして、鐘楼の裏に、白い布を、一枚。", "コトシロは、外套の内ポケットに、手を入れた。", "白い布の手触りが、指先に、あった。", "(頼みます、ベル殿)", "まだ、昼だった。祝賀の灯が入るまで、あと、数刻あった。"]}]}, {"id": "ch11_5", "label": "四天王編", "title": "土と角と牙と羽", "chars": 9700, "sections": [{"h": "一", "p": ["ハニヤスは、夜明けより先に、畑へ出た。", "段々の田は、まだ靄の底に沈んでいた。赤い空が、東の端から、少しずつ薄くなっていく。実り始めた稲穂が、露を含んで、重たげに頭を垂れていた。", "畦を歩きながら、足元を見る。土の色。水の引き方。芽の向き。長い年月、毎朝、同じことをしてきた。", "畑のいちばん上の段に、先客がいた。", "細い背に、まだ若い甲殻を負った娘だった。鍬を握り、黙々と、畝の土を返している。誰に言われたのでもない。誰に見られているのでもない。毎朝、ハニヤスより先に、そこにいた。", "畑番の娘だ。", "ハニヤスは、声をかけようとして、口を閉じた。", "(名は)", "知っている。知っているはずだった。根の洲に、この娘の家の畑があった。父と母と、幼い弟と、四人で耕していた。あの日、根の洲が焼けた。娘だけが、埴の里に、使いに来ていた。父と母と弟の行方は、それきり、知れない。帳面の、着いた日の欄は、三人とも、空いたままだ。", "あれから、娘は、口をきかなくなった。", "里の者は、娘を、畑番と呼ぶようになった。気遣いだった。名を呼べば、根の洲の家を思い出させる。家族の顔を、思い出させる。だから、誰も、名を呼ばなかった。", "ハニヤスも、そうした。", "(それで、よかったのか)", "娘は、こちらに気づかないまま、鍬を振り続けていた。その輪郭が、靄の中で、妙に、ぼやけて見えた。", "ハニヤスは、しばらく、それを見ていた。", "それから、坂を下りた。客の泊まる小屋へ向かった。", "王が、人間の青年を、連れて帰ってきた。昨日の朝のことだ。比良坂から、走り通してきたという。継ぎの当たった外套に、使い古した短剣。肩の細い、ただの若者だった。", "王は、その若者を、友だと言った。", "(王が、畦の芽を、踏みかけた日がある)", "人の王との、会談の朝だった。王は、片足を上げたまま、固まった。小さな芽が、一本だけ、顔を出していた。", "あの日、自分は言った。気づく前に、足元を見ろ。土は黙っているが、忘れはせん。", "あの王が、足元を見る者を、連れてきたのかどうか。", "それを、確かめておきたかった。", "小屋の戸を、叩いた。", "「起きたか、客人」"]}, {"h": "二", "p": ["日が高くなるころ、ハニヤスは、畦の上から、青年を見ていた。", "土への挨拶は、済ませた。泣いていたのを、土のせいにした若者だった。それから、青年は、帰ろうとしなかった。", "畝の端にしゃがみ込み、土蜘蛛の若衆の手元を、じっと見ていた。草の抜き方。芽の残し方。見よう見まねで、自分も手を動かす。最初は、芽ごと抜きかけて、若衆に手を叩かれた。二度目からは、抜かなかった。", "足元を、見ていた。", "ハニヤスは、何も言わなかった。", "青年が、畑のいちばん上の段へ、上がっていった。そこには、畑番の娘がいる。", "青年は、娘の隣に、しゃがんだ。", "「あの」", "娘の手が、止まった。", "「この芽、残したほうが、いいですか」", "娘は、答えなかった。しばらく、青年の手元を見ていた。それから、黙って、うなずいた。", "「ありがとうございます」", "青年は、芽を残して、隣の草を抜いた。", "それから、顔を上げて、娘を見た。じっと、見た。何か、変なものを見るような目だった。", "(見えているのか)", "ハニヤスは、畦の上で、息を止めた。", "「すみません。お名前、聞いてもいいですか」", "娘の肩が、震えた。", "長い間があった。娘の唇が、動いた。声は、出なかった。もう一度、動いた。", "「……アカネ」", "かすれた、小さな声だった。あの日から初めて、ハニヤスは、娘の声を聞いた。", "「アカネさん。俺は、オオナムチです。人間ですけど、畑を荒らしには、来てません」", "「……知ってる」", "娘は、鍬を握り直した。", "「さっき、ハニヤス様と、土に、挨拶してた」", "ハニヤスは、畦の上で、ゆっくりと息を吐いた。", "(名を呼ばぬのが、気遣いだと思っていた)", "違ったのかもしれない。名を呼ばないことで、自分たちは、娘を、根の洲と一緒に、どこか遠くへ置いてきてしまったのかもしれない。", "土は、黙っているが、忘れはせん。", "けれど、人は、呼ばれなければ、忘れられていく。", "「アカネ」", "ハニヤスは、畦の上から、声をかけた。", "娘が、振り向いた。驚いた顔だった。", "「一休みしろ。客人にも、握り飯を分けてやれ」", "娘は、目を瞬いた。それから、小さく、うなずいた。", "その輪郭が、朝の光の中で、少しだけ、くっきりと見えた。", "朝のうちに、畦に並んで、三人で握り飯を食べた。新米の、甘い握り飯だった。青年が角ヶ原へ向かう前の、短いひとときだった。", "アカネは、半分ほど食べたところで、手を止めた。", "「人間の畑も、こういう段々なの」", "小さな声だった。青年は、口の中の米を飲み込んでから、首を振った。", "「俺の知ってる畑は、もっと狭くて、石が多いです。ひなた野っていう、亜人の集落があって。そこの畑は、細い野菜しか育たなくて」", "「あるの」", "「……今は、ないです。入植者の杭が立って、水場を汚されて、住めなくなりました。みんな、俺の故郷に移ってきました」", "アカネは、握り飯を見つめた。", "「わたしの畑も、ない。父さんも、母さんも、弟も、まだ、戻らない」", "「はい」", "青年は、それ以上、何も聞かなかった。慰めもしなかった。ただ、うなずいて、自分の握り飯の、残りの半分を、口に運んだ。", "アカネも、残りの半分を、食べた。", "ハニヤスは、二人の間で、黙って、空を見ていた。赤い空が、少しだけ、高く見えた。"]}, {"h": "三", "p": ["嵐ヶ峰の風は、冷たかった。", "スサノは、演武場の岩の上に、胡座をかいていた。午後には、あの人間の小僧が来る。ナキメが、聖域から連れてくるはずだ。", "岩の下に、小さな影が、ちょこんと座っていた。", "耳の聞こえない、嵐狼の幼い子だ。今日も、ついてきた。スサノが演武場に上がる日は、必ず、ついてくる。岩の陰に座って、膝を抱えて、じっと見ている。", "スサノは、岩を降りて、子どもの隣に座った。", "子どもが、手を動かした。", "(今日、だれと、たたかう？)", "スサノは、指を折りながら、ゆっくりと答えた。", "(人間。王様の、ともだち)", "子どもの目が、丸くなった。", "(人間、こわい？)", "スサノは、少し、考えた。", "(わからない。だから、見る)", "子どもは、真剣な顔で、うなずいた。それから、膝を抱え直して、演武場の入口を、じっと見張りはじめた。", "スサノは、その小さな背中を、眺めていた。", "嵐狼の群れには、古い掟がある。群れは、速く走る。ついて来られない者は、置いていく。吹雪の峰を越えるとき、一匹の遅れが、群れ全部を殺すからだ。", "スサノが子どもだったころ、妹がいた。生まれつき、片足が弱かった。", "ある冬、群れが峰を越えた。妹は、ついて来られなかった。スサノは、何度も振り返った。大人たちが、スサノの首を咬んで、前を向かせた。掟だ、と言われた。", "春になって、峰の向こうに戻った。妹は、雪の下にいた。", "(掟は、群れを守る)", "それは、本当だった。掟のおかげで、群れは、吹雪を越えた。", "(だが、妹は、群れではなかったのか)", "長になったとき、スサノは、掟を破った。ついて来られない者を、置いていかない里を作った。足の弱い者。目の見えない者。耳の聞こえない者。群れの古い者たちは、怒った。半分が、出ていった。", "残った者たちと、寄り添いの里を作った。", "群れは、遅くなった。吹雪の峰は、越えられなくなった。代わりに、峰の手前に、畑を作った。ハニヤスに、土の作り方を教わった。", "(遅い群れでいい)", "そう決めた。後悔は、していない。", "ただ、ときどき、思う。速く走れる者を、遅い者に合わせて歩かせるのは、正しいのか。速い者の速さを、殺しているのではないか。", "人間の小僧のことを、王から聞いていた。誰も受けない依頼を選ぶ者だという。いちばん遅い者のところへ、自分から歩いていく者だという。", "(群れの外で、同じことをしている奴がいる)", "それを、見てみたかった。", "子どもが、スサノの袖を引いた。入口のほうを、指さしている。", "黒い翼のナキメと、継ぎの当たった外套の小僧が、並んで歩いてきた。小僧の顔は、聖域の水で冷えたのか、少し青かった。それでも、目は、澄んでいた。", "子どもが、手を動かした。", "(あれ？)", "(あれだ)", "子どもは、小僧を、穴があくほど見つめた。それから、スサノを見上げて、手を動かした。", "(こわくない)", "スサノは、牙を見せて、笑った。", "(まだ、わからねえぞ)", "岩の上へ、戻った。風が、峰から吹き下ろしてきた。", "手合わせは、日が傾くまで続いた。", "小僧は、何度も打たれた。三度目で、ようやく、スサノの二度目の踏み込みを読んだ。爪を、短剣の腹で受け流した。", "やるじゃねえか、と、思わず口に出ていた。", "終わったあと、小僧は、演武場の砂の上に、大の字に倒れていた。息が上がって、しばらく起き上がれなかった。", "岩陰から、小さな影が、とことこと出ていった。", "耳の聞こえない子が、小僧の顔を、上から覗き込んだ。小僧が、驚いて、目を瞬いた。", "子どもが、手を動かした。", "(いたい？)", "小僧は、首をかしげた。分からないのだ。子どもは、もう一度、ゆっくりと動かした。自分の腕を、撫でる仕草をして、顔をしかめてみせる。", "小僧の顔が、ぱっと明るくなった。", "「痛いか、って？」", "小僧は、起き上がって、子どもの仕草を、そのまま真似した。腕を撫でて、顔をしかめる。それから、首を横に振って、笑ってみせた。", "子どもが、笑った。", "スサノは、岩の上から、それを見ていた。", "小僧は、言葉の通じない相手に、言葉を押しつけなかった。相手の手を、見ていた。見て、真似して、返した。速さを合わせたのではない。向きを、合わせたのだ。", "(遅い者に合わせて歩くんじゃねえ)", "並んで、同じほうを向いて、歩く。それだけのことだった。", "子どもが、スサノのほうを振り向いて、両手を大きく動かした。", "(こわくない。ほんとうに、こわくない)", "スサノは、喉の奥で、唸るように笑った。", "「保留だ」", "声に出してから、子どもには聞こえないことを思い出した。手で、言い直した。", "(まだ、見る)", "子どもは、不満そうに頬を膨らませた。小僧は、何のことか分からずに、二人を見比べていた。", "小僧が帰ったあと、演武場の砂の上に、短剣が一本、落ちていた。刃こぼれが、三か所。柄の革が、ほどけかけている。", "スサノは、拾い上げて、鼻を鳴らした。角ヶ原へ戻る鬼の若い衆を呼び止めて、それを、放った。", "「ミカヅチに渡せ。あいつの客だ」", "峰の上で、風の向きが、変わった。今夜は、埴の里で、収穫祭だ。"]}, {"h": "四", "p": ["聖域から嵐ヶ峰へ向かう道を、ナキメは、ゆっくりと歩いていた。", "隣で、人間の青年が、黙って歩いている。水鏡で、名呼びの入口に触れたばかりだ。掌を、何度も、握ったり開いたりしていた。", "「手が、冷えましたか」", "「いえ。まだ、温かいんです。変ですね」", "「変ではありません。入口に触れた者は、皆、そう言います」", "ナキメは、それきり、黙った。", "峰へ上る坂の途中で、一羽の鴉が、岩に止まっていた。いや、鴉ではない。鴉族の娘だ。黒い翼を畳み、伝令の革帯を肩にかけている。ナキメの姿を見ると、娘は、慌てて、深く頭を下げた。", "ナキメは、足を止めなかった。会釈も、返さなかった。", "通り過ぎてから、青年が、小さく振り返った。", "「今の人」", "「伝令です」", "ナキメは、短く言った。", "「宮の牢の、見張りをしていました。勇者が逃げた夜に」", "青年が、息を呑む気配がした。", "あの夜のことは、何度も、頭の中で、繰り返している。", "ナキメが、勇者タケルの洗脳を解こうとしていた。数か月はかかると、自分で王に告げた仕事だった。根の、いちばん細い一本に、指をかけた夜。その綻びが、人の王への合図になった。牢の鍵が、内側から開いた。見張りの伝令は、何が起きたか分からないまま、気を失っていた。", "伝令に、落ち度はなかった。落ち度は、自分にあった。", "それでも、ナキメは、あの夜から、娘の名を、一度も呼んでいない。", "呼べなかった。名を呼べば、あの夜の、自分の指の震えを、思い出す。鴉族の長として、娘を責めてはいない。誰にも、責めさせてはいない。ただ、目を合わせられなかった。", "それで、鴉族の者たちも、娘を、伝令とだけ呼ぶようになった。長が呼ばない名を、誰も呼ばなかった。", "(王は、責めるな、とおっしゃった)", "脱走の詳細を伝えたとき、オモイカを通して届いた、王の短い言葉だった。", "責めるな。", "自分を、とは、言わなかった。けれど、そういう意味だったのだと、今は思う。", "「ナキメさん」", "青年が、口を開いた。", "「稽古のこと、ですけど」", "ナキメは、我に返った。そうだった。スサノとの手合わせの前に、もう一つ、教えておくことがある。", "「言霊への、耐えです」", "ナキメは、坂の途中で立ち止まった。青年と、向き合った。", "「人の王の言霊は、耳ではなく、心の、いちばん柔らかい所から入ってきます。あなたが欲しい言葉を、ちょうどいい順番で差し出してくる。だから、善い者ほど、深く染まる」", "「はい」", "「今から、私が、あなたに言葉をかけます。乗らずに、聞きなさい。自分の考えを、たどり直しながら」", "ナキメは、声を、低く落とした。", "鴉族の長として、魔界でいちばん、言葉の術に長けている。その技を、少しだけ、乗せた。", "「あなたは、よくやりました。誰も責めません。ユウという方も、もう、あなたを待っていない。あの方は、正しい側にいて、幸せなのですから。あなたが、取り戻す必要は、ないのですよ」", "青年の目が、揺れた。", "一瞬だった。それから、青年は、ゆっくりと、息を吐いた。", "「……ユウは、井戸の水を、皆で汲もうって、言った奴です」", "声は、静かだった。", "「正しい側とか、そういうのじゃなくて。皆で、って。だから、幸せなら、それでいいとは、思えません」", "ナキメは、黙って、青年を見た。", "心の水面が、波立って、すぐに、凪いでいた。乗らなかった。たどり直した。自分の手で、自分の考えを。", "(静かな人だ)", "術の素質の話ではない。もっと底の、名の根のほうが、静かなのだ。", "「合格です」", "「え。今ので、ですか」", "「ええ。洗脳の言葉には、呼吸があります。乗せるときの、ほんの一拍。それを覚えておきなさい。いつか、読めるようになります」", "ナキメは、歩き出した。三歩、進んで、止まった。", "振り返った。坂の下の岩に、伝令の娘が、まだ、止まっていた。", "ナキメは、口を開いた。", "名が、喉まで来た。そこで、止まった。", "(まだ、呼べない)", "青年が、ナキメの顔を見て、それから、娘のほうを見た。", "「あの人の名前、何ていうんですか」", "ナキメは、答えなかった。", "(クロハ)", "知っている。知っているが、まだ、喉を通らない。", "代わりに、坂の下を、見た。娘も、顔を上げていた。目が、合った。", "ナキメは、目を逸らさなかった。娘も、逸らさなかった。それだけだった。", "ナキメは、背を向けた。翼の付け根が、熱かった。"]}, {"h": "五", "p": ["日が傾くころ、ミカヅチは、オハバリ城の鍛冶場にいた。", "角ヶ原の外れの、岩を穿った城だ。鬼族の武具は、すべて、この城の鍛冶場で打たれる。炉の火は、昼も夜も、絶えたことがない。", "炉の前に、一人の鬼の女が、座っていた。", "鬼にしては小柄で、腕だけが、異様に太い。煤けた顔で、黙って、刃を研いでいた。", "ミカヅチは、懐から、布の包みを取り出した。", "「これを、見てやってくれ」", "包みを開くと、使い古した短剣が、一本、出てきた。刃こぼれが、三か所。柄に巻いた革が、擦り切れて、ほどけかけている。", "嵐ヶ峰の稽古のあと、小僧が、演武場の砂の上に置き忘れていったものだ。スサノのところから、若い衆が届けてきた。昼の手合わせでも、小僧は、ずっと、これを握っていた。", "女は、短剣を手に取った。指で、刃をなぞる。", "「……人間の、刃」", "「ああ。王の客人のものだ」", "「ひどい」", "女は、ぽつりと言った。", "「研ぎも、ろくにしてない。打ち直したほうが、早い」", "「打ち直すな」", "ミカヅチは、低く言った。", "「刃こぼれだけ、直せ。柄の革を、巻き直せ。形は、変えるな。あの小僧の手に、馴染んでいる」", "女は、ミカヅチを見上げた。それから、黙って、うなずいた。砥石に、水を打った。", "研ぐ音が、鍛冶場に響いた。", "ミカヅチは、壁際の床几に腰を下ろした。", "(この女の名は)", "ヤマブキという。知っている。知っているが、騙し討ちの日から、誰も呼んでいない。", "会談に向かったオモイカの随員。その腰の刃を、打ったのは、この女だった。鬼の書記が、冗談めかして言っていたという。参謀殿の随員の刃は、オハバリの名工の作だ、と。", "その刃は、一本も、戻らなかった。", "騙し討ちの日、随員たちは、刃を抜く暇もなく倒れたと聞く。抜かれなかった刃。役に立たなかった刃。女は、それから、炉の前を離れなくなった。誰とも、口をきかなくなった。", "鍛冶場の者たちは、女を、名工、とだけ呼ぶ。", "ミカヅチも、そう呼んでいた。", "研ぐ音が、止まった。", "女が、短剣を、炉の火にかざした。刃こぼれが、消えていた。柄には、新しい革が、きつく、丁寧に巻かれていた。形は、何一つ、変わっていなかった。", "「……これで、いいか」", "「ああ」", "ミカヅチは、短剣を受け取った。掌に、ずしりと、重さが馴染んだ。", "小僧の顔を、思い出した。何度倒されても、立った。退かなかった。", "(受けきる、とは)", "自分は、小僧に、そう教えた。倒れても、背を向けるな。その場に、居続けろ。", "この女は、あの日から、炉の前に居続けた。退かずに。けれど、それは、受けきることだったのだろうか。それとも、ただ、動けなかっただけなのか。", "ミカヅチは、受け取った短剣を、女の前に、かざして見せた。", "「この刃は、明日、使われる。人間界最強の剣と、向き合う」", "女の目が、見開かれた。", "「抜かれる刃だ。おまえの研いだ刃が、明日、抜かれる」", "女は、何も言わなかった。言えなかったのかもしれない。ただ、煤けた頬を、一筋、何かが伝った。", "ミカヅチは、背を向けた。鍛冶場を出るとき、背中で、また、研ぐ音が始まるのを聞いた。", "今度の音は、少しだけ、軽かった。"]}, {"h": "六", "p": ["収穫祭の夜、ミカヅチは、卓の喧騒から離れて、畑の縁の石に座っていた。", "鬼の若者たちが、人間の小僧に酒を押しつけている。小僧は、顔を真っ赤にして、断り続けていた。耳の聞こえない嵐狼の子が、小僧の袖を引いている。", "ミカヅチは、懐の短剣を、まだ渡していなかった。", "足音がした。", "王だった。魔王の姿のまま、角も翼も隠さずに、石の隣に立った。", "「ここにいたか」", "「騒がしいのは、若い者に任せておりますので」", "王は、黙って、隣に腰を下ろした。", "しばらく、二人で、祭りの灯を眺めていた。", "「王」", "ミカヅチは、懐から、短剣を取り出した。", "「小僧の刃です。嵐ヶ峰に、置き忘れていきました。ヤマブキに、研がせました」", "王は、短剣を受け取った。刃を、灯にかざした。新しい革の柄を、親指で、なぞった。", "「……ヤマブキが、研いだのか」", "「明日、抜かれる刃だと、伝えました。それだけです」", "王は、何も言わなかった。けれど、その横顔が、わずかに、揺れたように見えた。", "「明日、渡してやってください。王の手から」", "「ああ」", "王は、短剣を、膝の上に置いた。", "「王」", "ミカヅチは、もう一つ、聞いておきたいことがあった。", "「あの小僧に、何を教えたのです」", "「何を、とは」", "「受けきるとは何か、と聞いたら、小僧は、倒れないことだと答えました。違うと言ったら、すぐに分かった顔をした。まるで、どこかで、同じ根の言葉を、聞いていたような顔でした」", "王は、長いこと、黙っていた。", "「人間界で、夜に、稽古をつけていた」", "やがて、低く言った。", "「港町の宿の裏庭で、最初は、堅めの膜の張り方だけを。それから、旅のあいだ、夜ごとに少しずつ」", "「最後の夜は」", "「……最後の夜に、一度だけ、言葉にした」", "王は、祭りの灯を見たまま、言った。", "「守るとは、倒すことではない。誰も失わぬ道を、選び続けることだ、と」", "ミカヅチは、目を閉じた。", "(退かぬこと)", "自分が教えた言葉と、王の言葉が、胸の中で、重なった。", "倒れても、退かない。誰も、失わない。", "同じ根だった。", "「受けきる、と同じ根ですな」", "「そうか」", "「ええ。私が王に教わったのは、受けきることでした。あの一騎討ちで」", "王が、わずかに、こちらを見た。", "「私は、あの日、王の一撃を受けきったと思っていました。誇りでした。根の洲を見て、手加減だったと知りました」", "ミカヅチは、短く笑った。", "「恨んではおりません。あの日、私は、立った。王が、立てる強さを選んでくださったから、立てた。それが、今の私です」", "王は、何も言わなかった。", "ただ、膝の上の短剣を、ゆっくりと握った。", "「明日、あの小僧は、立つでしょう」", "ミカヅチは、立ち上がった。", "「何度倒れても。王が、立てる強さを、選んで育てたのだから」", "「……私は、何も選んでいない」", "「選んでおられます。手を、出さないことを」", "王の手が、短剣の上で、止まった。", "ミカヅチは、それ以上言わずに、卓のほうへ歩き出した。数歩行って、振り返った。", "王は、立ち上がっていた。卓の端の、杖をついた女のほうへ、歩いていくところだった。", "オモイカは、一人で、杯にも手をつけずに座っていた。", "王は、その隣に、何も言わずに、腰を下ろした。", "ミカヅチは、鬼の若者たちの輪へ戻った。", "「おい。客人に、あまり飲ませるな。明日は、大事な日だ」", "若者たちが、えっ、と声を上げた。小僧が、ほっとした顔をした。"]}, {"h": "七", "p": ["夜明け前、オモイカは、ヒラサカの関に立っていた。", "比良坂へ下る道の手前に、鬼族の見張りの関がある。その脇の、岩の窪みに、石が一つ、置かれていた。", "名の刻まれていない、平たい石だった。", "傷が塞がりきらないうちに、オモイカが、自分で置いた。会談の間から戻れなかった随員たちのための石だ。", "名を、刻めなかった。刻もうとして、鑿を持った手が、動かなかった。", "杖をついて、石の前に立った。腹の傷が、冷えた空気に、鈍く疼いた。", "一人ひとりの顔を、思い出す。", "笛の下手だった嵐狼の青年。巻物を抱えて、参謀殿、顔が怖いですぞ、と笑った老いた鬼の書記。荷を担いで、いちばん前を歩いていた、若い鴉。", "ほかにも、いる。十一人。全部で、十四人。", "家族の数も、好物も、故郷の畑の広さも、全部、覚えている。", "名も、覚えている。", "口を、開いた。", "喉が、固く閉じた。", "(申し訳ありません、私は――)", "いつもの言葉が、胸の中で、途切れた。", "その先を、遮ってくれる声は、ない。ここには、王はいない。", "昨夜、王は、何も言わずに隣に座り、杯を置いてくれた。半分だけ、叶いました、と、胸の中で、随員たちに告げた。人間は、席に着きました。あなた方の席は、まだ、空いたままですが、と。", "残りの半分は、いつ、叶うのだろう。", "関の向こうから、足音が、聞こえてきた。", "オモイカは、岩の陰に、身を寄せた。", "坂の上の道を、三つの影が、下りてくるところだった。", "先頭は、寡黙な岐人。クナドだ。見届け人を務めると、昨夜、王に告げていた。", "その後ろに、魔王の姿の王。", "そして、王の隣に、継ぎの当たった外套の、人間の青年。", "青年の腰に、短剣が下がっていた。柄の革が、新しかった。", "(あの刃は)", "オハバリの鍛冶の巻き方だった。随員の刃と、同じ巻き方。", "オモイカの胸の奥で、何かが、小さく、音を立てた。", "三つの影は、関の前で、一度、足を止めた。青年が、関の脇の、名のない石に、目を向けた。", "じっと、見ていた。", "それから、青年は、石に向かって、小さく、頭を下げた。誰の石かも、知らないはずなのに。", "王が、青年の背に、手を置いた。何か、低く、言った。風に紛れて、聞こえなかった。", "三つの影は、また、歩き出した。坂上の砦へ。人間界最強の剣と、向き合うために。", "オモイカは、岩の陰から出た。", "名のない石の前に、もう一度、立った。", "「……見ましたか」", "石に、話しかけた。", "「人間の青年が、あなた方に、頭を下げていきました。名も、知らないのに」", "声が、少しだけ、震えた。", "「いつか、あの方に、あなた方の名を、教えます。必ず。だから、もう少しだけ、待っていてください」", "杖を握る手に、力を込めた。", "笛の下手な嵐狼の青年の、名の、最初の一音だけを、唇に乗せてみた。", "息が、音にならずに、白くこぼれた。それでも、喉は、昨日ほど固くはなかった。", "(明日なら、もう一音)", "そう思えたことが、少しだけ、うれしかった。オモイカは、石に、深く頭を下げた。", "比良坂の大穴の底から、細い光の筋が、立ち昇っていた。", "東の空が、赤から、白へ、変わりはじめていた。"]}]}, {"id": "ch12_5", "label": "第十二・五章", "title": "三か月", "chars": 9549, "sections": [{"h": "一", "p": ["埴の里の夜は、虫の声で満ちていた。", "オオナムチは、寝床の上に、座っていた。", "横になっては、起き上がる。それを、もう、何度繰り返したか分からない。目を閉じると、掌に、あの感触が戻ってくる。重く、短く、静かな、肉を断つ手応え。", "両手を、膝の上に置いた。", "震えていた。", "砦の広場で、ベルの手が重なったとき、震えは、少しだけ、収まった。けれど、夜になって、一人になると、また、戻ってきた。指先から、手首へ。手首から、肘へ。体の奥のどこかが、ずっと、細かく揺れている。", "(俺が、殺した)", "言葉にすると、胸の底が、冷たくなった。", "王の顔が、浮かぶ。最期の、見開かれた目。「なぜ、私が」と動いた唇。あの人は、最後まで、自分が何をしたのかを、分かっていなかった。", "それでも、人だった。", "ハニヤスが貸してくれた小屋は、土の匂いがした。壁の向こうで、誰かが、寝返りを打つ音がした。避難してきた民の、子どもだろうか。", "戸が、静かに開いた。", "月明かりの中に、黒い影が立っていた。角と、畳んだ翼。", "ベルだった。", "「眠れぬか」", "「……すみません」", "「謝ることではない」", "ベルは、寝床の脇の、土の床に、腰を下ろした。王が、土の床に、座った。オオナムチは、慌てて立ち上がろうとした。", "「座っていろ」", "短く、言われた。オオナムチは、座り直した。", "ベルは、何も言わなかった。ただ、隣にいた。", "しばらくして、ベルの手が、オオナムチの震える手の上に、重なった。", "大きな手だった。掌に、乾いた傷が、いくつもあった。昨日の朝、砦で、爪を立てて握りしめていた拳の傷だ。", "「眠らずともよい」", "ベルが、言った。", "「目を閉じていろ。私が、ここにいる」", "オオナムチは、うなずいた。目を閉じた。", "震えは、止まらなかった。けれど、重なった手の温度が、震えの上に、一枚、薄い膜を張ってくれる気がした。堅めとは、違う膜だった。", "明け方、オオナムチは、浅く眠った。", "目が覚めると、ベルは、まだ、そこにいた。土の床に座ったまま、壁にもたれて、目を閉じていた。手は、重なったままだった。", "魔王が眠るところを、オオナムチは、初めて見た。", "眉の端の、小さな古傷。閉じた瞼。わずかに開いた唇。ミナモの受付で、初めて見たときと、同じ顔だった。角と翼があっても、何も、変わらなかった。", "(この人も、眠れなかったんだ)", "重なった手の、乾いた傷を、オオナムチは、そっと見た。", "起こさないように、手を、そのままにしておいた。窓の外で、鶏が、一度だけ、鳴いた。段々田の向こうから、朝の煙が、細く、立ちのぼり始めていた。"]}, {"h": "二", "p": ["ユウは、軍務局の机の前に、立ち尽くしていた。", "朝だった。いつもの時刻に、いつもの廊下を歩いて、いつもの机に着いた。体が、そう動いた。", "けれど、頭の中が、静かだった。", "いつもなら、机に着くと、声がした。温かい、柔らかな声。今日も、正しいことをしよう。おまえは、民の一人だ。正しい側に、いるのだから。", "その声が、なかった。", "代わりに、空白があった。底の見えない、白い空白。", "(何を、すればいいんだ)", "机の上には、書類が積まれていた。移送の記録。『やすらぎの院へ』。何十枚も、何百枚も。全部、自分が、判を押した紙だった。", "ユウは、一枚を、手に取った。", "名前が、書いてあった。知らない名前だった。教師、とあった。理由の欄に、『魔族を擁護する授業』。", "判を押した日のことを、覚えていなかった。", "覚えていないのに、判の朱は、確かに、自分の手のものだった。", "局の中は、ざわめいていた。誰もが、同じ顔をしていた。夢から覚めて、まだ、どちらが夢なのか分からない顔。ある者は、書類を握りしめて泣き、ある者は、窓の外を、ぼんやりと見ていた。", "「王が、亡くなったそうだ」", "誰かが、言った。", "「坂上の砦で。……冒険者の若者が」", "ユウは、顔を上げた。", "(冒険者の、若者)", "継ぎの当たった外套が、浮かんだ。夜の井戸。焦点の合わない自分の目に、まっすぐ届いた、あの声。ひなた野の井戸、覚えてるか。王都の門前で、ハルが待ってる、と叫んだ声。", "ユウは、腕を見下ろした。", "白い腕章が、巻かれていた。", "指が、勝手に、それを外した。結び目が、思ったより、固かった。外れた腕章を、机の上に置いた。それから、また、手に取った。捨てられなかった。捨てたら、これを巻いていた自分まで、なかったことにしてしまう気がした。", "腕章を、懐の奥に、しまった。", "局を出た。王都の白い通りを、歩いた。城門を、くぐった。", "葛の里へ向かう街道は、南へ延びていた。", "半日歩いて、ユウは、足を止めた。", "(帰って、いいのか)", "ハルの顔が、浮かんだ。ひなた野の井戸。獣ノ原の井戸。夜の井戸で、自分は、何をした。鎌まで、取り上げた。武器を、預かると言って。", "あの里の人たちに、どんな顔をして、会えばいい。", "ユウは、引き返した。", "一刻歩いて、また、止まった。また、向きを変えた。", "街道の脇の、小さな丘に、腰を下ろした。", "南の空が、高かった。頭の中は、相変わらず、静かだった。静かすぎて、怖かった。", "声がしていたころは、迷わなかった。何をすればいいか、いつも、教えてもらえた。正しい側にいる、という温かさが、胸の真ん中に、いつも、あった。", "その温かさが、全部、借り物だった。", "借り物を返したあとの胸は、こんなにも、がらんとしている。", "ユウは、膝を抱えた。", "夜の井戸の記憶が、ぼんやりと、浮かんできた。焦点の合わない目で、自分は、幼なじみを見ていた。あいつは、怒鳴らなかった。武器も、抜かなかった。ただ、井戸の水の話をした。ひなた野の、夏の、冷たい水の話を。", "あのとき、胸の奥で、何かが、ひび割れた。", "王都の門前でも、そうだった。逃げていく魔王と、冒険者たちの背中。槍を構えた自分に、あいつは、振り向いて、叫んだ。", "ハルが、待ってる。", "その一言で、足が、止まった。止まったまま、動けなかった。声が、戻りなさい、と言うまで。", "(待ってる、か)", "本当に、待っているだろうか。こんな兄を。", "懐の奥で、腕章が、かさりと鳴った。", "その隣に、もう一つ、紙があった。ハルに宛てて、書きかけて、出せなかった手紙だった。少し、右に傾いた字。", "ユウは、その紙を、長いこと、見ていた。"]}, {"h": "三", "p": ["タケルが目を覚ましたのは、岐人の集落の、石の部屋だった。", "窓の外で、風が鳴っていた。言霊の届きにくい土地だと、クナドは言った。だから、ここで、体を休めるのがよい、と。", "三日、タケルは、ほとんど、口をきかなかった。", "出された粥を、食べた。残さずに、食べた。魔界の牢で出された粥と、同じ味がした気がした。そう思うと、喉が詰まった。それでも、食べた。", "四日目の朝、タケルは、クナドに言った。", "「もう一度、魔王に会わせてくれ」", "クナドは、夜の色の目で、タケルを見た。", "「裁きは、すでに、申し渡されておりますが」", "「分かっている」", "タケルは、拳を握った。", "「直せ、と言われた。だが、何から直せばいいのか、分からない。焼いた大陸は、あまりに広い。消えた者は、あまりに多い。……それを、聞きに行きたい」", "クナドは、しばらく、黙っていた。", "「ご案内いたします」", "比良坂を渡った。光の筋の道を降りると、赤い空が、頭上に広がった。", "タケルは、立ち止まった。", "この空の下で、自分は、剣を抜いた。会談の席で。根の洲で。", "魔王は、黄泉津の宮ではなく、根の洲の、焼け野に立っていた。", "黒い土が、どこまでも続いていた。焦げた木の幹が、骨のように、立っている。その真ん中に、角のある背中が、一つ。", "隣に、もう一つ、大きな影があった。鬼族の頭領、ミカヅチだった。", "タケルは、魔王の前に、膝をつこうとした。", "「立っていろ」", "魔王が、振り向かずに言った。", "「ここで、膝をつくな。土が、汚れる」", "タケルは、立ち上がった。", "魔王が、足元の土を、指さした。", "黒い土の中に、小さな緑が、一つだけ、覗いていた。焦げた根の隙間から、細い芽が、顔を出していた。", "「あの日まで、ここは、畑だった」", "魔王は、言った。", "「芽は、勝手に出る。だが、畦がなければ、水は溜まらぬ。誰かが、畦を積まねばならぬ」", "魔王は、タケルのほうを、見た。灰色の目だった。紅は、灯っていなかった。", "「何から直せばいいか、と聞いたな」", "「……ああ」", "「ここからだ」", "ミカヅチが、鍬を一本、タケルの前に、放った。鍬は、黒い土に、突き刺さった。", "「監督は、俺がやる」", "ミカヅチは、腕を組んだ。", "「誰に頼まれたわけでもない。俺が、やりたいから、やる。毎朝、角ヶ原から来る。手を抜いたら、すぐ分かるぞ」", "タケルは、鍬の柄を、握った。", "剣の柄とは、まるで違う重さだった。", "最初の一振りは、土の上を、滑った。焦げた根に、弾かれた。二振り目で、ようやく、刃が、土に食い込んだ。", "腕が、震えた。牢で、坂上の砦で、何度も震えた腕だった。", "「腰が高い」", "ミカヅチが、言った。", "「剣と同じに、構えるな。土は、斬るものではない。起こすものだ」", "タケルは、腰を落とした。三振り目。四振り目。", "黒い土が、少しだけ、ひっくり返った。下から、まだ焼けていない、茶色の土が、覗いた。", "魔王は、もう、何も言わなかった。ただ、しばらく、その土を見てから、背を向けて、歩き去った。", "日が傾くまで、タケルは、鍬を振り続けた。", "掘り起こせたのは、畳にして、二枚ほどの広さだった。焼けた大陸の、ほんの、ひと欠片だった。", "掌の皮が、剥けていた。血が、柄に、滲んでいた。", "ミカヅチが、隣に、腰を下ろした。鬼族の頭領は、懐から、握り飯を二つ出して、一つを、タケルに放った。", "「食え」", "タケルは、それを受け取った。土の上に、座った。", "「……ミカヅチ殿」", "「何だ」", "「ここで、何人が、死んだ」", "ミカヅチは、すぐには、答えなかった。", "「死んだ者は、おらん。王が、皆を逃がした。だが、この畑の持ち主は、まだ、帰っておらん。土蜘蛛の夫婦と、幼い息子だ。会談の日に、おまえたちの軍が来た。東の村から、西へ逃げたきり、行方が知れぬ。娘が一人、埴の里で、帰りを待っている」", "タケルは、握り飯を持ったまま、動けなかった。", "「名を、知りたいか」", "「……ああ」", "「なら、ハニヤスに聞け。あいつは、全部、覚えている。根の洲の、焼けた畑の、持ち主の名を、一つ残らず」", "ミカヅチは、握り飯にかぶりついた。", "「一日に一つ、覚えろ。畑を一枚起こすたびに、一つ。それで、ちょうどいい」", "タケルは、黙って、うなずいた。", "握り飯を、口に入れた。塩の味がした。喉が、また、詰まった。それでも、最後のひと粒まで、食べた。"]}, {"h": "四", "p": ["葛の里の井戸のそばに、子どもたちが、集まっていた。", "ヒエダは、井戸の縁に腰を下ろし、杖を膝に横たえた。脇腹の傷は、もう、痛まなかった。引きつる感じが、少し残っているだけだ。", "「爺さま、またあの話して」", "「前の王様の話？」", "「前の王様のころは、人間も、耳の尖った人も、同じ市場で、同じ値段で、買い物できたんでしょ」", "子どもたちが、口々に言った。耳の尖った子。尻尾のある子。小さな角のある子。人間の子も、混ざっていた。", "その中に、ハルがいた。", "ハルだけは、話をせがまなかった。井戸の縁に座って、街道の先を、眺めていた。", "ヒエダは、その小さな背中を、しばらく見ていた。", "「よかろう」", "ヒエダは、咳払いをした。", "「今日は、二つ、話してやろう。一つは、いつもの、前の王様の話。もう一つは、新しい話じゃ」", "「新しい話？」", "「ああ。わしも、つい最近、知った話じゃ」", "ヒエダは、目を細めた。鷹のような目が、遠くを見た。", "「昔、ある港町に、一人の冒険者がおった。継ぎの当たった外套に、使い古した短剣。誰も受けない、安い依頼ばかり、拾っておった」", "子どもたちが、静かになった。", "「その冒険者の隣に、もう一人、冒険者がおった。黒い外套の、背の高い男じゃ。釘も打てぬ、荷も運んだことのない、妙な男でな」", "「その人、弱いの？」", "「さあて」", "ヒエダは、口の端を上げた。", "「二人は、報酬を、半分ずつに分けた。危ない目も、半分ずつに分けた。そうやって、森へ行き、山へ行き、この里へも来た。この井戸の前にも、立った」", "子どもたちが、井戸を見た。", "「黒い外套の男はな、実は、とても、とても、強い男じゃった。けれど、その強さを、一度も、人を傷つけるためには、使わなかった。使ったのは、誰かが傷つかぬように、そっと、見えないところで支えるときだけじゃ」", "ヒエダは、自分の脇腹に、手を当てた。", "「この老骨も、一度、その男に、命を繋いでもろうた」", "ハルが、振り向いていた。", "「その人、今、どこにいるの」", "「大穴の向こうで、王様をしておる」", "子どもたちが、ざわめいた。", "「王様なのに、冒険者だったの？」", "「王様が、冒険者のふりをしておったのじゃ。人間のことを、知りたくてな」", "「変なの」", "「ああ。変な王様じゃ」", "ヒエダは、笑った。それから、ハルを見た。", "「ハル。おぬしの兄さんもな、きっと、帰ってくる。頭の中の声が、消えたのじゃ。ただ、帰り道を、思い出すのに、少し時がかかっておるだけじゃ」", "「……ほんと？」", "「この老骨の目は、まだ、節穴ではござらん」", "ハルは、黙って、うなずいた。それから、また、街道の先を、見た。", "ヒエダは、杖を握り直した。", "前の王の頃の話は、昔の話だ。子どもたちに、語り継いできた。いつか、また、ああいう時代が来るようにと。", "けれど、新しい話は、昔の話ではない。", "(これは、これから先の話じゃ)", "井戸の水面に、雲が、映っていた。"]}, {"h": "五", "p": ["黄泉津の宮の露台で、ベルは、一通の文を、読み返していた。", "人族議会からの文だった。差出人は、洗脳の解けた、老いた議員。王が倒れたあと、人間界で、最初に、魔界へ文を寄越した者だった。", "字は、震えていた。", "『私どもは、何をしたのか、まだ、すべては分かりません。分かるにつれて、恥ずかしさで、筆が止まります。それでも、書かねばならぬと思い、筆を取りました』", "ベルは、その一文を、何度も、読んだ。", "返事は、まだ、書いていなかった。何を書けばいいのか、分からなかった。詫びられることに、慣れていない。詫びることにも。", "「ベルイザナ様」", "背後で、杖の音がした。オモイカだった。", "「同盟の儀の場所が、決まりました。衢の里です。岐人の地なら、どちらの陣営にも、偏らないと」", "「そうか」", "「クナド殿が、立会人を、引き受けてくださいました」", "ベルは、文を、畳んだ。", "「オモイカ」", "「はい」", "「この者に、何と返せばよい」", "オモイカは、ベルの手の中の文を、見た。それから、少しだけ、微笑んだ。", "「お会いになってから、お決めになればよいかと。顔を見て」", "「顔を」", "「はい。……ベル様は、顔を見てから、お決めになる方ですから」", "ベルは、何も言わなかった。", "オモイカが、露台の手すりに、手を置いた。赤い空を、見上げた。", "「一つ、お願いがございます」", "「言え」", "「同盟の儀の、前の夜。宮の広間に、杯を、並べたいのです」", "オモイカの声が、わずかに、揺れた。", "「十四」", "ベルは、オモイカの横顔を見た。", "十四。会談の間で、オモイカと共に、王の書簡を受けに行った随員の数だった。誰一人、戻らなかった。", "オモイカは、あの日から、その名を、口にしていない。収穫祭の夜にも、言えなかった。喉が、固く閉じて、声にならない、と言った。", "「並べよ」", "ベルは、言った。", "「その夜、私も、行く」", "「……はい」", "オモイカは、深く、頭を下げた。それ以上は、何も、言わなかった。まだ、言えないのだ、とベルには分かった。", "それで、よかった。", "その夜まで、待てばよい。", "ベルは、もう一度、文を開いた。震える字を、指でなぞった。", "返事の、最初の一行だけは、決まった気がした。", "『お会いしたい』"]}, {"h": "六", "p": ["ナキメは、坂上の砦の一室で、筆を走らせていた。", "「名を」", "机の向こうに、人間の兵が、座っていた。若い兵だった。腰に、炉ヶ岳の紋を刻んだ剣を下げている。砦の広場で、最初に、武器を石畳に置いた兵だった。", "「……テツ、です」", "兵は、少し考えてから、言った。", "「たぶん、テツです。母は、そう、呼んでいました」", "ナキメは、その名を、紙に書いた。黒い羽の筆が、さらさらと、鳴った。", "「出身は」", "「炉ヶ岳の麓の、マガネという村です。鉱夫の家の、三男で」", "「なぜ、兵に」", "兵は、黙った。", "長い沈黙だった。ナキメは、急かさなかった。朧の術を使えば、この若者の頭の中を、覗くことはできる。けれど、使わなかった。記録とは、本人の口から聞くものだ。そう、決めていた。", "「分かりません」", "やがて、兵は、言った。", "「村に、役人が来て、触れを読み上げたんです。魔族が攻めてくる。若い者は、王都へ、と。それを聞いたら、行かなきゃ、と思った。頭の中で、誰かが、そう言っているみたいに」", "兵は、腰の剣に、手を置いた。", "「でも、この剣を持ってから、ときどき、考えが、澄むことがあって。そのたびに、おかしい、と思った。おかしいのに、何がおかしいのか、言葉にならなかった」", "ナキメは、筆を止めた。", "炉ヶ岳の剣。刃の芯に、術を弾く層が仕込まれている、と聞いていた。ドワーフの長が、黙って、一泡吹かせた仕事だと。", "(この若者は、その刃に、守られていた)", "「よく、話してくれました」", "ナキメは、言った。", "兵は、頭を下げて、出ていった。", "次の兵が、入ってきた。その次も。またその次も。", "ナキメは、一人ずつ、名を聞いた。出身を聞いた。何を覚えていて、何を覚えていないかを、聞いた。王の言霊が、どこから入り込み、どこに根を張り、どうやって、人を動かしていたのか。", "紙が、積み重なっていった。", "夜になって、ナキメは、筆を置いた。", "窓の外に、比良坂の光の筋が、見えた。", "(タケルが、牢を破った夜)", "あの夜のことを、ナキメは、まだ、ときどき、夢に見る。解呪のために、そっと伸ばした術の糸。それが、王の合図になった。自分の手が、扉を、開けてしまった。", "ベルは、責めるな、と言った。", "責められなかったことが、かえって、重かった。", "だから、記録を、取っている。王の言霊が、どう人を蝕んだか。一人ずつの名と、声で、残しておく。二度と、同じことが、起きないように。", "それが、自分の、償いだった。", "ナキメは、積み上げた紙の、いちばん上を、見た。", "『テツ。マガネの鉱夫の三男。剣を持つと、考えが澄んだ』", "鴉族の長は、その一行を、指で、そっと、なぞった。"]}, {"h": "七", "p": ["ひと月が過ぎたころ、オオナムチは、一人で、ミナモへ向かった。", "理由は、自分でも、うまく言えなかった。ただ、一度、あの港へ戻りたかった。何もかもが、始まった場所へ。", "ギルドの扉を、押した。", "朝の混み合う時刻だった。冒険者たちの列。依頼書の紙のこすれる音。天井に響く、ざわめき。何も、変わっていないように見えた。", "掲示板の前に、立った。", "隅の、あの紙が、なかった。", "『魔族は話の通じぬ者たちである。正義は我らにあり』", "剥がされた跡だけが、四角く、白く、残っていた。誰が剥がしたのかは、分からない。その白い跡の上に、新しい紙が、一枚、貼られていた。", "『大穴の向こうへの交易、荷運びの募集。種族は問わず』", "オオナムチは、その紙を、長いこと、見ていた。", "「次の方」", "受付の声が、した。", "振り向くと、木の長い台の向こうに、あの受付の女が、座っていた。顔も上げずに、書類に筆を走らせている。", "オオナムチは、列に並んだ。前の男が、依頼を受けて、去っていった。", "台の前に、立った。", "女が、顔を上げた。", "一瞬、女の手が、止まった。", "「……オオナムチさん」", "名を、呼ばれた。", "オオナムチは、目を瞬いた。この人に、名を呼ばれたのは、初めてだった。登録の日も、ひなた野の依頼の日も、この人は、顔も上げずに、判を押していた。", "「あの、ひなた野の依頼を、受けた子でしょう」", "女は、少し、ばつが悪そうに、目を伏せた。", "「変わった子ね、なんて、言ったわね。……あのとき」", "「いえ」", "「噂、聞いたわ。坂上の砦の」", "女は、それ以上、言わなかった。代わりに、引き出しから、一枚の札を取り出した。銅色の、いちばん下の等級の札。オオナムチが、最初の日に受け取ったものと、同じ形だった。", "「これ、あの黒い外套の人の。登録の控え。ずっと、書類の束に、挟まってたの」", "札には、名前が、書かれていた。", "『ベル』", "「不思議なのよ。この人の顔、どうしても、思い出せなかった。何度、札を見ても。でも、この前、急に、思い出したの。灰色の目の、背の高い人だった」", "女は、札を、オオナムチに差し出した。", "「渡してくれる？　あの人に」", "オオナムチは、札を、両手で受け取った。", "「渡します」", "「それと」", "女は、少し、ためらった。", "「葛の里への届け物。ひなた野から移った人たちへの。あのあと、誰も受けないの。今でも。……あなたが、また、受けてくれると、助かるわ」", "オオナムチは、笑った。うまく笑えた気がした。", "「受けます」", "「変わった子ね」", "女が、言った。今度は、少しだけ、笑っていた。", "港へ出ると、網干し場の杭の間で、誰かが、誰かの名を、呼んでいた。"]}, {"h": "八", "p": ["三か月目の朝は、よく晴れていた。", "オオナムチは、埴の里の段々田で、草を抜いていた。", "ハニヤスの隣で、毎朝、そうしてきた。言われたわけではない。ただ、目が覚めると、畑へ来ていた。土に手を入れていると、少しだけ、震えを忘れられた。", "ハニヤスは、何も言わなかった。黙って、隣で、草を抜いていた。ときどき、「それは、草ではない」とだけ言って、オオナムチの抜きかけた芽を、土に戻した。", "その朝も、同じだった。", "畦の際に、小さな芽が、一本だけ、残っていた。オオナムチは、それを、踏まないように、静かに、一歩、横へ足を出した。", "ふと、気づいた。", "手が、止まっていなかった。", "震えていなかった。", "オオナムチは、土に汚れた両手を、目の前に、かざした。", "指先も、手首も、静かだった。朝の光の中で、ただ、そこにあった。", "継ぎの当たった外套の袖から、土に汚れた手首が覗いている。左腕には、野犬の牙の痕。ミナモを出た最初の日に、ついた傷だった。その上に、この三か月で、鍬の豆と、草で切った細い傷が、いくつも増えていた。", "どれも、同じ手だった。王の喉を断った手も、タケルの手を取った手も、ハルに手紙を届けた手も。", "いつから、止まっていたのだろう。分からなかった。昨日か、一昨日か。気づかないうちに、止まっていた。", "あの感触は、消えていなかった。重く、短く、静かな手応え。目を閉じれば、まだ、思い出せる。たぶん、一生、忘れない。", "けれど、手は、もう、震えていなかった。", "(半分は、あの人が、持ってくれている)", "オオナムチは、掌を、ゆっくりと、握った。それから、開いた。", "「ハニヤスさん」", "「何だ」", "「俺、今日、葛の里へ行ってきます」", "ハニヤスは、草を抜く手を、止めなかった。", "「ユウという男が、帰ってくると、言っていたな」", "「はい。たぶん、今日か、明日か」", "本当は、分からなかった。ユウからは、何の知らせもない。ただ、昨夜、ヒエダからの言伝が、届いた。街道の丘で、栗色の髪の若者が、何日も、行ったり来たりしているらしい、と。", "ハニヤスは、ようやく、顔を上げた。", "「行け」", "短く、言った。", "「土は、待つ。人も、待つ。だが、待っている者のところへ、行くのは、また、別のことだ」", "オオナムチは、うなずいた。", "立ち上がって、畦を歩いた。段々田の向こうに、比良坂の大穴が、見えた。底から、細い光の筋が、立ちのぼっている。", "あの底には、まだ、行っていない場所がある。", "院の地下で、四つの紋は灯った。けれど、真ん中の、五つ目の窪みだけは、冷たいままだった。手を当てても、石の感触しか、返ってこなかった。", "(いつか)", "オオナムチは、光の筋を、しばらく見つめた。", "それから、背を向けた。今日は、葛の里へ行く日だった。", "懐の奥で、ギルドの受付で受け取った札が、かさりと鳴った。ベルに渡すのを、まだ、忘れていた。", "今夜、渡そう、と思った。", "あの人は、きっと、少しだけ困った顔をして、それから、受け取るだろう。", "「よく言われる」と、言うかもしれない。", "オオナムチは、少し笑って、坂を下りていった。"]}]}]}, {"name": "番外編", "note": "エピローグのあとの物語（順番に読むのをおすすめします）", "items": [{"id": "bangai1", "label": "番外編一", "title": "五つ目の窪み", "chars": 9517, "sections": [{"h": "一", "p": ["比良坂の縁は、夜明け前が、いちばん静かだった。", "クナドは、大穴を見下ろす岩の上に、立っていた。", "底は、暗い。世界の中心に穿たれた、深い傷。昔から、ただ、暗かった。けれど、同盟の儀の朝から、その底で、ときどき、何かが、瞬くようになった。", "足音がした。", "正確には、足音を立てようとして、立てきれない足音だった。人の青年は、岐人の足音のなさに、まだ慣れていない。慣れていないくせに、自分も静かに歩こうとする。そういうところが、クナドは、嫌いではなかった。", "「おはようございます、クナドさん」", "「お早いことで」", "オオナムチは、クナドの隣に立った。継ぎの当たった外套は、三か月前と同じものだった。左腕の牙の痕も、そのままだ。", "違うのは、目だった。", "王を斬った朝から、この青年の目の奥には、細い影が、住みついている。それでも、目は、前を見ていた。影ごと、前を見ていた。", "「この前、言ったことです」", "「五つ目の窪み、でございますね」", "「はい」", "オオナムチは、大穴の底を、見つめた。", "「あの院の地下で、四つは、灯りました。でも、真ん中だけは、冷たいままだった。手を当てても、石の感触しか、返ってこなかった」", "「存じております」", "「行きたいんです。あそこへ」", "クナドは、しばらく、黙っていた。", "岐人は、境の番人だ。大穴の底に何があるか、クナドは、知っている。知っているが、語ったことは、一度もない。語ってはならないのではない。語っても、意味がないのだ。", "あの扉は、語られた者には、開かない。", "「四つの柱の声を」", "クナドは、言った。", "「もっと、深く、お聞きになってから」", "「四つの柱」", "「守り。攻め。再生。知。院の地下で、オオナムチ様は、四柱を呼ばれました。けれど、あれは、呼んだだけでございます。声を、聞いたわけではない」", "オオナムチは、少し考えて、うなずいた。", "「聞くには、どうしたら」", "「師が、おりましょう」", "クナドは、黄泉の方角を、見た。赤い空の下に、段々田の稜線が、うっすらと浮かんでいる。", "「四つの柱の声を、それぞれ、体で覚えておられる方々が」", "それから、もう一つだけ、付け足した。", "「それと、私の前に、ここに立っていた番人のことを、少し」", "「前の、番人」", "「私が、この役を継いだとき、前の番人は、もう、境を降りておられました。教わったのは、私が、まだ幼い頃です。けれど、名は、残っておりません。誰も、覚えていない。私ですら」", "クナドの声は、いつもと同じく、平らだった。", "「境の番人は、名を、境に置いてくるものだと、教わりました。ですが、置いてきた名が、どこへ行くのかは、誰も、教えてくれなかった」", "オオナムチは、何も言わなかった。", "ただ、大穴の底の光を、長く、見つめていた。"]}, {"h": "二", "p": ["最初の師は、ハニヤスだった。", "「守りの声か」", "埴の里の畑で、ハニヤスは、鍬を肩に担いだまま、オオナムチを見下ろした。背の甲殻が、朝日に鈍く光っている。", "「そんなものは、教えられん」", "「……はい」", "「立て。そこに」", "畦の上を、顎で示した。オオナムチは、言われたとおりに立った。", "ハニヤスが、鍬を、地面に突き立てた。", "土が、揺れた。", "足の下から、波のような振動が、駆け上がってきた。オオナムチは、とっさに堅めを張った。膜が、軋む。膝が、折れそうになる。", "「膜で、受けるな」", "ハニヤスの声は、低かった。", "「土は、膜を張らん。ただ、そこにある。雨が来ても、根が張っても、踏まれても、そこにある」", "二度目の揺れが来た。オオナムチは、膜を、薄くした。厚さを、半分に。ミナモの宿の裏庭で、ベルに教わったやり方だった。", "それから、もう半分。", "膜が、ほとんど、なくなった。代わりに、足の裏が、土に、沈んでいく気がした。揺れは、来た。来たけれど、体を通り抜けて、また、土へ戻っていった。", "三度目。四度目。", "オオナムチは、畦の上に、立っていた。", "ハニヤスが、鍬を、引き抜いた。", "「土は黙っているが、忘れはせん」", "それだけ言って、背を向けた。畑の向こうで、腰の曲がった老人が、黙々と、草を抜いていた。角も、翼も、ない。人と同じ姿の、痩せた老人だった。ハニヤスは、その老人に、何か短く声をかけ、隣にしゃがみ込んだ。", "オオナムチは、その老人の顔を、見た。", "薄かった。", "イサナと、同じだった。港の桟橋で、霧の向こうに立っていた老人と。輪郭が、朝の光の中に、溶けかけている。", "「ハニヤスさん。あの方は」", "「爺か」", "ハニヤスは、草を抜く手を止めずに、答えた。", "「いつから、ここにおるのか、俺も知らん。俺が子どもの頃には、もう、この畑で、草を抜いていた。名を聞いても、首を振る。だから、爺と呼んでいる」", "「名前が、ないんですか」", "「あったのだろう。忘れたのだ」", "ハニヤスは、老人の背中を、ちらりと見た。", "「土は忘れんが、人は忘れる」", "角ヶ原では、ミカヅチが、待っていた。", "「攻めの声だと」", "鬼族の頭領は、腕を組んで、にやりと笑った。", "「おまえに、攻めは、似合わん」", "「分かってます」", "「分かっているなら、なぜ来た」", "「攻めの声を知らないと、守りの声も、本当には、分からない気がして」", "ミカヅチの笑みが、少し、変わった。", "「……ふん」", "それから、拳を、構えた。", "「鬼族は、立ち上がる者には、何度でも付き合う」", "その日、オオナムチは、十七回、倒れた。十七回、立った。十八回目に、ミカヅチの拳を、正面から受け止めた。腕が、痺れて、上がらなくなった。", "「攻めとはな」", "ミカヅチは、拳を下ろした。", "「相手を倒すことではない。相手の前に、一歩、出ることだ。おまえは、今、一歩出た」", "再生の声は、ナキメに教わった。黄泉津の宮の奥、イザナギの聖域。水鏡の前に座って、ナキメは、静かに言った。", "「焦らないことです」", "水面に、いくつもの名が、映っては、消えていった。", "「あなたが誰かを失いかけた時、本当の名呼びは、その時、生まれます。けれど、それは、もう、あなたの中にある。あとは、それを、水のように、流すだけ」", "それから、ナキメは、裏の修行と称して、問いを三つ出した。", "「鬼は、何に弱い？」", "「鴉です」", "「嵐狼は」", "「鬼」", "「土蜘蛛は」", "「嵐狼です」", "ナキメは、涼しげな目を、少しだけ細めた。", "「相性は、傾向にすぎません。個人と状況で、覆る。肝心なのは、目の前の相手を、よく見ること」", "最後の師は、ベルだった。", "宮の露台で、夜の特訓をした。オモイカが、杖をついて、見届けた。ベルは、魔王の姿のまま、角も翼も、隠さなかった。", "「知の声とは、何だと思う」", "「……分かりません」", "「それでよい」", "ベルは、夜空を見上げた。", "「知るとは、分からぬことを、分からぬと知ることだ。そこから、見る。聞く。確かめる」", "ベルは、少しだけ、口の端を上げた。", "「おまえは、最初から、それができていた」", "それから、ベルは、拳を構えた。", "特訓は、夜更けまで続いた。ベルは、言霊を一つも唱えなかった。ただ、動いた。右から来ると見せて、左。左から来ると見せて、また、左。オオナムチは、何度も、見誤った。", "「なぜ、見誤った」", "「右から、来ると思ったから」", "「なぜ、そう思った」", "「……さっきも、右だったから」", "「そうだ」", "ベルは、手を止めた。", "「人は、見たいものを見る。さっきもそうだったから、今度もそうだろうと。王の言霊は、そこへ根を張った。念のため、という言葉も、同じだ」", "オオナムチは、黙って、うなずいた。", "「知るとは、さっきを、いったん、置くことだ。今、目の前にいる者を、初めて見るように、見る」", "「初めて見るように」", "「おまえが、ミナモの受付で、私を見たように」", "ベルは、それだけ言って、また、構えた。オオナムチは、少しだけ、笑ってしまった。笑いながら、今度は、ベルの肩の動きを、初めて見るように、見た。", "左だった。", "特訓が終わるころ、オモイカが、小さく言った。", "「半分ずつ、でございますね」", "ベルは、振り向かずに、答えた。", "「半分ずつだ」"]}, {"h": "三", "p": ["ツクヨミの社は、嵐ヶ峰の北の、深い谷の底にあった。", "スサノが、入口まで案内してくれた。牙を覗かせて、唸るように言った。", "「中は、暗い。月の神の社だ。月が出ていなければ、何も見えん」", "「月は、出てますか」", "「出ていない」", "スサノは、それきり、黙った。嵐狼の長は、嘘を言わない。そして、余計なことも言わない。", "社の中は、本当に、暗かった。", "オオナムチは、指先に、火種を灯した。小さな炎が、足元だけを、照らした。柱が、何本も立っている。柱の根元に、燭台が、一つずつ、置かれていた。", "火を、移していった。", "柱の燭台が、一つ、また一つと灯るたびに、社の奥が、少しずつ、浮かび上がってきた。", "奥に、灯籠が三つ、並んでいた。西と、真ん中と、東。", "その前の石に、文字が、刻まれていた。", "『月を迎えに行く者は、月の来た道を、さかのぼれ』", "オオナムチは、しばらく、石の前に、立っていた。", "月は、東から昇り、西へ沈む。月の来た道を、さかのぼるなら。", "(沈んだところから、昇ったところへ)", "西の灯籠に、火を入れた。次に、真ん中。最後に、東。", "三つの灯籠が、灯った。", "その瞬間、社の奥の壁が、揺らいだ。", "いや、揺らいだように見えた。オオナムチは、目を凝らした。壁の石の目が、一か所だけ、他と、わずかに、ずれている。", "「――見破り」", "壁が、ほどけた。", "偽りの壁の向こうに、小さな祭壇があった。石の面に、細い月の印が、刻まれていた。", "手をかざすと、言葉が、胸に、降りてきた。", "声ではなかった。言葉でもなかった。ただ、静かな、夜の水のようなものが、胸の底に、満ちていった。", "(見えないものを、見る)", "院の地下で、四つ目の紋に三日月が灯ったとき、オオナムチの声は、かすれていた。旅の中で、見破りに触れたのは、ほんの数度だった。", "今は、違った。", "三日月の声が、はっきりと、聞こえた。", "社の外に出ると、谷の上に、細い月が、昇っていた。", "スサノが、岩の上で、待っていた。", "「出ていたな」", "「出てましたね」", "スサノは、また、黙った。それから、ふん、と鼻を鳴らした。嵐狼の長が、笑ったのだと、オオナムチには、分かった。"]}, {"h": "四", "p": ["クナドは、何も言わずに、オオナムチを、大穴の底へ導いた。", "光の筋に沿って、どこまでも降りていく。岩の階段が、途中から、階段ではなくなった。足の下に、何もない。ただ、光が、足を支えていた。", "最深部は、広い洞だった。", "洞の奥に、扉が、一枚、立っていた。", "石の扉だった。取っ手も、鍵穴もない。表面に、五つの窪みが、並んでいた。四つには、紋が刻まれている。山の稜線、渦を巻く線、炎の尖り、三日月。", "中央の、いちばん大きな窪みだけが、平らだった。", "院の地下と、同じだった。", "オオナムチは、扉の前で、足を止めた。", "手が、少し、震えていた。院の地下で、冷たい石に手を当てたときの感触が、まだ、掌に残っている。応えのなかった、あの静けさ。", "「怖いですか」", "クナドが、尋ねた。", "「……少し」", "「それで、よろしいかと」", "クナドは、扉から、一歩下がった。", "「この扉の前で、怖くない、とおっしゃった方は、みな、帰って来られませんでした。名を、扉に、置いていかれた」", "オオナムチは、振り向いた。クナドの夜の色の目は、静かだった。脅しているのではない。ただ、知っていることを、言っているだけだった。", "「行ってまいります」", "「お待ちしております」", "オオナムチは、扉の前に、立った。", "声が、降ってきた。", "どこからでもなく、骨の内側で、静かに響く声だった。王が名を剥いだときと、同じ場所で、響いていた。けれど、まるで違う声だった。冷たくもなく、温かくもない。ただ、澄んでいた。", "『森』", "声が、言った。", "『欲しい言葉を、ちょうどいい順番でくれる者がいる。どうする』", "オオナムチは、目を閉じた。", "聖の森の、広間を、思い出した。ミナトの声。柔らかく、優しく、欲しい言葉を、欲しい順番でくれた声。頷きそうになった自分。その隣で、コノハが、言った。言葉が、上手すぎるわ、と。", "「自分の考えを、たどり直します」", "オオナムチは、答えた。", "「頷く前に。その人が、どこから来て、何を見てきたのか。自分で、確かめます」", "『鍛冶』", "声が、続けた。", "『人を染める刃を打てと命じられた。断れば、里が飢える』", "炉ヶ岳の、夜の炉の前を、思い出した。イシコリドメの、鉄色の掌。黙って、一泡吹かせる。誰にも見られない品でも、仕事は仕事だ。", "「頼まれた品質で、打ちます。そして、芯で、術を跳ね返す」", "『差別』", "『見た目が似ているから、念のため距離を置こう、と言われた』", "白い都の、昼の広場。念のため。念のため。念のため。善意の顔をした言葉が、輪になって、広がっていった。", "それから、港の宿の、閉まった戸。困ったように、眉を寄せた主人。", "「その人の顔を、自分の目で、見ます」", "『洗脳』", "『操られた友が、槍を向けてくる』", "葛の里の、夜の井戸。白い腕章。ユウの、焦点の合わない目。それでも、オオナムチは、井戸の水の話をした。夏の、冷たい水の話を。", "「名と、思い出を、呼びます」", "『正体』", "『隣を歩いてきた者が、魔王だった』", "声が、そう言ったとき、オオナムチは、少しだけ、笑ってしまった。", "やすらぎの院の、門前。王の声が、王都じゅうに、響いた。ベルイザナ。黒い角。黒い翼。民が、石を投げた。", "その向こうで、オオナムチは、見ていた。最初の日から、くっきりと見えていた、同じ顔を。", "「見てきた顔を、信じます」", "『共生』", "最後の問いだった。", "『憎み合った二つの国が、同じ卓に着く』", "衢の里の、白い円卓を、思い出した。ベルが、人族の老議員に、頭を下げた朝。", "その前の夜のことは、ベルから聞いた。宮の広間に、十四の杯を並べて、オモイカが、名を語った夜。ササラ。フミト。ツバメ。それから、十一人。", "「先に、頭を下げます。そして、失われた名を、覚えます」", "声は、それきり、黙った。", "洞の中に、静けさが、満ちた。", "オオナムチは、目を開けた。", "扉の、四つの紋が、淡く、光っていた。山の色。火の色。生の色。月の色。四つの光が、ゆっくりと、巡り始めた。", "光は、扉の上を、渦のように回り、やがて、中央の、平らな窪みに、集まっていった。"]}, {"h": "五", "p": ["窪みに、光が、灯った。", "白でも、金でもなかった。どの色とも、言えなかった。ただ、すべての色が、そこで、一つになっていた。", "(アメノミナカヌシ)", "紋の形は、見えなかった。形が、なかった。平らな窪みは、平らなまま、光っていた。", "ああ、そうか、と、オオナムチは思った。", "この窪みは、最初から、空っぽだったのではない。何かを刻むための場所ではなかったのだ。四つの柱の声が、一つの体の中で出会ったとき、その出会いそのものが、この窪みを、満たす。", "だから、誰も、応えを得られなかった。四柱を呼ぶだけでは、足りなかった。", "胸の奥に、静かな光が、宿った。", "扉が、音もなく、開いた。", "扉の向こうは、小さな部屋だった。壁一面に、文字が、刻まれていた。", "名前だった。", "古い字。新しい字。人の字。魔族の字。岐人の、見たことのない字。数えきれないほどの名が、壁を、埋め尽くしていた。", "「歴代の、番人の名でございます」", "いつの間にか、クナドが、背後に立っていた。夜の色の目が、壁を、見つめていた。", "「私も、初めて見ました」", "クナドの声が、わずかに、揺れていた。この岐人の声が揺れるのを、オオナムチは、初めて聞いた。", "壁の、いちばん新しい列の、端に、ひとつだけ、削られた跡があった。", "漆喰で塗り潰されてはいなかった。ただ、長い年月に、すり減っていた。誰にも、呼ばれなかった名だった。", "オオナムチは、その跡に、手を当てた。", "指先に、凹凸が、かすかに残っていた。目を閉じて、なぞった。一画。また一画。", "院の地下で、入所者たちが、紋の光に呼ばれて、降りてきた夜を、思い出した。名は、削られても、どこかに、残っている。呼ばれるのを、待っている。", "「……ウ、ツ、ホ」", "声に出した。", "「ウツホ」", "壁が、ぼう、と光った。", "すり減った跡に、文字が、戻っていった。一画ずつ。ゆっくりと。", "ウツホ。", "クナドが、息を呑んだ。", "「……ウツホ様」", "その名を、クナドは、確かめるように、もう一度、口にした。", "「思い出しました。私に、足音を消す歩き方を教えてくださった方だ。番人の役を降りて、黄泉の畑へ、身を寄せられた。岐人の里を離れた方の名を、それきり、誰も、呼ばなかった」", "オオナムチは、壁の名を、見上げた。", "ミナモの港で、初めて名を呼んだ朝を、思い出した。桟橋の上の老人。わしは、イサナじゃった、と言ったときの、目尻の皺。", "あのときは、ただ、呼んだだけだった。何が起きているのかも、分からなかった。", "今は、少しだけ、分かる。名は、呼ばれるのを、待っている。どれだけすり減っても、どこかで、ずっと、待っている。", "そして、呼ぶ者がいれば、戻ってくる。", "同じころ、埴の里の畑で、腰の曲がった老人が、草を抜く手を、止めていた。", "隣で、ハニヤスが、顔を上げた。", "老人は、自分の両手を、見下ろしていた。土に汚れた、皺だらけの手を。", "「……わしは」", "かすれた声だった。", "「わしは、ウツホじゃった」", "ハニヤスは、何も言わなかった。ただ、鍬を置いて、老人の隣に、座り直した。", "「そうか」", "それから、ずいぶん経ってから、もう一言だけ、付け足した。", "「ウツホ。茶にするか」", "老人は、泣いていた。土の上に、ぽたぽたと、涙が落ちていった。"]}, {"h": "六", "p": ["タカマの丘の社守は、朝が早い。", "羊飼いたちが起き出すより先に、社の前を掃き、空を仰ぐ。王都の役人に紋を削られてからも、それだけは、欠かさなかった。", "社の壁には、五つの窪みがある。", "四つまでは、村の者たちと、少しずつ、彫り直してきた。王が倒れて、触れが取り消されてから、三か月。山の稜線。渦。炎。三日月。年寄りたちの記憶を寄せ集め、子どもの落書きのような下絵を、何度も直して、ようやく、形になった。", "五つ目だけは、誰も、覚えていなかった。", "もともと、何も刻まれていなかったのだ、と言う者もいた。いや、確かに何かあった、と言う者もいた。社守自身にも、分からなかった。", "その朝、社守は、箒を持ったまま、立ち尽くした。", "五つ目の窪みに、光が、差していた。", "窓から入る朝日ではなかった。光は、窪みの、内側から、滲み出していた。白でも金でもない、どの色とも言えない光。", "社守は、箒を、取り落とした。", "光は、窪みの中で、ゆっくりと、形を描いていた。いや、形ではなかった。形がないことの、形だった。四つの紋の光が、そこへ流れ込み、一つに溶け合っていく。その、溶け合う線の、流れ。", "社守は、震える手で、鑿を取った。", "光の流れを、なぞった。一画。また一画。", "どれほど時が経ったか、分からなかった。気づくと、日は高く、背後に、羊飼いや子どもたちが、集まっていた。", "「爺さま、それ、何？」", "耳の尖った子が、尋ねた。", "社守は、鑿を置いた。五つ目の窪みに、浅い線が、彫られていた。四つの紋から、一本ずつ、線が伸びて、真ん中で、輪になっている。", "「さあな」", "社守は、笑った。", "「長生きは、するものだ」", "ふと、思い出した。王の頃の、ある日。王都で祝賀の触れが出ていた、その前の日だった。継ぎの当たった外套の若い男が、一人で、この丘を上ってきた。削られた紋の前で、長いこと、手を合わせていた。", "巡回の兵が来たとき、男は、何か短い言葉を唱えた。兵の槍が、下がった。兵は、自分の名を、小さく呟いて、去っていった。", "あの若者は、今、どうしているだろう。王が倒れたあと、魔王と並んで立つ人間の若者の噂を、羊飼いたちが、麓から持ち帰ってきた。継ぎの当たった外套を着ている、と聞いた。社守は、そのとき、少しだけ、笑った。", "社守は、空を仰いだ。", "空は、ちゃんと、見ておられる。昔から、そう教わってきた。"]}, {"h": "七", "p": ["黄泉津の宮の演武場は、夜が更けると、篝火だけになる。", "ベルは、その真ん中に、立っていた。", "魔王の姿だった。黒い角。畳んだ黒い翼。灰色の目の奥に、冷たい紅が、灯っていた。", "周りには、四天王が、並んでいた。ミカヅチは、腕を組んで。スサノは、岩に腰かけて。ナキメは、翼を畳んで。ハニヤスは、鍬を、地面に突き立てて。", "オモイカが、杖をついて、見届け人の場所に、立っていた。", "その隣に、クナドがいた。", "篝火の外側には、もっと大勢がいた。いつの間に、話が広まったのか。埴の里の民。角ヶ原の若い鬼たち。寄り添いの里の、耳の聞こえない嵐狼の子が、最前列で、手を握りしめていた。その隣に、腰の曲がった老人が、杖をついて、立っていた。ウツホだった。", "人間の客も、いた。", "コノハが、腕を組んで、柱にもたれていた。目が合うと、ふい、とそっぽを向いた。", "「別に、見に来たわけじゃないけど」", "誰も、何も聞いていなかった。スクナが、その隣で、にやにやしていた。", "「魔王様の本気など、そうそう見られるものではないからのう」", "ミカヅチが、低く、笑った。", "「本気、か。……俺が受けきったと思っていたあれより、上だぞ」", "スサノが、唸った。", "「保留だ。見てから、決める」", "オオナムチは、ベルの前に、立った。", "「手は、抜かぬ」", "ベルが、言った。", "「それが、おまえへの、礼だ」", "「はい」", "オオナムチは、うなずいた。", "「抜かないでください」", "ベルが、動いた。", "篝火が、一斉に、揺れた。", "速かった。坂上の砦で見た、どの一撃よりも、速かった。オオナムチは、見ていなかった。見る前に、体が、動いていた。", "膜を張った。厚くはない。半分。そのまた半分。土のように、ただ、そこにある膜。", "衝撃が、体を、通り抜けた。足の裏から、地面へ。", "二撃目。三撃目。", "オオナムチは、倒れた。立った。ミカヅチに教わったとおりに、一歩、前に出た。", "ベルの拳が、目の前に、来た。", "その拳を、オオナムチは、見た。", "よく見た。スサノに、ナキメに、教わったとおりに。拳の形。指の折り方。爪が、掌に、食い込んでいる。タケルとの決戦の前の夜、畦の上で、血を流していた拳と、同じ形だった。", "(この人は、ずっと、こうやって、拳を握ってきた)", "守るために。止めるために。見ているだけのために。", "オオナムチは、その拳を、両手で、包んだ。", "受け止めたのではない。包んだ。名を呼ぶときと、同じように。大きな声ではなく、掌で、そっと。", "篝火が、静まった。", "ベルの拳が、止まっていた。", "どれくらい、そうしていたか、分からない。演武場は、静まり返っていた。誰も、動かなかった。四天王も、オモイカも、クナドも。", "やがて、ベルの拳から、力が、抜けていった。", "「……よくやった」", "ベルの声は、低かった。", "「おまえは、退かなかった。一歩も」", "オオナムチは、包んでいた手を、離した。足から、力が抜けて、その場に、座り込んだ。", "ベルが、膝を折った。オオナムチと、同じ高さになった。", "灰色の目が、まっすぐ、こちらを見ていた。紅は、もう、消えていた。", "「おまえの、まことの名を、呼ぶ」", "ベルが、言った。", "オオナムチの、背筋が、一瞬だけ、凍りついた。", "同じ言葉だった。坂上の砦で、王が言った言葉と。名を、骨の内側から、剥がしていった言葉と。", "けれど、ベルの声は、違った。", "「オオナムチ」", "名が、呼ばれた。", "骨の内側で、響いた。", "剥がれていくのではなかった。満ちていった。指先から、足の裏から、胸の奥まで。自分の輪郭が、内側から、温かく、満たされていく。", "王に剥がされかけた名の、最後の薄い隙間に、何かが、静かに、流れ込んでいった。", "「……はい」", "声が、出た。", "「ここに、います」", "ベルは、少しだけ、口の端を上げた。", "「知っている」", "それから、手を差し出した。オオナムチは、その手を、握った。", "最初の日と、同じだった。少し冷たくて、力は、驚くほど、加減されていた。", "けれど、今は、加減しているのが、分かった。分かって、それで、よかった。", "「半分ずつ、ですね」", "「ああ」", "ベルは、オオナムチを、引き起こした。", "「半分ずつだ」", "演武場の外で、赤い空が、白み始めていた。遠く、比良坂の大穴の底で、五つの光が、静かに、巡っていた。"]}]}, {"id": "bangai2", "label": "番外編二", "title": "旗を降ろさぬ者たち", "chars": 9465, "sections": [{"h": "一", "p": ["根の洲の土に、ようやく、緑が混じり始めていた。", "タケルは、鍬を止めて、畦の端にしゃがんだ。焦げた根の隙間から、細い草が、一本だけ伸びている。誰が植えたものでもない。風が運んだ種だろう。", "指で、触れかけて、やめた。", "(踏まないように)", "ミカヅチに、何度も言われた。土蜘蛛の畑では、芽をよけて歩くのが、決まりだと。魔王でさえ、そうしているのだと。", "「手が止まっているぞ」", "背後から、いつもの声が飛んだ。", "「芽が、出ていた」", "「芽が出たくらいで、鍬を止める奴があるか」", "ミカヅチは、腕を組んだまま、鼻を鳴らした。けれど、その足は、草をよけて、一歩、横へずれていた。", "タケルは、鍬を握り直した。", "懐の内側で、紙が、かさりと鳴った。焼け残った手紙だ。『ミサキへ』。あれから、ひと月が過ぎた。人間界の村々に、問い合わせの文を出した。まだ、返事は一通も来ない。", "「タケル殿」", "畦の向こうから、声がした。", "振り向くと、見覚えのある男が、立っていた。中年の、地味な顔の男だった。濃紺の、記録官の制服を着ている。手には、紐で綴じた紙の束を抱えていた。", "「コトシロ殿」", "「お仕事中に、失礼します」", "コトシロは、丁寧に頭を下げた。それから、紙の束を、タケルに差し出した。", "「軍務局から持ち出した写しを、この四か月、整理しておりました。移送の記録、兵の配置、それから、中継の石の場所」", "「中継の」", "「王都の地下の神殿にあったものと、同じ造りの石です。人間界に、七つありました。六つは、王が亡くなった日に、光を失っています」", "コトシロは、紙の一枚を、指で示した。", "「七つ目だけが、まだ、確かめられておりません。北の古い砦です」", "タケルの手が、止まった。", "「北の、砦」", "「ご存じですか」", "「……ああ」", "喉が、乾いた。", "「あそこの守将は、ヤツカ様だ。俺に、剣を教えてくださった方だ」", "コトシロは、静かに、目を伏せた。", "「その砦の兵が、まだ、戻っていないのです。王が亡くなって四か月、旗を掲げたまま、門を閉ざしている。議会の使いが二度、出向きましたが、二度とも、矢で追い返されました」", "ミカヅチが、組んでいた腕を、ほどいた。", "「矢、だと」", "「死者は出ておりません。威嚇の矢でした。ただ、使いの者が、門の上から聞こえた言葉を、書き留めております」", "コトシロは、最後の紙を、読み上げた。", "「『旗を降ろすな。境を守れ。魔族は話の通じぬ者たちである』」", "根の洲に、風が吹いた。", "タケルは、その言葉を、知っていた。牢の中で、自分が、何度も繰り返した言葉だった。"]}, {"h": "二", "p": ["黄泉津の宮の露台には、昼でも、赤い光が満ちていた。", "オオナムチは、柱の陰に立って、卓を囲む人々を見ていた。ベル、オモイカ、コトシロ、タケル。ミカヅチは、腕を組んで、壁際にいる。", "「王が死んで、洗脳は、解けたはずです」", "オモイカが、卓に広げた写しを、杖の先で押さえた。", "「けれど、石だけが、残った。王が、この砦に最後に流した命令を、こだまのように、繰り返しているのでしょう。王の喉は、もう、何も紡がない。ですから、新しい言葉は、届かない。同じ言葉だけが、四か月、ずっと」", "「それを聞かされ続けた兵は」", "ベルが、低く言った。", "「はい。解けるきっかけが、ありません」", "ベルは、黙った。外套の脇で、拳が、ゆっくりと握られていくのが見えた。", "「私が行く」", "「なりません」", "オモイカの声は、静かで、揺れなかった。", "「ベル様が、魔王の姿で、砦の前に立てば、どうなりますか。門の上の兵は、何を見ますか」", "「……王の言葉が、本当になる」", "「そのとおりです。魔族は話の通じぬ者。旗を降ろすな。境を守れ。兵たちは、頭の中の声が正しかったと、確かめるだけです」", "ベルの拳が、白くなった。", "オオナムチは、柱の陰から、一歩、出た。", "「俺が、行きます」", "皆が、こちらを向いた。", "「俺は、人間です。冒険者です。門の前に立っても、たぶん、矢は飛んでこない。飛んできても、堅めがあります」", "「オオナムチ」", "ベルが、こちらを見た。灰色の目が、ほんの少し、揺れていた。", "「おまえに、また、背負わせることになる」", "「半分ずつ、ですよね」", "オオナムチは、笑った。", "「ベルさんは、ここで、待っていてください。見ていてください。それで、半分です」", "ベルは、何も言わなかった。長い沈黙のあとで、拳が、ゆっくりと、ほどけた。", "「俺も、行く」", "タケルの声だった。", "タケルは、椅子から立ち上がっていた。日に焼けた顔の中で、目だけが、まっすぐだった。", "「ヤツカ様は、俺の師だ。あの言葉を、俺に最初に教えたのも、あの方だった。いや」", "タケルは、首を振った。", "「あの方の口を借りて、王が、教えた。俺は、それを、正しいと信じて、あの方と一緒に、何年も唱えた」", "タケルは、ベルに向き直った。", "「壊したものを、俺の手で、直せと、言われた」", "ベルは、タケルを、長く見た。", "「剣は」", "「持たない」", "タケルは、即答した。", "「もう、人に向ける剣は、持たない」", "壁際で、ミカヅチが、ふん、と鼻を鳴らした。腰に下げていた包みを、卓の上に、どさりと置いた。布をほどくと、使い込まれた木刀が、一本、現れた。", "「鬼の稽古で使う、樫の木刀だ。俺の若い衆が、毎朝、これで、俺に叩きのめされている」", "ミカヅチは、木刀を、タケルのほうへ、押しやった。", "「人に向けても、死なん。だが、受けきるには、重いぞ」", "タケルは、木刀を、両手で受け取った。", "ベルが、立ち上がった。", "「行け」", "短い一言だった。", "「見ている」", "露台を出るとき、オオナムチは、ベルに呼び止められた。", "「オオナムチ」", "「はい」", "ベルは、少しだけ、迷うように、目を伏せた。", "「名を呼ぶのは、おまえの力だ。私には、あの砦の兵の名を、一つも呼べぬ」", "「ベルさん」", "「根の洲で消した兵の名も、私は、一つも知らぬ。知ろうともしなかった」", "ベルの拳が、また、握られかけた。オオナムチは、その手を、見た。それから、まっすぐ、ベルの顔を見た。", "「じゃあ、帰ってきたら、教えます」", "「何を」", "「砦の人たちの、名前。全部」", "ベルは、しばらく、黙っていた。", "「……覚えよう」", "その声は、オモイカの随員の名を、覚えた夜と、同じ響きをしていた。"]}, {"h": "三", "p": ["セキは、砦の物見台で、弓を抱えていた。", "北の風は、骨まで冷たかった。指先の感覚は、とうに、なくなっている。それでも、弓を手放すわけにはいかなかった。", "『旗を降ろすな』", "頭の中で、声がした。", "『境を守れ』", "いつもの声だった。柔らかく、温かく、迷いを凪にしてくれる声。この砦に配された日から、ずっと、聞こえている。", "『魔族は話の通じぬ者たちである』", "セキは、うなずいた。うなずくと、胸が、少しだけ、温かくなった。", "けれど。", "(いつからだろう)", "声が、同じことしか、言わなくなったのは。", "前は、もっと、いろいろなことを、言ってくれた。今日は寒いから、交代を早めよ。家族への手紙を、書いてもよい。補給の荷が、三日後に着く。", "それが、ある朝から、この三つだけになった。", "補給の荷は、来なかった。手紙を書こうとしても、声は、何も答えなかった。蔵の麦は、もう、底が見えている。", "それでも、声は、繰り返した。", "『旗を降ろすな』", "物見台の上で、砦の旗が、凍りついていた。白い布に、王家の紋。風が吹いても、もう、はためかない。", "「セキ」", "下から、声がした。薬師のナギが、梯子を上ってきた。手に、湯気の立つ椀を持っている。", "「麦湯だ。薄いけどな」", "「……すまない」", "セキは、椀を受け取った。指が、震えて、うまく持てなかった。ナギが、その手を、上から包んでくれた。", "ナギは、物見台の縁に腰を下ろし、凍った旗を見上げた。", "「なあ、セキ」", "「何だ」", "「おまえ、声に、何か、聞いたことあるか」", "「聞く、とは」", "「問いかけたこと。こっちから」", "セキは、黙った。", "あった。一度だけ。故郷の母が、病だと、使いの者から聞いた日。帰ってもいいか、と、心の中で問うた。", "声は、答えなかった。ただ、『旗を降ろすな』と言った。", "「……答えは、なかった」", "「俺もだ」", "ナギは、懐から、くしゃくしゃの紙を、取り出した。書きかけの手紙だった。宛名だけが、几帳面な字で、書いてあった。", "「村の、ゴロウさん、覚えてるか。字の下手な」", "「根の洲へ行った人か」", "「ああ。出ていく前の晩、娘に手紙ばかり書いてた。字が右に流れて、読めねえって、皆で笑ってさ」", "ナギは、紙を、膝の上で、伸ばした。", "「俺も、ああいうの、書いてみようと思ったんだ。母ちゃんに。でも、書こうとすると、頭の中が、旗を降ろすなって、それだけになる」", "紙には、宛名のほかに、何も、書かれていなかった。", "ナギは、膝を抱えた。", "「なあ。陛下は、本当に、まだ、俺たちに、話しかけてくださってるのかな」", "セキは、答えられなかった。", "答えようとすると、頭の中の声が、少しだけ、大きくなった。『魔族は話の通じぬ者たちである』。胸が、また、温かくなった。考えが、凪になった。", "それでも、胸の底に、小さな棘のようなものが、残った。", "物見台の下を、雪の混じった風が、吹き抜けていった。"]}, {"h": "四", "p": ["北の古い砦は、灰色の岩山の、肩のところにあった。", "オオナムチは、麓の林の陰から、門を見上げた。石の門は、固く閉ざされている。物見台の上に、凍りついた白い旗が見えた。", "「門の上に、弓兵が二人」", "隣で、タケルが言った。木刀を、背に負っている。", "「城壁の内に、騎兵の厩がある。槍の歩兵が、二十ほど。術師が一人、いるはずだ。それから、旗持ちと、薬師」", "「詳しいですね」", "「ここで、何度も、稽古をつけてもらった」", "タケルの声は、平らだった。けれど、木刀の紐を握る指が、白かった。", "オオナムチは、懐から、紙の束を取り出した。コトシロの写しの、最後の数枚だった。", "砦の兵の名簿だった。", "一人ずつ、名と、生まれた村と、年が、記されている。コトシロが、四か月かけて、院の記録から、拾い出したものだった。", "(呼ばれていないんだ)", "オオナムチは、思った。", "この四か月、誰からも。頭の中の声は、名を呼ばない。旗を降ろすな、としか、言わない。", "「行きます」", "オオナムチは、林から、出た。", "門の前の、開けた雪原を、まっすぐ、歩いた。", "矢が、一本、足元に、突き刺さった。", "「止まれ！」", "門の上から、声が降ってきた。", "「何者だ。名を名乗れ」", "「オオナムチ。ミナモのギルドの、冒険者です」", "「冒険者が、何の用だ」", "「話を、しに来ました」", "「話すことはない。境を守れ、とのご命令だ」", "二本目の矢が、飛んできた。今度は、肩を狙っていた。", "「――堅め」", "膜が、立ち上がった。薄く、広く、ぐるりと体を包む膜。ずっと昔、宿の裏庭で、教わったとおりに。矢は、膜に弾かれて、雪の上に落ちた。", "門が、軋んで、開いた。", "槍の歩兵が、なだれ出てきた。十人、いや、もっと多い。目が、虚ろだった。けれど、その足取りは、重かった。四か月、薄い麦湯で、凍える砦を守ってきた体だった。", "「――心鎮め」", "守りの膜を、外へ、広げた。", "先頭の兵の槍が、わずかに、鈍った。", "オオナムチは、名簿の一行目を、思い出した。", "「マサゴ」", "兵の足が、止まった。", "「南の、浜辺の村の、マサゴさん。年は、十九」", "兵の目が、揺れた。虚ろな膜の奥で、何かが、こちらを見た。", "「なんで、俺の、名を」", "「お母さんが、議会に、手紙を出していました。息子は、どこにいるのかって」", "槍の穂先が、ゆっくりと、下がった。", "兵の膝が、雪に、ついた。", "次の兵が、槍を構えた。オオナムチは、その名を、呼んだ。次の兵の名も。その次も。", "騎兵が、厩から、飛び出してきた。速い。馬の脚が、雪を蹴散らして、迫ってくる。", "タケルが、前に出た。", "木刀の一振りで、騎兵の槍を、はね上げた。馬が、驚いて、棹立ちになった。騎兵が、鞍から、転げ落ちる。タケルは、その体が雪に叩きつけられる前に、腕で、受け止めた。", "「怪我は、ないか」", "騎兵は、虚ろな目で、タケルを見上げた。", "それから、その目が、大きく、見開かれた。", "「……勇者、さま」", "術師が、門の内側で、唱えていた。甘い声だった。『惑わされるな。それは、魔族の手口だ』。言霊の糸が、目覚めかけた兵たちに、もう一度、絡みつこうとする。", "(同じ手口だ)", "ミナトの声と、同じだった。ユウの頭の中の声と、同じだった。", "オオナムチは、膜を、もっと、広げた。名を、呼び続けた。一人ずつ。声が、嗄れるまで。", "城壁の上で、旗持ちが、大きな布を、振り回していた。王家の紋の、白い旗だ。旗が振られるたびに、目覚めかけた兵たちの背筋が、また、伸びた。", "『旗を降ろすな』", "声が、砦じゅうに、満ちているようだった。旗の白さが、その声を、目に見える形にしていた。", "「トキワさん」", "オオナムチは、名簿の、旗持ちの欄を、呼んだ。", "旗持ちの腕が、止まらなかった。", "「トキワさん！　山の炭焼きの村の、トキワさん！」", "聞こえていないのか、聞こえないふりをしているのか。旗は、振られ続けた。", "物見台の上で、弓兵が、弓を引き絞った。", "矢の先が、こちらを向いていた。今度は、威嚇ではない。膜は、名を呼ぶたびに、薄くなっている。", "(保たない)", "矢が、放たれた。", "その瞬間、物見台の上で、誰かが、弓兵の腕に、しがみついた。矢は、わずかに逸れて、オオナムチの頬を、かすめた。", "頬が、熱くなった。血が、一筋、流れた。", "物見台の上で、二人が、揉み合っていた。弓兵と、もう一人。薬師の、灰色の上着を着た男だった。", "「セキ、やめろ！　あいつ、俺たちの名前を、呼んでるんだぞ！」", "薬師の声が、雪原まで、届いた。", "オオナムチは、名簿を、めくった。", "弓兵、セキ。北の山村の生まれ。年は、二十二。薬師、ナギ。同じ村の、幼なじみ。", "「セキさん！」", "物見台の弓兵が、動きを止めた。", "「ナギさんが、隣にいるでしょう。顔を、見てください。頭の中の声じゃなくて、ナギさんの顔を」", "長い、長い、沈黙だった。", "弓兵の手から、弓が、ゆっくりと、下がっていった。", "城壁の上の旗持ちの腕も、いつの間にか、止まっていた。", "雪原に、槍が、一本、また一本と、置かれていった。"]}, {"h": "五", "p": ["砦の中庭に、一人の老人が、立っていた。", "長い白い髭が、胸の下まで垂れていた。背は、タケルより低い。けれど、その立ち姿は、岩山そのもののように、揺るがなかった。手には、刃こぼれ一つない、古い剣を握っていた。", "「ヤツカ様」", "タケルは、木刀を、背から下ろした。", "老将の目が、タケルを、捉えた。虚ろではなかった。深く、澄んで、そして、冷たかった。", "「タケルか」", "声は、低く、よく通った。", "「魔界から、戻ったか。英雄の凱旋は、もう、済んだのか」", "「……ヤツカ様」", "「その木の棒は、何だ。剣は、どうした」", "「捨てました」", "ヤツカの眉が、わずかに、動いた。", "「捨てた、だと」", "「人に向ける剣は、もう、持ちません」", "「腑抜けたか」", "老将は、剣を、構えた。", "「ならば、教え直してやる。旗を降ろすな。境を守れ。魔族は、話の通じぬ者たちである」", "タケルの胸が、軋んだ。", "あの言葉を、この人の口から、何度、聞いただろう。稽古のあと、夕日の中庭で。剣の握り方を直されながら。この人の声で、この言葉を聞くと、胸が、熱くなった。正しい側に、立っていると思えた。", "(違う)", "今なら、分かる。", "この人の声の、ずっと奥で、別の声が、喋っていた。", "ヤツカが、踏み込んだ。", "速かった。老いた体とは、思えない速さだった。タケルは、木刀で、受けた。重い。樫の木が、軋む。腕が、痺れた。", "(受けきれ)", "ミカヅチの声が、頭の中で、響いた。受けきるとは、退かぬことだ。", "二撃目。三撃目。剣筋は、全部、知っていた。この人に、教わった剣だった。どこで踏み込み、どこで返すか。どこに、わずかな間が生まれるか。", "(斬るな)", "自分に、言い聞かせた。", "(この人を、斬るな)", "木刀が、剣の腹を、叩いた。乾いた音が、中庭に、響いた。", "ヤツカの手から、剣が、離れなかった。老将は、笑った。", "「甘い。それで、勇者か」", "「勇者では、ありません」", "タケルは、木刀を、下ろした。", "構えを、解いた。", "「ヤツカ様。俺は、魔界の会談の席で、刃を抜きました。和平を望んだ使者たちを、斬りました。根の洲を、焼きました」", "ヤツカの剣先が、わずかに、揺れた。", "「その全部を、俺は、正しいと信じていました。あなたに、教わった言葉と、同じだったから」", "「……黙れ」", "「陛下は、もう、いません」", "ヤツカの目が、見開かれた。", "「四か月前に、亡くなりました。頭の中の声は、陛下ではありません。石です。陛下が、この砦に最後に流した言葉を、石が、繰り返しているだけです」", "「黙れ！」", "剣が、振り下ろされた。", "タケルは、避けなかった。木刀を、横に構えた。受けきるために。", "その時、背後から、声がした。", "「ヤツカさん」", "オオナムチだった。", "雪にまみれ、声を嗄らし、それでも、まっすぐ、老将を見ていた。", "「ヤツカさん。北の山村の、ヤツカさん。奥さんは、ハツさん。娘さんは、二人」", "ヤツカの剣が、空中で、止まった。", "「四か月、名を、呼ばれていないでしょう」", "オオナムチは、一歩、近づいた。", "「ハツさんが、毎晩、あなたの名前を、呼んでいるそうです。帰ってきますように、って」", "老将の手が、震えた。", "長い髭の奥で、唇が、何かを言おうとして、動いた。", "「……ハツ」", "剣が、ゆっくりと、下がった。"]}, {"h": "六", "p": ["中継の石は、物見台の下の、狭い石室にあった。", "黒い石の台座に、細い銀の線が、幾重にも絡みついている。線の先は、床を這い、壁を伝い、砦じゅうへと、伸びていた。中央で、淡い光が、脈打っている。", "光が脈打つたびに、声がした。", "『旗を降ろすな』", "『境を守れ』", "『魔族は話の通じぬ者たちである』", "王の声だった。柔らかく、温かい声。生きていた頃と、何も変わらない。", "タケルは、石の前に、立った。", "膝が、震えた。", "この声に、何年も、従ってきた。従えば、胸のざわめきは、消えた。迷いは、凪になった。今も、この声を聞くと、胸の奥が、少しだけ、温かくなる。", "それが、いちばん、恐ろしかった。", "「タケルさん」", "後ろで、オオナムチが、言った。", "「俺が、やりましょうか」", "「いや」", "タケルは、首を振った。", "「俺が、やる」", "木刀を、石の脇に、置いた。", "それから、両の拳を、握った。", "剣ではなく。木刀でもなく。自分の手で。", "「壊したものを、俺の手で、直せ」", "魔王の声を、思い出した。", "「焼かれた土を、耕せ。折れた畦を、積み直せ」", "タケルは、拳を、振り上げた。", "「失われた者たちの、名を、覚えろ」", "振り下ろした。", "拳が、黒い石に、叩きつけられた。骨が、軋んだ。皮が、裂けた。石は、割れなかった。", "『旗を降ろすな』", "声が、言った。", "もう一度、振り下ろした。", "血が、銀の線に、飛び散った。", "『境を守れ』", "もう一度。", "石の表面に、細い、ひびが、走った。", "『魔族は』", "もう一度。", "ひびが、広がった。光が、乱れた。声が、途切れ途切れに、なった。", "『話の、通じ』", "タケルは、叫んだ。", "声にならない、叫びだった。四か月前、砦の広場で、出なかった叫びだった。", "拳が、石を、砕いた。", "黒い欠片が、石室の床に、散らばった。銀の線が、力を失って、だらりと垂れた。脈打っていた光が、ふっと、消えた。", "静かになった。", "何の声も、しなかった。", "タケルは、砕けた石の前に、膝をついた。両の拳から、血が、滴っていた。", "「……静かだ」", "呟いた。", "頭の中が、静かだった。", "その静けさの中で、遠くから、物音が聞こえてきた。砦じゅうで、何かが、床に落ちる音。槍の音。弓の音。それから、誰かが、泣き出す声。", "物見台の上で、セキが、頭を抱えて、うずくまっていた。頭の中が、静かすぎて、怖いと、泣いていた。", "隣で、ナギが、凍った旗の綱に、手をかけていた。", "「降ろすぞ」", "「……ああ」", "綱が、軋んだ。白い旗が、ゆっくりと、降りていった。"]}, {"h": "七", "p": ["比良坂の縁には、朝の光が、差していた。", "ベルは、大穴の手前の、岩陰に立っていた。", "坂の下から、人の列が、上ってくる。北の砦の兵たちだった。槍も、弓も、持っていない。痩せて、頬がこけ、そ

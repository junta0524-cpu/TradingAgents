い」", "オオナムチは、ミオに、頭を下げた。", "「少しだけ、待っていてください。必ず」", "「ええ」", "ミオは、涙を拭った。", "「お待ちしています」"]}, {"h": "六", "p": ["比良坂の大穴は、夜明け前の闇の中で、底なしの口を、開けていた。", "オオナムチは、縁に立って、その深さを、見下ろした。風が、下から、吹き上げてくる。遠く、底の方で、細い光の筋が、立っていた。", "「お待ちしておりました」", "静かな声が、背後から、響いた。", "振り返ると、寡黙な背の高い男が、立っていた。夜の色の目を持つ、岐人だった。", "「クナドさん」", "「お通りください」", "クナドは、それだけ言って、深く、礼をした。何も尋ねなかった。ベルの姿が、魔王に戻っていることにも、触れなかった。", "その代わり、大穴の縁の、足場の悪い岩場に、淡い光の道を、灯した。", "「岐人の手引きは、中立の掟の範囲です。避難民の移送と、同じことです」", "「感謝する」", "ベルが、短く、答えた。", "クナドの目が、わずかに、柔らいだ。", "背後から、蹄の音が、追ってきた。", "一騎だけだった。白銀の鎧の騎士が、丘の稜線に、立っていた。", "タケルだった。", "馬上で、剣に手を置いたまま、動かなかった。大穴の縁に立つ一行を、見つめている。距離は、百歩ほど。矢も届かない。剣も、届かない。", "オオナムチは、その視線を、感じた。", "怒りでも、憎しみでもなかった。迷いだった。善良な男が、信じてきたものと、目の前の現実の間で、立ち尽くしている。", "(追って、来ない)", "タケルは、動かなかった。長い沈黙の後、手綱を引いた。馬が、向きを変えた。", "「待て」", "一声だけ、風に乗って、届いた。", "「次は、剣を、交える」", "その声は、揺れていた。", "「その時までに、答えを、持ってこい。貴様が、何者かを」", "蹄の音が、遠ざかっていった。", "オオナムチは、胸の奥で、小さく、息を吐いた。", "(あの人は、まだ、迷っている)", "迷いは、救いの入口だ。そう、思えた。", "「行きましょう」", "クナドの灯した光の道を、三人は、降りていった。大穴の岩壁に沿って、螺旋の足場が、闇の底へ、続いている。", "どれほど、降りただろう。", "風の匂いが、変わった。", "乾いた土と、焦げた木と、遠い煙の匂い。", "足場が、途切れた。目の前に、赤みを帯びた、空が、広がっていた。", "オオナムチは、足を、踏み出した。", "黄泉の空は、薄く、赤かった。", "荒涼とした大地が、遥か、地平まで、続いている。黒い岩肌。枯れた木。ひび割れた土。教えられてきた通りの、地獄のような景色だった。", "けれど、その、荒れた大地の、あちこちに。", "小さな畑が、あった。", "斜面に、段々の田が、刻まれている。稲穂が、風に揺れて、低い波を作っていた。畑の脇に、石積みの家が、点々と、建っている。煙突から、細い煙が、上がっていた。", "遠くで、子どもたちの声が、聞こえた。", "「教えられた景色と、違う」", "声が、漏れた。", "「荒れてるのに、ちゃんと、暮らしがある」", "「ここが、私の国だ」", "ベルが、静かに、言った。", "道の向こうから、人々が、集まってきた。角を持つ者、翼を持つ者、獣の耳を持つ者。皆、傷ついた様子もなく、穏やかな顔で、こちらへ、歩いてくる。", "先頭の、鴉族の老いた店主が、声を上げた。", "「王様！ お帰りなさい！」", "その声に、周りの人々が、一斉に、続いた。", "「お帰りなさい！」", "「ご無事で」", "「団子を、用意してありますよ」", "ベルの肩が、小さく、震えた。", "「戻った」", "その声は、かすれていた。それでも、確かに、笑っていた。", "オオナムチは、人間として、初めて、魔界の土を、踏んでいた。人々の視線が、自分に向けられる。警戒も、あった。好奇心も、あった。けれど、憎しみは、どこにも、なかった。", "道の奥から、四つの影が、歩み寄ってきた。", "大柄な、角のある男。牙を覗かせる、鋭い目の男。黒い翼を畳んだ、涼しげな女。蜘蛛の面で顔を覆い、背から節のある脚を伸ばした、寡黙な男。", "四天王だった。", "その後ろに、傷の癒えきらぬ体で、杖をついて立つ、一人の女がいた。静かな目が、まっすぐ、ベルを見ていた。", "「ベルイザナ様」", "オモイカが、深く、頭を下げた。", "「お帰りなさいませ」", "「ああ」", "ベルは、それだけ、答えた。", "それから、傍らの青年を、振り返った。", "「紹介する」", "声が、柔らかかった。", "「私の友だ。オオナムチという」", "オオナムチは、一歩、前に出た。膝が、震えていた。四天王の視線が、一斉に、自分に集まる。ミカヅチの値踏みするような目。スサノの獣めいた眼光。ナキメの、何かを見抜こうとする涼しい瞳。ハニヤスの、土のような静けさ。", "(俺は、ここにいていいのか)", "足が、竦みかけた。", "その時、オモイカが、静かに、言った。", "「ようこそ、おいでくださいました」", "その声には、棘も、疑いも、なかった。", "「あなたの目が、王の本当の顔を、見てくださっていたと、伺っております」", "オオナムチは、目を、見開いた。", "「それだけで、十分です。あなたは、私たちの、客人です」", "誰かが、後ろで、小さく、笑った。ミカヅチの、低い含み笑いだった。", "「弱そうだが、折れぬ目をしている」", "「ミカヅチ」", "「事実を、言ったまでだ」", "スサノが、鼻を鳴らした。ナキメが、口の端を上げた。ハニヤスが、黙って、頷いた。", "赤い空の下、人間の青年は、深く、頭を下げた。", "「お世話に、なります」", "風が、稲穂を、揺らしていた。遠くの畑で、収穫祭の準備をする、人々の声が、聞こえていた。"]}]}, {"id": "ch11", "label": "第十一章", "title": "受けきる者", "chars": 8356, "sections": [{"h": "一", "p": ["魔界の朝は、鳥ではなく、土の匂いで始まった。", "オオナムチは、粗い藁布団の上で目を開けた。天井は低い石組みで、窓の外が薄く赤い。ここが黄泉だと思い出すまでに、少し間があった。体のあちこちが痛い。昨夜、王都から比良坂まで走り通した疲れが、まだ残っている。", "戸を叩く音がした。", "「起きたか、客人」", "低く、短い声だった。戸を開けると、甲殻を背に負った寡黙な男が、鍬を肩に立っていた。ハニヤスだ。", "「畑を見るか」", "それだけ言って、返事も待たずに歩き出す。オオナムチは慌てて外套を掴み、後を追った。", "埴の里は、朝靄の中にあった。段々に刻まれた田が丘の斜面を埋め、実り始めた稲穂が低く波打っている。畦では土蜘蛛の若者たちが、黙々と土を均していた。誰も振り返らない。けれど、通り過ぎるオオナムチに、石を投げる者も、背を向ける者もいなかった。", "「ここだ」", "ハニヤスが足を止めたのは、畑の端の、小さな畝の前だった。", "「膝をつけ」", "「え」", "「土に、客として挨拶をする。それが、ここの流儀だ」", "オオナムチは言われるまま、膝をついた。湿った土が、ズボン越しに冷たい。掌を、そっと地面に置いた。柔らかく、温かく、微かに脈打つような感触があった。", "「荒らしに来たのではない、と」", "「はい」", "「ならば、それでいい」", "ハニヤスは、それ以上何も言わなかった。ただ、鍬を置いて、隣に膝をついた。二人で、しばらく、黙って土に触れていた。", "(この人たちは)", "荒涼とした景色の中に、畑がある。煙があり、子どもの声がある。人間界で聞いてきた「話の通じない者たち」は、どこにもいなかった。ここにいるのは、土を耕し、食べ物を分け合う人々だ。", "(どちらが悪か、なんて)", "問い自体が、間違っていたのだ。頭で分かっていたことが、掌の下の土の温かさで、初めて体に落ちた。", "「泣いているのか」", "ハニヤスの声に、オオナムチは顔を拭った。", "「すみません。目に土が」", "「そうか」", "ハニヤスの面の奥で、ほんのわずかに、息が漏れた。笑ったのかもしれない。"]}, {"h": "二", "p": ["角ヶ原の演武場は、岩肌を削った広い窪地だった。", "ミカヅチは、腕を組んで青年を見下ろしていた。継ぎの当たった外套を脱ぎ、短剣を握って立つ姿は、どう見ても、戦士のものではない。肩は細く、足は震えている。鬼族の子どもでも、もう少しましな構えをする。", "(これが、王が目をかけた人間か)", "値踏みのつもりで、手合わせを申し出た。木の棒を一本、片手に持っただけだ。", "「来い。どこからでもいい」", "青年は、短剣を構え直し、踏み込んだ。", "遅い。ミカヅチは、棒の先で、軽く肩を押した。青年は、あっけなく転がった。砂が舞う。", "「終わりか」", "「……まだです」", "立ち上がった。もう一度、踏み込む。今度は、足を払われて、背中から落ちた。息が詰まる音がした。", "「やめておけ。骨が折れる」", "「まだ、です」", "三度目。四度目。五度目。", "青年は、何度倒されても、立った。膝は笑い、唇は切れ、腕は痺れているはずだ。それでも、短剣を握る手は、離さなかった。ただ、一つだけ、変わったことがある。四度目あたりから、青年は、倒されながら、何かを唱えていた。", "「――堅め」", "細い膜が、青年の体を包んだ。棒の一撃が、膜に当たって、鈍い音を立てた。", "(守りの言霊を、実戦で)", "ミカヅチは、目を細めた。まだ弱い。紙のように薄い。けれど、六度目の打ち込みで、膜は、一度だけ、棒を弾いた。", "青年が、目を見開いた。", "「今の」", "「偶然だ」", "そう言いながら、ミカヅチの胸の奥で、古い記憶が、ゆっくりと立ち上がっていた。", "王との一騎討ち。全てをぶつけ、あの一撃を受けきった日のこと。倒れず、誇りにかけて立ち上がり、王に誇りを称えられた。あの時は、自分の強さが認められたのだと思っていた。", "(違った)", "戦場で、静まり返った根の洲を見た日に、悟った。あれは、手加減だった。受けきれる強さを、王が選んでくれていた。", "それでも、あの日、自分は立った。立ったから、今の自分がある。", "「小僧」", "ミカヅチは、棒を下ろした。", "「受けきるとは、何だと思う」", "青年は、肩で息をしながら、少し考えた。", "「倒れない、こと」", "「違う」", "低く言った。", "「倒れるのは、構わん。人は、倒れる。肝心なのは、退かぬことだ。倒れても、膝をついても、背を向けるな。その場に、居続けろ。それが、受けきるということだ」", "青年の目が、揺れた。", "「退かない」", "「そうだ。おまえの守りの言霊は、まだ薄い。だが、退かぬ者の膜は、厚くなる。いつかな」", "ミカヅチは、背を向けた。", "「今日は、ここまでだ。明日も来い。鬼族は、立ち上がる者には、何度でも付き合う」", "背中に、青年の声が届いた。", "「ありがとうございます」", "返事はしなかった。ただ、口の端が、わずかに、持ち上がっていた。"]}, {"h": "三", "p": ["黄泉津の宮の奥には、誰も立ち入らない回廊がある。", "オオナムチは、ナキメに案内されて、その薄暗い道を歩いていた。壁に刻まれた模様は、渦のような曲線で、見ていると、目が回りそうになる。", "「ここは、イザナギ縁の聖域です」", "ナキメが、涼やかな声で言った。黒い翼を畳み、足音も立てずに歩く。彼女の前では、いつも、背筋が伸びた。", "「死と再生の理が、一番濃く残る場所。名呼びの入口に触れるには、ここが最適でしょう」", "「名呼び」", "「倒れた者の名を呼び、この世に繋ぎ止める言霊です。蘇生の入口。習得は、本来、何年もかかります」", "「俺に、できるでしょうか」", "「できません」", "ナキメは、あっさり言った。", "「完成は、ね。ただ、入口に触れることなら、あなたには、素質がある」", "回廊の突き当たりに、小さな円い部屋があった。床は、白い石で、中央に、浅い水が張られている。水面は、鏡のように静かだった。", "「膝をついて、水を見なさい」", "オオナムチは、言われた通りにした。水面に、自分の顔が映る。疲れた、痩せた顔。", "「誰か、呼び戻したい人はいますか」", "胸の奥に、いくつもの顔が浮かんだ。ユウ。ハル。ヒナの父。", "「目を閉じて、その人の名を、心の中で呼びなさい。大きな声ではなく、掌で、そっと包むように」", "(ユウ)", "名を呼んだ。", "何も、起きない。ただ、静かな時間が流れた。水の冷たさが、膝から這い上がってくる。", "(ユウ。ひなた野の井戸、覚えてるか)", "声にならない声で、繰り返した。", "不意に、水面が、微かに揺れた。", "波紋が、一つ、広がった。水の底から、ごく小さな、温かい何かが、掌に触れた気がした。", "「……今のは」", "「入口です」", "ナキメの声が、少しだけ、柔らかかった。", "「名の欠片が、応えた。ただし、これは、まだ、欠片に触れただけ。蘇生には、ほど遠い」", "「はい」", "「焦らないことです。あなたが誰かを失いかけた時、本当の名呼びは、その時、生まれます」", "オオナムチは、目を開けた。水面は、元の静けさに戻っていた。それでも、掌には、まだ、微かな温もりが残っていた。", "その日の午後、嵐ヶ峰の演武場で、スサノとも手を合わせた。", "スサノの動きは、速かった。二度の踏み込みが、一瞬のうちに来る。オオナムチは、何度も打たれた。三度目の手合わせで、ようやく、気づいた。", "(二回目の動きは、一回目の逆から来る)", "読みが、当たった。スサノの爪を、短剣の腹で受け流した。スサノが、牙を見せて、笑った。", "「やるじゃねえか。獣の速さは、読まれると、脆い」", "「読み、ですか」", "「そうだ。鬼は、鴉に弱い。嵐狼は、鬼に弱い。土蜘蛛は、嵐狼に弱い。鴉は、土蜘蛛に弱い。四つの相性を知っていれば、力が足りなくとも、道は拓ける」", "ナキメが、涼しい顔で付け加えた。", "「相性は、傾向にすぎません。個人と状況で、覆る。肝心なのは、目の前の相手を、よく見ること」", "(見る)", "オオナムチは、頷いた。見ることなら、自分にもできる。ずっと、そうしてきたのだから。"]}, {"h": "四", "p": ["収穫祭の夜は、赤い空が、深い藍に沈んだころに始まった。", "オモイカは、卓の端の席に、静かに座っていた。", "埴の里の畑のそばに、長い卓が、いくつも並べられている。鬼の祭り酒の樽が開けられ、土蜘蛛の新米の団子が山盛りになり、嵐狼の子どもたちが、泥だらけの顔で、走り回っていた。鴉族の屋台からは、甘い煙が立ち上っている。", "その中心に、人間の青年がいた。", "継ぎの当たった外套のまま、鬼族の若者に肩を組まれ、杯を押しつけられている。顔を赤くして、必死に断ろうとしているが、周りは笑って聞かない。耳の聞こえない嵐狼の幼い子が、青年の袖を引き、手の形で何かを伝えた。", "(おなか、すいた？)", "青年は、戸惑ってから、子どもの手の動きを真似て、返した。", "(すいた。団子、食べたい)", "子どもが、ぱっと笑った。", "オモイカは、その光景を、じっと見ていた。", "(人間が、席にいる)", "王が、何気なく口にした言葉を、思い出す。和平が成れば、収穫祭に人間を招けるだろうか、と。あの日、自分は、会談に向かった。随員たちと共に。", "目の前の杯に、手を伸ばせなかった。", "笛を吹いていた嵐狼の青年の顔が、浮かぶ。巻物を抱えていた老いた鬼の書記の、冗談めかした声。荷を担いでいた若い鴉の、少しはにかんだ笑い方。一人ひとりの顔が、鮮明に、ある。", "名も、全員、覚えている。口にしようとすると、喉が、固く閉じた。", "(まだ、言えない)", "悔しかった。彼らが座るはずだった席が、この卓には、あるはずだった。酒の樽は、三倍いると、ミカヅチが言っていた。その三倍の分だけ、空いた席が、今夜も、どこかに、あるような気がした。", "隣の席に、誰かが、静かに腰を下ろした。", "顔を向けなくても、分かった。ベルだった。", "王は、何も言わなかった。慰めの言葉も、「申し訳ありません」を遮る言葉も、なかった。ただ、隣に座って、同じ方向を、眺めていた。", "しばらくして、王の手が、卓の上の杯を、一つ、取った。そして、オモイカの前に、そっと置いた。", "オモイカは、その杯を見つめた。", "指が、わずかに震えた。それから、ゆっくりと、杯を持ち上げた。", "口に含んだ酒は、鬼族の祭り酒の味がした。少し甘く、少し苦かった。", "(半分だけ、叶いました)", "胸の中で、随員たちに、そう告げた。", "(人間は、席に着きました。あなた方の席は、まだ、空いたままですが)", "目の端が熱くなるのを、杯の縁で、隠した。", "ベルは、何も言わず、ただ、隣に居続けた。"]}, {"h": "五", "p": ["夜更け、ベルは、一人、畑の畦に立っていた。", "祭りの音が、遠くに聞こえる。星の少ない赤黒い空が、地平まで続いている。比良坂の方角に、細い光の筋が、立っていた。", "足音が、背後で止まった。", "「ベルさん」", "振り向くと、オオナムチが、立っていた。酒の匂いはしない。顔は、真剣だった。", "「お願いが、あります」", "「聞こう」", "「明日の、タケルさんとの戦い」", "青年は、息を吸った。", "「俺に、やらせてください」", "ベルは、黙っていた。", "「自分の正義で、決着をつけたいんです。ベルさんは、見ていてください。手を出さないで、ほしい」", "夜風が、稲穂を揺らした。", "(来たか)", "いつか、この言葉を聞く日が来ると、思っていた。思っていたのに、胸の奥が、きしんだ。", "タケルは、人間界最強の剣士だ。この青年は、まだ、紙のように薄い守りしか持たない。倒れるかもしれない。傷つくかもしれない。最悪の場合は。", "(手を出せば、すぐに、止められる)", "その気持ちが、喉元まで、込み上げた。拳が、勝手に、握られていた。爪が、掌に食い込んだ。", "「おまえは、まだ、弱い」", "声が、思ったより、掠れた。", "「知ってます」", "「死ぬかもしれない」", "「かもしれません」", "青年は、笑った。泣きそうな顔だった。", "「でも、ベルさんが教えてくれたことです。守るとは、倒すことじゃない。誰も失わない道を、選び続けることだって」", "(そんなことを、言っただろうか)", "言葉にして教えたのは、夜の特訓の最後だったか。あれを、この青年は、胸に刻んでいたのか。", "「俺は、タケルさんを、失いたくない。敵でも、洗脳されていても。だから、俺が、やります」", "ベルは、長い間、青年の顔を見ていた。", "灰色の目の奥の紅は、もう、隠していない。魔王の姿のまま、畦に立っている。その前で、継ぎ当ての外套の青年が、まっすぐ、見上げていた。", "(育てた者が、手を引く瞬間)", "それは、こういうことか、と思った。寂しく、誇らしく、そして、怖い。", "「分かった」", "ようやく、言った。", "「手は出さぬ」", "「ありがとうございます」", "「ただし」", "ベルは、青年の肩に、手を置いた。", "「見ている。最後まで、おまえの背中を、見ている。それだけは、許してくれ」", "オオナムチの目が、潤んだ。", "「はい」", "「半分ずつ、だったな」", "「……はい」", "青年は、顔をくしゃりとさせて、笑った。"]}, {"h": "六", "p": ["比良坂の人間側の拠点、坂上の砦は、夜明けの光の中にあった。", "石造りの広場に、両陣営の兵が、遠巻きに控えていた。誰も、武器を構えていない。中央の空いた場所に、一人の剣士が、立っていた。", "白銀の鎧。澄んだ目。人間界最強の勇者、タケル。", "見届け人の位置に、寡黙な岐人が立っていた。クナドが、静かに、告げた。", "「この戦い、私が、見届けます。どちらの陣営にも、属さぬ者として」", "オオナムチは、広場の中央へ歩み出た。継ぎの当たった外套。使い古した短剣。靴の踵は、すり減ったままだ。", "(オオナムチ)", "タケルは、青年を見つめた。獣ノ原で、礼を述べた冒険者だ。亜人の少年に、目を合わせて話しかけていた青年。", "「来たか」", "タケルの声は、硬かった。", "「答えを、持ってきたか。あの男が、何者か」", "「魔王です」", "オオナムチは、まっすぐ答えた。", "「そして、俺の友人です」", "タケルの眉が、動いた。", "「友人、だと」", "「はい。そして、あなたの牢で、粥を出させた人です」", "タケルの唇が、わずかに、震えた。", "「黙れ」", "剣が、抜かれた。", "「王が、そう仰った。魔族は、話の通じない者たちだと。俺は、王を信じる」", "声が、揺れていた。それでも、剣先は、まっすぐ、オオナムチに向いていた。", "「ならば、剣で答えろ」", "踏み込みは、見えなかった。", "次の瞬間、衝撃が、肩を貫いた。", "オオナムチの体が、宙を舞った。石畳に叩きつけられ、息が止まる。視界が、白くなった。", "(速い)", "人間界最強の名は、伊達ではなかった。獣ノ原で見た穏やかな顔とは、別人のような剣だった。", "立ち上がる。膝が、笑う。", "「――堅め。心鎮め」", "膜が、体を包んだ。二度目の斬撃が、膜に当たった。ぱきり、と音がして、膜が、割れた。衝撃が、胸に届いた。", "また、倒れた。", "(退かない)", "ミカヅチの声が、頭の中で、響いた。", "(倒れても、膝をついても、背を向けるな)", "オオナムチは、立ち上がった。", "何度目だろう。数えるのをやめた。膜が割れるたびに、張り直した。言霊を唱えるたびに、喉が焼けた。", "ベルは、広場の端で、動かなかった。", "拳を握りしめ、爪が掌に食い込み、血が滲んでいた。それでも、一歩も、踏み出さなかった。唇を、固く結んでいた。", "(見ている)", "オオナムチは、遠くで、その視線を感じた。", "(見ていてくれる)", "それだけで、足が、前へ出た。", "――タケルの視界。", "(なぜ、倒れない)", "剣を振るうたびに、焦りが、積もっていった。", "人間界最強と呼ばれてきた。この剣で、魔界の軍勢を打ち払った。民を守ってきた。その自分の剣を、この青年は、何度受けても、立ち上がってくる。", "(弱い)", "斬るたびに、確信する。この青年は、弱い。技も、力も、自分の足元にも及ばない。", "それなのに。", "(なぜ、退かない)", "膝をつき、血を吐き、それでも、青年は、正面から、こちらを見ていた。逃げもしない。憎しみの目でもない。ただ、まっすぐ、見つめていた。", "その目が、牢の中の黒髪の男の目と、重なった。", "(違う)", "頭の奥で、柔らかな声が、響いた。", "(惑わされるな。それは、魔族の手口だ。斬れ、タケル)", "王の声だった。胸の迷いが、すっと凪いだ。", "剣を、握り直した。", "――オオナムチの視界。", "(読め)", "倒れ、立ち、倒れ、立ちながら、オオナムチは、見ていた。", "ナキメの言葉が、蘇った。肝心なのは、目の前の相手を、よく見ること。", "(大振りの後に、一拍の隙がある)", "タケルの剣は、大きい。踏み込みが深いほど、次の動きまでに、わずかな間が生まれる。その間は、呼吸二つ分もない。", "(それから)", "斬撃の直前、タケルの目が、わずかに揺れる瞬間があった。何かを、聞いている目だった。頭の奥の、別の声に、耳を傾けている目。", "(王の声が、動きを、整えているんだ)", "言霊を乗せる、その直前の呼吸。動きが、人のものではなく、借り物のように、滑らかになる一瞬。そこだけ、剣が、読める。", "(ナキメさんの、言霊耐性の稽古)", "洗脳の動きは、洗脳の呼吸で、読める。", "(いける)", "オオナムチは、膜を張り、斬撃を受けた。割れた。倒れた。立った。", "そして、規定の時を越え、タケルの息が、わずかに乱れ始めた。", "疲れているのは、青年だけではなかった。人間界最強の剣士もまた、肩を上下させていた。", "(ここだ)", "オオナムチは、短剣を握り直した。", "読んだ隙へ、踏み込んだ。", "火種を、掌に灯す。作り直すための、金色の小さな炎。それを、短剣の刃に、乗せた。", "「――作り直す火だ」", "刃が、タケルの剣を、弾いた。", "乾いた音が、広場に響いた。白銀の剣が、宙を舞い、石畳に、突き刺さった。", "タケルの体が、傾いた。膝が、折れた。", "白銀の鎧が、石畳に、重い音を立てて、沈んだ。", "静寂が、広場を覆った。", "「この戦い」", "クナドの声が、凪いだ空気を、震わせた。", "「見届けました」"]}, {"h": "七", "p": ["ベルは、拳を、ゆっくりと、開いた。", "掌に、爪の痕が、赤く、並んでいた。手が、小さく、震えている。", "(勝った)", "安堵と、誇らしさと、そして、言葉にできない何かが、胸に、一度に、押し寄せた。育てた青年が、人間界最強の剣士を、膝から折った。殺さず、傷を最小に抑え、ただ、戦えなくした。", "(あの子は)", "オオナムチは、石畳の上で、膝をつき、荒い息をついていた。それでも、顔を上げ、倒れた剣士を、見ていた。", "その時だった。", "タケルの喉から、ありえない声が、漏れた。", "『立て、タケル』", "柔らかな、穏やかな声だった。タケル本人のものではない。アマツ王の、遠隔の言霊だ。", "『英雄は、倒れぬ』", "白銀の鎧が、ぎしり、と鳴った。", "膝をついていたタケルの体が、意思に反して、ゆっくりと、立ち上がろうとしていた。腕が、勝手に、地面に突っ張る。傷ついた体が、無理やり、動かされていく。", "目は、虚ろだった。ただ、苦痛だけが、表情に、滲んでいた。", "「やめろ」", "オオナムチが、よろめきながら、立ち上がった。", "「その人は、もう、戦えない」", "『剣を取れ』", "王の声は、止まらなかった。", "タケルの指が、石畳に突き立った剣へ、伸びた。", "(させない)", "オオナムチは、両手を、前に突き出した。", "「――心鎮め」", "声が、枯れていた。それでも、唱えた。", "聖域の水面で触れた、あの温かい感触を、思い出した。名を呼ぶ、掌で包むように。", "守りの膜が、タケルの周りに、広がった。王の声を、遮るように。細い糸のような言霊の根が、膜に触れて、軋んだ。", "『剣を、取れ』", "声が、遠のいた。膜に阻まれ、音が、途切れ途切れになる。", "「……あ」", "タケルの指が、止まった。", "「あ、あ」", "喉から、掠れた声が、漏れた。", "目の焦点が、ゆらりと、揺れた。ほんの一瞬だった。虚ろな瞳の奥に、澄んだ光が、戻った。", "「俺は」", "唇が、動いた。", "「俺は……何を……」", "その呟きは、誰のものでもない、タケル自身の声だった。", "オオナムチは、息を呑んだ。", "けれど、すぐに、光は、揺らいで、消えた。タケルの体が、ぐらりと傾き、石畳に、崩れ落ちた。気を失ったのだ。", "静かな足音が、近づいた。", "クナドだった。寡黙な岐人が、倒れた勇者の傍らに、膝をついた。白銀の鎧の肩に、そっと手を置いた。", "「この者は、私どもが、預かります」", "声は、穏やかだった。", "「見届け人の掟です。敗れた者は、どちらの陣営にも、渡しません」", "兵たちが、ざわついた。けれど、誰も、異を唱えなかった。", "岐人は、タケルを抱え起こした。大柄な体を、軽々と、背に負う。その背中は、夜明けの光の中で、不思議なほど、静かだった。", "「境の神の血を引く一族の、集落では」", "クナドは、肩越しに、言った。", "「王の言霊は、届きにくくなります。しばし、休ませましょう」", "オオナムチは、去っていく背中を、見送った。足が、がくりと、折れた。石畳に、膝をついた。", "「オオナムチ」", "駆け寄る足音が、あった。", "ベルだった。", "魔王の姿のまま、青年の傍らに、膝をついた。血に濡れた手を、そっと、握る。", "「よく、やった」", "その声は、震えていた。", "「見ていた。最後まで見ていた」", "オオナムチは、笑った。泣き笑いだった。", "「手、出さなかった、ですね」", "「ああ」", "「すごく、握りしめて、ましたね。血が、出てる」", "「……見ていたのか」", "「見えてました。ずっと」", "ベルは、何も、言えなかった。ただ、青年の頭に、掌を置いた。", "遠く、比良坂の大穴の底から、細い光の筋が、立ち昇っていた。朝日が、坂上の砦の石を、金色に染めていく。", "その光の向こうで、白い礼装の影が、動いた気がした。", "王が、動き出す。", "そんな予感が、夜明けの風に、混じっていた。"]}]}, {"id": "ch12", "label": "第十二章", "title": "名を呼ぶ者", "chars": 7586, "sections": [{"h": "一", "p": ["坂上の砦に、朝の光が差していた。", "クナドは、気を失った勇者を背から降ろし、石の壁に凭れさせた。鎧の肩に手を置いたまま、静かに息を整える。岐人の集落へ運ぶ前に、ひとつ、片付けねばならぬ来客があった。", "蹄の音ではなかった。車輪の音だった。", "白い馬車が、ゆっくりと砦の門をくぐった。護衛の兵が二十、馬車を囲んで歩く。扉が開き、白い礼装の男が、静かに降り立った。", "アマツ王だった。", "剣は帯びていない。冠もない。柔らかな笑みを浮かべ、石畳を歩く姿は、近所の老人が散歩に来たようにさえ見えた。", "「皆、楽にしてくれ。争いに来たのではない」", "穏やかな声が、砦の広場に染みていく。", "クナドは、ひとつ、気づいた。両陣営の兵の肩から、力が抜けていく。魔界側の者たちでさえ、わずかに、剣を握る指を緩めかけていた。", "(言霊だ)", "岐人は、境の神の血を引く。言霊の流れは、水の中の油のように、目に見える。王の声には、細い糸が混じっていた。聞く者の警戒を、一本ずつ、解いていく糸だ。", "「英雄タケルをよくぞ守ってくれた。感謝する。魔界の方々にも、礼を言わねばならぬ」", "王は、広場の中央で足を止めた。", "「岐人殿」", "視線が、クナドに向いた。", "「その者は、我が国の英雄だ。傷ついた体を、休ませてやりたい。引き渡していただけるか」", "「できません」", "クナドは、短く答えた。", "「戦いの後の敗者は、見届け人が預かる掟です。どちらの陣営にも、渡せません」", "「ほう」", "王は、微笑んだままだった。", "「掟、か。だが、私は、彼の王だ。家族のようなものだ。そこを曲げて、頼めまいか」", "(二度目だ)", "声に、糸が、濃く混じった。", "「彼は、私の大切な臣だ。傷ついた姿を、見ていられぬ。どうか、岐人殿の慈悲で」", "甘い言葉だった。共感から入り、相手の善意に、そっと手を伸ばす。刷り込みの手口だ。広場の兵たちが、小さく頷いた。「そうだ、王の臣ではないか」「渡してやれ」と、誰かが呟いた。", "クナドの胸の奥の、境の血が、冷たく、疼いた。糸が、触れようとして、弾かれる。", "「お断りします」", "声は、揺れなかった。", "「掟は、慈悲より先にあります。私どもが中立でいられるのは、そのためです」", "王の笑みが、ほんの一瞬、固まった。", "「三度は、言わぬぞ」", "「三度でも、同じです」", "沈黙が、落ちた。", "風が、砦の旗を鳴らした。広場の誰もが、息を詰めて、王の顔を見ていた。", "王は、笑みを、消した。", "消す、というより、剥がれた。顔の皮の裏から、別のものが、現れた。目の奥には、最初から、温度がなかった。それが、表に出ただけだった。", "「……ならば」", "声から、柔らかさが、抜け落ちた。", "「もうよい」", "護衛の兵が、はっと、顔を上げた。洗脳の下でも、本能が、何かを告げたのだろう。見たことのない王の顔に、兵たちが、一歩、退いた。", "魔界側の列の中で、杖をついた女が、小さく、息を呑んだ。", "「あの時も、最後に、この顔をしました」", "オモイカの声だった。", "クナドは、静かに、一歩、前に出た。", "(中立の掟は、命を守るためにある)", "それが、岐人の、ただ一つの誓いだった。"]}, {"h": "二", "p": ["王の唇が、動いた。", "オオナムチは、その動きを、見ていた。息は、まだ荒い。膝は、笑っている。それでも、立ち上がっていた。", "「聞け」", "王の声が、変わっていた。", "「我が言霊は、名と共にある」", "低く、重く、広場の石畳が、鳴り始めた。", "「兵よ、タケルよ。命ずる」", "王の掌が、掲げられた。", "「その青年を、殺せ」", "護衛の兵たちの目が、一斉に、虚ろになった。槍の穂先が、ゆっくりと、こちらへ向いた。石の壁際で倒れていたタケルの指が、ぴくりと、動いた。", "(一段目)", "オオナムチは、悟った。", "(兵と、タケルさんを、また)", "王の唇は、止まらなかった。", "「そして」", "視線が、オオナムチに、突き刺さった。", "「おまえの、まことの名を、呼ぶ」", "背筋が、凍りついた。", "「オオナムチ」", "名が、呼ばれた。", "耳ではなく、骨の内側で、響いた。自分の名が、他人の声で、引き剥がされていく感覚。指先が、薄く、透けた。足元の影が、ぼやけた。", "(消える)", "悲鳴は、出なかった。声が、出なかった。喉の奥から、名が、抜けていく。", "「名を奪われた者は、誰の記憶にも、残らぬ」", "王の声は、穏やかだった。", "「勝者の名など、歴史には、要らぬ。残るのは、英雄タケルの勝利だけだ」", "(嫌だ)", "オオナムチは、歯を食いしばった。", "(嫌だ)", "槍が、迫ってくる。兵たちが、虚ろな目で、歩いてくる。その向こうで、タケルが、剣を拾おうとしていた。", "「――心鎮め」", "声にならない声で、唱えた。", "守りの膜が、立ち上がった。兵たちと、タケルの周りへ。王の言霊の糸を、遮るように。", "けれど、膜は、すぐに、薄くなった。名を削られるほどに、言霊を紡ぐ力が、失われていく。", "(保たない)", "視界が、白く、霞んだ。", "名が、また、削られた。", "自分が誰なのかが、輪郭を失っていく。ひなた野の井戸。ユウの笑顔。ハルの声。ミナモの受付の、黒髪の男の顔。思い出が、一枚ずつ、遠のいていく。", "(待て)", "(まだ、消えるな)", "膝が、折れかけた。それでも、膜を、張り続けた。", "視界の端に、広場の隅の、黒い影が見えた。", "動かない影だった。"]}, {"h": "三", "p": ["ベルは、動かなかった。", "動けなかった、のではない。動かなかった。", "石畳を一歩蹴れば、王の喉元に届く。この距離なら、一呼吸で足りる。魔王の力を解けば、言霊の詠唱など、手ごと、握り潰せる。", "(今なら、止められる)", "胸の奥で、何かが、叫んでいた。", "青年の輪郭が、薄れていく。足元の影が、消えかけている。声が、出なくなっている。見ているだけで、心臓が、軋んだ。", "(あれは、私が、育てた)", "守りの立ち回りを教えた。癒やしの勘を伝えた。半分ずつ、と笑い合った。あの青年が、今、目の前で、消えようとしている。", "拳を、握りしめた。", "爪が、掌に、食い込む。昨日の傷が、また、開いた。血が、指の間を、伝って、石畳に落ちた。", "その時、青年と、目が合った。", "遠くから、オオナムチが、こちらを、見ていた。", "薄れかけた顔で、必死に、何かを、伝えようとしていた。声は、出ない。ただ、目だけが、はっきりと、語っていた。", "(待ってくれ)", "(俺が、やる)", "ベルの息が、止まった。", "(……約束)", "「手は出さぬ」", "昨夜、畦で、言った。見ている、とも言った。最後まで、背中を、見ていると。", "踏み出しかけた足を、引いた。", "石畳の上に、血が、ぽたりと、落ちた。", "(私は、見る)", "(それが、私に、できる、全てだ)", "歯を、食いしばった。奥歯が、軋んだ。喉の奥で、獣のような声が、込み上げて、飲み込まれた。", "視界の端で、クナドが、動いた。", "岐人の背の高い体が、倒れたタケルの前に、立ちはだかった。何も持たず、何も唱えず、ただ、身を、盾にしていた。中立の掟の、ぎりぎりの線上で。", "(この男も、守っている)", "ベルは、思った。", "(皆、自分の持ち場で、できることを、している)", "自分の持ち場は、ここだ。見守る場所だ。", "血の滲む拳を、握りしめたまま、ベルは、青年から、目を逸らさなかった。"]}, {"h": "四", "p": ["タケルは、暗い水の底にいた。", "声が、上から、降ってくる。", "『殺せ』", "(誰を)", "『その青年を』", "(なぜ)", "『それが、正しい』", "王の声だった。頭の中の、いつもの、柔らかな声。迷いを、凪にしてくれる声。ずっと、この声に従ってきた。従えば、胸のざわめきは、消えた。", "(今も、消えるはずだ)", "体が、動いていた。", "石畳に刺さった剣を、手が、勝手に、掴んでいた。傷だらけの腕が、悲鳴を上げる。それでも、止まらない。立ち上がろうとしている。膝が、無理に、伸びていく。", "(やめろ)", "声にならなかった。", "目だけが、動いた。視界の先に、青年がいた。継ぎ当ての外套。血に濡れた唇。薄れかけた輪郭。それでも、膜を張って、こちらを、守ろうとしている。", "(俺を、守っている)", "胸の奥で、何かが、軋んだ。", "(殺そうとしている、この俺を)", "『惑わされるな』", "王の声が、強くなった。", "『それは、魔族の手口だ』", "(違う)", "初めて、そう思った。", "(違う、気がする)", "その瞬間、頭の奥で、ぷつり、と何かが、切れた。いや、切られた。冷たい、鋭い、別の力が、割り込んできた。", "『命令に従わぬ駒は』", "王の声が、変わっていた。", "『名ごと、消してしまえ』", "名を、呼ばれた。", "「タケル」", "骨の内側で、響いた。自分の名が、剥がれていく。足元の感覚が、消えた。腕の重みが、消えた。", "(俺の、名が)", "恐怖が、背筋を、貫いた。", "(陛下は)", "(俺を、消すのか)", "牢の中の粥の温かさが、浮かんだ。傷は痛むか、と尋ねた黒髪の男の声。獣ノ原で、水を配った亜人の老女の、皺だらけの手。", "(あの人たちは、俺を、殺さなかった)", "(陛下は)", "考えが、そこで、霧散した。", "消えていく。", "意識が、薄れていく。最後に、聞こえたのは、誰かの、必死の足音だった。"]}, {"h": "五", "p": ["オオナムチの膜が、ぱりん、と砕けた。", "兵たちの槍が、迫る。タケルの剣が、持ち上がる。名は、半分が、剥がれていた。立っているのが、不思議なくらいだった。", "(あの人の、詠唱を)", "王の唇が、止まらずに、動き続けている。", "(止めなければ)", "名の剥奪は、詠唱が完成するまで、続く。止められるのは、詠唱者だけ。ヒエダの言葉が、蘇った。言霊は、根を持つ。根を断つのは、根の元だけ。", "(あの人を)", "(止める)", "殺すつもりは、なかった。", "最初から、一度も、思わなかった。タケルを倒した時も、傷つけずに終わらせた。この王にも、決着をつけるつもりで、ここに立った。", "(でも)", "兵たちの槍が、一斉に、振り下ろされようとしていた。タケルの剣が、自分の胸へ、向かってくる。クナドが、その剣の前に、立ちはだかっている。守るために、岐人が、斬られるかもしれない。", "(もう、他に)", "(誰も、救えない)", "膝が、動いた。", "足が、前へ、出た。", "薄れた体が、重たい風のように、石畳を滑った。兵の槍の間を、擦り抜ける。火種を、掌に、灯した。金色の、小さな炎。作り直す火。", "(ごめんなさい)", "王が、気づいた。", "白い礼装の男が、初めて、目を見開いた。穏やかな仮面の下から、純粋な驚きが、覗いた。", "「待て、おまえ」", "声が、揺れた。", "「私を、殺す気か。王を」", "(違う)", "(あなたの言霊を、断つだけだ)", "そう言いたかった。声は、出なかった。", "短剣が、閃いた。", "火を纏った刃が、王の喉元へ、走った。", "詠唱の、核心。言霊が、紡がれる、まさにその根へ。", "肉を断つ感触が、掌に、伝わった。", "重く、短く、静かだった。", "王の頭が、傾いた。穏やかな顔が、何かを、言おうとして、唇を、動かした。", "「なぜ、私が」", "そこで、声は、途切れた。", "礼装の白が、赤く染まった。体が、石畳に、崩れ落ちた。見開かれた目は、最後まで、自分が何を失ったのかを、理解していなかった。", "言霊が、途切れた。", "広場を満たしていた、粘るような圧力が、ふっと、消えた。兵たちの槍が、からん、と音を立てて落ちた。虚ろだった目に、光が戻り、誰かが、膝から崩れた。", "オオナムチの体に、名が、戻ってきた。", "骨の内側で、自分の名が、静かに、定まった。指先が、はっきりと、見えた。足元に、影が、生まれた。", "けれど、震えは、止まらなかった。", "短剣が、手から、滑り落ちた。血に濡れた掌が、小刻みに、震えている。", "(俺が)", "(殺した)", "「オオナムチ」", "背後から、声が、した。", "肩に、手が、置かれた。大きな、温かい手だった。血の匂いが、した。指の間から、まだ、血が滴っていた。", "ベルは、何も、言わなかった。ただ、青年の肩を、支えた。", "その手の震えが、青年のものか、自分のものか、どちらともなく、重なっていた。"]}, {"h": "六", "p": ["タケルは、まだ、倒れていた。", "石畳の上に、仰向けに。白銀の鎧が、朝日を弾いている。けれど、その体は、薄く、薄く、透けていた。", "(王が死んでも)", "オオナムチは、気づいた。", "(削られた名は、戻らない)", "指先から、足先から、輪郭が、少しずつ、消えていく。胸の鼓動が、聞こえない。息が、浅い。このままでは、誰の記憶にも残らない場所へ、行ってしまう。", "「タケルさん」", "膝をついた。血に濡れた手で、タケルの手を取った。冷たかった。", "「待って。消えないで」", "誰も、動けなかった。広場の誰もが、息を呑んで、見ていた。", "オオナムチは、目を閉じた。", "聖域の水面を、思い出した。ナキメの声。誰かを呼び戻したい、と思いなさい。大きな声ではなく、掌で、そっと、包むように。", "(タケルさん)", "名を、呼んだ。", "「タケル」", "声が、掠れた。", "何も、起きない。タケルの体は、薄いままだった。", "(だめか)", "胸の奥が、冷えた。", "(まだ、足りない)", "それでも、やめなかった。", "「タケル」", "二度目。", "掌が、ほんの少し、温かくなった。けれど、まだ、足りない。輪郭は、揺らいだまま、戻らない。", "「頼む」", "涙が、頬を、伝った。", "「戻ってきてくれ。あなたは、悪い人じゃない。粥を、残さず食べた人だ。水を、配った人だ。亜人の人の手を、両手で、包んだ人だ」", "(スクナさんの、言葉)", "守るだけでは、人は救えぬ時が来る。癒やす手を、磨いておけ。傷を塞ぐのではない。命を、繋ぐ手じゃ。", "(今が、その時だ)", "オオナムチは、掌に、全てを、込めた。", "守りも、癒やしも、火も、見破りも。旅の中で、触れた、全ての言霊を。ベルの教え、ミカヅチの教え、ナキメの教え。ハニヤスの土の温かさ。", "「タケル」", "三度目。", "声が、広場に、響いた。", "掌の下で、何かが、拍動した。", "微かに、小さく、けれど確かに。心臓が、一度、鳴った。", "薄れていた輪郭が、墨が水に滲むように、戻ってきた。指先が、色を持った。胸が、上下した。浅い呼吸が、深くなった。", "タケルの喉が、鳴った。", "「……あ」", "息が、通った。", "オオナムチは、そのまま、タケルの胸に、額を、押し当てた。肩が、震えた。声を上げて、泣いた。", "「よかった」", "「よかった」", "誰かが、後ろで、小さく、息を吐いた。クナドだった。寡黙な岐人の目の端が、わずかに、光っていた。", "「名呼び、見届けました」", "声は、深く、静かだった。", "「境の神も、お喜びでしょう」", "ベルは、立ち尽くしていた。", "(あの青年は)", "(私に、並んだ)", "胸の奥で、言葉にならないものが、ゆっくりと、広がっていった。"]}, {"h": "七", "p": ["タケルは、長い夢から、覚めたようだった。", "最初に、感じたのは、石畳の冷たさだった。次に、誰かの、泣き声。誰かの、温かい手。", "目を、開けた。", "青空が、見えた。", "(俺は)", "頭の中が、静かだった。いつもの、柔らかな声が、消えていた。迷いを凪にしてくれる声が。代わりに、澄んだ空白が、あった。", "その空白に、記憶が、流れ込んできた。", "一枚。", "和平会談の席。白い石の間。丁寧に頭を下げた、鴉族と鬼族の使者たち。巻物を抱えた老いた鬼の、冗談めかした声。", "二枚。", "扉が、蹴破られる音。自分の口が、叫んでいた。『王を守れ！』", "三枚。", "倒れていく人々。翼を広げたまま崩れた若い鴉。笛が、床を転がる音。", "四枚。", "焼けた大地。根の洲。畑の跡。苗の炭。黒く崩れた畦。", "五枚。", "隊列が、手前から、消えていく。叫びもなく。部下たちの、懐の手紙が、風に舞った。", "「あ」", "喉から、声が、漏れた。", "「あ、あ、あ」", "体が、震えた。上体を起こそうとして、腕が、折れた。石畳に、手をついた。", "「俺は」", "声が、割れた。", "「俺は、何を」", "涙が、止まらなかった。叫びは、出なかった。言い訳も、出なかった。ただ、息だけが、嗚咽のように、漏れ続けた。", "どれくらい、そうしていただろう。", "やがて、タケルは、震える体を、起こした。這うように、向きを変えた。", "目の前に、青年がいた。", "継ぎ当ての外套。血に濡れた手。涙の跡の残る、疲れ切った顔。", "「俺は」", "タケルは、額を、地面に、擦りつけた。", "「お前を、殺そうとした」", "石畳に、額が、鈍く、ぶつかった。", "「助けてくれた、相手を」", "「あなたが、悪いんじゃない」", "オオナムチの声は、静かだった。", "「あの人に、そうさせられていたんだ」", "「それでも」", "タケルは、首を振った。額から、血が滲んだ。", "「剣を振ったのは、俺だ」", "オオナムチは、言葉を、失った。", "洗脳を、言い訳にしない。そういう人なのだと、胸の底に、静かに、落ちた。", "タケルは、ゆっくりと、体を回した。", "黒い外套の男が、立っていた。魔王の姿のまま、紅い目を、静かに伏せて。", "タケルは、その前に、膝をついた。", "「魔王ベルイザナ」", "声が、掠れた。", "「魔界を焼いたのは、俺だ」", "広場が、静まり返った。", "「会談の席で、刃を抜いた。何も知らずに、何千もの命を、奪った。全てを、思い出した」", "額が、再び、石畳に、触れた。", "「裁いてくれ」", "魔界側の列が、動いた。", "ミカヅチが、拳を握りしめて、一歩、前に出かけた。スサノが、牙を剥いて、低く唸った。ナキメの目が、冷たく、細まった。ハニヤスは、黙って、地面を見ていた。", "そして、杖をついた女が、目を閉じた。", "何も、言わなかった。ただ、随員の顔を、一人ずつ、思い浮かべているようだった。", "ベルは、長い間、タケルの後頭部を、見下ろしていた。", "誰も、息をしなかった。風さえ、止まった。", "やがて、ベルは、静かに、口を開いた。", "「裁きは」", "声は、低く、平らだった。", "「おまえを楽にするだけだ」", "タケルの肩が、震えた。", "「壊したものは、おまえの手で直せ」", "ベルは、続けた。", "「焼かれた大陸の土を、耕せ。折れた畦を、積み直せ。失われた者たちの、名を、覚えろ。魔界の民が、許すか、許さぬかは、その後に、民が決める」", "力以外の、統治。", "王の言葉は、命令ではなかった。ただ、道を、示しただけだった。", "タケルは、顔を上げた。", "涙に濡れた目が、魔王の紅い目を、見上げた。", "「……分かった」", "喉から、絞り出した。", "「俺の手で、直す」", "その背後で、ミカヅチの声が、響いた。", "「立って償え」", "低く、重かった。", "「倒れて終わるな。それが、鬼の流儀だ」", "スサノは、牙を収めて、鼻を鳴らした。", "「群れに戻る道があるなら、見極める。保留だ」", "ナキメは、涼しい顔で、小さく呟いた。", "「あの王の言霊は、死んで初めて解けた。記録が、必要ですね」", "ハニヤスが、短く言った。", "「土地は、待つ」", "それだけで、十分だった。", "広場の兵たちが、一人、また一人、槍を置き始めた。洗脳の解けた目が、自分の手を、見つめていた。何をしたのか、分かっている顔だった。", "その中で、最初に動いたのは、腰に炉ヶ岳の紋を刻んだ剣を下げた、若い兵だった。", "兵は、剣を、鞘ごと、石畳の上に、置いた。", "「……この剣を持つと」", "小さな声だった。", "「ずっと、考えが、澄んでいた。何かが、おかしいと、思っていたんです」", "隣の兵が、頷いた。", "「俺もだ」", "武器が、次々と、石畳に置かれていく。乾いた音が、朝の広場に、連なった。", "坂上の砦の旗が、風に、揺れた。", "比良坂の大穴の底から、細い光の筋が、立ち昇っている。朝日が、血に濡れた石畳を、金色に染めていた。", "オオナムチは、座り込んだまま、自分の掌を、見ていた。", "血が、乾きかけている。震えは、まだ、残っていた。", "その掌の上に、大きな手が、そっと、重なった。", "「半分ずつ、だ」", "ベルの声だった。", "「おまえが背負ったものの、半分は、私が持つ」", "オオナムチは、顔を上げた。", "魔王の目は、もう、紅くなかった。静かな、灰色に、戻っていた。", "「はい」", "青年は、泣き笑いで、頷いた。"]}]}, {"id": "epilogue", "label": "エピローグ", "title": "橋の上で", "chars": 4788, "sections": [{"h": "一", "p": ["根の洲の土は、まだ黒かった。", "タケルは鍬を振り下ろし、焦げた根を掘り起こした。三か月、毎日これを繰り返している。掌の豆は潰れ、また固まり、今は石のように硬い。", "「手が止まっているぞ」", "背後から、低い声が飛んだ。ミカヅチが腕を組んで立っている。角ヶ原から、毎朝ここまで通ってくる。監督役を、誰に頼まれたわけでもなく、自分から引き受けた男だった。", "「立って償え。倒れて終わるな」", "「分かっている」", "「分かっている者の手は、止まらん」", "タケルは、黙って鍬を握り直した。", "その時、鍬の先が、何かに触れた。炭の欠片とは違う、薄い手応えだった。膝をついて、土を払う。", "焼け焦げた紙の切れ端だった。", "端は炭になり、中ほどにだけ、文字が残っていた。右に流れる、不器用な字だった。", "『戦が終われば、英雄の凱旋で街が祝うそうだ。おまえにも土産を』", "息が止まった。", "(あの隊列の)", "名も知らない兵の、懐の手紙だった。消えた何千の中の、一人。タケルが「正義」と信じて連れてきた軍勢の一人が、娘に宛てて書いていた。", "紙の端に、宛名が、かろうじて読めた。", "「……ミサキへ」", "声に出して読んだ。喉が、震えた。", "続きは、ない。紙は、そこで途切れていた。", "「その手紙は」", "ミカヅチが、いつの間にか、隣に立っていた。", "「人間の兵のものだ」", "「ああ」", "「娘に、宛てたか」", "「……ああ」", "ミカヅチは、しばらく、黙っていた。それから、静かに言った。", "「届けに行け」", "タケルは、顔を上げた。", "「焼いたのは、おまえだ。ならば、届けるのも、おまえだ。足りぬ続きは、探せ。一生かけても」", "「はい」", "タケルは、紙を、胸の内側に、そっとしまった。", "(続きを、探す)", "それが、贖罪の、最初の一歩だった。"]}, {"h": "二", "p": ["ハルは、葛の里の井戸の縁に、座っていた。", "足をぶらぶらさせながら、道の先を眺めている。毎日、そうしてきた。今日も、来ないかもしれない。それでも、座っていた。", "土を踏む音がした。", "顔を上げると、栗色の髪の青年が、道の向こうから歩いてきた。腕に、白い腕章はない。少し痩せて、少し俯いて、それでも、まっすぐ、こちらへ歩いてくる。", "「……兄ちゃん」", "ハルは、井戸の縁から、飛び降りた。", "駆け出した。転びそうになりながら、青年の腰に、しがみついた。", "「ハル」", "ユウの声は、掠れていた。", "「ごめんな。ごめん」", "「兄ちゃん、兄ちゃん」", "ハルは、泣いていた。泣きながら、握りしめていた紙を、突き出した。", "「これ、持ってた。兄ちゃんの字。毎日、読んでた」", "擦り切れた手紙だった。折り目が、白く擦れている。", "「兄ちゃんの字だ」", "ユウは、その紙を受け取った。自分の書いた字を、ゆっくりと、指でなぞった。", "「頭の中が、静かなんだ」", "ぽつりと、言った。", "「ずっと、誰かの声が、してた。それが、ないと、時々、落ち着かない。でも」", "ハルの頭に、手を置いた。", "「この静けさのほうが、ずっと、いい」", "「兄ちゃん、元気？」", "ハルが、涙を拭って、尋ねた。", "ユウは、笑った。昔と同じ、人懐こい、少し下がった目尻で。", "「元気だよ」", "それは、オオナムチが、ハルに告げた約束と、同じ言葉だった。", "遠くの石垣の陰で、継ぎ当ての外套の青年が、そっと、背を向けた。口元が、緩んでいた。"]}, {"h": "三", "p": ["貧民区の小さな家の窓辺に、小さな鉢が置かれていた。", "ヒナは、毎朝、水をやってきた。三か月、一日も欠かさず。芽は、出なかった。母は、泣かないで待つのよ、と言った。だから、泣かなかった。", "その朝、鉢の土が、ほんの少し、盛り上がっていた。", "「お母さん」", "ヒナは、息を殺して、呼んだ。", "「お母さん、見て」", "ミオが、駆けつけた。鉢を覗き込む。", "土の割れ目から、小さな、緑の芽が、顔を出していた。", "「芽……」", "ミオの手が、口元を覆った。", "「お父さん」", "ヒナが、振り返った。", "戸口の椅子に、痩せた男が、座っていた。まだ、頬はこけている。記憶は、少しずつ戻っているが、時々、言葉に詰まる。今朝も、娘の誕生日の日付を、思い出せずにいた。", "男は、ゆっくり、鉢のそばへ来た。膝をついて、小さな芽を、見つめた。", "指先で、そっと、葉に触れた。", "「咲くよ」", "男は、言った。", "「お花が、咲いたら、帰ってくるって、言っただろう」", "「うん」", "「帰ってきたから、咲いたんだな」", "ヒナは、父の首に、抱きついた。", "「カズミ」", "ミオが、その名を、呼んだ。", "「カズミさん」", "男は、顔を上げた。", "「……ああ」", "しっかりした声だった。", "「そうだ。それが、僕の名前だ」", "三人の影が、朝日の中で、一つに重なった。"]}, {"h": "四", "p": ["同盟の儀の前夜、黄泉津の宮の広間は、静まり返っていた。", "オモイカは、杖を卓に立てかけ、一人、座っていた。", "卓の上には、杯が十四。まだ、酒は、注がれていない。", "扉が、静かに開いた。ベルが、入ってきた。何も言わず、隣の席に、腰を下ろした。", "オモイカは、長い間、杯を見つめていた。", "三か月、口にできなかった。喉が、固く閉じて、声にならなかった。", "けれど、今夜なら、言える気がした。", "「ササラ」", "最初の杯に、そっと、酒を注ぎながら、呟いた。", "「嵐狼の、笛吹き。下手な笛を、いつも、吹いていました。調子が外れていると、皆に笑われて、それでも、やめなかった」", "声が、震えた。それでも、続けた。", "「フミト」", "次の杯に、酒を注ぐ。", "「老いた鬼の、書記。冗談の好きな方でした。私の顔が怖いと、いつも、言って」", "三つ目の杯を、持ち上げた。", "「ツバメ。若い鴉。荷を、いつも、一番多く担いで。故郷の畑に、いつか、帰ると」", "酒が、杯の縁に、こぼれた。", "「それから」", "声が、掠れた。", "「それから、十一人」", "名は、全員、覚えている。一人ひとりの顔も、好物も、故郷も。けれど、全てを口にすれば、今夜が、終わってしまう気がした。数で、語った。それが、今の、精一杯だった。", "ベルは、何も、言わなかった。", "ただ、隣で、一つずつの杯を、静かに、見つめていた。一人ずつの名を、胸に刻むように。", "やがて、ベルが、低く言った。", "「私は、おまえの随員たちの顔を知らなかった。名もだ」", "「存じております」", "オモイカは、微笑んだ。涙が、頬を、伝っていた。", "「ですから、今、お伝えしました。これで、ベル様も、ご存じです」", "「ああ」", "ベルは、頷いた。", "「ササラ。フミト。ツバメ。……覚えた」", "オモイカは、もう、声が出なかった。ただ、深く、頭を下げた。", "「申し訳ありません」", "「それより」", "ベルの声が、柔らかかった。", "「次の手を、聞かせてくれ」", "オモイカは、泣きながら、笑った。", "「はい。まず、明日の、席次から」"]}, {"h": "五", "p": ["衢の里の広場には、白い石の円卓が、据えられていた。", "ベルは、卓の前に、立っていた。", "円の周りに、席が並ぶ。エルフの女王クシナダ。ドワーフ王イシコリドメ。亜人の王サルタヒコ。人族議会の代表は、洗脳の解けた老議員だった。魔界側には、四天王とオモイカ。立会人の席に、クナドが、静かに控えている。", "「これより、同盟の儀を行います」", "クナドの声が、広場に、響いた。", "条項が、読み上げられた。両界の不可侵。交易の再開。大穴、比良坂の共同管理。被害の補償と、復興への協力。", "読み終えると、沈黙が、落ちた。", "最初に口を開いたのは、人族の老議員だった。", "「人族は、魔界に、取り返しのつかぬ非礼を働いた」", "深く、頭を下げた。", "「会談の席で、刃を抜いた。和平を望んだ使者たちを、殺した。その罪は、我らのものだ」", "ベルは、その白髪の頭を、しばらく、見ていた。", "「面を上げられよ」", "静かに、言った。", "「こちらも、多くを焼いた」", "広場が、ざわめいた。", "「根の洲で、私は人の軍勢を跡形もなく消した。顔を見ようともしなかった。あの兵たちにも家族がいた。それを、今は知っている」", "ベルは、老議員に、頭を下げた。", "魔王が、人の前に、頭を垂れた。", "「詫びる」", "双方の席から、息を呑む音が、聞こえた。", "クシナダが、静かに、微笑んだ。イシコリドメが、赤い髭の下で、満足げに頷いた。サルタヒコが、大きな掌で、膝を叩いた。", "「よし！ 決まりだ！」", "羊皮紙に、署名が、並んでいく。ベルの名は、命令ではなく、対等の約束として、記された。ミカヅチの名。スサノの名。ナキメの名。ハニヤスの名。そして、人族の代表の名。", "最後の筆が、置かれた時、広場に、風が、吹き抜けた。", "(前王の頃の体制に、戻った)", "いや、それ以上だ、とベルは思った。", "境界は、もはや、見張り合う場所ではなかった。"]}, {"h": "六", "p": ["収穫祭の夜、埴の里の畑は、灯りで満ちていた。", "長い卓が、畑のそばに、いくつも並べられている。鬼の祭り酒の樽。土蜘蛛の新米の団子。嵐狼の干し肉。鴉族の屋台の甘い煙。", "そして、その卓に、混ざり合って座る人々。", "人間。エルフ。ドワーフ。亜人。鬼。嵐狼。鴉。土蜘蛛。種族の席は、どこにも、分かれていなかった。", "オオナムチは、卓の端で、居心地悪く、座っていた。", "「真の勇者殿」", "そう呼ぶ声が、あちこちから、聞こえた。祭り上げようとする、善意の声だった。", "「その呼び名は」", "オオナムチは、そのたびに、首を振った。", "「俺は、勇者じゃありません。ただの、冒険者です」", "「謙遜を」", "「違うんです」", "困り果てていると、隣の席で、老人が、杖で、卓を叩いた。", "「いけませんぞ。無理強いは」", "ヒエダだった。杖をついて、傷の癒えた体で、小言を飛ばしている。", "「本人が、望まぬ称号を、押しつけるのは、洗脳と同じじゃ」", "「……そういうものですか」", "「そういうものじゃ」", "周りが、笑った。", "向かいの席では、コノハが、そっぽを向いて、団子をかじっている。その隣で、スクナが、にやにやしていた。カナメが、鬼の若者と、腕相撲をしている。コトシロが、記録官の制服で、静かに杯を傾けている。ウズメが、尻尾を揺らして、嵐狼の子どもたちと、走り回っていた。", "(みんな、いる)", "胸が、いっぱいだった。", "「オオナムチ」", "呼ばれて、顔を上げた。", "ベルが、杯を持って、立っていた。", "「盃を交わそう」", "オオナムチは、立ち上がった。手に、鬼族の祭り酒の瓶を取る。", "「俺に、注がせてください」", "「ああ」", "ベルは、杯を、差し出した。", "瓶を傾けると、琥珀色の酒が、杯に、注がれた。注ぐ側と、受ける側。かつて、守られる側だった青年が、今は、注ぐ側に、立っていた。", "ベルは、その杯を、見つめた。", "「思い出した」", "静かに、言った。", "「和平が成れば、収穫祭に、人間を招けるだろうか、と。私は、そう言った」", "「はい」", "「叶った」", "ベルは、杯を、掲げた。", "「仲間になりたそうな顔で見ていたのは、私のほうだったかもしれぬな」", "オオナムチは、笑った。", "「最初から、仲間だっただろう」", "二人の杯が、軽く、触れ合った。澄んだ音が、収穫祭の灯りの中に、響いた。", "「半分ずつだ」", "「半分ずつ、ですね」", "人も、魔族も、一斉に、杯を掲げた。笑い声と、歌声が、赤い空に、昇っていった。"]}, {"h": "七", "p": ["夜明け前、比良坂の縁に、二つの影が、並んで立っていた。", "ベルは、大穴を、見下ろした。", "底は、闇の中だった。けれど、風は、もう、冷たくなかった。下から吹き上げてくる風に、土と、稲穂と、煙の匂いが、混ざっている。", "境ではなく、橋になったのだ、と思った。", "「ベルさん」", "隣で、オオナムチが、言った。", "「俺、思うんです」", "「何を」", "「あの大穴の底に、まだ、何かある気がして」", "ベルは、青年の横顔を見た。", "「五つ目の窪みが、まだ、暗いままで」", "青年は、笑った。", "「いつか、そこへ、行ってみたいなって」", "「そうか」", "ベルは、静かに頷いた。", "背後で、足音がした。クナドが、静かに、礼をしていた。夜の色の目が、わずかに、細まっている。", "何も、言わなかった。けれど、その眼差しは、いつか訪れる日を、待っているようだった。", "東の空が、白み始めた。", "赤い黄泉の空と、青い葦原の空が、地平の彼方で、一本の線を結んでいる。大穴は、二つの世界を隔てる傷ではなく、繋ぐ道の、入口になっていた。", "遠く、底の方で、何かが、かすかに、瞬いた。", "五つ目の窪みの光だったのかもしれない。誰にも、分からなかった。", "ただ、朝焼けの中で、二人は、並んで立っていた。", "魔王と、真の勇者。", "仲間になりたそうな顔で、お互いを、見ていた二人が。", "橋の上で。", "完結"]}]}]}, {"name": "寄り道の章", "note": "本編の章のあいだにある、もう一つの時間（第一・五章は第一章のあと、という具合）", "items": [{"id": "ch01_5", "label": "第一・五章", "title": "避難の夜", "chars": 9554, "sections": [{"h": "一", "p": ["王の背中が、赤い空の下に、小さくなっていった。", "ハニヤスは、畦に立ったまま、それを見送った。振り返らない背中だった。片手を軽く上げたきり、一度も。", "足もとで、槌が落ちた跡が、土に浅く残っていた。その脇に、小さな芽が一本。王が、最後に、踏まずに避けた芽だ。", "(民は、直せん)", "自分で言った言葉が、まだ、喉の奥に残っていた。", "ハニヤスは、鍬を、肩に担ぎ直した。", "「集まれ」", "声は、大きくなかった。けれど、畑じゅうの土蜘蛛が、手を止めて、顔を上げた。卓を運んでいた若衆。酒樽を下ろしていた鬼族の荷車引き。泥だらけの顔で走り回っていた、嵐狼の子どもたち。", "誰も、何も聞かなかった。王の顔を見ていた者は、もう、分かっていた。", "「人の王が、和平の席で、刃を抜いた。軍勢が、大穴を越えてくる」", "畑が、しんと静まった。", "「年寄りと、子どもから、先に。宮の裏の、岩の洞へ。荷は、持てるだけでいい。食い物と、水と、薬だ」", "「畑は」", "若衆の一人が、震える声で聞いた。", "「稲は、まだ、刈ってない」", "ハニヤスは、段々の田を、見渡した。実り始めた稲穂が、夕陽の中で、金色の波を作っていた。何年もかけて、地脈を整え、瘴気を土の底へ押し戻してきた畑だ。", "「畑は、後で直せる」", "ハニヤスは、王に言ったのと、同じことを言った。", "それから、少しだけ、言葉を足した。", "「畦を歩け。芽を、踏むな」", "若衆が、目を瞬いた。", "「こんなときに、ですか」", "「こんなときだから、だ」", "ハニヤスは、さっきの芽を、顎で示した。", "「王が、踏まずに行った」", "誰も、それ以上、聞かなかった。", "老人たちが、孫に手を引かれて、畦を歩き出した。荷車引きの鬼が、腰の曲がった土蜘蛛の婆を、肩に担いだ。嵐狼の子どもたちは、泥だらけの顔のまま、母親の裾をつかんで、黙って歩いた。", "誰も、畦を外れなかった。", "ハニヤスは、最後まで、畑に残った。", "収穫祭の卓が、夕陽の中に並んでいた。三日後の祭りのために、皆で運んだ卓だ。端には、鬼族の酒樽が、封を切らずに積まれている。卓の上には、まだ、何も置かれていない。", "誰の座る席も、空いたままだった。", "ハニヤスは、卓に布をかけた。一つずつ。埃が積もらないように。それから、鍬を担いで、畦を下りた。", "背後で、稲穂が、風に鳴っていた。"]}, {"h": "二", "p": ["大穴の縁の回廊の出口で、ナキメがオモイカを見つけたのは、日が落ちてからだった。", "ナキメは、言伝を受けた瞬間に、宮を飛び立っていた。遠い大穴の方角へ、翼を休めずに飛んだ。魔界側へ続く回廊の出口に降りて、翼を畳む間もなく、暗がりへ走った。", "石の床に、血の跡が、点々と続いていた。", "その先に、オモイカが、壁にもたれて座っていた。両手で、腹を押さえている。指の間から、黒い血が、ゆっくりと滲み出していた。", "「オモイカ」", "ナキメは、膝をついた。", "「……ナキメ」", "オモイカが、顔を上げた。唇が、白かった。", "「言伝は、届きましたか。王に」", "「届いています。宮じゅうに、聞こえました」", "「そう、ですか」", "オモイカは、目を閉じた。", "ナキメは、オモイカの手を、そっと腹から外した。傷を見て、息を詰めた。刃の傷だった。深い。けれど、急所は、わずかに逸れている。誰かが、身をよじらせてくれたのか。それとも、押されたときに、刃が滑ったのか。", "「動かないでください。今から、血を止めます」", "ナキメは、指先に、言霊を集めた。癒やしは、鴉族の得意ではない。それでも、心に触れる術を磨くうちに、体の傷を塞ぐ術も、少しは覚えた。", "温かい光が、傷口を包んだ。", "オモイカの体が、小さく跳ねた。", "「痛みますか」", "「いいえ」", "嘘だった。オモイカは、嘘を見抜く女だ。そして、自分の嘘だけは、見抜かれても構わないという顔をする。ナキメは、それを、よく知っていた。", "血が、少しずつ、止まっていった。", "「……随員は」", "オモイカが、目を閉じたまま、言った。", "ナキメは、手を止めなかった。", "「後で、聞きます」", "「いいえ。今、言わせてください」", "オモイカの声は、掠れていた。", "「十四人です。会談の間に、入ったのは。私を入れて、十五人。戻ったのは、私だけです」", "ナキメは、何も言えなかった。", "「笛を吹いていた子がいました。調子が外れていると、皆に笑われていた子です。巻物を抱えていた、書記がいました。荷を担いでいた、若い鴉がいました。それから」", "声が、途切れた。", "ナキメは、オモイカの顔を見た。オモイカは、唇を噛んでいた。何かを、言おうとして、言えないでいる。", "名だ、と、ナキメは気づいた。", "この女は、十四人の名を、全部、覚えている。家族の数も、好物も。その名を、今、口にしようとして、喉で止めている。", "「言わなくて、いいです」", "ナキメは、静かに言った。", "「今は、言わなくて」", "「……言えば」", "オモイカは、かすかに笑った。", "「声が、震えます。震えれば、言霊が乱れます。会談の間で、そう思って、口にしませんでした。今は、言霊なんて、唱えていないのに」", "ナキメは、オモイカの肩を、そっと支えた。", "「宮へ、運びます。そのあとで、四天王に、言伝を回してください。王は、各種族の安全を確かめてから来い、と」", "「王は」", "「先に、行かれました。一人で」", "オモイカの目が、開いた。", "その目に、何が映ったのか、ナキメには、分からなかった。ただ、オモイカは、それきり、何も言わなかった。"]}, {"h": "三", "p": ["嵐ヶ峰の北の斜面を、スサノは、下っていた。", "背に、子どもを一人、負っていた。耳の聞こえない嵐狼の子だ。寄り添いの里から、根の洲寄りの村へ、祭りの干し肉を届けに来ていた。そこで、言伝の騒ぎに巻き込まれた。", "前を、群れの者たちが歩いていた。", "嵐狼の群れは、本来、速い。峰から峰へ、半日で駆け抜ける。けれど、今日の群れは、遅かった。片足を引きずる老いた雄がいる。目の見えない雌がいる。腹の大きな者がいる。熱を出した幼い者を、母親が抱いている。", "群れの若い雄が、何度も、振り返った。", "「長。このままじゃ、夜明けまでに、峰を越えられません」", "「分かっている」", "「足の速い者だけ、先に行かせては。遅い者は、あとから」", "スサノは、答えなかった。", "群れの掟では、そうするのが、正しい。ついて来られない者は、置いていく。群れ全体が生き延びるために。昔から、そうだった。", "昔、吹雪の峰で、スサノも、従った。", "(二度と、せん)", "「遅い者に、歩幅を合わせろ」", "スサノは、低く唸った。", "「誰も、置いていかん。それが嫌なら、おまえが先に行け。止めはせん」", "若い雄は、口をつぐんだ。それから、黙って、片足を引きずる老いた雄の脇に回り、肩を貸した。", "背中の子が、スサノの肩を、とんとんと叩いた。", "スサノは、足を止めずに、首だけ振り向いた。子どもは、小さな手で、形を作っていた。", "(王様は？)", "市場で、団子を食べていた王の顔を、この子は、覚えているのだろう。泥のついた頬を、手で教えてやった、あの頭巾の客を。", "スサノは、答えに詰まった。", "手話は、得意ではない。里の子どもたちに、少しずつ教わっただけだ。それに、答えを、知らなかった。", "王は、一人で、大穴へ向かった。それしか、分からない。", "スサノは、片手で、ゆっくりと形を作った。", "(王様は、先に行った。俺たちは、あとから行く)", "子どもは、じっと、その手を見ていた。それから、こくりと、うなずいた。", "(王様、強い)", "子どもの手が、そう言った。", "スサノは、前を向いた。", "強い。そのとおりだ。あの王は、誰よりも強い。", "それなのに、胸の奥が、ざらついていた。広間で、杯を傾けながら、人間を収穫祭に招けるかと聞いた、あの顔を思い出した。", "(あいつは、一人で、何を背負いに行った)", "夜半、群れは、峰の中腹の岩陰で、足を止めた。", "熱を出した幼い者が、母親の腕の中で、浅い息をしていた。片足を引きずる老いた雄は、岩に背をもたせかけたまま、目を閉じていた。誰も、口を利かなかった。風が、峰の稜線を、低く鳴らしていた。", "スサノは、背から子どもを下ろした。", "子どもは、眠っていなかった。大きな目で、スサノを見上げていた。それから、小さな手で、また、形を作った。", "(長は、寝ないの)", "(見張りだ)", "スサノは、ぎこちなく、手を返した。", "子どもは、首をかしげた。それから、スサノの脇に、ぴたりと体を寄せて、座り込んだ。毛皮の外套の端を、小さな手で、握りしめた。", "(じゃあ、ぼくも、見張り)", "スサノは、何も返さなかった。返せなかった。", "吹雪の峰の夜を、思い出していた。あの夜も、こうして、岩陰にいた。群れの長だった父が、言った。夜明けには、出る。ついて来られない者は、置いていく。", "足の弱い妹は、何も言わずに、うなずいた。", "夜明けに、群れは出た。スサノは、何度も、振り返った。そのたびに、大人たちに、首を咬まれた。最後に振り返ったとき、雪の中に、小さな影が、座っていた。手を振っていたのか、振っていなかったのか。吹雪で、見えなかった。", "それきりだった。", "(二度と、せん)", "あの朝から、何度、そう誓ったか分からない。誓うたびに、胸の奥の、同じ場所が、ざらついた。", "脇で、子どもの頭が、こくりと揺れた。見張りをすると言った子は、外套の端を握ったまま、眠っていた。", "スサノは、外套の前を、少しだけ開いて、子どもの体を、包んだ。", "峰の下のほうで、遠く、何かが燃える赤い光が見えた。根の洲の方角だった。スサノは、その光を、一晩じゅう、見ていた。", "明け方、群れは、また、遅い歩みで、峰を越えていった。誰も、置いていかれなかった。夜明けまでには、峰の向こうへ、間に合わなかった。それでよかった。"]}, {"h": "四", "p": ["熱が、出ていた。", "オモイカは、宮の一室の寝台で、天井を見ていた。見ているつもりで、何も見えていなかった。目を閉じると、会談の間が、浮かんでくる。", "白い石の壁。アマツ王の、柔らかな声。", "――終わりにしましょう。", "あの笑みが、深くなった瞬間を、見ていた。見抜いた。遅かった。", "扉が、外から蹴破られた。鎧の軍勢。勇者の、澄んだ声。王を守れ、と。", "書記の老いた鬼が、前に立った。巻物が、宙に舞った。", "一人。また一人。", "オモイカは、寝台の上で、拳を握った。", "背に、手が触れた。", "あの手を、何度も、思い出そうとした。強い力だった。押されて、床の割れた縁の向こうへ、転がり落ちた。", "行ってください、どうか――。", "声は、途中で途切れた。", "誰の手だったのか。", "オモイカは、随員の顔を、一つずつ、思い浮かべた。あの時、自分の背後に、誰が立っていたか。笛の青年か。書記か。若い鴉か。それとも、ほかの誰かか。", "分からなかった。", "見抜く目だけが、取り柄だった。人の嘘も、本当も、顔を見れば分かった。会談の間でも、王の目の奥の温度のなさを、見ていた。", "それなのに、自分を押した手の持ち主だけは、見ていなかった。", "背中に、目はない。", "(誰の手だったか、分からない)", "それが、何より、苦しかった。", "礼を言う相手が、分からない。詫びる相手が、分からない。十四人の誰もが、その手の持ち主だったかもしれない。十四人の誰もが、そうではなかったかもしれない。", "オモイカは、寝台の上で、十四の顔を、順に、思い浮かべた。", "笛の調子が外れていた青年。巻物を抱えていた書記。荷を担いでいた若い鴉。それから、十一人。", "名は、呼ばなかった。", "呼べば、震える。そう思って、会談の間で、呼ばなかった。今も、呼べない。呼べば、自分の中の何かが、崩れてしまう気がした。", "それでも、顔だけは、一つも、零さなかった。", "(覚えています。全員)", "心の中で、そう言った。", "熱の向こうで、誰かが、扉を開ける気配がした。ナキメの翼の音だった。", "「スサノの群れが、峰を越えました。ハニヤスの民は、洞に。ミカヅチは、根の洲の東へ、民を迎えに出ています」", "ナキメの声は、平らだった。報告の声だ。オモイカは、目を開けた。", "「……王からは」", "ナキメは、少し、間を置いた。", "「何も」"]}, {"h": "五", "p": ["根の洲の東の村は、燃えていた。", "ミカヅチは、丘の上から、それを見下ろした。", "藁葺きの屋根が、一つ、また一つと、崩れていく。畑の畦が、黒く焦げている。人間の軍勢は、もう、そこにはいなかった。焼くだけ焼いて、先へ進んだのだ。", "「頭」", "背後で、鬼の若い衆が、声をかけた。", "「村の者は」", "「探せ」", "ミカヅチは、丘を駆け下りた。", "燃え残った家の陰に、土蜘蛛の老夫婦がいた。井戸の底に、嵐狼の子が三人、隠れていた。畑の溝に伏せて、煙をやり過ごしていた鬼の娘がいた。", "一人ずつ、引き上げた。一人ずつ、背に負った。", "「ほかの者は」", "ミカヅチが聞くと、老夫婦の夫のほうが、震える指で、西を指した。", "「境の荒れ地のほうへ、逃げていきよった。鴉の一家も、いくつか。人の土地のほうへ、古い地下の道があると」", "ミカヅチは、眉をひそめた。", "人間の土地へ、逃げた。人間の軍勢から逃げるために、人間の土地へ。", "追う手は、なかった。軍勢の背後を突っ切ることになる。ミカヅチ一人なら、行ける。けれど、背に負った者たちを、置いてはいけない。", "「……無事でいろよ」", "ミカヅチは、西の空に向かって、小さく言った。", "燃える村の匂いが、鼻の奥に、こびりついた。", "その夜、民を連れて、埴の里へ向かう途中で、ミカヅチは、角ヶ原の若い衆の一人に、聞かれた。", "「頭。王は、どこに」", "「先に行かれた。大穴の、こちら側へ」", "「一人で、ですか。軍勢は、一万を超えていると」", "「そうだ」", "若い衆は、口をつぐんだ。それから、思い切ったように、言った。", "「頭は、王と、一騎討ちをしたことがあるんですよね。王の一撃を、受けきったって。だったら、頭なら、分かるでしょう。王は、勝てますか。一人で、一万に」", "ミカヅチは、答えなかった。", "一騎討ちの記憶が、蘇った。全てをぶつけて、王の一撃を、受けきった。鬼族の頭領として、生涯の誇りだった。", "勝てるか、と聞かれれば、勝てる、と答える。あの王が、負けるはずがない。", "けれど、別のことが、胸に引っかかっていた。", "広間で、杯を傾けていた顔。人間を収穫祭に招けるか、と聞いた顔。酒が三倍要るぞと答えたら、三倍で済むなら安いものだと笑った顔。", "あの顔のまま、一万の軍勢の前に立てるのだろうか。", "「勝つ」", "ミカヅチは、短く答えた。", "「だから、俺たちは、民を運ぶ。王が戻ったとき、一人でも欠けていたら、顔向けができん」", "若い衆は、うなずいた。", "ミカヅチは、背負った鬼の娘を、揺すり上げた。娘は、ミカヅチの角に、小さな手でしがみついていた。"]}, {"h": "六", "p": ["二日目の夜、オモイカは、寝台の上で、帳面を開いていた。", "「寝ていてください」", "ナキメが、何度目かの言葉を、繰り返した。", "「熱が、下がっていません。傷も、まだ」", "「分かっています」", "オモイカは、筆を置かなかった。", "膝の上の帳面には、名が、並んでいた。埴の里の洞に着いた者。嵐ヶ峰の峰を越えた者。根の洲の東の村から、ミカヅチが背負ってきた者。ナキメの鴉が、一刻ごとに運んでくる名を、オモイカは、一つずつ、書き写していた。", "土蜘蛛の婆。その孫が二人。嵐狼の、片足を引きずる老いた雄。腹の大きな雌。鬼の娘。", "名の横に、家族の数を書いた。どこの村から来たか。誰と、はぐれたか。", "「どうして、今なのですか」", "ナキメが、静かに聞いた。", "「明日でも、書けます。皆、もう、逃げ終えているのですから」", "オモイカは、筆を止めた。", "「明日になれば、また、誰かが、誰かを探し始めます」", "声は、掠れていた。", "「父は、どこへ行ったか。妹は、どの洞にいるか。そのとき、ここに名があれば、すぐに答えられます。名がなければ、探す者は、一つずつ、洞を回るしかない」", "「それは、そうですが」", "「それに」", "オモイカは、帳面を、見下ろした。", "「生きている者の名は、書けるのです」", "ナキメは、口をつぐんだ。", "オモイカの指が、帳面の端を、そっと押さえていた。書き終えた名の列の、いちばん下。何も書かれていない、白い余白。", "そこに、十四の名を、書くことはできなかった。", "書けば、声に出すのと、同じだった。筆が、震える。震えれば、ほかの名まで、乱れてしまう。", "だから、生きている者の名だけを、書いた。一つも、零さないように。一つも、間違えないように。", "「根の洲の東の村の者が、何人か、足りません」", "オモイカは、言った。", "「鴉族の一家が、二つ。土蜘蛛の家が、一つ。ミカヅチの話では、境の荒れ地のほうへ、逃げたと」", "「人間の土地へ、ですか」", "「古い地下の道があるそうです。人の森へ、抜ける道が」", "ナキメの翼が、かすかに揺れた。", "「……無事なら、よいのですが」", "「無事なら、いずれ、名が届きます」", "オモイカは、帳面の、別の頁を開いた。そこに、まだ着いていない者たちの名を、書いた。鴉族の父と、娘が二人。土蜘蛛の夫婦と、息子が一人。", "名の横に、何も書かなかった。着いた日を書く欄を、空けておいた。", "「書いておけば、待てます」", "オモイカは、筆を置いた。", "「名があれば、待てるのです」", "ナキメは、しばらく、何も言わなかった。それから、オモイカの手から、そっと帳面を取り上げた。", "「では、今夜の分は、私が続けます。鴉が、まだ、名を運んできますから」", "「……ナキメ」", "「あなたは、眠ってください。参謀が倒れたら、王が戻られたとき、次の手を、誰が申し上げるのですか」", "オモイカは、目を瞬いた。", "それから、小さく、息を吐いた。笑ったのかもしれなかった。", "「……承知しました」", "寝台に、背を預けた。目を閉じると、また、会談の間が浮かんできた。けれど、さっきより、少しだけ、遠かった。", "ナキメの筆の音が、静かに、部屋に響いていた。一つ。また一つ。生きている者の名が、帳面に、増えていった。"]}, {"h": "七", "p": ["三日目の朝、ナキメは、宮の塔の上にいた。", "空に、鴉を飛ばしていた。鴉族の目を、遠くまで届かせる術だ。鴉の見たものが、ナキメの目の裏に、淡く映る。", "根の洲の丘陵が、見えた。", "黒い土。骨のように立つ木の幹。その上を、人間の軍勢が、整然と進んでいた。足並みは、乱れない。誰も、口を利かない。", "一万を、超えている。", "その前方の稜線に、一つの影があった。", "ナキメは、息を止めた。", "影は、歩いていた。外套の頭巾を被らず、黒い髪が、風もないのに揺れている。額の脇に、黒い角。背には、畳まれた黒い翼。", "王だった。", "鴉の目は、遠かった。顔までは、見えなかった。けれど、ナキメには、分かった。あの歩き方を、知っている。畑の畦を踏まないように歩く、あの足の運びを。", "軍勢の前で、矢が放たれた。", "鴉の目の中で、矢が、空中で止まった。落ちた。", "それから、ナキメは、見た。", "手前から順に、静かに、隊列が、消えていくのを。", "叫びは、聞こえなかった。鴉の耳にも、届かなかった。血の色も、なかった。ただ、人が、いなくなっていく。黒い土の上に、何も残さずに。", "ナキメは、塔の手すりを、握りしめた。膝が、震えていた。", "王の前に立つと、いつも、膝が震える。底が見えない。見えないのに、嘘がない。その矛盾が、体を震わせる。", "けれど、今の震えは、違った。", "(静かすぎる)", "怒りの気配が、なかった。憎しみの気配も。王の周りの空気は、凪いだ水面のように、何も映していなかった。", "それが、何より、恐ろしかった。", "戦場で、怒り狂う魔王なら、ナキメは、恐れなかっただろう。けれど、あの王は、怒っていない。悲しんでもいない。ただ、静かに、歩いている。", "まるで、何かを、自分の中から、締め出しているように。", "ナキメは、鴉の目を、閉じた。", "それ以上、見てはいけない気がした。王が、誰にも見られたくないものを、今、している。そう思った。", "塔の下から、ミカヅチの若い衆の、駆ける足音が聞こえた。", "「ナキメ様。頭が、根の洲へ向かわれました。避難は、終わったと、王に伝えに」", "ナキメは、振り向かなかった。", "「……そうですか」", "声が、少しだけ、掠れた。", "「急ぐように、伝えてください。王は、一人で、立っておられます」"]}, {"h": "八", "p": ["ミカヅチは、根の洲の丘陵を、駆けていた。", "焼けた土が、足の下で、崩れた。角ヶ原から、休まずに走ってきた。民は、全員、埴の里に着いた。ハニヤスの洞にも、スサノの峰にも、一人の欠けもない。東の村から西へ逃げた者たちのことだけが、胸に刺さっていた。", "それでも、報告しなければならなかった。", "各族とも、無事です、と。", "丘の稜線が、近づいてきた。", "その向こうから、何の音も、聞こえなかった。", "ミカヅチは、足を緩めた。", "おかしい、と思った。一万を超える軍勢が、この丘の向こうにいるはずだった。鎧の擦れる音。馬のいななき。隊長の号令。何も、聞こえない。", "風だけが、吹いていた。", "焦げた匂いを運んでくるはずの風が、何も、運んでこなかった。", "ミカヅチは、稜線に向かって、一歩ずつ、歩いた。", "戦場の匂いを、知っている。屍の山も、血の川も。鬼族の頭領として、数え切れない戦を見てきた。", "その匂いが、しなかった。", "(何が、あった)", "稜線の、すぐ手前で、ミカヅチは、立ち止まった。", "一騎討ちの日を、思い出した。全てをぶつけ、王の一撃を、受けきった。あの日、王は、笑っていた。よく受けた、と。", "あの笑顔を、もう一度、見られるだろうか。", "ミカヅチは、拳を握った。それから、稜線の上に、足をかけた。"]}, {"h": "九", "p": ["三日目の夕方、埴の里の段々田は、民で埋まっていた。", "ハニヤスは、畑の真ん中に立っていた。", "洞から出てきた者たち。峰を越えてきた嵐狼の群れ。ミカヅチが根の洲の東から連れてきた、焼け出された村の者たち。鴉族の家族が、木の枝に並んで、翼を畳んでいた。", "誰も、畦を外れていなかった。", "誰が言ったわけでもない。けれど、皆、細い畦の上に、身を寄せ合って座っていた。稲の間には、一人も、踏み入っていなかった。", "今日は、収穫祭の日だった。", "三日前に、皆で並べた卓が、夕陽の中に、そのまま並んでいた。ハニヤスがかけた布の上に、薄く、土埃が積もっていた。", "祭りの支度は、何もしていない。酒樽は、封を切らずに、積まれたままだ。新米の団子も、蒸していない。笛も、太鼓も、鳴っていない。", "誰の座る席も、空いたままだった。", "ハニヤスは、卓の端に、立った。", "そのとき、土蜘蛛の婆が、畦から、そろそろと下りてきた。三日前、荷車引きの鬼に担がれて、洞へ逃げた婆だ。手に、欠けた椀を、一つ、持っていた。", "婆は、卓の上の布を、少しだけめくった。そこに、椀を、一つ、置いた。", "何も、入っていない椀だった。", "婆は、何も言わずに、畦へ戻っていった。", "しばらくして、嵐狼の母親が、子どもの手を引いて、下りてきた。子どもが、小さな木の椀を、一つ、卓に置いた。", "それから、鬼の荷車引きが。鴉族の若い娘が。ミカヅチに背負われてきた、焼け出された村の老夫婦が。", "一人、また一人。", "誰も、何も言わなかった。ただ、空の椀を、一つずつ、卓に置いていった。", "ハニヤスは、黙って、それを見ていた。", "椀は、少しずつ、増えていった。卓の端から、端まで。王の座るはずだった、上座の前にも。", "(帰ってくる者の、席だ)", "誰が始めたのかは、分からない。けれど、皆、知っていた。この椀は、帰ってくる者のためのものだ。王のため。オモイカのため。会談の間から、戻らなかった者たちのため。", "耳の聞こえない嵐狼の子が、スサノの背から下りて、卓の前に立った。", "子どもは、椀を持っていなかった。代わりに、両手を、ゆっくりと動かした。", "(おかえりなさい)", "誰に向けたのか、分からなかった。ただ、空いた席の前で、子どもは、何度も、その形を作った。", "「祭りは、延ばす」", "ハニヤスは、畦の皆に、聞こえるように言った。", "「王が、戻るまでだ。椀は、そのまま、置いておけ」", "ハニヤスは、卓の端の、何も置かれていない場所に、自分の鍬を、そっと立てかけた。", "赤い空の端が、暗くなっていった。", "遠く、大穴の方角から、風が吹いてきた。何も運ばない、静かな風だった。", "ハニヤスは、畑に立ち続けた。", "土は、黙っているが、忘れはせん。あなたが何を選んでも、俺は、あなたの畑に立っている。", "三日前に、王の背中に向かって、そう言った。", "その言葉のとおりに、ハニヤスは、夜が更けるまで、そこに立っていた。"]}]}, {"id": "ch02_5", "label": "第二・五章", "title": "牢の粥", "chars": 9551, "sections": [{"h": "一", "p": ["ヒサメが根の洲の丘に着いたのは、日が傾きかけたころだった。", "角ヶ原の若い鬼が、十人。頭領のミカヅチに呼ばれて、走ってきた。戦だと聞いていた。人間の軍が、万を超えて攻めてくると。金棒を担ぎ、角を研ぎ、息を切らして駆けつけた。", "丘の上には、何もなかった。", "ヒサメは、稜線で足を止めた。後ろの仲間も、次々と止まった。誰も、口を開かなかった。", "焼けた黒い土が、どこまでも続いていた。骨のような木の幹が、ところどころに立っている。それだけだった。軍勢はいない。屍もない。血の匂いもしない。鎧の破片ひとつ、落ちていない。", "風が吹いていた。何も運ばない風だった。", "「……戦は」", "隣の鬼が、かすれた声で言った。", "「終わった」", "丘の中ほどから、ミカヅチの声がした。頭領は、背を向けたまま、立っていた。その足元に、人間が六人、膝をついていた。", "「王が、終わらせた」", "ヒサメは、言葉の意味が、すぐには分からなかった。", "終わらせた。一人で。万を超える軍を。", "それなのに、何も残っていない。", "「こいつらを、宮の牢へ運べ」", "ミカヅチが、振り返った。頭領の顔は、ヒサメが見たことのない色をしていた。怒っているのでも、勝ち誇っているのでもない。何か、重いものを、飲み込んだような顔だった。", "「王命だ。傷つけるな。飢えさせるな。必要なものは、与えろ」", "「は」", "ヒサメは、膝をついた人間たちに近づいた。", "五人は、目を開けていた。立つ力を奪われて、ただ、地面を見つめている。誰も、抵抗しなかった。抵抗する力が、残っていないのだ。", "六人目は、白銀の鎧の男だった。", "男は、地面に倒れて、目を閉じていた。唇の端に、血が滲んでいる。自分で噛んだのだろう。剣は、少し離れた土の上に、転がっていた。", "「勇者、だそうだ」", "仲間の鬼が、囁いた。", "「人間界で、いちばん強い男」", "ヒサメは、男を担ぎ上げた。重かった。鎧の重さではない。眠った人間は、こんなに重いのかと思った。", "丘を下りかけたとき、足もとで、何かが、かさりと鳴った。", "焦げた木の根の間に、紙の切れ端が、引っかかっていた。", "ヒサメは、男を担いだまま、片手で、紙を拾い上げた。端は炭になっている。中ほどにだけ、文字が残っていた。人間の字だった。右へ、右へと、流れていく、不器用な字。", "ヒサメには、人間の字は、ほとんど読めない。ただ、紙のいちばん上の、短い一行だけは、形で分かった。宛名だ。誰かへの、手紙だ。", "(どこから)", "辺りを見回した。誰もいない。焼けた土だけが、広がっている。", "この手紙を書いた者は、どこへ行ったのか。", "答えは、分かっていた。分かっていて、ヒサメは、それ以上、考えないようにした。", "「ヒサメ。何してる」", "仲間が、振り返った。", "「……なんでもない」", "ヒサメは、紙を見つめた。宮へ持っていこうか、と思った。頭領に、見せようか。王に、届けようか。", "けれど、なぜか、そうしてはいけない気がした。", "この紙は、この丘で、書かれたのだ。この丘で、誰かが、誰かのことを、思いながら。", "「この土のものだ」", "ヒサメは、小さく呟いた。", "膝をついて、焦げた根の下の、柔らかい土を、指で掘った。紙を、そっと、その穴に置いた。上から、黒い土を、かぶせた。", "墓、というほどのものではなかった。ただ、元の場所に、返しただけだ。", "立ち上がると、担いだ男の体が、少し揺れた。男は、目を覚まさなかった。", "ヒサメは、一度だけ、振り返った。焦げた根の下の土は、ほかの土と、見分けがつかなかった。それでいい、と思った。見分けがつかないくらいが、ちょうどいい。", "遠くで、鴉が一羽、鳴いた。"]}, {"h": "二", "p": ["宮の厨は、鬼の手には狭すぎた。", "ヒサメは、竈の前で、腕を組んでいた。牢番を命じられたのは、ゆうべ、六人を牢に入れたあとのことだ。王命の「飢えさせるな」を、どう果たすか。それが、ヒサメの最初の仕事だった。", "「人間は、何を食うんだ」", "仲間の鬼が、首をかしげた。", "「肉だろ。俺たちと同じで」", "「生で、か」", "「焼くんじゃないか」", "「骨ごと、か」", "誰も、知らなかった。角ヶ原の鬼は、人間と卓を囲んだことがない。戦場で刃を交えたことはあっても、飯を一緒に食ったことはなかった。", "厨の戸口に、影が差した。", "背に硬い甲殻を負った、寡黙な男が立っていた。土蜘蛛族の長、ハニヤスだった。肩に、麻袋を一つ、担いでいる。", "「ハニヤス様」", "「米だ」", "ハニヤスは、麻袋を、台に下ろした。袋の口から、白い粒が、さらさらとこぼれた。", "「埴の里の米だ。人間は、米を煮て食う。病人や、弱った者には、柔らかく煮る。粥という」", "「粥」", "「水を多く。火は弱く。焦がすな」", "それだけ言って、ハニヤスは、背を向けかけた。それから、少しだけ、足を止めた。", "「王が、そう言った」", "「王が」", "「人間の食い物を、知っておられた。俺も、知らなかった」", "ハニヤスは、それ以上、何も言わずに去っていった。避難してきた民で、埴の里は、今、ごった返しているはずだった。それでも、米を担いで、ここまで来たのだ。", "ヒサメは、麻袋の米を、掌にすくった。", "小さな粒だった。噛めば、すぐに砕けてしまいそうな。", "最初の鍋は、焦がした。", "二つ目の鍋は、水が少なすぎて、固い飯になった。", "三つ目の鍋は、水が多すぎて、白い湯になった。", "四つ目で、ようやく、とろりとした粥になった。湯気の中に、甘い匂いが、ふわりと立った。", "ヒサメは、木の匙で、ひと口すくって、舐めてみた。", "味が、ほとんどしなかった。鬼の舌には、薄すぎる。", "「……これで、いいのか」", "「塩を、ひとつまみ」", "戸口から、また声がした。今度は、細く、掠れた声だった。", "ヒサメは、振り向いて、慌てて膝をついた。", "杖をついた女が、立っていた。腹に、厚く布を巻いている。顔は青白く、額に汗が浮いていた。", "王の参謀、オモイカだった。会談の間で、腹を裂かれて、命からがら逃げ戻ったと聞いていた。", "「オモイカ様。お休みにならなくては」", "「少し、歩きたくて」", "オモイカは、厨の中を、ゆっくりと見回した。竈の上の鍋を見て、少しだけ、目を細めた。", "「人間の兵は、戦の前に、粥を食べるそうです。会談の前に、随員の一人が、そう教えてくれました。人間の書物で、読んだのだと」", "オモイカの声が、わずかに、途切れた。", "「……塩を、ひとつまみ。それから、根菜を焼いて、添えてあげてください。干した肉も、あれば」", "「は」", "オモイカは、それだけ言うと、杖をついて、戸口から消えた。", "ヒサメは、鍋に、塩をひとつまみ、落とした。もう一度、舐めてみた。", "今度は、少しだけ、味がした。"]}, {"h": "三", "p": ["黄泉津の宮の露台は、夜風が強い。", "ベルイザナは、手すりの前に、立っていた。", "赤い夜空の下に、魔界の灯が、点々と見えた。埴の里の方角が、いつもより明るい。避難してきた民が、畦の上で、焚き火を囲んでいるのだろう。", "右の手を、見た。", "震えは、もう、止まっていた。", "丘の上で、ミカヅチに見られたことは、分かっていた。外套の陰で、手が震えていた。止めようとしても、止まらなかった。", "(なぜ、震えた)", "怒りではなかった。人間の軍が、根の洲を焼いた。会談の間で、随員を斬った。怒りは、あった。あったはずだった。", "けれど、丘を歩いているあいだ、怒りは、どこにもなかった。", "ただ、歩いた。歩いて、前にいる者を、消した。一人ずつ。手前から、順に。", "顔は、見なかった。", "見ようとしなかった。", "(見れば、止まる)", "それが、分かっていたからだ。", "最後のほうで、一人の兵と、目が合った。槍を取り落とした、若くはない、日に焼けた兵だった。その兵は、恐れてはいなかった。何か、遠くのものを、思い出しているような目をしていた。", "その兵も、消した。", "ベルイザナは、手を、握り込んだ。爪が、掌に食い込んだ。", "耳の奥に、細い声が、届いた。言伝の言霊だった。", "「……ベルイザナ様」", "オモイカの声だった。掠れて、途切れがちだった。腹の傷が、まだ、熱を持っているのだろう。", "「起きていて、よいのか」", "「眠れませんので。ご報告を」", "オモイカは、ひとつ、息を整えた。", "「根の洲の民は、埴の里と嵐ヶ峰に、移りました。けが人は、百二十。命を落とした者は、会談の間の、随員のほかには、まだ、聞いておりません。ただ、東の村の、幾家族かの行方が、知れません」", "「そうか」", "「ハニヤス殿が、畦の芽を、皆で踏まないように歩かせたそうです。スサノ殿は、足の弱い者を、一人も置いてこなかった、と」", "「……そうか」", "ベルイザナは、同じ言葉を、二度、言った。それしか、言えなかった。", "「随員は」", "言いかけて、止まった。", "何を、聞こうとしたのか。名を、か。顔を、か。自分は、その誰一人も、知らない。知らない者のことを、何と、尋ねればいいのか。", "通信の向こうで、オモイカが、黙っていた。", "「……十四人です」", "やがて、オモイカが、言った。", "「十四人、でした」", "それきり、オモイカは、何も言わなかった。名を、一つも、口にしなかった。", "「休め」", "ベルイザナは、言った。", "「命令だ。今夜は、休め」", "「……はい」", "通信が、切れた。", "ベルイザナは、手すりを、握った。十四。数だけが、胸の中に、落ちてきた。名のない数だった。", "丘の上で消した兵の数は、数えてもいない。", "露台の下の、石の階段から、足音が上がってきた。", "「王」", "ミカヅチだった。鬼族の頭領は、階段の最後の段で、足を止めた。それ以上は、上がってこなかった。", "「牢の六人、入れました。ヒサメという若いのに、番をさせております」", "「そうか。ご苦労だった」", "「勇者は、まだ目を覚ましません。残りの五人は、黙ったままです」", "ベルイザナは、振り返らなかった。", "ミカヅチは、しばらく、黙って、そこに立っていた。何か、言いたそうだった。言わなかった。", "「ミカヅチ」", "「は」", "「おまえとの一騎討ちを、覚えているか」", "ミカヅチの気配が、わずかに、硬くなった。", "「……忘れたことは、ございません」", "「あのとき、私は、おまえの顔を、見ていた」", "「は」", "「今日は、見なかった」", "風が、露台の灯を、揺らした。", "ミカヅチは、何も答えなかった。答えようが、なかったのだろう。", "「下がってよい」", "「……は」", "足音が、階段を下りていった。", "ベルイザナは、一人、露台に残った。", "赤い空に、星はない。魔界の空は、夜でも赤い。その赤の向こうに、人間界がある。消した兵たちが、帰るはずだった家がある。", "その家の、一つ一つに、誰かがいる。", "(知らぬ)", "ベルイザナは、その事実を、喉の奥で、転がした。", "知らない。何一つ。名も、顔も、帰りを待つ者のことも。", "王でありながら。", "夜が、ゆっくりと、更けていった。"]}, {"h": "四", "p": ["ナキメは、牢のある地下へは、下りなかった。", "宮の高い塔の、いちばん上の部屋。窓辺に、椅子を置いて、座っていた。目を閉じる。牢は、ここから、三十丈は下にある。", "指先を、わずかに、動かした。", "朧を、細く、細く、紡いだ。糸のように。牢の石壁を、するりとくぐり抜けて、眠る人間の、意識の、ほんの縁に、触れるか触れないかのところまで。", "触れはしない。王の許しを、まだ、得ていない。", "ただ、見るだけだった。", "六つの灯が、見えた。", "五つは、小さく、揺れていた。怯えと、疲れと、混乱。人間の兵なら、誰でも持っている灯だった。", "六つ目は、違った。", "白く、強く、真っ直ぐに燃えていた。眠っているのに、灯の芯が、揺らがない。善良で、不器用で、嘘をつけない者の灯だった。", "(勇者)", "ナキメは、その灯の、奥を、覗いた。", "そして、息を止めた。", "灯の芯に、何かが、絡みついていた。", "細い、細い、糸だった。灯の外から伸びて、芯の根もとに、巻きついている。糸は、どこか遠くへ、ずっと続いていた。大穴を越えて、人間界の、どこかへ。", "糸の上を、かすかな声が、流れていた。", "『――魔族は、話の通じない者たちだ』", "声は、温かかった。", "それが、何より、ぞっとした。", "憎しみの声ではなかった。命令の声でもなかった。子守唄のように、柔らかく、優しく、同じ言葉を、繰り返している。", "ナキメは、朧の糸を、そっと、引き戻した。", "額に、汗が浮いていた。指先が、冷たかった。", "(王に、報せるべきか)", "まだ、だ。", "触れてもいないのに、確かなことは、言えない。あの糸に触れれば、もっと分かる。けれど、触れれば、糸の向こうにいる者に、気づかれるかもしれない。", "それに、王は、今夜、誰にも、会いたくないはずだった。", "露台の灯が、塔の窓から見えた。王は、まだ、そこに立っていた。", "ナキメは、窓辺の椅子で、膝を抱えた。", "自分の膝が、震えていることに、気づいた。王の前に立つと、いつもそうだ。けれど、今夜は、王の前ではないのに、震えていた。", "あの糸の声が、耳の奥に、残っていた。", "温かい声で、人は、こんなにも深く、染まるのか。", "ナキメは、鴉族の長だった。心に触れる言霊なら、魔界の誰にも負けない。人の迷いを朧で包み、偽りの名を剥がし、眠れぬ者を眠らせてきた。", "その自分が、あの糸の前で、怯んだ。", "糸の声は、迷いを包むのではなかった。迷いが生まれる前に、答えを置いていく。考える前に、考えたことにしてしまう。考えた本人さえ、それが自分の考えだと信じて疑わないほど、静かに。", "(これを、ほどくのか)", "ほどけるだろうか。ほどいたとき、あの白い灯は、壊れずに残るだろうか。", "答えは、出なかった。", "窓の外で、夜の鴉が、一羽、鳴いた。ナキメの配下の、見張りの鴉だった。牢の上の屋根に、一晩じゅう、とまっていることになっている。", "ナキメは、その鳴き声を聞きながら、決めた。", "明日の朝、王に、願い出よう。あの男の中を、見せてほしいと。", "王が、壊すなと言うなら、壊さない。急ぐなと言うなら、急がない。", "ただ、あの温かい声を、このまま、あの灯の芯に、巻きつかせておくわけには、いかない。", "膝の震えは、夜明けまで、止まらなかった。"]}, {"h": "五", "p": ["一日目の粥は、誰も、食べなかった。", "ヒサメは、盆を六つ、牢の差し入れ口から、滑り込ませた。湯気の立つ粥と、焼いた根菜と、干し肉が一切れ。オモイカに言われたとおりにした。", "五人の人間は、盆を、見もしなかった。牢の隅に、固まって、座っていた。一人が、ヒサメを、睨んだ。", "「毒だろう」", "「毒など、入れておらん」", "ヒサメは、言った。", "「入れるつもりなら、寝ている間にやっている」", "人間は、黙った。けれど、盆には、手を伸ばさなかった。", "六つ目の牢では、勇者が、藁の上で、眠ったままだった。肩の傷には、ナキメの配下の鴉族が、布を巻いていった。寝息は、規則正しかった。ただ、ときどき、眉が寄った。夢の中で、何かと戦っているように。", "半刻後、ヒサメは、盆を下げに行った。", "粥は、冷えて、固まっていた。", "ヒサメは、厨へ戻って、鍋に、新しい粥を炊いた。また、六つの盆に、よそった。また、差し入れ口から、滑り込ませた。", "半刻後、また、冷えていた。", "三度目のとき、仲間の鬼が、呆れたように言った。", "「食わない奴に、何度出しても、同じだろ」", "「王命だ」", "「飢えさせるな、だろ。食わないのは、向こうの勝手だ」", "「出さなきゃ、こっちが飢えさせたことになる」", "ヒサメは、鍋を、竈に戻した。", "本当は、それだけではなかった。", "丘の上の、何もない土を、思い出していた。焦げた根の間に、紙を埋めた指の感触を、思い出していた。", "あの手紙の主は、もう、何も食べられない。", "ここにいる六人は、まだ、食べられる。", "それだけのことだった。", "夜が更けるまで、ヒサメは、粥を、温め直し続けた。", "夜半を過ぎたころ、五人のうちの一人が、そっと、盆に手を伸ばした。いちばん若い、痩せた男だった。周りの四人が眠っているのを確かめてから、冷えかけた粥を、ひと口、すすった。", "男の喉が、ごくりと鳴った。", "それから、もうひと口。もうひと口。", "ヒサメは、小窓の陰で、それを見ていた。声は、かけなかった。かければ、男は、手を止めるだろう。", "男は、椀を空にすると、袖で、口を拭った。それから、小さく、肩を震わせた。泣いているのか、笑っているのか、ヒサメには、分からなかった。"]}, {"h": "六", "p": ["イオリは、空になった椀を、膝の上に置いたまま、動けなかった。", "二十一。参謀見習いとして、勇者の隊に加えられたのは、ひと月前のことだった。字が書けて、算盤が弾けるから、というだけの理由だった。剣は、ろくに握ったことがない。", "丘の上のことは、思い出したくなかった。", "思い出そうとすると、頭の中が、白くなった。隣にいた先輩の顔が、ふっと、消えた。声も、悲鳴もなかった。ただ、いなくなった。その次も、その次も。", "(魔族は、話の通じない者たちだ)", "頭の奥で、温かい声が、繰り返していた。", "いつもの声だった。王都の学び舎で、軍務局の廊下で、出陣の朝の広場で、いつも聞いていた声。聞いていると、胸が、すっと落ち着く。何も、考えなくてよくなる。", "それなのに、今夜は、声が、遠かった。", "腹が減っていたからかもしれない。二日、何も食べていなかった。空っぽの腹の底で、温かい声は、うまく響かなかった。代わりに、もっと、別の音が、聞こえていた。", "鍋の、ことことと煮える音。", "小窓の外で、あの鬼が、一晩中、粥を温め直していた。食べない者のために。毒を疑って睨みつける者のために。何度も、何度も、冷えた盆を下げては、湯気の立つ盆を、差し入れていた。", "魔族は、人を食らう。嘲る。約束を踏みにじる。", "そう、聞いてきた。", "あの鬼は、粥を、塩で味つけしていた。", "イオリは、空の椀を、見つめた。米の甘みが、まだ、舌に残っていた。故郷の母が、熱を出した日に作ってくれた粥と、同じ味がした。", "(おかしい)", "その言葉が浮かんだとたん、頭の奥が、ずきりと痛んだ。", "温かい声が、少しだけ、大きくなった。考えるな。魔族は、話の通じない者たちだ。考えるな。", "イオリは、目を閉じた。声に、身を任せようとした。いつものように。", "けれど、舌の上の甘みが、消えなかった。", "隣で眠っている先輩たちの寝息を、聞いた。四人。丘の上で、生かされた。なぜ生かされたのかは、分からない。勇者の隊の参謀格だから、話を聞き出すためだろう、と先輩の一人は言った。拷問が始まる前に、舌を噛め、とも。", "けれど、ここに来て、二日。誰も、何も、聞きに来ない。鞭も、縄も、見ていない。来るのは、あの鬼と、湯気の立つ盆だけだ。", "小窓が、そっと、開いた。", "イオリは、息を止めた。", "鬼の、大きな顔が、覗いた。額の二本の角。口の端の牙。その目が、イオリの膝の上の、空の椀を、見た。", "鬼は、何も言わなかった。", "ただ、ほんの少しだけ、目を細めた。それから、小窓を、閉めた。", "閉まる間際に、廊下の向こうから、鍋をかき回す音が、また、聞こえはじめた。", "イオリは、椀を、胸に抱いた。", "明日の朝、先輩たちが起きたら、言おうと思った。毒は、入っていなかった、と。", "それだけ言うのに、ずいぶん、勇気が要りそうだった。"]}, {"h": "七", "p": ["二日目の朝、ミカヅチが、牢番の詰め所に、顔を出した。", "ヒサメは、慌てて、立ち上がった。", "「楽にしろ」", "ミカヅチは、詰め所の、狭い腰掛けに、どかりと座った。角が、天井の梁を、かすめた。", "「勇者は」", "「まだ、眠っております。ただ、寝息が、浅くなってきました。今日には、目を覚ますかと」", "「ほかの五人は」", "「一人が、夜中に、粥を食いました。残りは、まだ」", "ミカヅチは、ふん、と鼻を鳴らした。", "「人間も、腹は減る」", "「はい」", "ヒサメは、少し、迷った。それから、思い切って、尋ねた。", "「頭領。人間は、飯を残す者を、どう言うのですか」", "「何だ、急に」", "「鬼族では、食い物を残す奴は、弱いと言います。人間は、どうなのかと」", "ミカヅチは、しばらく、黙って、ヒサメを見ていた。", "「知らん」", "それから、少しだけ、口の端を上げた。", "「だが、勇者が目を覚まして、残さず食ったら、言ってやれ。感心だ、とな。鬼族では、食い物を残す奴は弱いと言う、と」", "「……言って、よいのですか」", "「言え。人間が、魔族を、話の通じぬ者だと思っておるなら、話しかけてやれ。飯の話でいい」", "ミカヅチは、立ち上がった。また、角が、梁を、かすめた。", "戸口で、頭領は、振り返った。", "「ヒサメ」", "「は」", "「丘で、何か、拾っていたな」", "ヒサメは、息を、止めた。", "見られていたのだ。", "「……手紙、でした。人間の。焼け残っていて」", "「どうした」", "「土に、返しました。あの丘の、ものだと思ったので」", "ミカヅチは、長いこと、何も言わなかった。", "それから、短く、言った。", "「それで、よい」", "頭領の足音が、廊下の向こうへ、遠ざかっていった。", "昼前に、勇者が、目を覚ました。", "ヒサメは、小窓から、牢を覗いた。男は、石の床に、横たわったまま、天井を見上げていた。", "「起きたか。飯だ」", "盆を、差し入れ口から、滑り込ませた。湯気の立つ粥と、焼いた根菜と、干し肉が一切れ。", "「毒など入れておらん。入れるつもりなら、寝ている間にやっている」", "勇者は、盆を、じっと見つめていた。", "「飢えさせるなとの王命だ。食え」", "勇者は、唇を、噛んだ。それから、盆を、引き寄せた。", "ひと口。", "男の目が、わずかに、揺れた。", "「……礼は言わん」", "「いらん。王命だ」", "ヒサメは、小窓を、閉めかけた。", "それから、少し、手を止めた。頭領の言葉が、頭に浮かんでいた。", "「だが、残さず食うのは感心だ。鬼族では、食い物を残す奴は弱いと言う」", "小窓を、閉めた。", "閉めたあとで、ヒサメは、扉の前に、しばらく、立っていた。", "中から、匙が、椀の底を、こする音が、聞こえた。最後の一粒まで、かき集めるような音だった。"]}, {"h": "八", "p": ["二日目の夜、ベルイザナは、牢番の詰め所の前で、足を止めた。", "若い鬼が、竈の前で、鍋をかき回していた。ベルイザナの気配に気づいて、慌てて、膝をついた。", "「王」", "「楽にしてよい。ヒサメ、と言ったな」", "「は。……覚えて、いただいて」", "「ミカヅチに、聞いた」", "ベルイザナは、竈の鍋を、覗き込んだ。とろりとした、白い粥だった。湯気の中に、かすかに、塩の匂いがした。", "「勇者は、食べたか」", "「は。昼に。残さず」", "ヒサメの声に、わずかに、誇らしげな色が、混じっていた。", "「ほかの者たちも、夕方には、みな、食いました。最後まで食わなかった年かさの男も、さっき、椀を空にして」", "「そうか」", "ベルイザナは、鍋の湯気を、見つめた。", "六つの椀が、空になった。この若い鬼が、一日、粥を、温め直し続けたからだ。", "「ヒサメ」", "「は」", "「丘で、手紙を拾ったそうだな」", "ヒサメの肩が、こわばった。", "「……頭領から」", "「土に、返したと聞いた」", "「は。勝手なことを、いたしました」", "「なぜ、返した」", "ヒサメは、しばらく、黙っていた。竈の火が、ぱちりと、はぜた。", "「分かりません」", "若い鬼は、正直に言った。", "「ただ、あの紙を書いた者は、あの丘で、誰かのことを、思っていたのだと思います。宮へ持ってきたら、その思いが、丘に、残らなくなる気がして」", "ベルイザナは、何も言えなかった。", "手紙。", "誰かのことを、思いながら。", "丘の最後のほうで、目が合った、日に焼けた兵の顔が、浮かんだ。遠くのものを、思い出しているような目。あの兵も、誰かのことを、思っていたのだろうか。", "(私は、その思いごと、消した)", "「……それで、よい」", "ベルイザナは、ミカヅチと、同じことを言った。言ってから、気づいた。", "「感謝する。粥を、温め続けてくれて」", "ヒサメは、目を、丸くした。それから、深く、頭を下げた。", "ベルイザナは、詰め所を出て、地下への石段を、下りはじめた。", "足音は、ほとんど、立てなかった。", "牢の、いちばん奥。白銀の鎧を脱がされた男が、藁の上に、座っているはずだった。空になった椀を、膝のそばに、置いて。", "何を問うか、まだ、決めていなかった。", "なぜ和平の席で刃を抜いたのか。それは、問わねばならない。けれど、その前に、聞きたいことがあった。傷は、痛むか。粥は、口に合ったか。王が囚人に尋ねることではない。分かっていた。それでも、その問いから始めたかった。", "ただ、今度は、顔を見よう、と思った。", "座って、目の高さを合わせて、その男の顔を、見よう。", "あの丘で、見なかった、すべての顔の、代わりに。", "石段の下で、牢の灯が、小さく、揺れていた。"]}]}, {"id": "ch03_5", "label": "第三・五章", "title": "比良坂を渡る", "chars": 9400, "sections": [{"h": "一", "p": ["オモイカは、露台の手すりに、杖を立てかけた。", "朝の光が、宮の石畳を、赤く染めていた。黄泉の朝は、いつも赤い。その赤の中に、王が、一人で立っていた。", "「では、もう一度、お願いいたします」", "「ああ」", "ベルイザナは、目を閉じた。", "角が、ゆっくりと、沈んでいった。額の脇の黒い角が、髪の中へ、溶けるように消えていく。背中の翼が、細く、細く畳まれ、外套の下で、ただの肩の線になった。", "周りの空気の、重さが、変わった。", "オモイカは、思わず、息を詰めた。腹の傷が、引きつれた。王の傍らに立つとき、いつも肌で感じていた、あの密度が、消えていた。いや、消えたのではない。体の奥へ、深く、深く、畳み込まれたのだ。", "「いかがだ」", "「……三度目で、ようやく、角が残りませんでした」", "「そうか」", "「ただ、右の翼の根もとが、まだ、少し」", "ベルイザナは、肩を回した。外套の下で、わずかに、布が浮いていた。", "「難しいな」", "「ええ。王の御体は、人の器には、大きすぎますので」", "オモイカは、懐から、手鏡を取り出した。磨いた銅の、小さな鏡だった。", "「どうぞ」", "王は、鏡を受け取り、覗き込んだ。", "それから、長いこと、黙っていた。", "鏡の中にいるのは、黒髪の若者だった。角もなく、翼もない。背は高いが、どこにでもいそうな顔だ。肩の下まで伸びた黒い髪。右の眉の端の、小さな古い傷。灰色の目の奥に、光の加減で、かすかに紅が残る。", "魔王の面影は、それだけだった。", "「……これが、私か」", "「はい」", "「思っていたより、若い」", "オモイカは、笑いそうになって、こらえた。", "「眉の傷は、隠せませんでした。目の奥の色も」", "「隠さずともよい」", "ベルイザナは、鏡を返した。", "「人の中にも、傷のある者は、いるだろう」", "それから、オモイカは、用意したものを、一つずつ、手渡していった。", "黒い外套。宮の衣装蔵に眠っていた、一度も袖を通していない外套だ。縫い取りは、どうしても、外せなかった。上等すぎると言うと、王は、少しだけ眉を寄せた。", "「目立つか」", "「少し。けれど、旅慣れぬ若者が、親に持たされた外套、と思われるくらいでしょう」", "剣が一振り。鬼の鍛冶が打った、飾りのない剣だった。王は、生まれてこのかた、剣を帯びたことがない。持つ必要が、なかった。", "「冒険者は、皆、何かを帯びております。手ぶらの者は、怪しまれます」", "「抜かぬ剣でも、か」", "「抜かぬ剣こそ、です」", "それから、小さな革袋。中で、硬いものが、かちりと鳴った。", "「人間界の、銅貨です。岐人の市を通して、少しずつ集めておいたものです。十枚で、パンが一つ買えるそうです」", "「パン」", "「人間の、主食の一つです。麦を練って、焼いたもの」", "王は、革袋を、掌の上で、転がした。", "「数えたことがない。銭というものを」", "「でしょうね」", "オモイカは、今度は、こらえきれずに、小さく笑った。腹の傷が、また、痛んだ。", "「通信は、夜に、こちらから。人の目のないところで、短く。網に、気配を拾われませんよう」", "「分かった」", "「それから」", "オモイカは、杖を握り直した。", "「どうか、お気をつけて。……申し訳ありません、私は――」", "「それより」", "王が、遮った。", "「次の手を聞かせてくれ」", "オモイカは、口をつぐんだ。それから、まっすぐに、王を見た。", "「比良坂の縁で、岐人が、お待ちしております」", "「感謝する」", "王は、外套の裾を払って、背を向けた。", "その背中は、もう、魔王の背中ではなかった。ただの、旅に出る若者の背中だった。オモイカは、それを、長く見送った。"]}, {"h": "二", "p": ["比良坂の大穴は、底なしの口を、開けていた。", "縁に立つと、風が、下から吹き上げてきた。遠く、闇の底に、細い光の筋が、立っている。世界の中心から、昇る光だ。", "「お待ちしておりました」", "声が、した。", "振り向くと、年かさの男が、岩の上に立っていた。いつから、そこにいたのか。足音が、なかった。", "人と変わらぬ姿だった。髪は白く、腰が、わずかに曲がっている。灰色の衣に、すり切れた外套。皺の奥の目は、しかし、王の顔を、見ていなかった。少し、伏せられていた。", "「岐人でございます。境を、お渡りになる方の、手引きを」", "「頼む」", "「お名前は、伺いません」", "男は、伏せた目のまま、言った。", "「お顔も、拝見いたしません。境を渡る方は、誰でもない方として、お渡りいただく。それが、私どもの掟でございます」", "ベルイザナは、男を見た。", "伏せた目の奥が、何を見ているのかは、分からなかった。ただ、その目は、何もかも、知っているようにも見えた。", "「そなたの名は」", "「境の者に、名は、要りません」", "男は、わずかに、口の端を上げた。", "「お通りください」", "男が、大穴の縁の岩に、手をかざした。淡い光が、岩肌に沿って、灯った。光は、螺旋を描いて、闇の中へ、続いていた。", "二人は、光の道を、たどった。", "降りているのか、上っているのか、途中から、分からなくなった。岩壁の手触りが、少しずつ、変わっていく。乾いた岩から、湿った岩へ。焦げた土の匂いから、苔と、水の匂いへ。", "男は、一度も、振り返らなかった。けれど、王の足が、少しでも遅れると、光の道も、少しだけ、明るくなった。", "「一つ、聞いてよいか」", "「どうぞ」", "「人間界の、王の網は、どこまで届いている」", "「境の向こうの、ことは」", "男は、短く、答えた。", "「私どもは、どちらの側にも、立ちません。立たぬゆえに、境を、守れます」", "それきりだった。", "ベルイザナは、それ以上、聞かなかった。中立とは、こういうものか、と思った。冷たいのではない。ただ、線の上に、立っているのだ。", "光の道を、黙って、たどった。", "足を運びながら、ベルイザナは、宮を出る前のことを、思い返していた。", "四天王には、「下見だ」とだけ、告げた。人間界の兵の備えを、この目で確かめてくる、と。", "ミカヅチは、腕を組んで、うなずいた。王が自ら行くなら、三倍は要るぞ、とは、言わなかった。スサノは、保留だ、とだけ唸った。ナキメは、翼を畳んで、深く頭を下げた。牢の男の解呪は、必ず、進めておきます、と。", "ハニヤスだけが、何も言わなかった。", "ただ、畦に立って、王の顔を、長いこと、見ていた。それから、鍬を担ぎ直して、背を向けた。去りぎわに、一言だけ、背中越しに、言った。", "「土産は、要らん。帰ってこい」", "(気づいていたのだろうか)", "下見ではないことに。人間を、知りに行くのだということに。", "あの男は、昔から、そうだった。言葉より先に、土の具合で、天気を読む。王の顔色も、同じように、読んでいたのかもしれない。", "嘘を、ついた。", "民のために、ついた嘘だ。けれど、嘘には、変わりない。", "(戻ったら、詫びよう)", "何を詫びるのか、まだ、分からなかった。ただ、そう決めると、足が、少しだけ、軽くなった。", "どれほど、たどっただろう。", "風の匂いが、変わった。", "光の道が、途切れた。目の前に、青い空が、広がっていた。", "ベルイザナは、足を止めた。", "空が、青かった。", "赤くない空を、見るのは、初めてだった。どこまでも、高く、薄い青が、続いていた。白い雲が、ゆっくりと、流れていた。", "「……青いな」", "思わず、声に出ていた。", "「こちらの空は、昼は、青うございます」", "背後で、男が、言った。", "「夕べには、赤くなります。夜は、黒く。ご覧になれば、すぐに、慣れましょう」", "振り返ると、男は、もう、光の道の向こうに、戻りかけていた。", "「お帰りの際は、またこの縁へ。いつでも、お待ちしております」", "それだけ言って、男の姿は、闇の中へ、消えていった。"]}, {"h": "三", "p": ["最初の夜は、街道の脇の、林の中で過ごした。", "宿場までは、まだ遠い。日が暮れるのが、思っていたよりも、ずっと早かった。青い空は、たしかに、夕べには赤くなった。黄泉の赤とは違う、燃えるような赤だった。そして、あっという間に、黒くなった。", "寒かった。", "ベルイザナは、枯れ枝を集めた。火を熾そうとして、手が止まった。", "指を鳴らせば、火は、すぐに点く。けれど、それは、力を使うことだ。たとえ小さな火でも、網に、気配が残るかもしれない。オモイカに、何度も、念を押された。", "(人は、どうやって火を熾すのだ)", "オモイカが、革袋と一緒に、火打ち石を入れてくれていた。石と、鉄の欠片を、打ち合わせる。火花が、散った。散っただけだった。枯れ枝は、煙一つ、上げなかった。", "何度も、打った。", "石を持つ指が、痺れてきた。魔界の王が、林の中で、火打ち石と格闘している。四天王が見たら、何と言うだろう。ミカヅチは、腹を抱えて笑うだろうか。", "「火口が、ないんだよ」", "声が、した。", "街道のほうから、小さな荷車が、近づいてきた。引いているのは、痩せた男だった。荷台の上に、女の子が一人、座っていた。", "二人とも、耳の先が、尖っていた。", "「枯れ枝だけじゃ、点かない。ほら、これ」", "男は、荷台から、乾いた草の束と、木の皮を、取り出した。", "「火口ってのは、ほぐした草とか、木の皮とか。火花を、まず、これで受けるんだ」", "男は、手慣れた様子で、火打ち石を打った。一度で、火花が、草の束に落ちた。男が、そっと息を吹きかけると、小さな炎が、ぽっと、立ち上がった。", "「……感謝する」", "「いいってことよ。こっちも、今夜は、ここで寝るつもりだったんだ」", "男は、荷車を林の脇に寄せた。女の子が、荷台から飛び降りて、火のそばにしゃがんだ。", "七つか、八つほどの子だった。大きな目で、ベルイザナを、じっと見上げている。", "「おにいさん、旅の人？」", "「ああ」", "「どこから来たの」", "ベルイザナは、少し、言葉に詰まった。", "「……遠くからだ」", "「ふうん」", "女の子は、首をかしげた。それから、目を細めて、もう一度、ベルイザナの顔を見た。", "「おにいさんの顔、なんか、よく見えないね」", "「こら」", "父親が、女の子の頭を、軽く小突いた。", "「すまねえな。この子、目が悪いわけじゃないんだが」", "「構わぬ」", "ベルイザナは、内心で、息をついた。偽名の膜は、効いている。子どもの目は、それを、正直に、言葉にしただけだ。", "父親は、干し飯を、三つに分けた。一つを、ベルイザナに、差し出した。", "「腹、減ってるだろ」", "「いや、私は」", "「遠慮すんなって。旅は、相身互いだ」", "ベルイザナは、干し飯を、受け取った。硬かった。噛むと、かすかに、麦の甘さがした。", "「明日は、宿場に着くか」", "男が、聞いた。", "「そのつもりだ」", "「そうか。……一つだけ、言っとく」", "男は、焚き火に、枝を足しながら、言った。声が、少し、低くなった。", "「宿場の宿は、俺たちは、泊まれねえ。耳がこうだからな。あんたは、大丈夫だろうけど。もし、宿の前で、俺たちが追い払われてても、気にすんな。慣れてるから」", "ベルイザナは、男の顔を、見た。", "男は、笑っていた。何でもないことのように。", "その笑い方を、どこかで、見た気がした。魔界の市場で、人間の噂を、笑いに変えて話していた、団子屋の店主。笑うのは、痛みを、遠ざけるためだ。", "「……分かった」", "それしか、言えなかった。", "焚き火が、ぱちりと、はぜた。女の子は、いつの間にか、父親の膝で、眠っていた。", "夜更け、親子が寝息を立てはじめてから、ベルイザナは、林の奥へ、少しだけ歩いた。", "木の根もとに、腰を下ろす。掌を、耳のそばに、かざした。", "「オモイカ」", "返事は、すぐに来た。待っていたのだろう。", "「ベルイザナ様。ご無事で」", "「ああ。人間界の、林の中にいる」", "「網に、障りは」", "「ない。力は、使っていない」", "通信の向こうで、オモイカが、小さく息をついた。", "「火は、いかがなさいました。今夜は、冷えると、岐人が」", "「熾した」", "「……お一人で、ですか」", "「いや」", "ベルイザナは、少し、言葉を探した。", "「通りがかりの者に、教わった。火口というものが、要るらしい。枯れ枝だけでは、点かぬ」", "通信の向こうで、何かを、こらえる気配がした。", "「笑っているな」", "「いいえ。決して」", "声が、震えていた。腹の傷に、響くのだろう。ベルイザナは、それ以上、追わなかった。", "「耳の尖った、親子だった。干し飯を、分けてくれた」", "「亜人、ですね」", "「そう呼ぶのか」", "「人間の国では。人間でも、エルフでも、ドワーフでもない者を、まとめて、そう呼ぶと聞いております」", "「まとめて、か」", "ベルイザナは、焚き火のほうを、振り返った。木々の間に、小さな火が、揺れていた。その脇で、父親が、娘の肩に、上着を掛け直していた。", "「明日の宿場では、あの親子は、宿に泊まれぬそうだ」", "オモイカは、すぐには、答えなかった。", "「……ベルイザナ様」", "「分かっている。何もせぬ」", "「はい」", "「何もせぬが、見ておく」", "短い沈黙のあと、オモイカが、静かに言った。", "「それが、下見、でございますね」", "「ああ」", "通信が、切れた。", "ベルイザナは、しばらく、林の暗がりに、座っていた。牢のタケルは、今夜も、粥を残さず食べただろうか。ふと、そんなことを、思った。"]}, {"h": "四", "p": ["宿場は、街道の辻に、張りつくようにあった。", "家は、二十軒ほど。茶屋が二つに、宿が一つ。荷車を休ませる広場と、井戸。それだけの、小さな宿場だった。", "ベルイザナは、茶屋の軒先に、腰を下ろした。", "「いらっしゃい。何にしなさる」", "腰の曲がった老婆が、盆を持って、出てきた。", "「……何が、ある」", "「団子と、茶と、握り飯。今朝は、草餅もあるよ」", "「では、草餅と、茶を」", "運ばれてきた草餅は、まだ温かかった。蓬の匂いがした。", "食べ終えて、ベルイザナは、革袋を開けた。いくら払えばいいのか、分からなかった。十枚で、パンが一つ。草餅は、パンより安いのか、高いのか。", "分からないまま、二十枚ほどを、台に置いた。", "老婆が、目を丸くした。", "「お兄さん、多すぎるよ。草餅と茶で、四枚だよ」", "「……そうか」", "老婆は、十六枚を、ベルイザナの掌に、押し戻した。", "「旅慣れてないね。こんなふうに銭を出したら、悪い宿だと、全部取られちまうよ」", "「気をつける」", "「気をつけなされ」", "老婆は、笑って、奥へ引っ込んだ。", "ベルイザナは、掌の銅貨を、見下ろした。", "(返した)", "黙って受け取っても、誰にも、分からなかったはずだ。それでも、老婆は、返した。", "人間にも、こういう者がいる。分かっていた。頭では、分かっていた。", "ベルイザナは、しばらく、茶屋の軒先に、座っていた。", "宿場の昼は、ゆっくりと流れた。", "井戸端で、女たちが、洗い物をしながら、話している。誰それの家の牛が、子を産んだ。どこそこの嫁が、里帰りした。笑い声が、何度も、上がった。", "広場の隅では、年寄りの男が、旅人の荷を、荷車に積むのを手伝っていた。頼まれたわけでは、なさそうだった。積み終えると、旅人に何か言われ、手を振って、また、日向の腰掛けに戻っていった。", "子どもが、転んで、泣いた。母親が、駆け寄って、膝の土を払った。泣かないの、と言いながら、自分の袖で、子どもの鼻を拭いた。", "ベルイザナは、それを、ただ、見ていた。", "魔界の、埴の里の、昼と、同じだった。畦で、民が、噂話をする。年寄りが、頼まれもしないのに、誰かの荷を担ぐ。子どもが転べば、誰かが、駆け寄る。", "(同じだ)", "角も、翼も、牙もない。空の色も、違う。それでも、昼の光の中で、人は、同じように、暮らしていた。", "根の洲の焼け野を、歩いてきた兵たちも。あの兵たちにも、こういう昼が、あったのだろう。", "その考えは、まだ、胸の中で、うまく、形にならなかった。ただ、重かった。", "昼過ぎ、広場の井戸のそばで、昨夜の荷車を見かけた。", "男が、宿の前に立っていた。女の子は、荷車の上で、膝を抱えていた。", "宿の主人が、戸口から、首を振っていた。何を言っているのかは、聞こえなかった。ただ、主人は、困ったように、眉を寄せていた。怒鳴ってはいなかった。男も、言い返さなかった。", "男は、軽く頭を下げて、荷車のほうへ、戻っていった。", "慣れている、足取りだった。", "ベルイザナは、井戸の縁で、それを見ていた。", "何も、できなかった。何をすればよいのかも、分からなかった。", "胸の中に、何かが、沈んでいた。それが何なのか、まだ、言葉にならなかった。", "その夜、ベルイザナは、宿には泊まらなかった。宿場の外れの、荷車の脇で、また、焚き火を囲んだ。今度は、自分で、火を熾した。火口を、ほぐして。火花を、受けて。", "一度で、点いた。", "「上手になったね」", "女の子が、言った。", "ベルイザナは、少しだけ、口の端を上げた。"]}, {"h": "五", "p": ["年かさの岐人は、境の岩の上に、立っていた。", "大穴の縁は、夜になると、音が消える。風も、光の筋も、ただ、静かに、そこにある。", "男は、昼間、手引きをした者のことを、考えていた。", "顔は、見なかった。掟だった。境を渡る者は、誰でもない者として、渡る。名も、聞かない。", "けれど、足音は、聞いた。", "人の器に、無理やり、畳み込まれた足音だった。一歩ごとに、地面が、わずかに、軋んでいた。本人は、気づいていなかっただろう。あれほどの重さを、あれほど静かに運ぼうとする者を、男は、ほかに、知らなかった。", "(あの方は、何をしに、行かれたのか)", "問うては、ならなかった。問う必要も、なかった。", "ただ、あの足音は、滅ぼしに行く者の足音では、なかった。", "何かを、探しに行く者の、足音だった。", "男は、目を閉じた。", "昔、この岩の上で、男に、掟を教えた者がいた。足音を消す歩き方も、その人に教わった。", "境を渡る方の顔は、見るな。見れば、どちらかの側に、立ってしまう。", "その人の声は、覚えている。教わった言葉も、一つ残らず、覚えている。", "けれど、その人の名を、男は、どうしても、思い出せなかった。", "境の者は、名を、境に置いてくるものだ。その人は、そう言っていた。", "男は、目を開けた。", "(いつか)", "あの方が、戻られるときは。", "そのときは、この掟を、少しだけ、破ってもいいかもしれない。お帰りなさいと、言うくらいは。", "男は、岩の上に、座った。夜は、長かった。"]}, {"h": "六", "p": ["三日目の朝、荷車の親子と、街道を歩いた。", "行き先が、途中まで、同じだった。親子は、海沿いの丘の陰にある、小さな集落へ、塩と干し魚を売りに行くのだという。", "「亜人の集落でな。ひなた野って、呼ばれてる。薬が、いつも足りねえんだ。薬は、俺たちにも高くて、手が出ねえ。だから、せめて、塩をな」", "男は、荷車を引きながら、言った。", "「街のギルドに、届け物の依頼を出してるらしいんだが、誰も、受けやしねえ。報酬が安いうえに、行き先が、あそこだからな」", "ベルイザナは、黙って、聞いていた。", "女の子は、ベルイザナの隣を、跳ねるように歩いていた。ときどき、外套の裾を、つまんだ。", "「おにいさん、歩くの、へんだね」", "「変か」", "「うん。地面を、そうっと、踏んでる。虫を、踏まないみたいに」", "ベルイザナは、足もとを、見た。", "言われてみれば、そうだった。畦の芽を、踏まないように。いつからか、そういう歩き方が、体に、染みついていた。", "「……癖だ」", "「へんなの」", "女の子は、笑った。それから、ベルイザナの真似をして、そうっと、地面を踏んで歩いた。", "「こう？」", "「ああ」", "「むずかしいね」", "二人で、そうっと、歩いた。父親が、荷車の陰で、呆れたように、首を振っていた。", "しばらくして、女の子が、また、外套の裾を引いた。", "「ねえ。おにいさん、なんて名前？」", "ベルイザナは、足を止めかけた。", "名を、聞かれた。", "人間界に来て、初めてだった。岐人は、聞かなかった。茶屋の老婆も、聞かなかった。宿場の誰も、聞かなかった。", "露台で決めた名が、喉の奥に、あった。まだ、一度も、人に向かって、口にしたことのない名だった。", "「……ベル」", "声は、思っていたより、小さかった。", "「ベル？」", "「ああ。ベルだ」", "「ふうん。ベル、ベル」", "女の子は、歌うように、繰り返した。", "「鈴みたいな、名前だね」", "それから、少し首をかしげて、ベルイザナの顔を、また、見上げた。", "「でも、顔は、やっぱり、よく見えない」", "「そうか」", "「名前は、覚えたよ。ベル」", "ベルイザナは、何と答えればいいのか、分からなかった。", "名を、呼ばれた。偽りの名だった。それでも、小さな子が、その名で、自分を呼んだ。", "胸の奥で、何かが、かすかに、鳴った気がした。鈴の音のように。", "「おまえの名は」", "聞き返すと、女の子は、得意そうに、胸を張った。", "「ないしょ」", "「ないしょ、か」", "「うん。今度、会ったら、教えてあげる」", "父親が、荷車の陰で、また、首を振った。", "「すまねえな。人見知りなんだか、何なんだか」", "「構わぬ」", "ベルイザナは、少しだけ、口の端を上げた。", "今度、会ったら。人間の子どもは、そういう約束を、簡単にする。そして、たぶん、本気で、待っている。", "昼過ぎ、道が、二つに分かれた。", "右は、海沿いの丘へ。左は、港町へ。", "「俺たちは、こっちだ」", "男が、右の道を、指した。", "「あんたは、港町だろ。ミナモ。ギルドがある。冒険者になるなら、あそこだ」", "ベルイザナは、革袋を、取り出した。", "「火口と、干し飯の、礼を」", "「いらねえよ」", "男は、手を振った。", "「さっきも言ったろ。旅は、相身互いだ。それに、あんた、銭の数え方、まだ、分かってねえだろ。取られる心配のほうが、先だ」", "ベルイザナは、革袋を、しまった。", "「では、いつか、返す」", "「返さなくていいって」", "「返す」", "男は、少し、目を丸くした。それから、声を上げて、笑った。", "「変わった人だな、あんた」", "女の子が、荷台の上から、手を振った。", "「おにいさん、またね」", "荷車が、丘の道を、上っていった。小さな手が、いつまでも、振られていた。", "ベルイザナは、その姿が、丘の向こうに消えるまで、立っていた。", "(ひなた野)", "誰も受けない、届け物の依頼。", "その名を、胸の中で、一度だけ、繰り返した。"]}, {"h": "七", "p": ["ミナモの灯が見えたのは、夕暮れだった。", "丘の上から、港町が、一望できた。家々の屋根が、海沿いに、ぎっしりと並んでいる。夕陽が、海を、橙色に染めていた。港には、帆を畳んだ船が、何艘も、休んでいた。", "灯が、一つ、また一つと、点いていく。", "ベルイザナは、丘の上の、大きな岩に、腰を下ろした。", "今夜は、町には、入らない。夜の町は、勝手が分からない。朝を、待つことにした。", "風が、海の匂いを、運んできた。", "魔界の風とは、違った。塩と、魚と、焼いた何かの、匂い。遠くから、人の声が、かすかに、届いた。笑い声。呼び声。子どもの泣き声。", "あの灯の一つ一つの下に、人が、いる。", "根の洲の焼け野を、思い出した。顔を見ずに、消した兵たち。あの兵たちも、どこかの灯の下に、帰るはずだった。", "右の手が、外套の陰で、小さく、震えた。", "ベルイザナは、それを、もう片方の手で、押さえた。", "三日間を、思い返した。", "青い空。火の熾し方。干し飯の、麦の甘さ。銭を押し戻した、老婆の皺だらけの手。宿の前で、慣れた足取りで背を向けた、男の背中。そうっと地面を踏んで歩いた、女の子の笑い声。", "たった三日で、知らないことが、こんなにあった。", "(私は、何も、知らなかった)", "魔界の王として、人間の国を、地図の上でしか、知らなかった。兵の数と、城の位置と、街道の線。それだけを、知っていた。", "その線の上を、人が、歩いている。荷車を引いて。子どもを乗せて。宿に断られて、笑って。", "ベルイザナは、岩の上で、背筋を伸ばした。", "明日、あの町で、名を名乗る。", "偽りの名だ。けれど、その名で、人と出会い、人と話し、人の隣を、歩くことになる。", "小さく、声に出してみた。", "「私の名は、ベル」", "風が、その声を、さらっていった。", "「ただの、冒険者だ」", "露台で、声に出さずに言ったときより、少しだけ、自分の声に聞こえた。", "まだ、馴染んではいない。けれど、三日前よりは、近い。", "夜が、降りてきた。港町の灯が、ひときわ明るく、瞬いていた。", "ベルは、外套の襟を立てて、岩にもたれた。目を閉じると、潮騒が、聞こえた。", "明日の朝は、きっと、騒がしいだろう。"]}]}, {"id": "ch04_5", "label": "第四・五章", "title": "名を呼ばれない港", "chars": 9168, "sections": [{"h": "一", "p": ["ギルドの扉を押したのは、まだ朝の鐘が鳴りきらないうちだった。", "オオナムチは、敷居をまたいだところで、足を止めた。", "掲示板の前に、黒い外套の背中があった。", "ベルだ。ひなた野の届け物から、今日で七日になる。あれから、二人で三つの依頼をこなした。港の倉庫の鼠払い。野原の柵の修理。迷い山羊の連れ戻し。どれも、報酬は銅貨で十枚か、十五枚。それでも、ベルは、一度も文句を言わなかった。", "ベルは、何をするにも、不思議な人だった。", "鼠払いの日、倉庫の隅で、鼠の親子を見つけた。オオナムチが棒を振り上げると、ベルが、その手首を、そっと押さえた。", "「巣ごと、外へ移せばよい。倉庫の主は、鼠がいなくなればよいのだろう」", "そう言って、本当に、木箱に巣を入れて、町はずれの草むらまで運んでいった。倉庫の主は、首をかしげながら、銅貨を払った。", "柵の修理の日は、釘の打ち方を知らなかった。金槌を握る手つきが、剣を持つように、まっすぐすぎた。三本目の釘を曲げたとき、ベルは、曲がった釘を、じっと見つめていた。", "「……難しいな」", "その顔が、あまりに真剣で、オオナムチは、吹き出してしまった。ベルは、怒らなかった。少しだけ、困ったように、口の端を下げた。", "迷い山羊の日は、もっと、おかしかった。", "半日探し回って、ようやく崖の上に山羊を見つけた。オオナムチが、どう近づこうかと考えているうちに、ベルが、すたすたと歩いていった。山羊は、逃げなかった。それどころか、ベルの前で、膝を折った。まるで、頭を下げるように。", "「動物には、好かれるんですね」", "帰り道、オオナムチが言うと、ベルは、少しだけ間を置いて答えた。", "「人間より、正直なのかもしれぬ」", "その言い方が、妙に寂しく聞こえた。", "剣の腕は、確かなはずだった。野犬を、一瞥で追い払った人だ。それなのに、釘も打てない。荷運びも、たぶん、したことがない。どこかの、いい家の生まれなのかもしれない。それにしては、偉ぶるところが、少しもない。", "(変な人だ)", "最初の日と、同じことを思った。けれど、その言葉の意味は、少しずつ、変わってきていた。", "その背中が、今朝は、動かなかった。", "掲示板の隅の、あの紙の前だった。", "『魔族は話の通じぬ者たちである。正義は我らにあり』", "ベルは、紙を見上げていた。顔は見えない。ただ、外套の脇で、右の手が、ゆっくりと握られていくのが見えた。", "指が、白くなるほどだった。", "オオナムチは、声をかけそびれた。", "拳は、しばらく、そのままだった。それから、一本ずつ、指がほどけていった。まるで、自分の手に、言い聞かせているように。", "(怒っている)", "そう思った。けれど、何に怒っているのかは、分からなかった。紙の文句に怒る冒険者など、見たことがない。誰もが、その紙の前を、通り過ぎていく。オオナムチ自身も、そうだった。見慣れすぎて、もう、字として目に入らなかった。", "ベルは、紙から目を離し、掲示板の別の列へ移った。いつもの、静かな横顔に戻っていた。", "オオナムチは、わざと足音を立てて近づいた。", "「おはようございます、ベルさん」", "「ああ」", "ベルは、振り向いた。灰色の目が、いつもどおり、まっすぐこちらを見た。", "「早いな」", "「ベルさんこそ」", "「良い依頼は、朝のうちに剥がされると聞いた」", "「それ、俺が言ったやつです」", "「そうだったか」", "ベルは、表情を変えずに言った。オオナムチは、少しだけ笑った。", "さっきの拳のことは、口にしなかった。聞いてはいけない気がした。聞けば、この人は、答えてくれる気もした。だからこそ、聞かなかった。", "「今日は、どれにしますか」", "「これはどうだ」", "ベルが指したのは、港の荷下ろしの紙だった。日雇い、昼まで、銅貨十二枚。", "「港ですか。力仕事ですよ」", "「構わぬ」", "「ベルさん、荷物、運んだことあります？」", "「ない」", "即答だった。オオナムチは、紙を剥がしながら、また笑った。"]}, {"h": "二", "p": ["港は、朝から潮の匂いが濃かった。", "ベルは、桟橋に横づけされた船を見上げた。腹の膨らんだ荷船だった。麻袋と木箱が、甲板に山と積まれている。", "「おう、ギルドの兄さんたちか。助かるよ」", "船の脇で、若い男が手を振った。日に焼けた肌に、短い髪。耳の先が、わずかに尖っていた。", "「荷運びのトマリだ。今日は、俺の言うとおりに動いてくれ。袋は肩、箱は二人で。濡らすなよ。塩が溶ける」", "トマリは、よく喋った。喋りながら、手も足も止まらない。重い袋を、ひょいと肩に乗せては、倉庫まで小走りで運んでいく。", "ベルも、袋を担いだ。", "軽かった。軽すぎて、困った。黄泉の力を畳み込んでも、体の芯は魔王のままだ。人間の青年が、ふらつかずに運べる重さ。それが、どれくらいなのか、分からない。", "隣で、オオナムチが、歯を食いしばって袋を担いでいた。足が、少し揺れている。", "ベルは、自分の足も、少しだけ揺らしてみた。", "「ベルさん、無理しないでくださいね」", "「ああ。重いな」", "「ですよね」", "オオナムチが、汗をぬぐって、うなずいた。ベルは、内心で、ひとつ息をついた。", "(難しい)", "戦うよりも、ずっと難しかった。", "昼が近づくころ、桟橋の先に、小さな舟が一艘、戻ってきた。", "漕いでいたのは、年寄りの漁師だった。背が丸く、腕は細いが、櫂を扱う手つきに迷いがない。舟の底で、銀色の魚が跳ねていた。", "「おい、爺さん。こっち、空けてくれ」", "荷船の水夫が、怒鳴った。老人は、何も言わずに、舟を脇へ寄せた。", "「爺さん、今日の魚は網元へ持ってくのか」", "「爺さん、そこに縄を置くなって」", "誰もが、老人をそう呼んだ。爺さん。おい。あんた。", "ベルは、袋を下ろしながら、老人を見た。", "そして、目を細めた。", "(薄い)", "老人の輪郭が、わずかに、ぼやけて見えた。日差しのせいではない。周りの水夫たちは、くっきりと見える。老人だけが、霧の向こうに立っているようだった。", "偽名の言霊を、ベルは、自分の身にまとっている。人の記憶に残りにくくなる、薄い膜だ。老人の周りにあるものは、それに、少し似ていた。だが、言霊の匂いはしない。誰かが、術をかけたのではない。", "もっと、静かな何かだった。", "「イサナさん」", "桟橋の向こうから、澄んだ声がした。", "若い娘が、籠を抱えて駆けてきた。髪を布で包み、裾を短くからげている。", "「イサナさん、今日の分、父さんのところへ持っていくね。いつもの、鯵と鰈でしょう」", "「ああ。アサギか。すまんな」", "老人が、初めて口を開いた。かすれた、低い声だった。", "娘が、イサナ、と呼んだ。その一瞬だけ、老人の輪郭が、わずかに戻った気がした。", "ベルは、袋を担ぎ直すのも忘れて、それを見ていた。", "「網元の娘さんだよ」", "トマリが、ベルの横で、小声で言った。", "「アサギさんだけだ。親方を、名前で呼ぶのは」", "「親方」", "「俺の親方さ。十のときから、舟に乗せてもらってる」", "トマリは、少し誇らしげに言った。けれど、すぐに、口をつぐんだ。", "「……俺も、親方って、呼んじまうんだけどな」", "その声は、波の音に紛れて、ほとんど聞こえなかった。"]}, {"h": "三", "p": ["日雇いの銅貨を受け取ったのは、昼を少し過ぎたころだった。", "帳場の男が、帳面に指を走らせながら、名を読み上げていく。", "「トマリ。ベル。オオナムチ。……それと」", "男の指が、止まった。", "「舟の爺さんの分は、網元から出るんだったか。ええと、名前は」", "「イサナさんです」", "オオナムチが、思わず言った。", "「ああ、そうそう。そうだった」", "男は、帳面に何かを書き足した。顔も上げなかった。オオナムチは、その帳面を覗き込んだ。老人の欄には、名前の代わりに、小さな丸が一つ、描かれていた。", "胸の奥が、ざらりとした。", "その日の夕方、二人は、港通りの安宿へ向かった。", "宿の入口には、短い列ができていた。荷運びの男たち、旅の行商人。その列の端に、子どもが三人、並んでいた。", "一番大きな子で、十歳ほど。いちばん小さな子は、まだ五つにもならないだろう。三人とも、裸足だった。一人は、頭に小さな角が二つあった。一人は、背中で細い尻尾が揺れていた。", "宿の主人が、戸口で、子どもたちを見下ろした。", "「うちは、そういう客は、取ってないんだ」", "「お金は、あります」", "大きな子が、握りしめた手を開いた。銅貨が、四枚。", "「荷運びで、もらいました。一晩だけ、軒の下でもいいんです」", "「悪いな」", "主人は、言葉ほどには悪そうな顔をしなかった。困ったように眉を寄せ、それから、子どもたちの後ろに並んだ行商人に、手招きをした。", "「お客さん、どうぞ。お一人で」", "戸が、閉まった。", "子どもたちは、何も言わなかった。言い返しもしなかった。ただ、小さい子の手を引いて、列を離れた。慣れている足取りだった。", "オオナムチは、立ち尽くしていた。", "あの足取りを、知っていた。", "子どものころ、自分も、あんなふうに歩いた。街へ使いに出されて、帰りが遅くなった日。宿の灯りの前を、何度も通り過ぎた。どの戸口でも、生まれた土地の名を言うと、戸が閉まった。誰も、怒鳴りはしなかった。ただ、困ったように、眉を寄せた。", "怒鳴られたほうが、まだ、ましだった。", "「オオナムチ」", "ベルの声がした。", "気づくと、オオナムチは、通りの角のパン屋の前にいた。いつの間にか、足が向いていた。懐の銅貨を、全部、台に出していた。", "「……すみません。今日の稼ぎ、使っちゃいました」", "「そなたの稼ぎだ」", "ベルは、それだけ言った。", "子どもたちは、倉庫の裏の、庇の下にいた。オオナムチがパンの包みを差し出すと、大きな子が、警戒するように、小さな子を背にかばった。", "「腹、減ってるだろ」", "オオナムチは、しゃがんで、包みを地面に置いた。それから、少し離れた。", "しばらくして、小さな手が、包みに伸びた。", "角のある子が、パンを半分に割った。それを、さらに半分に割って、尻尾のある子に渡した。三人で、四つに分けて、最後の一切れを、大きな子が、オオナムチのほうへ差し出した。", "「……いいよ。俺は」", "「でも」", "「いいんだ」", "オオナムチは、笑った。うまく笑えたかどうかは、分からなかった。", "少し離れた場所で、ベルが、その様子を見ていた。何も言わなかった。外套の脇で、また、右の手が、ゆっくりと握られていた。"]}, {"h": "四", "p": ["三日後の依頼は、野原の見回りだった。", "港の東に広がる草地は、海沿いに、河口の葦原へ続いている。野犬が増えて、放牧の羊が襲われるらしい。", "日が傾くまで歩いても、野犬は出なかった。代わりに、河口の砂地で、笑い声が聞こえた。", "若い冒険者が四人、輪になって、何かを囲んでいた。", "ベルは、足を止めた。", "輪の真ん中に、白い兎が一匹、うずくまっていた。いや、白かったはずの兎だ。背中の毛が、ごっそりと剥げ、赤い肌が、むき出しになっている。漁師の網にでも絡まったのか。体が、細かく震えていた。", "「海の水で洗ってやりゃ、すぐ治るって」", "一人が、桶を傾けた。潮水が、兎の背中にかかる。", "兎が、甲高い声を上げて、跳ねた。", "「ほら、元気になった」", "「風に当てて、乾かしてやれよ。そのほうが早い」", "笑い声が、上がった。悪意があるのか、ないのか。たぶん、彼らにも、分かっていない。", "ベルは、一歩、前に出かけた。", "その前を、オオナムチが、通り過ぎた。", "「何してるんですか」", "声は、静かだった。けれど、若い冒険者たちが、一瞬、黙った。", "「何って、手当てだよ。海の水は、傷に効くって」", "「効きません」", "オオナムチは、兎の前に、膝をついた。", "「潮は、傷に染みます。風に当てたら、肌がひび割れる。もっと、ひどくなる」", "「……なんだよ。冗談だろ」", "若い冒険者たちは、気まずそうに顔を見合わせ、肩をすくめて、去っていった。", "オオナムチは、兎を、そっと両手ですくい上げた。兎は、もう、暴れる力もなかった。", "「ベルさん。川の水、汲んでもらえますか。海の水が混ざってない、上のほうの」", "ベルは、黙って、水筒を手に、河口を上った。", "真水で、兎の背中を、ゆっくりと洗った。潮が流れ落ちるたびに、兎の震えが、少しずつ、小さくなっていく。", "それから、オオナムチは、葦原の中に分け入った。戻ってきたとき、手には、蒲の穂を何本も抱えていた。穂を揉みほぐすと、黄色い花粉が、指の間から、さらさらとこぼれた。", "「集落の年寄りが、教えてくれたんです。傷には、真水と、蒲の花」", "花粉を敷いた上に、兎を、そっと寝かせた。", "「――癒やし」", "温かいものが、兎を包んだ。剥げた背中に、うっすらと、薄い膜が張っていく。毛は、まだ戻らない。けれど、赤い肌の色が、落ち着いていった。", "兎が、鼻を、ひくりと動かした。", "ベルは、その光景から、目が離せなかった。", "(この話を、知っている)", "魔界の、古い昔話だった。幼いころ、宮の書庫で、誰かに読んでもらった。皮を剥がれて泣いている白い兎に、大勢の兄神たちは、海の水を浴びて風に当たれと教えた。最後にやってきた末の弟だけが、真水で洗い、蒲の花に寝かせよと教えた。", "兄神たちに荷を背負わされ、いちばん後ろを歩いていた、末の弟。", "その神の名は、何といったか。書庫の古い字は、もう、思い出せない。ただ、響きだけが、耳の奥に残っていた。", "(名も、似ている)", "ベルは、兎の背を撫でる青年の横顔を、長く見つめた。", "兎は、日が沈むころ、葦原の奥へ、跳ねていった。一度だけ、振り返った。赤い目が、夕日に光った。"]}, {"h": "五", "p": ["その夜、宿の裏庭で、ベルは、オオナムチに言った。", "「堅めを、唱えてみろ」", "「今ですか」", "「今だ」", "オオナムチは、戸惑いながらも、短剣を置いて、立った。", "「――堅め」", "体の周りに、薄い膜が立ち上がった。ベルは、それを、じっと見た。", "「厚すぎる」", "「え」", "「野犬のときも、そうだった。膜を、全部、前に張っている。だから、脇から来られると、軋む」", "ベルは、地面に、小枝で円を描いた。", "「薄く、広く。自分の周りを、ぐるりと包むように。厚さは、半分でよい」", "「半分」", "「半分ずつ、包め」", "オオナムチは、もう一度、唱えた。膜が、今度は、ふわりと広がった。けれど、すぐに、形が崩れた。", "「難しいです」", "「難しい。私も、最初は、できなかった」", "「ベルさんは、どこで習ったんですか」", "ベルは、少し、黙った。", "「昔、教えてくれた者がいた」", "それ以上は、言わなかった。オオナムチも、聞かなかった。", "それから、何度も、唱えた。月が、庭の井戸の真上に来るころには、膜は、オオナムチの体を、半分くらいまで包めるようになっていた。", "二人は、井戸の縁に腰を下ろした。オオナムチは、肩で息をしていた。", "「ベルさん」", "「何だ」", "「変なこと、言っていいですか」", "「言え」", "オオナムチは、少し、ためらった。", "「港の、イサナさん。あの人の顔、見えにくくないですか」", "ベルは、息を止めた。", "「初めて見たときから、少し、薄かったんです。日に日に、もっと薄くなってる気がして。俺の、気のせいかもしれないんですけど」", "ベルは、すぐには、答えなかった。", "この青年は、ベルの顔を、最初から、はっきりと見ていた。偽名の膜を、何でもないことのように、くぐり抜けて。その目が、今度は、あの老人の薄さを、見ている。", "(目がいい、では、すまない)", "けれど、それを口にすることは、できなかった。言えば、自分の膜のことにも、触れることになる。", "「気のせいではない」", "ベルは、それだけ言った。", "「……そうですか」", "「明日、名を呼んでやれ」", "「名を」", "「あの老人は、名を呼ばれていない。誰からも」", "オオナムチは、しばらく、黙っていた。それから、小さく、うなずいた。", "「呼びます」", "その声は、井戸の底へ、静かに落ちていった。"]}, {"h": "六", "p": ["翌朝、オオナムチは、一人で、桟橋へ行った。", "まだ、陽が低かった。桟橋の先に、小舟が一艘、舫われていた。老人が、舟の中で、網を手繰っていた。", "オオナムチは、桟橋の端に立った。", "息を、一つ、吸った。", "「イサナさん」", "老人の手が、止まった。", "ゆっくりと、顔が上がった。皺の深い顔だった。目は、海の色をしていた。", "その顔が、はっきりと、見えた。", "さっきまで、霧の向こうにあった輪郭が、朝の光の中に、戻ってきていた。眉の白さも、頬の古い傷も、唇の端の、わずかな歪みも。", "「……わしを、呼んだのか」", "「はい。イサナさん、ですよね」", "「ああ」", "老人は、網を膝に置いたまま、オオナムチを見た。", "「名を呼ばれたのは、いつ以来かのう」", "「アサギさんが、呼んでましたよ」", "「あの子は、別じゃ。あの子は、子どものころから、わしの舟で遊んでおった」", "老人は、少し笑った。笑うと、目尻の皺が、もっと深くなった。", "「おまえさん、昨日の、荷運びの子じゃな」", "「オオナムチです」", "「オオナムチ。……妙な名じゃ。昔話に、そんな名の神様がおったような」", "「よく言われます」", "本当は、一度も言われたことがなかった。ただ、なぜか、そう答えていた。誰かの口癖が、移ったのかもしれなかった。", "老人は、網を繕いながら、ぽつり、ぽつりと話した。", "昔は、網元と並ぶ、大きな船を持っていた。乗り手は二十人。人間もいれば、耳の尖った者も、尻尾のある者もいた。腕が良ければ、誰でも乗せた。", "「それが、いけなかったらしい」", "数年前から、港の空気が、少しずつ変わった。亜人を乗せる船の魚は、買い叩かれるようになった。乗り手が、一人、また一人と、去っていった。最後に残ったのは、十のときに拾った、トマリだけだった。", "「船を売って、この小舟だけが残った。そのころからじゃ。誰も、わしの名を、呼ばなくなった」", "「どうして」", "「さあのう」", "老人は、首を振った。", "「呼ぶと、仲間だと思われる。そういうことかもしれん。誰も、悪気はないんじゃ。わしと口をきかないのが、いちばん面倒がない。それだけのことよ」", "オオナムチは、何も言えなかった。", "宿の主人の、困ったような眉を、思い出した。帳面の、小さな丸を、思い出した。", "「名を呼ばれなくなるとな、不思議なもんで、自分でも、自分の名を、思い出さなくなる。鏡を見ても、誰だか、分からんような気がしてくる」", "老人は、手を止めて、海を見た。", "「さっき、おまえさんに呼ばれて、思い出した。わしは、イサナじゃった」", "波が、舟の腹を、ちゃぷりと叩いた。"]}, {"h": "七", "p": ["トマリは、倉庫の陰から、桟橋を見ていた。", "親方の舟の前に、昨日の、ギルドの若いのが立っていた。継ぎの当たった外套の、細い肩の男だ。", "その男が、親方を、呼んだ。", "イサナさん、と。", "何でもないことのように。天気の話でもするように。", "トマリは、縄の束を、握りしめた。", "十のときだった。港の裏で、魚の頭を拾って食べていた。耳の先が尖っているというだけで、どこの戸口でも追い払われた。その日も、網元の倉庫番に、棒で追われていた。", "逃げ込んだ先が、親方の船だった。", "「腹が減っとるなら、働け。働いたら、食わせてやる」", "親方は、そう言って、トマリの襟首をつかみ、甲板に放り投げた。それから八年、トマリは、親方の船で育った。網の結び方も、潮の読み方も、全部、親方に教わった。", "船が売られた日も、トマリは、親方の隣にいた。", "港の連中が、親方の名を、呼ばなくなっていった。トマリは、それに気づいていた。気づいていて、何もしなかった。", "いや、それだけではない。", "トマリ自身も、親方の名を、呼ばなくなった。", "人前で、イサナ、と呼べば、皆が振り向く。あの耳の尖った小僧が、また、あの爺さんと一緒にいる、と。そのたびに、親方の魚の値が、下がる気がした。", "だから、親方、とだけ呼んだ。親方なら、誰の親方か、分からない。自分が、親方の足を引っぱらずに済む。", "そう、思っていた。", "(守ってるつもりだった)", "けれど、桟橋の上で、名を呼ばれた親方の顔を見て、トマリは、分かってしまった。", "あんな顔を、ずっと、見ていなかった。", "親方は、笑っていた。皺の深い目尻を、くしゃくしゃにして。若いのに、何か、昔の話をしている。手は、網を繕いながら、口は、止まらない。", "名を呼ばれただけで。", "トマリの喉の奥が、熱くなった。", "自分は、何を、守っていたのだろう。親方の魚の値か。自分の、居場所か。それとも、ただ、振り向かれるのが、怖かっただけか。", "「……馬鹿だな、俺」", "トマリは、縄の束を、肩に担ぎ直した。", "桟橋の向こうで、若いのが、こちらに気づいたように、顔を上げた。トマリは、慌てて、倉庫の陰に引っ込んだ。", "心臓が、うるさかった。", "今日の夕方、網干し場で、アサギさんの手伝いがある。親方も、来るはずだ。", "そこで、呼んでみよう。", "一度だけ。小さな声でいい。", "トマリは、口の中で、その名を、そっと転がしてみた。", "舌が、うまく回らなかった。何年も、口にしていなかった名だ。それでも、二度、三度と転がすうちに、少しずつ、形になっていった。", "「イサナ、親方」", "倉庫の壁に、声が、跳ね返った。誰も、聞いていなかった。", "それでいい、と思った。練習だ。"]}, {"h": "八", "p": ["夕方、ベルは、港の網干し場を通りかかった。", "木の杭の間に、漁網が、何枚も張られていた。その陰で、アサギが、網を繕っていた。", "隣に、イサナが座っていた。少し離れて、トマリが、縄を巻いていた。", "「イサナさん、ここ、目が飛んでる」", "「どれ。……ああ、ほんとじゃ」", "「イサナさん、手が遅くなったね」", "「年じゃよ」", "アサギは、何度も、何度も、名を呼んだ。わざとなのか、癖なのか。ベルには、分からなかった。ただ、名が呼ばれるたびに、老人の輪郭が、少しずつ、濃くなっていくように見えた。", "縄を巻いていたトマリが、手を止めた。", "「……イサナ、親方」", "小さな声だった。", "老人が、振り向いた。トマリは、真っ赤になって、縄に顔を埋めた。", "「なんじゃ、トマリ。急に」", "「別に。呼んでみただけっす」", "アサギが、声を上げて笑った。老人も、笑った。トマリだけが、縄の陰で、耳まで赤くしていた。", "ベルは、杭の陰で、立ち止まっていた。", "(名を、呼ぶ)", "それだけのことだった。言霊でもない。術でもない。ただ、名を呼ぶ。それだけで、消えかけていた輪郭が、戻ってくる。", "魔界の民の名を、ベルは、いくつ呼んできただろう。王として、民の顔を、どれだけ見てきただろう。", "根の洲の、焼け野を、思い出した。顔を見ずに、消した兵たち。名を、一つも、知らない。", "拳が、また、握られかけた。ベルは、それを、ゆっくりと開いた。", "ギルドに戻ると、掲示板の前に、オオナムチが立っていた。", "「ベルさん。これ、見てください」", "指さした先に、新しい紙が貼られていた。", "『聖の森、薬草採りの護衛。報酬、銅貨三十枚』", "「三十枚ですよ。前の倍です」", "「行き先は」", "「聖の森です。エルフの森。人間は、あんまり歓迎されないらしいですけど」", "オオナムチは、少し、照れたように頭をかいた。", "「誰も、受けないかもしれないなって」", "ベルは、口の端を、わずかに上げた。", "「誰も受けないから、受ける」", "「はい」", "「よい理由だ」", "オオナムチが、紙を剥がした。受付の女が、顔も上げずに、「次の方」と言った。", "港のほうから、夕べの鐘が、聞こえてきた。網干し場の杭の間を、潮風が、抜けていった。そこでは、まだ、誰かが、誰かの名を、呼んでいるはずだった。", "「報酬は、半分ずつだ」", "ベルが言った。", "「危険も、半分ずつですね」", "オオナムチが、笑って答えた。"]}]}, {"id": "ch05_5", "label": "第五・五章", "title": "森の底の石", "chars": 9496, "sections": [{"h": "一", "p": ["森の出口から、一刻ほど歩いたころだった。", "後ろから、軽い足音が近づいてきた。草を蹴る、速い足音だった。", "「待ちなさいよ」", "オオナムチが振り向くと、コノハが、肩で息をしながら立っていた。弓は持っていない。代わりに、腰に小さな鉈を下げている。", "「コノハさん。どうしたんですか」", "「スクナが、呼んでる」", "コノハは、額の汗をぬぐって、そっぽを向いた。", "「私が来たかったわけじゃないから。あの爺さん、足が遅いのよ」", "ベルが、黙ってコノハを見た。コノハは、その視線から、少しだけ目をそらした。", "「何があった」", "「地下道が、ふさがったの」", "森の西の外れに、古い地下道がある。苔むした石の道で、森の底を通って、境の荒れ地へ抜けている。昨日の洞窟の魔族たちは、そこを通って、森へ逃げ込んできたのだという。", "「その出口のあたりに、苔の大蜘蛛が巣を作ったって。今朝、見張りが見つけたの」", "「見張りの方が、退治しないんですか」", "「しないわよ」", "コノハは、鼻を鳴らした。", "「この森の者は、何もしない。見ても、何も言わない。知ってるでしょ」", "オオナムチは、昨日の広場を思い出した。視線だけを寄越して、何も言わないエルフたち。", "「スクナは、何て」", "「まだ、あとから来る者がいるかもしれないって」", "コノハの声が、少しだけ低くなった。", "「昨日の、鴉族の人。家族と離れ離れだって言ってたでしょう。もし、あの人の家族が、同じ道を通ってきたら」", "その先は、言わなかった。", "ベルが、背負っていた荷を、下ろした。", "「行く」", "短い一言だった。迷いが、少しもなかった。", "オオナムチは、ベルの横顔を見た。昨夜、窓の隙間から見た顔を、思い出した。去っていく背中を、長く見送っていた顔。", "(やっぱり、あの人たちを、知っているんだ)", "聞かない、と決めたのは、昨夜のことだった。オオナムチは、自分の荷も下ろした。", "「俺も行きます」", "「……当たり前でしょ」", "コノハは、もう歩き出していた。", "「そのために、走ってきたんだから」"]}, {"h": "二", "p": ["地下道の入口は、苔に覆われた岩の割れ目だった。", "コノハは、割れ目の前で、足を止めた。", "岩の上に、エルフの女が一人、座っていた。弓を膝に置き、矢筒を背負っている。年は、エルフの見た目で言えば、まだ若い。けれど、その横顔は、ひどく疲れて見えた。", "(シイ)", "コノハは、その名を知っていた。森の見張りの弓手だ。腕は、森で一番だと言われていた。", "言われていた、のだ。もう、何年も前の話だった。", "「ここから先、大蜘蛛がいる」", "シイは、こちらを見ずに言った。", "「見張りの仕事は、見ることだけ。通るなら、勝手に通って」", "「分かってるわ」", "コノハは、短く答えた。", "それで、終わりだった。いつもと同じだ。森の者は、互いに、必要なことしか言わない。", "けれど、コノハの隣で、オオナムチが、じっとシイを見ていた。", "「あの」", "オオナムチが、遠慮がちに、シイに声をかけた。", "「見張り、ずっと一人でやってるんですか」", "シイは、驚いたように、顔を上げた。", "その顔を見て、コノハは、息を詰めた。", "(薄い)", "シイの輪郭が、ぼやけていた。木漏れ日のせいではない。岩も、苔も、くっきり見える。シイだけが、水に溶けかけた墨のように、滲んでいた。", "「……一人よ。ずっと」", "シイは、それだけ言って、また目をそらした。", "コノハは、思い出していた。", "何年前だったか。森の外れで、人間の子どもが迷子になった。夜の森は、人間には危ない。見張りだったシイは、掟を破って、その子を森の家に泊めた。翌朝、子どもを森の外まで送り届けた。", "それだけのことだった。", "それから、森の者は、シイの名を呼ばなくなった。誰かが決めたわけではない。ただ、誰も、呼ばなくなった。", "コノハも、そうだった。", "人間の血を引く自分が、シイの名を呼べば、何かを言われる気がした。だから、呼ばなかった。森の端で、自分の身を守るのに、精一杯だった。", "(私も、同じことをしてた)", "胸の奥が、冷たくなった。", "「行くわよ」", "コノハは、オオナムチの袖を引いて、割れ目に足を踏み入れた。振り返らなかった。振り返れば、何かを言わなければいけない気がした。", "背後で、ベルが、シイの前で、わずかに足を止める気配がした。それから、黙って、ついてきた。"]}, {"h": "三", "p": ["地下道は、思っていたよりも、広かった。", "天井は低いが、石を積んだ壁は崩れていない。床も、壁も、緑の苔に覆われ、湿った匂いがした。ところどころ、天井の隙間から、細い光が落ちてくる。", "奥へ進むほど、苔は厚くなった。やがて、白い糸が、壁から壁へ、渡されているのが見えた。", "「巣よ」", "コノハが、鉈を抜いた。", "糸の奥で、何かが動いた。", "苔をまとった、大きな影だった。人の背丈ほどもある、八本足の蜘蛛。背中一面に、緑の苔が生えている。複眼が、暗がりの中で、鈍く光った。", "オオナムチの足が、すくんだ。", "(大きい)", "野犬とは、比べものにならない。", "蜘蛛が、前脚を振り上げた。", "「――堅め」", "口が、先に動いた。体の周りに、膜が立ち上がる。ミナモの宿の裏庭で、何度も練習した形だ。厚すぎず、ぐるりと包むように。", "前脚が、膜を打った。軋んだ。けれど、破れなかった。", "「下がりなさい」", "コノハが、オオナムチの前に出た。鉈で、垂れ下がった糸を、払い落とす。", "「待って」", "オオナムチは、蜘蛛の後ろを見ていた。", "糸の奥に、白い、丸い塊があった。人の頭ほどの大きさの、糸で包まれた袋。蜘蛛は、その袋の前から、一歩も動かない。前脚を振り上げるたびに、袋のほうへ、体を寄せる。", "「卵です」", "「え」", "「あの蜘蛛、卵を守ってるだけです。襲ってきてるんじゃない。こっちが、近づきすぎてるんだ」", "コノハが、鉈を下ろした。", "蜘蛛の複眼が、二人を見ていた。前脚を振り上げたまま、動かない。", "ベルが、オオナムチの後ろから、静かに言った。", "「巣を、移せばよい」", "ミナモの倉庫で、鼠の巣を運んだときと、同じ声だった。", "「この道の脇に、枝分かれした通路がある。来るときに見た。乾いていて、光も届かぬ。蜘蛛には、そちらのほうが住みよいはずだ」", "「でも、どうやって」", "「私が、蜘蛛の気を引く。そなたは、堅めで卵を包め。コノハ殿は、糸を切ってくれ」", "コノハが、ベルを見た。", "「……あなた、本当に、駆け出しの冒険者？」", "「よく言われる」", "ベルは、それだけ言って、一歩、前に出た。", "何をしたのか、オオナムチには、分からなかった。ベルは、剣も抜かず、ただ、蜘蛛の正面に立っただけだった。蜘蛛の複眼が、一斉に、ベルのほうを向いた。前脚が、ゆっくりと、下がっていく。", "まるで、何か、大きなものの前で、身を縮めるように。", "その隙に、コノハが、糸を切った。オオナムチは、卵の袋に手を伸ばし、もう一度、唱えた。", "「――堅め」", "膜が、袋を包んだ。思っていたより、ずっと軽かった。", "枝分かれした通路の奥に、袋を置いた。蜘蛛は、しばらく、三人を見ていた。それから、八本の脚で、音もなく、袋のほうへ這っていった。", "地下道に、静けさが戻った。", "オオナムチは、壁にもたれて、座り込んだ。手が、まだ、少し震えていた。", "「……やるじゃない」", "コノハが、言った。昨日と、同じ言葉だった。"]}, {"h": "四", "p": ["地下道の、いちばん奥だった。", "境の荒れ地へ抜ける出口の手前に、小さな空洞があった。天井の裂け目から、光が、まっすぐに落ちている。その光の下に、石が一つ、立っていた。", "人の腰ほどの高さの、古い石碑だった。", "ベルは、石の前に、膝をついた。", "表面に、文字が刻まれていた。苔に半分埋もれている。ベルは、指で、そっと苔を払った。", "四つの文字が、現れた。", "人間の文字ではなかった。エルフの文字でもない。それでいて、ベルには、読めた。魔界の、宮の書庫にある、いちばん古い石板と、同じ形の文字だった。", "「か、た、め」", "声に出すと、オオナムチが、驚いたように、こちらを見た。", "「堅め、ですか。俺が、使ってる」", "「そうだ」", "「読めるんですか、ベルさん」", "ベルは、答えなかった。", "人間界の森の底に、魔界と同じ文字がある。守りの言霊の名が、刻まれている。", "(なぜ)", "「古い、古い祈りの言葉じゃよ」", "背後から、しわがれた声がした。", "振り向くと、スクナが、杖をつきながら、空洞の入口に立っていた。息が上がっている。", "「スクナ。来たの」", "「来たとも。年寄りを置いていくでない」", "スクナは、ゆっくりと、石碑の前まで歩いてきた。それから、石の表面を、皺だらけの手で、撫でた。", "「この石は、エルフがこの森に住むより、もっと前からある。人間が、この国を作るより、もっと前じゃ。その頃は、森も、荒れ地も、大穴の向こうも、一つの土地だったという」", "「一つの」", "「そうじゃ。人も、エルフも、角のある者も、翼のある者も、同じ神々に、同じ言葉で、祈っていた。山を守ってくれ。火を灯してくれ。傷を癒やしてくれ」", "スクナは、目を細めて、ベルを見た。森の入口で、初めて会ったときと、同じ目だった。", "「この世界の民は、種族を超えて、同じ祈りを持っておる。わしは、そう思っとるよ」", "ベルは、何も言えなかった。", "人間界の森の底の石に、宮の書庫と、同じ形の文字がある。それが、何を意味するのか。ベルには、まだ、分からなかった。", "「祈りは、忘れられても、なくならん。石に刻めば、残る。名と、同じじゃ」", "スクナは、石から手を離した。", "「名、ですか」", "オオナムチが、聞き返した。", "それから、少し迷うように、ベルを見た。", "「ベルさん。入口にいた、シイさん。あの人の顔も、薄く見えたんです。港の、イサナさんと、同じように」", "コノハが、はっとして、オオナムチを見た。", "ベルは、石碑から目を上げた。", "(この青年には、見えている)", "隠しても、いずれ、気づくだろう。それなら、今、言葉にしておくほうがいい。", "「まことの名が、存在の輪郭を作る」", "ベルは、静かに言った。", "「名を呼ばれぬ者は、少しずつ、輪郭が薄れる。誰にも呼ばれず、自分でも名を思い出さなくなれば、最後には、誰の記憶にも残らなくなる」", "空洞に、光の筋が、落ちていた。苔の匂いが、した。", "「そんなこと、あるんですか」", "「ある」", "ベルは、それ以上、説明しなかった。自分の身にまとった、偽りの名のことを、思った。名一つで、人の目に映らなくなる。逆に、名一つで、人は、ここにいると、示すこともできる。", "「だから、呼ぶのよね」", "コノハが、ぽつりと言った。", "誰に言うでもなく、石碑を見つめたまま。", "「呼べば、戻るんでしょう。港の人は、戻ったって、聞いたわ」", "「はい」", "オオナムチが、うなずいた。", "コノハは、唇を噛んで、黙った。その横顔は、何かを、決めようとしているように見えた。", "「ユズリハの婆さまも、そうじゃった」", "スクナが、ぽつりと言った。", "「森の語り部でな。昔の話を、よく子どもらにしてくれた。森と人と、大穴の向こうの者たちが、一緒に祭りをした頃の話を。それを、話しすぎたんじゃろう。いつからか、誰も、婆さまを、祭りに呼ばなくなった」", "「今は」", "「森の奥の、うろの家におる。もう、自分の名も、怪しいかもしれんのう」", "スクナは、杖に体重を預けて、息を吐いた。", "「わしが呼べばよいのじゃが。わしの声は、もう、遠くまで届かん」"]}, {"h": "五", "p": ["うろの家は、森の奥の、倒れかけた古木の根もとにあった。", "地下道から戻る途中、スクナが、杖で道を指した。ここから、少し入ったところだ、と。", "オオナムチは、根の間にぽっかりと開いた入口の前で、立ち止まった。中は暗い。乾いた落ち葉の匂いと、古い紙の匂いがした。", "「ごめんください」", "返事は、なかった。", "目が慣れてくると、奥に、小さな人影が見えた。うずくまるように座った、年老いたエルフの女だった。膝の上に、擦り切れた布の包みを抱いている。", "その姿は、ひどく薄かった。", "シイよりも、もっと。輪郭が、落ち葉の影と、見分けがつかないほどだった。オオナムチは、目を凝らさなければ、そこに人がいると分からなかった。", "「婆さま」", "スクナが、入口から声をかけた。老いたエルフは、顔を上げなかった。", "「婆さまや。客を連れてきたぞ」", "やはり、返事はない。", "スクナは、困ったように、オオナムチを見た。", "「わしの声は、届かんようじゃ。おぬし、呼んでやってくれんか」", "オオナムチは、うなずいた。うろの中へ、一歩、入った。膝をついて、老女の目の高さに、顔を合わせた。", "「ユズリハさん」", "老女の肩が、かすかに動いた。", "「ユズリハさん。森の、語り部の、ユズリハさん」", "もう一度、呼んだ。今度は、ゆっくりと、一音ずつ。港で、イサナを呼んだときのように。", "老女が、顔を上げた。", "皺に埋もれた目が、オオナムチを見た。最初は、焦点が合っていなかった。それから、少しずつ、光が戻ってきた。", "「……誰じゃ。わしを、呼ぶのは」", "「オオナムチといいます。ミナモの、冒険者です」", "「人間か」", "「はい」", "「人間が、わしの名を、呼ぶのか」", "老女は、不思議そうに、首を傾げた。それから、膝の上の包みを、そっと撫でた。", "「ユズリハ。……そうじゃ。わしは、ユズリハじゃった。忘れておったわ」", "輪郭が、少しずつ、戻ってきた。落ち葉の影から、一人の老女が、浮かび上がってくるように。", "入口で、コノハが、息を呑む気配がした。", "「婆さま。昔の話を、この若いのに、してやってくれんか」", "スクナが言った。", "「森と人と、大穴の向こうの者たちが、一緒に祭りをした頃の話じゃ」", "ユズリハは、少し黙った。それから、包みを解いた。中から、古い紙の束が出てきた。端は茶色く焼け、字は、ほとんど掠れていた。", "「もう、字は、読めん。けれど、話は、覚えておる」", "老女は、目を閉じた。", "「昔、昔。森の端に、大きな畑があってな。秋になると、山の神に、火の神に、水の神に、実りを捧げた。エルフも、人も、角のある者も、翼のある者も、同じ畦に並んで、同じ歌を歌った」", "うろの中に、老女の声が、静かに満ちた。かすれているが、言葉に、迷いがなかった。何十年も、何百回も、語ってきた声だった。", "「祭りの夜には、皆で、互いの名を呼び合った。名を呼ぶのが、いちばんの、もてなしじゃった。知らぬ者がおれば、名を聞いて、呼んだ。そうすれば、もう、知らぬ者ではなくなる」", "ベルは、うろの入口で、その話を聞いていた。", "魔界の収穫祭を、思い出した。埴の里の畦で、民が互いの名を呼び合う、あの夜を。ハニヤスが、畦の芽を踏みかけた自分を、名で叱った、あの声を。", "(似ている)", "そう思っただけだった。それ以上は、まだ、形にならなかった。", "「そんな話を、子どもらにしておったら、親たちが、嫌がってな」", "ユズリハは、目を開けて、笑った。寂しい笑いだった。", "「大穴の向こうの者と、仲良くした話なぞ、聞かせるなと。それから、誰も、わしを、祭りに呼ばんようになった。名も、呼ばんようになった」", "「俺が、覚えます」", "オオナムチが言った。", "老女は、驚いたように、青年を見た。", "「今の話。俺が、覚えます。それで、いつか、誰かに話します」", "「……人間の子が、か」", "「はい」", "ユズリハは、長いこと、オオナムチの顔を見ていた。それから、紙の束を、もう一度、包み直した。", "「ならば、また来い。続きが、ある。長い話じゃ」", "「また来ます。ユズリハさん」", "名を呼ぶと、老女は、少しだけ、照れたように目を伏せた。"]}, {"h": "六", "p": ["埴の里の段々田に、朝の霧がかかっていた。", "ハニヤスは、畦に立って、坂の下を見ていた。", "霧の中から、人影が、いくつも現れた。先頭は、背の高い男だった。足音がない。岐人のクナドだ。その後ろに、傷ついた者たちが、互いに肩を貸しながら、ゆっくりと上ってくる。", "角のある者。翼のある者。獣の耳を持つ者。", "根の洲から、逃げてきた民だった。", "ハニヤスは、鍬を畦に立てかけて、坂を下りた。", "「よく来た」", "それだけ言った。言葉は、多くはいらない。", "一行の中に、若い鴉族の女がいた。腕に布を巻き、顔は青ざめている。それでも、背筋だけは、まっすぐに伸ばしていた。", "「ここが、埴の里ですか」", "「そうだ」", "「私たち、人間の森で、助けていただきました。エルフの女の人と、人間の冒険者の方たちに」", "ハニヤスは、クナドを見た。", "クナドは、何も言わなかった。ただ、ほんのわずかに、目を伏せた。", "それで、分かった。", "ハニヤスは、黙って、うなずいた。王が、どこで、何をしているのか。それを、この女に告げる必要はない。", "「家族を、探しているんです」", "鴉族の女が、言った。", "「根の洲の、東の村にいました。父と、妹と。会談のあと、村が焼かれて、それきり」", "ハニヤスは、すぐには答えなかった。", "根の洲から逃れてきた民の名は、全部、帳面に書いてある。宮のオモイカが、一人ひとり、確かめて書いたものだ。その中に、この女の家族の名があるかどうか。", "「名を、教えろ」", "「え」", "「おまえの、父と妹の名だ。それから、おまえの名も」", "女は、少し戸惑ったように、ハニヤスを見た。それから、三つの名を、口にした。", "ハニヤスは、その名を、口の中で繰り返した。帳面にあったかどうか、思い出せなかった。けれど、忘れるつもりもなかった。", "「探す。見つかるまで、ここにいろ」", "ハニヤスは、畦に立てかけた鍬を取って、女に差し出した。", "「その腕が治ったら、畑を手伝え」", "女は、鍬を見つめた。それから、両手で、受け取った。

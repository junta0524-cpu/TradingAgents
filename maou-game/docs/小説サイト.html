れでも、自分の足で、歩いてくる。", "列の先頭に、オオナムチとタケルがいた。タケルの両手には、白い布が、厚く巻かれていた。", "その後ろに、長い白い髭の老人がいた。", "ベルは、岩陰から、出なかった。", "魔王の姿を見せれば、兵たちは、怯えるだろう。四か月、魔族は話の通じぬ者と、聞かされ続けてきたのだ。", "(今は、見るだけでよい)", "列は、坂の上の、岐人の集落へ、向かっていた。そこで、家族が、待っている。", "ふと、列の中から、一人が、離れた。", "老人だった。ヤツカは、まっすぐ、岩陰のほうへ、歩いてきた。", "ベルは、動かなかった。", "老将は、岩陰の前で、足を止めた。ベルを、見上げた。黒い角。畳んだ翼。灰色の目。", "老人の顔に、怯えは、なかった。", "「あなたが、魔王か」", "「そうだ」", "ヤツカは、長い間、ベルを見ていた。", "それから、ゆっくりと、膝をついた。", "「わしは、五十年、剣を振った。そのうちの何年かは、わしのものではなかった。その間に、何を斬り、何を教えたか」", "長い髭が、震えた。", "「弟子に、間違った言葉を、教えた」", "「面を上げられよ」", "ベルは、静かに言った。", "「おまえの弟子は、今朝、自分の拳で、石を砕いた。間違った言葉を、自分の手で、黙らせた」", "ヤツカは、顔を上げた。", "「教えたのは、言葉だけではあるまい。剣の握り方を、教えたのだろう。受けきることを、教えたのだろう」", "ベルは、坂の上を、見た。", "「あの者は、おまえに教わった剣で、誰も斬らずに、戻ってきた」", "老将の目から、涙が、一筋、こぼれた。", "列の後ろのほうで、弓兵のセキが、タケルを呼び止めていた。", "「勇者さま。いや、タケル殿」", "「何だ」", "「根の洲の戦に、同じ村のゴロウって男が、行ってました。娘に、手紙ばかり書いてる男で。字が、右に流れて、誰にも読めなくて」", "タケルの足が、止まった。", "「娘の名は」", "「ミサキ、だったと思います」", "風が、坂を、吹き上がった。", "タケルは、白い布を巻いた手を、胸の内側に、当てた。焼け残った紙が、そこにあった。右に流れる、不器用な字の、紙が。", "「村の名を、教えてくれ」", "声が、震えていた。", "「続きを、届けに行かなければならない。それが、俺の、次の仕事だ」", "ベルは、岩陰から、それを見ていた。", "大穴の底から、細い光の筋が、立ち昇っていた。坂の上の集落で、誰かが、誰かの名を、呼んでいた。何度も、何度も。", "その中に、ハツ、という声が、混じっていた。", "「ヤツカ」", "老人が、振り向いた。", "坂の上で、白髪の女が、手を振っていた。", "その夜、比良坂の縁に、二つの影が、並んで座っていた。", "オオナムチは、膝の上に、コトシロの名簿を広げていた。紙の端は、雪に濡れて、波打っている。", "「マサゴさん。南の浜辺の村の、十九歳」", "「マサゴ」", "ベルが、繰り返した。", "「トキワさん。山の炭焼きの村の、旗持ち。旗を振る腕が、いちばん強かった人です」", "「トキワ」", "「セキさん。弓兵。ナギさん。薬師。二人は、幼なじみで」", "「セキ。ナギ」", "一人ずつ、名が、夜の中に、置かれていった。", "オオナムチは、時々、言葉に詰まった。雪原で、声を嗄らしたせいだった。そのたびに、ベルは、黙って、待った。急かさなかった。", "最後の一行まで来たとき、月は、大穴の真上にあった。", "「ヤツカさん。北の山村の、守将。奥さんは、ハツさん」", "「ヤツカ」", "ベルは、その名を、ゆっくりと、口の中で、転がした。", "「四十二人」", "「はい。全員です」", "ベルは、大穴の底を、見下ろした。", "「根の洲の兵の名は、もう、誰も、教えてはくれぬ」", "「タケルさんが、探しています。ミサキさんの村も、分かりそうだって」", "「そうか」", "ベルは、しばらく、黙っていた。", "「ならば、一人ずつだ」", "「はい」", "「一人ずつ、覚える。何年かかっても」", "オオナムチは、名簿を、そっと閉じた。", "大穴の底から、細い光の筋が、立ち昇っていた。その光の中で、ベルの横顔は、もう、何かを握りしめてはいなかった。"]}]}, {"id": "bangai3", "label": "番外編三", "title": "名を喰う底", "chars": 9679, "sections": [{"h": "一", "p": ["白墨が、板の上で、乾いた音を立てた。", "カズミは、大きく、ゆっくりと書いた。", "『あ』", "「これは、あ、です。朝の、あ。ありがとうの、あ」", "振り返ると、十二の顔が、こちらを見ていた。", "やすらぎの院の、療養棟の大部屋だった。寝台は、壁際に寄せられ、空いた床に、低い卓と座布団が並んでいる。花に囲まれた建物は、そのまま残された。今は、療養と、学び直しの場所になっていた。", "決戦から、半年が過ぎた。", "院から家へ帰れた者は、多い。名を呼ぶ家族がいた者は、少しずつ、輪郭を取り戻していった。カズミ自身も、そうだった。ヒナの名と、ミオの名。その二つだけが、胸の底に残っていた。そこから、糸を手繰るように、自分の名へ、たどり着いた。", "けれど、この部屋の十二人には、迎えに来る者が、いなかった。", "家族が、もういない者。家族が、もう、彼らを覚えていない者。名を呼ばれないまま、長く、ここにいすぎた者。", "「あ」", "窓際の老人が、ゆっくりと、口を動かした。初めて、院を訪れた夜、オオナムチに「ずっと、呼ばれていないから」と答えた、あの老人だった。", "「そうです。上手です」", "カズミは、笑った。", "院に送られる前、カズミは、街の学び舎で、子どもたちに字を教えていた。", "ある日の授業で、魔界の暮らしの話をした。大穴の向こうにも、畑があり、市場があり、祭りがある。団子を売る鴉族の店主がいて、耳の聞こえない子と手で話す者がいる。古い本で読んだことを、そのまま、話しただけだった。", "親たちが、騒ぎ出した。それから、季節が一つ、二つ過ぎたころ、白い腕章の男たちが、学び舎の戸を叩いた。", "それきり、自分が何を教えていたのかも、長いこと、思い出せなかった。", "今は、思い出せる。だから、また、教えている。今度は、子どもではなく、名を失くした大人たちに。", "文字は、少しずつ、戻ってくる。食べ物の名、花の名、季節の名。皆、驚くほど、よく覚えた。", "戻らないのは、一つだけだった。", "自分の、名前だ。", "部屋の隅に、指の曲がった男がいた。筆を握る形のまま、固まってしまった右手。その手で、男は、誰よりも美しい字を書いた。カズミが読み上げる言葉を、一字の乱れもなく、紙に写していく。", "隣の老人の名も、窓際の女の名も、カズミが教えた仮の呼び名を、男は、きちんと書き取った。", "ただ、自分の名を書く欄だけが、いつも、白いままだった。", "「思い出せないのでは、ないのです」", "ある日、男は、筆を置いて、言った。", "「書こうとすると、そこだけ、穴が空いているのです。底のない、穴が」", "その夜、カズミは、ミオに話した。", "院の人たちが、口をそろえて、同じことを言う。眠りに落ちる前、名が、下へ、落ちていく気がする。深い、深い、どこかへ。", "ミオは、長いこと、黙っていた。それから、言った。", "「コトシロさんに、手紙を書きましょう。あの人なら、届けてくれるわ。……ベル様と、オオナムチさんへ」", "窓辺の鉢で、ヒナの花の蕾が、固く、閉じていた。"]}, {"h": "二", "p": ["比良坂の縁は、風が、温かかった。", "オオナムチは、コトシロからの手紙を、二度、読み返した。記録官の、几帳面な字だった。カズミの手紙が、そのまま、写し添えてあった。", "『名が、下へ、落ちていく気がする』", "その一行で、手が止まった。", "「クナドさん」", "傍らに控える岐人に、オオナムチは、手紙を差し出した。", "クナドは、読み終えると、静かに、大穴の底へ目を落とした。", "「やはり、お伝えせねばなりませんな」", "「何を」", "「五つ目の窪みの、さらに下です」", "クナドは、膝をついた。縁の石に、掌を当てる。", "「試練の扉の奥に、もう一つ、淵がございます。私ども岐人は、黄泉の深淵、と呼んでおります。生きた者の降りる場所では、ございません」", "「そこに、何が」", "「名が、沈んでおります」", "オオナムチは、息を止めた。", "「岐人には、言霊の流れが、見えます。水の中の油のように。王が倒れてから、ずっと、細い光が、底へ向かって、落ち続けております。雨のように」", "クナドは、目を閉じた。", "「削られた名は、輪郭を失うと、重くなります。重いものは、下へ沈む。王の仕組みは、名を剥ぐところまでしか、作られておりませんでした。剥いだ名を、どこへ捨てるか、までは」", "「だから、底に、溜まっていく」", "「はい。溜まった名は、やがて、形を持ちます。岐人の古い言い伝えでは、そうなっております」", "クナドは、少し、間を置いた。", "「オオナムチ様が、旅の途中で呼ばれた方々の名も、底に、かけらが残っております。削られていたあいだに、こぼれ落ちた分でございます。地の上で呼ばれて、名は戻りました。けれど、底から呼び上げて、はじめて、名は根を張る。そう、伝えられております」", "後ろで、足音がした。", "ベルが、立っていた。いつから聞いていたのか。黒い外套の裾が、風に、わずかに揺れている。角と翼を隠していない、魔王の姿のままだった。", "「行くぞ」", "ベルは、短く言った。", "「ベルさん」", "「今度は、私も行く」", "灰色の目が、オオナムチを、まっすぐ見た。", "「坂上の砦では、約束を守った。手を出さぬと。おまえが一人で背負うのを、ただ、見ていた」", "拳が、外套の脇で、握られた。それから、ゆっくりと、開いた。", "「もう、見ているだけでは、おらぬ」", "オオナムチは、少し、目を見開いた。それから、笑った。", "「半分ずつ、ですね」", "「そうだ。半分ずつだ」", "クナドが、静かに、立ち上がった。", "「お二人とも、もう一つ、お持ちいただきたいものがございます」", "「何だ」", "「酒です」", "ベルが、眉を上げた。", "「埴の里の新米で仕込んだ、いちばん強い酒を。甕で、八つ」"]}, {"h": "三", "p": ["深淵へ下る道は、長かった。", "試練の扉の奥に、細い石段が、螺旋を描いて続いていた。灯りは、クナドの掲げる小さな火だけだ。壁に触れると、ひやりと冷たく、湿っていた。", "ベルは、オオナムチの背中を見ながら、石段を下りた。", "青年は、背に、甕を一つ、負っていた。残りの七つは、鬼の若者たちが、上の扉まで運んでくれた。そこからは、三人で、何度も往復した。", "(八つの甕)", "ベルは、その数を、胸の内で、繰り返していた。", "魔界の、古い話だった。宮の書庫で、幼いころに、読んでもらった。荒ぶる神が、八つの頭を持つ大蛇を鎮めた話。神は、八度、醸し重ねた強い酒を、八つの甕に満たした。大蛇は、八つの頭を、それぞれ甕に沈めて、酒を飲み干し、眠りに落ちた。", "(八塩折の、酒)", "クナドが、酒を所望したわけを、ベルは、聞かなかった。聞かずとも、分かった。", "石段の途中で、オオナムチが、足を止めた。甕の縄を、肩に掛け直す。", "「ベルさん」", "「何だ」", "「名前って、重いんですね」", "前を向いたまま、青年は言った。", "「クナドさんが言ってました。輪郭を失うと、重くなって、沈むって。俺、逆だと思ってたんです。名前を失くしたら、軽くなって、ふわふわ、どこかへ飛んでいくんだと」", "ベルは、少し考えた。", "「名は、その者が、背負ってきたものだ」", "「背負ってきたもの」", "「生まれた土地。呼んでくれた者の声。交わした約束。それが、全部、名に、染みている。だから、重い」", "ベルは、外套の内側に、手を当てた。", "「呼ばれているうちは、呼ぶ者が、半分、持ってくれる。呼ばれなくなると、一人で、全部、背負うことになる」", "オオナムチは、しばらく、黙っていた。", "「……だから、沈むんですね」", "「ああ」", "「じゃあ、底にある名前は、みんな、一人で、重たいものを抱えてるんだ」", "青年は、また、石段を下り始めた。背の甕が、かすかに、ちゃぷりと鳴った。", "ベルは、その背中を、見つめた。", "(半分ずつ、か)", "この青年と出会ったときから、何度、その言葉を交わしただろう。報酬も、危険も、罪も。今日は、名の重さを、半分ずつ、背負いに行く。", "石段が、尽きた。", "目の前に、黒い水面が、広がっていた。", "洞窟とも、湖ともつかない、広い空間だった。天井は見えない。水面だけが、どこからか差す淡い光を受けて、鈍く、光っている。", "その水の上を、細い光が、落ちていた。", "雨のように。糸のように。ひと筋、またひと筋。天井の闇から、音もなく降りてきて、水面に触れると、すっと、沈んでいく。", "「あれが」", "オオナムチが、かすれた声で言った。", "「名です」", "クナドが、答えた。", "水面が、盛り上がった。", "ゆっくりと、黒い水を押し分けて、何かが、立ち上がってきた。最初に見えたのは、目だった。赤い、灯のような目が、二つ。四つ。八つ。", "八つの首が、水面から、伸びた。", "鱗は、苔と岩に覆われていた。一つの首だけで、宮の柱ほども太い。首の付け根は、水の中に沈み、どこまで続いているのか分からない。", "「上の淵の番人でございます」", "クナドの声は、落ち着いていた。", "「境の神が、遠い昔に置いたもの。生きた者が、底へ降りぬよう、ここを守っております。悪しきものでは、ございません」", "「戦わずに、通れるか」", "ベルが尋ねた。", "「眠っていただければ」", "ベルは、うなずいた。", "三人で、甕を、水際に並べた。八つ。栓を抜くと、甘く、強い匂いが、洞窟に広がった。埴の里の秋の匂いだった。", "大蛇の首が、一つ、甕へ降りてきた。鼻先で、匂いを嗅ぐ。それから、ゆっくりと、口を沈めた。", "二つ目の首が、続いた。三つ目。四つ目。", "七つ目の首が、甕に沈んだとき、八つ目の首が、動かなかった。", "赤い目が、三人を見ていた。", "いや、ベルを見ていた。", "首が、跳ねた。", "速かった。石段が砕け、水しぶきが、柱のように立った。ベルは、オオナムチの襟をつかんで、脇へ跳んだ。", "「――堅め」", "オオナムチの声が、重なった。", "膜が、二人を、ぐるりと包んだ。厚さは、半分。ベルが、かつて、宿の裏庭で教えたとおりの、薄く、広い膜だった。", "大蛇の牙が、膜に当たった。軋んだ。けれど、破れなかった。", "ベルは、膜の内側から、手を伸ばした。力を、指先の一点に、細く、集める。魔王の力を、全部、出せば、この洞窟ごと、崩れる。だから、細く。針のように。", "大蛇の首の付け根、鱗の継ぎ目の、ひと点を、押した。", "首が、大きく、のけぞった。", "「ベルさん、右！」", "オオナムチが叫んだ。七つの首のうち一つが、酒から顔を上げ、横から迫っていた。", "ベルが振り向くより先に、膜が、右側だけ、厚くなった。", "牙が、膜に阻まれて、逸れた。", "ベルは、一瞬、動きを止めた。", "(守られた)", "いつ以来だろう。前に立たず、背を預け、横を守られる。王になってから、一度も、なかった。", "「ベルさん！」", "「ああ」", "ベルは、短く応えた。口の端が、わずかに、上がっていた。", "二人は、並んだ。オオナムチが膜を張り、ベルが、細い力で、首を一つずつ、押し返す。打ち倒すのではない。酒の甕のほうへ、首を、そっと、向けさせていく。", "八つ目の首が、最後に、甕へ沈んだ。", "長い時間が、過ぎた。", "やがて、大蛇の目が、一つ、また一つと、閉じていった。八つの首が、水際に、重く、横たわった。寝息のような低い音が、洞窟に満ちた。", "オオナムチが、膝をついて、息を吐いた。", "「並んで戦ったの、初めてですね」", "「ああ」", "ベルは、外套の埃を払った。", "「悪くない」", "八つの甕のうち、一つだけ、まだ、酒が底に残っていた。クナドが、それを、両手で持ち上げた。", "「持っておゆきください。番人が、通した証でございます」"]}, {"h": "四", "p": ["底は、静かだった。", "大蛇の眠る淵の、さらに奥。水が引いた岩の窪みに、光の雨が、集まっていた。", "その真ん中に、何かが、立っていた。", "黒い、鎧だった。", "人の形をしていた。けれど、顔がない。兜の奥には、闇が、渦を巻いているだけだった。胸の甲冑の継ぎ目から、細い光が、吸い込まれていく。上から落ちてくる名の雨を、鎧が、飲み込んでいる。", "よく見ると、鎧そのものが、文字で、できていた。", "ひと筆、ひと筆。崩れかけた、名の文字。何千、何万もの、削られた名の欠片が、黒く固まって、鎧の形を作っていた。", "「名喰い、とでも申しましょうか」", "クナドの声が、初めて、わずかに、揺れた。", "「王の仕組みの、最後の姿でございます」", "鎧が、こちらを向いた。", "声が、した。", "一つの声ではなかった。男の声、女の声、子どもの声、年寄りの声。何百もの声が、重なり合って、一つの言葉を、紡いだ。", "『名など、要らぬ』", "オオナムチの背筋が、冷えた。", "『呼ばれぬ名は、重いだけだ。重い名は、沈めばよい。勝者の名など、歴史には、要らぬ』", "その言い回しを、知っていた。坂上の砦で、聞いた言葉だった。", "「アマツ王の、声……」", "「声ではない」", "ベルが、低く言った。", "「声の、残り滓だ。名を奪え、という意志だけが、ここに、溜まった」", "鎧が、腕を上げた。", "『オオナムチ』", "名を、呼ばれた。", "あの日と、同じだった。耳ではなく、骨の内側で、響いた。指先が、薄く、透けていく。足元の影が、ぼやける。", "(また)", "膝が、折れた。", "『名を奪われた者は、誰の記憶にも、残らぬ』", "何百もの声が、重なる。オオナムチの輪郭が、霧のように、ほどけていく。", "鎧の兜が、ベルのほうへ、わずかに、傾いた。", "『ベルイザナ』", "何百もの声が、魔王の名を、呼んだ。", "洞窟の空気が、震えた。オオナムチは、ほどけかけた視界の端で、ベルの輪郭を探した。", "ベルは、立っていた。", "揺らぎも、しなかった。黒い外套の裾が、わずかに、はためいただけだった。", "『なぜ、剥がれぬ』", "「呼ばれているからだ」", "ベルは、静かに答えた。", "「黄泉に戻った朝、民が、道で、私を迎えた。お帰りなさい、と。私の名は、毎朝、誰かに呼ばれている。オモイカに。ハニヤスに。市場の団子屋の主人に。耳の聞こえぬ嵐狼の子は、手で、私の名を呼ぶ」", "灰色の目の奥で、紅い光が、灯った。", "「おまえ一つに、剥がせる名ではない」", "その手が、オオナムチの肩を、つかんだ。", "冷たい手だった。けれど、力は、加減されていなかった。骨が軋むほど、強く。", "「オオナムチ」", "ベルの声だった。", "名を、呼ばれた。", "今度は、温かかった。骨の内側で、同じように響いて、けれど、剥がすのではなく、縫い留めるように。", "「おまえの名は、私が覚えている」", "ベルは、オオナムチの前に、膝をついた。灰色の目の奥で、紅い光が、静かに、灯っていた。", "「最初の日から、ずっと、見えていたのは、おまえだけではない。私にも、おまえの顔は、見えていた。継ぎの当たった外套も、擦れた靴も、銅色の札も。全部だ」", "輪郭が、戻ってきた。", "指先に、色が戻る。足元に、影が戻る。", "オオナムチは、大きく、息を吸った。", "「……ありがとう、ございます」", "「礼はいらぬ」", "ベルは、立ち上がった。鎧に、背を向けて。オオナムチに、手を差し出した。", "「名を呼ぶのは、おまえの役目だ。私は、おまえの名を呼ぶ。それで、半分ずつだ」", "オオナムチは、その手を、握った。"]}, {"h": "五", "p": ["オオナムチは、鎧の前に、立った。", "鎧の胸で、文字が、渦を巻いていた。", "目を凝らした。崩れかけた筆の跡。その一つに、見覚えがあった。", "『イ』", "港の桟橋で、初めて呼んだ名の、最初の一字だった。", "(ここに、いる)", "鎧は、名を喰ったのではない。名は、ここに、閉じ込められているだけだ。誰にも呼ばれないまま、重くなって、沈んで、固まって。", "オオナムチは、息を吸った。", "「イサナさん」", "鎧の胸から、光が、一つ、弾けた。", "小さな、火の粉のような光だった。それは、渦を抜け出すと、まっすぐ、天井の闇へ、昇っていった。", "鎧が、軋んだ。", "『呼ぶな』", "何百もの声が、重なった。", "オオナムチは、呼んだ。", "「アサギさん。トマリさん」", "光が、二つ、昇った。", "「ノギクさん。フキ。タネさん」", "ひなた野の、機織りの女。井戸のそばで遊んでいた子。畑の老人。", "「ツユクサさん。シイさん。ユズリハさん」", "森の薬草摘み。弓手。語り部。", "「ハガネさん。スミさん。タタラ」", "炉ヶ岳の、鍛冶。炭焼き。炉番の弟子。", "一人呼ぶたびに、顔が浮かんだ。旅の途中で、すれ違った顔。言葉を交わした顔。一度は、地の上で、名を呼んだ顔。その名の、底に残っていた、かけらだった。", "「ススキさん。ナズナさん。クズハさん」", "葛の里の見張り。井戸番。織り手。", "「シロエさん。ミカゲさん。ウタさん」", "王都の書記。衛士。旅の歌い手。", "「アカネさん。クロハさん。ヤマブキさん」", "土蜘蛛の畑番。鴉の伝令。鬼の鍛冶。", "「ウツホさん。ヨミジさん。ホムラさん」", "大穴の番人だった者。黄泉の旅人。炎の守り手。", "ヨミジとホムラには、会ったことがない。けれど、埴の里の畑で、ウツホが、何度も話してくれた名だった。昔、黄泉の道で、一緒に番をしていた二人だと。名を呼ばれなくなって、ウツホより先に、薄れていったのだと。", "二十四の光が、昇っていった。かけらが、地の上の名へ、帰っていく。", "鎧が、大きく、揺らいだ。胸の渦が、細くなる。けれど、まだ、崩れない。黒い文字は、まだ、何千も、残っていた。", "(知らない名だ)", "オオナムチは、唇を噛んだ。", "呼べない。顔も知らず、誰からも聞いたことのない人の名は、呼べない。院の大部屋の、十二人。いや、もっと。王都から、各地から、院へ送られた、何百もの人々。", "「呼べない名は、呼べる者に、返せばよい」", "ベルが、言った。", "「おまえ一人で、全部を呼ぶ必要はない」", "クナドが、静かに、目を閉じた。", "「上へ、言伝を、お送りいたします」", "――王都、やすらぎの院の、大部屋。", "カズミは、紙の束を、手にしていた。", "コトシロが、届けてくれた写しだった。軍務局の、移送記録。院へ送られた者の、名と、日付と、送られた理由が、一人ずつ、記されていた。祝賀の夜までに、コトシロが、命がけで、少しずつ持ち出したものだった。", "部屋には、十二人が座っていた。その周りに、ミオがいた。ヒナがいた。コトシロがいた。院の元職員たちもいた。", "『今です』", "クナドの声が、頭の中で、静かに響いた。", "カズミは、最初の一枚を、めくった。", "一つ目の名を、読み上げた。", "声が、震えた。それでも、読んだ。二つ目。三つ目。ミオが、隣で、別の束を読み始めた。コトシロが、また別の束を。ヒナが、まだ覚えたての字を、指でたどりながら、一字ずつ、読んだ。", "指の曲がった男が、顔を上げた。", "名簿の、ある行で、カズミの声が、止まった。", "書記、と記された行だった。理由の欄には、『療養のため』とだけあった。その行の端に、別の筆で、小さく、書き添えがあった。『シロエ。書記。前任』。コトシロの字だった。", "「シロエ」", "カズミは、読んだ。", "男の曲がった指が、ぴくりと、動いた。", "――黄泉の深淵の、底。", "黒い鎧の文字が、次々と、光になって、ほどけていった。上から、名を呼ぶ声が、雨のように、降りてくる。何十、何百。一つ呼ばれるたびに、一つ、光が昇っていく。", "鎧の胸の渦が、止まった。", "『なぜ』", "何百もの声が、一つずつ、減っていった。最後に残ったのは、一つの、穏やかな声だった。", "『なぜ、呼ぶ』", "オオナムチは、答えた。", "「名前だからです」", "鎧が、崩れた。", "黒い砂のように、さらさらと、岩の上に落ちていった。中には、何もなかった。空っぽの、闇があるだけだった。", "光の雨は、もう、降っていなかった。"]}, {"h": "六", "p": ["アサギは、その朝、網干し場で、網を繕っていた。", "戦が終わってから、港は、少しずつ、変わった。亜人の乗る船の魚も、同じ値で売れるようになった。帳場の帳面にも、名前が、きちんと書かれるようになった。", "イサナさんの顔も、もう、霧の向こうには、なかった。", "あの若い冒険者が、桟橋で名を呼んでくれた朝から、アサギは、毎日、呼んだ。うるさいと言われても、呼んだ。今では、港の誰もが、イサナさん、と呼ぶ。", "それでも、帳面にだけは、まだ、あの小さな丸が、残っていた。", "今朝、目が覚めたとき、胸の奥で、何かが、ことりと、鳴った気がした。どこか、ずっと遠い底から、何かが、戻ってくる音だった。", "アサギは、手を止めた。", "桟橋の先で、声がした。", "港の新しい帳場役が、帳面を広げていた。今日の漁に出る舟の、名を、一つずつ、書き留めている。", "小舟の前で、帳場役が、顔を上げた。", "「ええと、こちらの舟は」", "老人が、立ち上がった。", "背は、丸かった。腕は、細かった。けれど、その輪郭は、朝の光の中で、くっきりと、見えた。眉の白さも、頬の古い傷も、唇の端の、わずかな歪みも。", "「わしは、イサナじゃ」", "老人は、名乗った。", "自分の口で。誰に呼ばれたのでもなく。", "「この舟の、主じゃ。乗り手は、トマリ」", "舟の上で、縄を巻いていた若者が、顔を上げた。", "「……はい。トマリです」", "帳場役は、うなずいて、二つの名を、帳面に書いた。丸ではなく、名前を。", "アサギは、網を握ったまま、立ち尽くしていた。", "「アサギ」", "イサナが、振り向いた。", "「おまえさんが、毎日、呼んでくれたからじゃ。今朝は、わしの口で、言えた」", "アサギは、首を振った。涙が、網の上に、落ちた。", "「イサナさん」", "「ああ」", "「イサナさん」", "「何度でも、呼べ」", "老人は、笑った。皺の深い目尻を、くしゃくしゃにして。", "舟の上から、トマリが、縄を放り出して、桟橋へ跳び移ってきた。", "「アサギさん」", "真っ赤な顔で、言った。", "「アサギさん。……俺も、呼んでいいっすか。これから、毎日」", "アサギは、泣きながら、吹き出した。", "「毎日は、うるさいわよ」", "「じゃあ、一日、三回くらいで」", "「同じじゃない」", "帳場役が、帳面から顔を上げて、三人を眺めた。それから、何も言わずに、帳面の端に、アサギの名も、書き足した。", "潮風が、網干し場の杭の間を、抜けていった。"]}, {"h": "七", "p": ["ひなた野から葛の里へ移った機織りのノギクは、その朝、織りかけの布に、自分の名を、糸で縫い込んだ。隣で、子どものフキが、それを真似ようとして、指を刺した。畑の老人のタネが、笑いながら、薬草を貼ってやった。", "聖の森では、薬草摘みのツユクサが、コノハの家の戸を叩いた。森の弓手のシイと、語り部のユズリハが、後ろに立っていた。コノハは、三人の顔を見て、しばらく黙ってから、「……別に、待ってたわけじゃないけど」と言った。", "炉ヶ岳の炉の前で、炉番の弟子のタタラが、火を入れた。鍛冶のハガネが鉄を打ち、炭焼きのスミが、炭を運んだ。イシコリドメが、三人の名を、里の名簿に、太い字で書き戻した。", "葛の里の井戸のそばで、井戸番のナズナが、桶を下ろした。見張りのススキが、櫓の上から手を振った。織り手のクズハが、ハルとユウに、名前の縫い取りの仕方を教えていた。", "タカマの丘で、元衛士のミカゲが、槍を置き、社守を手伝って、石段を掃いていた。橋のたもとでは、旅の歌い手のウタが歌い、足を止めた人々が、輪を作っていた。", "魔界の埴の里では、畑番のアカネが、ハニヤスに「おう」と呼ばれた。鴉の伝令のクロハは、ナキメの文を携えて、空を渡った。鬼の鍛冶のヤマブキは、ミカヅチの若い衆に、自分の名を刻んだ鎚を渡した。", "大穴の縁では、クナドの隣に、三つの影が立っていた。番人だったウツホ。黄泉の旅人のヨミジ。炎の守り手のホムラ。四人は、何も言わずに、底を見下ろした。もう、光の雨は、降っていなかった。", "やすらぎの院の大部屋で、指の曲がった男が、筆を取った。", "白い欄に、ゆっくりと、一字ずつ、書いた。", "『シロエ』", "字は、少しだけ、震えていた。カズミは、それを、何も言わずに、長いこと見ていた。それから、窓際の老人の前に、新しい紙を置いた。老人は、まだ、自分の名を、思い出せていなかった。けれど、名簿の中に、それはあった。今日の午後、ミオが、読みに来る。", "その日の夕方、ヒナが、窓辺で、声を上げた。", "「お父さん。お母さん」", "鉢の蕾が、ほどけていた。", "小さな、白い花だった。五枚の花びらが、夕日を受けて、淡く、光っていた。", "「咲いた」", "ヒナは、花に顔を近づけて、言った。", "「ねえ、この花、名前、なんていうの」", "カズミは、首を振った。", "「お父さんにも、分からないな」", "「じゃあ、つけてあげる」", "ヒナは、しばらく考えてから、花びらに、そっと、指先で触れた。", "小さな声で、名を、呼んだ。", "比良坂の縁で、二つの影が、並んで、夕日を見ていた。", "「ベルさん」", "「何だ」", "「さっき、底で、俺の名、呼んでくれましたよね」", "「ああ」", "「もう一回、呼んでもらえますか」", "ベルは、少し、黙った。外套の脇で、手が、握られかけて、開いた。", "「オオナムチ」", "「はい」", "「……満足か」", "「はい」", "青年は、笑った。魔王も、口の端を、わずかに、上げた。", "大穴の底から、風が、吹き上げてきた。もう、冷たくはなかった。土と、稲穂と、誰かが誰かを呼ぶ声が、混ざった、温かい風だった。"]}]}, {"id": "bangai4", "label": "番外編四", "title": "ミサキへ", "chars": 9549, "sections": [{"h": "一", "p": ["紙は、三十枚を超えていた。", "タケルは、根の洲の小屋の板の間に、膝をついていた。灯りの下に、書き損じた紙が、何枚も重なっている。どれも、一行目で止まっていた。", "『ミサキ殿』", "そこまでは、書ける。", "その先が、書けなかった。", "書こうとすると、筆が、勝手に謝り始める。申し訳ない。許してほしい。いや、許さなくていい。そういう言葉ばかりが、紙の上に並んでいく。読み返すと、どれも、自分の話だった。自分が、どれほど悔いているか。自分が、どれほど重いものを背負っているか。", "(これは、あの人の手紙の、続きではない)", "タケルは、筆を置いた。", "胸の内側に、焼け残った紙がある。もう、何度、取り出して読んだか分からない。", "『戦が終われば、英雄の凱旋で街が祝うそうだ。おまえにも土産を』", "右に流れる、不器用な字。土産を、のあとが、炭になって、消えている。", "この男は、娘に、何を持って帰るつもりだったのか。", "タケルには、分からない。分かるはずがなかった。名も知らずに、自分が率いて、焼け野へ連れていった男だ。", "小屋の戸が、軋んだ。", "「まだ、起きていたのか」", "ミカヅチだった。角を戸の上枠にぶつけないように、身をかがめて入ってくる。床に散らばった紙を見下ろして、鼻を鳴らした。", "「書けんか」", "「……書けない」", "「なら、書くな」", "タケルは、顔を上げた。", "「持っていけ。焼け残った、そのままを。おまえの言葉は、口で言え。紙に逃がすな」", "ミカヅチは、それだけ言って、背を向けた。戸口で、もう一度だけ、振り返った。", "「北の村だそうだな。小僧が、ついて行くと言っていたぞ」", "「オオナムチが」", "「口は挟まん、とさ。ただ、見ている、と」", "鬼の頭領は、少しだけ、口の端を上げた。", "「どこかで、聞いた言い方だ」", "出立の朝、比良坂の縁に、ベルが立っていた。", "魔王の姿のままだった。黒い角も、畳んだ翼も、隠していない。境が橋になってから、ベルは、角を隠さなくなった。", "「北へ、行くそうだな」", "「ああ」", "タケルは、短く答えた。魔王の前に立つと、今でも、膝の奥が、わずかに強張る。根の洲で、膝を折られた日の記憶が、体のどこかに、まだ残っている。", "ベルは、タケルの胸のあたりを、見た。焼け残った紙が、そこにあることを、知っている目だった。", "「あの兵の顔を、私は、見なかった」", "ベルは、静かに言った。", "「あの隊列を消したのは、私だ。その手紙の主の名を、私も、知らぬ」", "タケルは、顔を上げた。", "「おまえの戦だ。私が行けば、おまえの言葉が、私の影に隠れる。だから、行かぬ」", "ベルは、少しだけ、間を置いた。", "「名を、聞いてきてくれ。それだけでよい」", "「……分かった」", "タケルは、頭を下げた。魔王に頭を下げるのは、二度目だった。一度目は、坂上の砦で、裁きを求めたときだった。", "あのとき、魔王は、裁かなかった。直せ、と言った。", "その言葉が、今も、鍬を握る手の中にある。"]}, {"h": "二", "p": ["北への道は、長かった。", "オオナムチは、タケルの半歩うしろを歩いた。並ばなかった。追い越しもしなかった。", "タケルは、ほとんど口を利かなかった。朝、歩き出す前に、胸の内側に手を当てる。昼、水を飲むときに、また、手を当てる。それだけだった。", "白い布を巻いていた両手は、もう、布を外していた。北の砦で、中継の石を素手で砕いた傷だった。拳の骨の上に、白い痕が、いくつも残っている。", "三日目の夜、山の手前の野で、火を焚いた。", "タケルは、火を見ていた。オオナムチは、黙って、枝をくべていた。", "「オオナムチ」", "不意に、タケルが言った。", "「はい」", "「おまえは、王を斬ったとき、何を考えた」", "オオナムチの手が、止まった。", "坂上の砦の、朝。火種を乗せた刃。王の、最期の顔。", "「……何も、考えられませんでした」", "正直に、答えた。", "「他に、誰も救えないと思った。それだけです。考えたのは、あとからでした。三か月、ずっと」", "「今は」", "「今も、考えてます」", "オオナムチは、自分の掌を見た。震えは、止まっている。けれど、時々、夜中に、指先が冷たくなる。", "「たぶん、一生、考えるんだと思います。ベルが、半分、持ってくれてますけど」", "タケルは、黙って、火を見ていた。", "「俺は、顔を、見なかった」", "低い声だった。", "「根の洲へ向かう道で、何千もの兵の、顔を、一つも見なかった。見る必要がないと思っていた。正義の側にいれば、顔など、いらない」", "薪が、はぜた。", "「頭の中に、声があった。それは、本当だ。だが、剣を振ったのは、俺だ。兵を並べて、焼け野を歩かせたのは、俺だ。声のせいには、しない」", "オオナムチは、何も言わなかった。", "言わないと、決めていた。この旅は、タケルの旅だ。自分が口を挟めば、タケルは、自分に向かって話し始める。そうではなく、北の村の、まだ会ったことのない娘に向かって、話さなければならない。", "ベルが、自分にしてくれたのと、同じだった。問わずに、隣を歩く。", "ミナモの港を、思い出した。掲示板の前で拳を握っていたベル。炉ヶ岳の山道で、何かをこらえて黙り込んでいたベル。そのどれにも、オオナムチは、問わなかった。問わないことが、正しいのかどうか、分からなかった。ただ、問えば、ベルは、自分のために答えてしまう気がした。", "答えは、ベルが、自分で見つけるものだった。", "今、タケルも、同じ場所にいる。", "「だから、行く」", "タケルは、言った。", "「顔を、見に行く」", "火の粉が、夜空へ、昇っていった。"]}, {"h": "三", "p": ["ミサキは、梅の木の上にいた。", "村でいちばん高い木だった。てっぺん近くの枝に腰かけると、山の下の街道が、遠くまで見える。", "父ちゃんが出ていった日も、ここから見送った。", "十一の春だった。今は、十二になった。", "父ちゃんは、根の洲へ行った。王様の戦だった。村の男が、何人も行った。帰ってきた者もいた。帰ってこなかった者もいた。", "父ちゃんは、帰ってこなかった。", "最初は、名誉の戦死だと言われた。役人が、そう書いた紙を持ってきた。母ちゃんは、紙を受け取って、何も言わずに、畑へ出ていった。", "それから、王様が死んだ。", "村の空気が、ある日、急に変わった。大人たちが、ぽかんとした顔で、空を見上げていた。何かが、頭の中から、抜けていったように。", "しばらくして、北の砦から、兵が戻ってきた。セキ兄も、ナギ兄も、ヤツカの爺さまも。痩せて、ぼんやりして、それでも、帰ってきた。", "父ちゃんは、帰ってこなかった。", "それから、噂を聞いた。根の洲の兵は、魔王に、跡形もなく消されたのだと。血も、骨も、残っていないのだと。", "そして、その軍の、いちばん前にいたのが、勇者タケルだったのだと。", "ミサキは、膝を抱えた。", "(英雄なんて、大っきらいだ)", "父ちゃんは、手紙を書くのが好きだった。出稼ぎに行くたび、何通も送ってきた。字が、ひどく右に流れていて、村の誰にも読めなかった。母ちゃんにも、読めなかった。", "ミサキだけが、読めた。", "小さいころから、父ちゃんの膝の上で、その字を見て育ったからだ。右に流れる線の、どこで止まって、どこで跳ねるか。全部、知っていた。", "最後の手紙は、来なかった。", "王様が死んでから、村では、誰も、父ちゃんの話をしなくなった。", "気を遣っているのだと、分かっていた。名誉の戦死、と言っていた大人たちが、その言葉を、恥ずかしそうに飲み込むようになった。代わりの言葉が、見つからないのだ。だから、何も言わない。ゴロウの名を、口にしない。", "母ちゃんも、言わなくなった。", "夜、囲炉裏の前で、父ちゃんの古い手紙の束を、ほどいては、また結ぶ。読めない字を、指でなぞるだけ。ミサキが読んであげようか、と言うと、首を振った。", "「いいの。字の形を、見てるだけで」", "ミサキは、父ちゃんの名を、口の中で、そっと言ってみることがある。ゴロウ。誰も呼ばなくなった名前は、時々、自分の舌の上でも、形がぼやけそうになった。", "だから、手紙を読む。何度も、何度も。右に流れる線の中に、父ちゃんの声が、まだ、残っている気がした。", "街道の向こうに、人影が見えた。", "二人だった。一人は、背の高い男。もう一人は、継ぎの当たった外套の、細い若者。", "背の高い男の歩き方を見て、ミサキは、なぜか、胸がざわついた。背筋が、まっすぐすぎる。旅人の歩き方ではない。", "男は、村の入口で、立ち止まった。", "胸の内側に、手を当てていた。"]}, {"h": "四", "p": ["村の入口で、セキが待っていた。", "「タケル殿」", "弓兵だった若者は、頭を下げた。砦にいたころより、頬に、肉が戻っていた。", "「ゴロウさんの家は、あの梅の木の下です。奥さんは、ヨネさん。娘さんが、ミサキ」", "「……知らせて、あるのか」", "「村の者には。ヨネさんには、俺が、話しました」", "セキは、目を伏せた。", "「勇者が、手紙を持ってくる、とだけ。あとは、タケル殿の口から」", "タケルは、うなずいた。", "梅の木の下の家は、小さかった。板壁は、ところどころ、新しい板で継ぎ当てされていた。軒下に、干し大根が、何連も吊るしてあった。梅の枝の先に、白い花が、ぽつぽつと開きはじめていた。", "戸を叩く前に、タケルは、一度だけ、深く息を吸った。", "オオナムチは、少し離れた、垣根の脇で、足を止めた。それ以上は、近づかなかった。", "戸が、開いた。", "痩せた女だった。日に焼けた顔に、深い隈がある。女は、タケルの顔を見て、一瞬だけ、目を見開いた。それから、静かに、言った。", "「……どうぞ」", "土間に入ると、奥の板の間に、少女が座っていた。", "膝を抱えて、こちらを睨んでいた。大きな目だった。その目が、タケルの顔を、まっすぐ、見ていた。", "タケルは、土間に、膝をついた。", "板の間には上がらなかった。土の上に、両膝と、両手をついた。", "「タケルだ」", "声は、かすれていなかった。かすれさせないと、決めてきた。", "「根の洲へ向かった軍の、先頭にいた。ゴロウ殿を、焼け野へ連れていったのは、俺だ」", "少女の肩が、びくりと震えた。", "「王の言霊が、頭の中にあった。だが、それは、言い訳にならない。兵を並べたのも、歩かせたのも、俺だ」", "タケルは、胸の内側から、紙を取り出した。", "焼け焦げた、薄い紙だった。", "「根の洲の土の中から、出てきた。ゴロウ殿の、懐にあったものだと思う」", "両手で、少女のほうへ、差し出した。", "少女は、動かなかった。母親が、少女の肩に、そっと手を置いた。", "長い沈黙のあとで、少女が、板の間から、降りてきた。土間に、裸足のまま。タケルの手から、紙を、ひったくるように、取った。", "少女は、紙を、見た。", "その顔が、くしゃりと、歪んだ。", "「……父ちゃんの、字だ」", "指で、右に流れる線を、たどった。", "「せ、ん、が、お、わ、れ、ば。え、い、ゆ、う、の、が、い、せ、ん、で」", "少女の声が、止まった。", "英雄の凱旋。", "少女の目が、紙から、土間に膝をついた男へ、移った。", "「お、ま、え、に、も、み、や、げ、を」", "そこで、紙は、終わっていた。", "「……続きは」", "少女が、言った。", "「続きは、どこ」", "「ない」", "タケルは、答えた。", "「土を、何度も掘った。焼けて、残っていなかった」", "「なんで」", "「焼いたのは、俺の連れていった戦だ。だから、続きは、ない」", "少女は、紙を握りしめた。", "それから、何も言わずに、タケルの横をすり抜けて、外へ、飛び出していった。", "土間に、沈黙が落ちた。", "タケルは、膝をついたまま、動かなかった。少女が出ていった戸口から、春先の、まだ冷たい風が、吹き込んでいた。", "「立ってください」", "ヨネが、言った。", "「土間は、冷えますから」", "タケルは、首を振った。", "「……このままで」", "ヨネは、それ以上、勧めなかった。囲炉裏の脇に、腰を下ろした。干した芋を一切れ、手に取って、膝の上で、指先で転がした。", "「あの人は」", "ヨネの声は、静かだった。", "「字が、下手でね。わたしには、一字も読めなかった。あの子だけが、読めたの。だから、あの人の手紙は、いつも、あの子が読み上げてくれた。囲炉裏の前で、父ちゃんの声を真似して」", "ヨネは、芋を、置いた。", "「最後の手紙だけ、来なかった。来なかったから、読めなかった。あの子は、それが、いちばん、悔しいんだと思う」", "タケルは、土間の土を、見つめた。", "「恨んでいいか、と聞かれたら」", "ヨネは、少し、笑った。泣き笑いのような顔だった。", "「恨んでいます。でもね、勇者さま。あんたが土の上に膝をついて、あの人の名を言ったとき、わたし、少しだけ、ほっとしたの。誰も、あの人の名を、言わなくなっていたから」"]}, {"h": "五", "p": ["梅の木の下に、細い若者が、座っていた。", "ミサキは、木に登ろうとして、手を止めた。継ぎの当たった外套の、さっきの若者だった。勇者と一緒に来た、人。", "若者は、ミサキを見たが、何も言わなかった。ただ、少しだけ、場所を空けた。", "ミサキは、迷った。それから、木の根もとに、若者から少し離れて、座った。", "紙を、膝の上で、伸ばした。", "父ちゃんの字だった。間違いなかった。土産を、の、を、の跳ね方。いつも、最後の字だけ、力が入りすぎる。", "「おまえも、英雄？」", "ミサキは、紙を見たまま、言った。", "「いいえ」", "若者は、首を振った。", "「冒険者です。ただの」", "「じゃあ、なんで、一緒に来たの」", "若者は、少し考えた。", "「あの人が、ここまで、ちゃんと歩くのを、見ていたかったんです」", "「それだけ？」", "「それだけです」", "ミサキは、黙った。", "あの男は、土間に、膝をついた。板の間に上がらなかった。言い訳を、しなかった。王様の声のせいだと、言えばよかったのに。村の大人たちは、みんな、そう言っている。俺たちは、操られていたんだ、と。", "あの男は、言わなかった。", "「……あの人、悪い人？」", "聞いてから、ずるい聞き方だと思った。", "若者は、すぐには、答えなかった。梅の花びらが、風に、ひとひら、散った。", "「俺には、決められません」", "やがて、静かに、言った。", "「ミサキさんが、自分の目で見て、決めることだと思います」", "ミサキは、若者の顔を、見た。", "困ったような顔ではなかった。逃げている顔でもなかった。ただ、本当に、そう思っている顔だった。", "ミサキは、紙に、目を戻した。", "おまえにも、土産を。", "父ちゃんは、手紙の最後に、いつも、土産の話を書いた。山の向こうの、甘い飴。港町の、青い貝殻。一度も、本当に持って帰ってきたことはなかった。手ぶらで帰ってきて、すまんすまん、と頭をかいた。", "それでも、毎回、書いた。", "(土産なんて、いらなかったのに)", "涙が、紙に、落ちそうになった。ミサキは、慌てて、紙を胸に抱いた。", "若者は、何も言わなかった。ただ、隣に、座っていた。", "しばらくして、ミサキは、家のほうを振り返った。", "開いたままの戸口の奥に、土間に膝をついたままの、男の背中が見えた。さっきから、少しも、動いていない。秋の風が、男の髪を、揺らしていた。", "母ちゃんが、立ってください、と言っているのが、かすかに聞こえた。男は、首を振っていた。", "(ずっと、ああしてるつもりなんだ)", "ミサキは、唇を噛んだ。ばかみたいだ、と思った。英雄のくせに。勇者のくせに。土の上で、十二の子どもに、睨まれて。", "それでも、目が、離せなかった。"]}, {"h": "六", "p": ["その夜、タケルは、ヤツカの家に泊まった。", "囲炉裏の向こうで、老将は、長いひげを撫でていた。北の砦から戻って、二か月。ひげは、きれいに梳かれていた。ハツが、毎朝、梳いてくれるのだという。", "「おまえは、昔から、先に謝る子だったな」", "ヤツカが、言った。", "「稽古で、木刀を取り落とすたびに、儂より先に、頭を下げた。叱る前に、謝る。だから、叱りようがなかった」", "「……覚えていません」", "「儂は、覚えておる」", "ヤツカは、少し、目を細めた。", "「砦で、おまえと打ち合ったとき、儂の頭の中では、ずっと声が鳴っておった。旗を降ろすな、とな。おまえの木刀を受けながら、儂は、おまえを、知らぬ若造だと思っておった」", "「ヤツカ殿」", "「謝るな。今度は、儂の番だ」", "老将は、頭を下げた。長いひげが、膝の上に垂れた。", "「自分の弟子の顔を、儂は、忘れておった。すまなんだ」", "タケルは、何も言えなかった。ただ、囲炉裏の向こうで頭を下げる師の、白くなったひげを、見ていた。", "老将は、火箸で、炭をつついた。", "「ゴロウは、儂の砦の兵ではなかった。根の洲へ回された口だ。だが、村の者は、皆、あいつの手紙を、笑いながら待っておった。読めもせんのにな」", "タケルは、膝の上の拳を、握った。", "懐から、もう一枚の紙を、取り出した。根の洲の小屋で、何十枚も書き損じた、その最後の一枚だった。", "『ミサキ殿』", "その一行のあとに、何行も、線が引かれていた。線の下に、まだ、謝りの言葉が、透けて見えた。", "「渡すつもりで、書いた」", "タケルは、紙を、炉の火にかざした。", "「だが、これは、続きではない。俺の言葉だ。あの人の手紙の続きを、俺が書いていいはずがない」", "紙の端に、火が移った。", "ヤツカは、止めなかった。ただ、燃えていく紙を、黙って見ていた。", "「では、続きは、誰が書く」", "タケルは、答えられなかった。", "火が、紙を、すっかり呑み込んだ。灰が、ふわりと、炉の上に舞った。", "その時、戸口で、小さな音がした。", "戸が、少しだけ、開いていた。隙間から、大きな目が、のぞいていた。", "ミサキだった。", "「……書くよ」", "少女は、言った。", "「続き。わたしが、書く」"]}, {"h": "七", "p": ["朝の光が、板の間に、差し込んでいた。", "ミサキは、文机の前に、正座していた。母ちゃんが、どこかから、筆と、新しい紙を、借りてきてくれた。", "父ちゃんの紙を、左に置いた。右に、新しい紙。", "筆を持つ手が、震えた。", "何を書けばいいのか、分からなかった。", "父ちゃんは、続きに、何を書くつもりだったのだろう。土産の話か。母ちゃんの話か。それとも、帰りが遅くなる、すまん、という、いつもの謝りか。", "母ちゃんが、囲炉裏の向こうで、柿を剥いていた。父ちゃんの使っていた、小さな刃物で。皮が、途中で切れた。父ちゃんなら、一本につなげて、ミサキの首に、首飾りみたいにかけてくれた。", "「父ちゃんは、何を書いたと思う？」", "ミサキが聞くと、母ちゃんは、手を止めた。", "「さあね。でも、あの人のことだから」", "母ちゃんは、切れた皮を、指でつまんで、少し笑った。", "「きっと、また、土産の話よ」", "字を習ったのは、父ちゃんの手紙を読むためだった。読めても、書いたことは、ほとんどない。", "(父ちゃんの字で、書こう)", "右に流れる、あの字で。どこで止まって、どこで跳ねるか。全部、知っている。", "ミサキは、筆を、紙に下ろした。", "一行目は、父ちゃんの言葉を、そのまま写した。", "『戦が終われば、英雄の凱旋で街が祝うそうだ。おまえにも土産を』", "そして、その続きを。", "『おまえにも土産を、たくさん持って帰る。山の向こうの、甘い飴と、港の、青い貝殻と。今度こそ、本当に持って帰る。だから、母ちゃんの言うことをよく聞いて、梅の木から落ちないように。待っていてくれ。父より』", "書き終えて、筆を置いた。", "右に流れる、不器用な字だった。父ちゃんの字に、少し似ていた。少しだけ、似ていなかった。", "母ちゃんが、後ろから、のぞき込んだ。読めなかったはずなのに、母ちゃんは、袖で、目を押さえた。", "ミサキは、もう一枚、紙を取った。", "今度は、自分の字で、書いた。まっすぐな、少し角ばった、自分の字で。", "『父ちゃんへ。土産は、いらない。ちゃんと、待ってた。ミサキより』", "二枚の紙を、重ねて、折った。", "それから、土間に降りた。", "戸口の外に、タケルが立っていた。夜明けから、ずっと、そこで待っていたらしい。肩に、朝露が光っていた。少し離れて、あの若者もいた。", "ミサキは、タケルの前に立った。", "「勇者さま、とは、呼ばないから」", "男の顔を、まっすぐに、見上げた。", "「タケルさん」", "男の目が、わずかに、揺れた。", "「これ、父ちゃんのところへ、持っていって。父ちゃんがいた、その場所に」", "折った紙を、差し出した。", "「わたしは、行けないから。あんたが、持っていって。それが、あんたの、仕事」", "タケルは、紙を、両手で受け取った。", "指が、震えていた。", "「……確かに、預かった」", "男は、紙を、胸の内側に、しまった。焼け残った紙と、同じ場所に。", "それから、土の上に、膝をついた。昨日と同じように。けれど、今日は、少女と、目の高さが、同じになった。", "「ゴロウ殿の名を、俺は、知らなかった」", "男の声は、低かった。", "「顔も、知らなかった。だから、教えてほしい。ゴロウ殿は、どんな人だった」", "ミサキは、少し、驚いた顔をした。", "それから、ゆっくりと、話し始めた。字が下手だったこと。土産を、一度も、持って帰らなかったこと。柿を剥くのが、村でいちばん、うまかったこと。", "男は、一言も、聞き漏らさないように、聞いていた。", "梅の木の向こうで、オオナムチが、そっと、背を向けた。山の上の空が、白んでいた。"]}, {"h": "八", "p": ["根の洲の土は、もう、黒くなかった。", "秋に蒔いた麦が、青い穂を、出しかけていた。焦げた根を、何千回も掘り返した土だった。", "タケルは、畑の端に、膝をついた。", "手紙を掘り出した場所だった。目印に、小さな石を、置いてあった。", "胸の内側から、紙を取り出した。焼け残った一枚と、ミサキが書いた二枚。三枚を、重ねた。", "小さな木の箱に、それを納めた。炉ヶ岳の職人に頼んで、作ってもらった箱だった。蓋の裏に、名を、一つ、彫ってもらった。", "ゴロウ。", "箱を、土に、埋めた。上から、土を、両手で、かけた。", "「届けたか」", "背後から、声がした。", "ミカヅチが、腕を組んで、立っていた。いつから、そこにいたのか。", "「届けた」", "タケルは、立ち上がった。膝の土を、払わなかった。", "「そして、預かった」", "「何を」", "「続きを」", "ミカヅチは、眉を上げた。", "「あの娘が、書いた。父親の字を真似て、父親の続きを。それから、自分の字で、返事を」", "タケルは、埋めた土を、見下ろした。", "「俺には、書けなかった。書いてはいけなかった。続きは、書く者が、ちゃんといた」", "ミカヅチは、しばらく、黙っていた。", "それから、鍬を、タケルのほうへ、放った。", "タケルは、それを、受け取った。", "「手が止まっているぞ」", "「分かっている」", "「分かっている者の手は、止まらん」", "いつもの、やりとりだった。", "タケルは、鍬を、振り下ろした。土の匂いが、立ち上った。", "畦の向こうで、オオナムチが、こちらを見ていた。目が合うと、青年は、小さく、頭を下げた。それから、比良坂のほうへ、歩き出した。", "あの青年は、最後まで、一言も、口を挟まなかった。ただ、見ていた。", "本当は、一度だけ、口を開いていたのを、タケルは、知っている。梅の木の下で、少女に問われて、静かに答えていた。決められません、と。自分の目で見て決めることだ、と。", "あれは、口を挟んだのではなかった。少女の問いを、少女に返しただけだった。", "(見られているから、歩けた)", "タケルは、そう思った。", "風が、麦の穂を、渡っていった。焼け野だった丘の上で、誰かの名を、呼ぶ声がした。鬼の若い衆が、仲間を、昼飯に呼んでいる声だった。", "まだ、償いは、終わらない。", "続きは、探し続ける。根の洲で消えた、何千の兵の、一人ひとりの名を。顔を。誰に、何を、持って帰るつもりだったのかを。", "タケルは、また、鍬を振り下ろした。", "――比良坂の縁。", "夕暮れの岩の上に、ベルが座っていた。オオナムチが、坂を上ってくるのを、待っていたようだった。", "「戻ったか」", "「戻りました」", "オオナムチは、ベルの隣に、腰を下ろした。大穴の底から、細い光の筋が、立ちのぼっていた。", "「名を、聞いてきました」", "ベルが、こちらを見た。", "「ゴロウさんです。北の山の村の。字が右に流れて、娘さんにしか読めなかった。土産の話ばかり書いて、一度も持って帰らなかった。柿を剥くのが、村でいちばん、うまかった」", "ベルは、しばらく、黙っていた。", "根の洲の丘で、顔を見ずに消した隊列。その中の、一人。", "「ゴロウ」", "ベルは、その名を、口にした。", "「……覚えた」", "それから、拳を、握りかけて、ゆっくりと開いた。", "「一人ずつだ。全部は、知れぬかもしれぬ。それでも、一人ずつ、覚える」", "「半分ずつ、ですよ」", "オオナムチが言うと、ベルは、少しだけ、口の端を上げた。", "赤い空の下で、光の筋が、静かに揺れていた。"]}]}, {"id": "bangai5", "label": "番外編五", "title": "十一人の名", "chars": 9586, "sections": [{"h": "一", "p": ["ナキメは、筆と紙を、包みにしまった。", "墨は、三本。紙は、束で二つ。それから、小さな硯。宮の書庫から持ち出したものだった。", "「記録を、お願いできますか」", "昨夜、オモイカが、そう言った。", "宮の回廊で、すれ違いざまだった。杖をついた参謀は、いつもと同じ、静かな声をしていた。けれど、ナキメには、分かった。その声の底に、何かが、決まっていた。", "「何の、記録でしょう」", "「名の、記録です」", "オモイカは、それだけ言って、少し笑った。", "「明日の朝、ヒラサカの関で。あなたに、書いてほしいのです。私の声が、途中で、出なくなっても。あなたの筆なら、止まらないでしょうから」", "ナキメは、すぐには、答えられなかった。", "名の記録。", "あの会談から、季節が、二つ巡っていた。王の書簡が「整いすぎている」と、オモイカが眉をひそめていた日。随員十四人と、大穴の縁へ向かった日。", "戻ってきたのは、オモイカ一人だった。", "その十四人のうち、三人の名を、オモイカは、同盟の儀の前夜に、ようやく語った。笛吹きのササラ。書記のフミト。若い鴉のツバメ。", "残りは、十一人。", "「書きます」", "ナキメは、言った。", "「どれだけ、長くなっても。一人も、落とさずに」", "オモイカの目が、ほんの少し、和らいだ。", "オモイカは、深く、頭を下げた。", "その夜、ナキメは、眠れなかった。", "鴉族の長として、ナキメは、記録をつけるのが、癖だった。民の数、羽の生え替わり、言霊の稽古の進み具合。牢の見張りの、交代の刻限まで。", "その記録が、役に立たなかった夜がある。", "タケルたちが牢を破った夜。解呪を急いだ自分の言霊の綻びが、人間の王への合図になった。見張りの伝令は、何も悪くなかった。悪かったのは、自分だった。", "記録は、起きたことしか、書けない。", "けれど、明日、書くのは、違う。失われた者たちが、確かに、いたということ。", "(書く。一字も、間違えずに)", "窓の外で、赤い空が、ゆっくりと、白み始めていた。"]}, {"h": "二", "p": ["その知らせが届いたのは、十日前のことだった。", "オモイカは、宮の執務の間で、人間界からの文を、読んでいた。", "差出人は、タケルだった。根の洲を耕す、元の勇者。文は、短かった。字は、角張っていて、筆圧が、強かった。", "『北の山の村へ、手紙を届けた。ミサキは、十二になっていた。続きを、自分で書いた。父さんへ、と』", "それだけだった。", "オモイカは、その文を、何度も、読み返した。", "根の洲の、焼け野。人の軍勢が、跡形もなく消えた日。その中に、娘へ手紙を書きかけていた兵がいた。その手紙が、土の中から掘り出され、勇者の手で、娘のもとへ届いた。", "娘は、続きを書いた。", "死んだ父に向けて。", "(書けたのですね)", "オモイカは、文を、卓に置いた。", "自分は、まだ、書けていない。語れていない。十四人のうち、三人の名を、口にしただけだ。", "十一人の名は、全部、覚えている。顔も、声も、好物も。家族が何人で、故郷の畑がどれほどの広さで、会談の朝、何を食べたかまで。", "覚えているのに、口に出せない。", "出せば、それが、最後になる気がした。名を語り終えたら、あの十一人は、本当に、過去の人になってしまう。胸の中で、まだ、歩いているのに。", "(違う)", "オモイカは、杖を握った。", "人間の娘が、死んだ父に、続きを書いた。それは、父を過去にするためではない。父と、もう一度、話すためだ。", "名を語るのも、同じなのかもしれない。", "語らずにいれば、十一人は、オモイカの胸の中にしか、いない。オモイカが倒れれば、一緒に消える。誰の記憶にも、残らない。", "寄り道の旅で、あの人間の青年が、何度も見てきたものだった。名を呼ばれなくなった者の、輪郭が、薄れていく。", "自分は、十一人を、そうしていた。", "守っているつもりで。", "オモイカは、立ち上がった。回廊の向こうに、黒い翼の影が見えた。", "「ナキメ」", "呼んだ声は、思っていたより、しっかりしていた。"]}, {"h": "三", "p": ["ヒラサカの関の、見張り小屋は、狭かった。", "鬼族の見張りが、二人に場所を空けてくれた。囲炉裏に、火が入っている。窓の外に、比良坂へ下る道と、岩の窪みに置かれた、平たい石が見えた。", "名の刻まれていない石だった。", "オモイカは、囲炉裏の前に座り、杖を膝に置いた。ナキメは、隣に、紙を広げた。墨をすった。", "しばらく、どちらも、何も言わなかった。", "火のはぜる音だけが、していた。", "オモイカは、膝の上の杖を、何度も、握り直した。口を開きかけては、閉じた。そのたびに、喉の奥で、小さな音がした。", "ナキメは、急かさなかった。筆に墨を含ませたまま、紙の上に、そっと置いていた。いつ、最初の名が来ても、すぐに書けるように。", "鴉族は、待つことに、慣れている。巣の上で、何日でも、風を待つ。卵がかえるのを、待つ。言伝が、遠くから届くのを、待つ。", "窓の外で、見張りの鬼が、篝火の薪を、一本、足した。", "その音で、オモイカが、顔を上げた。", "「一人目」", "オモイカが、言った。", "声が、少しだけ、震えた。ナキメは、筆を、紙に置いた。", "「アオイ。土蜘蛛の、料理番でした」", "ナキメの筆が、動いた。", "「会談の一行の、食事を、すべて、一人で作っていました。背の甲殻に、鍋を括りつけて、歩くんです。どこへ行っても、湯気が、ついてきた」", "オモイカの口の端が、かすかに、上がった。", "「好物は、栗の団子。夫と、子が三人。いちばん下の子は、まだ、乳飲み子でした。会談の朝、出かける前に、私の椀に、団子を一つ、余分に入れてくれました。参謀様は、細すぎますって」", "ナキメは、書いた。好物。家族。それから、最後の言葉。", "「最後に、何と」", "「『帰ったら、栗を剥くのを、手伝ってくださいね』と」", "オモイカは、目を閉じた。", "「手伝えませんでした」", "ナキメの筆が、一瞬、止まった。それから、また、動いた。一字も、乱れなかった。", "「二人目。カガリ。鬼の、護衛でした。まだ、二十にもなっていなかった」", "「はい」", "「母一人、子一人の家で。好物は、焼いた芋。角ヶ原の芋が、いちばん甘いと、言い張って。会談に向かう道で、腰の刃を、何度も、撫でていました。オハバリの鍛冶に、打ってもらったばかりの刃だと」", "窓の外で、風が、鳴った。", "「『この刃、まだ、一度も抜いたことがないんです』と、言っていました。抜かずに済めばいいのですが、と、私が言うと、笑って、そうですね、と」", "ナキメは、書いた。", "抜かずに済んだのだ。抜く暇も、なかった。", "「三人目」", "オモイカは、杖を握り直した。", "「シノ。鴉の、伝令見習い。あなたの、教え子でした」", "ナキメの手が、止まった。"]}, {"h": "四", "p": ["シノ。", "ナキメは、その名を、胸の中で、繰り返した。", "知っていた。もちろん、知っていた。言伝の言霊を、宮の露台で、半年かけて、教えた子だ。覚えが悪くて、声を風に乗せるたびに、言葉が、途中で、ばらばらになった。", "それでも、諦めなかった。", "ある夕暮れ、ついに、言伝が、最後まで届いた。宮の端から端まで。ナキメの耳に、シノの声が、はっきりと、聞こえた。", "『ナキメ様。届きましたか』", "それが、シノの、初めての言伝だった。", "会談の随員に選ばれたとき、シノは、跳び上がって喜んだ。伝令として、初めての、大きな役目だった。ナキメは、それを、送り出した。", "「好物は、干し柿。妹が一人。その妹も、鴉で、今は、私のところで、言伝を習っています」", "オモイカの声が、遠くに聞こえた。", "「会談の朝、シノは、空を見上げて、言いました。『雲が低いです。雨になるかもしれません』。それが、最後の言葉でした。雨は、降りませんでした」", "ナキメは、筆を、持ち直した。", "指が、震えていた。", "鴉族の長は、震えてはならない。王の前でしか、膝を震わせてはならない。そう、自分に言い聞かせてきた。", "けれど、今、震えているのは、膝ではなかった。", "(私は、この名を、口にしていなかった)", "教え子だったのに。半年、毎日、名を呼んでいたのに。あの日から、一度も。", "オモイカだけでは、なかったのだ。", "名を呼ばずにいたのは。", "ナキメは、紙に、書いた。", "シノ。鴉。伝令見習い。好物、干し柿。妹、一人。最後の言葉、「雲が低いです。雨になるかもしれません」。", "一字ずつ、ゆっくりと。", "書き終えて、筆を置いた。", "「……シノ」", "小さく、口にした。", "オモイカが、こちらを見た。何も言わなかった。ただ、少しだけ、うなずいた。", "「続けてください」", "ナキメは、筆を取った。", "オモイカは、四人目を、語った。", "ハヤテ。嵐狼の、斥候。双子の弟がいて、いつも、どちらがどちらか、間違えられていた。好物は、川魚の塩焼き。最後の言葉は、「弟に、俺の分の魚も、食っていいと伝えてください」。", "五人目。ミズキ。土蜘蛛の、測量係。道のりと、歩いた歩数を、全部、書き付けていた。好物は、甘い瓜。埴の里に、帰りを待つ人がいた。最後の言葉は、「大穴まで、あと三千と二百歩です」。", "六人目。ツムギ。鴉の、衣装係。オモイカの礼装の、ほつれを、会談の朝に、縫い直した。好物は、花の蜜。祖母と二人暮らし。最後の言葉は、「これで、どこへ出ても、恥ずかしくありません」。", "七人目。イブキ。鬼の、薬師。腕が太く、薬草を摘む指だけが、細かった。好物は、苦い茶。娘が二人。最後の言葉は、「怪我人が出たら、私を、真っ先に呼んでください」。", "呼べなかった。", "オモイカは、そう言って、しばらく、黙った。", "八人目。コハル。嵐狼の、通詞。人間の言葉の、細かい言い回しを、誰よりも知っていた。王の書簡を、一緒に読んだ。整いすぎていますね、と、オモイカと同じことを言った。好物は、木の実の焼き菓子。弟が三人。最後の言葉は、「参謀様の読み、私も、同じです」。", "ナキメの筆は、止まらなかった。", "紙が、一枚、また一枚と、埋まっていった。"]}, {"h": "五", "p": ["囲炉裏の火が、小さくなった。", "見張りの鬼が、黙って、薪を足していった。ナキメが顔を上げると、鬼は、目を伏せて、小屋の外へ出ていった。戸の向こうで、ずっと、聞いていたのだろう。", "「九人目」", "オモイカの声は、掠れていた。", "「トウゴ。鬼の、荷車引き。一行で、いちばん年寄りでした。フミトと、同じくらい。二人で、いつも、どちらが先に腰を痛めるか、賭けていました」", "オモイカは、少し笑った。", "「好物は、塩辛い漬物。孫が、七人。会談の間の前で、荷を下ろして、腰を叩いて、言いました。『さて、ここからは、若い者の出番ですな』と」", "ナキメは、書いた。", "「十人目。ユラ。土蜘蛛の、灯り持ち。暗い所でも、目がよく利いて、夜の道は、いつも、ユラが先頭でした。好物は、焼いた栗。アオイと、栗を取り合っていました。家族は、兄が一人。最後の言葉は」", "オモイカの声が、止まった。", "ナキメは、待った。", "「……『会談の間は、明るいですね。私の灯りは、要らないみたい』」", "囲炉裏の火が、はぜた。", "「明るすぎたのです。あの部屋は。白くて、整っていて。ユラは、それを、喜んでいた」", "オモイカは、杖を、両手で握りしめた。", "「十一人目」", "それが、最後だった。", "ナキメは、新しい紙を、広げた。", "「セナ。嵐狼の、少年でした。一行で、いちばん、若かった。十四になったばかりで」", "オモイカの目が、遠くを見た。", "「ササラの、笛の弟子でした。ササラの笛は、下手でした。その弟子ですから、セナの笛も、下手でした。二人で、調子の外れた笛を、道中ずっと、吹いていた。皆が、笑って。私も、笑いました」", "ナキメの筆が、紙の上で、止まった。", "「好物は、甘い団子。鴉族の、団子屋の。母親と、妹がいます。寄り添いの里に」", "「最後の言葉は」", "オモイカは、すぐには、答えなかった。", "長い沈黙だった。", "「……分からないのです」", "やがて、オモイカは、言った。", "「会談の間に、軍勢が流れ込んできたとき。私は、壁を作るので、精一杯でした。一人ずつ、倒れていく顔を、見ていました。目を逸らさなかった。それでも、セナの最後の言葉は、聞こえなかった」", "オモイカは、自分の背中に、手を回した。", "「それから、誰かの手が、私を、押しました。回廊の暗がりへ。『行ってください、どうか』と」", "ナキメは、息を詰めた。", "「誰の手だったか、分かりません。今でも。あの時、私の背に、近かったのは、何人も、いました。トウゴかもしれない。ユラかもしれない。セナかもしれない」", "オモイカは、手を、膝に戻した。", "「分からないから、ずっと、怖かったのです。誰か一人に礼を言えば、ほかの者を、忘れることになる気がして。だから、誰の名も、言えなかった」", "ナキメは、筆を、置いた。", "「今は」", "「今は」", "オモイカは、窓の外の、名のない石を見た。", "「十一人、全員に、言います。あの手は、あなた方、みんなの手でした、と」", "ナキメは、紙に、書いた。", "セナ。嵐狼。笛の弟子。好物、甘い団子。母と、妹。最後の言葉、――。", "それから、少し考えて、その下に、一行、書き足した。", "『行ってください、どうか』。十一人の、誰かの声。十一人、みんなの声。"]}, {"h": "六", "p": ["ヤマブキは、鑿を、研いでいた。", "オハバリ城の鍛冶場から、ヒラサカの関まで、半日かかった。鬼族の見張りが、迎えに来たのだ。参謀殿が、石に名を刻める者を探している、と。", "刻むのは、得意ではなかった。ヤマブキは、刃を打つ鍛冶だ。石を彫るのは、石工の仕事だ。", "けれど、ヤマブキは、断らなかった。", "あの十四人の中に、ヤマブキの打った刃を、腰に下げていった若者がいた。カガリ。まだ、一度も抜いたことがない、と、嬉しそうに言っていた鬼の護衛。", "刃は、一度も抜かれずに、失われた。", "抜かれなかった刃。役に立たなかった刃。ヤマブキは、そのあと、長いこと、炉の前に立てなかった。立てなくなって、誰も、ヤマブキの名を、呼ばなくなった。", "呼び戻してくれたのは、ミカヅチの頭領だった。それから、人間の青年の短剣を、研がせてもらった。あの刃は、抜かれた。坂上の砦で。人間界最強の剣を、弾いた。", "だから、今度は、名を刻む。", "ナキメの書いた紙を、オモイカが、ヤマブキに渡した。十四の名が、きれいな字で、並んでいた。", "ササラ。フミト。ツバメ。", "アオイ。カガリ。シノ。ハヤテ。ミズキ。ツムギ。イブキ。コハル。トウゴ。ユラ。セナ。", "ヤマブキは、名のない石の前に、膝をついた。", "鑿を、石に当てた。", "槌を、振り下ろした。", "かつん、と、乾いた音が、関に響いた。", "一画。また一画。", "刃を打つのと、同じだった。焦れば、割れる。力を抜けば、浅くなる。ひと打ちずつ、相手の芯を、確かめながら。", "カガリの名を刻むとき、ヤマブキは、一度だけ、手を止めた。", "それから、ほかの名よりも、少しだけ、深く、刻んだ。", "日が傾くころ、石には、十四の名が、並んでいた。", "オモイカは、杖をついて、その前に立っていた。ナキメが、少し後ろで、紙の束を抱えていた。", "誰も、何も、言わなかった。", "ヤマブキは、鑿を置いて、汗をぬぐった。腕が、痺れていた。", "「……抜かれましたよ」", "石に向かって、言った。", "「あんたの刃じゃないけど、あたしの研いだ刃は。人間の子の手で。ちゃんと、守るために」", "風が、石の上を、通り過ぎていった。"]}, {"h": "七", "p": ["日が落ちてから、関に、足音がいくつも近づいてきた。", "先頭は、スサノだった。灰色の毛並みの嵐狼の長が、牙を覗かせたまま、坂を上ってくる。その後ろに、嵐狼の女が一人と、小さな娘。それから、若い嵐狼の男が一人。", "「寄り添いの里から、連れてきた」", "スサノは、唸るように言った。", "「名を刻むと、聞いた。家族が、見ずに済むものか」", "オモイカは、杖をついたまま、深く頭を下げた。", "嵐狼の女は、石の前に立った。指で、一つの名をなぞった。セナ。", "「……下手だったでしょう、あの子の笛」", "女は、オモイカを見ずに、言った。", "「家でも、ずっと吹いていて。うるさいって、何度も叱りました」", "「はい」", "オモイカは、答えた。", "「下手でした。ササラと二人で、道中ずっと。皆が、笑っていました。私も」", "女の肩が、震えた。小さな娘が、母の裾を握った。娘は、首から、粗末な木の笛を下げていた。", "「兄ちゃんの笛」", "娘が、言った。", "「もらったの。行く前に。帰ったら、吹き方、教えてくれるって」", "オモイカは、膝を折った。腹の傷が疼いたが、構わなかった。娘と、同じ高さになった。", "「教えてもらえなかったのですね」", "娘は、こくりと、うなずいた。", "「私も、吹けません」", "オモイカは、言った。", "「けれど、セナの吹き方なら、覚えています。息を、半分だけ吸って、指を、少し浮かせて。いつも、高い音が、裏返っていました」", "娘が、目を丸くした。", "それから、笛を、口に当てた。息を、半分だけ吸って。", "ぴい、と、裏返った音が、関に響いた。", "母親が、口を押さえた。スサノが、顔をそむけた。ナキメの翼が、大きく、ふるえた。", "若い嵐狼の男は、別の名の前に、立っていた。", "ハヤテ。", "「双子の、弟です」", "男は、言った。兄と、そっくりの顔だった。間違えられていた、という話を、ナキメは、昨夜、書いたばかりだった。", "「兄貴、最後に、何か言ってましたか」", "オモイカは、ナキメの紙を、見なかった。見なくても、覚えていた。", "「弟に、俺の分の魚も、食っていいと伝えてください、と」", "男は、しばらく、黙っていた。", "それから、声を上げて、笑った。笑いながら、泣いていた。", "「あの野郎。いつも、俺の魚を、取ってたくせに」", "スサノが、男の肩に、黙って、手を置いた。", "群れの掟は、遅れた者を、置いていく。スサノは、その掟を破って、寄り添いの里を作った。誰も、置いていかないために。", "置いていかれた者の名を、置いていかない。", "それも、同じことなのかもしれなかった。"]}, {"h": "八", "p": ["その夜、ベルは、宮の露台で、紙の束を読んでいた。", "ナキメが、言伝で、知らせてきたのだ。記録ができました、と。鴉の伝令が、夜のうちに、束を運んできた。", "月はなかった。赤い空が、夜の色に沈んでいた。露台の灯りの下で、ベルは、一枚ずつ、紙をめくった。", "アオイ。土蜘蛛の、料理番。好物、栗の団子。夫と、子が三人。", "ナキメの字は、細く、まっすぐだった。一字も、乱れていなかった。けれど、ところどころ、墨が、少しだけ滲んでいた。", "カガリ。シノ。ハヤテ。", "ベルは、紙をめくる手を、何度も、止めた。", "会ったことのない者たちだった。会談の随員は、オモイカが選んだ。ベルは、その日、埴の里で、収穫祭の杭を打っていた。十四人の出立を、見送りもしなかった。", "(見送っていれば)", "顔を、知っていたかもしれない。", "ベルは、首を振った。それは、言っても、仕方のないことだった。", "ミズキ。最後の言葉、「大穴まで、あと三千と二百歩です」。", "ベルは、その一行を、長く、見つめた。", "三千と二百歩。歩数を、一歩ずつ、数えていた者がいた。その一歩ずつの先に、あの会談の間があった。", "ツムギ。イブキ。コハル。トウゴ。ユラ。", "そして、セナ。", "最後の言葉の欄は、線だけだった。その下に、ナキメの字で、一行。", "『行ってください、どうか』。十一人の、誰かの声。十一人、みんなの声。", "ベルは、紙を、膝に置いた。", "露台の手すりの向こうに、魔界の夜が、広がっていた。埴の里の灯り。角ヶ原の篝火。寄り添いの里の、小さな窓の明かり。", "その一つ一つに、名を持つ者たちが、眠っている。", "ベルは、立ち上がった。外套を、肩にかけた。", "ヒラサカの関まで、歩けば、夜明けに着く。", "翼を使えば、すぐだった。けれど、ベルは、歩くことにした。ミズキの数えた三千と二百歩を、自分も、どこかで、数えてみたかった。宮から関までは、その何倍もあった。何度でも、数え直せばいい。", "一。二。三。", "宮の門を出て、坂を下った。夜の畑の畦を、芽を踏まないように、歩いた。昔、ハニヤスに叱られた歩き方だった。", "百を越えたあたりで、数がわからなくなった。考えごとをすると、すぐに、どこまで数えたか、分からなくなる。", "ミズキは、これを、大穴までずっと、続けていたのだ。一歩も、間違えずに。", "ベルは、もう一度、一から数え直した。", "一度目の三千と二百を数え終えたころ、埴の里の灯りが、後ろに遠ざかった。また、一から数えた。二度目を数え終えたころ、角ヶ原の篝火が、左手に見えた。鬼の見張りが、王の姿に気づいて、慌てて膝をついた。ベルは、手を上げて、立たせた。", "「名は」", "「は」", "「おまえの、名だ」", "若い鬼は、目を白黒させて、名を言った。ベルは、それを、繰り返した。鬼は、なぜか、泣きそうな顔をした。", "何度目かの三千を越えたころ、比良坂へ下る道の手前で、関の篝火が、見えてきた。", "三千と、二百。", "何度目の三千と二百なのか、もう、分からなかった。", "ベルが、関に着いたのは、夜明け前だった。", "宮から、一人で、歩いてきた。翼は、畳んだままだった。角が、篝火の明かりに、黒く光っていた。", "オモイカは、石の前で、待っていた。一晩中、そこにいたのだろう。肩に、霜が降りていた。ナキメが、自分の翼を広げて、その肩を、半分、覆っていた。", "「申し訳ありません、私は――」", "オモイカが、言いかけた。", "ベルは、片手を上げた。", "いつもなら、ここで、言う言葉がある。それより、次の手を聞かせてくれ、と。", "けれど、ベルは、言わなかった。", "石の前に、立った。", "十四の名が、篝火の明かりに、浮かび上がっていた。深い名、浅い名。鬼の鍛冶の、不慣れな鑿の跡。それでも、一字も、欠けていなかった。", "ベルは、石に、手を当てた。", "冷たかった。", "同盟の儀の前夜、オモイカは、三人の名を語った。ベルは、それを、覚えた。残りの十一人は、数でしか、知らなかった。", "数で、知っていた。", "根の洲の焼け野で、自分が消した兵たちも、数でしか、知らなかった。一万を超える軍勢。その一人ひとりに、名があった。家族があった。娘に、書きかけの手紙があった。", "数で知るとは、何も知らないということだ。", "ベルは、息を、吸った。", "「ササラ」", "声に出した。", "オモイカが、顔を上げた。", "「フミト。ツバメ」", "ベルは、石の上を、指でたどった。一つずつ。", "「アオイ」", "土蜘蛛の料理番。栗の団子。", "「カガリ」", "鬼の護衛。抜かれなかった刃。", "「シノ」", "ナキメの肩が、小さく、震えた。", "「ハヤテ。ミズキ。ツムギ。イブキ。コハル」", "一人ずつ。ナキメの紙で、昨夜、読んだ。好物も、家族も、最後の言葉も。読みながら、一人ずつ、顔を思い浮かべようとした。会ったことのない顔を。", "「トウゴ。ユラ」", "そして、最後の名。", "「セナ」", "関に、静けさが落ちた。", "篝火が、ぱちりと、はぜた。", "ベルは、石から、手を離した。振り返った。オモイカの目から、涙が、とめどなく、流れていた。", "「覚えた」", "ベルは、言った。", "「十四人。全員だ」", "それから、少しだけ、間を置いて、言った。", "「おまえ一人に、背負わせていた。すまなかった」", "オモイカは、首を振った。何度も、何度も。声が、出ないようだった。", "ナキメが、オモイカの背に、そっと、手を当てた。", "「あの手は」", "オモイカが、ようやく、言った。", "「ササラも、フミトも、ツバメも、あのときには、もう、床に伏していました。あの日、私の背を押した手は、十一人の、誰かの手でした。だから、十一人、全員に、礼を言いました。昨夜、ここで」", "「そうか」", "「ようやく、言えました」", "ベルは、うなずいた。", "それから、空を見上げた。赤い空の端が、白み始めていた。比良坂の大穴の底から、光の筋が、細く、立ちのぼっていた。", "「オモイカ」", "「はい」", "「次の手を、聞かせてくれ」", "オモイカは、泣きながら、笑った。同盟の儀の前夜と、同じ顔だった。", "「はい」", "涙をぬぐって、杖を握り直した。", "「まず、次の収穫祭の席を、十四、空けておくことから」", "「十四か」", "「はい。誰も座らない席です。けれど、名札を、置きます。一人ずつ、名を書いて」", "ベルは、口の端を、わずかに上げた。", "「よい手だ」", "ナキメが、紙の束を、胸に抱きしめた。十四人ぶんの、名と、好物と、最後の言葉が、そこにあった。", "「名札の字は、私が、書きます」", "その声は、もう、震えていなかった。", "夜が、明けていった。石に刻まれた十四の名が、朝の光の中で、一つずつ、くっきりと、浮かび上がった。", "関の脇の、岩の窪みで、誰かが、置いていったのだろう。栗の団子が一つと、焼いた芋が一つ、並んでいた。見張りの鬼が、照れくさそうに、目をそらした。"]}]}, {"id": "bangai6", "label": "番外編六", "title": "名を呼び合う祭り", "chars": 9920, "sections": [{"h": "一", "p": ["うろの家の入口に、乾いた落ち葉が、吹き溜まっていた。", "ユズリハは、膝の上の包みを撫でながら、その音を聞いていた。秋の森は、音が多い。木の実が落ちる音。鳥が枝を移る音。遠くで、誰かが誰かを呼ぶ声。", "「ユズリハさん」", "その声が、うろの入口から、聞こえた。", "ユズリハは、顔を上げた。", "継ぎの当たった外套の青年が、立っていた。去年の秋に初めて来て、それから、季節ごとに、顔を見せる。来るたびに、名を呼ぶ。呼ばれるたびに、ユズリハは、自分の手の皺が、少しずつ、はっきりしていくのを感じた。", "「オオナムチか。また来たのか」", "「はい。続きを、聞きに」", "青年は、いつものように、膝をついて、ユズリハの目の高さに、顔を合わせた。", "「続きなら、もう、ほとんど話したぞ」", "「ほとんど、ですよね」", "青年は、少し笑った。", "「祭りが、どうして終わったのか。それだけ、まだ、聞いてないです」", "ユズリハは、黙った。", "膝の上の包みを、解いた。焼けた端の、古い紙の束。字は、もう読めない。けれど、指が、覚えている。", "「終わったのではない」", "しばらくして、ユズリハは言った。", "「呼ばなくなっただけじゃ。ある年、大穴の向こうの者たちが、来なかった。次の年も。そのうち、誰も、待たなくなった。待たなくなったら、名を呼ぶ相手も、おらん。それだけのことよ」", "「それだけ、ですか」", "「それだけじゃ。大きな戦があったわけでも、誰かが禁じたわけでもない。ただ、互いに、少しずつ、面倒になった。行くのも、迎えるのも」", "ユズリハは、紙の束を、撫でた。", "「祭りの最後の夜にな、皆で歌った歌がある。その歌の、最後の一行だけが、どうしても、思い出せん。何百回も語ってきたのに、そこだけ、穴が空いておる」", "青年は、しばらく、紙の束を見ていた。", "それから、懐から、一通の文を取り出した。", "黒い封蝋に、稲穂の印が押されていた。", "「ユズリハさん。今年の収穫祭に、来てもらえませんか」", "「収穫祭」", "「大穴の向こうの、埴の里で。ベルさんが、皆を呼びたいって。人も、エルフも、ドワーフも、亜人も。知らない人同士で、名前を聞いて、呼び合う祭りにしたいって」", "ユズリハは、文を見つめた。", "封蝋の稲穂が、うろに差し込む光の中で、小さく光っていた。", "「わしは、この森を、出たことがない」", "「知ってます」", "「足も、弱い」", "「コノハさんが、背負うって言ってました」", "「……あの子がか」", "「別に、背負いたいわけじゃないけど、って」", "ユズリハは、声を上げて笑った。何年ぶりかの、笑い声だった。うろの中の落ち葉が、かさりと鳴った。"]}, {"h": "二", "p": ["比良坂の大穴を渡るのは、ハルにとって、初めてだった。", "光の筋に沿って、岩の道が、谷の向こうへ伸びている。前を、岐人のクナドが、足音もなく歩いていく。その後ろに、葛の里の人たちが、列になって続いていた。", "井戸番のナズナ婆さま。見張りのススキ。織り手のクズハ。ひなた野から移ってきた、機織りのノギクと、その子のフキと、畑のタネ爺。", "それから、兄ちゃん。", "「ハル。足元、気をつけろ」", "ユウが、振り返って、手を差し出した。腕章は、もう、ない。白い制服の代わりに、葛の里の、茶色い野良着を着ている。", "ハルは、その手を、握らなかった。", "「平気だよ。おれ、もう、十だもん」", "「九つだろ」", "「もうすぐ十なの」", "ユウは、困ったように笑った。笑うと、目尻が、少し下がる。昔と、同じだった。手紙の字と、同じように、少しだけ、右に傾いて。", "大穴を渡りきると、空が、赤かった。", "ハルは、足を止めた。", "話には、聞いていた。魔界の空は、昼でも赤い、と。けれど、本当に赤いとは、思っていなかった。夕焼けとも違う。燃えているのとも違う。ただ、ずっと、そういう色の空だった。", "「怖いか」", "ユウが、隣で、小さく聞いた。", "「……ちょっと」", "ハルは、正直に言った。", "魔族は、話の通じない者たちだ。ミナモの掲示板にも、そう書いてあった。ハルは、字が読めるようになってから、あの紙を、何度も見た。今は、もう、剥がされている。それでも、頭の隅に、字の形が、残っていた。", "段々田の上の道で、誰かが、手を振っていた。", "小さな子どもだった。灰色の毛並みの、狼の耳。ハルと、同じくらいの背丈だった。", "子どもは、声を出さなかった。代わりに、両手を、ひらひらと動かした。", "ハルは、きょとんとした。", "「耳が、聞こえないんだ」", "ユウが、言った。", "「オオナムチから、聞いた。手で、話すんだって」", "子どもは、もう一度、手を動かした。それから、自分の胸を指さし、また、手を動かした。", "ハルは、しばらく、それを見ていた。", "それから、真似をした。胸を指さして、子どもと同じように、手を動かした。合っているのかどうか、分からなかった。", "子どもが、目を丸くした。", "それから、にっと笑った。泥だらけの顔で。", "「……なんて、言ったんだろ」", "「たぶん、名前だよ」", "ユウが言った。", "「あの子の名前を、おまえが、真似したんだ」", "ハルは、自分の手を、見下ろした。", "怖さが、どこかへ、行っていた。", "後ろで、ナズナ婆さまが、杖を止めて、段々田を見上げていた。", "「ええ水が、流れとる」", "婆さまは、畦の脇の細い水路を、指さした。澄んだ水が、段から段へ、音を立てて落ちていた。", "「井戸番の目で見りゃ、分かる。ここの者は、水を、大事にしとる」", "婆さまは、それだけ言って、また歩き出した。その背中が、少しだけ、伸びて見えた。"]}, {"h": "三", "p": ["収穫祭の前の日、埴の里の畑は、支度で、ごった返していた。", "コノハは、畦の端で、ユズリハ婆さまを背中から下ろした。腰が、痛かった。", "「重かったわ」", "「すまんのう」", "「別に。謝ってほしいわけじゃないけど」", "ユズリハ婆さまは、くすくす笑って、畦の石に、腰を下ろした。その隣に、森の弓手のシイが、黙って座った。薬草摘みのツユクサが、籠を抱えて、物珍しそうに、あたりを見回している。", "聖の森から来たのは、それだけだった。", "クシナダ女王は、来られなかった。森の掟は、まだ、すべては変わらない。女王が、他の者を説き伏せている、と聞いた。来年には、もっと大勢を、連れてくるとも。", "コノハは、畑を見渡した。", "長い卓が、何列も並んでいた。鬼の若者たちが、酒の樽を転がしている。土蜘蛛の女たちが、団子を蒸している。嵐狼の子どもたちが、走り回っている。その間を、人間とドワーフと亜人が、混じって歩いていた。今年、初めて来た顔も、いくつかあって、どこに立てばいいのか分からないように、きょろきょろしていた。", "その中に、スクナがいた。", "杖をつきながら、段々田の畦を、すたすたと歩いている。", "コノハは、目を細めた。", "おかしかった。初めて来た土地のはずなのに、スクナは、畦の分かれ道で、一度も、迷わなかった。芽の出ている所を、まるで見えているように、よけて歩いている。", "畑の向こうで、ハニヤスが、鍬を止めて、スクナを見ていた。", "土蜘蛛の長は、何か言いかけた。それから、口を閉じた。", "「スクナ」", "コノハは、追いついて、隣に並んだ。", "「あなた、ここ、来たことあるの」", "「ないのう」", "スクナは、にやりと笑った。", "「年寄りはな、どこの畦も、同じに見えるんじゃ」", "「嘘」", "「嘘かもしれんのう」", "スクナは、杖の先で、畦の芽を、そっと指した。", "「土蜘蛛の畑はな、昔から、芽の出る所が決まっておる。地脈の、通り道じゃ。それを、知っておるだけよ」", "「なんで知ってるのよ」", "「なんでじゃろうな」", "スクナは、それきり、答えなかった。", "ハニヤスが、こちらへ歩いてきた。鍬を肩に担いだまま、スクナの前に立った。甲殻が、赤い空の光を、鈍く返していた。", "「爺さん」", "「なんじゃな」", "「俺の祖父が、昔、言っていた。大穴の向こうから、薬草を担いだ小さな爺さんが、毎年、祭りに来ていたと。畦の芽を、一つも、踏まなかったと」", "スクナは、目を細めた。", "ほんの一瞬だった。聖の森の入口で、初めてベルを見たときと、同じ目だった。", "「それは、よほど、長生きの爺さんじゃのう」", "スクナは、そう言って、くつくつと笑った。", "ハニヤスは、しばらく、スクナを見ていた。それから、鍬を担ぎ直した。", "「……土は、忘れはせん」", "それだけ言って、畑へ戻っていった。", "コノハは、二人の背中を、見比べた。聞きたいことは、いくらでもあった。けれど、聞いても、この爺さんは、笑うだけだろう。", "(まあ、いいわ)", "コノハは、そう思うことにした。どうせ、いつか、話す気になったら、話すのだ。森の者は、昔から、そういうものだった。"]}, {"h": "四", "p": ["祭りの夜は、赤い空が、深い藍に沈んだころに、始まった。", "ベルは、卓の端に、立っていた。", "魔王の姿だった。黒い角も、畳んだ翼も、隠さなかった。隠す理由は、もう、どこにもない。", "卓の上には、席の札が、一枚もなかった。", "オモイカの、案だった。種族の席も、身分の席も、作らない。代わりに、決まりを、一つだけ作った。", "隣に、知らない者がいたら、名を聞く。聞いたら、呼ぶ。", "それだけだった。", "ユズリハの語った、昔の祭りの、決まりだった。", "ベルは、畑を見渡した。", "港町ミナモから、船と街道を乗り継いで、漁師の一行が来ていた。背の丸い老人が、鬼の若者に、網の結び方を教えている。イサナ、と、ベルは、胸の中で、その名を呼んだ。隣で、網元の娘のアサギが、笑っていた。荷運びのトマリが、樽を担いで、走り回っていた。", "炉ヶ岳からは、イシコリドメとカナメが、里の職人を連れて来ていた。鍛冶のハガネが、鬼の鍛冶ヤマブキと、鎚の話で、声を荒げている。喧嘩ではなかった。炭焼きのスミが、二人の間で、呆れた顔をしていた。炉番の弟子のタタラは、もう、背が伸びていた。", "王都からは、コトシロと、ミオとヒナと、カズミが来ていた。ヒナは、白い花の咲いた鉢を、大事そうに抱えている。その後ろに、衛士のミカゲと、書記のシロエ。旅の歌い手のウタが、嵐狼の笛吹きの若者と、調子を合わせていた。", "畦の端に、見覚えのある荷車が、止まっていた。", "耳の尖った男が、塩の樽を下ろしている。その荷台から、背の伸びた女の子が、飛び降りた。女の子は、ベルの前まで駆けてきて、角と翼を、しばらく、見上げた。それから、あの街道の朝と同じように、胸を張った。", "「今度、会ったら、教えるって、言ったでしょ」", "「ああ。言った」", "「わたし、ナツメ」", "「ナツメ」", "ベルは、その名を、呼んだ。女の子は、満足そうに、うなずいた。", "「ベルって、王様だったんだね。火も、熾せなかったのに」", "荷車の男が、慌てて娘の口をふさいだ。ベルは、少しだけ、口の端を上げた。", "「返しに来るつもりだった。あの朝の、火口の借りを」", "「だから、返さなくていいって」", "男は、そう言って、また、声を上げて笑った。", "大穴の縁からは、クナドと、ヨミジと、ホムラ。埴の里からは、ウツホも。", "卓の外れに、タケルが、立っていた。", "席には、着いていなかった。根の洲の土が、まだ、爪の間に残っている。その隣に、長いひげの老人がいた。北の砦から戻った、老将ヤツカだった。", "二人の少し先で、少女が一人、母親の手を引いていた。手紙の宛名と、同じ名の少女だった。", "タケルは、少女のほうを、見なかった。見ないようにしていた。少女のほうも、タケルを、見なかった。", "それでも、二人は、同じ畑に、立っていた。", "(それで、よい)", "ベルは、思った。今夜、すべてが解けなくても、よい。同じ畑に立つ。今年は、それだけで。", "広間から運び出された卓の、いちばん奥には、杯が、十四並んでいた。", "酒は、もう、注がれていた。黄泉の深淵から持ち帰った、八塩折の甕の、底に残っていた酒だった。注いだのは、ハニヤスだと聞いた。", "オモイカが、杖をついて、その前に立っていた。十四の杯の、一つずつに、名が、添えられていた。ササラ。フミト。ツバメ。それから、もう、数ではなく、名で呼ばれる、十一人。", "オモイカは、ベルを見て、小さく、頭を下げた。", "ベルも、うなずいた。", "それから、杯を、高く掲げた。", "「名を、聞け」", "ベルの声が、畑に、響いた。", "「知らぬ者がいたら、名を聞け。聞いたら、呼べ。今夜は、それだけでよい」", "一瞬、畑が、静まった。", "それから、どこかで、小さな声がした。", "「……あの、お名前は」", "人間の声だった。それに、鬼の声が、答えた。", "「イバラだ。おまえは」", "「ソウタ、です」", "「ソウタ。飲め」", "笑い声が、上がった。", "それが、合図になった。", "あちこちで、名を聞く声が、上がりはじめた。ぎこちない声も、照れたような声も、あった。ドワーフの職人が、鴉族の屋台の主に。エルフの弓手が、嵐狼の若者に。聞いて、答えて、呼んで、また聞いて。", "ベルの前に、背の丸い老人が、杯を手に、立った。", "イサナだった。", "老人は、ベルの角と翼を、まじまじと見上げた。怖がっている顔ではなかった。海の上で、見慣れない魚を見つけたときのような顔だった。", "「あんたが、魔王様か」", "「そうだ」", "「わしは、港の漁師じゃ。イサナという」", "老人は、少しだけ、首をかしげた。", "「決まりじゃからの。知らぬ者には、名を聞く。……魔王様の、お名前は」", "ベルは、一瞬、言葉に詰まった。", "魔王様、と呼ばれることには、慣れていた。王、と呼ばれることにも。けれど、名を、聞かれたことは、ほとんどなかった。誰もが、知っていると思っている名だった。", "「ベル、だ」", "少し考えてから、そう答えた。", "「ミナモでは、そう名乗っていた。ベルイザナが、まことの名だが」", "「ベル」", "イサナは、その名を、口の中で、転がすように言った。", "「短くて、呼びやすい名じゃ。……ベルさん、と呼ばせてもらおう。あの若いのと、同じにな」", "老人は、オオナムチのいるほうを、顎で示した。それから、杯を、ベルの杯に、軽く当てた。", "「わしの名を、もう一度、港に呼び戻してくれたのは、あの子じゃ。ベルさん、あんたが、あの子に、呼べと言うたそうじゃな」", "ベルは、何も言えなかった。", "港の、宿の裏庭の井戸を、思い出した。明日、名を呼んでやれ。そう言っただけだった。自分では、呼ばなかった。偽名の膜の内側から、見ていただけだった。", "「……私は、言っただけだ」", "「言うのも、半分じゃ」", "イサナは、笑った。目尻の皺を、くしゃくしゃにして。", "「残りの半分を、あの子がやった。それで、ええ」", "老人は、網の匂いのする手で、ベルの腕を、ぽんと叩いて、卓へ戻っていった。", "ベルは、その背中を、長いこと、見ていた。", "ベルさん、と、呼ばれた。魔王の姿のままで。"]}, {"h": "五", "p": ["オオナムチは、その夜、自分の名を、数えきれないほど、聞かれた。", "「真の勇者殿の、お名前は」", "「オオナムチです。勇者じゃありません」", "「オオナムチ殿」", "「殿も、いりません」", "聞かれるたびに、答えた。答えるたびに、相手の名を、聞いた。", "土蜘蛛の若い女は、アカネといった。鴉族の伝令は、クロハといった。どちらも、知っている名だった。それでも、聞いた。聞いて、呼んだ。", "「アカネさん」", "「オオナムチ」", "アカネは、名を呼び返して、笑った。去年の秋、名を呼ばれなかった頃の顔を、オオナムチは、覚えていた。今は、くっきりと、見えた。", "卓の端で、鬼の若者が、杯を手に、こちらを見ていた。", "去年の収穫祭で、オオナムチに、酒を押しつけてきた若者だった。肩を組まれて、何度も、杯を勧められた。あの夜、オオナムチは、必死に断るのに精一杯で、若者の名を、聞かなかった。三か月後の、同盟の祝いの宴でも、また杯を勧められて、また、聞きそびれた。", "一年、聞きそびれていた。", "オオナムチは、若者の前に、立った。", "「あの」", "若者が、眉を上げた。", "「去年、酒を、勧めてくれましたよね」", "「おう。おまえ、一滴も、飲まなかったな」", "「すみません。それで、その」", "オオナムチは、少し、照れたように、頭をかいた。", "「名前、聞いてなかったです」", "若者は、目を丸くした。", "それから、腹を抱えて、笑い出した。", "「一年もか。一年も、俺の名を知らずに、俺の顔を、覚えてたのか」", "「はい。すみません」", "「謝るな。……トドロキだ」", "「トドロキさん」", "「さん、はいらん」", "トドロキは、杯を、オオナムチの手に、押しつけた。", "「今年こそ、飲め。オオナムチ」", "オオナムチは、杯を見つめた。少し甘く、少し苦い匂いがした。", "それから、一口だけ、飲んだ。", "喉が、焼けた。むせた。トドロキが、背中を叩いて、笑った。周りの鬼たちも、笑った。オオナムチも、むせながら、笑った。", "少し離れた卓で、ハルと、耳の聞こえない嵐狼の子が、並んで、団子を食べていた。二人とも、手で話していた。ハルの手つきは、まだ、ぎこちない。それでも、嵐狼の子は、何度も、うなずいていた。", "ユウが、その後ろに立って、二人を見ていた。", "オオナムチと、目が合った。", "ユウは、何も言わなかった。ただ、昔と同じ、少し下がった目尻で、笑った。", "(元気だよ)", "声には、出さなかった。それでも、聞こえた気がした。"]}, {"h": "六", "p": ["夜が更けたころ、ユズリハは、畦の石の上で、語り始めた。", "最初は、近くの子どもたちが、数人、聞いていただけだった。ハルと、嵐狼の子と、フキと、ヒナ。", "「昔、昔。森の端に、大きな畑があってな」", "声は、かすれていた。けれど、言葉に、迷いがなかった。", "「秋になると、山の神に、火の神に、水の神に、実りを捧げた。エルフも、人も、角のある者も、翼のある者も、同じ畦に並んで、同じ歌を歌った」", "一人、また一人と、大人たちが、近づいてきた。", "鬼の若者たちが、杯を置いて、腰を下ろした。土蜘蛛の女たちが、蒸し籠を抱えたまま、立ち止まった。イサナが、網の結び目を作る手を止めた。タケルが、卓の外れから、一歩だけ、近づいた。", "「祭りの夜には、皆で、互いの名を呼び合った。名を呼ぶのが、いちばんの、もてなしじゃった。知らぬ者がおれば、名を聞いて、呼んだ。そうすれば、もう、知らぬ者ではなくなる」", "ユズリハは、畑を見渡した。", "赤い空の下に、灯りが、満ちていた。その灯りの中で、知らない者同士が、名を呼び合っていた。人間の声と、鬼の声と、エルフの声と、嵐狼の唸るような声が、混ざり合っていた。", "「……今夜の、ようにな」", "ユズリハの目が、濡れていた。", "「最後の夜には、歌を、歌った」", "ユズリハは、目を閉じて、歌い始めた。", "古い言葉の、歌だった。人間の言葉でも、エルフの言葉でもない。もっと古い、森の底の石に刻まれていたのと同じ、祈りの言葉だった。", "節は、素朴だった。何度も、同じところを、繰り返す。山の神よ。火の神よ。水の神よ。名を呼ぶ者の上に、実りを。", "ユズリハの声が、最後の一行の前で、止まった。", "思い出せない、一行だった。", "畑が、静まり返った。", "その時だった。", "畦の向こうから、しわがれた声が、歌の続きを、継いだ。", "スクナだった。", "杖に体を預け、目を閉じて、古い言葉を、歌っていた。ユズリハの知らない、最後の一行を。", "『名を呼ばれた者は、もう、ひとりではない』", "古い言葉だった。けれど、その場にいた誰もが、なぜか、意味が分かった。", "ユズリハが、目を開けた。", "スクナを、長いこと、見ていた。", "「……あんたか」", "かすれた声だった。", "「わしが、小娘だった頃。この歌を、森の祭りで、最後まで歌っておった、薬草籠の、小さな爺さんは」", "スクナは、目を開けて、にやりと笑った。", "「さあのう。爺さんなど、どこにでもおる」", "それから、杖をついて、ゆっくりと、畦の向こうへ歩いていった。芽を、一つも、踏まずに。", "ベルは、その背中を、見ていた。", "聖の森の入口で、初めて会った日を、思い出した。ベルの顔を見て、目を細めた、あの一瞬。魔王の顔を、人の偽名の向こうに、見抜いた目だった。", "いや、見抜いたのではなかったのかもしれない。", "(見覚えが、あったのだ)", "ベルは、自分の顔を、指でなぞった。先代の魔王の頃の、宮の書庫を、思い出した。魔界の古い昔話。皮を剥がれた白い兎。薬を教えた、末の弟の神。その神の隣には、いつも、小さな神が、一人いた。薬と、まじないを司る、手のひらに乗るほど小さな神。", "その神の名は、何といったか。", "ベルは、思い出そうとして、やめた。", "(呼ばれたくないなら、呼ばぬ)", "それも、名を呼ぶ者の、作法だった。", "最初は、ユズリハが、もう一度、歌い始めた。それに、スクナの教えた最後の一行を、子どもたちが、たどたどしく重ねた。鬼の若者たちが、低い声で、加わった。嵐狼の笛吹きが、少し調子の外れた笛を、吹いた。", "歌が、畑じゅうに、広がっていった。"]}, {"h": "七", "p": ["夜更け、オオナムチは、畑の畦に、一人で立っていた。", "祭りの音が、遠くに聞こえる。まだ、誰かが、誰かの名を、呼んでいる。笑い声が、それに応える。", "足音が、背後で止まった。", "振り向かなくても、分かった。", "「ベルさん」", "「ああ」", "ベルが、隣に並んだ。二人とも、何も言わずに、しばらく、灯りの満ちた畑を眺めていた。", "一年前の、この畦を、思い出した。タケルとの戦いの前の夜。ベルが、拳から、血を流していた。見ていると、言った。最後まで、背中を見ていると。", "今夜は、ベルの拳は、開いていた。", "「ベルさん」", "「何だ」", "「ミナモで、初めて、イサナさんの名を呼んだ朝のこと、覚えてますか」", "「覚えている」", "「あのとき、俺、何が起きてるのか、全然、分かってなかったです。ただ、呼んだら、イサナさんの顔が、はっきりした。それだけで」", "オオナムチは、畑を見た。", "イサナが、鬼の若者たちに囲まれて、何か、昔の漁の話をしていた。アサギとトマリが、その両脇で、笑っていた。", "「今も、全部は、分かってないです。でも」", "「でも」", "「呼べば、戻る。それだけは、分かりました」", "ベルは、しばらく、黙っていた。", "それから、静かに言った。", "「私は、王として、長いあいだ、民の名を呼んできた」", "「はい」", "「呼んでいたつもりだった。だが、根の洲で、顔を見ずに、多くを消した。あの兵たちの名を、私は、一つも知らぬ」", "オオナムチは、何も言わなかった。", "「タケルが、あの少女に手紙を届けた。オモイカが、十四の名を語った。今夜、ここに、知らぬ者同士が集まって、名を呼び合っている」", "ベルは、灯りを見ていた。", "「それでも、私が消した者たちの名は、戻らぬ」", "「戻らなくても」", "オオナムチは、言った。", "「探すことは、できます。タケルさんが、そうしてるみたいに」", "ベルが、オオナムチを見た。", "「一人ずつ。時間はかかっても。名前が分かったら、ここで、呼びましょう。来年の、この祭りで」", "ベルの目が、わずかに、揺れた。", "灰色の目だった。紅は、どこにもなかった。", "「……来年も、やるのか」", "「やりましょう。再来年も。その次も」", "オオナムチは、笑った。", "「呼ばなくなったら、終わっちゃうんでしょう。ユズリハさんが、言ってました」", "ベルは、しばらく、何も言わなかった。", "それから、ゆっくりと、口の端を上げた。", "「おまえは、時々、私が言うべきことを、先に言う」", "「よく、言われます」", "「……誰にだ」", "「ベルさんに」", "ベルが、小さく、息を吐いた。笑ったのだと、オオナムチには、分かった。", "「ならば」", "ベルは、手を差し出した。", "「名を探すのも、半分ずつだ」", "オオナムチは、その手を、握った。", "最初の日と、同じ手だった。少し冷たくて、力は、驚くほど加減されていた。", "「半分ずつ、ですね」", "「ああ。半分ずつだ」"]}, {"h": "八", "p": ["夜明け、ハニヤスは、畑に立っていた。", "祭りの卓は、片づけられかけていた。椀が積まれ、樽が転がり、卓の下で、嵐狼の子と人間の子が、並んで眠っていた。その上に、誰かが、鬼の大きな外套を、かけていた。", "ハニヤスは、畦を、一本ずつ、見て回った。", "芽は、一つも、踏まれていなかった。", "人間も、エルフも、ドワーフも、亜人も。昨夜、何百もの足が、この畦を歩いた。それなのに、芽は、一つも、踏まれていなかった。", "誰かが、教えたのだろう。いや、誰も、教えなかったのかもしれない。隣の者が芽をよけて歩くのを見て、自分も、よけた。それだけのことかもしれない。", "ハニヤスは、しゃがんで、畦の芽に、指先で触れた。", "一年前の、王の足を、思い出した。片足を上げたまま、固まった王。すまぬ、気づかなかった、と言った王。", "(気づくようになった)", "王も。民も。人も。", "卓のいちばん奥に、杯が、十四、並んでいた。どの杯も、空になっていた。夜のあいだに、誰かが、一つずつ、飲み干していったのだ。名を、呼びながら。", "ハニヤスは、立ち上がって、鍬を担いだ。", "段々田の向こうで、朝の光が、稲穂を照らしていた。来年の種を取る分を、もう、刈り分けておかなければならない。", "「おう」", "背後で、声がした。", "振り向くと、腰の曲がった岐人の老人が、鍬を担いで、立っていた。ウツホだった。その後ろに、アカネと、土蜘蛛の若い衆と、それから、昨夜、名を覚えたばかりの、人間の若者が何人か。", "「手伝うぞ。来年の、祭りの分じゃろう」", "ハニヤスは、うなずいた。", "「土は、黙っているが、忘れはせん」", "誰に言うでもなく、言った。", "それから、少しだけ、付け足した。", "「人も、もう、忘れまい」", "赤い空の下で、鍬の音が、一つ、また一つと、重なっていった。"]}]}]}, {"name": "名の欠片の二十四人", "note": "名を呼ばれなくなる前の、それぞれの一日。本編・寄り道の章で出会う人たちの、もう少し前の話", "items": [{"label": "イサナ", "title": "十の年の舟", "sections": [{"h": null, "p": ["夜明け前の桟橋は、潮の匂いがいちばん濃い。", "イサナは、舟の縁に腰を下ろして、艫綱の傷みを指で探っていた。細い撚りが一本、擦り切れかけている。今日のうちに替えておかなければならない。指先で撫でるたびに、湿った麻の毛羽が、爪の間に刺さった。", "「イサナ、早いな」", "網元の声が、桟橋の向こうから飛んできた。", "「親方こそ」", "「俺は、年寄りだ。眠れんだけだ」", "網元は笑いながら、薄い茶の入った椀を差し出した。湯気の向こうで、細い目がやわらかく曲がっている。イサナは、椀を受け取った。熱さが、指の節に染みた。", "二人は、並んで、暗い海を見た。水平線のあたりだけが、灰色に、ほどけはじめている。", "「今日から、小僧を乗せるんだろう」", "「ええ。昨日、母親が連れてきました。十になったそうで」", "「名は」", "「トマリ、と」", "網元は、ほう、と声を洩らした。", "「泊まる、か。いい名だ。舟は、帰ってくるものだからな」", "イサナは、何も答えなかった。ただ、茶をひと口すすった。", "(あの子は、母親の顔を、ずっと見ていた)", "昨日の夕方、桟橋に立った子どもの目を、思い出していた。母親が頭を下げているあいだ、少年は、唇を固く結んで、母の袖を、離さなかった。", "母親は、王都へ働きに出るのだと言った。子どもを置いていく、とは、一度も口にしなかった。けれど、それ以外の話では、なかった。", "(舟に乗れば、少しは、気が紛れる)", "そう思って、引き受けた。それだけのことだった。", "日が昇りきる前に、少年が、走ってきた。", "裸足で、袖はまくり上げ、息を切らしている。顔じゅうに、早起きの興奮が貼りついていた。目の縁が赤いのは、気づかないふりをした。", "「おはようございます！ トマリです！ きょうから、よろしくおねがいします！」", "声が大きすぎて、岸の鴎が、一斉に飛んだ。", "「声は、舟の上では小さくていい。魚が逃げる」", "「はい。……あの、どう呼べばいいですか」", "「何を」", "「おじさんのこと」", "イサナは、少し考えた。", "「イサナだ」", "「イサナさん」", "少年は、確かめるように、口の中で転がした。それから、首を振った。", "「長いです」", "「長くない」", "「じゃあ、親方で」", "「俺は、親方じゃない。親方は、あっちの人だ」", "「でも、舟の親方でしょう」", "返す言葉を、見つけられなかった。桟橋の端で、網元が、肩を揺らして笑っていた。", "舟が、桟橋を離れた。", "トマリは、最初の一刻で、三度吐いた。それでも、舷にしがみついたまま、網の綱だけは、一度も離さなかった。", "「手を、見せてみろ」", "「はい」", "差し出された掌は、小さく、柔らかかった。豆ひとつない。", "「こうだ」", "イサナは、少年の手に、綱を巻かせた。親指の付け根に一度、手首に二度。引くときは、腕ではなく、腰で引く。", "「腕じゃ、持たん。海は、人の腕より、ずっと長いからな」", "「はい」", "「分かったか」", "「分かりません」", "「正直で、よろしい」", "少年は、むくれたように、鼻を鳴らした。その横顔が、ほんの少しだけ、笑った。", "昼の少し前、細い鯵が一匹、網の目にかかった。", "少年は、それを、両手で掲げた。", "「イサナさん！ 取れました！」", "「ああ。取れたな」", "「見てください、親方！」", "言い直したことに、少年は、気づいていなかった。", "イサナは、鯵の銀色を見ながら、そっと、口の端を動かした。", "(親方、か)", "悪い気は、しなかった。", "夕方、舟が戻った。", "桟橋では、網元の娘が、籠を抱えて待っていた。十一になったばかりの、よく日に焼けた子だ。", "「イサナさん、おかえりなさい」", "「ああ、アサギ。ただいま」", "名を呼ばれ、名を返した。それだけの、毎日の挨拶だった。イサナは、その音のやわらかさを、深く考えたことが、なかった。", "「その子が、新しい子?」", "アサギが、少年を覗きこんだ。", "「トマリです！」", "「トマリ。私は、アサギ。よろしくね」", "「アサギ、さん」", "「呼び捨てでいいよ」", "「でも」", "「イサナさんは、イサナさん。親方は、親方。でも、私は、アサギ。みんな、名前があるんだから」", "アサギは、当たり前のことのように言った。", "少年は、目を丸くして、それから、小さく、頷いた。", "網を干し終えたあと、桟橋の端で、イサナは、一人で煙管をくゆらせた。", "夕焼けが、海面を、赤く染めていた。舟の影が、長く伸びている。", "(今日一日で、三人に、名を呼ばれた)", "そう思ってから、少し笑った。", "三人。数えるほどのことではないのに、数えてしまった。", "のちに、思う。", "あの桟橋で、名を口にしてくれる者が、まだ、三人いたのだと。網元と、娘と、そして、最初の朝だけ「イサナさん」と呼んでくれた、あの少年が。", "網元は、その冬、床に就いた。", "少年は、舟に慣れるほど、「親方」としか、言わなくなった。", "アサギだけが、変わらず、桟橋の端から、手を振って、呼んでくれた。", "「イサナさん」", "「ああ」", "その一言のために、毎日、舟を出した。", "そんなふうに、思う日が、いつからか、あった。"]}], "id": "meishi_isana", "chars": 1947}, {"label": "アサギ", "title": "網の目の数", "sections": [{"h": null, "p": ["父は、網の目を数えない人だった。", "「数えてどうする。顔を思い浮かべて編め」", "アサギは、網針を持つ手を止めた。網干し場の杭の間には、昨日の漁で破れた網が、三枚ぶら下がっている。夕方までに繕わなければ、明日の舟が出ない。潮風に晒された麻縄が、日の光を受けて、白く乾いていた。", "「顔、って」", "「この網をかける舟の顔だ。イサナの舟なら、イサナの手の癖に合わせて、目を少し詰める。若い連中の舟は、ゆるめに編む。引くとき、手が痛くならんようにな」", "「みんな同じ目じゃ、だめなの」", "「だめじゃない。けれど、網は、使う人を知っているほうが、長持ちする」", "父は、それ以上は言わなかった。無口な人だった。そのかわり、網には、いつも誰かの名を呼びかけるように話しかけた。", "「ほら、イサナの網だ。おまえは、今日も働き者だな」", "アサギは、最初それを笑った。網に話しかける人なんて、見たことがなかった。けれど、父の繕った網は、不思議と、破れにくかった。", "十一になった年の、夏だった。アサギは、父の隣に座って、見よう見まねで、網針を動かしていた。針の先で、糸を掬う。引く。結ぶ。結び目は、いつも少し、いびつになった。", "「いびつでいい」", "父は、ちらりと見て、言った。", "「いびつな結び目は、ほどけにくい。きれいな結び目は、きれいなぶんだけ、滑る」", "「ほんと?」", "「俺の経験だ」", "父は、口の端だけで、笑った。その笑い方が、アサギは好きだった。滅多に見られなかったから。", "昼過ぎ、桟橋のほうが騒がしくなった。", "「触れだ」", "隣の網元の若い衆が、息を切らして走ってきた。", "「王都から、役人が来た。船の数を帳面に付けるそうだ」", "父は、網針を置かなかった。", "「付ければいい」", "役人は、白い腕章をつけた若い男だった。丁寧な物腰で、愛想のいい顔をしていた。桟橋に並んだ舟を、一艘ずつ見て回り、帳面に何かを書きつけていく。小さな、整った字だった。", "「この舟は」", "「イサナの舟だ」", "網元が答えると、役人は、ええ、と頷いた。", "「では、三番、と。次の舟は」", "「トマリの」", "「四番」", "アサギは、網干し場の陰から、それを見ていた。胸の奥が、すっと冷えた。", "(トマリは、まだ、小さな子なのに)", "十になったばかりの少年の舟が、もう、四番になっていた。子どもの名は、帳面の上で、数字に変わった。", "「父さん」", "「聞こえた」", "「番号で……」", "「ああ」", "父は、網針を持ち直した。目を落として、静かに言った。", "「呼びたいやつが、呼べばいい。帳面に何と書かれても、舟の名は、舟に乗る者が決める」", "けれど、その声は、いつもより少しだけ、低かった。", "役人が去ったあと、桟橋に残った舟の艫には、黒い墨で、数字の札が、一枚ずつ打ち付けられていた。波に洗われても消えない、深い墨だった。", "その夜、アサギは、網をすべて繕い終えてから、桟橋へ下りた。", "月が、海を白く照らしていた。舟が、波に揺れている。三番、と墨で記された札が、艫に打たれていた。札の木の匂いが、まだ新しかった。", "アサギは、札の下に、小さく指で字を書いた。誰にも見えない、水の湿り気だけの字だった。", "『イサナ』", "それから、隣の舟に向かって、もう一度。", "『トマリ』", "乾けば、すぐに消える。けれど、書かないよりは、ずっといいと思った。", "(名を呼ぶのは、私がやる)", "誰もやらなくなったら、私が、最後まで。", "そう決めた夜のことを、アサギは、誰にも話さなかった。", "翌朝、桟橋で、イサナの舟を見送った。", "「イサナさん、いってらっしゃい」", "「ああ。行ってくる」", "それだけの会話だった。けれど、舟の上のイサナが、ほんの少し、背筋を伸ばしたように、見えた。", "アサギは、その背中に向かって、いつまでも、手を振っていた。"]}], "id": "meishi_asagi", "chars": 1481}, {"label": "トマリ", "title": "泊まりなさい", "sections": [{"h": null, "p": ["母は、荷造りの手を止めなかった。", "小さな家だった。壁は潮風で白く剥げ、窓の板戸は半分しか閉まらない。その土間に、風呂敷包みがふたつ、並んでいた。ひとつは母の、もうひとつは、トマリの。", "「持っていかないの」", "トマリは、聞いた。十歳だった。", "「あんたの分は、置いていくの」", "母は、顔を上げなかった。", "「王都の仕立て場に、仕事があるんだって。住み込みだから、子どもは連れていけない。イサナさんが、舟に乗せてくれるって言ってくれたから」", "「いやだ」", "「トマリ」", "「行かないで」", "母の手が、止まった。", "その横顔を、トマリは、いまも覚えている。笑っているようにも、泣いているようにも見えた。口元だけが、少し震えていた。針仕事で荒れた指の節が、風呂敷の端を、固く握りしめていた。", "「あんたの父さんは、舟が出た日に、帰ってこなかった」", "母は、ゆっくりと言った。", "「嵐の夜だった。あんたが生まれた晩よ。港じゅうの舟が、どこにも泊まれなくて、波の上で揺れていた。そのとき、私は、思ったの」", "母は、トマリの頬に、手を当てた。ざらついた掌が、あたたかかった。", "「この子は、帰る場所にしよう、って。だから、トマリ。泊まる、の、トマリ。どこへ行っても、舟は、最後に、泊まるの」", "「じゃあ、母さんも、泊まって」", "母は、首を振った。", "「私は、舟じゃないから」", "それ以上は、何も言わなかった。", "夕飯は、いつもより、豪華だった。焼いた鰯と、味噌汁と、白い飯。母は、トマリの茶碗に、山のように、飯をよそった。", "「食べなさい。大きくならなきゃ」", "「母さんは」", "「母さんは、もう、食べた」", "嘘だと、トマリは分かった。母の茶碗は、空のまま、棚に伏せてあった。それでも、何も言わずに、食べた。喉に、飯粒が、いくつも、つかえた。", "その夜、母は、トマリの寝床の隣に、座っていた。灯りを消した部屋の中で、ずっと。寝たふりをしながら、トマリは、母の息の音を、数えていた。数えているうちに、本当に、眠ってしまった。", "翌朝、母は、まだ暗いうちに、家を出た。", "トマリは、戸口に立って、見送った。泣かないと決めていた。泣いたら、母が、足を止めてしまう気がした。", "母は、一度だけ、振り返った。", "「トマリ」", "名を呼ばれた。", "「ここに、いなさい。ここが、あんたの港よ」", "「うん」", "返事は、声にならなかった。母は、手を振って、桟橋とは反対の坂道を登っていった。", "小さな背中が、角を曲がって、見えなくなった。", "トマリは、しばらく、そこに立っていた。", "朝焼けが、港の水面を、赤く染めはじめていた。鴎が、一羽、遠くで鳴いた。", "それから、涙を、袖でぬぐった。", "「……いる」", "誰にも聞こえない声で、言った。", "「ここに、いる」", "それが、トマリが、自分の名前を、自分で言った最初の日だった。", "その日の午後、桟橋に、一人の老いた漁師が、現れた。", "「小僧。舟に、乗るか」", "イサナだった。", "トマリは、頷いた。声は、まだ、出なかった。", "その名を呼んでくれる人は、あの日から、少しずつ、減っていった。", "港の者は、トマリを、「小僧」と呼んだ。それがやがて、「荷運び」になり、「おい」になった。", "そのたびに、トマリは、胸の中で、母の声を、そっと繰り返した。", "(トマリ。ここに、いなさい)", "そうして、十年近く、その港に、泊まり続けた。"]}], "id": "meishi_tomari", "chars": 1316}, {"label": "ノギク", "title": "裾の名", "sections": [{"h": null, "p": ["機の音が、止むことはなかった。", "ひなた野の外れにある、ノギクの家では、朝から晩まで、経糸の張る音がした。", "とん、からり。とん、からり。", "筬を打つ手は、迷わなかった。両手が、勝手に覚えている。三十年、同じ動きを繰り返してきた。窓から差しこむ光の中で、糸の埃が、ゆっくりと舞っていた。", "ノギクが織るのは、野良着の布が多かった。丈夫で、洗うほど柔らかくなる、灰色がかった布だ。染めはしない。糸のままの、野の色。", "そして、その布の裾の内側には、必ず、小さな刺繍が入っていた。", "注文した人の、名前だった。", "「そんなところに縫って、誰が見るんだい」", "幼いころ、同じ集落の子に言われたことがある。ノギクは、答えた。", "「見えないところに、名前があるのが、いいのよ」", "「どうして」", "「着ている人が、ふっと、思い出せるから。自分の名前が、ここにあるって」", "その子は、首を傾げた。けれど、今では、その子の孫が、ノギクの布を着ている。", "その日の午後、ひなた野の小道を、白い腕章をつけた男が歩いてきた。", "背が高く、顔立ちが整っていた。柔らかな笑みを浮かべている。靴の底に、一粒の泥もついていなかった。", "「失礼します。機織りのノギクさんですね」", "「ええ」", "「王都から参りました。布の買い上げです」", "男は、懐から帳面を出した。", "「ひなた野の布を、王都の布問屋に、まとめて納めていただきたい。値は、これまでの倍。ただし、ひとつだけ、お願いが」", "ノギクは、手を止めなかった。", "「裾の刺繍は、やめていただけませんか」", "筬が、止まった。", "「王都の問屋は、同じ品を同じ形で並べたいのです。個別の名は、仕分けの邪魔になる」", "男は、あくまで丁寧だった。", "「みなさんのためです。こんな田舎の布が、王都の店頭に並ぶのですよ」", "ノギクは、しばらく、男の顔を見ていた。腕章は、白く、きれいだった。きれいすぎて、少し、気味が悪かった。", "「考えます」", "「ええ。ゆっくり、どうぞ」", "男が去ったあと、ノギクは、機の前に座り直した。", "縁に、小さなフキが、ちょこんと座っている。母の仕事を見るのが好きな、隣家の子だ。", "「ノギクばあちゃん、あの人、だれ」", "「お客さんよ」", "「いやな顔してた」", "「そう。そう見えたの」", "ノギクは、糸を、通した。", "とん、からり。", "それから、針を取った。灰色の布の裾の内側に、赤い糸で、最後の一目を刺した。", "フキの名だった。まだ誰にも渡していない、小さな上着の裾に。", "「ほら。ここ」", "「なあに」", "「あなたの名前よ。ここにあるの」", "フキは、目を丸くして、裾を覗きこんだ。赤い糸の、ちいさな三つの字。", "「ほんとだ」", "「これで、いつでも、思い出せる」", "「なんにも、忘れてないよ」", "「そうね」", "ノギクは、笑った。針を持つ指の先が、少しだけ、震えていた。", "その夜、返事を決めた。布は、納める。けれど、裾の刺繍は、やめない。", "ひなた野の者が、何を着ていても、その裾の内側には、その人の名がある。誰が来ても、誰が何と言っても。それだけは、譲らない。", "それでも、ひとつ、気づいたことがある。", "王都へ納めた布は、のちに、裾の名を、一枚ずつ、鋏で切り落とされて、店に並んだのだった。", "それを知る日まで、ノギクは、自分の名前を呼ぶ人が、年ごとに減っていくことにも、まだ気づいていなかった。"]}], "id": "meishi_nogiku", "chars": 1311}, {"label": "フキ", "title": "かくれんぼの数", "sections": [{"h": null, "p": ["フキは、数を数えるのが得意だった。", "「いーち、にーい、さーん……」", "大きな声で、柿の木に顔をつけて数える。目は、固く閉じている。隠れる子たちが、笑いながら走っていく足音が、土を叩いた。木の幹は、日向の匂いがした。", "「十！ もういいかい」", "「まあだだよ！」", "遠くで、声が返る。フキは、また数え直した。", "「いーち、にーい……」", "こうして、いつも最初から数え直すのが、フキの癖だった。", "ひなた野の子は、五人いた。フキが最年少で、いちばん上は、ばあちゃんの孫の、ゲンタだった。ゲンタは、十一。足が速くて、隠れるのが、下手だった。", "「もう、いいよ！」", "今度は、声が揃った。", "フキは、目を開けた。そして、探しに行った。", "柿の木の裏。いない。井戸の陰。いない。ノギクばあちゃんの機の下。いない。", "(ここ、前も、探した)", "ひとつずつ、思い出しながら、確かめる。", "そのうち、麦束の向こうから、小さな足が、はみ出しているのが見えた。", "「見つけた！ ゲンタ！」", "「ちぇっ」", "ゲンタが、頭をかいて出てきた。藁くずが、髪に、いくつも付いていた。", "「フキは、探すのうまいなあ」", "「だって、名前、ぜんぶ、おぼえてるもん」", "フキは、胸を張った。", "「ゲンタ。ハナ。キチ。ミツ。みんな、いる」", "「ふーん」", "「いなくなっても、おぼえてるよ」", "ゲンタは、へんな顔をした。", "「いなくならないよ」", "「うん。わかってる」", "それでも、フキは、胸のなかで、もう一度、数えた。", "いち、にい、さん、よん、ご。", "五人。", "次は、ハナが鬼になった。フキは、井戸の陰に隠れた。冷たい石の匂いが、鼻に入った。膝を抱えて、息を殺した。遠くで、ハナの数える声が、ゆっくり、ゆっくり、近づいてくる。", "(見つからなかったら、どうしよう)", "そんな考えが、ふと、浮かんだ。見つけてもらえないまま、日が暮れる。みんなが、いなくなって、一人で、井戸の陰に残る。", "「フキ、みーつけた！」", "ハナの声が、頭の上から降ってきた。", "「あ……」", "見つかった。ほっとして、涙が、ちょっとだけ、出た。", "「なんで泣くの」", "「泣いてない」", "「泣いてるよ」", "「泣いてないってば」", "笑い声が、ひなた野の空に、広がった。", "その夕方、ひなた野の道を、荷車がゆっくり走ってきた。", "荷台には、白い腕章をした男たちが、座っていた。", "荷車は、ゲンタの家の前で、止まった。", "翌朝、フキは、いつものように、柿の木の下に立った。", "「いーち、にーい、さーん」", "数えていたら、声が、だんだん、小さくなった。", "誰も、走っていかなかった。", "「……ゲンタ？」", "返事は、なかった。", "フキは、目を開けた。", "柿の木の下に、フキ一人が立っていた。", "それから、毎朝、フキは、柿の木の下で、一人、数えた。", "「いち、にい、さん、よん」", "ひとつ数が、足りない。ふたつ、足りない。", "そのうち、三つ、足りなくなった。", "それでも、数えることだけは、やめなかった。", "名前を、忘れないために。", "自分の名前も、数のなかに、ちゃんと、入れて。"]}], "id": "meishi_fuki", "chars": 1180}, {"label": "タネ", "title": "豆の畝", "sections": [{"h": null, "p": ["腰が曲がったのは、いつからか。", "タネは、もう思い出せなかった。畑に立てば、まっすぐ前を向くより、土を見る時間のほうが長い。曲がった背中は、もう、土と話をするための形だった。", "朝露が、畝の上の草を、きらきらと濡らしていた。鍬の刃が、湿った土に、ずぶりと入る。返された土の匂いが、鼻の奥に上ってきた。", "「爺さま、そこは、まだ早い」", "隣の畑から、若い者の声がした。", "「いや。もう、蒔ける」", "「霜が」", "「豆は、霜をいやがらん。豆は、冷たい土の中で、ちゃんと、待つ」", "若い者は、肩をすくめた。", "タネは、畝の端に膝をついた。懐から、小さな布袋を取り出す。中には、乾いた豆が、手のひらいっぱいほど入っていた。", "ひなた野の豆。祖父の祖父の代から、毎年、種を取っては、蒔いてきた。袋の布は、何十年も使いこまれて、すっかり柔らかくなっている。", "(いち、にい、さん)", "一粒ずつ、指で、土に埋めていく。深さは、指の第一関節。間は、親指の長さ。誰に教わったのでもない。手が、覚えている。", "名前の由来は、よく知っていた。タネ、という名は、生まれたとき、家の畑がちょうど、種まきの季節だったから。", "「種のように、強く育て」", "祖母が、そう言って付けたのだと、聞いた。", "昼になって、ノギクが、握り飯を持ってきてくれた。", "「タネさん。休んで」", "「おお、ノギクか」", "「ええ。フキも、一緒」", "小さなフキが、ノギクの裾の後ろから、ひょこっと顔を出した。", "「タネじいちゃん、こんにちは」", "「おお、こんにちは。豆、見るか」", "「みる！」", "タネは、袋を開けて、フキの手に、一粒だけ、置いた。", "「これが、豆」", "「かたいね」", "「かたいうちは、まだ、眠っとる。土に入ると、水を飲んで、起きる」", "「いつ、起きるの」", "「春じゃ」", "フキは、豆を、じっと見つめた。", "「じゃあ、春まで、まってるんだ」", "「そうじゃ。待つのも、仕事のうちじゃ」", "その言葉に、ノギクが、少しだけ笑った。", "握り飯を食べながら、三人で、畑を眺めた。遠くで、ひなた野の子どもたちの声がしていた。柿の木の方角から、「いーち、にーい」と、数える声が、風に乗って届いた。", "「いい声じゃのう」", "「ええ」", "「ああいう声が聞こえるうちは、この野は、まだ、大丈夫じゃ」", "ノギクは、答えなかった。ただ、握り飯の最後のひと口を、ゆっくり噛んだ。", "夕方、タネが畑を終えようとしたとき、道の向こうから、白い腕章の男が、ゆっくり歩いてきた。", "「おじいさん。この畑は、いつから」", "「祖父の祖父から」", "「そうですか。……王都では、畑の登録を、改めて行うことになりまして」", "「登録」", "「ええ。作物の種類と、収穫の量を、すべて、王都へ届けていただく。それから、種は、王都の種蔵のものを、使っていただく。品質が、そろいますので」", "タネは、黙って、聞いていた。", "男の言葉は、最後まで、親切だった。", "「……ひなた野の豆は、どうなる」", "「古い種は、順に、置き換えていきます」", "「そうか」", "タネは、袋を、懐へしまった。布越しに、豆の粒の形が、掌に伝わった。", "その日から、豆を、毎年、少しずつ、隠して蒔くことにした。", "誰にも言わず、畑の隅に。納屋の裏に。井戸のそばの、日陰の土に。", "タネという名を、この世で呼ぶ者が、いなくなっても。", "蒔いた豆だけは、春になれば、きっと、土の中で、目を覚ます。", "タネは、そう信じて、また、膝をついた。"]}], "id": "meishi_tane", "chars": 1342}, {"label": "ツユクサ", "title": "朝露の籠", "sections": [{"h": null, "p": ["朝露が乾く前の、ほんのわずかな間だけ、効く草がある。", "ツユクサは、まだ暗い森の道を、籠を背負って歩いていた。足音を立てないのは、癖だ。木の根のうねりを、一本ずつ避けて進む。森は、急ぐ者を嫌う。苔の匂いと、湿った土の匂いが、肺の奥まで染みてくる。", "(ここ)", "倒木の陰に、小さな青い花が、一面に咲いていた。", "しゃがみこんで、指先で、そっと茎を挟む。折らずに、根元から切る。切り口から、冷たい露が、手の甲に滴った。", "「おはよう」", "草に向かって、小さく言った。", "母が、そうしていた。摘む前に、必ず、挨拶をする。", "「名前を呼んでから採ると、薬の効き目がちがう」", "母は、そう言った。", "「どうして」", "「草が、機嫌をよくするから」", "それが本当かどうか、ツユクサは、いまでも分からない。けれど、母の摘んだ薬は、たしかに、よく効いた。", "籠がいっぱいになったころ、東の空が、白んだ。木々の隙間から、金色の光が、斜めに差しこんでくる。光の筋の中を、細かな埃と虫の羽が、きらきらと舞っていた。", "森の集落へ戻ると、軒先で、老いた女が、洗い物をしていた。", "「ツユクサ。精が出るねえ」", "「おはよう、おばさま」", "「今日は、何が採れた」", "「露草と、ドクダミと、少しの山椒」", "「そりゃあいい。うちの孫の熱に、ちょうどいい」", "老婆は、手を拭いて、籠を覗きこんだ。", "こうして、朝ごとに、名前を呼んでくれる人が、集落には、五人いた。", "昼、薬草を干しながら、ツユクサは、ふと、思った。", "(最近、森の者は、あまり、話さない)", "数年前までは、夕方になると、広場に誰かが集まって、他愛のない話をしていたのに。薬草を干す縄の下で、笑い声が、聞こえていたのに。", "王の使者が、森に来るようになってからだ。中立でいよう、と、集落の長は言った。誰にも味方せず、誰とも争わず。", "その言葉は、正しいと思った。", "けれど、中立を守るために、森の者は、少しずつ、互いの名を呼ばなくなっていった。", "(名を呼べば、誰かを、味方にしてしまうから)", "そう言ったのは、誰だったか。", "夕方、籠を空にして、母の墓の前に座った。", "石の上の苔に、露が、また、ひとつ降りていた。苔の緑は、夕日に透けて、金色に見えた。", "「母さん」", "呼びかけてみる。", "「ツユクサは、まだ、朝露を、採ってるよ」", "風が、枝を鳴らした。", "誰も答えない。それでよかった。", "ここで、ここの草に向かって名を呼ぶのは、自分の役目のような気がしていた。", "(誰かが、呼ばなくなっても)", "(草は、まだ、機嫌よく咲くから)", "そう思ったとき、ふと、ツユクサは、気づいた。", "草に挨拶をするとき、自分は、自分の名を、誰にも名乗っていない。", "その日から、朝露の中で、ひとり、「ツユクサです」と、小さく声に出した。", "その声を、森が、聞いていたのかどうか。", "ツユクサは、そのうち、だんだんと、声に出さなくなった。"]}], "id": "meishi_tsuyukusa", "chars": 1139}, {"label": "シイ", "title": "見えるもの", "sections": [{"h": null, "p": ["弓は、見ることから始まる。", "シイは、岩の上で、膝を立てて座っていた。矢筒を背負い、弓を横にして、森の入口を見ていた。", "見張り、と呼ばれる仕事だった。森に入る者を、見る。出ていく者を、見る。それだけでいい。", "「シイ、交代だ」", "声がして、同じ年頃のエルフが、岩の下に立った。", "「ああ」", "シイは、立ち上がった。膝の関節が、小さく鳴った。", "「何か、見えたか」", "「獣が二匹。鹿と、狐。それから、道の外れを、旅の人が一人」", "「人間か」", "「ええ」", "「通したか」", "「通した。何もしていない。道の端を、歩いていただけ」", "交代の男は、それ以上聞かなかった。シイも、それ以上は言わなかった。", "見たことを、見たままに話す。それが、見張りの決まりだった。", "森の者は、見張りを、重んじた。弓の腕は、森で一番だと、誰もが言っていた。", "「シイが射れば、外れない」", "そう言う者も、いた。", "けれど、その日、シイは、一本も射らなかった。", "その日だけではない。もう、何年も、実際に矢を放ったことはなかった。", "(見えるものを、全部、射てはいけない)", "見張りになった最初の日に、師に教わったことだ。", "「見えるものと、射つものは、違う。射つのは、必要なものだけだ。必要かどうかを決めるのは、おまえの目じゃない。おまえの、心だ」", "その言葉の意味を、若いころは、分からなかった。", "いまは、少しだけ、分かる。", "見えるものが増えるほど、射てないものも、増えていく。", "道端の旅人。迷い込んだ獣。国境を越えようとする、貧しい家族。", "そのすべてを、ただ、見ていた。", "夕方、集落へ戻ると、広場の隅で、子どもが泣いていた。", "「どうしたの」", "「ころんだ」", "シイは、しゃがんで、膝を見た。擦り傷だった。", "「痛いか」", "「いたい」", "「じゃあ、泣いていい」", "子どもは、びっくりした顔をした。それから、もっと大きな声で、泣いた。", "シイは、黙って、傷の泥を払ってやった。", "通りかかった女が、立ち止まった。", "「シイ」", "「何」", "「ありがとう」", "「別に」", "シイは、立ち上がって、森の入口の岩へ、また戻った。", "背中に、名前を呼ばれた感触が、ほんの少しだけ、残っていた。", "(……悪くない)", "けれど、その夜、気づいた。", "今日、この集落で、名前を呼ばれたのは、あの一度きりだった。", "そして、自分は、誰の名も、呼んでいなかった。", "見るだけで、呼ばなかった。それが、自分の、見張りだった。", "シイは、弓を膝に置いて、闇の中の森を、見続けた。"]}], "id": "meishi_shii", "chars": 972}, {"label": "ユズリハ", "title": "火の前の話", "sections": [{"h": null, "p": ["囲炉裏に、新しい薪が、くべられた。", "ぱち、と、火の粉が散った。広間じゅうの子どもたちが、一斉に身を乗り出した。", "「ユズリハ婆さま、続きを」", "「せっかちな子らじゃのう」", "ユズリハは、膝の上の紙の束を、ゆっくりと撫でた。古い紙だった。端はもう、墨のように黒ずみ、触れるだけで崩れそうだった。", "「どこまで、話したかの」", "「大きな蜘蛛が、森の底の石を、守っているところ」", "「そうじゃ」", "ユズリハは、目を閉じた。", "話は、紙に書いてあるのではない。紙は、思い出すための、杖のようなものだった。", "「昔々、この森に、まだ、人間も、獣も、エルフも、境なく暮らしていた頃」", "声は、低く、よく通った。", "「森の底に、ひとつの石があった。名前を刻んだ石じゃ。森に生まれたものは、みな、生まれたとき、その石に、名を書いてもらう」", "子どもたちは、息をひそめた。", "「そして、名を呼ばれるたびに、石は、すこしずつ、光る」", "「光らなかったら」", "小さな声が、尋ねた。", "「光らなかったら、どうなるの」", "ユズリハは、目を開けた。", "「そうじゃな。……光らなくなった石は、森の底の、暗い穴に、沈んでいくのじゃ」", "「こわい」", "「こわいの」", "ユズリハは、微笑んだ。", "「じゃから、名前を、呼びなさい。友達の名を。親の名を。通りすがりの人でもよい。呼ばれた名は、石の中で、ちゃんと、灯りになる」", "「わかった」", "子どもたちは、一斉に、頷いた。", "話は、夜更けまで続いた。", "火が小さくなる頃、子どもたちは、ひとり、またひとり、眠りに落ちた。", "ユズリハは、そっと毛布をかけていった。", "最後の子の頬に、手を添えた。", "「おやすみ。ハギ」", "名を呼ぶと、その子は、眠ったまま、少しだけ笑った。", "広間が、静かになった。", "囲炉裏の火が、ぱちぱちと小さな音を立てていた。", "(この話を、あと何年、できるじゃろうか)", "ユズリハは、紙の束を、胸に抱いた。", "この森では、近ごろ、子どもたちの数が、減っていた。若い者は、王都へ出ていった。残った者は、年寄りばかりだ。", "話を聞いてくれる者が、いなくなったら。", "名前を、呼ぶ者が、いなくなったら。", "(森の底の石は、どうなるのじゃろう)", "その夜、ユズリハは、紙の束を、囲炉裏の端に置いたまま、少しだけ、うとうとした。", "目を覚ましたとき、紙の端が、火に触れていた。", "慌てて引き寄せたが、遅かった。", "茶色く焼けた端が、はらはらと崩れ、字が、ひとつ、またひとつ、読めなくなっていく。", "「……ああ」", "ユズリハは、焼け残った紙を、ぎゅっと、抱きしめた。", "それから、小さく、声を出して、話の続きを、静かに、暗唱しはじめた。", "もう、聞く者は、誰もいなかった。", "けれど、話は、まだ、頭の中に、残っていた。", "名前が消えても、話さえ残っていれば、いつか。", "ユズリハは、そう信じて、朝まで、語り続けた。"]}], "id": "meishi_yuzuriha", "chars": 1119}, {"label": "ハガネ", "title": "打つ音", "sections": [{"h": null, "p": ["槌の音には、人それぞれの癖がある。", "ハガネの槌は、重く、そして、遅い。ひと打ち、ひと打ち、間を置く。急がない。刃は、急がせると、割れる。", "「ハガネさん、またかい」", "炉の向こうから、鉱山の事務役の男が、顔を出した。", "「また、って」", "「王都からの納めだよ。鉄の量が、今月から、倍になった」", "ハガネは、槌を止めなかった。", "「倍」", "「ああ。村じゅうの鍛冶屋に、触れが出てる。一日、二十本の剣。決まった形、決まった長さ」", "「何に使うんだ」", "「さあね。軍だろう」", "ハガネは、焼けた鉄を、水に入れた。ジュッ、と、白い湯気が上がった。", "「断る」", "「え」", "「断る、と言った」", "男は、青ざめた。", "「ハガネさん。それは、まずい」", "「まずいかどうかは、俺が決める」", "ハガネは、焼き入れた刃を、片手に持ち上げた。", "「俺の剣は、人を切るために打ってるんじゃない。鍬と、鎌と、斧と、鍋。村の人間が使う、道具を打ってる。軍の剣は、他の連中に頼め」", "「でも」", "「話は、終わりだ」", "その日の夕方、ハガネの鍛冶場の戸を、誰かが、そっと叩いた。", "開けると、小さな女の子が、立っていた。", "「あのね。ハガネのおじちゃん」", "「おう」", "「あたしの、ナイフ、なおして」", "差し出された、小さな手には、刃が欠けた、小刀が握られていた。", "「どうした、これ」", "「木の枝、切ってたら、折れちゃった」", "ハガネは、膝をついて、小刀を受け取った。子どもの手にちょうどいい、小さな刃だった。", "「ここで、待ってな」", "火を起こし、刃を炙り、槌で形を整えた。小さな音が、鍛冶場に、ころころと響いた。", "「できたぞ」", "「ありがとう！」", "女の子は、小刀を、胸にぎゅっと抱いた。", "「おじちゃんの、名前は？」", "「ハガネだ」", "「ハガネのおじちゃん。ありがとう」", "そう言って、手を振って、駆けて行った。", "その背中を見送りながら、ハガネは、ふっと、笑った。", "(これでいい)", "槌を、置いた。", "ハガネは、その夜、鍛冶場の窓を、内側から閉めた。", "翌朝から、王都の役人が、毎日来た。", "炉を止めろ、と言われた。道具を取り上げられた。名簿から、名前が、線で消された。", "それでも、ハガネは、一度も、剣を打たなかった。", "名を呼ぶ者が、いなくなっても。", "最後に打った小さな小刀の音だけは、ずっと、耳の奥に、残っていた。"]}], "id": "meishi_hagane", "chars": 907}, {"label": "スミ", "title": "炭の灯り", "sections": [{"h": null, "p": ["炭焼き小屋の夜は、静かだ。", "窯の火を絶やさぬよう、スミは、一晩じゅう、起きている。煙の匂いが、髪にも服にも、染みついた。十年前から、変わらない夜だった。", "(今日は、少し、湿ってる)", "薪の割れ目から、白い煙が漏れていた。スミは、窯の口に、灰を少し足した。", "コン、コン。", "戸を叩く音がした。", "「スミさん」", "低い女の声だった。戸を開けると、肩に襤褸の布をかけた、中年の女が立っていた。", "「どうした、こんな夜更けに」", "「頼みがあって」", "女は、懐から、折りたたんだ紙を取り出した。", "「息子に、手紙を、書いてやりたいんです。王都の鉱山へ、連れて行かれた子に」", "「字は」", "「……書けません」", "スミは、黙って、女を小屋に入れた。", "窯の火の前に、女を座らせた。膝の上に、板を置いて、紙を広げた。筆は、炭の棒を削ったもの。墨がわりに、水に溶いた炭の粉を使う。", "「なんて、書く」", "「元気か、と」", "「それだけか」", "「ご飯は、食べているか。寒くは、ないか。……母さんは、元気だ、と」", "スミは、ゆっくり、一文字ずつ、書いていった。", "炭で書いた文字は、黒く、細く、線が揺れた。", "「それから」", "「それから」", "女は、言葉に詰まった。長い沈黙のあと、小さな声で、言った。", "「……帰ってきても、いいんだよ、と」", "スミの手が、止まった。", "「それは」", "「書いてください」", "「でも、帰ってこいと書いたら、役人に」", "「いいんです」", "女は、顔を上げた。", "「いいんです。それが、母親の、言いたいことですから」", "スミは、うなずいた。", "灯りをつけなかったのは、役人に、見られないためだった。窯の火だけを頼りに、揺れる文字を、続けた。", "『帰ってきても、いいんだよ』", "最後の一文を書き終えたとき、女は、深く、頭を下げた。", "「ありがとう、スミさん」", "「いや」", "「名前を、教えてくださいますか。手紙の端に、書いておきたいんです。誰が、代筆したのか」", "スミは、首を振った。", "「いい。書かないでくれ」", "「でも」", "「名が残ると、あんたに、迷惑がかかる」", "女は、しばらく、スミを見ていた。それから、紙を、胸に抱いた。", "「それでも、私は、覚えています」", "「ああ」", "「スミさん」", "「ああ」", "夜が明けるまで、窯の火は、静かに燃えた。", "その手紙が、息子に届いたのかどうか、スミは、知らない。", "ただ、数日後、村の名簿から、自分の名前が、線で消されているのを見た。", "それでも、手は、まだ、炭の黒さを、覚えていた。"]}], "id": "meishi_sumi", "chars": 963}, {"label": "タタラ", "title": "炉の守りの弟子", "sections": [{"h": null, "p": ["炉の火は、息をする。", "タタラは、風箱の前に座って、ふいごの柄を握っていた。踏み板に足をかけ、ゆっくり、踏む。炉の中の炭が、赤い息を、吐いた。", "「強すぎる」", "背後から、低い声がした。", "「へい」", "「火は、急ぐな。炉は、生きもんだ」", "「へい、親方」", "タタラは、足の力を、少しだけ緩めた。", "炉番の親方は、無口な人だった。背が高く、肩が盛り上がり、顔には、若いころの火傷の跡があった。タタラは、十二のときから、この人の弟子だ。", "「おまえの名前は、誰が付けた」", "不意に、親方が、聞いた。", "「え、えっと」", "「誰が付けた」", "「親方です」", "「覚えてたか」", "「そりゃ、覚えてますよ」", "タタラは、笑った。", "六年前の、冬の朝だった。", "痩せた、身寄りのない子どもを、炉番が拾って、炉の前に座らせた。", "「ここで、火を見ていろ。名は」", "「ない」", "「ない、か」", "親方は、しばらく、炉の中を眺めていた。それから、短く言った。", "「タタラだ」", "「タタラ」", "「炉の、名だ。鉄を溶かして、鍛冶に渡す。そういう仕事の名だ。おまえは、ここで、火を渡せ」", "その日から、タタラは、タタラになった。", "「親方」", "「何だ」", "「あの、今日、納めの量が、また増えたって」", "親方の手が、ぴたりと、止まった。", "「誰に聞いた」", "「ハガネさんが」", "「あいつは、口が軽い」", "「でも、本当なんでしょう」", "親方は、答えなかった。しばらく、炉の火を見ていた。", "「タタラ。俺はな、この炉の火を、人殺しの道具のために焚いたことは、一度もない」", "「はい」", "「だから、これからも、そうする」", "「はい」", "「おまえも、それを、守れ」", "タタラは、返事ができなかった。", "親方が、何かを、覚悟しているのが、分かった。", "その夜、タタラは、一人で炉の前に座っていた。", "親方は、役人に呼ばれて、出かけたきり、戻らなかった。", "火は、まだ、燃えていた。", "タタラは、炉の前で、小さく、自分に言い聞かせた。", "「俺は、タタラだ」", "「炉の、火を、渡す者だ」", "その声は、誰にも聞こえなかった。", "火が、赤く、膨らんでは、縮んでいた。", "タタラは、そのまま、朝まで、ふいごを踏み続けた。"]}], "id": "meishi_tatara", "chars": 832}, {"label": "ススキ", "title": "見張りの朝", "sections": [{"h": null, "p": ["見張り台の朝は、風から始まる。", "ススキは、梯子を登りきって、床板に足をかけた。獣ノ原を渡ってきた風が、顔に当たった。冷たく、草の匂いがした。", "「おはよう」", "台の隅に、毛布にくるまった年寄りがいた。夜番の男だった。", "「おはよう、ススキ」", "「何か、ありましたか」", "「何もなかった。狐が一匹、井戸のそばを通ったくらいだ」", "「そうですか」", "「交代だ。ゆっくり、見てくれ」", "老人は、毛布をたたんで、梯子を下りていった。", "ススキは、見張り台の縁に、手をかけた。", "葛の里は、獣ノ原の端にある。里の周りは、背の高い草に囲まれていて、その向こうに、地平線が見えた。晴れた日は、遠くの山の稜線まで、見える。", "(今日は、遠くまで、見える)", "目を細めて、東の空を見渡した。", "「ススキにいちゃん！」", "下から、子どもの声が、飛んできた。", "見下ろすと、小さな獣耳の子が、梯子の下から、大きく手を振っていた。", "「おはよう、ナズナ婆の孫か」", "「そう！ 朝ごはん、おばあちゃんが、持っていけって！」", "「ありがとう。そこに置いておいてくれ」", "「いやだ！ 上まで、持っていく！」", "「危ないから、だめだ」", "「だいじょうぶ！」", "子どもは、籠を背負ったまま、梯子に足をかけた。ススキは、慌てて下りて、籠を受け取った。", "「ほら、落ちるぞ」", "「ススキにいちゃん、ありがとう」", "「どういたしまして」", "子どもは、笑って、走っていった。", "ススキは、籠の布を開いた。中には、麦の焼き餅と、干した果物が、入っていた。", "(ナズナさんの餅は、いつも、うまい)", "それを、見張り台の隅で、ゆっくりかじった。", "昼を過ぎると、里の者が、台の下を、何人も通った。みんな、ススキに向かって、手を挙げた。", "「見張り、今日も頼むぞ」", "「おう」", "「異常はないか」", "「ありません」", "誰も、名前では呼ばなかった。", "見張り。里の者にとって、それが、ススキの名前のようなものだった。ススキ、という音を、口にする者は、子どもたちくらいしか、いなかった。", "(別に、いい)", "見張りは、里のみんなを、守る仕事だ。誰が、何と呼ぼうと、同じことだ。", "そう、思っていた。", "けれど、夕方、日が落ちかけたころ、里の外れに、人影が見えた。", "人間だった。三人。荷車を引いて、ゆっくり、近づいてきた。", "ススキは、台の上から、声を張った。", "「止まれ。何の用だ」", "返事は、なかった。", "荷車の上に、白い腕章の男が、立ち上がった。", "「王都の使いだ。里の者に、話がある」", "ススキは、半歩、後ろに下がった。", "それから、台の下へ、叫んだ。", "「誰か！ 長を、呼べ！」", "その夜の騒ぎのあと、里の者は、二度と、ススキを、名前では呼ばなかった。", "「見張り」", "「おい、見張り」", "それが、いつの間にか、ただの、役目の名前になった。", "ススキは、台の上で、星を数えた。", "自分の名を、星に向かって、小さく、呟いた。", "「ススキ」", "風が、草を鳴らした。それは、まるで、返事のようだった。"]}], "id": "meishi_susuki", "chars": 1160}, {"label": "ナズナ", "title": "井戸の縄", "sections": [{"h": null, "p": ["井戸の縄は、毎朝、手で触って、確かめる。", "ナズナは、石の縁に膝をついて、縄の撚りを、指でなぞった。太さも、固さも、昨日と変わらない。それでも、父に、そう教わった。", "「井戸番は、縄を疑う。縄が切れたら、水が止まる」", "父の、そのまた父の代から、ナズナの家が、守ってきた井戸だった。", "釣瓶を落とす。ごと、と、遠く水面に当たる音がした。しばらく置いて、手繰り上げる。重い。冷たい水が、桶いっぱいに、満ちていた。", "「おはよう、ナズナ婆」", "最初に来たのは、里の織り手の子だった。", "「おはよう。今日は、早いね」", "「母さんが、洗い物、したいんだって」", "「ほう。じゃあ、先に」", "桶を、持たせてやる。小さな足が、ふらつきながら、坂を登っていく。", "ナズナは、縄を握り直した。", "朝いちばんに来る者の顔で、一日の天気が、分かる。昼に来る者の声で、里の機嫌が、分かる。夕方に来る者の足取りで、誰が疲れているか、分かる。", "(井戸は、里の、耳みたいなもんじゃ)", "そう思っていた。", "「ナズナ婆、ほら、これ」", "昼過ぎ、見張りのススキが、鳥の羽を、一枚、持ってきた。", "「なんじゃ」", "「風切り羽。見つけたから。井戸のところに、挿しておいたら、いいかなって」", "「ほう。きれいじゃのう」", "「でしょう」", "ススキは、照れたように、笑った。", "「ありがとうな」", "その日の夕方、里の外に、人間の一団が、現れた。", "白い腕章をつけた、男たちだった。", "最初は、ただ、立っていただけだった。", "「水を、分けてほしい」", "先頭の男が、そう言った。ナズナは、井戸の縁に立って、答えた。", "「いくらでも。飲んでおいき」", "人間も、獣人も、水は水じゃ、と、思っていた。", "男たちは、順番に、桶を受け取った。", "水を飲んだ。顔を洗った。それから、最後の男が、桶を、地面に叩きつけた。", "「獣の水は、飲めん」", "「……何を」", "「汚れている」", "ナズナは、動けなかった。男は、足元の石を、拾い上げた。", "石が、井戸に、投げ込まれた。", "ごと、と、水面に当たる音がした。続いて、泥が、投げ込まれた。さらに、石。もうひとつ。", "「やめて」", "ナズナは、縁にしがみついた。", "「やめてくれ。ここは、わしの家の、井戸じゃ」", "「獣の井戸は、要らん」", "石が、肩に当たった。額に当たった。血が、目に入った。", "それでも、ナズナは、縁を離さなかった。", "夜になって、男たちが去ったあと、ナズナは、井戸の縁に、ひとり、座っていた。", "水は、泥で、濁っていた。縄も、ほどけて、切れかけていた。", "「ナズナ婆」", "小さな声がした。昼間の、織り手の子だった。", "「だいじょうぶ？」", "「だいじょうぶじゃ。ありがとう」", "「ナズナ婆、って、呼んでいい？」", "「ああ」", "「ナズナ婆」", "「ああ。なんじゃ」", "「……なんでもない」", "子どもは、そう言って、ナズナの手を、ぎゅっと握った。", "それが、最後の「ナズナ婆」だった。", "翌日から、井戸は、近づけない場所になった。里の者は、ナズナを、避けるようになった。", "縄だけは、毎朝、手で触った。", "それが、井戸番の、ナズナの、毎日の祈りだった。"]}], "id": "meishi_nazuna", "chars": 1204}, {"label": "クズハ", "title": "織り場の窓", "sections": [{"h": null, "p": ["織り場の窓からは、風の岩溝が見えた。", "クズハは、機の前に座って、足で踏み板を、ゆっくり踏んだ。経糸が、すっと上がり、杼が、横に走った。", "岩溝を渡る風は、時々、不思議な音を立てた。笛のような、風の唸りのような。", "「また、鳴ってる」", "隣の席の若い娘が、窓の外を見た。", "「風の岩溝は、昔、龍が眠っていた場所だって」", "「そんなの、お話よ」", "「でも、あの音を聞くと、寒くなる」", "「そうかしら。私は、好きよ」", "クズハは、糸を整えた。岩溝の風には、特別な草が混じる。風羊の毛に絡まる、細くて、軽い繊維。それを拾い集めて、糸にして、布を織る。", "風の布と、里の者は呼んでいた。", "「クズハさんの布は、軽いねえ」", "客が、よく言った。", "「風を、織ってるみたい」", "「まあ」", "クズハは、笑って流した。", "けれど、本当は、少し、そうかもしれない、と思っていた。", "夕方、織り場の戸が、静かに開いた。", "「クズハ」", "「あら、あなた」", "夫が、立っていた。岩溝へ、風羊を追いに行って、戻ってきたばかりだった。毛皮の肩に、細かい草の繊維が、たくさん付いていた。", "「今日の分」", "夫は、小さな籠を、差し出した。", "「ありがとう」", "「それから、これ」", "懐から、もうひとつ、何か、取り出した。", "布切れだった。薄い、朱色の。", "「岩溝の崖に、引っかかってた」", "「……誰かの、落とし物かしら」", "「かもしれない。でも、きれいだったから」", "クズハは、布を、手のひらにのせた。指先に、細かい織りが、感じられた。", "(誰かが、ここを、通ったのね)", "その夜、クズハは、窓辺に布を広げて、月の光に透かした。", "朱色の布に、風の織り目が、浮かび上がった。", "「ねえ、あなた」", "「うん」", "「この布の織り手は、きっと、風の音を、聞いてた」", "「そうか」", "夫は、笑った。", "「クズハは、いつも、そういうことを、言う」", "名を呼ばれて、クズハは、小さく笑い返した。", "それが、夫と交わした、最後の穏やかな会話だった。", "数日後、夫は、岩溝へ出たきり、戻らなかった。", "里の者は、風に呑まれた、と言った。", "クズハは、毎日、窓辺に座って、岩溝を見た。", "名を呼んでくれる声は、日ごとに、少なくなった。", "それでも、朝になれば、機の前に座り、足で踏み板を、ゆっくり踏んだ。", "風が、窓の外を、通り過ぎていった。", "風の音の中に、一度でいいから、もう一度、自分の名前が、混じっていないかと。", "耳を澄ませたまま、クズハは、杼を、走らせ続けた。"]}], "id": "meishi_kuzuha", "chars": 963}, {"label": "シロエ", "title": "書き写す手", "sections": [{"h": null, "p": ["書記の仕事は、写すことだ。", "シロエは、王都の書庫の隅で、羊皮紙の上に筆を走らせていた。机の上には、古い帳面が、山のように積まれていた。", "(今日の分は、あと三冊)", "蝋燭の火が、わずかに揺れた。", "写すのは、人の名と、数だった。誰が、どこで、いくつ納めたか。誰が、どの隊に配属されたか。誰が、いつ、どの院に入ったか。", "名の一覧は、千を超えていた。", "(同じ名が、ひとつもない)", "書いていて、ふと、気づいた。", "千人の名前が、すべて、違う。それを、一つひとつ、筆で、写している。", "(人の数だけ、名がある)", "当たり前のことだった。けれど、書記になってから、はじめて、本当の意味で、分かった気がした。", "「シロエ」", "上司の声が、背後から飛んだ。", "「はい」", "「今日から、書式が変わる」", "上司は、薄い紙を一枚、机に置いた。", "「名の欄は、省く。番号だけを、記せ」", "シロエは、紙を見た。", "『第三種　納入者　四百十二番』", "『第三種　納入者　四百十三番』", "「名前は、どうするんですか」", "「上に、別の台帳がある。必要なら、そちらを見る」", "「でも」", "「命令だ」", "上司は、それ以上、何も言わなかった。", "シロエは、筆を取った。", "黙って、紙の上に、番号を書いた。四百十二番、四百十三番、四百十四番。", "筆が、何度か、止まった。", "(これは、人間の名前じゃない)", "その夜、書庫に誰もいなくなってから、シロエは、そっと、新しい書式の紙の隅に、細い字で、小さく、名前を書き足した。", "誰にも見えないくらい、薄い字で。", "『ヨシ』", "『タケゾウ』", "『フミ』", "線の横に、ひとつずつ。", "指が震えた。見つかれば、ただでは済まない。", "それでも、止められなかった。", "(名前が、消えるのは、いやだ)", "一晩かけて、百二十の名を、書き足した。", "翌朝、上司に、呼ばれた。", "「シロエ」", "「はい」", "「昨日の帳面だが」", "上司は、紙を、机の上に置いた。薄い字の名前が、指で示されていた。", "「これは、何だ」", "「……」", "「疲れているようだな」", "上司は、ため息をついた。", "「療養のため、しばらく、院で休め」", "「でも、私は」", "「命令だ」", "シロエは、何も、言い返せなかった。", "書庫の外で、白い腕章の男が、二人、待っていた。", "連れて行かれる途中、書庫の窓から、朝の光が差し込んでいた。", "あの紙の隅に書いた、細い名前たち。", "誰かが、いつか、見つけてくれたら、と、シロエは、思った。", "誰かが、読んでくれたら、と。", "その名を呼ぶ人は、誰もいなくなるとしても。", "書いた手は、まだ、覚えていた。"]}], "id": "meishi_shiroe", "chars": 986}, {"label": "ミカゲ", "title": "門の番", "sections": [{"h": null, "p": ["朝の点呼は、名前を呼ぶところから始まる。", "「ミカゲ」", "「はい」", "「サクヤ」", "「はい」", "王城の門の前、石畳の広場に、十人の衛士が並んでいた。隊長が、ひとりずつ、名を読み上げていく。声は太く、よく通った。", "ミカゲは、背筋を伸ばして、槍を持っていた。", "(今日も、いい天気だ)", "初夏の、澄んだ空だった。雲が、ゆっくり、東へ流れていた。", "衛士になって、三年が過ぎた。村の出身だった。字が読めて、背が高かったから、選ばれた。", "「ミカゲは、まじめだな」", "先輩の衛士が、よくそう言った。", "「まじめしか、取り柄がないので」", "「それが、いいんだ」", "隊長は、点呼を終えて、全員を見渡した。", "「よし。今日も、門を守れ」", "「はっ！」", "ミカゲは、声を張った。胸のあたりが、少し、誇らしかった。", "昼になると、広場に、人が増えた。商人、旅人、役人、子ども。", "ミカゲは、門の右側に立って、通る者を、一人ずつ、見ていた。", "「ミカゲさん、おはよう」", "果物売りの老婆が、手を振った。", "「おはようございます」", "「今日も、立派だねえ」", "「ありがとうございます」", "名を呼ばれて、ミカゲは、小さく、頭を下げた。", "(この人たちを、守っているんだ)", "そう思うと、一日が、短かった。", "その夕方、隊長が、全員を集めた。", "「明日から、点呼の形式が変わる」", "衛士たちが、顔を見合わせた。", "「名は、呼ばない。番号で呼ぶ。第一番、第二番、第三番」", "「隊長」", "ミカゲは、思わず、声を上げた。", "「どうして、ですか」", "「王の命令だ」", "隊長は、顔を、少しだけ、逸らした。", "「個人の名は、軍の邪魔になる。個を捨て、全体となれ、と」", "「でも、名前は」", "「ミカゲ」", "隊長は、はっきり、言った。", "「命令だ」", "ミカゲは、唇を噛んだ。", "翌朝の点呼は、番号だけだった。", "「第五番」", "「……はっ」", "名を呼ばれなかった。返事の声が、少し掠れた。", "その日から、毎朝、ミカゲは、第五番になった。", "槍を持って、門の前に立った。", "果物売りの老婆は、いつもと同じように、手を振ってくれた。", "「ミカゲさん、おはよう」", "「……おはよう、ございます」", "その声を聞くたびに、胸の奥が、すこし、熱くなった。", "そして、ある朝、老婆は、来なかった。", "次の朝も、来なかった。", "ミカゲは、門の前で、ひとり、自分の名前を、口の中で、そっと繰り返した。", "(ミカゲ。ミカゲ。ミカゲ)", "誰にも、聞こえない声で。", "それは、槍を握る手の中で、少しずつ、薄くなっていった。"]}], "id": "meishi_mikage", "chars": 962}, {"label": "ウタ", "title": "節回し", "sections": [{"h": null, "p": ["旅の歌い手は、最初の一音で、客を、摑む。", "ウタは、宿屋の酒場の片隅に、木の台を、置いた。弦の張られた楽器を、膝に乗せる。客たちが、ざわざわと、酒を飲んでいる。", "「今夜は、少し、古い歌を」", "誰に向けるでもなく、呟いた。", "弦に、爪をかけた。", "ぽろん。", "低い音が、酒場の空気を、割った。", "ざわめきが、少しずつ、静かになった。", "「昔々、海の向こうに、ひとつの国があった」", "声は、高くはない。けれど、すっと、人の胸の奥に入る声だった。", "「その国の人々は、朝、互いの名を、呼び合って、一日を、始めた」", "節回しは、古かった。少しだけ、揺れる。波のように、寄せては返す。", "「名を呼べば、舟は帰る。名を呼べば、傷は癒える。名を呼べば、遠い人も、そばにいる」", "酒場のあちこちで、客が、盃を、置いた。", "「やがて、国に、王が来て、人々に、言った。名は、要らぬ。番号をやる。番号で、生きよ」", "最後の節で、ウタは、声を落とした。", "「人々は、それでも、夜になると、こっそり、互いの名を、呼んでいた」", "一曲が終わった。", "しばらく、静かだった。", "それから、誰かが、手を叩いた。", "ぱち、ぱち。", "それが、広がった。", "酒場じゅうが、拍手と、笑い声で、満たされた。", "「いい歌だ！」", "「ウタ！ もう一曲！」", "名前を呼ぶ声が、幾つも、重なった。", "ウタは、立ち上がって、深く、頭を下げた。", "(歌う人だから、ウタ)", "それが、いつからか、自分の名前になっていた。本当の名は、旅に出る前に、置いてきた。", "酒場の主人が、盃を持ってきた。", "「ウタ、今夜の歌は、大当たりだな」", "「ありがとう」", "「どこで習った」", "「師匠から。師匠も、その師匠から」", "「古い歌なのか」", "「ええ。もう、誰も、歌わなくなった」", "主人は、少しだけ、眉をひそめた。", "「……あんまり、その歌は、人前でやらんほうが、いい」", "「どうして」", "「最近、王都の役人が、うるさいんだ。昔のものを、広めるな、とな」", "ウタは、笑った。", "「歌は、広がるものよ」", "「それでも」", "「大丈夫。次は、もう少し、明るいやつにするわ」", "そう言って、弦を、また、弾いた。", "夜が更けるまで、ウタは、歌った。", "その夜、宿の窓を見上げたとき、遠くの通りを、白い腕章の男が、ゆっくり、歩いていくのが見えた。", "翌日から、ウタの歌う場所は、少しずつ、減っていった。", "そのたびに、歌の節が、ひとつずつ、静かになった。", "誰にも呼ばれなくなった名前は、やがて、音楽のなかに、混じって、消えていった。"]}], "id": "meishi_uta", "chars": 980}, {"label": "アカネ", "title": "畦の声", "sections": [{"h": null, "p": ["畑番は、朝、いちばん最初に、畑へ入る。", "アカネは、露に濡れた畦道を、素足で歩いていた。土蜘蛛族の畑は、斜面に、段々に作られている。稲穂は、まだ、緑だった。", "(今日は、三番田に、水を足す)", "一枚ずつ、田の水口を見て回った。小さな板で、水の流れを、調節する。板を、ひとつ動かすだけで、田の水が、半日、変わる。", "「おう、アカネ」", "声が、斜面の上から降ってきた。", "見上げると、大柄な男が、畦の上に立っていた。背に、節のある脚のような甲殻を、静かに、畳んでいる。ハニヤスだった。", "「おはようございます」", "「今日は、どうだ」", "「三番田が、少し、乾いています。水を足します」", "「分かった。頼む」", "ハニヤスは、畦の端に、屈みこんだ。", "「見ろ、ここだ」", "指で、稲の根元を、示した。", "「ひと株、増えた。昨日より」", "「本当ですか」", "「ああ。分けつだ。いい土になってきた」", "アカネは、しゃがんで、その株を、見た。緑の細い茎が、ひとつ、増えていた。", "胸が、ふわっと、温かくなった。", "「ハニヤス様のおかげです」", "「いや」", "ハニヤスは、首を振った。", "「おまえが、毎日、水を見ているからだ」", "そして、ごく自然に、言った。", "「アカネ」", "名前を、呼ばれた。", "大きな掌が、アカネの頭を、ぽんと、軽く、叩いた。", "「頼んだぞ、畑番」", "「はい」", "アカネは、胸を張った。", "それが、この日の、朝の挨拶だった。", "昼、田の水が、整った。", "アカネは、畦に腰を下ろして、持ってきた握り飯を、ほおばった。風が、稲の葉を、さらさらと、鳴らしていた。", "(この畑が、好きだ)", "声には、出さなかった。けれど、心の底から、そう思った。", "夕方、畑の見回りを終えて、集落へ戻る道すがら、アカネは、空を見上げた。", "黄泉の空は、昼でも、薄く赤い。夕暮れには、その赤が、少しだけ、深くなる。", "(明日も、いい天気になる)", "そう、思った。", "けれど、その翌朝、空は、いつもより、赤かった。", "遠くで、地鳴りがした。", "畑の向こうの、大穴の方角から、黒い煙が、立っていた。", "「アカネ！ 逃げろ！」", "誰かの叫び声が、聞こえた。", "アカネは、畦の上に、立ち尽くした。", "稲穂が、燃えていた。", "炎が、段々の田を、ひとつずつ、舐めていった。", "声が、出なかった。", "名前を、呼ぶ者は、もう、そこに、いなかった。", "その朝、アカネは、人生で、最後の、声を出した。", "「……ハニヤス、様」", "それは、誰にも、届かなかった。"]}], "id": "meishi_akane", "chars": 952}, {"label": "クロハ", "title": "風の便り", "sections": [{"h": null, "p": ["空は、道だ。", "クロハは、翼を広げて、黄泉の空を、渡っていた。眼下には、赤みを帯びた大地が、静かに広がっている。畑、川、岩山、村。ひとつずつ、上から、見下ろした。", "鴉族の伝令は、風を読む。", "(南西から、湿った風。夕方には、雨が来る)", "背に、小さな革の筒を、くくりつけていた。中には、ナキメ様の文が、入っている。", "「ミカヅチ殿へ、至急」", "書き付けは、短かった。内容までは、知らなかった。伝令は、運ぶだけだ。", "やがて、角ヶ原が、見えてきた。", "鬼族の砦の前に、ふわりと降り立った。", "「クロハです。ナキメ様の使いで」", "「おう、来たか」", "門番の若い鬼が、笑った。", "「毎回、早いな」", "「風が、良かったので」", "文を渡し、受け取りを、もらう。往復で、ほぼ半日。この道を、もう、何百回、飛んだだろう。", "帰り道、クロハは、少し、遠回りをした。", "土蜘蛛族の畑の上を、通る。", "稲穂が、緑に揺れていた。畦道に、小さな人影が、見えた。", "(アカネだ)", "畑番の娘が、田の水口に屈みこんでいた。クロハは、翼を傾けて、少し、高度を下げた。", "「アカネ！」", "声を、落とした。", "娘が、顔を上げた。手を、振った。", "(今日も、元気そうだ)", "それだけで、胸が、少し、軽くなった。", "空に、また、上がる。", "夕方、埴の里の上を通ると、ハニヤスが、畑の端から、見上げていた。", "「クロハ！」", "低い声が、風に乗って、届いた。", "「ご苦労だった！ ナキメによろしくな！」", "クロハは、翼を、一度、大きく振った。", "(呼ばれた)", "その一言が、翼を、強くした。", "鴉族は、名前に、あまり、こだわらない。空では、誰も、名など呼ばない。風の音に、混じって消えるからだ。", "それでも、地に降りたとき、自分を呼ぶ声が、あると、ほっとする。", "家の屋根に降り立つと、窓から、母が顔を出した。", "「おかえり、クロハ」", "「ただいま」", "「ご飯、できてるよ」", "「うん」", "飯を食べて、寝床に入った。", "窓の外に、赤い月が、浮かんでいた。", "その翌朝、空が、燃えた。", "大穴の方向から、黒い煙が、立ち上っていた。", "クロハは、翼を広げて、空へ飛び出した。", "畑の上空へ向かう途中、風が、焦げ臭かった。", "アカネの畑は、赤く、燃えていた。", "何度、旋回しても、畦の上に、娘の姿は、見えなかった。", "(アカネ)", "声に出して、呼んだ。", "何度も、何度も、呼んだ。", "返事は、風の音に、消えていった。", "それから、クロハは、二度と、アカネの名前を、口にできなくなった。", "呼んでも、誰にも、届かないと、知ってしまったから。"]}], "id": "meishi_kuroha", "chars": 990}, {"label": "ヤマブキ", "title": "研ぎ上げた日", "sections": [{"h": null, "p": ["刃は、打つより、研ぐほうが、むずかしい。", "ヤマブキは、水桶の前に、座っていた。砥石の上で、一振りの刀を、ゆっくり、滑らせる。しゅ、しゅ、と、細かな音がした。", "「ヤマブキ、まだか」", "鍛冶場の入口から、若い鬼が、顔を出した。", "「まだだ。急かすな」", "「でも、お客さんが、待ってる」", "「待たせておけ。研ぎは、客のためじゃない。刃のためだ」", "ヤマブキは、顔を上げなかった。", "鬼族の鍛冶は、数が、少なかった。ほとんどは、男だった。女の鍛冶は、ヤマブキひとりだ。", "「女に、剣が打てるか」", "若いころ、そう言われた。", "「見てから、言え」", "そう、返した。", "それ以来、ヤマブキの打つ刃は、角ヶ原の鬼たちに、信頼されるようになった。", "「よし」", "最後の一研ぎを、終えた。", "刀を、水で洗って、布で拭った。", "刃紋が、淡い雲のように、浮かんだ。", "「見事だ」", "背後から、低い声がした。", "振り返ると、細身のカラス族の男が、立っていた。参謀オモイカの随員だった。", "「刀を受け取りに来た」", "「あんたか」", "ヤマブキは、刀を、両手で、持ち上げた。", "「これを、使うのは、あんたかい」", "「ええ。次の会談に、持っていくのです」", "「会談」", "「人間の王と、話をする席です」", "随員は、微笑んだ。", "「戦わないための席に、刀を、持っていくというのも、変な話ですが」", "「いや、持っていけ」", "ヤマブキは、言った。", "「刃は、抜かないために、打つもんだ。抜くときは、もう、遅い」", "随員は、ゆっくり、頷いた。", "刀を、両手で受け取った。", "「ヤマブキ殿の刃は、いつも、美しい」", "「殿、は、いらない」", "「いえ。私は、そうお呼びしたい」", "その言い方が、まっすぐで、ヤマブキは、少し、顔をそらした。", "「……好きにしろ」", "随員は、笑って、頭を下げた。", "「では、行ってまいります」", "「ああ。無事に、帰ってこい」", "随員の背中が、鍛冶場の戸口から、遠ざかっていった。", "その背中を、ヤマブキは、ずっと、見送っていた。", "それが、随員を見た、最後だった。", "数日後、会談は、騙し討ちだった、と、噂が届いた。", "人間の軍が、大穴から、なだれ込んだ。随員は、戻らなかった。", "ヤマブキは、鍛冶場で、ひとり、砥石の前に座っていた。", "あの刀を、研いだ手を、見つめた。", "(私が、研いだ)", "(あの刃は、抜かれることなく、……いや、抜かれたのか)", "誰も、答えてくれなかった。", "その日から、ヤマブキの名を呼ぶ者は、減った。", "呼びたくない、というより、呼ぶと、あの日を、思い出すからだった。", "鍛冶場の火は、まだ、燃えていた。", "ヤマブキは、砥石に、水を差した。", "(殿、は、いらない、と、言ったのに)", "水が、砥石を、濡らした。", "その音だけが、いつまでも、耳に、残っていた。"]}], "id": "meishi_yamabuki", "chars": 1066}, {"label": "ウツホ", "title": "番小屋の茶", "sections": [{"h": null, "p": ["大穴の番小屋では、茶を淹れるのが、日課だった。", "ウツホは、小さな囲炉裏に、鉄瓶をかけた。湯が沸く間、小屋の窓から、大穴の縁を、見下ろした。", "底は、暗かった。見えない。けれど、冷たい風が、静かに、上がってきていた。", "「ウツホ、湯は」", "小屋の入口から、声がした。", "「もうすぐです」", "「そうか」", "入ってきたのは、旅の格好をした男だった。ヨミジ。黄泉の道を、一人で歩く旅人だった。", "「今日は、冷えるな」", "「大穴の風は、こういうものです」", "ウツホは、三つの茶碗を、並べた。", "「ホムラは」", "「今、来る」", "そのとき、戸が、ばたんと、開いた。", "「遅れた！ すまん！」", "赤い髪の青年が、駆け込んできた。炎の守り手。ホムラだった。袖に、火の粉の跡が、いくつも焦げていた。", "「また、火の番で、居眠りしたのか」", "「ちがう。今日は、本当に、遅れただけだ」", "「言い訳は、茶を飲んでから」", "ウツホは、湯を注いだ。", "湯気が、小屋いっぱいに、広がった。", "三人で、囲炉裏を囲んで、茶を啜った。", "「うまい」", "ヨミジが、目を細めた。", "「ウツホの茶は、いつも、うまい」", "「湯が、いいんです。大穴の水は、冷たくて、柔らかい」", "「それは、お茶を淹れる腕だ」", "ホムラが、笑った。", "こんなふうに、三人が揃う夜は、月に何度もあった。", "ウツホは、大穴の番人だった。", "黄泉の道と、人の世を、つなぐ穴。その入口を、守る役目を、先代から、受け継いだ。誰が通り、誰が通らないか。許されるべき者と、そうでない者。", "その線を、引くのが、仕事だった。", "「ウツホ」", "ヨミジが、茶碗を置いた。", "「おまえは、時々、辛そうな顔をする」", "「そうでしょうか」", "「ああ。通すか通さないか、毎日、決めているだろう」", "ウツホは、答えなかった。", "「俺は、旅人だから、気楽だ。通る側だからな」", "ヨミジは、火を、見つめた。", "「でも、おまえに、通してもらっている、と、いつも、思っている」", "ホムラが、腕組みをして、頷いた。", "「俺も、そうだ。火を、守っているつもりで、本当は、おまえに、守られている」", "ウツホは、少しだけ、笑った。", "「ありがとう、ございます」", "「礼を、言うな。茶が、冷める」", "ヨミジが、笑った。", "その夜、三人は、夜更けまで、他愛のない話を、続けた。", "遠くで、大穴が、静かに、呼吸しているようだった。", "それが、三人で囲んだ、最後の茶だった。", "数日後、大穴の縁に、人間の軍が、現れた。", "そのとき、ウツホは、番小屋の戸口に、ひとりで、立っていた。", "「通せ」", "先頭の男が、言った。", "「会談の知らせは、受けておりません」", "「通せ」", "「できません」", "その夜、番小屋は、焼けた。", "ウツホは、焼け跡の灰の中で、茶碗を、ひとつだけ、見つけた。", "それを、胸に、抱いた。", "もう、名を呼んでくれる友は、そばに、いなかった。"]}], "id": "meishi_utsuho", "chars": 1099}, {"label": "ヨミジ", "title": "道を訊く", "sections": [{"h": null, "p": ["道は、歩く人の数だけ、ある。", "ヨミジは、黄泉の道を、一人で、歩いていた。杖を突き、荷を背負い、足元の石を、ひとつずつ、確かめながら。", "この道を歩き始めて、もう、何年になるか。", "(どこへ行くのか)", "そう、よく、自分に問う。", "答えは、出なかった。ただ、足が、前に出るのだった。", "道の脇に、粗末な小屋が、見えてきた。屋根から、細い煙が、立っている。", "(番小屋か)", "近づいて、戸を叩いた。", "「どなたです」", "静かな声が、返った。", "「旅の者です。道を、訊きたくて」", "戸が、開いた。", "中から、穏やかな顔の男が、現れた。四十がらみ。落ち着いた目をしていた。", "「どうぞ。茶を淹れましょう」", "「かたじけない」", "小屋の中は、狭かったが、整っていた。囲炉裏の火が、柔らかい。壁際に、茶碗が、いくつか、並んでいた。", "「お名前を、うかがっても」", "「ヨミジ。黄泉の道を、歩く者です」", "「ヨミジ殿」", "男は、茶碗を、差し出した。", "「私は、ウツホ。この大穴の、番人をしております」", "「番人」", "「ええ。人の世と、黄泉の道の境を、守る

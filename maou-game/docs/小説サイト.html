役目です」", "ヨミジは、茶を、啜った。", "(うまい)", "素直に、そう思った。", "「道を、訊きたい、とのことでしたね」", "「ええ。この先は、どちらへ」", "「大穴を越えれば、人の世。戻れば、黄泉の野」", "ウツホは、窓の外を、指した。", "「どちらも、通れます。ただ、通ったら、戻れません」", "「それは」", "「大穴の掟です。通るなら、選ぶ。選んだら、戻らない」", "ヨミジは、少し考えた。", "「私は、どちらにも、行かない」", "「では」", "「ここに、少し、留まっても、いいだろうか」", "ウツホは、微笑んだ。", "「かまいません。番小屋は、旅人のためにも、あります」", "こうして、ヨミジは、番小屋の客になった。", "数日が過ぎた。", "夕方、小屋の戸が開き、赤い髪の青年が、駆け込んできた。", "「遅れた！ すまん！」", "「ホムラ。また、居眠りか」", "「ちがう。今日は、本当に、遅れただけだ」", "「言い訳は、茶を飲んでから」", "ウツホの声が、笑っていた。", "ヨミジは、その様子を、少し離れて、見ていた。", "(これが、友、というものか)", "旅人には、縁のないものだと、思っていた。", "けれど、この小屋では、いつの間にか、自分も、その輪の中に、いた。", "「ヨミジ」", "ホムラが、茶碗を差し出した。", "「ほら」", "「ありがとう」", "名前を呼ばれた。", "旅の間、誰にも呼ばれなかった名前だった。", "ヨミジは、茶碗を、両手で包んだ。熱が、指に、染みた。", "(道は、まだ、続く)", "(けれど、ここが、道の途中の、居場所なのかもしれない)", "そう、思った夜が、確かに、あった。", "その居場所が、いつまでもあると、ヨミジは、信じていた。"]}], "id": "meishi_yomiji", "chars": 1045}, {"label": "ホムラ", "title": "消さない火", "sections": [{"h": null, "p": ["火は、消さないために、あるのではない。", "ホムラは、そう、教わった。", "大穴の最深部に、小さな祭壇があった。石の台の上に、ひとつの炎が、燃えている。大きくはない。蝋燭の火より、少しだけ、大きい程度。", "けれど、それは、何百年も、消えたことがなかった。", "「炎の守り手の役目は、火を、絶やさぬこと」", "先代の守り手は、そう言った。", "「ただ、守るだけじゃない。火に、話しかけなさい」", "「話しかける、ですか」", "「ああ。火は、聞いている」", "最初は、半信半疑だった。", "けれど、毎晩、火に向かって、今日あったことを、話すようになった。", "「今日は、ウツホが、また、茶を淹れてくれた」", "火が、ゆらり、と、揺れた。", "「ヨミジが、旅の話を、してくれた。海の向こうには、白い鳥が、群れで飛んでいる、って」", "火が、少しだけ、大きくなった。", "「それで、俺は、笑った。笑ったら、また、遅れた」", "火は、ぱち、と、小さく、弾けた。", "ホムラは、笑った。", "(聞いて、いる)", "そう、確信するようになった。", "ある夜、深い穴の底へ、降りていく途中で、ホムラは、足を止めた。", "階段の壁に、手を置く。冷たい石が、掌に伝わった。", "(ここは、静かだ)", "けれど、最近、静けさが、重く感じることが、増えた。", "ウツホは、大穴の番人として、日ごとに、何かを、抱え込んでいるようだった。ヨミジは、ひとところに、落ち着き始めていた。そして、自分は、火の番。", "(三人、揃う夜は、あと、何回か)", "そんなことを、ふと、考えた。", "祭壇の前に立ち、火に向かって、深く、頭を下げた。", "「ただいま」", "火が、揺れた。", "それから、ホムラは、石の台に、そっと、油を足した。", "火は、ふっくらと、明るくなった。", "「なあ」", "火に、話しかけた。", "「もし、俺が、いなくなっても、おまえは、燃え続けるか」", "返事は、なかった。", "けれど、火は、まっすぐ、上へ、伸びた。", "(そうか)", "ホムラは、満足そうに、頷いた。", "それから、祭壇の隅に腰を下ろして、夜通し、火を見て過ごした。", "名前を呼ぶ者が、そばにいなくなっても。", "火だけは、ずっと、ホムラの名前を、覚えていてくれる気がした。", "それが、炎の守り手の、いちばんの、慰めだった。"]}], "id": "meishi_homura", "chars": 866}]}, {"name": "試作（読んで決めるための試し読み）", "note": "本編の加筆と前日譚の、見本です。気に入ったら、同じ形で全体に広げます", "items": [{"id": "plus_ch01", "label": "第一章（加筆）", "title": "黄泉の大地、焼ける", "chars": 7134, "sections": [{"h": "一", "p": ["黄泉の空は、昼でも薄く赤い。それでも土蜘蛛族の畑には、澄んだ光が降りていた。ハニヤスが長い年月をかけて地脈を整え、瘴気を土の底へ押し戻してきたからだ。丘の斜面には段々の田が刻まれ、実り始めた稲穂が風のたびに低い波をつくっていた。", "段々の田は、斜面に沿って、幾重にも重なっていた。上の田から下の田へ、細い水路が通っている。その水は、ハニヤスが毎朝、手ずから板を動かして導いたものだった。水面には、赤みを帯びた空が映り、風が渡るたびに、細かく波打った。", "土の匂いがした。湿って、少し甘い、生きている土の匂いだった。瘴気の澱んでいた頃には、この丘に、こんな匂いはなかったという。", "「王よ、そこは踏むな」", "低い声が飛んだ。ベルイザナは片足を上げたまま固まった。畦の際に、小さな芽が一本だけ顔を出している。", "「すまぬ。気づかなかった」", "「気づく前に足元を見ろ。土は黙っているが、忘れはせん」", "ハニヤスは振り返りもせず、鍬を振るい続けた。顔は蜘蛛をかたどった硬い面に覆われ、肩から背にかけて張りついた甲殻からは、節のある細い脚が幾本も伸びている。からくりのようなその脚は、鍬を振るうたびに軋んで、鈍い光を返す。魔界の食卓を預かる男は、口数が少ない。それでも、客として畑を歩くことをベルイザナに許している。", "ベルイザナは袖をまくり、土蜘蛛の若衆と並んで長い卓を運んだ。収穫祭は三日後だ。鬼族の祭り酒の樽が荷車で次々に着き、嵐狼の子どもたちが、樽の周りをはしゃいで走り回っている。", "荷車の車輪が、畦道の土を踏み固めていく。樽を降ろす鬼族の若者たちは、肩を組むようにして掛け声を合わせ、そのたびに、中の酒が、とぷん、と重い音を立てた。土蜘蛛の娘たちは、長い卓に白い布を掛け、端を石で押さえていた。", "「王様、どろんこだ」", "小さな嵐狼が、ベルイザナの頬を指さして笑った。", "「畑の手伝いをしたからな。これは誇ってよい泥だ」", "「じゃあ、ぼくもつける」", "子どもは両手を地面に突っ込み、自分の顔に塗りたくった。周りの大人たちが笑い、ベルイザナも笑った。魔王と呼ばれる男が畦に腰を下ろして握り飯をかじっていても、誰も居住まいを正さない。先代の頃には考えられなかった光景だ。", "「今日だったな。人の王との会談は」", "ハニヤスが、手を止めずに言った。", "「ああ。オモイカが行っている」", "「話の通じる相手であってほしいものだ」", "「通じてほしい。私は、そう願っている」", "ベルイザナは握り飯の最後の一口を飲み込み、遠い大穴の方角を見た。空の赤が、そこだけ少し濃く見えた。", "稲穂が、風もないのに、一度だけ、ざわりと揺れた。", "気のせいだ、とベルイザナは思った。思ってから、握っていた竹の皮を、いつまでも畳んでいる自分に気づいた。"]}, {"h": "二", "p": ["大穴へ続く街道は、荒れた岩場のまま長く伸びている。オモイカは輿を断り、随員たちと同じ歩調で歩いていた。", "道の両側には、黒い岩が、牙のように突き出していた。ところどころの割れ目から、白い湯気が、細く立ち昇っている。大地の底の熱が、岩の隙間から、ゆっくり漏れているのだ。足元の砂利は乾いて、一行が歩くたびに、さくさくと軽い音を立てた。", "先頭では若い鴉族が荷を担ぎ、中ほどでは書記を務める老いた鬼が、巻物を胸に抱えて黙々と進んでいる。最後尾では、嵐狼の青年が下手な笛を吹いていた。誰かが「調子が外れているぞ」と言い、誰かが笑った。", "誰もが、少しだけ、よそ行きの顔をしていた。袖口を整え、襟を直し、泥を落とした靴で歩いている。これから会うのは、長く争ってきた相手だ。それでも、道中の空気は、遠足のように、明るかった。", "オモイカは、一人ひとりの顔を覚えている。家族の数も、好きな食べ物も、故郷の畑の広さも知っている。それが参謀の仕事だと、先代の頃から思ってきた。力で押さえつけるだけの統治は、いつか必ず折れる。ベルイザナはその限界を越えた。だから腹心を誓った。", "その王が望んだ和平である。成さなければならない。", "ただ、胸の奥に小さな棘が刺さっていた。人の王から届いた書簡は、文面が整いすぎていた。誠実な言葉が、誠実すぎる順序で並んでいる。嘘を知っている者が、嘘に見えないように磨いた文面だと、オモイカの目は告げていた。", "見抜く力は、時に重荷になる。棘を抜く確証はない。確証がないまま断れば、和平の機会そのものを失う。", "(王は、ご自分を疑わない)", "オモイカは、その美点を、愛していた。同時に、それが、いつか足元を掬うのではないかと、密かに案じてもいた。王が信じ、王が望む。ならば、自分は、疑う役を引き受ければよい。それが、参謀の分だと思ってきた。", "「参謀殿、顔が怖いですぞ」", "後ろから、書記の老いた鬼が声をかけた。", "「生まれつきだ」", "「いやいや。王も、いつもそう仰っておりました。オモイカは考えすぎる、と」", "オモイカは小さく息を吐いた。口の端がわずかに緩んだ。", "「王の言うとおりだ。考えすぎで済めば、それが一番よい」", "大穴の縁が、岩の向こうに見え始めていた。", "縁の際に、白い建物が、ぽつりと建っている。半年かけて築いた会談の間だ。両岸の石工が、一つずつ石を運び、削り、積んだ。完成した日には、魔界の者も人間の者も、一緒に酒を飲んだと聞いた。", "その白さが、遠目には、やけに、頼りなく見えた。"]}, {"h": "三", "p": ["魔界の市場は、昼になると種族の匂いが混ざる。鬼族の祭り酒、土蜘蛛族の新米の蒸し団子、嵐狼の干し肉、鴉族の屋台から立ち上る甘い煙。", "呼び込みの声が、あちこちで重なり合っていた。鉄鍋の底を叩く音、羽を畳んで荷を運ぶ鴉の翼がこすれる音、値切る声と、値切られて笑う声。路地の奥から、蒸し団子の湯気が、白く流れてきた。", "ベルイザナは外套の頭巾を目深に被り、団子の屋台の前に立った。", "「ひとつ、くれ」", "「あいよ。今日は噂つきだよ」", "鴉族の店主が、団子を包みながら片目をつぶった。鴉族の屋台は、料理に噂話を一つ添えるのが決まりだ。", "「噂とは」", "「人の王との会談さ。今日、大穴で開かれてるんだって。人間と仲直りできるのかねえ」", "隣で野菜を選んでいた老婆が、顔を上げた。", "「王様が望むなら、できるんじゃないかね。あの子は嘘をつかないから」", "「あの子とは、ずいぶん親しげだな」", "店主が笑った。老婆は肩をすくめる。", "「この間、うちの畑の畦を直しに来てくれてね。泥だらけで、お茶を出したら『これが一番うまい』と」", "頭巾の下で、ベルイザナは視線を落とした。団子の湯気が、頬を温めている。", "(あの子、か)", "自分のことを、そう呼ぶ者がいる。それを、くすぐったいと思う。同時に、胸の奥の、ずっと奥のあたりで、小さく、重いものが、ゆらりと動いた。", "それは、期待という名前をしている、と思った。", "そのとき、誰かが外套の裾を引いた。見下ろすと、嵐狼の幼い子どもが立っていた。耳が聞こえない子だ。スサノの築いた集落から、買い物に来たのだろう。子どもは両手を動かし、ゆっくりと形を作った。", "(王様。顔に泥がついてる)", "ベルイザナは同じ形で手を返した。", "(気づかなかった。教えてくれて、感謝する)", "子どもが目を丸くして、にっと笑った。店主が団子を差し出す。", "「王様に似てるねえ、お客さん」", "「よく言われる」", "「だろうねえ。きっと、あの方もこんな顔で団子を食べるんだろうよ」", "店主の言葉に、ベルイザナは返事をしなかった。ただ、団子を一口かじって、うまいと言った。", "屋台を離れ、人混みの中を、ゆっくり歩いた。誰も、頭巾の男が王だとは気づかない。擦れ違う者が、肩をぶつけて、軽く詫びる。それが、うれしかった。", "団子の最後のひと串を、紙に包んで、懐に入れた。ハニヤスにも、一本、持っていってやろう。あの男は、甘いものを、素直に喜ばない。だから、そっと渡すのがいい。"]}, {"h": "四", "p": ["大穴の縁に建てられた会談の間は、白い石でできていた。両岸の陣営が、半年かけて共同で築いた建物だ。中立の番人である岐人の老いた一人が、立会人として壁際に控えている。", "窓は高く、細く、そこから落ちる光が、床に白い筋を引いている。新しい石の匂いが、まだ、壁に残っていた。大穴の底から上がってくる冷たい空気が、足元を、静かに撫でていく。", "向かいの席に、アマツ王が座っていた。", "白い礼装に身を包み、剣は帯びていない。穏やかな顔で、柔らかな声で話す。", "その身のこなしには、無駄がなかった。袖の捌き、杯を取る指の角度、相手に向ける視線の長さまで、すべてが、長い時間をかけて磨かれた型のようだった。", "「よくお越しくださいました。長い道のりでしたでしょう」", "「お招きに感謝いたします」", "オモイカは、深く頭を下げた。礼を尽くすのは、王の望みだ。", "王の言葉は、すべて正しかった。争いは終わらせたい。民を失いたくない。魔界の王の統治は、評判を聞いている。", "正しすぎる、とオモイカの目は思った。", "王の隣には、若い男が立っていた。勇者タケルだと紹介された。背筋が伸び、目に濁りがない。握った剣の柄に手を置いてはいるが、それは身構えているというより、癖に近かった。", "「魔界の方々を、遠路お迎えできて光栄です」", "タケルは生真面目に頭を下げた。その礼に、嘘はなかった。本心から、この会談の成功を願っている。オモイカにはそれが見えた。", "だからこそ、棘は抜けなかった。善良な男の隣で、善良な言葉を語る王の目の奥だけが、温度を持たない。", "「では、大穴の共同管理について、具体的な条項を詰めましょう」", "王の声は、どこまでも柔らかかった。", "オモイカは、巻物を開いた。随員たちが、背後で静かに息を整えている。もし何かが起きるなら、今この瞬間に、起きるはずがない。そう思おうとした。", "条項は、一つずつ、静かに読み上げられていった。窓から落ちた光の筋が、少しずつ、床の上を動いていく。杯の茶は、いつの間にか冷めていた。", "誰も、咳ひとつしなかった。", "そう思いたかった。"]}, {"h": "五", "p": ["王の広間には、四天王が揃っていた。昼下がりの光が高窓から差し、石の床に長い影を落としている。", "高い天井の梁には、先代の頃から掛けられた古い旗が、色褪せたまま垂れている。石の床は、磨かれて、窓の光を鈍く映した。広間の隅では、給仕の若者が、盃の用意をしている。それだけで、この場所が、どれほど、穏やかになったかが分かった。", "「和平が成れば、収穫祭に人間を招けるだろうか」", "ベルイザナが、杯を傾けながら何気なく言った。", "「酒が足りなくなる」", "ミカヅチが、即座に答えた。", "「鬼の樽は、人間の舌を考えて仕込んでおらん。三倍は要るぞ」", "「三倍で済むなら安いものだ」", "ナキメが口の端を上げた。", "「席の並びも考えねばなりませんね。鬼と人間は、どちらも声が大きい。隣に座らせると、酒の席が決闘になりかねません。私が間に入りましょう」", "「群れの者は嫌がるだろう」", "スサノが唸るように言った。牙の間から、息が漏れる。", "「だが、お前が招くと言うなら、俺たちは席を空ける。裏切りは、せん」", "「土地を荒らさぬ客なら、迎える」", "ハニヤスが、短く言った。", "ベルイザナは、四人の顔を順に見た。力で従わせた者は一人もいない。だからこそ、胸が温かかった。", "ミカヅチの太い腕が、卓に置かれている。ナキメの翼は、きちんと畳まれて、羽の先が、わずかに光を返している。スサノは、いつものように、壁際に半身を預けていた。ハニヤスは、鍬を、傍らに立てかけたまま、黙って、茶を啜っている。", "ここにいる誰も、自分に、頭を下げさせられたことなど、ない。", "「感謝する。まだ、成ると決まったわけではないが」", "「成りますとも」", "ナキメが涼しい顔で言った。", "「オモイカが行っているのです。嘘と本当を聞き分ける目で、あの方より確かな者はいません」", "その名が出た時、ベルイザナの胸の奥で、小さな音がした。何の音かは、分からなかった。", "杯の中の酒が、ひとつ、小さく揺れた。誰も、その揺れの理由を、尋ねなかった。"]}, {"h": "六", "p": ["「では、この条項で、双方の署名を」", "アマツ王が、穏やかに微笑んで言った。", "その笑みが、深くなった。", "オモイカの目が、それを捉えた。口の端がほんのわずか上がる。目の奥の温度のなさが、笑みの裏から浮き上がる。", "見抜いた。遅かった。", "「――終わりにしましょう」", "王の声が、柔らかく響いた。", "足元の石が、鳴った。大穴の底から、地鳴りがせり上がってくる。会談の間の床が震え、壁際の岐人の番人が、はっと顔を上げた。", "音は、床から来たのではなかった。もっと深い。もっと遠い。大穴の底に眠る何かが、寝返りを打つような、重い響きだった。", "「何を――」", "扉が、外から蹴破られた。鎧の軍勢が、雪崩のように流れ込んでくる。大穴の人間側の拠点から、宣戦の布告もなく。", "「王を守れ！」", "タケルの声が響いた。迷いのない、澄んだ声だった。彼は、魔族が先に襲ったと信じている。そうでなければ、この声は出ない。洗脳された善意の剣が、抜かれた。", "「参謀殿！」", "書記の老いた鬼が、オモイカの前に立った。巻物が宙に舞う。笛を吹いていた青年の笛が、床に落ちて転がった。荷を担いでいた鴉族が、剣を弾こうと翼を広げ、そのまま倒れた。", "一人。また一人。", "オモイカは、目を逸らさなかった。血の匂いが、会談の間を満たしていく。白い石の床が、少しずつ、赤く染まった。", "オモイカは、言霊を唱えた。返し鏡が空気を張り、迫る刃と術の光を弾く。猛りと堅めを重ね、随員たちの前に壁を作ろうとする。足りない。数が違う。人間の軍勢は、魔界側の十倍はいる。", "倒れていく随員の顔を、一つずつ見た。一人も、目を逸らさなかった。逸らせなかった。名前は、口にしなかった。口にすれば、声が震える。震えれば、言霊が乱れる。", "背に、手が触れた。", "誰の手だったか、分からない。強い力が、オモイカを押した。床が割れた縁の向こう、魔界側へ続く回廊の暗がりへ。", "「行ってください、どうか――」", "声は、途中で途切れた。", "オモイカは、転がり落ちた。振り返ったとき、扉の向こうでは、アマツ王が白い礼装のまま立っていた。血の海の中で、変わらず穏やかに微笑んでいた。", "石の縁が、肩を打った。背を、膝を、腕を。暗い回廊が、思ったより深く、何度も体が跳ねた。やがて、冷たい床の上で、止まった。"]}, {"h": "七", "p": ["回廊の暗がりは冷たかった。", "どこかで、水が滴っている。ぽた、ぽた、と、一定の間を置いて。その音だけが、自分がまだ生きていることを、教えてくれていた。", "オモイカは壁に背を預け、息を整えた。腹が熱い。押さえた手が濡れている。傷は浅くない。それでも動ける。動かなければならない。", "手を空にかざし、言伝の言霊を唱えた。鴉族の術を、ナキメに教わって覚えたものだ。声を風に乗せ、王のもとへ届ける。", "「……ベルイザナ様」", "返事を待つ余裕は、なかった。", "「会談は、騙し討ちでした。人間の軍勢が、大穴から魔界側へ突入しています。随員は――」", "そこで、声が詰まった。", "随員の顔が、一つずつ浮かぶ。笛を吹いていた青年。巻物を胸に抱えていた老いた鬼。荷を担いでいた若い鴉。", "オモイカは、唇を噛んだ。血の味がした。", "「……私の読みが、外れました。違和感はありました。それでも、席に着きました。申し訳――」", "言いかけて、飲み込んだ。謝罪は後でいい。今は、一刻も早く、全てを伝えなければならない。", "「軍勢は、すでに最前線の大陸に入りつつあります。民の避難を。急いでください」", "言霊が、風に溶けた。", "返事は、まだ来ない。風が、回廊の奥へ、細く吸いこまれていく。遠く、会談の間のほうから、剣の鳴る音と、誰かの叫びが、途切れ途切れに聞こえた。それは、だんだんと、少なくなっていった。", "オモイカは、壁に額を押し当てた。誰も呼ばなかった名前が、胸の中で静かに反響していた。"]}, {"h": "八", "p": ["収穫祭の卓は、ほぼ並び終わっていた。", "白い布の端が、夕風に、ゆらゆらと揺れていた。卓の上には、まだ何も載っていない。三日後には、ここに、盃と、皿と、笑い声が並ぶはずだった。", "ベルイザナは、ハニヤスの隣で、最後の杭を打っていた。陽は傾き、段々の田が金色に染まっている。嵐狼の子どもたちが、泥だらけの顔のまま、卓の周りを走っていた。", "声が、風に乗って届いた。", "オモイカの声だった。", "ベルイザナの手が、止まった。槌が、地面に落ちた。", "声は、短かった。会談は騙し討ちだったこと。軍勢が突入したこと。随員が――。", "そこで、言葉が途切れた。", "ベルイザナは、動かなかった。耳を傾けたまま、遠い大穴の方角を見ていた。表情は、静かに消えていく。市場で団子をかじった時の穏やかさも、泥だらけで笑った時の温かさも、すべて。", "ハニヤスが、鍬を止めた。何も言わなかった。ただ、ベルイザナの顔を見て、背を向けていた子どもたちを手招きし、畑の中央へ集めた。", "鍬の先から、土が、ぽろりと落ちた。節のある脚が、ぎしり、と一度軋んで、止まった。", "「……ハニヤス」", "ベルイザナの声は、低く、平らだった。", "「おう」", "「土蜘蛛の民を、避難させてくれ。この畑ごと、守れるなら守ってほしい。無理なら、命を第一にせよ」", "「畑は、後で直せる」", "ハニヤスが答えた。", "「民は、直せん」", "「感謝する」", "ベルイザナは、足元に落ちた槌を拾い上げた。畦の際に、小さな芽が一本だけ、まだ残っていた。さっき踏みかけた、あの芽だ。", "彼は、その芽を踏まないよう、静かに一歩横へ足を出した。", "「四天王を呼べ。各種族の安全を確かめてから来いと伝えよ。私は、先に行く」", "「王」", "ハニヤスが、珍しく言葉を重ねた。", "「土は、黙っているが、忘れはせん。あなたが何を選んでも、俺は、あなたの畑に立っている」", "ベルイザナは、振り返らなかった。ただ、片手を軽く上げた。", "収穫祭の卓が、夕陽の中に並んでいる。誰の座る席も、まだ空いたまま。", "風が、稲穂を、低く撫でていった。それは、さっきまでの、収穫を祝う波と、同じ音だった。", "赤い空の下で、魔王は、大穴へ向かって歩き出した。"]}]}, {"id": "plus_ch02", "label": "第二章（加筆）", "title": "静かなる迎撃", "chars": 5214, "sections": [{"h": "一", "p": ["道は、焼けていた。", "風が吹くたびに、灰が舞い上がった。それは兵の鎧の継ぎ目に入りこみ、歩くごとに、かすかにこすれて鳴った。", "根の洲の丘陵は、三日前までは緑だったらしい。今は黒い土と、骨のように立つ木の幹ばかりが続いている。先頭の隊列は、その上を整然と進んでいた。足並みは乱れない。誰も口を利かない。口を利く必要がなかった。", "兵は歩きながら、懐の紙の感触を確かめた。娘への手紙だ。書きかけのまま、三日、書き足せずにいる。", "麻の紙は、三日の行軍で、角が丸くなっていた。畳んだ折り目のところだけ、汗で色が変わっている。取り出して読み返す暇はない。それでも、指で触れて、そこにあると分かるだけで、足が前に出た。", "『戦が終われば、英雄の凱旋で街が祝うそうだ。おまえにも土産を』", "そこまで書いて、止まっていた。次の言葉が出てこない。自分の言葉が、どこかで途切れているような気がした。", "万を超える軍勢だった。長い列は、丘の向こうの谷まで続いている。槍の穂先が、鈍い日を受けて、無数の小さな光を並べていた。旗は、白い。白い布に、青い糸で、見慣れた紋が染められている。誰がいつ決めたのか、兵はもう思い出せなかった。", "朝から、誰も水を飲んでいない。水筒は腰にある。けれど、喉が渇いたと口にする者が、いなかった。渇きは、確かにある。それが、言葉にならないのだった。", "「正義は我らにあり」", "誰かが小さく呟き、周りが頷いた。兵も頷いた。その言葉は、胸のどこかにすっと収まる。昔から自分の考えだったように。", "魔族は、話の通じない者たちだ。だから、これは仕方がない。王様がそう仰った。", "兵は、ふと、思った。", "(話した者が、いるのか)", "魔族と、言葉を交わした者が、この隊に、一人でもいるのか。", "考えが、そこで、途切れた。霧の中に、足を踏み入れたように、先が見えなくなる。すぐに、また、胸のどこかに、あの言葉が、静かに収まった。", "焼けた地には、小さな畑の跡があった。畦が崩れ、苗が炭になっている。兵は、それを見ないようにして歩いた。見なければ、考えずに済んだ。", "畦に沿って、細い溝が残っている。誰かが、毎朝、水を引いていた溝だ。溝の底には、炭になった草が、貼りついていた。", "その向こうに、倒れた鍬があった。柄は半分焼け落ち、刃だけが、赤錆びた色で、土に刺さっていた。"]}, {"h": "二", "p": ["最初に気づいたのは、風だった。", "朝から、ずっと、風は吹いていた。焦げた匂いと、灰と、遠い獣の声を乗せて、東から西へ。兵たちは、その風に背を押されるように、歩いてきた。", "先頭の隊列の前方で、風が止んだ。焦げた匂いを運んでいた風が、ぴたりと。", "旗が、だらりと垂れた。灰が、宙に浮いたまま、降りてこない。", "鳥の声が、なかった。いつから聞こえなくなっていたのか、誰にも分からなかった。", "「止まれ」", "誰かが言った。隊列が止まる。丘の稜線の向こうから、一人の男が歩いてきていた。", "兵は目を細めた。遠くて、顔は見えない。外套の頭巾を被っておらず、黒い髪が風もないのに揺れていた。額の脇に、黒い角。背には、畳まれた黒い翼が見えた。剣は帯びていない。杖も、盾もない。ただ、歩いている。", "足音が、聞こえなかった。", "砂利の道ではない。焼けた土は、乾いて、固く、人の足が乗れば、必ず音を立てる。それなのに、あの男の足は、まるで、影が地面を滑っていくように、何も響かせなかった。", "「……一人か」", "隣の兵が呟いた。声が、わずかに掠れていた。", "「魔族の斥候だろう。囲め」", "隊長の声が飛ぶ。弓兵が前に出て、矢をつがえた。兵は槍を握り直した。掌が汗で滑った。", "命令は、よく訓練された水のように、列の隅々まで届いた。左右の隊が、静かに広がる。槍の柄が、地面に、ごつ、ごつ、と当たる音が、続いた。", "男は、歩調を変えなかった。一歩、また一歩。丘の黒い土を、まるで庭の小道のように。", "兵は、不意に思った。あの男は、畑の畦を踏まないように歩いているのではないか。馬鹿げた考えだった。焼けた丘に、畦などない。", "思ってから、胸のあたりが、妙にざわついた。理由は分からなかった。ただ、その考えが、とても大事なことのような気がした。"]}, {"h": "三", "p": ["矢が放たれた。", "それが、最後の音だった。", "矢は男に届かなかった。届く前に、空中で止まった。止まって、落ちた。乾いた葉が落ちるように。", "矢羽が、一瞬、日の光を受けて、白く光った。それから、ただの木片になって、黒い土に散らばった。", "隊列の最前列で、兵が一人、膝をついた。叫びはなかった。膝をついて、そのまま前に倒れた。倒れた体は、地面に着く前に薄れ、黒い土と区別がつかなくなった。", "もう一人。その隣が、さらにもう一人。", "鎧の鳴る音が、止んでいた。さっきまで、万の足が刻んでいた、規則正しい響きが、波が引くように、遠くから、静かになっていく。", "最前列の者の顔を、兵は、見た。恐怖はなかった。驚きもなかった。ただ、ほんの少し、首を傾げるような表情が、浮かんでいた。まるで、昼寝から覚めた子どもが、まだ夢の続きを探しているときのような。", "手前から順に、静かに、隊列が消えていった。", "整えられた列が、端から、ほどけていく。糸を引き抜かれた布のように。一人が消えると、隣の者の肩が、ほんの少し、空いた隙間のほうへ傾いた。それだけだった。", "男は、歩いていた。手を上げもしない。何かを唱える唇の動きもない。ただ歩き、その歩みの前にいる者が、そこにいなくなる。", "「撃て、撃て！」", "隊長の声は途中で消えた。声の主ごと。", "「撃て」と言いかけた唇の形だけが、兵の目の底に、残った。それは、声より長く、そこにあった。", "兵は槍を構えたまま、足が動かなかった。逃げようと思った。思っただけで、体が言うことを聞かない。恐怖が、体の真ん中を凍らせていた。", "足の裏が、地面に、縫い留められたようだった。膝の骨が、小さく鳴っている。歯が、鳴っている。自分のものだと、気づくまで、少し、かかった。", "隣の兵が、こちらを見た。目が合った。唇が「あ」の形に動いた。次の瞬間、その兵はいなかった。鎧だけが、中身を失って、崩れ落ちるはずだった。それすらなかった。鎧も、剣も、懐の何もかも、跡形もなく。", "風の音だけが残った。", "旗竿が一本、倒れずに立っていた。持っていた手は、もうない。白い旗だけが、風のない空気の中で、ひらり、と一度だけ、揺れた。", "兵は、気づいた。血の匂いがしない。悲鳴がない。何も壊れていない。ただ、人が、いなくなっていく。", "男の顔が、見えた。", "静かな顔だった。怒りも、憎しみも、そこにはなかった。ただ、深く、底のない、凪いだ水面のような。", "その顔を、兵は知らない。それなのに、どこかで見たことがあるような気がした。祭りの夜に、卓の端で酒を飲んでいる誰かの顔に似ていた。そんなはずはない。"]}, {"h": "四", "p": ["「下がれ、下がれ！」", "鋭い声が、混乱を裂いた。", "勇者タケルが、隊列の前に飛び出していた。白銀の鎧が、焼けた空の赤を映している。人間界最強と呼ばれる剣士が、剣を抜き放つ。", "兵たちの間に、息が、戻った。誰かが、名を呼んだ。誰かが、続けた。「タケル様」。ささやきは、波のように、広がった。", "彼は、一度も、負けたことがない。街の子どもなら、誰でも知っている。城壁を越えた大蛇を一太刀で斬った話。山賊の砦を、たった一人で、夜明けまでに片付けた話。どの話も、少しずつ大きくなって、いつしか、神話になった。", "「魔王ベルイザナ！ これ以上の蛮行は許さん！」", "澄んだ声だった。迷いのない声だった。兵は、その声に縋った。あの人がいる。英雄がいる。あの人が、なんとかしてくれる。", "男は、足を止めなかった。", "足は止めない。けれど、速さも変わらなかった。急ぐでもなく、ためらうでもなく、決まった道を、決まった速さで、ただ、歩いていく。", "タケルが踏み込んだ。剣が、閃いた。人間界最強の一撃が、まっすぐに男の首筋へ向かう。", "地面が、鳴った。踏み込みの音だけが、その場に、生きていた。", "届かなかった。", "剣が男の外套に触れる寸前で、タケルの膝が折れた。力が抜けたように、がくりと地面に沈む。剣が手から離れ、からんと音を立てて転がった。", "「な……」", "タケルが顔を上げた。目に、初めて困惑が浮かんだ。何をされたのか、分かっていない。", "白銀の鎧の肩が、上下に、荒く揺れていた。汗が、顎を伝って、黒い土に落ちた。焼けた地面は、その一滴を、音もなく、吸った。", "男は、タケルを見下ろした。何も言わなかった。", "憎しみも、誇りも、そこにはなかった。見下ろす目は、あまりに静かで、タケルは、その静けさのほうが、斬られるより、恐ろしいと思った。", "その後ろで、参謀格らしい男たちが、次々と膝をついていく。誰も悲鳴を上げなかった。立っている者の数が、減っていく。", "白い外套の裾が、黒い土に、ふわりと広がった。祈りの印を結びかけた指が、途中で、解けた。杖を握っていた者の手から、杖が、からりと転がった。", "兵は、槍を取り落とした。", "視界が、白くなっていく。恐ろしいとは、もう思わなかった。ただ、手紙のことを思った。書き足せなかった、続きのことを。", "光ではない。霧でもない。もっと柔らかくて、とても遠い、白だった。冬の朝に、窓の外に降りていた、あの色に似ていた。", "足元の黒い土が、消えた。槍の重みが、消えた。鎧の冷たさが、消えた。残ったのは、懐の紙の、わずかな温度だけだった。", "土産は、何がいいだろう。娘の好きな菓子を、買って帰ろう。この戦が終わったら、街で、一番いい店で。", "あいつは、甘いものが好きだったから。", "娘に――"]}, {"h": "五", "p": ["ミカヅチが丘の稜線に立った時、戦場は静まり返っていた。", "鬼族の戦士たちは、稜線の手前で、足を止めさせた。ここから先へは、頭領だけでいい、とミカヅチは言った。若い鬼が、何か言いかけて、やめた。頭領の顔が、いつになく、硬かったからだ。", "息が止まった。", "視界の端から端まで、何もなかった。焼けた黒い土の上に、足跡さえ残っていない。鎧の破片も、折れた槍も、血の染みも。万を超えていたはずの軍勢が、最初からそこにいなかったかのように、消えていた。", "風が吹いている。何も運ばない風が。", "ミカヅチは、鬼族の頭領として、数え切れない戦場を見てきた。屍の山も、血の川も知っている。だが、これは違った。何もない。何もないことが、これほど恐ろしいとは知らなかった。", "一騎討ちの記憶が、蘇る。全てをぶつけ、一撃を受けきった。あの時、王は手加減をしていた。受けきれる一撃を選んでいた。今なら分かる。あれが、王の本気であるはずがなかった。", "「……王」", "呼びかけは、掠れた。", "戦場の中央に、ベルイザナが立っていた。背を向けている。その足元に、六つの影が膝をついていた。白銀の鎧の勇者と、参謀格の者たち。生きている。息をしている。立ち上がる力だけが、奪われていた。", "ミカヅチは、ゆっくりと歩み寄った。足音が、やけに大きく響く。", "一歩ごとに、焦げた土が、靴の底で、小さく砕けた。その音のほかには、何も聞こえない。風さえ、遠慮して、息を殺しているようだった。", "「避難は終えました。各族とも、無事です」", "「そうか」", "ベルイザナの声は、平らだった。振り返らない。", "「ご苦労だった」", "その一言に、ミカヅチは、言葉を失った。礼を言われたことに、ではない。声に、何の色もないことに。魔界の民を、一人の例外もなく気にかける王の声から、温度だけが抜けていた。", "足元のタケルが、顔を上げた。唇を噛み、血を滲ませ、それでも目に力を残している。", "六つの影は、誰も、立ち上がろうとはしなかった。立てないのだ、とミカヅチは気づいた。膝が、あるべき力の置き場所を、見失っている。", "どの顔にも、傷はない。血もない。ただ、全員が、同じ表情をしていた。何が起きたのか、まだ、理解できていない顔を。", "「殺せ。魔王」", "タケルは、まっすぐに言った。", "「俺は、お前を許さない。殺せ」", "ベルイザナは、タケルを見下ろした。長い間、何も言わなかった。", "風が、一度だけ、二人の間を通り抜けた。灰が、ひとひら、タケルの肩に落ちた。払う者は、いなかった。", "「殺さぬ」", "やがて、言った。", "「おまえたちには、聞きたいことがある。命を取るのは、それが済んでからだ」", "「俺は何も話さん」", "「それでよい」", "ベルイザナは、初めて振り返った。ミカヅチを見て、静かに告げた。", "「この者たちを、捕らえてくれ。傷つけるな。飢えさせるな。必要なものは与えろ」", "「……は」", "ミカヅチは頭を下げた。顔を上げる時、見てしまった。", "ベルイザナの右手が、外套の陰で、小さく震えていた。", "怒りか、悲しみか、あるいは別のものか。ミカヅチには分からなかった。ただ、その震えが、先ほどまでの静かな恐ろしさとは別の何かを語っているように思えた。", "震えは、すぐに止まった。ベルイザナは手を握り込み、何事もなかったように、焼けた根の洲の丘を見渡した。", "遠くで、鴉が一羽、鳴いた。", "その声は、長く尾を引いて、焼けた丘の向こうへ消えた。", "あとには、黒い土と、風と、二人の影だけが、残った。"]}]}, {"id": "plus_ch03", "label": "第三章（加筆）", "title": "問うても答えぬ者", "chars": 4880, "sections": [{"h": "一", "p": ["目を覚ますと、天井が低かった。", "石の天井には、細い亀裂が、一本、斜めに走っていた。その亀裂を、タケルは、ぼんやりと目で追った。赤い光が、亀裂の端だけを、細く照らしている。", "タケルは石の床に横たわったまま、しばらく動かなかった。体のどこにも縄がない。鎖もない。腕を動かすと、肩に布が巻かれているのが分かった。誰かが、傷を手当てしている。", "(死んでいない)", "次に思ったのは、それだった。魔王の前で膝をついたところまでは覚えている。その先は白い。", "牢は狭いが、清潔だった。窓は高く、赤い光が細く差している。床には藁の寝床があり、隅には水の入った甕が置かれていた。毒かもしれない、と疑って、タケルは水に手を触れなかった。", "壁の石は、冷たく乾いていた。黴の匂いはなく、かすかに、薬草を焚いたような香りが漂っている。鉄の格子には錆がなく、よく磨かれていた。誰かが、この牢を、毎日、掃除している。", "扉の小窓が開いた。鬼の顔が覗いた。額に二本の角があり、牙が口の端から覗いている。", "「起きたか。飯だ」", "差し入れ口から、盆が滑り込んできた。湯気の立つ粥と、焼いた根菜と、干し肉が一切れ。", "「毒など入れておらん。入れるつもりなら、寝ている間にやっている」", "鬼は無愛想に言った。", "「飢えさせるなとの王命だ。食え」", "タケルは盆を見つめた。魔族は話の通じない者たちだ。人を食らい、嘲り、約束を踏みにじる。そう聞いてきた。王が、そう仰った。", "目の前の粥は、ただ温かかった。", "腹が鳴った。タケルは唇を噛み、それでも盆を引き寄せた。一口食べると、米の甘みがあった。それが、ひどく悔しかった。", "音は、牢の中で、思いのほか、大きく響いた。タケルは、赤くなった。誰に見られているわけでもないのに。", "温かさが、喉を降りて、胃の底に、静かに落ちた。三日、何も口にしていなかったのだと、そのとき、はじめて分かった。", "「……礼は言わん」", "「いらん。王命だ」", "鬼は小窓を閉めかけて、少し止まった。", "「だが、残さず食うのは感心だ。鬼族では、食い物を残す奴は弱いと言う」", "小窓が閉まった。タケルは粥の椀を、最後の一粒まで空にした。"]}, {"h": "二", "p": ["二日目の夜に、男が来た。", "牢の廊下には、松明が、一定の間隔で灯されている。揺れる炎の影が、格子の縞模様になって、石の床に伸びていた。", "足音は、ほとんどしなかった。牢の前に立ったのは、黒髪の静かな男だった。額の脇に、黒い角が二本。背には、畳まれた黒い翼。それでも、顔だけを見れば、人間と変わらない。ただ、その男の周りだけ、空気の密度が違った。", "魔王ベルイザナ。戦場で、タケルを膝から折った男だ。", "全身の筋が、思わず、固くなった。体が、あの白い日を、覚えている。膝が折れたときの、力の抜けていく感覚を。", "「傷は痛むか」", "最初の言葉が、それだった。タケルは顔を上げ、睨みつけた。", "「何の用だ。殺すなら、早くしろ」", "「聞きたいことがある」", "ベルイザナは、牢の格子の前に腰を下ろした。見下ろさない位置だった。", "「なぜ和平の席で、刃を抜いた」", "「あれは、魔族が先に仕掛けた。王様はそう仰った」", "「会談の間で、先に動いたのは人の軍勢だった」", "「嘘だ。魔族は話の通じない者たちだ。約束を守らず、人を欺く。だから――」", "タケルの言葉は、そこで途切れた。", "自分の声が、遠くから聞こえた。喉を通っているのは自分の言葉のはずなのに、どこかで誰かが同じ言葉を繰り返しているような。", "ベルイザナは、黙っていた。責めもせず、遮りもせず、ただ聞いていた。", "松明が、ぱち、と小さく爆ぜた。その音さえ、遠く聞こえた。", "「……魔族は、話の通じない者たちだ」", "もう一度、言った。今度は、さっきより声が小さかった。", "目の前の男は、話が通じていた。傷を気遣い、座って、目を合わせて問う。食事は、残さず食べろと言われた。看守は無愛想だが、殴ってこない。", "(おかしい)", "その言葉が浮かんだ瞬間、胸の奥で何かが締まった。頭の奥に、細い痛みが走る。考えるな、と別の声が言った。それは自分の声のようで、そうでなかった。", "ベルイザナは、タケルの顔をじっと見た。", "「今日はここまでだ。また来る」", "立ち上がる気配に、タケルは思わず言った。", "「おまえ……どこかで」", "「何だ」", "「いや」", "タケルは首を振った。黒髪の男の顔に、なぜか引っかかるものがあった。見たことがある気がする。いつ、どこで。戦場ではない。もっと違う、何かの。", "答えは出なかった。男は静かに去り、足音は闇に溶けた。"]}, {"h": "三", "p": ["ナキメは、牢の格子の外に椅子を置いて座っていた。", "黒い羽が、椅子の背で、ゆるやかに畳まれている。鴉族の長は、膝の上に、小さな香炉を置いていた。薄い煙が、細く、天井へ昇っていく。", "鴉族の長として、数え切れない言霊を扱ってきた。特に、心に触れる術には自信がある。呪文系言霊で魔界随一と言われるのは、伊達ではない。", "「痛みはありませんか。少し、中を見せていただきます」", "「やめろ」", "「やめません。これは、あなたのためでもあります」", "ナキメは指先を軽く動かし、朧を細く紡いだ。相手の意識の輪郭をぼかす言霊だ。強いものではない。扉を叩く程度の、挨拶のような。", "タケルの目が、わずかに揺らいだ。", "(入った)", "ナキメは息を詰めた。心の表層は、柔らかかった。善良で、真っ直ぐで、不器用な。人を疑うことを知らず、疑われることを恐れる。そういう手触りがある。", "触れれば、温かい。幼い頃に、母に聞いた物語や、町の祭りの笛の音や、友と分け合った菓子の甘さ。そういうものが、いくつも、いくつも、積もっていた。ナキメは、そっと、それらを避けて進んだ。踏み荒らしたくなかった。", "その奥に、硬い層があった。", "(これか)", "王の言霊は、薄い膜のように心を覆っていた。ただ覆っているのではない。膜は根を伸ばし、タケルの善良さそのものに絡みついていた。「正義を信じたい」という願いを足場にして、そこから「魔族は悪だ」という考えを育てている。", "名暴きを、細く差し入れた。偽りの名を剥がす言霊だ。洗脳の核を見つけて、緩めることができるかもしれない。", "その瞬間、強い反発が返ってきた。", "タケルの体が跳ねた。喉から、本人のものではない声が漏れる。", "「――魔族は、話の通じない者たちだ」", "ナキメは、すぐに言霊を引いた。額に汗が滲んでいた。", "「……失礼しました。今日はここまでにします」", "タケルは息を荒げ、牢の隅へ後ずさった。目に、恐怖が浮かんでいる。ただし、ナキメに向けてではなかった。自分の口が勝手に動いたことへの、恐怖だった。", "(自覚はある。解ける余地は、ある)", "ナキメは立ち上がり、静かに頭を下げた。", "「少しずつやります。あなたを、傷つけたくはない」", "タケルは、何も言わなかった。ただ、目だけが、揺れていた。"]}, {"h": "四", "p": ["居城の広間は、夜になると冷える。", "高い天井に、松明の煙が溜まっている。柱の影が、床の上で、長く、斜めに伸びていた。", "ナキメは、ベルイザナの前に膝をついていた。膝が、わずかに震えているのが自分で分かる。この王の前に立つと、いつもそうだ。底が見えない。見えないのに、嘘がない。その矛盾が、体を震わせる。", "「報告します」", "声は、震えなかった。震わせなかった。", "「王の言霊は、心の奥深くに根を張っています。無理に剥がせば、本人の心が壊れかねません。この者の善良さを足場にして、成長している。善人ほど、深く染まります」", "「解けるのか」", "「解けます。ただし、時間がかかります。数か月は見ていただきたい」", "ベルイザナは、頷いた。", "「急がずともよい。壊すな」", "「承知しました」", "ナキメは、少し迷ってから、言葉を足した。", "「一つだけ。綻びを作ること自体が、王への合図になる危険があります。言霊の根は、遠くの術者に繋がっているように感じました。解こうとするほど、向こうに気づかれるかもしれません」", "「気づかれたら、どうなる」", "「分かりません。ただ、備えはしておきます」", "ベルイザナは、ナキメの顔を見た。長い間、何も言わなかった。", "「おまえは、嘘を使わずに報告したな」", "「……はい」", "「感謝する。助かった」", "ナキメは、深く頭を下げた。顔を上げられなかった。震えは、まだ止まっていない。ただ、それは恐れだけの震えではなかった。"]}, {"h": "五", "p": ["黄泉津の宮の露台は、夜風が強い。", "遠くの空では、雲が、赤く縁取られて流れていく。眼下の城下町には、灯りが、まばらに残っていた。昼間の喧噪は、すっかり静まっている。", "ベルイザナは手すりに肘をつき、赤い夜空を眺めていた。耳元に、声が届く。言伝の言霊だ。", "「ベルイザナ様。人間界へ自ら赴くなど、お考え直しください」", "オモイカの声だった。傷が癒えきらず、少し掠れている。", "「危険すぎます。人の王は、狡猾です。魔王が一人で乗り込めば、どんな罠が待つか。四天王を連れていく手も――」", "「連れていけば、潜入にならない」", "「それは、そうですが」", "「オモイカ」", "ベルイザナは、静かに呼んだ。", "「おまえが失った者たちの顔を、私は知らない」", "通信の向こうで、息を呑む気配がした。", "「おまえは、一人ひとりを覚えていた。家族も、好物も。私は、彼らの顔を知らなかった。名前も、一人も呼べない。王でありながら」", "「それは……あなたのせいでは」", "「人間の顔も、知らなかった」", "ベルイザナは、手すりを握った。指の関節が白くなる。", "「戦場で、私は何千人も消した。顔を見なかった。見ようとしなかった。あれが、人だったのかどうか。私は、知らないまま、殺した」", "返事はなかった。夜風が、露台の灯を揺らした。", "灯の揺れが、ベルイザナの影を、手すりの上で、大きくしたり、小さくしたりした。", "「牢のタケルは、粥を残さず食べる。看守に、礼を言いかけて飲み込む。あれは、魔族が思い描く『人間』と、まるで違う」", "「それは、洗脳の――」", "「分かっている。だが、洗脳されているのはあの男だけではあるまい。街にも軍にも、いるはずだ。ならば、私が滅ぼそうとしているものは何だ」", "沈黙が、長く続いた。", "オモイカが、小さく息を吐いた。", "「……ベルイザナ様の、お考えは分かりました」", "「反対か」", "「反対です。今でも」", "オモイカの声は、少しだけ笑っていた。", "「ですが、あなたは、一度決めたら変わらない方です。ならば私は、最悪の場合を考えます。人間界での名、力の抑え方、通信の取り方。全て詰めましょう」", "「感謝する。おまえには助けられてばかりだ」", "「申し訳ありません、私は――」", "「それより」", "ベルイザナは、言葉を遮った。穏やかな声だった。", "「次の手を、聞かせてくれ」", "通信の向こうで、オモイカが、小さく、確かに息を詰めた。それから、静かに答えた。", "「……はい。まず、名からです」"]}, {"h": "六", "p": ["夜が明ける前に、方針は固まった。", "露台には、いつの間にか、冷たい霧が降りていた。手すりに置いた手が、しっとりと濡れている。", "偽りの名を、使う。まことの名を伏せ、「ベル」と名乗る。短く、ありふれた響きだ。まことの名が名付けと支配の力を持つ世界では、偽名にも弱い言霊が宿る。印象を薄め、記憶に残りにくくする。", "力は、抑える。人間界で最強と言われるタケルと、同じ程度まで。それでも、並の冒険者よりは遥かに強い。ただ、使うほど気配が漏れる。", "四天王には、「下見」と告げる。本当のことは、言わなかった。言えば、止められる。止められないとしても、危険だと言われる。", "(本心は、人間を知りたい)", "露台の上で、ベルイザナは、その言葉を自分にだけ認めた。", "滅ぼすために行くのではない。見に行くのだ。あの牢の男が、どんな世界で育ったのか。畑を踏んで進んだ兵が、どんな家に帰るはずだったのか。", "夜明けの光が、赤い空の端を薄く染めていく。黄泉の空は、朝でも赤い。それでも今朝は、少しだけ、澄んで見えた。", "鴉の群れが、遠くの塔から、ゆっくり飛び立った。羽音が、朝の空気の中に、細く尾を引いた。", "遠く、比良坂の方角に、細い光の筋が立っている。大穴の底から、世界の中心から、昇る光だ。", "ベルイザナは、その光を、長く見つめた。", "(私の名は、ベル。ただの冒険者だ)", "声に出さずに言ってみた。まだ、自分のものではない響きだった。", "それでも、いつか馴染むだろう。そう思えたことが、昨日までの自分との、小さな違いだった。"]}]}, {"id": "plus_ch04", "label": "第四章（加筆）", "title": "荒れ地の道（五）", "chars": 2858, "sections": [{"h": "五", "p": ["街を出て二刻ほど歩くと、道は荒れ地に入った。", "石畳は、いつの間にか踏み固めた土に変わり、その土も、少しずつ砂利に削られていった。道の両側に続いていた畑の畝は途切れ、かわりに、背の低い草と、白っぽい岩が、ぽつりぽつりと現れた。港の潮の匂いは、もう届かない。乾いた風が、草の根元を鳴らしていた。", "荷は、オオナムチが背負った。ベルが半分持つと申し出たが、断った。初めての依頼だ。自分の足で運びたかった。", "背中の荷は、思ったより重かった。薬草の包みは軽いが、塩の袋が肩に食いこむ。布の反物は、歩くたびに、腰のあたりで揺れた。紐の結び目が、外套の継ぎ当てに引っかかる。オオナムチは、歩きながら何度も背負い直した。", "ベルは、半歩後ろを、黙って歩いていた。足音が、ほとんどしなかった。", "(静かな人だな)", "オオナムチは、そう思った。同行を申し出たくせに、道中、ほとんど話しかけてこない。かといって、気詰まりな沈黙ではなかった。風の音と、自分の足音と、時々、荷の紐のきしむ音。そこに、もうひとつの気配が、静かに混じっているだけだった。", "太陽が、真上に近づいた。影が、足元に縮まっていく。", "道の先に、ひとかたまりの岩場が見えた。大きな岩が、折り重なるように積まれ、その隙間に、濃い影が溜まっている。", "ベルの足が、わずかに止まった。", "オオナムチは、気づかなかった。ただ、ふと、風の音が、変わった気がした。草が鳴らなくなった。鳥の声も、いつの間にか、途切れている。", "荒れ地の岩陰から、唸り声が聞こえたのは、日が高くなったころだった。", "低く、喉の奥で擦れるような音だった。ひとつではない。重なって、ゆっくりと、近づいてくる。", "オオナムチの体が、固まった。短剣の柄に手をかける。指が、細かく震えていた。革の握りが、掌の汗で滑る。", "「出ましたね」", "低い声で、ベルが言った。", "驚いた様子は、なかった。まるで、天気の話でもするような声だった。", "岩の陰から、野犬が三匹、姿を現した。痩せて毛が荒れているが、牙は鋭く、目が飢えている。あばらの形が、毛皮の上から数えられた。一匹が、じりじりと間合いを詰めてくる。残る二匹は、左右に広がり、こちらの退路を、静かに塞いでいった。", "(やるしかない)", "オオナムチは、短剣を抜いた。足が、地面に張りついたように重い。呼吸が浅い。頭の中が、白くなる。", "訓練で習ったことも、集落で見聞きしたことも、すべて、どこかへ飛んでいた。残っているのは、荷を落としてはいけない、という、場違いな考えだけだった。", "その時、不意に、口が動いた。", "「――堅め」", "自分でも驚いた。教わったことなどない。ただ、集落の年寄りが、子どもの頃に、木の実を取りに行く時に唱えさせてくれた短い言葉だった。身を守る、おまじない。まことの名を呼べば、誰でも基礎の力は引き出せる。", "体の周りに、薄い膜のような感触が走った。守りの言霊が、立ち上がった。", "膜は、薄く、頼りなかった。けれど、肌の外側に、確かに、もうひとつの皮があった。風が、少し、遠くなった。", "野犬が、飛びかかってきた。", "灰色の塊が、一直線に、迫った。オオナムチは、思わず目を細めた。", "オオナムチは、短剣で払った。刃が毛を掠めただけで、犬は怯まない。着地した足が、砂利を蹴り、二匹目が、脇から回り込んでくる。牙の間から、白い息が洩れていた。", "(だめだ、囲まれる)", "視界の端で、ベルが動いた。", "ベルは、剣を抜かなかった。ただ、一歩だけ、足を出した。それだけで、三匹目の犬の軌道が、わずかに逸れた。犬は、勢いのまま岩に当たり、悲鳴を上げて転がった。", "乾いた音が、岩場に響いた。", "オオナムチは気づかなかった。目の前の犬に、必死だった。", "左腕に、衝撃が走った。牙が食い込み、堅めの膜が軋む。痛みで視界が滲んだ。犬の顎の力が、骨まで届く。熱い唾液が、袖を濡らした。", "「うわっ……!」", "「落ち着け。膜は破れていない」", "ベルの声が、すぐ後ろから聞こえた。落ち着いた声だった。あまりに落ち着いていて、オオナムチは、一瞬、痛みを忘れた。", "「痛みの形を、思い浮かべろ。それを、癒やしてくれと願うんだ」", "「癒やし、って、そんな、いきなり」", "「できる。そなたは、もう守りの言霊を出している。同じ力の、反対の側だ」", "オオナムチは、歯を食いしばった。腕の痛みを見る。牙の跡。滲む血。袖の下で、脈が、どくどくと打っているのが分かった。それを、元の形に戻してくれと、願った。", "(戻れ。……戻ってくれ)", "「――癒やし」", "ふわりと、温かいものが腕を包んだ。春先の陽だまりに、手を差し入れたような温度だった。傷口は完全には塞がらなかったが、血が止まり、痛みが引いた。", "犬が、一匹、怯んだように後ずさった。二匹目も、足を止める。", "ベルが、一歩、前に出た。", "何をしたのか、オオナムチには分からなかった。ベルは、剣を抜かず、ただ、野犬たちを静かに見ただけだ。背が高いわけでも、声を荒げたわけでもない。それなのに、三匹の犬は、尾を巻いて、岩場の向こうへ逃げ去った。足音が、遠ざかっていった。", "荒れ地に、風の音が戻った。", "草が、また、さわさわと鳴った。遠くで、鳥が、一声鳴いた。", "オオナムチは、その場に座り込んだ。足から力が抜けていた。短剣を握る手は、まだ震えている。指を開こうとしても、すぐには開かなかった。", "「やった……のか、俺が」", "「そなたが守り、癒やした」", "ベルは、静かに言った。", "「よい動きだった」", "オオナムチは、顔を上げた。嬉しい、と思った。同時に、不思議に思った。最後の一撃を、自分は放っていない。それでも、ベルは、自分の手柄のように言ってくれた。", "ベルは、背を向けたまま、息を整えていた。", "(危なかった)", "力を抑えるのが、これほど難しいとは思わなかった。ほんの一歩、足を出しただけで、野犬は、必要以上に吹き飛びかけた。軌道を逸らすだけにとどめるのに、神経を使い果たした。掌の内側に、嫌な汗が、滲んでいた。", "魔界では、力は、示すものだった。示せば、争いは起きずに済んだ。ここでは、逆だ。隠さなければ、守れない。", "それでも、収穫はあった。", "オオナムチは、教わらずに堅めを唱えた。誰に導かれたのでもなく、ただ、守りたいという願いが、そのまま言霊になった。癒やしも、一度の助言で形にした。", "(才がある)", "血統ではない。努力の積み重ねでもない。もっと、素朴な、人を守りたいという性質そのものが、言霊を呼んでいる。", "オオナムチの腕の傷を、ベルは見た。左腕に、牙の跡が残っている。袖には、血と泥が、まだらに染みていた。", "(私がいなければ、致命傷になっていたかもしれない)", "守る側に立つというのは、こういうことか、とベルは思った。力を抑えながら、相手が傷つきすぎないように、気づかれない場所で動く。魔界で、民を守る時には、考えもしなかった。力を見せることでしか、守ったことがなかった。", "岩場の向こうで、風が、小さく渦を巻いた。さっきの犬たちの足跡が、砂の上に、点々と残っている。それは、すぐに、風に消された。", "「行くぞ。日が暮れる」", "振り返ったベルは、できるだけ穏やかな声で言った。"]}]}, {"id": "plus_ch06", "label": "第六章（加筆）", "title": "炉の火は消えず", "chars": 7262, "sections": [{"h": "一", "p": ["炉ヶ岳の山道は、足の裏から熱が伝わってくる。", "道は、黒い岩を削って作られていた。ところどころに、煤のこびりついた石段がある。足を乗せるたびに、靴底を通して、山の底の熱が、じわりと上ってきた。道の脇の割れ目からは、白い湯気が、細く立ち昇っている。硫黄の匂いが、風の向きによって、濃くなったり薄くなったりした。", "オオナムチは、背の荷を揺すり上げた。ミナモのギルドで受けた依頼は、鉱山の里への資材運搬だった。鉄の延べ棒と炭の袋が、肩に食い込む。隣を歩くベルは、同じ量を背負いながら、息ひとつ乱していない。", "「重くないんですか」", "「重い。顔に出ないだけだ」", "嘘だろう、と思ったが、オオナムチは黙って足を進めた。", "山の中腹を越えると、谷間に里が見えた。岩肌に張りつくように、石造りの工房が並んでいる。どの煙突からも、白い煙が上がっていた。金槌の音が、谷じゅうに響いている。一定の拍で、休みなく。", "谷は、赤く、揺らめいていた。夕暮れの光ではない。無数の炉の火が、岩肌の窓という窓から漏れて、谷全体を、内側から染めているのだった。煙突の煙が、幾筋も、天に向かって立っていた。", "(音は元気なのに)", "里に入ると、すぐに分かった。槌を振る職人たちの腕は力強いのに、目の下に、深い隈がある。誰も笑っていない。背の低いがっしりした体格のドワーフたちが、口を結んで、黙々と鉄を打っている。", "石畳の路地の両側に、工房が、ぎっしりと並んでいる。軒先には、打ち上がったばかりの鍬や鎌が、束になって吊るされていた。それは、いつもの炉ヶ岳の風景だったのかもしれない。ただ、その中に、笑い声が、ひとつもなかった。", "「荷はそっちだ。そこに降ろせ」", "素っ気ない声が、頭の上から降ってきた。", "見上げると、工房の入口に、若い女が立っていた。煤で黒くなった前掛けに、太い腕。短く刈った赤茶の髪が、汗で額に張りついている。人間の娘にしては背が低く、肩幅が広い。ドワーフだ。", "「聞こえなかったか。そこだ」", "「あ、はい」", "オオナムチは、荷を降ろした。女は、腕を組んだまま、冷たい目で二人を見下ろした。", "「人間の冒険者か。悪いが、今日は愛想よくしてやる余裕がない。降ろしたら、さっさと帰りな」", "「カナメ、客人に失礼だぞ」", "奥から、低い声がした。", "工房の暗がりから、赤い髭を胸まで垂らした老人が、ゆっくりと出てきた。背は低いが、山のような存在感がある。腕は丸太のように太く、皺だらけの掌は、鉄の色に染まっていた。", "「イシコリドメだ。この里を預かっている」", "「オオナムチです。こちらはベル」", "「そうか。遠いところを、ご苦労だった。今夜は泊まっていけ。山の夜は冷える」", "老人の声は、静かで、深かった。ただ、その目は、オオナムチたちを通り越して、遠くの何かを見ていた。", "(この人も、疲れている)", "炉の火が、里のあちこちで、赤く燃えていた。その熱気の中で、誰もが、火の番をするように、黙って働いていた。", "夕餉の煙の匂いが、風に混じっていた。けれど、どの家の窓にも、食卓を囲む影は、ほとんどなかった。誰もが、炉のそばで、立ったまま、黙々と、何かを口に運んでいる。"]}, {"h": "二", "p": ["納品の日は、朝から空気が違った。", "谷に霧が降りていた。いつもなら、夜明けとともに響く槌の音が、その朝は、一斉に止んでいた。誰もが、何かを待つように、工房の戸口に立っていた。", "カナメは、工房の前に並べた刃を、布で磨いていた。百本の剣。三十領の鎧。期限は今日の昼で、一本も欠けてはならない。", "(百本。こんな数、人の手で打てるものか)", "それでも、打った。里中の職人が、三晩、寝ずに打った。祖父も、炉の前に座り続けた。腕が、痺れて上がらなくなるまで。", "蹄の音が、谷に響いた。", "それは、乾いた、規則正しい音だった。里の者たちの、疲れた足音とは、まるで違う。霧の向こうから、白い影が、いくつも、近づいてきた。", "馬に乗った官吏の一行が、里の門をくぐった。白い官服の男が先頭に立ち、後ろに兵が二十人。その中に、書類を抱えた中年の男がいた。落ち着いた目の、地味な顔立ちの男だ。検品官だと、聞いている。", "「イシコリドメ殿。戦時特別発注の納品を、受け取りに参りました」", "官吏は、馬上から、笑顔で言った。", "「期日は今日。数量は、百と三十。間違いありませんな」", "「揃えてある」", "イシコリドメは、短く答えた。", "「結構。ただし、追加のご連絡が」", "官吏は、懐から巻物を取り出した。", "「次の発注は、倍になります。期限は、十日後」", "カナメの手が、止まった。", "「倍だと」", "誰かが、呟いた。工房の影から、職人たちが、ざわめいた。", "「無茶だ。今でさえ、限界だ」", "「限界かどうかは、こちらで判断します」", "官吏の笑みは、少しも崩れなかった。", "「お断りになる場合は、残念ですが、炉ヶ岳との交易を停止せざるを得ません。鉄も、炭も、食糧も、止まります。里の皆様が、困りますな」", "カナメは、拳を握った。", "爪が、掌の皮に、食いこんだ。炉の煤で黒くなった指の関節が、白く浮き上がる。喉の奥まで出かかった言葉を、無理やり、飲みこんだ。飲みこんだ言葉は、胃の底で、鉛のように、冷えた。", "(ふざけるな。頼んでいるふりをして、首を絞めているだけじゃないか)", "怒鳴りたかった。刃を叩きつけたかった。けれど、祖父は、動かなかった。", "イシコリドメは、赤い髭の下で、口を結んだまま、しばらく官吏を見つめていた。長い沈黙のあと、静かに、頭を下げた。", "「承知した」", "その背中が、カナメには、ひどく小さく見えた。"]}, {"h": "三", "p": ["夕暮れの工房で、カナメは、祖父の前に立ちはだかった。", "炉の火が、壁に、二人の影を、大きく映していた。影は、火の揺れに合わせて、伸びたり、縮んだりした。工房の隅では、冷えた刃の山が、闇の中で、鈍く光っていた。", "「なぜ受けたの」", "声が、震えた。", "「倍だよ。十日で、倍。里の誰かが倒れる。倒れなくても、腕が壊れる。それでも、頭を下げるの」", "祖父は、炉の前に座っていた。火に照らされた横顔は、岩のように動かない。", "「答えて」", "「……」", "「戦いたくないの。私たちは、ただの道具なの。人間に命令されて、人間の戦のために刃を打つ。それが、誇りなの」", "「カナメ」", "祖父が、やっと口を開いた。", "「炉に、薪を足してくれ」", "「話を逸らさないで」", "「頼んでいる」", "その声には、怒りも、言い訳もなかった。ただ、疲れ果てた老人の、静かな響きがあった。カナメは、唇を噛んで、薪を取った。", "炉の火が、ぱちりと爆ぜた。", "祖父は、火を見つめたまま、何も言わなかった。カナメは、その背中を睨みつけた。", "(私は、こんな腰抜けにはならない)", "そう思った。思って、すぐに、胸の奥が、きゅっと痛んだ。祖父の手が、わずかに震えていたことに、気づいてしまったからだ。"]}, {"h": "四", "p": ["納品された武具が、広場に並べられた。", "石畳の上に、白い布が敷かれ、その上に、剣が、一本ずつ、きちんと並べられた。刃先は、すべて、同じ向きを向いている。朝の霧は晴れて、冷たい光が、鋼の表面に、細い線を引いていた。", "官吏たちが検品を始めるまで、少し間がある。ベルは、その隙に、並べられた剣の一本を手に取った。", "重さは、申し分ない。刃の曲線も、美しい。里の職人の腕は、確かだ。ただ、柄を握った瞬間、指先に、妙な感触が走った。", "(これは)", "冷たい、薄い膜のようなものが、刃の表面に、貼りついている。鍛冶の工程で生まれたものではない。後から、誰かが、上から塗り重ねたものだ。", "ベルは、静かに息を整えた。言霊の質を、探る。細く、粘りのある、穏やかな響き。甘言と刷り込みの手触り。", "(アマツ王)", "間違いない。王の言霊が、この剣に、刻まれている。握る者の心に、少しずつ染み込み、反魔族の思想を深めていく仕掛けだ。", "(ここで口にすれば、里が危ない)", "力を使えば、阻害ゲージが削れる。見抜いたことが官吏に知られれば、ドワーフ全体が疑われる。ベルは、剣を元に戻し、別の方法を探した。", "隣で荷を整理していたイシコリドメに、ベルは、声をかけた。", "「少し見ていただけぬか」", "「何だ」", "「この刃だ。素人の目だが」", "ベルは、剣の刃を、光に傾けた。", "「職人の仕事は見事だ。ただ、表面だけ艶が違う。鍛えの艶ではない。何かが上から足されているように見える」", "イシコリドメの目が、細くなった。", "「どういう意味だ」", "「私には分からぬ。ただ、そう見える」", "老人は、剣を受け取った。親指で、刃の表面を、ゆっくりとなぞる。何度も、何度も。やがて、その指が、止まった。", "ベルは、何も言わず、一歩、下がった。ここから先は、職人の仕事だ。"]}, {"h": "五", "p": ["イシコリドメの手の中で、剣が、小さく鳴った。", "(違う)", "指の腹が、告げていた。自分が打った刃ではない。いや、刃そのものは、自分たちの仕事だ。だが、その上に、薄く、別の何かが、貼りついている。", "火で焼き入れる前の、素地の感触を知っている。研ぎ上げた後の、鏡のような手触りも知っている。この膜は、そのどちらにも、属さなかった。", "(術師の細工か)", "視線を上げた。広場の隅で、官吏の連れた術師らしい男たちが、納品された剣に、手をかざしていた。唇が、小さく動いている。", "胸の奥で、何かが、煮え立った。", "怒りだった。五十年、鉄を打ってきた。里の者も、皆、そうだ。一本の刃に、命を懸ける。使う者の命を預かる品だと、知っているからだ。それを、人を染める道具に、作り替えている。", "(儂らの仕事を、何だと思っている)", "拳が、剣の柄を、きしむほど、握りしめた。", "その夜、イシコリドメは、炉の前から動かなかった。", "火を見つめた。赤い炎が、ゆらめく。五十年、この火と、生きてきた。里の者の暮らしも、この火の上に、立っている。", "断れば、交易が止まる。炭も、食糧も、途絶える。里の子どもたちが、飢える。受ければ、人を染める刃を、世に送り出すことになる。", "(どちらを選んでも、地獄だ)", "朝まで、炉の火は、静かに、揺れていた。", "夜明け前、イシコリドメは、立ち上がった。", "「皆を集めろ」", "工房の前に、職人たちが集まった。カナメも、眠そうな目で、立っていた。", "「刃に、細工があった」", "イシコリドメは、低く、言った。", "「官吏と術師が、儂らの打った剣に、言霊を足している。使う者を染める、悪い術だ」", "職人たちが、ざわついた。", "「ならば、納めるな」", "「そうだ、もう一本も打つな」", "「待て」", "イシコリドメが、片手を上げた。ざわめきが、止まる。", "「断れば、里が潰れる。それは、お前たちも分かっているはずだ」", "誰も、答えなかった。", "「だから、作る」", "老人は、ゆっくりと、言った。", "「頼まれた品質では、作る。だが、人を染める道具には、せん」", "「どういう、意味だ」", "カナメが、尋ねた。", "「刃の芯に、層を仕込む。術を受け付けぬ、鉄の層だ。表面に、どんな言霊を刻まれても、芯で、跳ね返す。刻印は、空回りする」", "職人たちの顔が、ゆっくりと、変わっていった。", "「ただし、一人の職人が、全体を作ってはならぬ。官吏に勘づかれる。工程を分け、それぞれが、自分の持ち場しか知らぬようにする。全体の姿を知るのは、儂だけだ」", "「爺さま」", "カナメの声が、掠れていた。", "「それって」", "「黙って、一泡吹かせる」", "イシコリドメは、赤い髭の下で、にやりと笑った。", "「職人の戦い方は、腕で勝負することだ。声を上げて殴りつけるのは、儂の流儀ではない」", "カナメの目が、見開かれた。それから、ゆっくりと、唇を噛んだ。涙が、一筋、頬を伝った。", "「……最初から、そのつもりだったの」", "「ああ」", "「教えてくれたら、よかったのに」", "「お前は、顔に出るからの」", "老人は、孫の頭を、無骨な手で、くしゃりと撫でた。"]}, {"h": "六", "p": ["検品官コトシロは、宿舎の机に、報告書を広げていた。", "最終検品の夜。納品された百本の剣を、すべて確認し終えた。外見も、重さも、注文通りだ。研ぎも、刃筋も、申し分ない。", "ただ、一本だけ、気になる剣があった。", "(芯が)", "検品の際、剣の重心を確かめるために、指で叩いた。その響きが、わずかに、違った。通常の鉄より、芯が、締まっている。表面と、内側で、音が、違うのだ。", "(層が、入っている)", "目利きとして、二十年、この仕事をしてきた。間違いない。ドワーフたちは、剣の芯に、何かを仕込んでいる。刻印の術を、弾く層だ。", "(報告すれば、里は粛清される)", "官吏に告げれば、すぐにでも、兵が動く。炉ヶ岳は、反逆の里として、焼かれる。職人たちは、捕らえられるか、殺される。", "(黙れば、私が、罪に問われる)", "筆を、取った。報告書の最後の項に、「異常あり」と書き始めた。", "『異――』", "手が、止まった。", "墨が、紙に、滲んだ。", "(私は、何をしようとしている)", "窓の外から、鉄を打つ音が、聞こえた。夜更けなのに、まだ、誰かが、槌を振るっている。コトシロは、筆を置いて、窓辺に立った。", "工房の炉の前に、老人が、座っていた。", "イシコリドメだった。一本の刃を、膝に載せ、黙々と、磨いていた。", "その刃は、納品用ではなかった。表面に、傷がある。焼き入れの失敗で、廃棄になった一本だ。誰の手にも渡らず、誰にも見られない、ただの屑鉄だった。", "それでも、老人は、手を抜かなかった。布を替え、砥石を替え、何度も、何度も、磨き上げていた。", "(なぜ)", "コトシロには、分からなかった。", "「誰にも見られない品でも、仕事は仕事だ」", "昼間、老人が、若い職人に、そう言っていたのを、思い出した。", "炉の火が、老人の顔を、赤く照らしていた。皺だらけの顔に、一点の曇りもなかった。ただ、鉄と向き合う人間の、静かな顔だった。", "コトシロは、気づいた。", "(私は、この人の仕事を、潰すために、ここにいるのか)", "違う、と、胸が、告げていた。", "自分の目は、二十年、良い品と、悪い品を、見分けるために、磨いてきた。人の仕事を、正しく見るためのものだった。誰かを、断罪するための目ではない。", "窓から、離れた。机の前に戻り、書きかけの報告書を、手に取った。"]}, {"h": "七", "p": ["朝、コトシロは、報告書を官吏に提出した。", "『全数、検品完了。品質、注文通り。問題なし』", "官吏は、一瞥しただけで、受け取った。", "「ご苦労。ならば、納品は受領した」", "術師たちが、刻印の儀式を終えて、満足そうに頷いていた。剣は、馬車に積まれ、里を出ていった。", "コトシロは、その後ろ姿を、黙って見送った。胸の中で、何かが、静かに、燃えていた。恐れも、後悔も、あった。けれど、それ以上に、不思議なほど、澄んだ感情が、そこにあった。", "(私の目は、人を守るために、使う)", "そう決めた。たった一枚の報告書で、それは、取り返しのつかない決断になった。", "荷造りを終えて、里の門に向かう途中、ベルと、すれ違った。", "コトシロは、足を止めた。", "「ベル殿」", "「はい」", "「あなたは、あの剣の細工に、最初から気づいていましたね」", "ベルは、答えなかった。ただ、静かに、コトシロを見つめた。", "「何も、言わなくて結構です」", "コトシロは、小さく、頭を下げた。", "「ただ、一言だけ、申し上げます」", "顔を上げた。", "「いつか、私の目が、役に立つ日が来るかもしれません。その時は、遠慮なく、お呼びください」", "ベルの目が、わずかに、見開かれた。それから、ゆっくりと、頷いた。", "「感謝する。覚えておく」", "コトシロは、役人の外套を翻し、馬車の列に、戻っていった。その背は、来た時より、少しだけ、まっすぐになっていた。"]}, {"h": "八", "p": ["最後の日の朝、オオナムチは、工房の隅で、炉の番をしていた。", "「火を、見ておけ」", "年老いた炉番の職人が、そう言って、彼の隣に腰を下ろした。無口な男で、里に着いてから、ほとんど口を利いていなかった。", "「火は、怖いか」", "「少し」", "オオナムチは、正直に答えた。", "「俺の故郷では、火は、家を焼くものでした。差別をする人たちが、集落に、火を放ったことがあって」", "「そうか」", "炉番は、静かに、頷いた。", "「火は、確かに、壊す」", "赤い炎が、ゆらめく。", "「だが、それだけではない。鉄を、見ろ」", "炉の中で、鉄の塊が、橙色に光っていた。炎に包まれて、形を失いかけている。", "「この鉄は、火に焼かれて、一度、壊れる。形を失う。だが、そこから、打ち直される。刃になる。鍬になる。鍋になる」", "炉番は、火箸で、鉄を、そっと、持ち上げた。", "「火は、壊すだけではない。作り直す力でもあるんだ」", "オオナムチは、その鉄を、じっと見つめた。", "胸の奥に、燻っていたものが、あった。差別への怒り。理不尽への悔しさ。ずっと、行き場のなかった熱。それは、誰かを焼くためのものだと、思っていた。", "(違う)", "作り直すための、火だ。壊された場所を、もう一度、組み直すための。", "「――火種」", "唇が、動いた。", "指先に、小さな炎が、灯った。ゆらめく赤い光が、掌の上で、静かに、揺れた。熱くはなかった。ただ、温かかった。", "炉番が、目を細めた。", "「それが、お前の火か」", "「はい」", "オオナムチは、掌の炎を、見つめた。", "(これを、誰かを、守るために使う)", "そう、心に決めた。", "里を出る朝、霧が、谷に立ち込めていた。", "門の前に、カナメが、腕を組んで立っていた。", "「行くのか」", "「はい」", "「そう」", "カナメは、そっぽを向いて、言った。", "「別に、見送りに来たんじゃない。たまたま、ここにいただけ」", "「はい」", "オオナムチは、笑った。", "「……爺さまに、教えてもらった」", "カナメが、ぽつりと、言った。", "「黙って、一泡吹かせるって。逃げでも、弱腰でも、ないんだって。戦い方の、一つなんだって」", "「そうですね」", "「私、ずっと、勘違いしてた」", "カナメは、唇を噛んだ。", "「あんたたち、また、困ったことがあったら、来な。腕なら、貸す」", "不器用な言葉だった。けれど、オオナムチには、それが、何より、嬉しかった。", "「ありがとうございます」", "その時、隣で、ベルが、足を止めた。", "ベルは、空を見上げていた。風が、何かを運んできたような顔をしていた。耳の奥で、言伝が、響いたのだろう。表情が、わずかに、変わった。", "ほんの、一瞬だった。いつも穏やかなベルの顔に、鋭い影が差し、すぐに、消えた。", "(何か、あったんだ)", "オオナムチは、気づいた。けれど、問わなかった。", "ベルは、何事もなかったように、微笑んだ。", "「行くぞ」", "三人は、霧の山道を、下り始めた。", "背後で、炉の煙が、白く、空へ昇っていった。里の火は、まだ、消えていない。誰かの手の中で、静かに、燃え続けていた。"]}]}, {"id": "plus_ch09", "label": "第九章（加筆）", "title": "削られた名", "chars": 8295, "sections": [{"h": "一", "p": ["祝賀の夜の天津京は、昼よりも白かった。", "どこからか、笛と太鼓の音が流れてくる。屋台の軒先に吊るされた白い提灯が、風が吹くたびに、ゆらゆらと揺れた。笑い声。杯の触れ合う音。子どもの歓声。すべてが、同じ明るさで、街を満たしていた。", "円議堂の前の大広場には、無数の灯籠が吊るされている。紙の灯りが風に揺れ、白い石畳に、柔らかな影を落としていた。楽の音が流れ、民は肩を寄せ合って歌っている。誰もが、笑っていた。", "コトシロは、軍務局の制服の襟を正し、人波の縁を歩いていた。", "襟の内側が、汗で、じっとりと湿っていた。夜風は涼しいのに、背中だけが熱い。制服の袖口に縫い付けられた白い腕章が、提灯の光を受けて、やけに眩しかった。", "(落ち着け。いつもの見回りだ)", "懐には、薄い紙が一枚、折り畳んで入っている。警備の配置と、やすらぎの院の出入り記録。昼のうちに、局の書庫で、三度に分けて写し取ったものだ。一枚書くたびに、指先が冷たくなった。", "「そこの」", "背後から、声がかかった。", "足が止まりかけた。それを、一歩ぶんだけ、遅らせた。歩調を乱さず、ゆっくりと振り返る。", "警邏の兵が、二人立っていた。若い方が、角灯を掲げている。", "「軍務局の方ですか。持ち場は」", "「検品局のコトシロだ。祝賀の見回りを命じられている」", "「ああ、検品官殿でしたか」", "兵の顔が、少しだけ緩んだ。", "「失礼しました。ただ、今夜は、懐の改めをしておりまして。形だけですが」", "(来た)", "心臓が、胸の内側を叩いた。懐の紙の存在が、急に、重くなる。", "コトシロは、できるだけ、穏やかに微笑んだ。", "「構わない。だが、この中は、軍の帳簿だ。破れると面倒でな。丁寧に頼む」", "「はい、もちろん」", "兵の手が、外套の内側に入ってくる。コトシロは、息を殺した。指先が、帳簿の角に触れる。その下に、写しは、ある。", "「……問題ありません」", "兵が、手を引いた。", "「ご苦労さまです。良い祝賀を」", "「ああ。君たちも」", "コトシロは、一礼して、歩き出した。三十歩、数えた。曲がり角を曲がって、ようやく、壁に手をついた。膝が、がくがくと震えていた。", "(私は、何をしているのだろう)", "可笑しくなった。二十年、帳簿と刃の目利きしかしてこなかった男が、今、国を相手に、紙を運んでいる。", "それでも、手を止める気は、なかった。", "鐘楼の裏の路地まで、遠回りで辿り着いた。角に、白い小さな布を一枚、落とす。合図だった。", "路地の石は、昼の熱を、まだ少し残していた。壁にもたれて、一度だけ、深く息を吐いた。指先が、わずかに震えているのに、そのとき初めて気づいた。", "見上げると、屋根の上の闇の中で、何かが、静かに動いた気がした。", "(頼みます、ベル殿)", "コトシロは、祝賀の灯の中へ、戻っていった。"]}, {"h": "二", "p": ["やすらぎの院は、花に囲まれていた。", "白い塀の内側に、季節の花が、整然と植えられている。どの花も、同じ高さに刈り込まれ、同じ向きに咲いていた。美しい、と言えばそうだった。ただ、風に揺れる花が、一輪もなかった。", "ベルは、白壁の塀の影に身を寄せて、その建物を見上げた。二階建ての、穏やかな造りだ。窓には薄い布がかかり、中庭には、季節の花が植えられている。夜でも、小さな灯が点って、どこか、安心を誘う佇まいだった。", "(悪意の、顔をしていない)", "それが、いちばん、薄気味悪い。", "胸の奥で、阻害の膜が、細く鳴いた。祝賀の夜の網は、昼間とは桁が違う。王都全体に、薄い糸のように張り巡らされた探知が、じりじりと、肌を撫でてくる。偽名の言霊は、もう、半分以上、削れていた。", "力は、使えない。言霊も、唱えない。ただ、気配を殺して、動くだけだ。", "遠くの広場から、祝賀の太鼓が、どん、どん、と腹に響いた。その音に紛れて、足音を殺す。呼吸さえ、小さく、浅くした。", "「ベルさん」", "隣で、オオナムチが、小声で言った。", "「見張りが、交代します」", "裏口の前の兵が、二人、入れ替わるところだった。祝賀の喧騒で、気もそぞろなのだろう。引き継ぎの声が、のんびりしている。", "「今です」", "二人は、影から影へ、走った。石畳の継ぎ目を、足音を立てずに踏む。ベルは、人の動きの外側を縫うように、体を運んだ。力を使わなくても、長年の勘が、体に染みついている。魔王として、数え切れない戦場を渡った経験が、今は、静かな足取りになっていた。", "裏口の扉は、内側から、閂が掛かっていた。", "扉の表面は、よく磨かれていた。手垢ひとつない。人が出入りする扉の、はずなのに。", "オオナムチが、短剣の先で、隙間を探る。細い金具が、小さく鳴った。やがて、閂が、外れた。", "扉が、音もなく、開いた。", "中は、薄暗い廊下だった。壁には、薬草を描いた絵が掛かっている。床は、磨かれて、冷たい。どこかで、小さな鈴の音が、鳴っていた。", "薬草の匂いが、鼻の奥にまとわりついた。甘く、少しだけ、苦い。長く嗅いでいると、頭の芯が、ぼんやりと、重くなってくる気がした。", "(穏やかだ)", "職員の足音が、遠くで、ゆっくりと行き交っている。誰かが、子守唄のような歌を、口ずさんでいた。", "「あの人たちは、何も、知らないんでしょうね」", "オオナムチが、小さく呟いた。", "「ああ。自分が、良いことをしていると、信じている」", "ベルは、歌声のする方を、見た。", "(この静けさが、人を、消している)", "怒りが、胸に、静かに、積もった。"]}, {"h": "三", "p": ["療養棟の大部屋は、息が詰まるほど、静かだった。", "時計の音も、咳の音も、衣擦れの音もない。窓の外の祝賀の喧騒が、薄い膜を一枚隔てたように、遠かった。", "オオナムチは、扉の隙間から、中を覗いた。", "寝台が、二十ほど、整然と並んでいる。その上に、人が、座っていた。起きているのか、眠っているのか、分からない。皆、窓の方を向いて、ぼんやりと、座っている。", "目が、虚ろだった。", "誰一人、こちらを見ない。入ってきた者がいることに、気づいてさえいないようだった。寝台の上の背中は、どれも、少しだけ丸く、窓の外の光に向かって、傾いていた。", "そっと、中に入った。足音を殺して、寝台の間を、歩く。一人の老人の前で、足を止めた。", "「あの」", "声をかけた。老人は、ゆっくりと、こちらを向いた。目が、焦点を結ばない。", "「お名前を、教えていただけますか」", "「……名前」", "老人の唇が、ゆっくり動いた。", "「名前、は」", "そこで、止まった。眉が、苦しげに、寄る。", "「わから、ない」", "「思い出せないんですか」", "「ずっと、呼ばれていないから」", "老人は、そう言って、小さく、笑った。その笑顔が、あまりにも穏やかで、オオナムチは、胸を掴まれた。", "(名を、削られている)", "聖の森で、ベルが言っていた。まことの名が、存在の輪郭を作ると。名を奪われた者は、輪郭が薄れ、最後には、誰の記憶にも残らなくなる。", "この部屋の人々は、その途中にいた。", "寝台の間を、ゆっくり、歩いた。一人ひとりの顔を、見た。若い者も、年配の者もいる。議員のような身なりの男。筆記具を握る形に指が曲がったままの男。僧衣の端切れを纏った女。", "部屋の奥に、一つ、窓際の寝台があった。", "そこに、痩せた男が、座っていた。三十代の半ばだろうか。無精髭が伸び、頬がこけている。胸元に、擦り切れた小さな札を、握りしめていた。", "札には、字が書かれていた。", "『ヒナへ。お誕生日おめでとう』", "オオナムチは、息を呑んだ。", "(この人だ)", "しゃがみ込んで、男の顔を見上げた。", "「先生」", "返事は、なかった。", "「ヒナさんのお父さんですね」", "男の目が、わずかに、動いた。", "「ヒナ」", "唇が、その名を、なぞった。", "「ヒナ……」", "それだけだった。それ以上の言葉は、出てこない。涙が、一筋、頬を伝って、札の上に落ちた。本人は、泣いていることにも、気づいていないようだった。", "オオナムチは、男の手を、そっと、握った。冷たかった。", "「待っててください。必ず、娘さんのところへ、連れて帰ります」", "返事は、なかった。ただ、握った手が、ほんのわずかに、握り返された気がした。", "(大丈夫だ。名の欠片は、まだ、残っている)", "オオナムチは、立ち上がった。", "「ベルさん、ここの人たちを」", "「分かっている」", "扉の傍で見張っていたベルが、頷いた。", "「だが、全員を連れ出すには人手がいる。まず元を断たねばならぬ」", "「地下ですね」", "「ああ。神殿だ」", "二人は、療養棟を後にした。部屋の中の人々は、誰一人、顔を上げなかった。ただ、窓の外の灯籠の光を、ぼんやりと見ていた。"]}, {"h": "四", "p": ["地下への階段は、倉庫の奥に、隠されていた。", "古い麻袋の山の裏に、石の扉が、半ば隠れていた。埃を払うと、扉の縁に、削り取られた模様の跡が、浅く残っていた。ここも、かつては、祈りの場所だったのだ。", "石の扉の前に、古い鍵が掛かっていた。オオナムチが、短剣の先を差し込んで、しばらく、苦戦した。ようやく、錠が外れた時には、額に汗が滲んでいた。", "扉の向こうは、冷たい空気が満ちていた。", "階段を、一歩ずつ、降りた。足音が、石壁に、吸い込まれていく。壁には、かつて、彩色が施されていたらしい。剥がれ落ちた絵の断片が、闇の中に、ちらりと見えた。", "階段の終わりに、広い空間が、あった。", "円い広間だった。天井は高く、柱が何本も立っている。奥に、石の祭壇がある。そして、その周りの壁に、五つの浅い窪みが、並んでいた。", "足を踏み入れた瞬間、空気の重さが、変わった。冷たくて、湿っていて、息を吸うたびに、肺の奥に、何かが沈んでいく。広間の壁には、燭台の跡があった。灯りが、何百年も、ここにはなかったのだと分かった。", "(紋の跡だ)", "窪みの一つひとつに、かつて、神の印が刻まれていたはずだった。今は、削り取られ、粗い漆喰で、塗り潰されている。刻まれていた形は、爪痕のように、薄く、残るばかりだ。", "祭壇の上には、見慣れぬ装置が、据えられていた。", "黒い石の台座に、細い銀の線が、幾重にも絡みついている。線の先は、床を這い、壁を伝い、天井へと伸びていた。装置の中央で、淡い光が、脈打っている。", "「あれが、中継の」", "「そうだ」", "ベルの声が、低かった。", "「ここから、王都全体へ、言霊が流れている。広場の討論会も、ミナモの掲示板も、ユウの頭の中の声も、根は、ここに繋がっているのかもしれない」", "「全部が、ここに」", "「少なくとも、その一つだ」", "オオナムチは、祭壇に近づいた。", "削られた紋の前で、足が止まった。漆喰の下から、うっすらと、形が見える。山の稜線のような曲線。", "(オオヤマツミ)", "隣の窪みには、渦を巻く線。その隣には、炎のような尖り。その隣には、三日月。", "(イザナギ。ホノカグツチ。ツクヨミ)", "そして、中央の、一番大きな窪みは、丸く、何も描かれていなかったかのように、平らだった。", "(アメノミナカヌシ)", "胸の奥が、かっと熱くなった。", "(人間も、魔族も、同じ神々を、仰いでいる)", "聖の森の老薬師が、言っていた。この世界の民は、種族を超えて、同じ祈りを持っていると。その祈りの場所が、人を縛るための道具に、作り替えられている。", "怒りが、腹の底から、込み上げてきた。", "(許さない)", "指先に、熱が集まった。炉ヶ岳で灯した火種が、掌の上で、赤く、膨らんだ。", "(焼いてやる)", "こんなもの、壊してしまえば、いい。装置も、祭壇も、すべて。そうすれば、人々は、解放される。", "掌の火が、勢いよく、燃え上がった。", "「オオナムチ」", "後ろから、ベルの声が、した。", "「待て」", "「でも」", "「壊しても止まらぬ。中継点は一つではない。ここを壊せば、王に、気づかれるだけだ」", "「じゃあ、どうすれば」", "オオナムチの声は、震えていた。拳が、固く、握られていた。", "(火は、壊すだけじゃない)", "炉ヶ岳の炉番の言葉が、頭の中で、響いた。", "(作り直す力でもあるんだ)", "オオナムチは、目を閉じた。", "胸の中で、燃え盛る怒りを、見つめた。これは、誰かを焼くための火ではない。奪われたものを、組み直すための火だ。", "ゆっくり、息を吐いた。掌の炎が、少しずつ、静まっていく。赤い光が、橙色に、そして、柔らかな金色に、変わった。", "目を開けた時、もう、壊したいとは、思っていなかった。", "(返してもらう)", "祭壇の前に、膝をついた。"]}, {"h": "五", "p": ["オオナムチは、削られた紋の前で、両手を合わせた。", "指先が、まだ、かすかに熱を持っていた。さっきまで握りしめていた火の名残が、掌の皮の下で、じんじんと脈を打っていた。", "声に出さずに、唱え始めた。", "(オオヤマツミ)", "最初に、山の名を呼んだ。聖の森で、使者の言葉から心を守った、あの言霊。野犬の牙から身を守った、堅めの膜。仲間の前に立つことを、教えてくれた、守りの神。", "「――堅め。心鎮め」", "声が、石の広間に、静かに、響いた。", "右端の窪みが、ぼう、と淡く光った。漆喰の下から、山の稜線が、浮かび上がる。削られた線が、一本、また一本と、戻っていく。", "(次は、イザナギ)", "野犬の牙の痕を癒やした、あの温かさ。スクナ老人が、薬草の包みを渡しながら、言った。守るだけでは、人は救えぬ時が来る、と。", "「――癒やし」", "二つ目の窪みが、光った。渦を巻く線が、ゆっくりと、回り始める。", "(ホノカグツチ)", "炉ヶ岳で、教わった火。壊すためではなく、作り直すための火。差別への怒りを、組み直す力に変えてくれた。", "「――火種」", "指先の小さな炎が、三つ目の窪みに、映った。炎のような尖りが、金色に、輝き出す。", "(ツクヨミ)", "ここまで、学んだ言霊は、少ない。けれど、確かに、触れたことがある。ベルから聞いた、夜の通信の「言伝」。ヒエダの口にした「見破り」。名を暴き、偽りを見抜く力。", "「――見破り」", "声が、少し、かすれた。それでも、四つ目の窪みに、細い三日月が、静かに、灯った。", "四つの紋が、淡く、光っていた。石の広間が、柔らかな光で、満たされる。", "光は、石の床に、柔らかな輪を描いた。その輪の中に、人々の影が、ひとつ、またひとつ、重なっていった。誰も、言葉を発さない。ただ、同じ光を、見上げていた。", "祭壇の装置が、低く、唸った。黒い台座の上で、淡い光が、乱れ始める。銀の線が、ぱちぱちと、軋んだ音を立てた。言霊の流れが、濁っている。", "(効いている)", "胸が、熱くなった。", "最後に、中央の、一番大きな窪みに、手をかざした。", "(アメノミナカヌシ)", "名を、呼んだ。", "何も、起きなかった。", "窪みは、冷たいままだった。手のひらを押し当てても、石の感触が、返ってくるだけだ。", "(届かない)", "胸の奥に、細い痛みが、走った。", "(まだ、足りないのか)", "呼んでも、呼んでも、応えがなかった。まるで、遠い星に向かって、声を投げているようだった。", "それでも、構わなかった。今は、四柱で、十分だ。", "背後で、かすかな物音が、した。", "振り向くと、階段の上から、入所者たちが、降りてきていた。", "一人、また一人。寝間着のまま、裸足で、ふらふらと、階段を降りてくる。目が、虚ろだ。それなのに、足は、まっすぐ、広間を目指していた。", "「どうして」", "四つの紋が、灯ったからだ。", "装置の言霊が、濁ったことで、彼らを縛っていた糸が、緩んだのだ。名の欠片が、紋の光に、呼ばれている。", "先頭に、ヒナの父が、いた。", "札を握りしめたまま、祭壇の前に、立ち尽くしていた。唇が、わずかに、動く。", "「……ヒナ」", "その声に、わずかな力が、戻っていた。", "「ヒナ、は」", "「元気です」", "オオナムチは、涙が滲むのを、感じた。", "「待ってます。花の種を、握りしめて」", "男の目に、かすかな光が、宿った。それは、まだ、輪郭の定まらない、小さな光だった。それでも、確かに、生きた人間の目だった。"]}, {"h": "六", "p": ["ベルは、広間の隅で、動かずに、見ていた。", "拳を、固く、握りしめていた。爪が、掌に、食い込んでいる。", "(手を出しては、いけない)", "阻害の膜は、もう、ほとんど、残っていなかった。胸の奥で、細い糸のように、切れかけている。この場で、わずかでも力を使えば、膜は完全に破れる。探知網が、一斉に、自分を捉える。", "だから、動けなかった。", "オオナムチが、祭壇の前に、膝をついている。四柱の名を、一つずつ、呼んでいる。声は、震えていた。けれど、一度も、途切れなかった。", "(あの青年は、一人で、やっている)", "教えたのは、確かに、自分だ。守りの立ち回りも、癒やしの勘も、旅の中で、少しずつ、伝えてきた。けれど、紋を呼び戻すことは、教えていない。誰も、教えていない。", "ただ、あの青年は、旅で触れたものを、全て、胸に抱えて、ここに立っている。", "(祈りの声が)", "ベルは、目を閉じた。", "オオナムチの声が、広間に、響いていた。オオヤマツミを呼び、イザナギを呼び、ホノカグツチを呼び、ツクヨミを呼ぶ。その祈りの調べに、聞き覚えがあった。", "黄泉津の宮の奥で、年に一度、行われる儀式。収穫祭の前夜に、民が、揃って、神々に捧げる祈りだ。魔界の民が、人間と同じ神々に、同じ響きで、祈っていた。", "(同じだ)", "胸が、詰まった。", "人間も、魔族も、同じ神々を、仰いでいる。そのことを、頭では、知っていた。けれど、今、一人の人間の青年の声の中に、魔界の祈りが、そのまま、息づいているのを、聞いた。", "(この青年は)", "確信が、胸の底から、静かに、立ち上がった。", "(いつか、私に、並ぶ)", "驚きは、なかった。ただ、深い、納得があった。そして、誇らしさと、わずかな寂しさが、混じり合った。育てた者が、手を引く瞬間とは、こういうものなのか。", "その時、足元が、ぐらりと、揺れた。", "視界が、一瞬、歪んだ。自分の手が、薄く、透けて見えた。", "(来たか)", "阻害が、尽きかけている。人間の青年の姿が、輪郭から、ほどけ始めた。黒髪の端が、闇に溶けるような、魔王の色に変わっていく。", "ベルは、歯を食いしばって、堪えた。", "遠く、地上から、足音が、響いてきた。", "装置の異変が、王に、伝わったのだ。祭壇の中央で、淡い光が、不規則に点滅している。濁った言霊の流れが、どこかへ、悲鳴のように、伝わっていく。", "(気づかれた)", "予想していた。けれど、それでも、胸が、冷えた。", "「オオナムチ」", "呼びかけた。", "「もう十分だ。退くぞ」", "青年が、顔を上げた。額に、汗が光っている。", "「でも、まだ、入所者の人たちが」", "「連れ出せる者だけ連れ出す。今夜はそれまでだ」", "「分かりました」", "オオナムチは、立ち上がった。ヒナの父の肩を、そっと、支えた。", "「歩けますか、先生」", "男は、ゆっくりと、頷いた。", "入所者たちが、一人、また一人、階段へ向かっていく。足取りは、重い。けれど、迷いは、なかった。紋の光が、道しるべのように、足元を照らしていた。", "ベルは、最後尾に立って、祭壇を、振り返った。", "四つの紋が、淡く、光っている。その中央で、五つ目の窪みだけが、暗く、沈黙していた。", "(アメノミナカヌシ)", "いつか、あの窪みが、光る日が、来るのだろうか。", "階段を、上り始めた。胸の奥で、膜の最後の一片が、ぱきりと、鳴った。"]}, {"h": "七", "p": ["祝賀の壇上は、光に満ちていた。", "タケルは、白銀の鎧を纏い、民の前に、立っていた。万を超える歓声が、波のように押し寄せる。誰もが、彼を、見上げていた。英雄の帰還。魔王の脅威から、民を守る者。", "胸に、小さな棘が、刺さっていた。", "(どうして、こんなに、落ち着かない)", "民の笑顔は、本物だった。感謝は、心からのものだった。それなのに、胸の奥が、ざわついている。牢の中で、粥を食べた記憶が、よぎる。静かな黒髪の男の顔が、頭の隅に、ちらつく。", "(気のせいだ)", "そう思おうとした時、壇の袖から、一人の男が、近づいてきた。", "白い礼装。柔和な顔。穏やかな目。", "アマツ王だった。", "「見事な凱旋だったな、タケル」", "王は、耳元で、優しく、囁いた。", "「民が、どれほど、そなたを、誇りに思っていることか」", "「恐れ入ります、陛下」", "タケルは、頭を下げた。胸の棘が、すっと、薄れた。王の声には、不思議な安らぎがある。この声を聞くと、迷いが、消えるのだ。", "「ところで」", "王の声が、わずかに、低くなった。", "「たった今、報せが入った。やすらぎの院に、侵入者がいる」", "「侵入者」", "「そうだ。魔族に与する者たちだ。院の患者たちを、攫おうとしている」", "タケルの目に、怒りが宿った。", "「許せません」", "「行ってくれるか」", "「もちろんです」", "タケルは、剣の柄に、手を置いた。", "「罪なき民を、守ります」", "「頼もしい」", "王は、満足げに、微笑んだ。その笑みを、タケルは、疑いなく、受け止めた。", "壇を降りながら、ふと、足が止まった。", "胸に、あの言葉が、浮かんだのだ。", "(どこかで……)", "獣ノ原で、冒険者の青年に感じた、あの違和感。黒髪の男の顔。牢の中の記憶と、重なり合って、何かが、見えかけた。", "(いや、考えすぎだ)", "頭を振った。", "「行くぞ」", "供の兵に、短く命じた。馬が、嘶いた。", "祝賀の灯籠が、風に揺れる。万の歓声を背に、勇者は、闇の中の療養院へ、向かっていった。", "その背中を、壇の上から、王が、静かに、見送っていた。", "穏やかな笑みは、少しも、崩れていなかった。ただ、その目の奥だけが、温度を、持っていなかった。"]}]}, {"id": "plus_ch11", "label": "第十一章（加筆）", "title": "受けきる者", "chars": 9296, "sections": [{"h": "一", "p": ["魔界の朝は、鳥ではなく、土の匂いで始まった。", "オオナムチは、粗い藁布団の上で目を開けた。天井は低い石組みで、窓の外が薄く赤い。ここが黄泉だと思い出すまでに、少し間があった。体のあちこちが痛い。昨夜、王都から比良坂まで走り通した疲れが、まだ残っている。", "戸を叩く音がした。", "「起きたか、客人」", "低く、短い声だった。戸を開けると、甲殻を背に負った寡黙な男が、鍬を肩に立っていた。ハニヤスだ。", "「畑を見るか」", "それだけ言って、返事も待たずに歩き出す。オオナムチは慌てて外套を掴み、後を追った。", "埴の里は、朝靄の中にあった。段々に刻まれた田が丘の斜面を埋め、実り始めた稲穂が低く波打っている。畦では土蜘蛛の若者たちが、黙々と土を均していた。誰も振り返らない。けれど、通り過ぎるオオナムチに、石を投げる者も、背を向ける者もいなかった。", "「ここだ」", "ハニヤスが足を止めたのは、畑の端の、小さな畝の前だった。", "「膝をつけ」", "「え」", "「土に、客として挨拶をする。それが、ここの流儀だ」", "オオナムチは言われるまま、膝をついた。湿った土が、ズボン越しに冷たい。掌を、そっと地面に置いた。柔らかく、温かく、微かに脈打つような感触があった。", "「荒らしに来たのではない、と」", "「はい」", "「ならば、それでいい」", "ハニヤスは、それ以上何も言わなかった。ただ、鍬を置いて、隣に膝をついた。二人で、しばらく、黙って土に触れていた。", "(この人たちは)", "荒涼とした景色の中に、畑がある。煙があり、子どもの声がある。人間界で聞いてきた「話の通じない者たち」は、どこにもいなかった。ここにいるのは、土を耕し、食べ物を分け合う人々だ。", "(どちらが悪か、なんて)", "問い自体が、間違っていたのだ。頭で分かっていたことが、掌の下の土の温かさで、初めて体に落ちた。", "「泣いているのか」", "ハニヤスの声に、オオナムチは顔を拭った。", "「すみません。目に土が」", "「そうか」", "ハニヤスの面の奥で、ほんのわずかに、息が漏れた。笑ったのかもしれない。"]}, {"h": "二", "p": ["角ヶ原の演武場は、岩肌を削った広い窪地だった。", "ミカヅチは、腕を組んで青年を見下ろしていた。継ぎの当たった外套を脱ぎ、短剣を握って立つ姿は、どう見ても、戦士のものではない。肩は細く、足は震えている。鬼族の子どもでも、もう少しましな構えをする。", "(これが、王が目をかけた人間か)", "値踏みのつもりで、手合わせを申し出た。木の棒を一本、片手に持っただけだ。", "「来い。どこからでもいい」", "青年は、短剣を構え直し、踏み込んだ。", "遅い。ミカヅチは、棒の先で、軽く肩を押した。青年は、あっけなく転がった。砂が舞う。", "「終わりか」", "「……まだです」", "立ち上がった。もう一度、踏み込む。今度は、足を払われて、背中から落ちた。息が詰まる音がした。", "「やめておけ。骨が折れる」", "「まだ、です」", "三度目。四度目。五度目。", "青年は、何度倒されても、立った。膝は笑い、唇は切れ、腕は痺れているはずだ。それでも、短剣を握る手は、離さなかった。ただ、一つだけ、変わったことがある。四度目あたりから、青年は、倒されながら、何かを唱えていた。", "「――堅め」", "細い膜が、青年の体を包んだ。棒の一撃が、膜に当たって、鈍い音を立てた。", "(守りの言霊を、実戦で)", "ミカヅチは、目を細めた。まだ弱い。紙のように薄い。けれど、六度目の打ち込みで、膜は、一度だけ、棒を弾いた。", "青年が、目を見開いた。", "「今の」", "「偶然だ」", "そう言いながら、ミカヅチの胸の奥で、古い記憶が、ゆっくりと立ち上がっていた。", "王との一騎討ち。全てをぶつけ、あの一撃を受けきった日のこと。倒れず、誇りにかけて立ち上がり、王に誇りを称えられた。あの時は、自分の強さが認められたのだと思っていた。", "(違った)", "戦場で、静まり返った根の洲を見た日に、悟った。あれは、手加減だった。受けきれる強さを、王が選んでくれていた。", "それでも、あの日、自分は立った。立ったから、今の自分がある。", "「小僧」", "ミカヅチは、棒を下ろした。", "「受けきるとは、何だと思う」", "青年は、肩で息をしながら、少し考えた。", "「倒れない、こと」", "「違う」", "低く言った。", "「倒れるのは、構わん。人は、倒れる。肝心なのは、退かぬことだ。倒れても、膝をついても、背を向けるな。その場に、居続けろ。それが、受けきるということだ」", "青年の目が、揺れた。", "「退かない」", "「そうだ。おまえの守りの言霊は、まだ薄い。だが、退かぬ者の膜は、厚くなる。いつかな」", "ミカヅチは、背を向けた。", "「今日は、ここまでだ。明日も来い。鬼族は、立ち上がる者には、何度でも付き合う」", "背中に、青年の声が届いた。", "「ありがとうございます」", "返事はしなかった。ただ、口の端が、わずかに、持ち上がっていた。"]}, {"h": "三", "p": ["黄泉津の宮の奥には、誰も立ち入らない回廊がある。", "オオナムチは、ナキメに案内されて、その薄暗い道を歩いていた。壁に刻まれた模様は、渦のような曲線で、見ていると、目が回りそうになる。", "「ここは、イザナギ縁の聖域です」", "ナキメが、涼やかな声で言った。黒い翼を畳み、足音も立てずに歩く。彼女の前では、いつも、背筋が伸びた。", "「死と再生の理が、一番濃く残る場所。名呼びの入口に触れるには、ここが最適でしょう」", "「名呼び」", "「倒れた者の名を呼び、この世に繋ぎ止める言霊です。蘇生の入口。習得は、本来、何年もかかります」", "「俺に、できるでしょうか」", "「できません」", "ナキメは、あっさり言った。", "「完成は、ね。ただ、入口に触れることなら、あなたには、素質がある」", "回廊の突き当たりに、小さな円い部屋があった。床は、白い石で、中央に、浅い水が張られている。水面は、鏡のように静かだった。", "「膝をついて、水を見なさい」", "オオナムチは、言われた通りにした。水面に、自分の顔が映る。疲れた、痩せた顔。", "「誰か、呼び戻したい人はいますか」", "胸の奥に、いくつもの顔が浮かんだ。ユウ。ハル。ヒナの父。", "「目を閉じて、その人の名を、心の中で呼びなさい。大きな声ではなく、掌で、そっと包むように」", "(ユウ)", "名を呼んだ。", "何も、起きない。ただ、静かな時間が流れた。水の冷たさが、膝から這い上がってくる。", "(ユウ。ひなた野の井戸、覚えてるか)", "声にならない声で、繰り返した。", "不意に、水面が、微かに揺れた。", "波紋が、一つ、広がった。水の底から、ごく小さな、温かい何かが、掌に触れた気がした。", "「……今のは」", "「入口です」", "ナキメの声が、少しだけ、柔らかかった。", "「名の欠片が、応えた。ただし、これは、まだ、欠片に触れただけ。蘇生には、ほど遠い」", "「はい」", "「焦らないことです。あなたが誰かを失いかけた時、本当の名呼びは、その時、生まれます」", "オオナムチは、目を開けた。水面は、元の静けさに戻っていた。それでも、掌には、まだ、微かな温もりが残っていた。", "その日の午後、嵐ヶ峰の演武場で、スサノとも手を合わせた。", "嵐ヶ峰は、風の山だった。尾根に立てば、四方から風が吹きつけ、外套の裾が、旗のようにはためく。岩肌には、爪の跡が、幾重にも刻まれていた。嵐狼の子らが、何代にもわたって、ここで走り、跳び、牙を研いだ跡だった。", "演武場の縁では、毛並みの揃わない子狼たちが、数匹、岩に腰かけて見物していた。耳の聞こえない小さな一匹が、両手を動かして、隣の子に何かを伝えている。(あの人間、まだ立ってる)。そんな形だった。", "スサノの動きは、速かった。二度の踏み込みが、一瞬のうちに来る。オオナムチは、何度も打たれた。三度目の手合わせで、ようやく、気づいた。", "目が、追いつかなかった。灰色の影が、岩の上を、風そのもののように、滑ってくる。爪が空を裂く音だけが、遅れて耳に届いた。", "(二回目の動きは、一回目の逆から来る)", "読みが、当たった。スサノの爪を、短剣の腹で受け流した。スサノが、牙を見せて、笑った。", "「やるじゃねえか。獣の速さは、読まれると、脆い」", "「読み、ですか」", "「そうだ。鬼は、鴉に弱い。嵐狼は、鬼に弱い。土蜘蛛は、嵐狼に弱い。鴉は、土蜘蛛に弱い。四つの相性を知っていれば、力が足りなくとも、道は拓ける」", "ナキメが、涼しい顔で付け加えた。", "岩の上に腰を下ろした黒い翼が、風の中でも、少しも乱れなかった。膝の上の香炉から、薄い煙が、真っ直ぐに、天へ昇っていく。", "「相性は、傾向にすぎません。個人と状況で、覆る。肝心なのは、目の前の相手を、よく見ること」", "(見る)", "オオナムチは、頷いた。見ることなら、自分にもできる。ずっと、そうしてきたのだから。"]}, {"h": "四", "p": ["収穫祭の夜は、赤い空が、深い藍に沈んだころに始まった。", "オモイカは、卓の端の席に、静かに座っていた。", "埴の里の畑のそばに、長い卓が、いくつも並べられている。鬼の祭り酒の樽が開けられ、土蜘蛛の新米の団子が山盛りになり、嵐狼の子どもたちが、泥だらけの顔で、走り回っていた。鴉族の屋台からは、甘い煙が立ち上っている。", "その中心に、人間の青年がいた。", "継ぎの当たった外套のまま、鬼族の若者に肩を組まれ、杯を押しつけられている。顔を赤くして、必死に断ろうとしているが、周りは笑って聞かない。耳の聞こえない嵐狼の幼い子が、青年の袖を引き、手の形で何かを伝えた。", "(おなか、すいた？)", "青年は、戸惑ってから、子どもの手の動きを真似て、返した。", "(すいた。団子、食べたい)", "子どもが、ぱっと笑った。", "オモイカは、その光景を、じっと見ていた。", "(人間が、席にいる)", "王が、何気なく口にした言葉を、思い出す。和平が成れば、収穫祭に人間を招けるだろうか、と。あの日、自分は、会談に向かった。随員たちと共に。", "目の前の杯に、手を伸ばせなかった。", "笛を吹いていた嵐狼の青年の顔が、浮かぶ。巻物を抱えていた老いた鬼の書記の、冗談めかした声。荷を担いでいた若い鴉の、少しはにかんだ笑い方。一人ひとりの顔が、鮮明に、ある。", "名も、全員、覚えている。口にしようとすると、喉が、固く閉じた。", "(まだ、言えない)", "悔しかった。彼らが座るはずだった席が、この卓には、あるはずだった。酒の樽は、三倍いると、ミカヅチが言っていた。その三倍の分だけ、空いた席が、今夜も、どこかに、あるような気がした。", "隣の席に、誰かが、静かに腰を下ろした。", "顔を向けなくても、分かった。ベルだった。", "王は、何も言わなかった。慰めの言葉も、「申し訳ありません」を遮る言葉も、なかった。ただ、隣に座って、同じ方向を、眺めていた。", "しばらくして、王の手が、卓の上の杯を、一つ、取った。そして、オモイカの前に、そっと置いた。", "オモイカは、その杯を見つめた。", "指が、わずかに震えた。それから、ゆっくりと、杯を持ち上げた。", "口に含んだ酒は、鬼族の祭り酒の味がした。少し甘く、少し苦かった。", "(半分だけ、叶いました)", "胸の中で、随員たちに、そう告げた。", "(人間は、席に着きました。あなた方の席は、まだ、空いたままですが)", "目の端が熱くなるのを、杯の縁で、隠した。", "ベルは、何も言わず、ただ、隣に居続けた。"]}, {"h": "五", "p": ["夜更け、ベルは、一人、畑の畦に立っていた。", "祭りの音が、遠くに聞こえる。星の少ない赤黒い空が、地平まで続いている。比良坂の方角に、細い光の筋が、立っていた。", "足音が、背後で止まった。", "「ベルさん」", "振り向くと、オオナムチが、立っていた。酒の匂いはしない。顔は、真剣だった。", "「お願いが、あります」", "「聞こう」", "「明日の、タケルさんとの戦い」", "青年は、息を吸った。", "「俺に、やらせてください」", "ベルは、黙っていた。", "「自分の正義で、決着をつけたいんです。ベルさんは、見ていてください。手を出さないで、ほしい」", "夜風が、稲穂を揺らした。", "(来たか)", "いつか、この言葉を聞く日が来ると、思っていた。思っていたのに、胸の奥が、きしんだ。", "タケルは、人間界最強の剣士だ。この青年は、まだ、紙のように薄い守りしか持たない。倒れるかもしれない。傷つくかもしれない。最悪の場合は。", "(手を出せば、すぐに、止められる)", "その気持ちが、喉元まで、込み上げた。拳が、勝手に、握られていた。爪が、掌に食い込んだ。", "「おまえは、まだ、弱い」", "声が、思ったより、掠れた。", "「知ってます」", "「死ぬかもしれない」", "「かもしれません」", "青年は、笑った。泣きそうな顔だった。", "「でも、ベルさんが教えてくれたことです。守るとは、倒すことじゃない。誰も失わない道を、選び続けることだって」", "(そんなことを、言っただろうか)", "言葉にして教えたのは、夜の特訓の最後だったか。あれを、この青年は、胸に刻んでいたのか。", "「俺は、タケルさんを、失いたくない。敵でも、洗脳されていても。だから、俺が、やります」", "ベルは、長い間、青年の顔を見ていた。", "灰色の目の奥の紅は、もう、隠していない。魔王の姿のまま、畦に立っている。その前で、継ぎ当ての外套の青年が、まっすぐ、見上げていた。", "(育てた者が、手を引く瞬間)", "それは、こういうことか、と思った。寂しく、誇らしく、そして、怖い。", "「分かった」", "ようやく、言った。", "「手は出さぬ」", "「ありがとうございます」", "「ただし」", "ベルは、青年の肩に、手を置いた。", "「見ている。最後まで、おまえの背中を、見ている。それだけは、許してくれ」", "オオナムチの目が、潤んだ。", "「はい」", "「半分ずつ、だったな」", "「……はい」", "青年は、顔をくしゃりとさせて、笑った。"]}, {"h": "六", "p": ["比良坂の人間側の拠点、坂上の砦は、夜明けの光の中にあった。", "朝靄が、坂の下から、ゆっくりと這い上がってくる。石壁には、露が、びっしりと付いていた。鳥は、鳴いていない。広場の石畳に、冷たい空気が、澱のように溜まっている。", "遠巻きに並んだ兵たちの吐く息が、白かった。誰も、咳ひとつしない。魔界の者は、坂の左に。人間の者は、右に。両陣営の間の空いた場所だけが、朝の光を、そのまま浴びていた。", "石造りの広場に、両陣営の兵が、遠巻きに控えていた。誰も、武器を構えていない。中央の空いた場所に、一人の剣士が、立っていた。", "白銀の鎧。澄んだ目。人間界最強の勇者、タケル。", "見届け人の位置に、寡黙な岐人が立っていた。クナドが、静かに、告げた。", "「この戦い、私が、見届けます。どちらの陣営にも、属さぬ者として」", "オオナムチは、広場の中央へ歩み出た。継ぎの当たった外套。使い古した短剣。靴の踵は、すり減ったままだ。", "(オオナムチ)", "タケルは、青年を見つめた。獣ノ原で、礼を述べた冒険者だ。亜人の少年に、目を合わせて話しかけていた青年。", "「来たか」", "タケルの声は、硬かった。", "「答えを、持ってきたか。あの男が、何者か」", "「魔王です」", "オオナムチは、まっすぐ答えた。", "「そして、俺の友人です」", "タケルの眉が、動いた。", "「友人、だと」", "「はい。そして、あなたの牢で、粥を出させた人です」", "タケルの唇が、わずかに、震えた。", "「黙れ」", "剣が、抜かれた。", "「王が、そう仰った。魔族は、話の通じない者たちだと。俺は、王を信じる」", "声が、揺れていた。それでも、剣先は、まっすぐ、オオナムチに向いていた。", "「ならば、剣で答えろ」", "踏み込みは、見えなかった。", "風が、顔を打った。それが、斬撃が通り過ぎた後の空気だったと気づいたのは、石畳が、背中を叩いてからだった。", "次の瞬間、衝撃が、肩を貫いた。", "オオナムチの体が、宙を舞った。石畳に叩きつけられ、息が止まる。視界が、白くなった。", "(速い)", "人間界最強の名は、伊達ではなかった。獣ノ原で見た穏やかな顔とは、別人のような剣だった。", "立ち上がる。膝が、笑う。", "唇の端から、鉄の味がした。舌で探ると、歯の裏が、切れていた。血を吐き捨てる暇もなく、次の剣が、来る。", "「――堅め。心鎮め」", "膜が、体を包んだ。二度目の斬撃が、膜に当たった。ぱきり、と音がして、膜が、割れた。衝撃が、胸に届いた。", "また、倒れた。", "(退かない)", "ミカヅチの声が、頭の中で、響いた。", "(倒れても、膝をついても、背を向けるな)", "オオナムチは、立ち上がった。", "何度目だろう。数えるのをやめた。膜が割れるたびに、張り直した。言霊を唱えるたびに、喉が焼けた。", "石畳には、いつの間にか、赤黒い点が、不規則に散っていた。自分のものだとは、思いたくなかった。足元の砂を踏むたび、じゃり、と音がした。その音だけが、なぜか、はっきり聞こえた。", "ベルは、広場の端で、動かなかった。", "日が、少しずつ、高くなっていく。長く伸びていた影が、ゆっくり、縮んでいった。それでも、ベルの影だけは、石壁の脇から、一寸も動かなかった。", "拳を握りしめ、爪が掌に食い込み、血が滲んでいた。それでも、一歩も、踏み出さなかった。唇を、固く結んでいた。", "(見ている)", "オオナムチは、遠くで、その視線を感じた。", "(見ていてくれる)", "それだけで、足が、前へ出た。", "――タケルの視界。", "(なぜ、倒れない)", "剣を振るうたびに、焦りが、積もっていった。", "人間界最強と呼ばれてきた。この剣で、魔界の軍勢を打ち払った。民を守ってきた。その自分の剣を、この青年は、何度受けても、立ち上がってくる。", "(弱い)", "斬るたびに、確信する。この青年は、弱い。技も、力も、自分の足元にも及ばない。", "それなのに。", "(なぜ、退かない)", "膝をつき、血を吐き、それでも、青年は、正面から、こちらを見ていた。逃げもしない。憎しみの目でもない。ただ、まっすぐ、見つめていた。", "その目が、牢の中の黒髪の男の目と、重なった。", "(違う)", "頭の奥で、柔らかな声が、響いた。", "(惑わされるな。それは、魔族の手口だ。斬れ、タケル)", "王の声だった。胸の迷いが、すっと凪いだ。", "剣を、握り直した。", "指の関節が、白くなるほど、強く。鎧の内側で、汗が、背骨に沿って、滑り落ちた。", "――オオナムチの視界。", "(読め)", "倒れ、立ち、倒れ、立ちながら、オオナムチは、見ていた。", "ナキメの言葉が、蘇った。肝心なのは、目の前の相手を、よく見ること。", "(大振りの後に、一拍の隙がある)", "タケルの剣は、大きい。踏み込みが深いほど、次の動きまでに、わずかな間が生まれる。その間は、呼吸二つ分もない。", "(それから)", "斬撃の直前、タケルの目が、わずかに揺れる瞬間があった。何かを、聞いている目だった。頭の奥の、別の声に、耳を傾けている目。", "(王の声が、動きを、整えているんだ)", "言霊を乗せる、その直前の呼吸。動きが、人のものではなく、借り物のように、滑らかになる一瞬。そこだけ、剣が、読める。", "(ナキメさんの、言霊耐性の稽古)", "洗脳の動きは、洗脳の呼吸で、読める。", "(いける)", "オオナムチは、膜を張り、斬撃を受けた。割れた。倒れた。立った。", "そして、規定の時を越え、タケルの息が、わずかに乱れ始めた。", "疲れているのは、青年だけではなかった。人間界最強の剣士もまた、肩を上下させていた。", "広場の空気が、変わった。観衆の息遣いが、ひとつ、またひとつ、止まっていく。誰かが、小さく、唾を飲んだ。", "(ここだ)", "オオナムチは、短剣を握り直した。", "読んだ隙へ、踏み込んだ。", "火種を、掌に灯す。作り直すための、金色の小さな炎。それを、短剣の刃に、乗せた。", "「――作り直す火だ」", "刃が、タケルの剣を、弾いた。", "乾いた音が、広場に響いた。白銀の剣が、宙を舞い、石畳に、突き刺さった。", "タケルの体が、傾いた。膝が、折れた。", "白銀の鎧が、石畳に、重い音を立てて、沈んだ。", "静寂が、広場を覆った。", "朝日が、ちょうど、砦の石壁の上に顔を出した。金色の光が、広場を、斜めに照らした。突き刺さった剣の影が、長く、石畳に伸びていた。", "「この戦い」", "クナドの声が、凪いだ空気を、震わせた。", "「見届けました」"]}, {"h": "七", "p": ["ベルは、拳を、ゆっくりと、開いた。", "指が、一本ずつ、ほどけていく。爪の痕から、血が、細く、手首のほうへ、流れていった。痛みは、今、ようやく、届いた。", "掌に、爪の痕が、赤く、並んでいた。手が、小さく、震えている。", "(勝った)", "安堵と、誇らしさと、そして、言葉にできない何かが、胸に、一度に、押し寄せた。育てた青年が、人間界最強の剣士を、膝から折った。殺さず、傷を最小に抑え、ただ、戦えなくした。", "(あの子は)", "オオナムチは、石畳の上で、膝をつき、荒い息をついていた。それでも、顔を上げ、倒れた剣士を、見ていた。", "その時だった。", "タケルの喉から、ありえない声が、漏れた。", "『立て、タケル』", "柔らかな、穏やかな声だった。タケル本人のものではない。アマツ王の、遠隔の言霊だ。", "『英雄は、倒れぬ』", "白銀の鎧が、ぎしり、と鳴った。", "膝をついていたタケルの体が、意思に反して、ゆっくりと、立ち上がろうとしていた。腕が、勝手に、地面に突っ張る。傷ついた体が、無理やり、動かされていく。", "目は、虚ろだった。ただ、苦痛だけが、表情に、滲んでいた。", "「やめろ」", "オオナムチが、よろめきながら、立ち上がった。", "「その人は、もう、戦えない」", "『剣を取れ』", "王の声は、止まらなかった。", "タケルの指が、石畳に突き立った剣へ、伸びた。", "(させない)", "オオナムチは、両手を、前に突き出した。", "「――心鎮め」", "声が、枯れていた。それでも、唱えた。", "聖域の水面で触れた、あの温かい感触を、思い出した。名を呼ぶ、掌で包むように。", "守りの膜が、タケルの周りに、広がった。王の声を、遮るように。細い糸のような言霊の根が、膜に触れて、軋んだ。", "『剣を、取れ』", "声が、遠のいた。膜に阻まれ、音が、途切れ途切れになる。", "「……あ」", "タケルの指が、止まった。", "「あ、あ」", "喉から、掠れた声が、漏れた。", "目の焦点が、ゆらりと、揺れた。ほんの一瞬だった。虚ろな瞳の奥に、澄んだ光が、戻った。", "「俺は」", "唇が、動いた。", "「俺は……何を……」", "その呟きは、誰のものでもない、タケル自身の声だった。", "オオナムチは、息を呑んだ。", "けれど、すぐに、光は、揺らいで、消えた。タケルの体が、ぐらりと傾き、石畳に、崩れ落ちた。気を失ったのだ。", "静かな足音が、近づいた。", "クナドだった。寡黙な岐人が、倒れた勇者の傍らに、膝をついた。白銀の鎧の肩に、そっと手を置いた。", "「この者は、私どもが、預かります」", "声は、穏やかだった。", "「見届け人の掟です。敗れた者は、どちらの陣営にも、渡しません」", "兵たちが、ざわついた。けれど、誰も、異を唱えなかった。", "岐人は、タケルを抱え起こした。大柄な体を、軽々と、背に負う。その背中は、夜明けの光の中で、不思議なほど、静かだった。", "「境の神の血を引く一族の、集落では」", "クナドは、肩越しに、言った。", "「王の言霊は、届きにくくなります。しばし、休ませましょう」", "オオナムチは、去っていく背中を、見送った。足が、がくりと、折れた。石畳に、膝をついた。", "「オオナムチ」", "駆け寄る足音が、あった。", "ベルだった。", "魔王の姿のまま、青年の傍らに、膝をついた。血に濡れた手を、そっと、握る。", "「よく、やった」", "その声は、震えていた。", "「見ていた。最後まで見ていた」", "オオナムチは、笑った。泣き笑いだった。", "「手、出さなかった、ですね」", "「ああ」", "「すごく、握りしめて、ましたね。血が、出てる」", "「……見ていたのか」", "「見えてました。ずっと」", "ベルは、何も、言えなかった。ただ、青年の頭に、掌を置いた。", "遠く、比良坂の大穴の底から、細い光の筋が、立ち昇っていた。朝日が、坂上の砦の石を、金色に染めていく。", "その光の向こうで、白い礼装の影が、動いた気がした。", "王が、動き出す。", "そんな予感が、夜明けの風に、混じっていた。"]}]}, {"id": "plus_haniyasu", "label": "前日譚", "title": "ハニヤス　最初の一株", "chars": 2160, "sections": [{"h": null, "p": ["黄泉の空は、昼でも薄く赤い。その下の谷には、草の一本も生えていなかった。", "ハニヤスは、膝をついて、土に両手を埋めていた。", "掌に伝わるのは、冷たさだった。冷たいだけではない。土の底から、じわじわと上ってくる、重いものがある。瘴気だ。この谷の土は、何百年も前に、それを吸いこみすぎた。踏めば固く、掘れば黒く、種を蒔いても、芽の形になる前に、腐った。", "(それでも)", "指先で、土を崩す。粒をひとつ、ひとつ、確かめるように、ほぐしていく。", "土蜘蛛族は、土の民だった。地の下の道を知り、地脈の流れを読む。けれど、その力は、争いのために使われてきた。穴を掘り、罠を張り、敵の足元を崩す。ハニヤスの祖父も、父も、そうして死んだ。", "(土は、壊すだけのものじゃない)", "そう思ったのは、子どもの頃だった。", "祖母が、小さな革袋を、枕の下に隠していた。中には、乾いた籾が、数十粒、入っていた。", "「これは、遠い昔の、人間の国の稲だよ」", "祖母は、そう言った。", "「土蜘蛛が、まだ、畑を耕していた頃の。ひと粒でも、芽が出れば、また、増える」", "「芽は、出るの」", "「出るさ。土を、起こしてやればね」", "その祖母も、もういない。", "革袋だけが、ハニヤスの懐に、残っていた。", "谷の入口のほうで、砂利を踏む足音がした。", "ハニヤスは、手を止めなかった。", "足音は、ゆっくりだった。ひとり。いや、少し離れて、もうひとり、ふたり。供の者が、いるらしい。", "「何を、している」", "低い声が、背中に降りた。", "ハニヤスは、振り返った。面の奥から、相手を見上げた。", "黒い角を二本、額の脇に戴いた男が、立っていた。まだ若い。けれど、その立ち姿には、周りの空気を変えてしまう重さがあった。魔王。噂だけは、聞いていた。", "「畑を、作っている」", "「畑」", "男は、谷を見回した。草一本ない、赤茶けた斜面を。", "「ここで?」", "「ここで」", "「瘴気が、染みているだろう」", "「ああ。だから、起こしている」", "「起こす」", "「土の底の、重いやつを、少しずつ、押し戻す。時間は、かかる」", "男は、しばらく黙っていた。それから、ゆっくりと、ハニヤスの横に、並んで、しゃがんだ。", "供の者が、慌てたように、一歩、踏み出した。", "「王、お召し物が」", "「いい」", "王は、片手を上げて、制した。それから、土に、指を差し入れた。", "「……冷たい」", "「そうだ」", "「どれほど、かかる」", "「十年。ものによっては、もっと」", "「十年」", "王は、笑った。呆れたようでもあり、楽しそうでもあった。", "「十年も、ひとりで、ここを掘るつもりか」", "「ひとりでは、やらない」", "ハニヤスは、懐の革袋を、取り出した。", "「こいつがいる」", "王は、袋の中の、小さな粒を、見た。", "「それは」", "「籾だ。祖母の形見だ。遠い昔の、人間の国の稲」", "「芽が、出るのか」", "「分からない。出ないかもしれない」", "「出なかったら」", "「また、土を、起こす」", "王は、しばらく、何も言わなかった。", "風が、谷を渡った。赤茶けた斜面を、砂塵が、細く舞い上がった。", "「俺の民は、」", "王が、ぽつりと言った。", "「戦うことしか、知らない者が、多い」", "「ああ」", "「おまえは、違うのか」", "「分からない。ただ、壊す土より、育つ土のほうが、いい。それだけだ」", "王は、もう一度、笑った。今度は、まっすぐな笑い方だった。", "「名は」", "「ハニヤス」", "「埴の安らぎ、か。いい名だ」", "「祖母が、付けた」", "「ハニヤス」", "王は、確かめるように、その名を呼んだ。", "「この谷を、おまえに預けよう。供も、道具も、必要なものは、言え」", "「いらない」", "「いらない?」", "「ひとりで、やる。それが、土への礼儀だ」", "王は、目を丸くした。それから、肩を揺らして、笑った。", "「頑固者だ」", "「それも、祖母に似た」", "王は、立ち上がった。裾に付いた土を、払おうとして、やめた。", "「また、来る」", "「好きにしろ」", "「十年たつ前に、来る」", "その背中が、谷を出ていくのを、ハニヤスは、見送らなかった。", "土に、籾を、ひと粒、置いた。", "掌で、そっと、覆った。", "季節が、ひとつ、変わった。", "谷は、まだ、赤茶けていた。けれど、ある朝、ハニヤスの掘った畝の端に、緑色の、針のようなものが、ひとつ、顔を出していた。", "ハニヤスは、息を止めた。", "小さい。細い。風に、折れそうなほど。", "それでも、それは、確かに、生きていた。", "(出た)", "声には、出さなかった。ただ、面の奥で、唇が、わずかに、震えた。", "そのとき、谷の入口から、足音が、聞こえた。", "早い。一年も、たっていないのに。", "ハニヤスは、顔を上げた。", "王が、供も連れず、ひとりで、立っていた。", "「来たぞ」", "「早い」", "「待ちきれなくてな」", "王は、畝のほうへ、歩いてきた。", "足が、まっすぐ、芽のほうへ、向かっていた。", "「王よ、そこは踏むな」", "ハニヤスの声が、飛んだ。", "王は、片足を上げたまま、固まった。", "地面に、小さな緑が、あった。", "王は、ゆっくり、足を下ろした。ひとつ、横の土に。それから、屈みこんで、その芽を、長いこと、見つめていた。", "「……生えたのか」", "「ああ」", "「これが」", "「これが、最初の一株だ」", "王は、顔を上げた。目が、少しだけ、濡れて見えた。", "「ハニヤス」", "「何だ」", "「この谷を、もう一度、俺に見せてくれ。十年後に」", "「ああ」", "「そのときは、ここが、全部、緑になっているか」", "「なる」", "ハニヤスは、はっきり、言った。", "「俺が、そうする」", "王は、頷いた。", "赤い空の下で、小さな緑が、風に揺れていた。", "それが、のちに、黄泉の民を飢えから救うことになる、畑のはじまりだった。"]}]}, {"id": "plus_mikazuchi", "label": "前日譚", "title": "ミカヅチ　受けきった日", "chars": 1817, "sections": [{"h": null, "p": ["角ヶ原の風は、乾いていた。", "岩肌を削った広い窪地に、鬼族の戦士が、ぐるりと並んでいた。赤銅色の肩が、日に焼けている。誰も口を開かない。腕を組み、足を広げ、ただ、窪地の中央を見ていた。", "そこに、二人の男が立っていた。", "ミカヅチは、金棒を地面に突き立てた。鬼族の頭領になって、五年になる。力で、そこへ上った。この角ヶ原で、自分より強い者に会ったことはなかった。", "向かいに立つ男は、黒い外套を着ていた。額の脇に、黒い角が二本。背には、まだ、翼を畳んでいる。", "「おまえが、新しい王か」", "「そうだ」", "「若いな」", "「そう言われる」", "男は、笑った。ちっとも腹の立たない笑い方だった。それが、ミカヅチには、かえって気に入らなかった。", "「俺たち鬼族は、力に従う。口上は、要らん。拳で、示せ」", "「分かった」", "男は、外套を脱いだ。それを、傍らの若い鬼に、そっと預けた。若い鬼は、慌てて、両手で受け取った。", "「では、先に、おまえの全力を見せてくれ」", "「全力、だと」", "「ああ。そのあとで、俺が一撃だけ打つ。それを、受けてほしい」", "窪地を囲む戦士たちが、ざわめいた。", "鬼族の頭領に、全力で打ち込ませる。それを言った者は、過去に二人いた。二人とも、立ち上がれなかった。", "(命知らずが)", "ミカヅチは、金棒を引き抜いた。", "「後悔するぞ」", "「しない」", "男は、両足を、軽く開いた。それだけで、構えは、終わりだった。", "ミカヅチは、息を吸った。腹の底に、力を溜める。鬼族の力は、怒りの力だ。怒りは、いつでも、胸の奥に溜まっていた。仲間を失った日の怒り。力のない者が踏みにじられるのを見た日の怒り。それを、一息に、腕へ流し込む。", "「――ぬおおおッ！」", "金棒が、唸りを上げた。", "岩が割れるほどの一撃だった。窪地の砂が、輪になって、舞い上がった。", "男は、受け止めた。素手の両腕で。足が、砂の中に、深くめり込んだ。それでも、後ろへ吹き飛ばなかった。", "「……重いな」", "口の端から、血が、一筋、流れていた。", "「これが、鬼の力か」", "ミカヅチは、言葉を失った。それから、もう一度、振りかぶった。三度、四度。全てを、ぶつけた。金棒を握る腕が、痺れて感覚をなくすまで。", "男は、膝をつかなかった。", "最後の一撃を受けとめたあと、男は、静かに、言った。", "「では、俺の番だ」", "窪地の空気が、凍った。", "男の手が、ゆっくりと、持ち上がった。拳だった。ただの拳が、ミカヅチの胸へ、真っ直ぐに、向かってきた。", "衝撃が、体の芯を、貫いた。", "視界が、一瞬、白くなった。足が、地面を離れかけた。膝が、折れようとした。", "(倒れる)", "(倒れるものか)", "奥歯を、噛みしめた。鬼族の頭領が、大勢の前で、膝をつく。それだけは、できなかった。誇りにかけて。", "足を、踏みしめた。砂が、ざざ、と鳴った。", "そして、ミカヅチは、立っていた。", "荒い息の中、顔を上げた。男は、拳を下ろしたところだった。", "「……見事だ」", "静かな声だった。", "「俺の拳を、受けきった者は、おまえが、初めてだ」", "窪地を囲む戦士たちが、割れんばかりの歓声を上げた。", "男は、血に濡れた手を、ゆっくりと、差し出した。", "「ミカヅチ。おまえの誇りを、俺に、貸してくれ」", "ミカヅチは、その手を、見つめた。", "傷だらけだった。それなのに、握られるのを、少しも疑っていない手だった。", "(この男は)", "(倒れなかった俺を、称えた)", "ミカヅチは、金棒を、地に置いた。", "そして、その手を、握った。", "「俺は、おまえに従う」", "声が、思ったより、低く出た。", "「力で、負けたわけではない。だが、おまえの前では、俺の力が、安く見える」", "「安くはない」", "男は、首を振った。", "「俺の腕が、折れかけた」", "ミカヅチは、思わず、笑った。腹の底から、笑いが、湧いてきた。", "笑い声が、窪地に響いた。つられるように、戦士たちが、一人、また一人、笑い始めた。", "その夜、角ヶ原では、祭り酒の樽が、いくつも開いた。", "新しい王は、鬼族の若い者たちに囲まれ、杯を押しつけられていた。顔を赤くして、必死に断ろうとしていた。誰も、聞き入れなかった。", "その様子を、ミカヅチは、少し離れた岩の上から、眺めていた。", "(いい王だ)", "そう、思った。", "自分の強さは、あの王に、認められたのだ。受けきった者に、認められたのだ。そう思うと、胸の奥が、温かくなった。", "その温かさが、長いあいだ、ミカヅチの誇りだった。", "のちに、根の洲の黒い土の上で、あの日が、まったく違う意味を持つことになるとは、まだ、知らなかった。", "あの王が、あの日、拳に込めたのは、受けきれる強さの、ちょうど手前だったのだと。"]}]}, {"id": "plus_susano", "label": "前日譚", "title": "スサノ　手の形", "chars": 2297, "sections": [{"h": null, "p": ["嵐ヶ峰の夜明けは、風の音で始まる。", "スサノは、岩の上に、半身を預けていた。灰色の毛並みが、冷たい風に逆立っている。眼下の斜面では、群れの若い狼たちが、朝の駆けくらべの支度を始めていた。", "「スサノ」", "背後で、年老いた雌の声がした。群れの母だった。", "「おまえに、頼みがある」", "「何だ」", "「あの子を、どうにかしてやってくれ」", "母の視線の先、岩陰の隅に、小さな影が、うずくまっていた。", "生まれて二つほどの子狼だった。灰色の毛はまだ綿のようで、耳だけが、大きく立っている。けれど、その耳は、風の向きを探らなかった。誰かが近づいても、ぴくりとも動かなかった。", "「聞こえんのだ」", "母が、低く言った。", "「呼んでも、振り向かん。吠えても、気づかん。狩りには、連れて行けん。群れの掟は、知っておろう」", "「知っている」", "スサノは、牙の間から、息を吐いた。", "嵐狼の掟は、単純だった。走れぬ者、聞けぬ者、群れの足を引く者は、群れに置かない。それが、冬を越えるための、古い知恵だった。冷たい理屈だが、間違ってはいない。", "(間違ってはいない)", "そう思いながら、スサノの足は、岩陰へ向かっていた。", "子狼は、近づく影に、びくりと身を縮めた。耳が聞こえない代わりに、目と鼻が、鋭いのだった。大きな琥珀色の目が、スサノを見上げた。怯えていた。それでも、逃げなかった。", "「おい」", "スサノは、声をかけた。当然、通じない。子狼は、首を傾げただけだった。", "スサノは、しばらく、困った。", "それから、地面に、腰を下ろした。前足を、そっと、持ち上げた。拳のように握って、また、開いた。手招きの形だった。", "子狼は、目を丸くした。", "それから、ためらいがちに、近づいてきた。小さな鼻が、スサノの前足に触れた。", "「そうだ。それでいい」", "声は、聞こえない。けれど、子狼の尻尾が、ほんの少し、揺れた。", "その日から、スサノは、毎朝、岩陰に通った。", "形を、作った。腹が減ったときは、指を口に当てる。眠いときは、頬に掌を当てる。水は、指先で、波を描く。子狼は、驚くほど、早く覚えた。覚えて、自分でも、形を作り返した。", "(ありがとう)", "小さな掌が、胸の前で、そっと、重ねられた。", "その形を、初めて見たとき、スサノは、不覚にも、鼻の奥が、熱くなった。", "数か月が過ぎた。", "群れの母は、何も言わなかった。ただ、ある朝、スサノの前に、乾いた肉を一切れ、置いた。", "「あの子の分だ」", "「ああ」", "「群れの者には、黙っておく。だが、冬が来る前に、決めなければならん」", "スサノは、頷いた。", "決める、とは、何を決めるのか。群れに残すのか、置いていくのか。群れから出ていくのは、あの子か、それとも自分か。", "答えは、まだ、出ていなかった。", "そんな頃だった。嵐ヶ峰に、客が来たのは。", "尾根の道を、一人の男が、登ってきた。黒髪に、額の脇に黒い角。背に、まだ翼を畳んでいる。供もつけず、荷も持たず、ただ、歩いてきた。", "「何者だ」", "見張りの若い狼が、牙を剥いた。男は、立ち止まった。手を、ゆっくりと、胸の前に上げた。敵意がない、と示す形だった。", "「新しい王だ、と言えば、通してもらえるか」", "「王だと」", "「ああ。嵐狼の群れを、見に来た」", "スサノは、岩の上から、その男を、見下ろしていた。", "(王、か)", "どうせ、また、新しい支配者だ。鬼族の頭領が替わった話は、風の噂で聞いていた。力で従わせる王か。それとも、飾り物か。", "男は、岩の下まで来て、足を止めた。上を見上げて、笑った。", "「おまえが、スサノか」", "「そうだ」", "「群れの長ではないと聞いた。だが、一番、慕われていると」", "「余計な噂だ」", "「そうか」", "男は、辺りを見回した。斜面を駆ける若い狼たち。岩に刻まれた爪の跡。そして、岩陰で、こちらをうかがっている、小さな子狼。", "男の目が、子狼に、とまった。", "子狼が、恐る恐る、手を持ち上げた。拳を握って、開く。手招きの形だった。", "男は、一瞬、目を丸くした。それから、同じ形で、手を、返した。", "(こんにちは)", "子狼の尻尾が、ぱっと、揺れた。", "スサノは、息を、止めた。", "「……知っているのか、その形を」", "「いや」", "男は、振り返った。照れたように、頭を掻いた。", "「見よう見まねだ。嵐狼の子は、よく、手で話すと聞いた」", "「話さない。この子だけだ」", "スサノは、岩から下りた。男の前に、立った。背丈は、ほとんど同じだった。", "「群れは、この子を、置いておけない」", "自分でも、驚くほど、素直に、言葉が出た。", "「冬が来る前に、群れを出る。この子と」", "「そうか」", "男は、頷いた。驚いた顔はしなかった。", "「では、そのための場所が、要るな」", "「何」", "「群れに置けない者の集まる場所が。聞けぬ者、走れぬ者、群れから、はぐれた者。そういう者が、冬を越せる場所だ」", "スサノは、息を呑んだ。", "「そんな場所を、作れるのか」", "「作れる。ただし、一人では、無理だ」", "男は、手を、差し出した。", "「手を、貸してくれ。この嵐ヶ峰の北の谷に、作ろう」", "スサノは、その手を、見つめた。", "握りしめれば、折れそうな、人の形の手だった。それなのに、断られるとは、少しも思っていない手だった。", "(この男は)", "スサノは、牙を、少しだけ、見せた。笑ったつもりだった。", "「約束しろ」", "「何を」", "「あの子が、手の形で、話せる限り、この谷では、誰もあの子を、追い出さん。それが、条件だ」", "「約束する」", "即答だった。", "その日のうちに、スサノは、群れの長に、別れを告げた。群れの母は、岩の上から、静かに見送った。", "北の谷へ向かう道すがら、子狼は、スサノの肩の上で、小さな手を、風に向かって、振っていた。", "(ありがとう)", "その形を、誰に向けたのかは、分からなかった。", "それが、嵐狼の新しい集落の、最初の朝だった。", "のちに、そこで暮らす子らは、皆、手の形で話すことを、覚えた。"]}]}, {"id": "plus_nakime", "label": "前日譚", "title": "ナキメ　底の見えない人", "chars": 1610, "sections": [{"h": null, "p": ["鴉族は、噂を売って生きてきた。", "ナキメは、黄泉の風の中を、翼を広げて、滑っていた。眼下には、赤みを帯びた大地が、静かに広がっている。畑も、川も、焼けた岩場も、すべてが、小さな地図のように、見渡せた。", "背に、鴉族の長老から預かった、薄い巻物を負っていた。新しい王への、挨拶の文だった。", "(新しい王、ね)", "くすり、と笑いが、漏れた。", "鴉族は、どの王にも仕えてきた。仕える、と言っても、従うわけではない。噂を運び、耳を貸し、時に、少しだけ、心に触れる。そうやって、どの王にも、「必要な存在」であり続けてきた。", "鴉の長は、心の術に長けた者が継ぐ。ナキメは、その術で、魔界随一と言われていた。人の心に、そっと、指先を差し入れる。表面の薄い膜を、さらりと撫でる。それだけで、相手が、何を恐れ、何を隠しているか、およそ、読み取れた。", "(王も、同じ)", "どんな王にも、恐れがある。どんな力にも、隠したいものがある。", "それを知っていれば、鴉族は、王の隣で、生き延びられた。", "黄泉津の宮の、広間に通された。", "高い天井。磨かれた石の床。窓の光が、白い筋になって落ちている。奥の席に、黒髪の男が、座っていた。", "若かった。思っていたよりも、ずっと。", "「よく来てくれた。鴉族の長だと聞いた」", "男は、席を立って、迎えた。", "(席を、立った)", "ナキメは、わずかに、目を細めた。長が、使者を、立って迎える。先代の王には、ありえなかった。", "「ナキメと申します。お言葉を、頂戴いたしたく」", "「楽にしてくれ。堅い挨拶は、苦手でな」", "男は、笑った。", "(この笑み)", "ナキメは、心の中で、そっと、指先を伸ばした。", "挨拶のようなものだった。ほんの、表面を撫でるだけ。相手が、緊張しているか、虚勢を張っているか。その、ごく浅い層を。", "(……え)", "指先が、止まった。", "触れる、はずの膜が、なかった。", "虚勢も、緊張も、見栄も、ない。ただ、深い、水面のような静けさが、広がっていた。底が、見えなかった。", "(深い)", "そう思った瞬間、背筋が、ぞくりと、冷えた。", "ナキメは、もう少しだけ、指を、沈めた。ほんのわずかな、好奇心だった。", "そこで、感じた。", "底の見えない水の中に、嘘が、なかった。", "誰もが持っている、小さな偽りも。保身も。誰かをよく見せたい気持ちも。それらが、何ひとつ、なかった。ただ、深く、静かで、そして、とても孤独な何かが、そこにあった。", "(この人は)", "(私に、何も、隠していない)", "隠していないのに、底が、見えない。", "それは、恐ろしいことだった。隠しごとがあるなら、暴けばいい。けれど、隠しごとがない底の深さには、手の出しようがなかった。", "ナキメは、そっと、指を、引いた。", "「ナキメ殿？」", "男が、少し、首を傾げた。", "「……失礼しました」", "ナキメは、深く、頭を下げた。膝が、わずかに、震えていた。", "「少し、風に当たりすぎたようです」", "「そうか。座るといい。茶を、用意させよう」", "男は、自ら、椅子を引いた。", "その手つきが、あまりに、自然で、ナキメは、顔を上げられなかった。", "(この王は)", "(私の術に、気づいたかもしれない)", "気づいて、そのうえで、何も、言わなかった。", "心に触れたことを、咎めもしない。笑って、茶に誘う。", "その夜、ナキメは、鴉族の屋敷に戻ると、長老に、短く、告げた。", "「あの方に、仕えます」", "「ほう。心を、読んだか」", "「読めませんでした」", "「何」", "「読めなかったのです。何も、隠していない人でした」", "長老は、しばらく、黙っていた。それから、静かに、笑った。", "「それは、一番、仕えがいのある王だ」", "「はい」", "ナキメは、窓の外の、赤い空を、見上げた。", "嘘をつかない王には、嘘で仕えることは、できない。", "(私も、嘘は、やめる)", "そう、決めた。", "鴉族の長として、生きてきて、初めて、自分に課した、決まりだった。", "のちに、ベルイザナの前で、膝をつくたび、ナキメは、同じことを思う。", "この方の底は、見えない。けれど、嘘が、ない。", "その矛盾が、体を、震わせる。それが、ナキメが、この王を、信じる理由だった。"]}]}, {"id": "plus_omoika", "label": "前日譚", "title": "オモイカ　十四の名", "chars": 1539, "sections": [{"h": null, "p": ["会談の前の夜、オモイカは、灯りを一つだけ点けて、机に向かっていた。", "机の上には、白い紙が、一枚。細く削った筆が、その横に置いてある。随員の名簿だった。", "(十四人)", "和平の席に連れていく数としては、多い。人間側からは、「十人まで」と、内々に知らされていた。それを、四人、押し通した。", "「多すぎます。向こうに、警戒されます」", "そう言ったのは、ミカヅチだった。", "「少なすぎれば、もっと警戒される。魔界の者が、人間を恐れている、と思われる」", "「だが、数が多ければ、人間は、軍勢だと思う」", "「だから、荷物と楽器を、持たせる」", "オモイカは、淡々と答えた。", "「武器を持った者は、数えない。私の随員は、旅の一座だ」", "ミカヅチは、鼻を鳴らした。それから、頷いた。反対ではなかった。心配なだけだった。それが、分かった。", "筆を、取った。", "最初の名を、書こうとして、手が、止まった。", "(ササラ)", "嵐狼の若者だった。笛吹きだ。腕は、お世辞にも、上手くない。音が外れる。拍がずれる。", "けれど、道中、あの笛があると、誰かが、必ず、笑った。笑えば、肩の力が、抜ける。肩の力が抜けた者は、疲れにくい。", "(外せない)", "そう、思った。", "筆を、動かした。", "『ササラ』", "次に、浮かんだのは、老いた鬼の顔だった。", "(フミト)", "巻物を、いつも、胸に抱えて歩く書記だ。腰が曲がっているのに、足だけは、速い。口が、少し悪い。", "「参謀殿、顔が怖いですぞ」", "何度、言われただろう。言われるたび、頬が緩んだ。", "『フミト』", "三人目を、書いた。", "『ツバメ』", "鴉族の、若い娘だった。荷を担ぐのが、好きなのだと言う。担げる限り、いつも、一番多く担ぐ。", "「故郷の畑に、いつか、帰るんです」", "誰かに、そう話していたのを、聞いたことがある。小さな畑だと言っていた。大きくは、ならなくていい、と。", "(帰してやる)", "その一行を、オモイカは、紙に、書かなかった。ただ、胸の中で、そっと、確かめた。", "名を、一つずつ、書いていった。", "トウゴ。セナ。アオイ。シノ。", "鬼の荷車引きがいた。笛の弟子の少年がいた。土蜘蛛の料理番がいた。鴉の伝令見習いがいた。皆、顔が、鮮明に、浮かんだ。", "好きな食べ物も、知っていた。故郷の畑の広さも、家族の数も、癖も。", "(全員、覚えている)", "それが、参謀の仕事だ、と、先代の頃から、思ってきた。力で押さえつける統治は、いつか折れる。折れないためには、一人ひとりを、知っていなければならない。", "十四の名が、紙の上に、並んだ。", "筆を、置いた。", "窓の外で、風が、鳴った。遠くから、笛の音が、ひとつ、聞こえた。外れていた。", "(……ササラだ)", "小さく、笑いが、漏れた。", "窓を、少しだけ、開けた。夜気が、頬を撫でた。庭の隅で、随員たちが、車座になって、荷の確認をしているのが、見えた。誰かが、冗談を言って、誰かが、笑った。", "その輪の中に、ササラが、いた。笛を、膝の上で、くるくると、回していた。", "「ほら、もう一回、合わせるぞ」", "「やめろ。耳が、腐る」", "「ひでえな」", "笑い声が、夜に、広がった。", "オモイカは、その様子を、じっと、見ていた。", "胸の奥で、小さな棘が、疼いた。人間の王から届いた書簡の、整いすぎた文面。誠実すぎる言葉の順序。", "(嘘を知っている者の、書いた文だ)", "その確信は、消えていなかった。", "けれど、もう、決めたことだった。王が、望んだ和平だ。", "(もし、何かが起きるなら)", "その時は、自分が、盾になる。", "この十四人を、無事に、連れて帰る。笛が外れていても、荷が重くても、巻物が曲がっていても。全員を、必ず。", "紙を、手に取った。", "十四の名を、もう一度、目でなぞった。それから、折りたたんで、懐の奥に、しまった。", "灯りを、消した。", "闇の中で、遠くの笛が、また、外れた。", "オモイカは、目を閉じて、その音を、胸に刻んだ。", "あれが、十四人の名を、記した、最後の夜になった。"]}]}, {"id": "plus_amatsu", "label": "前日譚", "title": "アマツ王　穏やかな始まり", "chars": 1475, "sections": [{"h": null, "p": ["その村には、名前が多すぎた。", "若いアマツは、焼け残った家の戸口に、座っていた。まだ、王ではなかった。白い衣の裾が、泥で汚れていた。誰かが、彼を、旅の学僧だと言った。", "村は、二つの氏族の、境にあった。何代も、争ってきた。昨日は、赤い印の者が、青い印の者の畑を焼いた。三日前には、逆だった。そのたびに、死者が出た。死者の名は、墓に刻まれ、刻まれた名は、次の復讐の、理由になった。", "「あんたは、物知りなのかい」", "隣の家の老女が、声をかけてきた。膝の上に、小さな布の包みを、抱えていた。", "「少しは」", "「教えておくれ。どうしたら、この村の争いは、終わるんだい」", "アマツは、少し、考えた。", "「誰も、悪くない、と思えれば、終わります」", "「そんなこと、できるもんかね」", "老女は、笑った。乾いた、寂しい笑い方だった。", "「息子は、赤い印の者に、殺された。孫は、青い印の者に、連れていかれた。悪い奴らがいる。名前も、顔も、覚えてる。忘れるもんか」", "包みを、抱く腕に、力が入った。", "その夜、アマツは、眠れなかった。老女の言葉が、頭から、離れなかった。", "(名前も、顔も、覚えてる)", "それが、争いを続ける力だった。名は、記憶を呼び、記憶は、憎しみを呼ぶ。", "(名が、なければ)", "その考えは、ごく自然に、浮かんだ。名のない死者は、復讐の理由に、ならない。名のない敵は、憎む相手として、立たない。", "彼は、立ち上がった。", "言霊の術に、心得があった。名を呼べば、人を縛ることもできる。ならば、逆に、名を、緩めることもできるはずだ。", "その夜のうちに、彼は、老女の家の戸を、叩いた。", "「眠れませんか」", "「ああ。息子の夢を、見てね」", "「痛みを、少し、軽くしましょう」", "優しい声だった。老女は、頷いた。", "アマツは、掌を、老女の額に、そっと、置いた。", "「息子さんの名は」", "「ヤスケだよ」", "「その名を、もう一度、呼んでみてください」", "「ヤスケ」", "老女は、目を閉じた。涙が、頬を伝った。", "アマツは、小さく、言霊を、紡いだ。", "(静かに、ほどけてください)", "老女の涙が、ふっと、止まった。", "しばらくして、老女は、目を開けた。穏やかな顔だった。", "「……あれ。私は、何を、話していたんだったかね」", "「眠れない夜の、お話です」", "「そうかい。もう、眠れそうだよ」", "老女は、微笑んだ。この数か月で、初めての、安らかな笑みだった。", "アマツは、その顔を、じっと見つめた。", "胸の中に、静かな、温かいものが、広がった。", "(救えた)", "心から、そう思った。", "憎しみは、記憶に、宿る。記憶から、名を、解いてやれば、苦しみは、軽くなる。誰も、傷つかない。誰も、恨まない。", "それは、とても、優しい術だった。", "翌日、彼は、村中を、回った。一人ずつ、戸を叩き、掌を、額に置いた。誰もが、穏やかになった。争いの話をする者は、いなくなった。", "三日後、村の境の柵が、取り払われた。赤い印も、青い印も、いつの間にか、色褪せていた。", "村人たちは、アマツを、救い主と呼んだ。", "アマツは、その言葉に、微笑み返した。", "穏やかな、柔らかな、誰にでも、安心を与える微笑みだった。", "その微笑みが、いつからか、顔にだけ張りついていることに、彼は、気づかなかった。", "名を失った村人たちの目から、何かが、少しずつ、薄れていくことにも。", "誰も、泣かなくなった。誰も、笑わなくなった。ただ、穏やかに、同じ方向を向いて、暮らしていた。", "(これで、いい)", "アマツは、そう思った。", "争いのない村を、後にして、次の村へ、向かった。", "その背に、老女の、小さな声が、届いた気がした。", "「……誰だったかね。私の、大事な、誰かが」", "アマツは、振り返らなかった。", "微笑みだけが、風の中に、取り残されていた。"]}]}]}], "tracks": [["ch01", "ch02", "ch03", "ch04", "ch05", "ch06", "ch07", "ch08", "ch09", "ch10", "ch11", "ch12", "epilogue"], ["ch01_5", "ch02_5", "ch03_5", "ch04_5", "ch05_5", "ch06_5", "ch07_5", "ch08_5", "ch11_5", "ch12_5"], ["bangai1", "bangai2", "bangai3", "bangai4", "bangai5", "bangai6"], ["meishi_isana", "meishi_asagi", "meishi_tomari", "meishi_nogiku", "meishi_fuki", "meishi_tane", "meishi_tsuyukusa", "meishi_shii", "meishi_yuzuriha", "meishi_hagane", "meishi_sumi", "meishi_tatara", "meishi_susuki", "meishi_nazuna", "meishi_kuzuha", "meishi_shiroe", "meishi_mikage", "meishi_uta", "meishi_akane", "meishi_kuroha", "meishi_yamabuki", "meishi_utsuho", "meishi_yomiji", "meishi_homura"], ["plus_ch01", "plus_ch02", "plus_ch03", "plus_ch04", "plus_ch06", "plus_ch09", "plus_ch11", "plus_haniyasu", "plus_mikazuchi", "plus_susano", "plus_nakime", "plus_omoika", "plus_amatsu"]]}</script>

  function applyPrefs() {
    root.style.setProperty('--fs', SIZES[P.size] + 'rem');
    if (P.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', P.theme);
    document.body.classList.toggle('v', !!(P.vertical && current));
  }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function mins(n) { return Math.max(1, Math.round(n / 500)); }
  function kana(n) { return n >= 10000 ? (n / 10000).toFixed(1) + '万字' : Math.round(n / 100) / 10 + '千字'; }

  var current = null, scroller = null, onScroll = null;

  // ---- 一覧 ----
  function home() {
    current = null; scroller = null; document.body.classList.remove('v'); window.removeEventListener('scroll', onScroll || function () {});
    document.title = '魔王が仲間になりたそうな顔でこちらを見ている';
    app.innerHTML = '';
    var total = 0, count = 0; D.groups.forEach(function (g) { g.items.forEach(function (c) { total += c.chars; count++; }); });
    var w = el('div', 'wrap');
    var cover = el('header', 'cover');
    cover.appendChild(el('h1', '', '魔王が仲間になりたそうな顔でこちらを見ている'));
    var side = el('div', 'side');
    side.appendChild(el('p', 'lead', '本編のほか、章のあいだの寄り道、四天王編、番外編、名の欠片の二十四人の短編までを収めた小説です。'));
    side.appendChild(el('ul', 'facts', '<li><b>' + count + '</b> 編</li><li>約 <b>' + (total / 10000).toFixed(1) + '万</b> 字</li><li>通しで約 <b>' + Math.round(total / 500 / 60) + '</b> 時間</li>'));
    var st = el('div', 'start');
    st.appendChild(Object.assign(el('a', 'btn', '第一章から読む'), { href: '#ch01' }));
    if (P.last && CH[P.last]) st.appendChild(Object.assign(el('a', 'btn ghost', 'つづきから：' + CH[P.last].label), { href: '#' + P.last }));
    side.appendChild(st);
    cover.appendChild(side); w.appendChild(cover);
    D.groups.forEach(function (g) {
      var sec = el('section', 'group');
      sec.appendChild(el('h2', '', esc(g.name)));
      if (g.note) sec.appendChild(el('p', '', esc(g.note)));
      var ul = el('ul', 'list');
      g.items.forEach(function (c) {
        var li = el('li', 'item' + (P.read[c.id] ? ' done' : ''));
        var a = el('a', '', '<span class="n">' + esc(c.label) + '</span><span class="t">' + esc(c.title) + '</span><span class="m">' + kana(c.chars) + ' · ' + mins(c.chars) + '分</span>');
        a.href = '#' + c.id; li.appendChild(a); ul.appendChild(li);
      });
      sec.appendChild(ul); w.appendChild(sec);
    });
    w.appendChild(el('footer', 'site', '文章の端末内の記録（読んだ印・文字の大きさ・縦書き）は、このブラウザにだけ残ります。'));
    app.appendChild(w); window.scrollTo(0, 0);
  }

  // ---- 読む画面 ----
  function track(id) {
    var g = D.groups.filter(function (g) { return g.items.some(function (c) { return c.id === id; }); })[0];
    return D.tracks.filter(function (t) { return t.indexOf(id) >= 0; })[0] || g.items.map(function (c) { return c.id; });
  }
  function read(id) {
    var c = CH[id]; current = id;
    document.title = c.label + ' ' + c.title + '｜魔王が仲間になりたそうな顔でこちらを見ている';
    app.innerHTML = '';
    var tr = track(id), i = tr.indexOf(id);
    var bar = el('div', 'bar'), bi = el('div', 'in wrap');
    var back = Object.assign(el('a', 'ib', '一覧'), { href: '#' }); bi.appendChild(back);
    bi.appendChild(el('div', 'ttl', '<i>' + esc(c.label) + '</i>' + esc(c.title)));
    var set = el('button', 'ib', '文字'); set.setAttribute('aria-expanded', 'false'); set.id = 'set'; bi.appendChild(set);
    bar.appendChild(bi);
    var panel = el('div', 'panel'); panel.hidden = true;
    function seg(label, opts, get, put) {
      var row = el('div', 'row'); row.appendChild(el('span', '', label));
      var s = el('div', 'seg');
      opts.forEach(function (o) {
        var b = el('button', '', o[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(get() === o[0]));
        b.onclick = function () { var r = ratio(); put(o[0]); save(); applyPrefs(); read(id); restore(r); panel.hidden = false; document.getElementById('set').setAttribute('aria-expanded', 'true'); };
        s.appendChild(b);
      });
      row.appendChild(s); panel.appendChild(row);
    }
    seg('大きさ', [[0, '小'], [1, '中'], [2, '大']], function () { return P.size; }, function (v) { P.size = v; });
    seg('向き', [[false, '横書き'], [true, '縦書き']], function () { return P.vertical; }, function (v) { P.vertical = v; });
    seg('配色', [['auto', '自動'], ['light', '明'], ['dark', '暗']], function () { return P.theme; }, function (v) { P.theme = v; });
    bar.appendChild(panel);
    set.onclick = function () { panel.hidden = !panel.hidden; set.setAttribute('aria-expanded', String(!panel.hidden)); };

    var story = el('article', 'story' + (P.vertical ? '' : ' wrap'));
    var head = el('div', 'head', '<div class="lab">' + esc(c.label) + '</div><h1>' + esc(c.title) + '</h1>');
    story.appendChild(head);
    c.sections.forEach(function (s) {
      if (s.h) story.appendChild(el('div', 'sec', esc(s.h)));
      s.p.forEach(function (t) { story.appendChild(el('p', t.charAt(0) === '「' || t.charAt(0) === '（' ? 'q' : '', esc(t))); });
    });
    story.appendChild(el('div', 'end', '了'));

    var prog = el('div', 'prog', '<i></i>');
    var foot = el('div', 'foot'), fi = el('div', 'in wrap');
    var prev = el('button', 'ib', '← ' + (i > 0 ? esc(CH[tr[i - 1]].label) : '前')); prev.disabled = i <= 0;
    var next = el('button', 'ib', (i < tr.length - 1 ? esc(CH[tr[i + 1]].label) : '次') + ' →'); next.disabled = i >= tr.length - 1;
    prev.onclick = function () { location.hash = '#' + tr[i - 1]; };
    next.onclick = function () { location.hash = '#' + tr[i + 1]; };
    var pg = el('span', 'pg', ''); pg.id = 'pg';
    fi.appendChild(prev); fi.appendChild(pg); fi.appendChild(next); foot.appendChild(fi);
    app.appendChild(bar); app.appendChild(story); app.appendChild(prog); app.appendChild(foot);
    applyPrefs();

    scroller = P.vertical ? story : null;
    function bounds() { var s = scroller || document.scrollingElement; return P.vertical ? s.scrollWidth - s.clientWidth : s.scrollHeight - s.clientHeight; }
    function pos() { var s = scroller || document.scrollingElement; return P.vertical ? Math.abs(s.scrollLeft) : s.scrollTop; }
    window.ratio = ratio;
    function ratio() { var b = bounds(); return b > 0 ? Math.min(1, pos() / b) : 0; }
    function show() {
      var r = ratio(); prog.firstChild.style.width = (r * 100) + '%';
      pg.textContent = Math.round(r * 100) + '%　約' + mins(c.chars) + '分';
      P.pos[id] = r; P.last = id; if (r > 0.97) P.read[id] = true; save();
    }
    window.removeEventListener('scroll', onScroll || function () {});
    onScroll = show;
    (P.vertical ? story : window).addEventListener('scroll', onScroll, { passive: true });
    if (P.vertical) {
      story.addEventListener('wheel', function (e) { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { story.scrollLeft -= e.deltaY; e.preventDefault(); } }, { passive: false });
    }
    window.restore = restore;
    function restore(r) {
      var b = bounds(); var v = Math.max(0, Math.min(1, r || 0)) * b;
      if (P.vertical) story.scrollLeft = -v; else window.scrollTo(0, v);
      show();
    }
    var saved = P.pos[id] || 0; if (saved > 0.97) saved = 0;
    requestAnimationFrame(function () { restore(saved); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { restore(P.pos[id] || 0); });
  }
  function ratio() { return window.ratio ? window.ratio() : 0; }
  function restore(r) { if (window.restore) window.restore(r); }

  document.addEventListener('keydown', function (e) {
    if (!current || !P.vertical || !scroller) return;
    var step = scroller.clientWidth * 0.9;
    if (e.key === 'ArrowLeft') { scroller.scrollLeft -= step; e.preventDefault(); }
    if (e.key === 'ArrowRight') { scroller.scrollLeft += step; e.preventDefault(); }
  });

  function route() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (CH[id]) read(id); else home();
    applyPrefs();
  }
  window.addEventListener('hashchange', route);
  applyPrefs(); route();
})();
</script>
